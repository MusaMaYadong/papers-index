>数据来源</strong>: OptionMetrics IvyDB（IV 曲面插值数据）、CRSP（股票收益）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[OptionMetrics IV 曲面&lt;br/&gt;每日 δ×τ 网格 10×18] --&gt; B[预处理&lt;br/&gt;δ∈[-0.5,0.5], τ&gt;10天&lt;br/&gt;ATM 重排]\n  B --&gt; C[每月末截面 IV 图像&lt;br/&gt;尺寸 10×18]\n  C --&gt; D[CNN 编码器&lt;br/&gt;1-5 层卷积层&lt;br/&gt;局部特征提取]\n  D --&gt; E[全连接层 → 预测 r_i,t+1]\n  E --&gt; F[MSE 损失 + 梯度下降]\n  F --&gt; G1[单个 CNN 模型&lt;br/&gt;月度预测信号]\n\n  G1 --&gt; H[Ensemble: N=100 独立初始化]\n  H --&gt; I[平均预测信号 → 组合排序]\n  I --&gt; J1[多空组合: 月 Sharpe 2.7]\n  I --&gt; J2[Alpha vs 标准因子+期权因子]\n\n  G1 --&gt; K[主线性特征分析&lt;br/&gt;Constantine 2014 方法]\n  K --&gt; L[需要 100+ 线性特征&lt;br/&gt;才近似 CNN → 特征复杂性]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>数据预处理</strong>：OptionMetrics IV 曲面在 $\\delta \\in [-0.5, 0.5]$（剔除深度实值看涨期权），$\\tau &gt; 10$ 天（剔除周期权数据缺失），ATM 处重排使 put/call 平滑过渡，得到每只股票每月 $10 \\times 18 = 180$ 像素的标准化 IV 图像。</p>\n<p>2. <strong>CNN 架构</strong>：卷积神经网络从 IV 曲面的局部邻域中学习非线性变换（filters）。核心设计选择是<strong>局部性</strong>——CNN 的卷积核只能看到邻近的 $(\\delta, \\tau)$ 点，这与期权定价理论中局部特征（Dupire、Breeden-Litzenberger）的理念一致。尝试 1–5 层不同深度。</p>\n<p>3. <strong>Ensemble</strong>：由于非凸优化存在多个局部最优解，不同随机初始化产生预测相关性低的模型。将 $N$ 个独立训练的 CNN 预测等权平均：</p>\n<p>   $$\\hat{r}_{i,t+1} = \\frac{1}{N} \\sum_{n=1}^{N} f_{\\theta_n}(IV_{i,t})$$</p>\n<p>   随 ensemble size 增大，out-of-sample Sharpe 从单模型 0.9 提升到 100 集成 2.7（5 层 CNN）。</p>\n<p>4. <strong>主线性特征（Principal Linear Features）</strong>：用 Constantine et al. (2014) 的 active subspace 方法，寻找 CNN 非线性函数 $f(IV)$ 在输入空间中梯度最大的线性方向——即最能解释模型预测变异的线性 IV 组合。发现需要 &gt;100 个主线性特征才能近似 CNN 预测，证明 <strong>feature complexity</strong>（信息分布在大量线性特征中，无法低维概括）。</p>\n<p>5. <strong>交易成本分析</strong>：策略月换手率约 80%，多空组合收益主要来自多头端（long leg），对做空约束不敏感。非微盘股（排除最小市值五分位）也保持显著 alpha 和 Sharpe。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>Sharpe 比</strong>：5 层 CNN × 100 ensemble，多空组合月 Sharpe 达 <strong>2.7</strong>（全样本）。相比之下，已有最优期权因子 Sharpe 约 1.0–1.2。</li>\n<li><strong>Alpha</strong>：相对 FF5 + 动量 + 短期反转 + 现有期权因子（Bali et al. 2022 的 5 个因子 + Neuhierl et al. 2022 的 17 个因子），CNN 信号的 alpha 仍高度显著。</li>\n<li><strong>Ensemble 效应</strong>：4–5 层 CNN 从 N=1 到 N=100，Sharpe 提升 0.9→2.7（提升 ~200%）；1 层 CNN 仅从 0.8→1.6。深度越深，ensemble 增益越大——反映了复杂模型在低信噪比环境中的预测不确定性更高。</li>\n<li><strong>特征复杂性</strong>：需要 100+ 个主线性特征才能恢复 CNN 预测的 $R^2$ &gt; 95%，说明 IV 曲面中与收益相关的信息不集中在少数几个&quot;正确&quot;的特征上（如 smirk、slope）。</li>\n<li><strong>交易成本后</strong>：考虑 bid-ask spread 后，非微盘组 alpha 仍显著。多头端贡献了大部分收益，做空端收益较低，策略对做空限制不敏感。</li>\n<li><strong>样本量</strong>：期权可交易股票数量从 1996 年的 ~2000 只增长到 2021 年 ~4500 只，平均超 3000 只。</li>\n</ul>\n<h2>创新点</h2>\n<p>1. <strong>首次将 CNN 直接应用于原始 IV 曲面</strong>（而非人工构造的期权因子），实现端到端的预测信号学习。</p>\n<p>2. <strong>提出&quot;主线性特征&quot;（PLF）</strong> 作为非线性 ML 模型的 PCA 等价物，用于诊断特征复杂度和可解释性。</p>\n<p>3. <strong>证明 feature complexity</strong>——挑战了&quot;少数几个期权特征（smirk、skew）可以概括 IV 曲面信息&quot;的传统认知，与 Kelly et al. (2021) 和 Didisheim et al. (2023) 的&quot;复杂性美德&quot;理论一致。</p>\n<p>4. <strong>大规模 Ensemble 在金融 ML 中的成功应用</strong>，展示 ensemble size 是提升预测性能的关键超参数。</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>黑箱可解释性</strong>：CNN 的预测逻辑难以直接映射到经济机制（风险溢价？行为偏差？），作者也承认这是未来方向。</li>\n<li><strong>换手率高</strong>：月换手率 ~80%，即使考虑交易成本后 alpha 仍显著，但实际执行中容量和 slippage 可能比 paper 估计的更严重。</li>\n<li><strong>OptionMetrics 数据质量</strong>：IV 曲面是 OptionMetrics 的<strong>插值</strong>数据（非原始报价），kernel smoothing 算法可能引入人为平滑和前期偏差。</li>\n<li><strong>数据周期有限</strong>：1996–2021，仅 25 年。相比股票因子研究（40–60 年），样本较短。</li>\n<li><strong>超参数选择</strong>：CNN 层数、filter size、ensemble size 等选择无理论指导，可能过拟合于特定时期。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: ★★★☆☆ OptionMetrics 需付费（WRDS），且 IV 曲面数据（IvyDB Volatility Surface）是额外模块。</li>\n<li><strong>方法清晰度</strong>: ★★★★☆ 架构描述清晰，但具体训练细节（学习率、batch size、validation split）需参考代码。</li>\n<li><strong>计算成本</strong>: ★★★★☆ 需要 GPU 训练 100 个 CNN × 多组超参数，但单个模型规模不大（输入仅 10×18，非典型大图像），瑞士超算中心（CSCS）提供了算力。</li>\n<li><strong>综合评分</strong>: ★4.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>高优先级复现。这是连接 DL 和期权隐含信息的顶级研究，来自顶级作者群。复现策略：（1）A 股期权市场起步晚、品种少（仅 50ETF/300ETF 等指数期权），个股期权缺失——可先在 50ETF 期权 IV 曲面上测试 CNN 对 ETF 走势的预测力；（2）替代路线：用美国市场 OptionMetrics 子样本复现核心 pipeline（CNN → ensemble → portfolio sort），验证方法论；（3）注意 GPU 需求——建议用 PyTorch + 单 GPU 先复现 1 层 CNN 单模型，再逐步扩展深度和 ensemble。</p>"}, {"key": "LIMNRGR6", "title": "Trading with the Momentum Transformer: An Intelligent and Interpretable Architecture", "year": "2022", "authors": "Kieran Wood, Sven Giegerich, Stephen Roberts…", "tags": ["Quantitative Finance - Trading and Market Microstructure", "Computer Science - Machine Learning", "Statistics - Machine Learning"], "venue": "", "abstract": "We introduce the Momentum Transformer, an attention-based deep-learning architecture, which outperforms benchmark time-series momentum and mean-reversion trading strategies. Unlike state-of-the-art Long Short-Term Memory (LSTM) architectures, which are sequential in nature and tailored to local processing, an attention mechanism provides our architecture with a direct connection to all previous time-steps. Our architecture, an attention-LSTM hybrid, enables us to learn longer-term dependencies, improves performance when considering returns net of transaction costs and naturally adapts to new market regimes, such as during the SARS-CoV-2 crisis. Via the introduction of multiple attention heads, we can capture concurrent regimes, or temporal dynamics, which are occurring at different timescales. The Momentum Transformer is inherently interpretable, providing us with greater insights into our deep-learning momentum trading strategy, including the importance of different factors over time and the past time-steps which are of the greatest significance to the model.", "url": "http://arxiv.org/abs/2112.08534", "date_added": "2026-05-25", "summarized": true, "rating": "★4.5", "starred": false, "repro": "复现中", "summary_html": "<h1>Trading with the Momentum Transformer: An Intelligent and Interpretable Architecture</h1>\n<p>&gt; Zotero Key: <code>LIMNRGR6</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Kieran Wood, Sven Giegerich, Stephen Roberts, Stefan Zohren</li>\n<li><strong>年份</strong>: 2022</li>\n<li><strong>出处</strong>: arXiv:2112.08534（Oxford-Man Institute of Quantitative Finance, University of Oxford）</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2112.08534</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2112.08534</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/GKXP8TJC/Wood 等 - 2022 - Trading with the Momentum Transformer An Intelligent and Interpretable Architecture.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：基于 LSTM 的深度动量网络偏向局部模式、难学长期依赖，且在制度突变（如 2020 新冠崩盘）时因&quot;遗忘&quot;机制无法借鉴历史相似制度、表现骤降。</li>\n<li><strong>方法</strong>：Momentum Transformer——attention-LSTM 混合的 Decoder-Only Temporal Fusion Transformer（VSN→LSTM→可解释多头注意力→FFN-tanh），注意力直连所有历史时步、多头并发捕捉不同时间尺度制度，直接以负 Sharpe 为损失 + 换手正则端到端学仓位。</li>\n<li><strong>结论</strong>：1995–2020 期货组合 Sharpe 2.62（含 CPD）、Calmar 3.22，较 LSTM 提升 50%（2015–2020 提升 109%）；新冠期注意力架构稳健（Sharpe 2.47–3.38）而 LSTM 暴跌至 -1.50；扣 3bps 成本降幅仅约 106%（LSTM 达 228%），并具 VSN/注意力可解释性。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>Deep Momentum Networks（DMN，基于 LSTM）能直接优化 Sharpe 学习趋势与仓位，但 LSTM 是序列结构、偏向局部模式，存在两个缺陷：(1) 难学长期依赖；(2) 在制度突变（如 2020 新冠崩盘）时因&quot;遗忘&quot;机制无法借鉴历史相似制度，表现骤降。此前用变点检测（CPD）模块缓解，但 CPD 只用局部信息、对快速均值回归过度反应、扣成本后表现差。本文引入注意力机制：直连所有历史时步，多注意力头并发捕捉不同时间尺度的制度，从而同时学短期与长期依赖，并天然适应新制度。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 50 个流动性最高的连续期货合约，含商品（CM）、股指（EQ）、固收（FI）、外汇（FX）四大类</li>\n<li><strong>频率</strong>: 日频，使用收益（线性去趋势价格）</li>\n<li><strong>样本区间</strong>: 1990–2020，扩展窗口（expanding window）：初始 1990–1995 训练验证，样本外测试 1995–2000，逐 5 年滚动扩展</li>\n<li><strong>数据来源</strong>: Pinnacle Data Corp CLC Database（后向比例调整的连续合约）</li>\n<li><strong>测试场景</strong>: ① 1995–2020 全期均值；② 2015–2020 近期高非平稳期；③ SARS-CoV-2 危机（2020.1–2020.10）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart LR\n  subgraph 输入特征\n    direction TB\n    A[多尺度收益\\n日/月/季/半年/年] --&gt; P[波动率缩放\\n目标15%年化]\n    B[MACD指标\\n多组S/L] --&gt; P\n    C[CPD变点特征\\n窗口21/126] --&gt; P\n  end\n  subgraph TFT编码\n    direction TB\n    D[变量选择网络 VSN\\n可学习权重·可解释]\n    E[LSTM层\\n局部时序编码]\n    D --&gt; E\n  end\n  subgraph 注意力\n    direction TB\n    F[掩码可解释\\n多头注意力 MIMHA]\n    G[FFN + tanh]\n    F --&gt; G\n  end\n  subgraph 输出\n    direction TB\n    H[仓位 z∈-1,1]\n    I((负Sharpe损失\\n+换手正则))\n    H --&gt; I\n  end\n  输入特征 --&gt; TFT编码 --&gt; 注意力 --&gt; 输出\n  I -.-&gt;|反向传播| F</div>\n<h3>步骤详解</h3>\n<p>整体架构为 Decoder-Only Temporal Fusion Transformer，是 DMN 框架的一个子类，形式化为 $\\text{TFT}(\\tilde{X}) = (\\text{FFN} \\circ \\text{MIMHA} \\circ \\text{LSTM} \\circ \\text{VSN})(\\tilde{X})$。</p>\n<p>1. <strong>输入特征</strong>：均为价格衍生信号——多时间尺度收益 $\\hat{r}^{(i)}_{(\\cdot)}$（日/月/季/半年/年，各按事前波动率归一）、MACD 指标 $\\text{M}^{(i)}_t(S,L)$（多组短长周期），以及可选的变点检测（CPD）特征：变点严重度 $\\nu^{(i)}_t(l)$ 与位置 $\\gamma^{(i)}_t(l)$，在回看窗口 $l \\in \\{21, 126\\}$（一个月 + 半年）两个尺度上计算。</p>\n<p>2. <strong>波动率缩放</strong>：每个资产收益按 60 日指数加权波动率 $\\sigma^{(i)}_t$ 缩放，目标年化波动 $\\sigma_{\\text{tgt}}=15\\%$，确保各资产对组合贡献相近、近似平稳并提供杠杆。组合实现收益 $R^{\\text{TSMOM}}_{t+1} = \\frac{1}{N}\\sum_i z^{(i)}_t \\frac{\\sigma_{\\text{tgt}}}{\\sigma^{(i)}_t} r^{(i)}_{t+1}$。</p>\n<p>3. <strong>变量选择网络（VSN）</strong>：对各协变量嵌入赋可学习权重 $\\eta(\\cdot)\\in[0,1]$（softmax 归一），过滤低信噪比输入；权重即变量重要度，提供可解释性——$x_t = \\sum_j \\eta(\\tilde{x}_{t,j})\\psi_j(\\tilde{x}_{t,j})$。</p>\n<p>4. <strong>LSTM 编码层</strong>：替代 Transformer 的位置编码，对序列做局部时序编码，输出隐表示。</p>\n<p>5. <strong>掩码可解释多头注意力（MIMHA）</strong>：核心模块，$H$ 个注意力头跨所有历史时步计算 $\\text{MHA}(x_t)=\\sum_{i=1}^H (W_{O,i})^\\top \\sum_{\\tau=1}^T s_{t,\\tau}\\,\\alpha_i(x_t,x_\\tau)\\,W_{v,i}x_\\tau$；用掩码 $s_{t,\\tau}\\in\\{0,1\\}$（$\\tau&gt;t$ 置 0）防止未来信息泄漏。各头共享 value 权重（$W_{v,i}=\\frac{1}{h}W_v$）以提升注意力模式可解释性；多头并发捕捉不同时间尺度的并存制度。</p>\n<p>6. <strong>输出层</strong>：FFN + tanh 激活，输出每个资产每个时步的仓位 $z^{(i)}_t \\in (-1,1)$（+1 满仓多、-1 满仓空），即 $Z^{(i)}_{T-\\tau+1:T} = (\\tanh \\circ f \\circ g)(U^{(i)}_{T-\\tau+1:T})$。</p>\n<p>7. <strong>训练目标</strong>：直接最小化负 Sharpe $\\mathcal{L}_{\\text{sharpe}} = -\\frac{\\sqrt{252}\\,\\mathbb{E}_\\Omega[R^{(i)}_t]}{\\sqrt{\\text{Var}_\\Omega[R^{(i)}_t]}}$，序列长度 $\\tau=252$（一个交易年），mini-batch SGD 优化。</p>\n<p>8. <strong>交易成本处理</strong>：在损失中加入换手正则项，扣成本收益 $\\bar{R}^{(i)}_{t+1} = R^{(i)}_{t+1} - C\\sigma_{\\text{tgt}}\\left|\\frac{X^{(i)}_t}{\\sigma^{(i)}_t} - \\frac{X^{(i)}_{t-1}}{\\sigma^{(i)}_{t-1}}\\right|$，使模型在给定成本 $C$ 下优化净收益。</p>\n<h2>核心结论与关键结果</h2>\n<p><strong>1995–2020 全期表现（Sharpe）：</strong></p>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>策略</th><th>年化收益</th><th>Sharpe</th><th>MDD</th><th>Calmar</th></tr>\n<tr><td>Long-Only</td><td>2.45%</td><td>0.51</td><td>12.51%</td><td>0.21</td></tr>\n<tr><td>TSMOM</td><td>4.43%</td><td>1.03</td><td>6.34%</td><td>0.94</td></tr>\n<tr><td>LSTM (DMN)</td><td>2.71%</td><td>1.70</td><td>2.14%</td><td>1.68</td></tr>\n<tr><td>Decoder-Only TFT</td><td>4.01%</td><td>2.54</td><td>1.32%</td><td>3.22</td></tr>\n<tr><td><strong>Decoder-Only TFT + CPD</strong></td><td>3.70%</td><td><strong>2.62</strong></td><td>1.29%</td><td>3.22</td></tr>\n</table></div>\n<ul>\n<li>相比 LSTM，Momentum Transformer 的 Sharpe 在 1995–2020 提升 <strong>50%</strong>、在 2015–2020 提升 <strong>109%</strong></li>\n<li>CPD 模块与注意力互补，2015–2020 期可额外提升 Sharpe <strong>17%</strong></li>\n<li><strong>危机鲁棒性</strong>：SARS-CoV-2 期间所有注意力架构稳健（canonical Transformer Sharpe 3.38、Decoder-Only TFT CPD 2.47），而 LSTM 暴跌至 <strong>-1.50</strong></li>\n<li><strong>扣交易成本</strong>：从 0bps→3bps，LSTM 总降幅 228%，而注意力架构仅约 106%；Decoder-Only TFT 在 1bps 时 Sharpe 仍达 1.22；商品期货扣成本后表现最强</li>\n<li><strong>可解释性</strong>：VSN 给出变量重要度（日收益权重最高，CPD 特征合计约 27%）；注意力模式聚焦于动量转折点、对相似制度赋高权重，将时序切分为制度段</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次将（attention-LSTM 混合的）Temporal Fusion Transformer 用于时序动量交易，作为 DMN 的注意力扩展</li>\n<li>注意力直连所有历史时步，同时学短期+长期依赖；多头并发捕捉不同时间尺度的并存制度</li>\n<li>内生可解释性：VSN 变量重要度 + 可解释多头注意力，打破传统 DMN 黑箱</li>\n<li>CPD 与注意力机制互补而非替代关系的实证</li>\n<li>系统比较 5 种 Transformer 变体（canonical / Decoder-Only / Convolutional / Informer / Decoder-Only TFT）在动量交易中的优劣</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>仅用价格信息</strong>：输入全为价格衍生特征，未纳入基本面/截面因子，作者自承可拓展</li>\n<li><strong>TFT 方差较大</strong>：架构更复杂、对超参更敏感，多次重复实验间 Sharpe 方差高于 LSTM</li>\n<li><strong>非混合 Transformer 在牛市/危机后期反超</strong>：SARS-CoV-2 崩盘后的单边上涨中 canonical Transformer 与 Informer 表现优于 TFT，说明无单一最优架构</li>\n<li><strong>期货低协方差假设</strong>：组合构建假设协方差矩阵近似对角（适合期货，不适合高协方差的股票——见课程项目 <code>L9LXFTIL</code> 的迁移失败教训）</li>\n<li><strong>数据为付费源</strong>：Pinnacle Data Corp，且固收期货在组合中权重低导致该类表现偏弱</li>\n<li><strong>回测过拟合风险</strong>：虽用扩展窗口 + deflated Sharpe 视角讨论，但深度模型超参搜索空间大</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: ✅ 期货数据可用天软获取中国期货替代；原文用 Pinnacle（付费）但有公开 GitHub 数据脚本</li>\n<li><strong>方法清晰度</strong>: ✅ 架构、损失、特征构造均给出公式；作者提供完整开源代码（github.com/kieranjwood/trading-momentum-transformer）</li>\n<li><strong>计算成本</strong>: ⚠️ 需 GPU 训练 TFT + 多次重复实验；CPD 模块计算偏重但可选</li>\n<li><strong>综合评分</strong>: ★4.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>高价值原始论文，建议复现。最小可行版本：先实现无 CPD 的 Decoder-Only TFT（VSN → LSTM → MIMHA → FFN-tanh），用多尺度收益 + MACD 作输入，负 Sharpe 为损失，序列长度 252，扩展窗口回测。可直接参考作者开源代码，将资产替换为天软可取的中国商品期货组合。关键风险点：(1) 严格防未来信息泄漏（掩码注意力 + 标签对齐）；(2) 波动率缩放与事前波动估计需点对点（point-in-time）；(3) 交易成本用换手正则项纳入损失而非仅事后扣减；(4) 中国期货品种少、协方差结构与组合假设需重新评估。CPD 模块作为增量模块二期再加。</p>"}, {"key": "94CWU6S8", "title": "FactorVAE: A Probabilistic Dynamic Factor Model Based on Variational Autoencoder for Predicting Cross-Sectional Stock Returns", "year": "2022", "authors": "Yitong Duan, Lei Wang, Qizhong Zhang…", "tags": [], "venue": "Proceedings of the AAAI Conference on Artificial Intelligence", "abstract": "As an asset pricing model in economics and ﬁnance, factor model has been widely used in quantitative investment. Towards building more effective factor models, recent years have witnessed the paradigm shift from linear models to more ﬂexible nonlinear data-driven machine learning models. However, due to low signal-to-noise ratio of the ﬁnancial data, it is quite challenging to learn effective factor models. In this paper, we propose a novel factor model, FactorVAE, as a probabilistic model with inherent randomness for noise modeling. Essentially, our model integrates the dynamic factor model (DFM) with the variational autoencoder (VAE) in machine learning, and we propose a prior-posterior learning method based on VAE, which can effectively guide the learning of model by approximating an optimal posterior factor model with future information. Particularly, considering that risk modeling is important for the noisy stock data, FactorVAE can estimate the variances from the distribution over the latent space of VAE, in addition to predicting returns. The experiments on the real stock market data demonstrate the effectiveness of FactorVAE, which outperforms various baseline methods.", "url": "https://ojs.aaai.org/index.php/AAAI/article/view/20369", "date_added": "2026-05-26", "summarized": true, "rating": "★4.0", "starred": false, "repro": "待复现", "summary_html": "<h1>FactorVAE: A Probabilistic Dynamic Factor Model Based on Variational Autoencoder for Predicting Cross-Sectional Stock Returns</h1>\n<p>&gt; Zotero Key: <code>94CWU6S8</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Yitong Duan, Lei Wang, Qizhong Zhang, Jian Li</li>\n<li><strong>年份</strong>: 2022</li>\n<li><strong>出处</strong>: Proceedings of the AAAI Conference on Artificial Intelligence (AAAI-22), Vol. 36, pp. 4468–4475</li>\n<li><strong>DOI</strong>: 10.1609/aaai.v36i4.20369</li>\n<li><strong>链接</strong>: https://ojs.aaai.org/index.php/AAAI/article/view/20369</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/GUEG9HU6/Duan 等 - 2022 - FactorVAE A Probabilistic Dynamic Factor Model Based on Variational Autoencoder for Predicting Cros.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>:金融数据信噪比极低，端到端 ML 因子模型难从噪声中学到有效因子，且需在不引入未来信息泄漏的前提下提升预测。</li>\n<li><strong>方法</strong>:动态因子模型 + VAE 的&quot;先验-后验学习&quot;——训练期借未来数据经后验机制监督引导因子学习，预测期只用历史数据，同时输出收益预测与概率风险估计。</li>\n<li><strong>结论</strong>:A 股上 Rank IC=<strong>0.055</strong> / ICIR=<strong>0.568</strong>，显著优于 CA(0.042)、GRU、ALSTM;TopK-Drop 回测(含交易费)年化超额 <strong>15.32%</strong>、SR <strong>1.92</strong>、MDD <strong>4.47%</strong>，加风险调整后 SR 升至 <strong>2.09</strong>;去掉后验监督性能大幅下降，证明先验-后验机制是核心。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>金融数据信噪比极低，现有 ML 因子模型（如条件自编码器 CA）端到端训练时难以从噪声数据中学到有效因子。本文核心问题：如何在不引入未来信息泄漏的前提下，利用&quot;未来数据监督&quot;来引导模型从历史数据中学习更有效的因子？解决方案是将 VAE 的后验机制用于训练期监督，预测期只用历史数据。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 中国 A 股（CSI300 成分股，约 3000–3900 只）</li>\n<li><strong>频率</strong>: 日频</li>\n<li><strong>样本区间</strong>: 训练集 2010.01–2017.12（3432 只股票），验证集 2018.01–2018.12（3450 只），测试集 2019.01–2020.12（3923 只）</li>\n<li><strong>数据来源</strong>: Yahoo Finance 日线价量数据，特征来自 Qlib 平台（Alpha158，158 个价量技术特征，选用 20 个）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>整体框架</strong>（编码器-解码器）：</p>\n<p>训练阶段：</p>\n<p>1. <strong>特征提取器</strong> $\\phi_{\\text{feat}}$：GRU 编码历史序列特征 $x_s$（T=20 个时间步），得到股票潜在特征 $e$</p>\n<p>2. <strong>因子编码器</strong> $\\phi_{\\text{enc}}$（后验，访问未来收益 $y$）：将 $e$ 和 $y$ 构建 M 个组合 $y_p$，再映射为后验因子分布 $z_{\\text{post}} \\sim \\mathcal{N}(\\mu_{\\text{post}}, \\text{diag}(\\sigma_{\\text{post}}^2))$</p>\n<p>3. <strong>因子预测器</strong> $\\phi_{\\text{pred}}$（先验，仅用历史 $e$）：多头全局注意力机制聚合市场表示，输出先验因子 $z_{\\text{prior}} \\sim \\mathcal{N}(\\mu_{\\text{prior}}, \\text{diag}(\\sigma_{\\text{prior}}^2))$</p>\n<p>4. <strong>因子解码器</strong> $\\phi_{\\text{dec}}$：用因子 $z$ 和特征 $e$ 重建收益 $\\hat{y} = \\alpha + \\beta z$（Alpha 层输出特异收益，Beta 层输出因子暴露）</p>\n<p><strong>目标函数</strong>（先验-后验学习）：</p>\n<p>$$L(x, y) = -\\frac{1}{N}\\sum_{i=1}^N \\log p_{\\phi_{\\text{dec}}}(\\hat{y}_{\\text{rec}}^{(i)} = y^{(i)} | x, z_{\\text{post}}) + \\gamma \\cdot \\text{KL}(P_{\\phi_{\\text{enc}}}(z|x,y) \\| P_{\\phi_{\\text{pred}}}(z|x))$$</p>\n<p>预测阶段仅用先验路径（无未来信息）。</p>\n<p><strong>评估指标</strong>：Rank IC（排名信息系数）和 Rank ICIR（IC/std(IC)），以及回测年化收益（AR）、夏普比率（SR）、最大回撤（MDD）。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>截面预测：FactorVAE 在测试集上 Rank IC = <strong>0.055</strong>，Rank ICIR = <strong>0.568</strong>，显著优于 CA（0.042/0.226）、GRU（0.032/0.398）、ALSTM（0.031/0.360）</li>\n<li>鲁棒性实验（随机删除 m=50/100/200 只训练股票）：FactorVAE 在所有设置下均最优，表明泛化能力强</li>\n<li>组合回测（TopK-Drop，K=50，考虑交易费用）：年化超额收益 AR=<strong>15.32%</strong>，SR=<strong>1.92</strong>，MDD=<strong>4.47%</strong>，显著优于所有基线</li>\n<li>加入风险调整（TDRisk）后：AR=<strong>16.32%</strong>，SR=<strong>2.09</strong>，验证了概率风险估计对实盘的价值</li>\n<li>去掉后验监督（FactorVAE-prior 变体）性能大幅下降，证明先验-后验学习机制是核心</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次将 VAE 的后验机制引入动态因子模型训练，用未来信息构建更优秀的因子作为&quot;教师信号&quot;</li>\n<li>多头全局注意力机制：捕捉横截面股票的全局市场表示，提取多样化风险溢价</li>\n<li>同时输出收益预测（均值）和风险估计（方差），可做风险调整选股</li>\n<li>组合构建的投资组合层设计减少参数量并提升对缺失股票的鲁棒性</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>仅在 A 股 CSI300 范围内测试，样本量小（3000 只），泛化到更宽股票池未验证</li>\n<li>特征仅用 Qlib Alpha158 中的 20 个价量特征，未使用基本面特征，信号维度有限</li>\n<li>测试期仅 2019–2020 两年，且包含 2020 年新冠行情，样本外鲁棒性存疑</li>\n<li>交易成本仅考虑 30bp，实际 A 股冲击成本可能更高</li>\n<li>超参数（因子数 K、组合数 M、KLD 权重 γ 等）调优过程不透明</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: Qlib 平台开源，Alpha158 特征可免费获取；A 股日线价量数据公开可得；可基本复现</li>\n<li><strong>方法清晰度</strong>: 论文结构清晰，编码器/解码器各模块有公式和架构图，可实现</li>\n<li><strong>计算成本</strong>: 中等，GRU + 注意力机制，GPU 训练数小时可完成</li>\n<li><strong>综合评分</strong>: ★4.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>这是国内 A 股场景下结合 VAE 的动态因子模型最完整的落地方案之一，复现价值高。最小可行版本：基于 Qlib 框架，用 Alpha158 特征构建 GRU 特征提取器 + VAE 因子模块，验证先验-后验学习的有效性。关键风险：（1）后验崩塌（posterior collapse）是 VAE 类模型常见问题，需注意 KLD 权重调优；（2）需仔细处理股票池变动（新股/退市）；（3）A 股非 CSI300 全市场的泛化性需另行验证。</p>"}, {"key": "SGQL9G33", "title": "Factor Investing with a Deep Multi-Factor Model", "year": "2022", "authors": "Zikai Wei, Bo Dai, Dahua Lin", "tags": ["Quantitative Finance - Computational Finance", "Computer Science - Machine Learning"], "venue": "", "abstract": "Modeling and characterizing multiple factors is perhaps the most important step in achieving excess returns over market benchmarks. Both academia and industry are striving to find new factors that have good explanatory power for future stock returns and good stability of their predictive power. In practice, factor investing is still largely based on linear multi-factor models, although many deep learning methods show promising results compared to traditional methods in stock trend prediction and portfolio risk management. However, the existing non-linear methods have two drawbacks: 1) there is a lack of interpretation of the newly discovered factors, 2) the financial insights behind the mining process are unclear, making practitioners reluctant to apply the existing methods to factor investing. To address these two shortcomings, we develop a novel deep multi-factor model that adopts industry neutralization and market neutralization modules with clear financial insights, which help us easily build a dynamic and multi-relational stock graph in a hierarchical structure to learn the graph representation of stock relationships at different levels, e.g., industry level and universal level. Subsequently, graph attention modules are adopted to estimate a series of deep factors that maximize the cumulative factor returns. And a factor-attention module is developed to approximately compose the estimated deep factors from the input factors, as a way to interpret the deep factors explicitly. Extensive experiments on real-world stock market data demonstrate the effectiveness of our deep multi-factor model in the task of factor investing.", "url": "http://arxiv.org/abs/2210.12462", "date_added": "2026-05-26", "summarized": true, "rating": "★4.0", "starred": false, "repro": "待复现", "summary_html": "<h1>Factor Investing with a Deep Multi-Factor Model</h1>\n<p>&gt; Zotero Key: <code>SGQL9G33</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Zikai Wei (CUHK), Bo Dai (Shanghai AI Lab), Dahua Lin (CUHK / Shanghai AI Lab)</li>\n<li><strong>年份</strong>: 2022</li>\n<li><strong>出处</strong>: arXiv:2210.12462</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2210.12462</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2210.12462</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/6Q6PS5Y9/Wei 等 - 2022 - Factor Investing with a Deep Multi-Factor Model.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：传统多因子模型依赖线性假设忽略因子间交互，深度学习方法虽有更好的预测能力但深度因子不可解释，从业者难以信任黑箱。</li>\n<li><strong>方法</strong>：基于图注意力网络（GAT）的深度多因子模型——在行业图和全市场图两个层次的动态股图上，通过行业中性化和市场中性化学习深度因子，因子注意力模块将深度因子分解为原始因子的加权组合。</li>\n<li><strong>结论</strong>：在 CSI 300/500/800 上，Alpha、ICIR、IR、Sharpe 一致优于线性多因子和 MLP 基线；因子注意力热力图实现完全可解释的因子投资。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>传统多因子模型依赖线性假设，忽略因子间交互和非线性关系。深度学习方法虽有更好的预测能力，但存在两个关键障碍：（1）学习的深度因子不可解释——无法知道新因子是什么；（2）建模过程缺乏金融洞见——从业者难以信任&quot;黑箱&quot;。本文旨在将图神经网络引入因子投资，同时保持每个模块的金融含义清晰。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: CSI 300、CSI 500、CSI 800（覆盖 2800+ 只 A 股）</li>\n<li><strong>频率</strong>: 月度</li>\n<li><strong>样本区间</strong>: 2010–2022（训练/验证/测试按时间划分）</li>\n<li><strong>数据来源</strong>: 包含基本面、交易信息和分析师预测等多类因子</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>多层股图构建</strong>：</p>\n<ul>\n<li>行业图（Industry Graph）：同行业股票之间双向连接，学习行业内部影响力</li>\n<li>全市场图（Universe Graph）：所有指数成分之间全连接，学习跨行业影响力</li>\n<li>两图均为动态图，随成分股变动和行业分类变更而更新</li>\n</ul>\n<p><strong>核心模块</strong>：</p>\n<p>1. <strong>Stock Context Encoder</strong>：MLP + BatchNorm 将原始因子编码为隐特征 $C_t$（BatchNorm 相当于因子开发中的 Z-score 标准化）</p>\n<p>2. <strong>行业影响学习</strong>：GAT 在行业图上传播信息，得到行业影响力 $H_t^I$</p>\n<p>3. <strong>行业中性化</strong>：$\\bar{C}_t^I = C_t - H_t^I$，去除行业共同因素</p>\n<p>4. <strong>市场中性化</strong>：在全市场图上再次 GAT，得到 $\\bar{C}_t^G$，进一步去除市场共同因素</p>\n<p>5. <strong>深度因子生成</strong>：三个粒度的特征（原始 / 行业中性 / 市场中性）各自生成深度因子 $f_t^k$，最大化累积因子收益和信息系数信息比（ICIR）</p>\n<p>6. <strong>因子注意力解释</strong>：用 attention 将深度因子分解为原始输入因子的加权组合，权重热力图揭示每个深度因子由哪些传统因子构成</p>\n<p>训练使用交叉截面回归：深度因子 → 因子收益 $b_t^k$ → 预测收益 $\\hat{r}_{t+k} = \\sum b_t^k f_t^k$，局部优化 $b_t^k$ 的同时全局优化 $f_t^k$。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>在 CSI 300 / CSI 500 / CSI 800 三个股票池上，深度多因子模型的 <strong>Alpha、ICIR、IR、Sharpe</strong> 一致优于线性多因子、等权组合（EW）、MLP 和 MLP+GAT 基线</li>\n<li>累积超额收益曲线在三个市场均稳定上升，尤其在大盘（CSI 300）中效果最佳</li>\n<li>因子注意力热力图显示深度因子可以从原始因子中合理拆解（如某个深度因子主要由动量+波动率因子组成）</li>\n<li>行业中性化模块有效去除了行业层面的共同噪音，提升了因子稳定性</li>\n</ul>\n<h2>创新点</h2>\n<p>1. 用动态多层股图显式建模行业内和跨行业的多粒度股票关系</p>\n<p>2. 行业中性化和市场中性化直接嵌入网络架构，赋予明确的金融含义</p>\n<p>3. 因子注意力模块实现了深度因子的显式可解释性——每个深度因子都可以追溯为原始因子的加权组合</p>\n<p>4. 局部+全局两级优化（因子收益局部回归 + 因子权重全局梯度下降）</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>仅在中国 A 股市场测试，未在其他市场验证</li>\n<li>月度频率限制了策略容量和交易信号的时效性</li>\n<li>因子注意力解释是基于近似的软分解，而非精确的线性组合</li>\n<li>图构建依赖行业分类标准（ICB），分类变更可能影响结果</li>\n<li>未考虑交易成本、流动性约束等实际执行因素</li>\n<li>未与最新的深度时序模型（Transformer 类）对比</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: A 股因子数据可通过公开渠道获取，行业分类数据公开</li>\n<li><strong>方法清晰度</strong>: 架构每个模块的金融含义明确，数学公式完整</li>\n<li><strong>计算成本</strong>: 中等 — GAT + 月度数据，单 GPU 可完成</li>\n<li><strong>综合评分</strong>: ★4.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>是 A 股因子投资领域针对性最强的方法之一。最小可行版本：选取 CSI 300 成分，使用常见风格因子作为输入（value/momentum/size/volatility/quality），实现行业中性化 GAT + 因子生成 + 因子注意力解释。关键验证点：(1) ICIR 是否优于线性因子模型，(2) 因子注意力权重是否稳定且反映合理的经济逻辑。</p>"}, {"key": "EKR7ITT7", "title": "Trend-Following Strategies via Dynamic Momentum Learning", "year": "2021", "authors": "Bruno P. C. Levy, Hedibert F. Lopes", "tags": [], "venue": "", "abstract": "Time series momentum strategies are widely applied in the quantitative financial industry and its academic research has grown rapidly since the work of Moskowitz, Ooi and Pedersen (2012). However, trading signals are usually obtained via simple observation of past return measurements. In this article we study the benefits of incorporating dynamic econometric models to sequentially learn the time-varying importance of different look-back periods for individual assets. By the use of a dynamic binary classifier model, the investor is able to switch between time-varying or constant relations between past momentum and future returns, dynamically combining or selecting different momentum speeds during turning points, improving trading signals accuracy and portfolio performance. Using data from 56 future contracts we show that a mean-variance investor will be willing to pay a considerable management fee to switch from the traditional naive time series momentum strategy to the dynamic classifier approach.", "url": "https://arxiv.org/abs/2106.08420v4", "date_added": "2026-05-24", "summarized": true, "rating": "★5", "starred": false, "repro": "复现中", "summary_html": "<h1>Trend-Following Strategies via Dynamic Momentum Learning</h1>\n<p>&gt; Zotero Key: <code>EKR7ITT7</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Bruno P. C. Levy, Hedibert F. Lopes</li>\n<li><strong>年份</strong>: 2021</li>\n<li><strong>出处</strong>: arXiv</li>\n<li><strong>DOI</strong>: -</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2106.08420</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/FQXY7J8B/Levy和Lopes - 2021 - Trend-Following Strategies via Dynamic Momentum Learning.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：传统 TSMOM 仅用固定回看期的收益符号，无法适应不同资产、时变的最优动量速度，趋势反转期（如 2009 年）固定周期信号会失效。</li>\n<li><strong>方法</strong>：用动态逻辑回归分类器预测收益方向，对 7 个回看期（1–12 月）共 $2^7{-}1=127$ 个模型做动态模型平均/选择（DMA/DMS）自适应切换动量速度，配 40% 波动率目标与分层交易成本。</li>\n<li><strong>结论</strong>：DMS-TVP 年化 12.3%、Sharpe 1.23（vs Naive-12m 8.1%、0.81，+52%），MaxDD 14.8% vs 25.3%；2009 崩盘期把 -25.3% 亏损转为 +22.1% 盈利；分类准确率约 53% vs Naive 50–52%。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>传统TSMOM策略仅基于固定回看期的历史收益符号产生多空信号，存在三个缺陷：(1)不同资产对不同回看期的敏感度不同且随时间变化；(2)趋势反转时(如2009年)固定周期信号无法识别转向；(3)没有利用不同周期信息的互补性。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 56个期货合约(12个权益指数、25个商品、11个固收、8个外汇)</li>\n<li><strong>频率</strong>: 月频对数收益率，月频再平衡</li>\n<li><strong>样本区间</strong>: 1980年1月 - 2020年9月</li>\n<li><strong>数据来源</strong>: Refinitiv/Datastream连续价格</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>1. <strong>动态逻辑回归分类器</strong>: 预测下一期收益率方向(涨/跌)，模型 s_t ~ Bernoulli(p_t), logit(p_t) = x_t&#x27;θ_t, θ_t = θ_{t-1} + ω_t (随机游走)</p>\n<p>2. <strong>动量速度不确定性的建模</strong>: 考虑K=7个回看期(1/2/4/6/8/10/12个月)，共M=2^K-1个模型。每个模型包含不同的动量预测变量组合</p>\n<p>3. <strong>动态模型平均(DMA)</strong>: 按预测似然加权平均各模型预测概率</p>\n<p>4. <strong>动态模型选择(DMS)</strong>: 每期选择概率最高的单一模型</p>\n<p>5. <strong>折扣因子</strong>: 系数时变性通过 λ_t ∈ {0.98, 0.99, 1} 网格搜索自适应选择；模型遗忘因子 α ∈ {0.99, 1}</p>\n<p>6. <strong>波动率缩放</strong>: 沿用Moskowitz等(2012)的40%年化波动率目标</p>\n<p>7. <strong>交易成本</strong>: 按Baltas &amp; Kosowski(2020)各品种层级设定，含再平衡和滚动成本</p>\n<h2>核心结论与关键结果</h2>\n<p>1. <strong>全样本绩效(c=50%阈值)</strong>:</p>\n<p>   - DMS-TVP: 年化收益12.3%, SR 1.23, MaxDD 14.8% — 对比Naive-12m: 8.1%, SR 0.81, MaxDD 25.3%</p>\n<p>   - DMS-CP: SR 1.17, DMA-TVP: SR 1.06, DMA-CP: SR 1.05</p>\n<p>   - 均显著优于所有Naive策略(最佳Naive-12m仅SR 0.81)</p>\n<p>2. <strong>管理费等价</strong>: 均值-方差投资者(γ=10)愿意支付425 bps的年化管理费从Naive-12m切换到DMS-TVP</p>\n<p>3. <strong>2009年动量崩盘期间(2009m3-2010m6)</strong>:</p>\n<p>   - Naive-12m累计亏损-25.3%, SR -1.57</p>\n<p>   - DMS-TVP累计盈利+22.1%, SR 1.32 — 完全扭转损失</p>\n<p>   - 管理费等价高达4541 bps</p>\n<p>4. <strong>后崩盘期(2010m7-2020m9)</strong>:</p>\n<p>   - DMS-CP: SR 1.18, 管理费等价699 bps</p>\n<p>   - 1个月单预测器表现突出(SR 1.18)，说明后危机时代短周期动量更具预测力</p>\n<p>5. <strong>预测精度</strong>: DMA/DMS分类准确率约53-53.3%，Naive策略仅50.1-52.3%</p>\n<p>6. <strong>速度选择动态</strong>: 2009年崩盘后，1个月动量预测器的包含概率(inclusion probability)从约0.4升至0.7+，10/12个月从0.6+降至0.2-</p>\n<h2>创新点</h2>\n<p>1. 首次将动态二分类模型(McCormick et al., 2012)引入时间序列动量预测，实现动量速度的自适应选择/组合</p>\n<p>2. 从朴素观察收益符号的&quot;无模型&quot;决策升级为概率化统计推断</p>\n<p>3. 通过动态模型概率的时序学习，自动识别趋势拐点——无需人工设定阈值或规则</p>\n<p>4. 在2009年动量崩溃这一难题上取得了颠覆性的改善(亏损25%→盈利22%)</p>\n<h2>局限与可质疑处</h2>\n<p>1. 后2010年的优异表现很大程度上来自1个月单一预测器——DMA/DMS的附加价值在CP vs TVP差异不显著</p>\n<p>2. 分类准确率仅53%左右，虽然对量化策略足以产生经济价值，但提升幅度有限</p>\n<p>3. 月频再平衡——日频应用中模型更新和交易成本将更高</p>\n<p>4. TVP模型换手率较高(101%月换手)，实际交易成本可能被低估</p>\n<p>5. 仅使用56个期货合约，扩展至A股等更大样本需重新验证</p>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 天软可获取全球期货周/月线，56个合约范围与原文高度匹配</li>\n<li><strong>方法清晰度</strong>: 方法描述极其详尽(含完整公式、折扣因子选择、模型概率更新、CV流程)，FDA可完全复现</li>\n<li><strong>计算成本</strong>: 中等 — 需要为每个资产并行估计2^7-1=127个动态逻辑回归模型，月频计算量可控；无MCMC/深度学习需求</li>\n<li><strong>综合评分</strong>: ★★★★★</li>\n</ul>\n<h2>复现备注</h2>\n<ul>\n<li><strong>关键风险点</strong>: 月频信号 vs 我们常用日频——需要调整折扣因子参数；127个模型的计算量需并行化；交易成本参数需校准</li>\n<li><strong>最小可行版本</strong>: 先实现CP-DMS(常数参数+动态模型选择)——它提供了接近TVP版本的绩效(SR 1.17 vs 1.23)，但更简单稳定。使用K=3个回看期(3/6/12月)即可</li>\n<li><strong>建议 research topic</strong>: <code>tsmom_dynamic_classifier</code></li>\n<li><strong>核心可交付</strong>: 1) 动态逻辑回归分类器 + DMA/DMS 2) 与Naive-TSMOM的绩效对比 3) 速度选择概率时间序列图</li>\n</ul>"}, {"key": "JGMU8T7Z", "title": "The Best Strategies for Inflationary Times", "year": "2021", "authors": "Henry Neville, Teun Draaisma, Ben Funnell…", "tags": ["commodities", "bitcoin", "gold", "asset allocation", "cryptocurrency", "factor investing", "inflation betas", "Inflation hedge", "inflation shocks", "inflation surprises", "permanent inflation", "portfolio management", "risk management", "temporary inflation"], "venue": "", "abstract": "Over the past three decades, a sustained surge in inflation has been absent in developed markets. As a result, investors face the challenge of having limited experience and no recent data to guide the repositioning of their portfolios in the face of heighted inflation risk. We provide some insight by analyzing both passive and active strategies across a variety of asset classes for the U.S., U.K., and Japan over the past 95 years. Unexpected inflation is bad news for traditional assets, such as bonds and equities, with local inflation having the greatest effect. Commodities have positive returns during inflation surges but there is considerable variation within the commodity complex. Among the dynamic strategies, we find that trend-following provides the most reliable protection during important inflation shocks. Active equity factor strategies also provide some degree of hedging ability. We also provide analysis of alternative asset classes such as fine art and discuss the economic rationale for including cryptocurrencies as part of a strategy to protect against inflation.", "url": "https://papers.ssrn.com/abstract=3813202", "date_added": "2026-05-24", "summarized": true, "rating": "★3.5", "starred": false, "repro": "—", "summary_html": "<h1>The Best Strategies for Inflationary Times</h1>\n<p>&gt; Zotero Key: <code>JGMU8T7Z</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Henry Neville, Teun Draaisma, Ben Funnell, Campbell R. Harvey, Otto Van Hemert (Man Group)</li>\n<li><strong>年份</strong>: 2021</li>\n<li><strong>出处</strong>: SSRN</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.3813202</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=3813202</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/CHBMQKCN/Neville 等 - 2021 - The Best Strategies for Inflationary Times.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：发达市场近 30 年未经历持续通胀，投资者缺乏经验和近期数据指导组合再配置——如果通胀来了，什么策略历史上表现好？</li>\n<li><strong>方法</strong>：用 1926 年以来美英日三国 95 年数据，定义 8 个美国&quot;高且加速通胀&quot;体制（YoY CPI ≥5% 且上升），系统比较各类资产和策略的年化实际收益。</li>\n<li><strong>结论</strong>：趋势跟踪最可靠——年化实际 +25%、在所有 8 个通胀体制中均正收益（100% 命中率）；商品期货 +14%（100% 命中率）；股票 -7%、60/40 -6%。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>2021 年初，M2 货币供应爆发式增长 + 大规模财政刺激 + 长端收益率上行，通胀风险成为投资者核心关切。但发达市场已近 30 年未经历持续通胀，投资者缺乏经验和近期数据来指导组合再配置。这篇论文不问&quot;通胀会不会来&quot;，只问&quot;如果来了，什么策略历史上表现好&quot;。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 美股、美债（2/10/30Y）、信用债（IG/HY）、TIPS、商品（综合+能源/工业金属/黄金/贵金属/软商品/农产品）、住宅地产、艺术品/葡萄酒/邮票收藏品、比特币</li>\n<li><strong>策略</strong>: 趋势跟踪（跨资产/纯商品/纯债券/纯股票）、横截面动量、质量（QMJ）、价值（HML）、低波（BAB）、规模（SMB）、盈利（RMW）、投资（CMA）</li>\n<li><strong>频率</strong>: 月度</li>\n<li><strong>样本区间</strong>: 1926–2021（美国），UK/日本</li>\n<li><strong>数据来源</strong>: 多种公开和专有数据源</li>\n</ul>\n<h2>方法 / 模型</h2>\n<ul>\n<li><strong>通胀体制定义</strong>: YoY headline CPI 加速上升且水平达到 ≥5%；体制结束 = CPI 达到峰值且没有从 24 个月高点回落超 50%</li>\n<li><strong>8 个美国通胀体制</strong>（1926-2021）：二战（1941-42）、战后（1946-47）、朝鲜战争（1950-51）、布雷顿森林终结（1966-70）、OPEC 石油禁运（1972-74）、伊朗革命（1977-80）、里根繁荣（1987-90）、中国需求繁荣（2007-08）</li>\n<li>趋势跟踪策略按 Hamill, Rattray &amp; Van Hemert (2016) 方法构建</li>\n</ul>\n<h2>核心结论与关键结果</h2>\n<p><strong>美国 8 个通胀体制中的年化实际收益（关键品种）</strong>:</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>策略/资产</th><th>通胀期实际收益</th><th>非通胀期</th><th>命中率</th></tr>\n<tr><td><strong>趋势跟踪 – 全资产</strong></td><td><strong>+25%</strong></td><td>+15%</td><td><strong>100%</strong>（8/8 正）</td></tr>\n<tr><td>趋势跟踪 – 商品</td><td>—</td><td>—</td><td>高</td></tr>\n<tr><td>趋势跟踪 – 债券</td><td>—</td><td>—</td><td>—</td></tr>\n<tr><td>商品 – 综合</td><td><strong>+14%</strong></td><td>-1%</td><td><strong>100%</strong>（8/8 正）</td></tr>\n<tr><td>横截面动量（股票）</td><td>+8%</td><td>+4%</td><td>—</td></tr>\n<tr><td>质量（QMJ）</td><td>+3%</td><td>+3%</td><td>—</td></tr>\n<tr><td>价值（HML）</td><td>-1%</td><td>+2%</td><td>—</td></tr>\n<tr><td>股票 – 综合</td><td><strong>-7%</strong></td><td>+10%</td><td>25%</td></tr>\n<tr><td>10Y 国债</td><td>-5%</td><td>+4%</td><td>—</td></tr>\n<tr><td>60/40 组合</td><td>-6%</td><td>+10%</td><td>50%</td></tr>\n</table></div>\n<ul>\n<li>商品内部差异性大：能源在 OPEC 禁运期间 +264%，但黄金在部分体制中为负</li>\n<li>趋势跟踪的优越性来源于通胀冲击往往是持续性事件而非一次性跳跃，这恰好是趋势策略的优势</li>\n<li>TIPS 在所有体制中提供稳定正实际收益（约 +3-6%），但数据始于 1997 年</li>\n<li>比特币作为通胀对冲存在经济逻辑（固定供给），但数据历史太短无法统计验证</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>系统量化定义了&quot;通胀体制&quot;——不仅是 CPI 超过阈值，还要求处于加速阶段</li>\n<li>覆盖了三种资产的完整谱系：被动资产 → 主动股票因子 → 动态趋势策略 → 另类资产</li>\n<li>明确区分了暂时性和持续性通胀冲击对资产价格的不同影响，并用趋势跟踪天然适配持续性冲击来解释其优越性</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>仅 8 个通胀体制，样本量太小——统计推断需要谨慎</li>\n<li>体制定义（5% 阈值、50% 回撤规则）有一定主观性</li>\n<li>趋势跟踪策略的实际容量远小于被动商品配置——对大型机构投资者而言可扩展性是问题</li>\n<li>2022 年后的通胀周期未包含在样本内（若包含将构成重要的样本外验证）</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 中——基础资产数据易得，但趋势跟踪策略的具体构建参数和期货合约细节不完全公开</li>\n<li><strong>方法清晰度</strong>: 高——通胀体制定义和资产分类清晰</li>\n<li><strong>计算成本</strong>: 低至中——趋势跟踪回测需要多品种期货数据</li>\n<li><strong>综合评分</strong>: ★★★☆☆ 3.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>核心框架值得复现验证。最小可行版本：(1) 用中国 CPI 数据定义中国版的通胀体制；(2) 用简化趋势跟踪（12 月时序动量 + 波动率目标）在中国商品期货上测试通胀期表现；(3) 比较各股票因子（价值/质量/动量/低波）在通胀体制中的表现差异。关键价值在于提供了一个资产配置层面的框架性认知——不是&quot;通胀来了买什么&quot;，而是&quot;不同通胀应对工具在历史上实际表现如何排位&quot;。</p>"}, {"key": "CRIGSRAN", "title": "In Good and in Bad Times? The Relation between Anomaly Returns and Market States", "year": "2021", "authors": "Sebastian Müller, Fabian Preissler", "tags": ["Anomalies", "international stock markets", "market states", "sentiment. market efficiency"], "venue": "", "abstract": "We evaluate the relation between various anomalies/factors and market conditions using data comprising 57 countries from 1980 to 2019. The cross-section of anomalies performs significantly better during unfavorable market states. The value-weighted four-factor alpha is 49.2 bps in bad times while it amounts to 29.4 bps in good times. 92.9% of the performance gain can be attributed to the anomaly short side. Findings remain robust considering sentiment, recessions, and anomaly categories or regions. They underscore the overall importance of mispricing in explaining anomalies, while for certain individual anomalies, risk and data mining may still serve as potential explanations.", "url": "https://papers.ssrn.com/abstract=3926059", "date_added": "2026-06-27", "summarized": true, "rating": "★3.5", "starred": false, "repro": "—", "summary_html": "<h1>In Good and in Bad Times? The Relation between Anomaly Returns and Market States</h1>\n<p>&gt; Zotero Key: <code>CRIGSRAN</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Sebastian Müller, Fabian Preissler</li>\n<li><strong>年份</strong>: 2021</li>\n<li><strong>出处</strong>: SSRN</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.3926059</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=3926059</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/P4BU2GZN/Müller和Preissler - 2021 - In Good and in Bad Times The Relation between Anomaly Returns and Market States.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：横截面异象在不同市场状态下的表现差异（好时期 vs 坏时期）可以区分风险补偿、误定价和数据挖掘三种竞争性假说。</li>\n<li><strong>方法</strong>：在 57 国 1980—2019 年的 133 个异象上，以 200 日均线划分市场状态，用面板回归检验异象 alpha 与市场状态的关系，并做空头端分解和伪异象蒙特卡洛检验。</li>\n<li><strong>结论</strong>：异象在坏时期 alpha 为 49.2 bps/月（好时期 29.4 bps），92.9% 超额收益来自空头端，结果支持误定价假说（反应不足），不支持风险补偿假说。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>异象的三大解释假说——风险补偿、误定价、数据挖掘——对异象在不同市场状态下的表现给出了不同预测：</p>\n<ul>\n<li><strong>风险补偿假说</strong>：异象在好时期表现更好（补偿不利时期的下行风险）</li>\n<li><strong>误定价假说（过度反应）</strong>：异象在好时期更显著（投资者过度自信）</li>\n<li><strong>误定价假说（反应不足）</strong>：异象在坏时期更显著（坏消息传播慢 + 鸵鸟效应）</li>\n<li><strong>数据挖掘假说</strong>：异象与市场状态无关</li>\n</ul>\n<p>已有文献多聚焦单一异象或少数国家，且结论矛盾。本文用大规模跨国数据检验这些竞争性预测。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 57 个国家的股票市场（发达市场 22 个、新兴市场 22 个、前沿市场 13 个）</li>\n<li><strong>异象数量</strong>: 133 个（从 250 个候选中筛选，要求 Carhart 四因子模型 alpha 在 5% 水平显著）</li>\n<li><strong>频率</strong>: 月频</li>\n<li><strong>样本区间</strong>: 1980-10 至 2019-06（个别国家因数据可得性更短）</li>\n<li><strong>数据来源</strong>: Refinitiv Datastream（股价）、Worldscope（会计数据）、I/B/E/S（分析师预期）</li>\n<li><strong>市场状态指标</strong>: GOOD TIMES = 上月最后一个交易日股指收盘价 &gt; 200 日均线</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[57国股票数据&lt;br/&gt;133个异象] --&gt; B[构建异象收益&lt;br/&gt;Q5-Q1 价值加权]\n  B --&gt; C[Carhart四因子回归&lt;br/&gt;得到alpha]\n  C --&gt; D{市场状态划分&lt;br/&gt;200日均线}\n  D --&gt;|好时期| E[GOOD TIMES = 1]\n  D --&gt;|坏时期| F[GOOD TIMES = 0]\n  E --&gt; G[面板回归: alpha_t = β_0 + β_1·GOOD_TIMES + controls]\n  F --&gt; G\n  G --&gt; H[横截面分析: 每个异象单独回归]\n  G --&gt; I[分组分析: 按地区/类型]\n  G --&gt; J[空头端分解: Q1收益单独分析]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>异象收益构建</strong>：对每个异象，按特征值排序将股票分为五组，计算 Q5（多头）和 Q1（空头）的价值加权组合收益之差。价值加权避免小盘流动性股的干扰。</p>\n<p>2. <strong>市场状态定义</strong>：采用 Huang et al. (2017) 方法，若上月末股指收盘价 &gt; 200 日均线则为好时期（GOOD TIMES = 1），否则为坏时期。该指标是实时可计算的（无需未来信息），与 NBER 衰退定义在美国市场一致率约 81%。</p>\n<p>3. <strong>核心回归模型</strong>：</p>\n<p>   $$\\alpha_{i,t} = \\beta_{0,i} + \\beta_{1,i} \\cdot \\text{GOOD TIMES}_{c,t} + \\gamma_i X_{c,t} + \\varepsilon_{i,t}$$</p>\n<p>   其中 $\\alpha_{i,t}$ 是异象 $i$ 在 $t$ 月的 Carhart 四因子 alpha，$X_{c,t}$ 为控制变量（情绪指标、Fama-French 因子等）。$\\beta_1 &lt; 0$ 表示异象在坏时期表现更好。</p>\n<p>4. <strong>空头端分解</strong>：将 Q5-Q1 分解为多头端（Q5 收益）和空头端（Q1 收益），分别回归以确定市场状态效应主要来自哪一侧。</p>\n<p>5. <strong>数据挖掘检验</strong>：随机生成 1,000 个伪异象（按均匀分布排序构建 Q5-Q1），检验它们是否与市场状态相关。若伪异象也呈现类似模式则支持数据挖掘假说。</p>\n<p>6. <strong>稳健性检验</strong>：</p>\n<p>   - 替代市场状态指标：Cooper et al. (2004) 的三年累计收益指标（UP）、GDP 衰退虚拟变量</p>\n<p>   - 情绪控制：Baker &amp; Wurgler (2006) 情绪指数、新闻情绪、消费者信心</p>\n<p>   - 按异象类别（市场类、基本面类、分析师类、估值类）和地区分组</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>核心发现</strong>：横截面异象 alpha 在坏时期为 49.2 bps/月，好时期为 29.4 bps/月，差异经济显著且统计显著</li>\n<li><strong>空头端主导</strong>：92.9% 的坏时期超额收益来自空头端（Q1），多头端仅贡献 7.1%</li>\n<li><strong>异象分布</strong>：133 个异象中，50 个（37.6%）在坏时期显著更好，9 个（6.8%）在好时期显著更好，74 个（55.6%）无显著差异</li>\n<li><strong>跨国一致性</strong>：除前沿市场外，坏时期优势在发达市场和新兴市场均成立</li>\n<li><strong>类别差异</strong>：市场类异象坏时期优势最大，基本面类次之，估值类最小</li>\n<li><strong>数据挖掘排除</strong>：1,000 个伪异象中仅 7.8% 与市场状态相关（预期 5%），且无方向偏好；真实异象 37.6% 的显著比例远超此基准</li>\n<li><strong>假说支持</strong>：结果强烈支持误定价假说（特别是反应不足机制），不支持风险补偿假说（异象在坏时期更好，与风险补偿预测相反）</li>\n</ul>\n<h2>创新点</h2>\n<p>1. 跨国大规模验证（57 国 × 133 异象），远超以往研究规模</p>\n<p>2. 空头端分解揭示了市场状态效应的来源</p>\n<p>3. 伪异象蒙特卡洛检验为数据挖掘假说提供了量化基准</p>\n<p>4. 同时检验多种市场状态指标（200MA、UP、GDP 衰退）和情绪控制</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>200MA 定义的主观性</strong>：市场状态指标的选择可能影响结果，虽然做了替代指标稳健性检验</li>\n<li><strong>异象构建偏差</strong>：250 个候选中仅保留 133 个显著异象，存在存活偏差（虽然做了伪异象检验部分缓解）</li>\n<li><strong>价值加权 vs 等权</strong>：价值加权可能低估小盘效应，而小盘异象可能在坏时期更显著</li>\n<li><strong>因果推断</strong>：异象在坏时期更好并不直接证明是误定价（风险补偿假说的预测依赖于具体的风险模型设定）</li>\n<li><strong>样本期局限</strong>：2019 年结束，未覆盖 COVID-19 和 2022 年加息周期</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>：需 Refinitiv Datastream/Worldscope（商业数据库），非公开免费数据</li>\n<li><strong>方法清晰度</strong>：回归模型简单明了，异象构建方法标准化，可参照 Jacobs &amp; Müller (2018)</li>\n<li><strong>计算成本</strong>：低——OLS 回归为主，无重型计算</li>\n<li><strong>综合评分</strong>: ★3.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>中等优先级。核心发现（异象在坏时期更好 + 空头端主导）对量化策略有实际意义：(1) 可用 A 股数据验证类似模式；(2) 异象策略在市场下行期的防御性价值值得量化；(3) 空头端贡献 92.9% 的发现提示应重视做空约束对异象收益的影响。建议用天软或 AKShare 获取 A 股数据，构建常见异象（价值、动量、规模等）并按 200MA 划分市场状态。</p>"}, {"key": "WPAXXIGP", "title": "Temporal Fusion Transformers for Interpretable Multi-horizon Time Series Forecasting", "year": "2020", "authors": "Bryan Lim, Sercan O. Arik, Nicolas Loeff…", "tags": ["Computer Science - Machine Learning", "Statistics - Machine Learning"], "venue": "", "abstract": "Multi-horizon forecasting problems often contain a complex mix of inputs -- including static (i.e. time-invariant) covariates, known future inputs, and other exogenous time series that are only observed historically -- without any prior information on how they interact with the target. While several deep learning models have been proposed for multi-step prediction, they typically comprise black-box models which do not account for the full range of inputs present in common scenarios. In this paper, we introduce the Temporal Fusion Transformer (TFT) -- a novel attention-based architecture which combines high-performance multi-horizon forecasting with interpretable insights into temporal dynamics. To learn temporal relationships at different scales, the TFT utilizes recurrent layers for local processing and interpretable self-attention layers for learning long-term dependencies. The TFT also uses specialized components for the judicious selection of relevant features and a series of gating layers to suppress unnecessary components, enabling high performance in a wide range of regimes. On a variety of real-world datasets, we demonstrate significant performance improvements over existing benchmarks, and showcase three practical interpretability use-cases of TFT.", "url": "http://arxiv.org/abs/1912.09363", "date_added": "2026-05-26", "summarized": true, "rating": "★3.5", "starred": false, "repro": "—", "summary_html": "<h1>Temporal Fusion Transformers for Interpretable Multi-horizon Time Series Forecasting</h1>\n<p>&gt; Zotero Key: <code>WPAXXIGP</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Bryan Lim (Oxford), Sercan O. Arik, Nicolas Loeff, Tomas Pfister (Google Cloud AI)</li>\n<li><strong>年份</strong>: 2020</li>\n<li><strong>出处</strong>: International Journal of Forecasting, 37(4):1748–1764</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.1912.09363</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/1912.09363</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/3YEBTTZQ/Lim 等 - 2020 - Temporal Fusion Transformers for Interpretable Multi-horizon Time Series Forecasting.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：实际多步长预测任务有多种异构输入（静态元数据、已知未来信息、历史外生序列），现有方法要么不考虑输入异构性，要么是黑箱模型，导致性能受限和预测不可解释。</li>\n<li><strong>方法</strong>：Temporal Fusion Transformer（TFT）——变量选择网络自动识别相关输入 + 静态协变量编码器注入上下文 + LSTM 编解码器 + 可解释多头注意力（共享 value 权重）+ 分位数输出。</li>\n<li><strong>结论</strong>：在零售、交通、电力、波动率数据集上 P50/P90 分位数损失显著优于 DeepAR/LSTM/MQRNN 等基线；变量选择和注意力权重提供可解释性（识别重要变量、周期模式、事件时刻）。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>实际多步长预测任务通常有多种不同类型的输入：静态元数据（如店铺位置）、已知未来信息（如节假日）、历史外生序列（如客流量），且缺乏关于它们如何交互的先验知识。现有方法要么不考虑输入异构性，要么是&quot;黑箱&quot;模型，导致两个问题：(1) 性能受限于架构与数据特性不匹配；(2) 预测不可解释，用户难以信任和调试。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 零售销量、交通流量、电力负荷、波动率等</li>\n<li><strong>频率</strong>: 小时级/日级</li>\n<li><strong>样本区间</strong>: 各标准数据集</li>\n<li><strong>数据来源</strong>: UCI Retail、Traffic、Electricity、OMI 波动率等公开数据集</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>TFT 的核心组件：</p>\n<p><strong>1. 变量选择网络（VSN）</strong>：对静态协变量和时序输入分别用门控残差网络（GRN）+ softmax 特征选择，自动识别相关输入，抑制噪声变量。</p>\n<p>$$\\text{GRN}(a, c) = \\text{LayerNorm}(a + \\text{Dropout}(g \\cdot \\eta_1 + (1-g) \\cdot \\eta_2))$$</p>\n<p>其中 $g = \\sigma(W_g a + b_g)$ 为门控，$c$ 为上下文向量。</p>\n<p><strong>2. 静态协变量编码器</strong>：将静态特征编码为四个上下文向量，分别注入 VSN、LSTM 初始状态和注意力层。</p>\n<p><strong>3. LSTM 编解码器</strong>：局部时序处理，编码历史并生成未来初始预测。</p>\n<p><strong>4. 可解释多头注意力</strong>：修改标准 Transformer 注意力，使每个头共享 value 权重，从而每个头的注意力模式可直接解释。</p>\n<p>$$\\text{InterpretableMultiHead}(Q, K, V) = \\tilde{H} W_H, \\quad \\tilde{H} = \\{\\text{Attention}(Q W_Q^{(h)}, K W_K^{(h)}, V W_V)\\}_{h=1}^{m_H}$$</p>\n<p><strong>5. 分位数输出</strong>：输出预测分位数（如 P10/P50/P90），提供预测区间。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>在 Retail、Traffic、Electricity、Volatility 四个数据集上，TFT 的 P50/P90 分位数损失显著优于 DeepAR、DeepSSM、LSTM、MQRNN 等基线。</li>\n<li>变量选择：学到的特征权重能帮助识别全局重要变量（如零售中的价格、交通中的星期几）。</li>\n<li>时间模式：注意力权重揭示了持续的周期模式（如交通的早晚高峰）。</li>\n<li>事件识别：注意力突出显示显著事件时刻（如波动率数据集中的金融危机期间）。</li>\n<li>消融实验：VSN、门控和 LSTM 编码器各自带来显著提升。</li>\n</ul>\n<h2>创新点</h2>\n<p>1. 首次将静态协变量、已知未来输入、观测外生序列三类异构输入统一在一个模型中</p>\n<p>2. VSN + GRN 门控机制实现了样本级自适应的特征选择和网络深度控制</p>\n<p>3. 可解释多头注意力的设计（共享 value 权重）</p>\n<p>4. 分位数回归输出天然提供预测不确定性</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>LSTM 编码器限制了长程依赖的捕捉能力（相比纯 Transformer）</li>\n<li>主要针对低频/中等频率预测，未经高频金融数据验证</li>\n<li>金融时序中静态协变量的概念较弱（股票不会有&quot;位置&quot;这类元数据）</li>\n<li>可解释性依赖注意力机制的可信度，近年文献对注意力的可解释性有争议</li>\n<li>分位数回归不直接优化组合层面的风险/收益指标</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 全部公开数据集，官方 PyTorch 实现开源（google-research/tft）</li>\n<li><strong>方法清晰度</strong>: 期刊长文，每个组件描述详尽</li>\n<li><strong>计算成本</strong>: 中等 — LSTM+Attention，单 GPU 可训练</li>\n<li><strong>综合评分</strong>: ★3.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>TFT 的变量选择网络和可解释性机制对量化研究有参考价值——例如在数百个候选因子中选择真正有预测力的子集并解释其时间模式。但其设计（静态协变量、LSTM 编码器）更偏商业预测场景。若要在金融中应用，建议保留 VSN + 可解释注意力的核心设计，替换 LSTM 为更适合金融时序的编码器。</p>"}, {"key": "EFR8V2SF", "title": "Neural Network-based Automatic Factor Construction", "year": "2020", "authors": "Jie Fang, Jianwu Lin, Shutao Xia…", "tags": ["Computer Science - Machine Learning", "Quantitative Finance - Statistical Finance"], "venue": "", "abstract": "Instead of conducting manual factor construction based on traditional and behavioural finance analysis, academic researchers and quantitative investment managers have leveraged Genetic Programming (GP) as an automatic feature construction tool in recent years, which builds reverse polish mathematical expressions from trading data into new factors. However, with the development of deep learning, more powerful feature extraction tools are available. This paper proposes Neural Network-based Automatic Factor Construction (NNAFC), a tailored neural network framework that can automatically construct diversified financial factors based on financial domain knowledge and a variety of neural network structures. The experiment results show that NNAFC can construct more informative and diversified factors than GP, to effectively enrich the current factor pool. For the current market, both fully connected and recurrent neural network structures are better at extracting information from financial time series than convolution neural network structures. Moreover, new factors constructed by NNAFC can always improve the return, Sharpe ratio, and the max draw-down of a multi-factor quantitative investment strategy due to their introducing more information and diversification to the existing factor pool.", "url": "http://arxiv.org/abs/2008.06225", "date_added": "2026-05-26", "summarized": true, "rating": "★3.0", "starred": false, "repro": "—", "summary_html": "<h1>Neural Network-based Automatic Factor Construction</h1>\n<p>&gt; Zotero Key: <code>EFR8V2SF</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Jie Fang, Jianwu Lin, Shutao Xia, Yong Jiang, Zhikang Xia, Xiang Liu (清华大学)</li>\n<li><strong>年份</strong>: 2020</li>\n<li><strong>出处</strong>: Quantitative Finance, Vol. 08, No. 15, 2020</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2008.06225</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2008.06225</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/KFRQXLXR/Fang 等 - 2020 - Neural Network-based Automatic Factor Construction.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：传统因子构建依赖人工定义，遗传编程（GP）自动生成的公式因子高度相似且表达能力受限</li>\n<li><strong>方法</strong>：提出 NNAFC 框架，用全连接、RNN（LSTM）、CNN 三种神经网络自动从金融时序中构建新因子，替代 GP</li>\n<li><strong>结论</strong>：NNAFC 因子比 GP 更具信息量和多样性，加入现有因子池后收益率、夏普比率、最大回撤三项指标持续改善；FC 和 RNN 优于 CNN</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>传统因子构建依赖人工定义（如 Fama-French 五因子、Barra 模型），耗时且难以从高维数据中发现非线性因子。遗传编程（GP）虽能自动生成公式因子，但：(1) 演化出的公式高度相似、输出相关性高；(2) 表达能力受限于公式形式。深度学习的兴起提供了更强大的自动特征提取能力，但此前未被系统性地用于金融因子构建。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: A 股（具体成分未列明，推测沪深 300 范围）</li>\n<li><strong>频率</strong>: 日频</li>\n<li><strong>样本区间</strong>: 约 2013-2018</li>\n<li><strong>数据来源</strong>: 中国 A 股市场交易数据和财务数据</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>NNAFC 的核心思路：将每个神经网络视为一个&quot;因子生成器&quot;，网络的输出即为新因子值。</p>\n<p><strong>三种子架构</strong>：</p>\n<p>1. <strong>FC-NN</strong>：全连接网络，输入为经过金融知识预处理的特征向量</p>\n<p>2. <strong>RNN-NN</strong>：LSTM 网络，输入为标准化的时序特征序列，天然捕捉时序依赖</p>\n<p>3. <strong>CNN-NN</strong>：1D 卷积网络，在时间窗口上滑动提取局部模式</p>\n<p><strong>因子构造流程</strong>：</p>\n<p>1. 用金融领域知识对原始数据预处理（对齐、缺失填充、标准化）</p>\n<p>2. 基于神经网络拟合未来收益</p>\n<p>3. 将网络中间层输出或最终预测值作为构造的新因子</p>\n<p>4. 通过组合不同的网络架构和随机种子实现因子多样性</p>\n<p><strong>评估方法</strong>：新因子与现有因子池合并，构建 IC 加权或等权多因子组合，对比加入前后的策略表现。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>NNAFC 构造的因子比 GP 更具信息量和多样性</li>\n<li>对于 A 股市场，FC 和 RNN 结构优于 CNN——时序依赖比局部模式更重要</li>\n<li>将 NNAFC 因子加入现有因子池后，<strong>收益率、夏普比率、最大回撤</strong>三项指标持续改善</li>\n<li>因子多样性是关键贡献——不同架构学习不同方面的信息</li>\n</ul>\n<h2>创新点</h2>\n<p>1. 首次系统性地将多种神经网络作为自动因子构造工具，与 GP 做 head-to-head 对比</p>\n<p>2. 明确了不同网络结构在金融因子构造中的适用性差异（FC/RNN &gt; CNN）</p>\n<p>3. 证明了深度因子对现有因子池的增量贡献（而非简单替代）</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>实验规模和数据细节（股票数、时间段）不够透明</li>\n<li>未明确给出具体 Sharpe/收益数字，结论偏定性</li>\n<li>因子可解释性有限——神经网络的输出难以追溯经济逻辑</li>\n<li>仅 A 股实验，未跨市场验证</li>\n<li>过拟合风险：在有限的 A 股历史上调参可能捕获噪音</li>\n<li>IC 加权组合未考虑真实交易约束</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: A 股日频数据可通过公开渠道获取</li>\n<li><strong>方法清晰度</strong>: 中等 — 框架思路清晰但实现细节（如中间层选取策略）不够具体</li>\n<li><strong>计算成本</strong>: 低至中等 — 日频数据，全连接/RNN 训练成本不高</li>\n<li><strong>综合评分</strong>: ★3.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>NNAFC 的核心思想(&quot;神经网络输出当因子用&quot;)直观且易实现，但论文的实现细节不够充分。最小可行版本：选取若干经典风格因子（momentum/value/size 等），训练一个简单 MLP/LSTM 预测下期收益，取网络输出作为&quot;深度因子&quot;，用 IC 评估其增量信息，再与基准因子池对比多因子组合表现。</p>"}, {"key": "YSFTYNGL", "title": "Enhancing Time Series Momentum Strategies Using Deep Neural Networks", "year": "2020", "authors": "Bryan Lim, Stefan Zohren, Stephen Roberts", "tags": ["Quantitative Finance - Trading and Market Microstructure", "Computer Science - Machine Learning", "Statistics - Machine Learning"], "venue": "", "abstract": "While time series momentum is a well-studied phenomenon in finance, common strategies require the explicit definition of both a trend estimator and a position sizing rule. In this paper, we introduce Deep Momentum Networks -- a hybrid approach which injects deep learning based trading rules into the volatility scaling framework of time series momentum. The model also simultaneously learns both trend estimation and position sizing in a data-driven manner, with networks directly trained by optimising the Sharpe ratio of the signal. Backtesting on a portfolio of 88 continuous futures contracts, we demonstrate that the Sharpe-optimised LSTM improved traditional methods by more than two times in the absence of transactions costs, and continue outperforming when considering transaction costs up to 2-3 basis points. To account for more illiquid assets, we also propose a turnover regularisation term which trains the network to factor in costs at run-time.", "url": "http://arxiv.org/abs/1904.04912", "date_added": "2026-05-26", "summarized": true, "rating": "★4.5", "starred": false, "repro": "复现中", "summary_html": "<h1>Enhancing Time Series Momentum Strategies Using Deep Neural Networks</h1>\n<p>&gt; Zotero Key: <code>YSFTYNGL</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Bryan Lim, Stefan Zohren, Stephen Roberts (Oxford-Man Institute)</li>\n<li><strong>年份</strong>: 2020</li>\n<li><strong>出处</strong>: Journal of Financial Data Science, 2019 / arXiv:1904.04912</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.1904.04912</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/1904.04912</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/FRV9JT4T/Lim 等 - 2020 - Enhancing Time Series Momentum Strategies Using Deep Neural Networks.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：TSMOM 的趋势估计与头寸映射需显式分步设计、各家差异大，能否端到端学习并直接以夏普比率为优化目标？</li>\n<li><strong>方法</strong>：Deep Momentum Networks（DMN）——用 LSTM 同时替代趋势估计与头寸管理，训练目标直接最大化夏普比率 $\\mathcal{L}=-\\mathbb{E}[R_t]/\\sqrt{\\mathrm{Var}[R_t]}$，加换手率正则把交易成本内化，保留波动率缩放。</li>\n<li><strong>结论</strong>：在 88 个连续期货上，无成本时夏普较传统 TSMOM 翻倍（~0.5→1.0+），含 2–3bps 成本仍优于传统方法；换手率正则有效降频，LSTM 学到类自适应 MACD 的多周期趋势加权。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>时序动量策略虽经典，但实现细节差异巨大——趋势估计的方法（移动平均 / 突破 / MACD）和头寸映射（固定阈值 / 波动率缩放）都需要显式定义。传统方法将两个步骤分开设计，而深度网络可以同时学习趋势估计和仓位映射，且能以夏普比率（而非 MSE）为直接优化目标。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 88 个连续商品期货合约（股指、固收、外汇、商品四大类）</li>\n<li><strong>频率</strong>: 日频</li>\n<li><strong>样本区间</strong>: 约 2000-2018（按时间划分训练/验证/测试）</li>\n<li><strong>数据来源</strong>: Pinnacle Data / CSI Data 等期货数据库</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>DMN 架构</strong>：</p>\n<p>1. <strong>输入</strong>：过去的日收益率序列（标准化至目标波动率），可选包含 MACD 等传统信号</p>\n<p>2. <strong>LSTM 编码器</strong>：将历史收益序列编码为隐藏状态 $h_t$</p>\n<p>3. <strong>输出头</strong>：全连接层将 $h_t$ 映射为标量信号值 $s_t \\in [-1, 1]$</p>\n<p>4. <strong>波动率缩放</strong>：最终仓位 $p_t = s_t / \\sigma_t^{\\text{target}}$，确保目标波动率恒定</p>\n<p><strong>直接夏普最优化</strong>：训练目标不使用 MSE 或分类损失，而是直接最大化夏普比率：</p>\n<p>$$\\mathcal{L} = -\\frac{\\mathbb{E}[R_t]}{\\sqrt{\\text{Var}[R_t]}}$$</p>\n<p>通过自动微分反向传播梯度。</p>\n<p><strong>换手率正则化</strong>：引入</p>\n<p>$$\\mathcal{L}_{\\text{reg}} = \\mathcal{L}_{\\text{Sharpe}} + \\lambda \\cdot \\text{Turnover}$$</p>\n<p>惩罚高换手，使网络在训练时即&quot;意识到&quot;交易成本，适应流动性较差的品种。</p>\n<p><strong>对比基线</strong>：TSMOM（经典 Moskowitz 方法）、MACD 信号、纯波动率缩放等。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>无成本</strong>：夏普最优 LSTM 将传统 TSMOM 的夏普比率提升超过 <strong>2 倍</strong>（例如从 ~0.5 到 ~1.0+）</li>\n<li><strong>含成本</strong>：在 2-3 bps 交易成本下 DMN 仍优于传统方法</li>\n<li><strong>换手率正则化</strong>有效降低交易频率，使 DMN 在更高成本环境下保持竞争力</li>\n<li><strong>趋势学习</strong>：分析 LSTM 隐藏状态发现网络学会了对不同周期趋势的加权组合，类似自适应 MACD</li>\n<li><strong>跨资产泛化</strong>：在四大类期货上均有提升，不限于特定品种</li>\n</ul>\n<h2>创新点</h2>\n<p>1. 首次将 Sharpe 直接作为神经网络的训练损失函数（而非后验指标）</p>\n<p>2. 端到端学习——同时替代趋势估计和头寸管理</p>\n<p>3. 换手率正则化在训练阶段内化交易成本约束</p>\n<p>4. 保留了波动率缩放框架，使网络专注于信号生成</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>日频动量在近年的表现已有退化（2020 年后的样本未包含）</li>\n<li>Sharpe 直接优化在小样本上容易过拟合（通过训练期间的 batch 设计缓解）</li>\n<li>LSTM 的可解释性仍有限——只对隐藏状态做了方向性分析</li>\n<li>仅连续期货，未测试股票/ETF</li>\n<li>88 个期货中部分高相关性品种可能 inflate 统计显著性</li>\n<li>波动率缩放假设了目标波动率为常数，在急剧变化的市场中可能失效</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 期货日线数据可通过 Bloomberg/天软获取</li>\n<li><strong>方法清晰度</strong>: 架构和训练方法描述清楚，附录有详细超参</li>\n<li><strong>计算成本</strong>: 低 — LSTM + 日频数据，单 GPU 几分钟完成训练</li>\n<li><strong>综合评分</strong>: ★4.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>是时序动量的深度学习方法论标杆，直接夏普优化和换手率正则化两个机制可轻松迁移到其他策略。最小可行版本：选取 10-20 个主要商品期货日线，实现 LSTM + Sharpe loss + 波动率缩放的 DMN，对比 TSMOM 基准。</p>"}, {"key": "G276AUFW", "title": "Building Cross-Sectional Systematic Strategies By Learning to Rank", "year": "2020", "authors": "Daniel Poh, Bryan Lim, Stefan Zohren…", "tags": ["Machine Learning", "Deep Neural Networks", "Information Retrieval", "Learning to Rank", "Momentum Strategies", "Portfolio Construction", "Systematic Trading"], "venue": "", "abstract": "The success of a cross-sectional systematic strategy depends critically on accurately ranking assets prior to portfolio construction. Contemporary techniques perform this ranking step either with simple heuristics or by sorting outputs from standard regression or classification models, which have been demonstrated to be sub-optimal for ranking in other domains (e.g. information retrieval). To address this deficiency, we propose a framework to enhance cross-sectional portfolios by incorporating learning-to-rank algorithms, which lead to improvements of ranking accuracy by learning pairwise and listwise structures across instruments. Using cross-sectional momentum as a demonstrative case study, we show that the use of modern machine learning ranking algorithms can substantially improve the trading performance of cross-sectional strategies -- providing approximately threefold boosting of Sharpe Ratios compared to traditional approaches.", "url": "https://papers.ssrn.com/abstract=3751012", "date_added": "2026-05-24", "summarized": true, "rating": "★4", "starred": false, "repro": "—", "summary_html": "<h1>Building Cross-Sectional Systematic Strategies By Learning to Rank</h1>\n<p>&gt; Zotero Key: <code>G276AUFW</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>:Daniel Poh, Bryan Lim, Stefan Zohren, Stephen Roberts</li>\n<li><strong>年份</strong>:2020</li>\n<li><strong>出处</strong>:SSRN (Oxford-Man Institute)</li>\n<li><strong>DOI</strong>:无</li>\n<li><strong>链接</strong>:https://papers.ssrn.com/abstract=3751012</li>\n<li><strong>本地 PDF</strong>:<code>~/Developer/Zotero/storage/RIMNB2EA/Poh 等 - 2020 - Building Cross-Sectional Systematic Strategies By Learning to Rank.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：截面策略的核心是准确排序资产，但传统回归模型的 MSE 损失只关心预测精度，不关心排序正确性，是次优的。</li>\n<li><strong>方法</strong>：将信息检索领域的 Learning-to-Rank 算法（RankNet、LambdaMART、ListNet、ListMLE）引入截面动量策略，直接优化排序质量，在 NYSE 股票 1980—2019 年月频数据上对比。</li>\n<li><strong>结论</strong>：LambdaMART 表现最优，Sharpe 2.16（传统经典动量 0.55—0.70），月收益 35.9%，最大回撤 23.1%，胜率 76.2%，排序质量 NDCG@100 达 0.576。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>截面策略(如截面动量)的核心在于准确排序资产:买入排名靠前的、卖出排名靠后的。现有方法要么用简单启发式(如 Jegadeesh &amp; Titman 的直接累积收益排序),要么用回归模型预测收益后再排序(regress-then-rank)。但回归模型的 MSE 损失只关心预测精度,不关心排序正确性——这在信息检索领域已被证明是次优的。本文首次将 LTR 算法系统性地引入截面系统化策略,提出通用框架。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>:NYSE 上市股票(CRSP share code 10&amp;11),剔除$1 以下股票</li>\n<li><strong>频率</strong>:月频调仓(每个交易日都不交易,避免高频交易成本)</li>\n<li><strong>样本区间</strong>:1980-2019;5 年滚窗重调参数(1980-1984 训练→1985-1989 测试,以此类推)</li>\n<li><strong>数据来源</strong>:CRSP 日频收盘价</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>通用截面策略框架</strong>分为 4 步:</p>\n<p>1. <strong>Score Calculation</strong>:模型 f 对资产 i 给出评分 Y_i</p>\n<p>2. <strong>Score Ranking</strong>:按评分排序得到 Z_i</p>\n<p>3. <strong>Security Selection</strong>:选前后各 10%(固定 100 只多/空)</p>\n<p>4. <strong>Portfolio Construction</strong>:波动率缩放至年化 15% 目标波动</p>\n<p><strong>评分方法对比</strong>:</p>\n<p>1. <strong>经典动量</strong>(Jegadeesh &amp; Titman, 1993):直接用过去 12 个月累积收益作为评分</p>\n<p>2. <strong>经典动量</strong>(Baz et al., 2015):用波动率归一化的 MACD 指标组合作为评分</p>\n<p>3. <strong>Regress-then-Rank(MLP)</strong>:用多层感知器预测未来 21 天收益,MSE 损失</p>\n<p>4. <strong>Pairwise LTR</strong>:</p>\n<p>   - RankNet:对资产对(pair)做交叉熵损失,判断哪只应该排名更高</p>\n<p>   - LambdaMART:结合 LambdaRank 梯度和 MART 树提升,可优化 NDCG 等不可微指标</p>\n<p>5. <strong>Listwise LTR</strong>:</p>\n<p>   - ListNet:用 softmax 计算&quot;top-one&quot;概率分布,交叉熵损失</p>\n<p>   - ListMLE:最大化似然损失,理论性质更好(一致、凸、可微)</p>\n<p><strong>预测因子</strong>(16 维):</p>\n<ul>\n<li>过去 3/6/12 个月原始累积收益</li>\n<li>过去 3/6/12 个月波动率归一化收益</li>\n<li>MACD 指标(8/24,16/48,32/96 三组)及其过去 1/3/6/12 个月的滞后值</li>\n</ul>\n<p><strong>训练细节</strong>:</p>\n<ul>\n<li>超参数用 HyperOpt 做 50 次搜索</li>\n<li>Adam 优化器,早停机制(25 个 epoch 无改善则停)</li>\n<li>2 层隐藏层,宽度为超参数</li>\n<li>Dropout 正则化</li>\n</ul>\n<h2>核心结论与关键结果</h2>\n<p><strong>全样本(年化 15% 波动归一化,不考虑交易成本)</strong>:</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>模型</th><th>期望月收益</th><th>Sharpe</th><th>最大回撤</th><th>Sortino</th><th>Calmar</th><th>胜率</th></tr>\n<tr><td>随机</td><td>2.4%</td><td>0.16</td><td>58.4%</td><td>0.23</td><td>0.04</td><td>54.5%</td></tr>\n<tr><td>JT 经典</td><td>9.2%</td><td>0.55</td><td>32.8%</td><td>0.87</td><td>0.28</td><td>58.2%</td></tr>\n<tr><td>Baz MACD</td><td>11.2%</td><td><strong>0.70</strong></td><td>33.7%</td><td>1.16</td><td>0.33</td><td>59.1%</td></tr>\n<tr><td>MLP 回归</td><td>4.4%</td><td>0.27</td><td>64.1%</td><td>0.39</td><td>0.07</td><td>55.1%</td></tr>\n<tr><td>RankNet</td><td>24.3%</td><td>1.50</td><td>29.4%</td><td>3.01</td><td>0.83</td><td>69.3%</td></tr>\n<tr><td><strong>LambdaMART</strong></td><td><strong>35.9%</strong></td><td><strong>2.16</strong></td><td><strong>23.1%</strong></td><td><strong>5.32</strong></td><td><strong>1.56</strong></td><td><strong>76.2%</strong></td></tr>\n<tr><td>ListNet</td><td>30.6%</td><td>1.97</td><td>27.4%</td><td>4.47</td><td>1.12</td><td>71.5%</td></tr>\n<tr><td>ListMLE</td><td>26.0%</td><td>1.61</td><td>23.6%</td><td>3.65</td><td>1.10</td><td>68.1%</td></tr>\n</table></div>\n<p><strong>排序质量指标</strong>:</p>\n<ul>\n<li>NDCG@100:LambdaMART 0.576(多),0.585(空),显著高于基线</li>\n<li>Kendall&#x27;s Tau:LambdaMART 0.032,ListNet 0.033,基线仅 0.008-0.016</li>\n</ul>\n<p><strong>十分组表现</strong>:LTR 方法的组间区分度显著更强(decile 1 到 decile 10 的 Sharpe 从 0.075/0.263 上升到 1.232/1.238),验证了排序质量与策略表现的直接关联。</p>\n<p><strong>关键发现</strong>:</p>\n<ul>\n<li>LambdaMART 是表现最优的 LTR 模型(树模型天然适合中小样本)</li>\n<li>Listwise 方法(ListNet/ListMLE)并未显著优于 Pairwise(LambdaMART),可能因为金融数据信噪比低,listwise 需要更多样本</li>\n<li>MLP(regress-then-rank)仅略优于随机,证明 MSE 损失对排序目标的次优性</li>\n<li>LTR 约三倍提升 Sharpe(从 0.70 到 2.16)</li>\n</ul>\n<h2>创新点</h2>\n<p>1. <strong>首次将 LTR 系统应用于截面动量策略</strong>:提供通用框架,不限于动量因子</p>\n<p>2. <strong>模块化设计</strong>:预测因子可替换为其他特征(价值、carry 等),框架通用</p>\n<p>3. <strong>全面的对比实验</strong>:覆盖经典启发式、回归方法、pairwise/listwise LTR,含排序质量和财务指标</p>\n<p>4. <strong>验证排序质量与策略表现的直接因果链</strong></p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>未考虑交易成本</strong>:所有结果都是毛收益,高频调仓(月频)下成本不可忽视</li>\n<li><strong>仅美股</strong>:未验证跨资产类别的泛化性</li>\n<li><strong>仅截面动量</strong>:虽然宣称框架通用,但案例仅动量</li>\n<li><strong>数据量有限</strong>:listwise 方法样本不足(单月仅 N_avg 只股票),可能影响比较公平性</li>\n<li><strong>较旧(2020)</strong>:之后深度学习排序方法有新的进展</li>\n<li><strong>特征限于价量</strong>:未包含基本面、另类数据</li>\n<li><strong>过拟合风险</strong>:LambdaMART 的树模型容易过拟合,虽然 5 年滚窗有缓解</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>:美股 CRSP 数据不可直接获取,但可用天软国内股票数据替代测试</li>\n<li><strong>方法清晰度</strong>:非常清晰,含完整框架、损失函数、超参数搜索空间</li>\n<li><strong>计算成本</strong>:低。MLP 和 LTR 模型训练成本很低,CPU 即可</li>\n<li><strong>综合评分</strong>:★★★★☆(想法好实现成本低,但 2020 年论文不是最新)</li>\n</ul>\n<h2>复现备注</h2>\n<p>若决定复现:</p>\n<p>1. <strong>最简版本</strong>:用天软数据,选国内期货品种,构造截面动量信号</p>\n<p>2. <strong>直接调用</strong>:Python 的 XGBoost 库直接支持 LambdaMART(objective=&#x27;rank:pairwise&#x27;, eval_metric=&#x27;ndcg&#x27;)</p>\n<p>3. <strong>推荐用 LambdaMART</strong>:树模型对金融数据信噪比更稳健</p>\n<p>4. 可放在 （内部研究目录） 下</p>"}, {"key": "MKTV652G", "title": "Skew and Trend Aversion", "year": "2019", "authors": "Zack Dugan, Alexander Greyserman", "tags": ["skew", "trend following", "behavioral biases", "loss aversion", "portfolio optimization", "recency bias"], "venue": "", "abstract": "Despite evidence of the benefits to portfolio Sharpe ratio and variance, actual investor allocations to Trend Following strategies are typically 5% or less. Why is there such a significant discrepancy between the optimal allocation and actual allocation to Trend? We investigate known behavioral biases as a potential reason.  While decision makers have other reasons to exclude Trend Following from their portfolios, in this paper, we explore loss aversion, recency bias, and the ambiguity effect as they pertain to Trend Following, and we call the combination of the three Trend Aversion. We quantify Trend Aversion and show that these biases are a viable explanation for suboptimal allocations to Trend. We demonstrate a direct connection between quantifications of known behavioral biases and current suboptimal allocations to Trend Following. Recognition of these relationships will help highlight the pitfalls of behavioral biases.", "url": "https://papers.ssrn.com/abstract=3315719", "date_added": "2026-07-29", "summarized": true, "rating": "★3.5", "starred": false, "repro": "—", "summary_html": "<h1>Skew and Trend Aversion</h1>\n<p>&gt; Zotero Key: <code>MKTV652G</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>:Zack Dugan, Alexander Greyserman</li>\n<li><strong>年份</strong>:2019</li>\n<li><strong>出处</strong>:Journal of Alternative Investments</li>\n<li><strong>DOI</strong>:—</li>\n<li><strong>链接</strong>:https://papers.ssrn.com/abstract=3315719</li>\n<li><strong>本地 PDF</strong>:<code>~/Developer/Zotero/storage/G8B9E2TV/Dugan和Greyserman - 2019 - Skew and Trend Aversion.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：尽管趋势跟踪策略能显著提升组合夏普比率并降低方差，但投资者实际配置通常不超过 5%，这种显著偏差的原因是什么？</li>\n<li><strong>方法</strong>：量化分析损失厌恶、近因偏差和模糊厌恶三种行为偏差对趋势跟踪配置的影响，构建不同组合结构下的损失乘数与配置比例关系。</li>\n<li><strong>结论</strong>：损失乘数在 1.5-2.5 之间时，最优趋势配置降至 5%；损失厌恶可导致夏普比率损失高达 50%；近因偏差和损失厌恶共同作用进一步压低配置。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>趋势跟踪策略（时间序列动量）具有长期正收益记录、与股市低相关性以及危机时期正收益等优点，但投资者实际配置极低。本文试图从行为金融学角度解释这一偏差，提出&quot;趋势厌恶&quot;（Trend Aversion）概念，即损失厌恶、近因偏差和模糊厌恶三种偏差的组合。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>：S&amp;P500、MSCI World EX-US、JPMorgan 全球债券指数、MSCI US REIT 指数、LPX50、瑞信固定收益套利/事件驱动/全球宏观/多空股票指数、SG 趋势指数、CRB 商品指数</li>\n<li><strong>频率</strong>：月度</li>\n<li><strong>样本区间</strong>：2000年1月 - 2017年9月</li>\n<li><strong>数据来源</strong>：SG Trend Index、BTOP CTA Index、Barclay Hedge、MSCI、JPMorgan、CRB</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[原始资产收益数据] --&gt; B[损失乘数调整&lt;br/&gt;对趋势收益施加λ]\n  B --&gt; C[组合优化&lt;br/&gt;夏普最大化/方差最小化]\n  C --&gt; D[最优趋势配置比例]\n  D --&gt; E[对比实际5%配置&lt;br/&gt;反推损失乘数λ]\n  E --&gt; F[量化行为偏差影响]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>数据构建</strong>：构造包含趋势跟踪和 10 类资产的组合，月度收益数据，波动率标准化。</p>\n<p>2. <strong>损失厌恶量化</strong>：对趋势跟踪收益流施加损失乘数 λ，使亏损月份收益乘以 λ 倍，盈利月份不变，模拟投资者心理上对损失的放大效应。</p>\n<p>3. <strong>组合优化</strong>：使用 SLSQP 方法最小化组合方差或最大化夏普比率，单资产配置上限 30%，滚动窗口 18 个月。</p>\n<p>4. <strong>配置比例分析</strong>：计算不同 λ 值下最优趋势配置比例，反推 5% 配置对应的 λ 值，与心理学文献中 λ≈2 的标准对比。</p>\n<p>5. <strong>近因偏差分析</strong>：以回望窗口长度作为近因偏差代理变量，短窗口对应高近因偏差，分析窗口长度与趋势配置比例的关系。</p>\n<p>6. <strong>组合偏差交互</strong>：同时变动损失乘数和回望窗口，分析两种偏差的联合影响。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>无损失厌恶时，两资产组合最优趋势配置为 57%，11 资产组合为 36%</li>\n<li>5% 配置对应的损失乘数为 1.8-2.0，与心理学文献中 λ≈2 高度一致</li>\n<li>损失乘数达 1.5 时夏普损失 10%，达 1.75 时损失 25%，达 2.0 时损失 40%</li>\n<li>回望窗口短于 2 年时趋势配置急剧下降</li>\n<li>两种偏差共同作用时，即使 λ=3 也难以将配置降至 5%</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次将&quot;趋势厌恶&quot;作为行为偏差组合概念提出</li>\n<li>建立了心理学损失厌恶系数与趋势跟踪配置比例之间的定量关系</li>\n<li>使用 50,000 个随机组合验证了结论的普遍性</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>仅用月频数据，日频或更高频可能有不同结论</li>\n<li>损失乘数是简化假设，真实行为偏差可能更复杂</li>\n<li>未考虑交易成本、滑点等实际约束</li>\n<li>仅使用指数代理变量，实际 CTA 组合可能有差异</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>：中等，需要 Trend Following 指数数据（SG Trend Index、BTOP50），部分指数需付费</li>\n<li><strong>方法清晰度</strong>：高，方法描述详细，优化设置明确</li>\n<li><strong>计算成本</strong>：低，主要为组合优化，无重型计算</li>\n<li><strong>综合评分</strong>:★3.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>核心方法为组合优化下损失乘数对配置比例的影响，最小可行版本可使用公开的 SG Trend Index 和 S&amp;P500 数据复现两资产组合部分。行为金融学视角对理解趋势跟踪配置障碍有实际价值。</p>"}, {"key": "HVRVA2IA", "title": "Relative Basis and the Expected Returns of Commodity Futures", "year": "2019", "authors": "Ming Gu, Wenjin Kang, Dong Lou…", "tags": ["commodity futures returns", "commodity markets", "convenience yield", "futures basis", "theory of storage"], "venue": "", "abstract": "We propose a novel measure, dubbed \"relative basis,\" to better capture the commodity convenience yield. Our measure is the difference between the traditional near-term basis and a similarly defined distant basis. This simple differencing purges out persistent commodity characteristics in traditional basis, such as storage and financing costs. Relative basis is closely tied to changes in physical inventories and dominates traditional basis in forecasting commodity futures returns. In contrast, relative basis does not forecast the returns of financial futures, which are not subject to inventory constraints. Our results provide new insights into the well-known relation between basis and expected futures returns.", "url": "https://papers.ssrn.com/abstract=3404561", "date_added": "2026-08-03", "summarized": true, "rating": "★4.5", "starred": false, "repro": "待复现", "summary_html": "<h1>Relative Basis and the Expected Returns of Commodity Futures</h1>\n<p>&gt; Zotero Key: <code>HVRVA2IA</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>:Ming Gu、Wenjin Kang、Dong Lou、Ke Tang</li>\n<li><strong>年份</strong>:2019(This Draft: July 2024)</li>\n<li><strong>出处</strong>:SSRN Working Paper(曾用标题 &quot;Relative Basis: A Better Measure of the Convenience Yield&quot;)</li>\n<li><strong>DOI</strong>:10.2139/ssrn.3404561</li>\n<li><strong>链接</strong>:https://papers.ssrn.com/abstract=3404561</li>\n<li><strong>本地 PDF</strong>:<code>~/Developer/Zotero/storage/XIT8KP8V/Gu 等 - 2019 - Relative Basis and the Expected Returns of Commodity Futures.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>:传统基差(near vs second-nearby 价差)被存储成本、融资成本等<strong>持续性成分</strong>污染,不是干净的便利收益(convenience yield)代理,预测能力来源不清。</li>\n<li><strong>方法</strong>:提出 <strong>relative basis(相对基差)</strong>= 近端基差(T1–T2)减远端基差(T2–T3),用一次差分把持续成分抵消掉,保留便利收益的快变冲击;在 24 个商品期货(1979–2019)上做 Fama-MacBeth 回归与三分组多空组合,与传统基差做 horse race。</li>\n<li><strong>结论</strong>:相对基差单独回归系数 0.019(t=3.44),加控制后仍 0.018(t=2.65),1 个标准差对应下月 <strong>+31 bps</strong>;三分组多空组合下月 <strong>81 bps</strong>(t=3.99)、下季度 <strong>2.71%</strong>(t=6.64),控制市场/动量/基差动量后 <strong>月 alpha 69 bps</strong>(t=3.48)。加入相对基差后<strong>传统基差预测力消失</strong>(−2 bps,t=−0.12)。相对基差<strong>不预测金融期货</strong>收益(内在无库存约束),支持&quot;预测力来自便利收益/库存&quot;这一解释。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>商品与股债不同,其价值由现货供需决定。存储理论(Theory of Storage)指出:商品短缺时持有现货有隐含收益(便利收益),且便利收益是库存的<strong>凸减函数</strong>——库存越低,边际便利收益越高且加速上升。</p>\n<p>文献惯用<strong>传统基差</strong>(第一近月与第二近月的对数价差,年化)代理便利收益。但按教科书公式,基差 = 便利收益 − 存储成本 − 融资成本。存储与融资成本因商品而异(天然气存储贵、黄金可作抵押物融资便宜),且<strong>高度持续、缓变</strong>,会长期污染基差,使其成为便利收益的&quot;脏&quot;代理。作者要在<strong>不依赖额外数据</strong>的前提下,把便利收益的快变冲击从持续成本里分离出来。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>:24 个商品期货(NYMEX/CBOT/CME),分能源、金属、软商品、谷物、活畜五组;另用一组金融期货(股指、外汇、利率)做对照。</li>\n<li><strong>频率</strong>:月度。</li>\n<li><strong>样本区间</strong>:期货价格 1979-01 至 2019-12;库存数据 1993-01 至 2018-12(受库存可得性限制)。</li>\n<li><strong>数据来源</strong>:期货价格来自 Commodity Systems Inc.;商业交易者持仓来自 CFTC 的 COT 报告;库存数据沿用 Gorton, Hayashi, and Rouwenhorst (2013) 口径。</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[各商品前三近月期货价格&lt;br/&gt;F_T1, F_T2, F_T3] --&gt; B[近端传统基差&lt;br/&gt;TradtBasis_T1T2]\n  A --&gt; C[远端传统基差&lt;br/&gt;TradtBasis_T2T3]\n  B --&gt; D[相对基差 RelatBasis&lt;br/&gt;= 近端 − 远端]\n  B --&gt; E[横截面回归 TradtBasis~RelatBasis]\n  D --&gt; E\n  E --&gt; F[残差基差 ResidBasis&lt;br/&gt;截距+残差, 持续成分]\n  D --&gt; G[下期收益 Fama-MacBeth 回归&lt;br/&gt;+动量/基差动量控制]\n  F --&gt; G\n  D --&gt; H[按相对基差三分组多空组合]\n  G --&gt; I[相对基差主导, 传统/残差基差失效]\n  H --&gt; I\n  D --&gt; J[金融期货对照 &amp; 正负相对基差非对称检验]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>输入</strong>:每个商品每月取前三张近月合约价格 $F_{i,t}(T1)$、$F_{i,t}(T2)$、$F_{i,t}(T3)$。月度超额收益用不在本月到期的最近合约计算:$ret_{i,t}=\\dfrac{F_{i,t}(T)-F_{i,t-1}(T)}{F_{i,t-1}(T)}$。</p>\n<p>2. <strong>传统基差</strong>:两个相邻合约的年化对数价差</p>\n<p>$$TradtBasis_{i,t}=\\frac{\\ln(F_{i,t}(T1))-\\ln(F_{i,t}(T2))}{T2-T1}.$$</p>\n<p>3. <strong>相对基差(核心构造)</strong>:近端基差减远端基差</p>\n<p>$$RelatBasis_{i,t}=\\frac{\\ln F_{i,t}(T1)-\\ln F_{i,t}(T2)}{T2-T1}-\\frac{\\ln F_{i,t}(T2)-\\ln F_{i,t}(T3)}{T3-T2}.$$</p>\n<p>理论支撑:由 $F=S\\exp[w-\\delta+r]$,近/远端基差都等于&quot;便利收益 − 融资成本 − 存储成本&quot;的时间缩放。因存储/融资成本高度持续($AR(1)$ 系数 $b\\approx1$),在近端与远端间大致抵消,故 $RelatBasis\\approx\\frac{1}{\\Delta T}[\\delta_t(T1,T2)-\\delta_t(T2,T3)]$,即<strong>当期便利收益与下期便利收益预期之差</strong>——只要便利收益比成本更快变(均值回复),差分就能把它剥离出来。无需假设冲击一期内完全消散。</p>\n<p>4. <strong>残差基差</strong>:每月横截面回归 $TradtBasis_{i,t}=a_t+b_t\\,RelatBasis_{i,t}+\\varepsilon_{i,t}$,定义 $ResidBasis$ = 截距+残差。于是传统基差被正交分解为相对基差(快变)+残差基差(慢变持续成分)。</p>\n<p>5. <strong>持续性检验</strong>:相对基差 $AR(1)=0.34$(高阶自相关不显著),传统基差 $AR(1)=0.68$(高阶仍 0.3–0.5)——证实相对基差抓住了快变成分。相对基差与传统基差相关 0.52、与基差动量 0.20、与价格动量/平滑对冲压力近乎 0。</p>\n<p>6. <strong>与库存挂钩</strong>:Fama-MacBeth 回归相对基差对滞后库存变化/水平:库存变化系数 −0.029(t=−5.55)、水平 −0.009(t=−3.87);拆成增/减后,库存<strong>减少</strong>系数 −0.038(t=−3.51)显著,库存<strong>增加</strong> −0.016 不显著——契合便利收益-库存的凸关系。残差基差与库存无关。</p>\n<p>7. <strong>收益预测(主结果)</strong>:$ret_{i,t+1}=a_t+b_{1,t}RelatBasis_{i,t}+b_{2,t}ResidBasis_{i,t}(\\text{或}TradtBasis)+\\lambda_t controls+\\varepsilon$,控制价格动量、基差动量。相对基差在 horse race 中主导。</p>\n<p>8. <strong>组合与对照</strong>:按各基差把商品分三分组,做等权多空(top−bottom);再做组合 spanning 检验与非对称检验(正/负相对基差分开)、金融期货对照、剔除贵金属稳健性。</p>\n<p>9. <strong>输出</strong>:相对基差是<strong>实时、市场化</strong>的便利收益/库存紧张度代理,给出可交易的月度多空信号,并把&quot;基差预测商品收益&quot;的经济来源归因到便利收益(库存)而非对冲需求风险溢价。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>Fama-MacBeth</strong>:相对基差单变量系数 0.019(t=3.44),加控制 0.018(t=2.65),1 SD → 下月 +31 bps;传统基差单变量 0.011(t=2.16),加控制后失效;残差基差单变量已不显著(0.010,t=1.43)。</li>\n<li><strong>组合</strong>:相对基差三分组多空下月 <strong>81 bps</strong>(t=3.99)、下季度 <strong>2.71%</strong>(t=6.64);控制市场/价格动量/基差动量后<strong>月 alpha 69 bps</strong>(t=3.48)。传统基差多空在完整设定下 alpha 仅 −2 bps(t=−0.12)。</li>\n<li><strong>非对称性</strong>:正相对基差(低库存)显著(1 SD → +81 bps),负相对基差不显著;正区间系数是负区间的 3 倍多——与凸关系一致。且经济扩张期预测力强于收缩期。</li>\n<li><strong>金融期货对照</strong>:相对基差对金融期货收益<strong>无预测力</strong>(0.013,t=0.11),而残差/传统基差对金融期货显著(残差基差 0.083,t=2.92)——说明商品里起作用的是库存/便利收益机制,金融期货里起作用的是慢变(如利差)成分(与 Koijen et al. 2018 的 carry 一致)。</li>\n<li><strong>稳健性</strong>:1979–1999 与 2000–2019 两子样本均显著;统一两月间隔识别近月、面板双向固定效应+聚类标准误、剔除贵金属(72 bps,t=3.14)、标准化基差等均稳健。</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>用<strong>一次差分</strong>这一极简、无需额外数据的操作,把传统基差里难观测且持续的存储/融资成本剥掉,得到更干净的便利收益代理。</li>\n<li>不依赖强统计假设(只需便利收益比成本更快变),经济解释直观;相对于用 HP 滤波取快变成分的做法更易实现与解释。</li>\n<li>用金融期货(无库存约束)作对照 + 正负非对称检验,把基差收益预测力的经济来源清晰归因到便利收益/库存,而非对冲压力风险溢价,为&quot;统一库存-便利收益-预期收益&quot;的新理论提供证据。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>需要第三近月</strong>:第三近月合约成交量/持仓仅为首近月的约 30%/43%,流动性较差,远端基差含噪更多,实盘取价与滑点需谨慎。</li>\n<li><strong>月度低频、样本 24 个品种</strong>:横截面窄,多空组合每腿仅 8 个品种,分散化有限,单品种事件驱动波动大。</li>\n<li><strong>交易成本</strong>:81 bps 的月度多空未充分扣除滚动、买卖价差与冲击成本;远端合约流动性差会侵蚀收益。</li>\n<li><strong>合约间隔不一致</strong>:多数商品两月间隔,部分能源逐月到期,近月定义口径需对齐(作者用附录稳健性处理),复现时定义细节敏感。</li>\n<li>便利收益无法直接观测,&quot;相对基差≈便利收益差&quot;依赖成本高度持续的假设,若某些商品成本本身波动大则分离不干净。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>:核心只需商品期货前三近月价格(月度即可),公开/商用数据源普遍可得,构造完全基于价格,无需库存/持仓即可复现主策略(机制检验才需 COT 与库存)。天软或常见期货数据库可支撑。</li>\n<li><strong>方法清晰度</strong>:相对基差公式、回归设定、组合构造、控制变量都写得很清楚,可直接照做;唯一需注意近月合约识别与滚动口径。</li>\n<li><strong>计算成本</strong>:极低,纯横截面回归+排序,无重型训练。</li>\n<li><strong>综合评分</strong>:★4.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>最小可行版本:取一篮子流动商品期货前三近月月末价 → 按式(3)算相对基差 → 每月按相对基差三分组做等权多空,统计下月/下季收益与 t 值,先复现 81 bps / 2.71% 量级。关键风险点:(1)近月合约识别与滚动规则要统一(两月 vs 逐月到期品种分开处理);(2)第三近月流动性差,建议对成交量/持仓设过滤或用结算价;(3)横截面窄,先用等权、后续再叠加与价格动量/基差动量正交化检验增量。进一步可加正负相对基差非对称检验与金融期货对照,验证机制是否为库存/便利收益驱动。策略为基础横截面实现,不涉及特殊参数。</p>"}, {"key": "SY74VZVY", "title": "Demystifying Time-Series Momentum Strategies: Volatility Estimators, Trading Rules and Pairwise Correlations", "year": "2019", "authors": "Nick Baltas, Robert Kosowski", "tags": ["Trend Following", "Pairwise Correlations", "Time-series Momentum", "Trading Rules", "Transaction Costs", "Turnover"], "venue": "", "abstract": "Motivated by studies of the impact of frictions on asset prices, we examine the effect of key components of time-series momentum strategies on turnover and performance. We show that more efficient volatility estimation and price trend detection can significantly reduce portfolio turnover by more than one third, without causing statistically significant performance degradation. We propose a novel implementation of the strategy that incorporates the pairwise signed correlations by means of a dynamic leverage mechanism. The correlation-adjusted variant outperforms the naive implementation of the strategy and the outperformance is more pronounced in the post-2008 period. Finally, using a transaction costs model for futures-based strategies that separates costs into roll-over and rebalancing costs, we show that our findings remain robust to the inclusion of transaction costs.", "url": "https://papers.ssrn.com/abstract=2140091", "date_added": "2026-07-24", "summarized": true, "rating": "★4.5", "starred": false, "repro": "待复现", "summary_html": "<h1>Demystifying Time-Series Momentum Strategies: Volatility Estimators, Trading Rules and Pairwise Correlations</h1>\n<p>&gt; Zotero Key: <code>SY74VZVY</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>：Nick Baltas (Imperial College Business School), Robert Kosowski (Imperial College / Oxford-Man Institute / CEPR)</li>\n<li><strong>年份</strong>：2019（初稿 2012，标题曾为 &quot;Improving Time-Series Momentum Strategies&quot;）</li>\n<li><strong>出处</strong>：SSRN Working Paper</li>\n<li><strong>DOI</strong>：10.2139/ssrn.2140091</li>\n<li><strong>链接</strong>：https://papers.ssrn.com/abstract=2140091</li>\n<li><strong>本地 PDF</strong>：<code>~/Developer/Zotero/storage/ZXMIL2LA/Baltas和Kosowski - 2019 - Demystifying Time-Series Momentum Strategies Volatility Estimators, Trading Rules and Pairwise Corr.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：TSMOM（时序动量）是典型高换手策略（默认设定月度换手 170%），交易成本吃掉约 10% 的毛收益；且 2008 后表现大幅退化。换手能否在不牺牲业绩的前提下砍掉？后危机期的退化能否用组合构建修复？</li>\n<li><strong>方法</strong>：拆开 TSMOM 的三个可调零件——（1）波动率估计量：把 close-to-close 标准差换成 Yang–Zhang 区间估计量；（2）交易规则：把 $\\pm 1$ 的符号规则换成基于 Newey–West t 统计量、取值连续于 $[-1,+1]$ 的 TREND 规则；（3）组合杠杆：按<strong>平均成对带符号相关系数</strong> $\\bar\\rho$ 动态调整杠杆（相关升高→降杠杆）。再配一个把成本拆成&quot;展期成本 + 再平衡成本&quot;的期货交易成本模型。56 个期货合约、1983–2013。</li>\n<li><strong>结论</strong>：YZ 估计量单独降换手 <strong>17%</strong>（t=5.33），TREND 规则单独降 <strong>24%</strong>（t=8.49），两者合用降 <strong>36.23%</strong>（t=13.19），而夏普统计上不可区分（1.15 vs 1.11，Ledoit–Wolf 检验不显著）。相关性调整单独会<strong>增加</strong> 23% 换手但提升风险调整收益（全样本夏普 1.15→1.19，Sortino 2.08→2.31；后危机期夏普 0.01→0.11，全套改动后 0.17）。成本上：默认设定 163bp/年，三项改动全上后降至 118bp（−28%）；后危机期含成本夏普由 −0.09 转为 +0.06。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>Moskowitz–Ooi–Pedersen (2012) 的标准 TSMOM 有两个被文献长期忽略
