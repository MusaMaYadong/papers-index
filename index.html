he frequency and average profitability of trades at both the portfolio and industry levels. The Timing Industry strategy achieves an average annual return of 18.2% with an annual volatility of 12.6%, resulting in a Sharpe Ratio of 1.39, compared to the US equity market's 9.7% return, 17.1% volatility, and 0.63 Sharpe Ratio. The model's outperformance is underscored by an annualized alpha of 10.9%, with the timing strategy reducing drawdown by almost 60% compared to a passive long exposure. Further investigations reveal the active strategy's ability to fully participate during market upswings while significantly limiting exposure during downturns. In the final section, we introduce 31 sector ETFs provided by State Street Global Advisors and backtest the same trading methodology over the last 20 years. The ETFs successfully replicate the model's exposure and returns. We also assess the impact of commissions and slippage, demonstrating that the active timing strategy remains largely profitable even with high trading costs.", "url": "https://papers.ssrn.com/abstract=4857230", "date_added": "2026-05-24", "summarized": true, "rating": "★5.0", "starred": false, "repro": "待复现", "summary_html": "<h1>A Century of Profitable Industry Trends</h1>\n<p>&gt; Zotero Key: <code>SSTEDRJC</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Carlo Zarattini (Concretum Research), Gary Antonacci (Optimal Momentum)</li>\n<li><strong>年份</strong>: 2024</li>\n<li><strong>出处</strong>: SSRN（2025 Charles H. Dow Award 获奖论文）</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.4857230</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=4857230</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/63TNWX86/Zarattini和Antonacci - 2024 - A Century of Profitable Industry Trends.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>在 48 个行业组合上运行了 100 年（1926-2024）的纯多头趋势跟踪策略，使用 Keltner/Donchian 双通道突破 + 波动率目标仓位管理 + 动态追踪止损，实现年化 18.2%、Sharpe 1.39，最大回撤仅 33%（同期市场 -84%），并用 31 只 ETF 在近 20 年验证了可投资性。</p>\n<h2>研究动机与问题</h2>\n<p>学术界有大量行业动量研究，但大多是月度横截面动量（做多赢家/做空输家），没有论文研究过纯多头时序趋势跟踪在行业层面的长期盈利性。本文使用日频数据、真实交易员使用的技术指标（Keltner 通道 + Donchian 通道），弥补了学术界与实战界之间的鸿沟。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 48 个美国行业组合（Kenneth French 数据库，SIC 四位数分类）+ 31 只 SPDR 行业 ETF</li>\n<li><strong>频率</strong>: 日度</li>\n<li><strong>样本区间</strong>: 1926/07–2024/03（行业组合），2005/01–2024/03（ETF）</li>\n<li><strong>数据来源</strong>: Kenneth French Data Library, Yahoo Finance</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>入场规则</h3>\n<p>价格突破上轨即做多，上轨定义为两个指标的<strong>较小值</strong>（更保守的入场）：</p>\n<ul>\n<li>DonchianUp(20)：过去 20 日最高价</li>\n<li>KeltnerUp(20,2)：20 日 EMA + 2×ATR（因只有收盘价，用 1.4 倍滚动平均 |ΔPrice| 替代 ATR）</li>\n</ul>\n<h3>出场/止损</h3>\n<ul>\n<li>下轨 = max(DonchianDown(40), KeltnerDown(40,2))，使用更长回看期（40 日）以容忍温和回调</li>\n<li>动态追踪止损：止损位永不向下移动 → 只在价格创新高时提升止损</li>\n<li>仅做多，不做空</li>\n</ul>\n<h3>仓位管理</h3>\n<ul>\n<li>目标波动率：单行业贡献 1.5%/N（N = 交易中行业数）</li>\n<li>单行业权重 = 1.5%/N / 行业 14 日波动率</li>\n<li>总杠杆上限 200%</li>\n</ul>\n<h2>核心结论与关键结果（1926–2024）</h2>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>指标</th><th>Timing Industry</th><th>市场</th></tr>\n<tr><td>年化收益</td><td><strong>18.2%</strong></td><td>9.7%</td></tr>\n<tr><td>波动率</td><td><strong>12.6%</strong></td><td>17.1%</td></tr>\n<tr><td>Sharpe</td><td><strong>1.39</strong></td><td>0.63</td></tr>\n<tr><td>最大回撤</td><td><strong>33%</strong></td><td>84%</td></tr>\n<tr><td>年化 Alpha</td><td><strong>10.9%</strong></td><td>—</td></tr>\n</table></div>\n<ul>\n<li>$1 投资 → $25M+（主动）vs $16K（被动）</li>\n<li>ETF 复制验证（2005-2024）：策略可在真实 ETF 上实施，考虑佣金和滑点后仍然盈利</li>\n<li>日偏度为负（价格慢涨急跌），但月度和年度偏度转正</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次将日常实战中常用的 Keltner/Donchian 双通道方法系统化并应用到 100 年行业数据</li>\n<li>非对称参数设计（入场 20 日/出场 40 日）巧妙利用了长期权益风险溢价的正偏特性</li>\n<li>用实际可交易的 ETF 验证了历史回测结果，而非仅停留在学术指数层面</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>1926-2024 的前 70 年市场微观结构与今天截然不同——早期的&quot;交易&quot;成本不可知</li>\n<li>最大回撤 33% 仍相当大，对大多数投资者来说难以承受</li>\n<li>策略仅做多，完全放弃了空头端的趋势收益</li>\n<li>未与简单的 buy-and-hold 行业 ETF 等权组合进行对比（benchmark 是市值加权全市场，不够公平）</li>\n<li>48 个行业的日频数据早期可能包含显著的幸存者偏差</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 极高——Kenneth French 的行业数据完全公开免费；ETF 数据从 Yahoo Finance 获取</li>\n<li><strong>方法清晰度</strong>: 极高——入场/出场/仓位规则完整，参数明确</li>\n<li><strong>计算成本</strong>: 极低——不需要任何优化或 ML</li>\n<li><strong>综合评分</strong>: ★★★★★ 5.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>这是这批 14 篇论文中<strong>最值得复现的一篇</strong>。所有数据公开免费，方法完全透明，且有明确的 ETF 验证结果。建议最小可行版本：(1) 直接在 31 只 SPDR 行业 ETF 上从 2005 年起复现；(2) 扩展至中国 A 股行业 ETF 测试跨市场有效性；(3) 尝试加入空头端（用反向 ETF 或期货）。关注的实际问题：ETF 层面的 tracking error、ETF 费用对净收益的影响、以及在震荡市中频繁假突破的应对策略（如加入 ATR 倍数参数的自适应调整）。</p>"}, {"key": "NPFWJLUB", "title": "TimesNet: Temporal 2D-Variation Modeling for General Time Series Analysis", "year": "2023", "authors": "Haixu Wu, Tengge Hu, Yong Liu…", "tags": ["Computer Science - Machine Learning"], "venue": "", "abstract": "Time series analysis is of immense importance in extensive applications, such as weather forecasting, anomaly detection, and action recognition. This paper focuses on temporal variation modeling, which is the common key problem of extensive analysis tasks. Previous methods attempt to accomplish this directly from the 1D time series, which is extremely challenging due to the intricate temporal patterns. Based on the observation of multi-periodicity in time series, we ravel out the complex temporal variations into the multiple intraperiod- and interperiod-variations. To tackle the limitations of 1D time series in representation capability, we extend the analysis of temporal variations into the 2D space by transforming the 1D time series into a set of 2D tensors based on multiple periods. This transformation can embed the intraperiod- and interperiod-variations into the columns and rows of the 2D tensors respectively, making the 2D-variations to be easily modeled by 2D kernels. Technically, we propose the TimesNet with TimesBlock as a task-general backbone for time series analysis. TimesBlock can discover the multi-periodicity adaptively and extract the complex temporal variations from transformed 2D tensors by a parameter-efficient inception block. Our proposed TimesNet achieves consistent state-of-the-art in five mainstream time series analysis tasks, including short- and long-term forecasting, imputation, classification, and anomaly detection. Code is available at this repository: https://github.com/thuml/TimesNet.", "url": "http://arxiv.org/abs/2210.02186", "date_added": "2026-05-26", "summarized": true, "rating": "★3.5", "starred": false, "repro": "—", "summary_html": "<h1>TimesNet: Temporal 2D-Variation Modeling for General Time Series Analysis</h1>\n<p>&gt; Zotero Key: <code>NPFWJLUB</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Haixu Wu, Tengge Hu, Yong Liu, Hang Zhou, Jianmin Wang, Mingsheng Long (清华大学)</li>\n<li><strong>年份</strong>: 2023</li>\n<li><strong>出处</strong>: ICLR 2023</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2210.02186</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2210.02186</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/93WFS8YC/Wu 等 - 2023 - TimesNet Temporal 2D-Variation Modeling for General Time Series Analysis.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>提出 TimesNet，通过 FFT 自适应发现时序中的多个周期，将 1D 序列按周期重排成 2D 张量，使周期内变化（列）和周期间变化（行）分别被 2D Inception 卷积高效捕获，在预测、插补、分类、异常检测五大任务上一致取得 SOTA。</p>\n<h2>研究动机与问题</h2>\n<p>现实时间序列常呈现多周期性（如电力消耗的日周期+周周期），不同周期重叠交织使变化建模极难。传统 1D 方法（RNN/TCN/Transformer）只能在 1D 时间轴上建模，受限于：</p>\n<ul>\n<li>RNN：无法捕捉长程依赖</li>\n<li>TCN：卷积核的局部性限制，感受野有限</li>\n<li>Transformer：从散点时间点中找注意力依赖不可靠，因为真实依赖常被复杂模式掩盖</li>\n</ul>\n<p>核心洞察：将 1D 序列按周期折叠为 2D 张量后，同一相位的时间点在同一列（周期内变化），不同周期在同列的位置形成行（周期间变化）——2D 卷积核天然适合捕捉这两种变化。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 覆盖天气、电力、交通、汇率、动作识别等多领域</li>\n<li><strong>频率</strong>: 从秒级（动作识别）到小时/日级不等</li>\n<li><strong>样本区间</strong>: 各标准基准数据集划分</li>\n<li><strong>数据来源</strong>: ETT、Electricity、Weather、Traffic、Exchange、ILI、M4、UEA 等公开数据集</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>TimesBlock 核心步骤</strong>：</p>\n<p>1. <strong>周期发现</strong>：对输入序列做 FFT，取频谱中 top-k 峰值对应的周期长度 $\\{p_1, ..., p_k\\}$</p>\n<p>2. <strong>1D→2D 变换</strong>：对每个周期 $p$，将长度 $L$ 的 1D 序列 reshape 为 $p \\times \\lceil L/p \\rceil$（不足补零）的 2D 张量，列表示同一周期内的连续点（intraperiod），行表示不同周期间的同一相位点（interperiod）</p>\n<p>3. <strong>2D 特征提取</strong>：用参数高效的 Inception block（多尺度 2D 卷积核）在 2D 张量上捕获变化模式</p>\n<p>4. <strong>2D→1D 逆变换</strong>：将处理后的 2D 张量 reshape 回 1D，截断补零部分</p>\n<p>5. <strong>多周期融合</strong>：对各周期的输出做加权聚合（权重由 FFT 幅值决定）</p>\n<p><strong>整体架构</strong>：多層 TimesBlock 堆叠 + 残差连接 + 任务特定输出头（预测/分类/重构等）。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>长期预测</strong>：在 ETT、Electricity、Exchange、Weather、Traffic、ILI 六个基准上，MSE 和 MAE 一致优于 FEDformer、Autoformer、Informer、PatchTST 等。</li>\n<li><strong>短期预测</strong>：M4 竞赛数据上超越 N-BEATS 等专门短期预测方法。</li>\n<li><strong>插补（Imputation）</strong>：不同缺失率（12.5%-50%）下均超越 TimesNet 之外的方法。</li>\n<li><strong>分类</strong>：UEA 多变量分类基准上平均准确率最高。</li>\n<li><strong>异常检测</strong>：在 SMD、MSL、SMAP 等检测基准上 F1 全面超越。</li>\n<li><strong>消融</strong>：FFT 周期发现和 2D 卷积两个组件缺一不可，验证了多周期 2D 建模的有效性。</li>\n</ul>\n<h2>创新点</h2>\n<p>1. 从多周期性视角重新审视时序建模，将 1D 序列折叠为 2D 张量是一个简洁而有效的表示创新</p>\n<p>2. FFT 自适应周期发现避免了手工预设周期的局限</p>\n<p>3. Inception block 在 2D 上的应用同时捕获周期内和周期间变化</p>\n<p>4. 一个统一骨干网络覆盖 5 种不同任务，且均达到 SOTA</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>2D reshape 对非整数周期的处理依赖补零，可能引入噪声</li>\n<li>FFT 的 top-k 周期选择是离散操作，不可微</li>\n<li>金融时序的信噪比极低，周期性远弱于天气/电力数据，方法的转移性存疑</li>\n<li>缺少在金融/交易领域的实验验证</li>\n<li>长序列时 2D 张量尺寸可能过大</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 全部公开数据集，代码开源在 GitHub (thuml/TimesNet)</li>\n<li><strong>方法清晰度</strong>: ICLR 论文，图文并茂，代码完整</li>\n<li><strong>计算成本</strong>: 中等 — FFT + 2D 卷积效率高，单 GPU 可完成</li>\n<li><strong>综合评分</strong>: ★3.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>TimesNet 是通用时序骨干，非专门面向金融。如需在量化场景应用，核心验证点：金融数据（如日收益率/成交量）的多周期性是否有效（FFT 发现的周期是否稳定且有经济含义）。建议先在波动率预测（有相对明确的波动率聚集/周期特征）上测试，再扩展到收益率预测。</p>"}, {"key": "F6E8AT2T", "title": "Momentum Turning Points", "year": "2023", "authors": "Christian L. Goulding, Campbell R. Harvey, Michele G. Mazzoleni", "tags": ["trend following", "asset pricing", "behavioral finance", "market timing", "mean reversion", "momentum speed", "time-series momentum", "turning points", "volatility timing"], "venue": "", "abstract": "Turning points are the Achilles' heel of time-series momentum portfolios. Slow signals fail to react quickly to changes in trend while fast signals are often false alarms. We analyze how momentum portfolios of various intermediate speeds, formed by blending slow and fast strategies, handle turning points. We find that the intersection of slow and fast signal directions possesses predictive information, including predictably negative returns when both signals are negative. We propose a novel decomposition of momentum strategy alpha, highlighting the role of volatility timing; and a mean-variance optimal dynamic speed-selection strategy with efficient out-of-sample performance across international equity markets.Journal of Financial Economics, forthcoming.This version includes the Internet Appendix.", "url": "https://papers.ssrn.com/abstract=3489539", "date_added": "2026-05-24", "summarized": true, "rating": "★5", "starred": false, "repro": "复现中", "summary_html": "<h1>Momentum Turning Points</h1>\n<p>&gt; Zotero Key: <code>F6E8AT2T</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Goulding, Christian L.; Harvey, Campbell R.; Mazzoleni, Michele G.</li>\n<li><strong>年份</strong>: 2023</li>\n<li><strong>出处</strong>: SSRN Working Paper（Journal of Financial Economics 接收版）</li>\n<li><strong>DOI</strong>: —</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=3489539</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/JLSWVEKR/Goulding 等 - 2023 - Momentum Turning Points.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>用慢速（12 个月）和快速（1 个月）动量信号的一致/分歧状态定义四种市场周期（牛/调整/熊/反弹），证明中间速度混合信号的 Sharpe 比率高于纯慢或纯快，并给出状态依赖动态速度选择（DSM）策略。</p>\n<h2>研究动机与问题</h2>\n<p>TSM 策略在趋势明确时表现好，但在趋势转折点（turning points）前后，慢速信号滞后、快速信号噪声大，两者各有缺陷。本文发现慢速与快速信号的分歧本身是转折点的重要预兆，并利用这一分歧构建更优的中间速度信号，系统性地提升 Sharpe 比率。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 美国股票市场（Kenneth French 数据库，市值加权超额收益）；20 个国际股票市场</li>\n<li><strong>频率</strong>: 月度</li>\n<li><strong>样本区间</strong>: 主样本 1969 年 1 月–2018 年 12 月（50 年）；扩展样本 1927 年起</li>\n<li><strong>数据来源</strong>: Kenneth French 数据库；国际市场（MSCI 等）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>四种市场周期</strong>（由 SLOW 和 FAST 信号的组合定义）:</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>状态</th><th>条件</th><th>相对频率</th><th>SLOW 仓位</th><th>FAST 仓位</th></tr>\n<tr><td>Bull（牛）</td><td>$r_{t-12,t}\\geq0$，$r_{t-1,t}\\geq0$</td><td>48.3%</td><td>+1</td><td>+1</td></tr>\n<tr><td>Correction（调整）</td><td>$r_{t-12,t}\\geq0$，$r_{t-1,t}&lt;0$</td><td>24.5%</td><td>+1</td><td>-1</td></tr>\n<tr><td>Bear（熊）</td><td>$r_{t-12,t}&lt;0$，$r_{t-1,t}&lt;0$</td><td>16.7%</td><td>-1</td><td>-1</td></tr>\n<tr><td>Rebound（反弹）</td><td>$r_{t-12,t}&lt;0$，$r_{t-1,t}\\geq0$</td><td>10.5%</td><td>-1</td><td>+1</td></tr>\n</table></div>\n<p><strong>中间速度策略</strong>:</p>\n<p>$$w_t(a) := (1-a)\\,w_{\\text{SLOW},t} + a\\,w_{\\text{FAST},t}, \\quad a \\in [0,1]$$</p>\n<p>其中 $a=0$ 为纯 SLOW（12 个月），$a=1$ 为纯 FAST（1 个月），$a=\\frac{1}{2}$ 为 MED 中等速度。</p>\n<p>MED 策略效果：在调整（Correction）和反弹（Rebound）状态下仓位为 0（$w=0$），即自动退出市场。</p>\n<p><strong>AR(1) 预期收益模型</strong>:</p>\n<p>$$\\mu_t = c + \\varphi\\mu_{t-1} + \\varepsilon_t, \\quad r_t = \\mu_t + z_t$$</p>\n<p>其中 $\\varphi$ 为持续性参数，$\\theta$ 为噪声比率（实现收益中噪声占比）。</p>\n<p><strong>SLOW 和 FAST 的闭合 Sharpe（Proposition 1）</strong>:</p>\n<p>$$\\text{SR}[\\text{FAST}] = \\frac{\\sqrt{\\frac{24}{\\pi}}(1-\\theta)\\varphi}{\\sqrt{1-\\frac{2}{\\pi}(1-\\theta)^2\\varphi^2}}$$</p>\n<p>$$\\text{SR}[\\text{SLOW}] = \\frac{\\sqrt{\\frac{24}{\\pi}}(1-\\theta)\\varphi}{\\sqrt{\\frac{(1-\\theta)[12(1-\\varphi^2)-2\\varphi(1-\\varphi^{12})] + 12\\theta(1-\\varphi)^2}{(1-\\varphi^{12})^2} - \\frac{2}{\\pi}(1-\\theta)^2\\varphi^2}}$$</p>\n<p><strong>Alpha 分解（无模型）</strong>:</p>\n<p>$$\\alpha^{\\text{TS}} = \\underbrace{\\alpha^{\\text{market timing}}}_{\\text{约占2/3}} + \\underbrace{\\alpha^{\\text{volatility timing}}}_{\\text{约占1/3}}$$</p>\n<p><strong>动态速度策略（DSM）</strong>: 按观测到的市场状态 $s_t$ 选择最优速度参数 $a^*(s_t)$，用历史数据估计，滚动评估。</p>\n<h2>核心结论与关键结果</h2>\n<p>1. <strong>中间速度 Sharpe &gt; 纯 SLOW 和纯 FAST 的平均</strong>，在美国及所有 20 个国际市场均成立。</p>\n<p>2. 熊市后（牛市期间），SLOW 有更高的预期收益；转折点后（调整/反弹），FAST 更优。</p>\n<p>3. DSM（动态速度）的 Sharpe 高于最优固定速度静态策略，OOS 验证有效。</p>\n<p>4. TS 动量 alpha 约 2/3 来自市场择时，1/3 来自波动率择时（内生，无需显式波动率靶向）。</p>\n<p>5. 熊市（Bear 状态）与宏观风险高度相关，且在衰退早期出现最频繁，验证了其经济意义。</p>\n<p>6. 四状态周期框架比标准两状态（牛/熊）更有解释力：调整和反弹共出现约 35% 的月份。</p>\n<h2>创新点</h2>\n<ul>\n<li>将慢速/快速信号的分歧定义为可观测的&quot;转折点信号&quot;，建立了四状态周期分类框架。</li>\n<li>推导出中间速度 Sharpe 高于平均的解析证明，并给出数值验证。</li>\n<li>首次对 TS 动量 alpha 做无模型分解（市场择时 + 波动率择时），与已有文献（静态倾斜解释）形成对比。</li>\n<li>DSM 的动态速度选择是此前文献未系统探索的方向（Zakamulin 2026 直接建立在此基础上）。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>数据集以美国股票为主，商品/债券等多资产的适用性未直接测试。</li>\n<li>四状态分类以月末观测为基础，实盘中月末效应和数据滞后会影响信号生成。</li>\n<li>DSM 的最优速度估计依赖历史数据，样本短时容易过拟合。</li>\n<li>论文聚焦单一资产的 TS 动量，跨资产动量组合的状态定义需要扩展。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: Kenneth French 数据库公开；A 股/商品期货需天软日频数据。</li>\n<li><strong>方法清晰度</strong>: 四状态分类、中间速度混合、DSM 框架描述完整，可直接实现。</li>\n<li><strong>计算成本</strong>: 低，月度频率，无机器学习组件。</li>\n<li><strong>综合评分</strong>: ★5.0</li>\n</ul>\n<h2>复现备注</h2>\n<p><strong>最小可行版本（高优先级）</strong>:</p>\n<p>1. 用天软商品期货连续合约（月度收益）构建四状态分类矩阵。</p>\n<p>2. 实现中间速度混合策略（$a \\in \\{0, 0.25, 0.5, 0.75, 1\\}$），比较各速度的样本内外 Sharpe。</p>\n<p>3. 验证中间速度 Sharpe 高于端点平均的结论是否在中国商品期货宇宙成立。</p>\n<p>扩展：</p>\n<p>4. 实现 DSM（状态依赖速度选择），与固定速度对比。</p>\n<p>5. 与 Zakamulin (2026) 的 OPT 权重结合，构建 DSM-OPT 混合策略。</p>\n<p>关键风险：中国商品期货月度样本量较短（2000 年后，约 300 个月），状态转移矩阵估计可能不稳定；建议先在品种截面上汇总做验证。</p>\n<p>对接路径: <code>（内部研究目录）</code></p>"}, {"key": "EIGUZ7MJ", "title": "Deep Learning from Implied Volatility Surfaces", "year": "2023", "authors": "Bryan T. Kelly, Boris Kuznetsov, Semyon Malamud…", "tags": ["SSRN", "Boris Kuznetsov", "Bryan T. Kelly", "Deep Learning from Implied Volatility Surfaces", "Semyon Malamud", "Teng Andrea Xu"], "venue": "", "abstract": "<div> We develop a novel methodology for extracting information from option implied volatility (IV) <span>surfaces for the cross-section of stock returns,", "url": "https://papers.ssrn.com/abstract=4531181", "date_added": "2026-06-07", "summarized": true, "rating": "★4.5", "starred": false, "repro": "待复现", "summary_html": "<h1>Deep Learning from Implied Volatility Surfaces</h1>\n<p>&gt; Zotero Key: <code>EIGUZ7MJ</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Bryan T. Kelly (Yale/AQR), Boris Kuznetsov (SFI/EPFL), Semyon Malamud (SFI/EPFL/CEPR), Teng Andrea Xu (EPFL)</li>\n<li><strong>年份</strong>: 2023（最新版 2026 年 2 月）</li>\n<li><strong>出处</strong>: SSRN</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.4531181</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=4531181</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/YSA6DMBR/Kelly 等 - 2023 - Deep Learning from Implied Volatility Surfaces.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>用 CNN 图像识别技术从个股期权隐含波动率曲面中提取横截面收益预测信号，100 个网络集成后 Sharpe 达 2.7，远超现有期权隐含因子，且 CNN 提取的信息无法被任何低维线性特征组合所概括（&quot;特征复杂性&quot;）。</p>\n<h2>研究动机与问题</h2>\n<p>隐含波动率（IV）曲面包含丰富的状态依赖风险溢价和收益分布信息，但传统文献仅能提取少数手工构造的线性特征（IV 水平、偏斜、期限结构斜率、 smirk 等），且结果不稳定（如 Conrad 2013 vs Stilger 2017 对称偏斜方向完全相反）。论文核心问题：能否用深度学习（CNN）从 IV 曲面的原始像素级数据中自动学习非线性的预测特征，绕过人工特征构造？</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 美国个股期权（所有有期权交易的 CRSP 股票）</li>\n<li><strong>频率</strong>: 月度（每月最后一个交易日采样，预测次月收益）</li>\n<li><strong>样本区间</strong>: 1996 年 1 月 – 2021 年 12 月</li>\n<li><strong>数据来源</strong>: OptionMetrics IvyDB（IV 曲面插值数据）、CRSP（股票收益）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[OptionMetrics IV 曲面&lt;br/&gt;每日 δ×τ 网格 10×18] --&gt; B[预处理&lt;br/&gt;δ∈[-0.5,0.5], τ&gt;10天&lt;br/&gt;ATM 重排]\n  B --&gt; C[每月末截面 IV 图像&lt;br/&gt;尺寸 10×18]\n  C --&gt; D[CNN 编码器&lt;br/&gt;1-5 层卷积层&lt;br/&gt;局部特征提取]\n  D --&gt; E[全连接层 → 预测 r_i,t+1]\n  E --&gt; F[MSE 损失 + 梯度下降]\n  F --&gt; G1[单个 CNN 模型&lt;br/&gt;月度预测信号]\n\n  G1 --&gt; H[Ensemble: N=100 独立初始化]\n  H --&gt; I[平均预测信号 → 组合排序]\n  I --&gt; J1[多空组合: 月 Sharpe 2.7]\n  I --&gt; J2[Alpha vs 标准因子+期权因子]\n\n  G1 --&gt; K[主线性特征分析&lt;br/&gt;Constantine 2014 方法]\n  K --&gt; L[需要 100+ 线性特征&lt;br/&gt;才近似 CNN → 特征复杂性]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>数据预处理</strong>：OptionMetrics IV 曲面在 $\\delta \\in [-0.5, 0.5]$（剔除深度实值看涨期权），$\\tau &gt; 10$ 天（剔除周期权数据缺失），ATM 处重排使 put/call 平滑过渡，得到每只股票每月 $10 \\times 18 = 180$ 像素的标准化 IV 图像。</p>\n<p>2. <strong>CNN 架构</strong>：卷积神经网络从 IV 曲面的局部邻域中学习非线性变换（filters）。核心设计选择是<strong>局部性</strong>——CNN 的卷积核只能看到邻近的 $(\\delta, \\tau)$ 点，这与期权定价理论中局部特征（Dupire、Breeden-Litzenberger）的理念一致。尝试 1–5 层不同深度。</p>\n<p>3. <strong>Ensemble</strong>：由于非凸优化存在多个局部最优解，不同随机初始化产生预测相关性低的模型。将 $N$ 个独立训练的 CNN 预测等权平均：</p>\n<p>   $$\\hat{r}_{i,t+1} = \\frac{1}{N} \\sum_{n=1}^{N} f_{\\theta_n}(IV_{i,t})$$</p>\n<p>   随 ensemble size 增大，out-of-sample Sharpe 从单模型 0.9 提升到 100 集成 2.7（5 层 CNN）。</p>\n<p>4. <strong>主线性特征（Principal Linear Features）</strong>：用 Constantine et al. (2014) 的 active subspace 方法，寻找 CNN 非线性函数 $f(IV)$ 在输入空间中梯度最大的线性方向——即最能解释模型预测变异的线性 IV 组合。发现需要 &gt;100 个主线性特征才能近似 CNN 预测，证明 <strong>feature complexity</strong>（信息分布在大量线性特征中，无法低维概括）。</p>\n<p>5. <strong>交易成本分析</strong>：策略月换手率约 80%，多空组合收益主要来自多头端（long leg），对做空约束不敏感。非微盘股（排除最小市值五分位）也保持显著 alpha 和 Sharpe。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>Sharpe 比</strong>：5 层 CNN × 100 ensemble，多空组合月 Sharpe 达 <strong>2.7</strong>（全样本）。相比之下，已有最优期权因子 Sharpe 约 1.0–1.2。</li>\n<li><strong>Alpha</strong>：相对 FF5 + 动量 + 短期反转 + 现有期权因子（Bali et al. 2022 的 5 个因子 + Neuhierl et al. 2022 的 17 个因子），CNN 信号的 alpha 仍高度显著。</li>\n<li><strong>Ensemble 效应</strong>：4–5 层 CNN 从 N=1 到 N=100，Sharpe 提升 0.9→2.7（提升 ~200%）；1 层 CNN 仅从 0.8→1.6。深度越深，ensemble 增益越大——反映了复杂模型在低信噪比环境中的预测不确定性更高。</li>\n<li><strong>特征复杂性</strong>：需要 100+ 个主线性特征才能恢复 CNN 预测的 $R^2$ &gt; 95%，说明 IV 曲面中与收益相关的信息不集中在少数几个&quot;正确&quot;的特征上（如 smirk、slope）。</li>\n<li><strong>交易成本后</strong>：考虑 bid-ask spread 后，非微盘组 alpha 仍显著。多头端贡献了大部分收益，做空端收益较低，策略对做空限制不敏感。</li>\n<li><strong>样本量</strong>：期权可交易股票数量从 1996 年的 ~2000 只增长到 2021 年 ~4500 只，平均超 3000 只。</li>\n</ul>\n<h2>创新点</h2>\n<p>1. <strong>首次将 CNN 直接应用于原始 IV 曲面</strong>（而非人工构造的期权因子），实现端到端的预测信号学习。</p>\n<p>2. <strong>提出&quot;主线性特征&quot;（PLF）</strong> 作为非线性 ML 模型的 PCA 等价物，用于诊断特征复杂度和可解释性。</p>\n<p>3. <strong>证明 feature complexity</strong>——挑战了&quot;少数几个期权特征（smirk、skew）可以概括 IV 曲面信息&quot;的传统认知，与 Kelly et al. (2021) 和 Didisheim et al. (2023) 的&quot;复杂性美德&quot;理论一致。</p>\n<p>4. <strong>大规模 Ensemble 在金融 ML 中的成功应用</strong>，展示 ensemble size 是提升预测性能的关键超参数。</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>黑箱可解释性</strong>：CNN 的预测逻辑难以直接映射到经济机制（风险溢价？行为偏差？），作者也承认这是未来方向。</li>\n<li><strong>换手率高</strong>：月换手率 ~80%，即使考虑交易成本后 alpha 仍显著，但实际执行中容量和 slippage 可能比 paper 估计的更严重。</li>\n<li><strong>OptionMetrics 数据质量</strong>：IV 曲面是 OptionMetrics 的<strong>插值</strong>数据（非原始报价），kernel smoothing 算法可能引入人为平滑和前期偏差。</li>\n<li><strong>数据周期有限</strong>：1996–2021，仅 25 年。相比股票因子研究（40–60 年），样本较短。</li>\n<li><strong>超参数选择</strong>：CNN 层数、filter size、ensemble size 等选择无理论指导，可能过拟合于特定时期。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: ★★★☆☆ OptionMetrics 需付费（WRDS），且 IV 曲面数据（IvyDB Volatility Surface）是额外模块。</li>\n<li><strong>方法清晰度</strong>: ★★★★☆ 架构描述清晰，但具体训练细节（学习率、batch size、validation split）需参考代码。</li>\n<li><strong>计算成本</strong>: ★★★★☆ 需要 GPU 训练 100 个 CNN × 多组超参数，但单个模型规模不大（输入仅 10×18，非典型大图像），瑞士超算中心（CSCS）提供了算力。</li>\n<li><strong>综合评分</strong>: ★4.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>高优先级复现。这是连接 DL 和期权隐含信息的顶级研究，来自顶级作者群。复现策略：（1）A 股期权市场起步晚、品种少（仅 50ETF/300ETF 等指数期权），个股期权缺失——可先在 50ETF 期权 IV 曲面上测试 CNN 对 ETF 走势的预测力；（2）替代路线：用美国市场 OptionMetrics 子样本复现核心 pipeline（CNN → ensemble → portfolio sort），验证方法论；（3）注意 GPU 需求——建议用 PyTorch + 单 GPU 先复现 1 层 CNN 单模型，再逐步扩展深度和 ensemble。</p>"}, {"key": "LIMNRGR6", "title": "Trading with the Momentum Transformer: An Intelligent and Interpretable Architecture", "year": "2022", "authors": "Kieran Wood, Sven Giegerich, Stephen Roberts…", "tags": ["Quantitative Finance - Trading and Market Microstructure", "Computer Science - Machine Learning", "Statistics - Machine Learning"], "venue": "", "abstract": "We introduce the Momentum Transformer, an attention-based deep-learning architecture, which outperforms benchmark time-series momentum and mean-reversion trading strategies. Unlike state-of-the-art Long Short-Term Memory (LSTM) architectures, which are sequential in nature and tailored to local processing, an attention mechanism provides our architecture with a direct connection to all previous time-steps. Our architecture, an attention-LSTM hybrid, enables us to learn longer-term dependencies, improves performance when considering returns net of transaction costs and naturally adapts to new market regimes, such as during the SARS-CoV-2 crisis. Via the introduction of multiple attention heads, we can capture concurrent regimes, or temporal dynamics, which are occurring at different timescales. The Momentum Transformer is inherently interpretable, providing us with greater insights into our deep-learning momentum trading strategy, including the importance of different factors over time and the past time-steps which are of the greatest significance to the model.", "url": "http://arxiv.org/abs/2112.08534", "date_added": "2026-05-25", "summarized": true, "rating": "★4.5", "starred": false, "repro": "复现中", "summary_html": "<h1>Trading with the Momentum Transformer: An Intelligent and Interpretable Architecture</h1>\n<p>&gt; Zotero Key: <code>LIMNRGR6</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Kieran Wood, Sven Giegerich, Stephen Roberts, Stefan Zohren</li>\n<li><strong>年份</strong>: 2022</li>\n<li><strong>出处</strong>: arXiv:2112.08534（Oxford-Man Institute of Quantitative Finance, University of Oxford）</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2112.08534</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2112.08534</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/GKXP8TJC/Wood 等 - 2022 - Trading with the Momentum Transformer An Intelligent and Interpretable Architecture.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>提出 Momentum Transformer——一种 attention-LSTM 混合（Decoder-Only Temporal Fusion Transformer）的深度动量网络，直接以 Sharpe 为损失端到端学习仓位，在 1990–2020 期货组合上 Sharpe 达 2.62（含 CPD），全面超越经典 TSMOM 与 LSTM 基准，且在 SARS-CoV-2 危机中表现稳健、扣除交易成本后依然优异，并具备可解释性。</p>\n<h2>研究动机与问题</h2>\n<p>Deep Momentum Networks（DMN，基于 LSTM）能直接优化 Sharpe 学习趋势与仓位，但 LSTM 是序列结构、偏向局部模式，存在两个缺陷：(1) 难学长期依赖；(2) 在制度突变（如 2020 新冠崩盘）时因&quot;遗忘&quot;机制无法借鉴历史相似制度，表现骤降。此前用变点检测（CPD）模块缓解，但 CPD 只用局部信息、对快速均值回归过度反应、扣成本后表现差。本文引入注意力机制：直连所有历史时步，多注意力头并发捕捉不同时间尺度的制度，从而同时学短期与长期依赖，并天然适应新制度。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 50 个流动性最高的连续期货合约，含商品（CM）、股指（EQ）、固收（FI）、外汇（FX）四大类</li>\n<li><strong>频率</strong>: 日频，使用收益（线性去趋势价格）</li>\n<li><strong>样本区间</strong>: 1990–2020，扩展窗口（expanding window）：初始 1990–1995 训练验证，样本外测试 1995–2000，逐 5 年滚动扩展</li>\n<li><strong>数据来源</strong>: Pinnacle Data Corp CLC Database（后向比例调整的连续合约）</li>\n<li><strong>测试场景</strong>: ① 1995–2020 全期均值；② 2015–2020 近期高非平稳期；③ SARS-CoV-2 危机（2020.1–2020.10）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart LR\n  subgraph 输入特征\n    direction TB\n    A[多尺度收益\\n日/月/季/半年/年] --&gt; P[波动率缩放\\n目标15%年化]\n    B[MACD指标\\n多组S/L] --&gt; P\n    C[CPD变点特征\\n窗口21/126] --&gt; P\n  end\n  subgraph TFT编码\n    direction TB\n    D[变量选择网络 VSN\\n可学习权重·可解释]\n    E[LSTM层\\n局部时序编码]\n    D --&gt; E\n  end\n  subgraph 注意力\n    direction TB\n    F[掩码可解释\\n多头注意力 MIMHA]\n    G[FFN + tanh]\n    F --&gt; G\n  end\n  subgraph 输出\n    direction TB\n    H[仓位 z∈-1,1]\n    I((负Sharpe损失\\n+换手正则))\n    H --&gt; I\n  end\n  输入特征 --&gt; TFT编码 --&gt; 注意力 --&gt; 输出\n  I -.-&gt;|反向传播| F</div>\n<h3>步骤详解</h3>\n<p>整体架构为 Decoder-Only Temporal Fusion Transformer，是 DMN 框架的一个子类，形式化为 $\\text{TFT}(\\tilde{X}) = (\\text{FFN} \\circ \\text{MIMHA} \\circ \\text{LSTM} \\circ \\text{VSN})(\\tilde{X})$。</p>\n<p>1. <strong>输入特征</strong>：均为价格衍生信号——多时间尺度收益 $\\hat{r}^{(i)}_{(\\cdot)}$（日/月/季/半年/年，各按事前波动率归一）、MACD 指标 $\\text{M}^{(i)}_t(S,L)$（多组短长周期），以及可选的变点检测（CPD）特征：变点严重度 $\\nu^{(i)}_t(l)$ 与位置 $\\gamma^{(i)}_t(l)$，在回看窗口 $l \\in \\{21, 126\\}$（一个月 + 半年）两个尺度上计算。</p>\n<p>2. <strong>波动率缩放</strong>：每个资产收益按 60 日指数加权波动率 $\\sigma^{(i)}_t$ 缩放，目标年化波动 $\\sigma_{\\text{tgt}}=15\\%$，确保各资产对组合贡献相近、近似平稳并提供杠杆。组合实现收益 $R^{\\text{TSMOM}}_{t+1} = \\frac{1}{N}\\sum_i z^{(i)}_t \\frac{\\sigma_{\\text{tgt}}}{\\sigma^{(i)}_t} r^{(i)}_{t+1}$。</p>\n<p>3. <strong>变量选择网络（VSN）</strong>：对各协变量嵌入赋可学习权重 $\\eta(\\cdot)\\in[0,1]$（softmax 归一），过滤低信噪比输入；权重即变量重要度，提供可解释性——$x_t = \\sum_j \\eta(\\tilde{x}_{t,j})\\psi_j(\\tilde{x}_{t,j})$。</p>\n<p>4. <strong>LSTM 编码层</strong>：替代 Transformer 的位置编码，对序列做局部时序编码，输出隐表示。</p>\n<p>5. <strong>掩码可解释多头注意力（MIMHA）</strong>：核心模块，$H$ 个注意力头跨所有历史时步计算 $\\text{MHA}(x_t)=\\sum_{i=1}^H (W_{O,i})^\\top \\sum_{\\tau=1}^T s_{t,\\tau}\\,\\alpha_i(x_t,x_\\tau)\\,W_{v,i}x_\\tau$；用掩码 $s_{t,\\tau}\\in\\{0,1\\}$（$\\tau&gt;t$ 置 0）防止未来信息泄漏。各头共享 value 权重（$W_{v,i}=\\frac{1}{h}W_v$）以提升注意力模式可解释性；多头并发捕捉不同时间尺度的并存制度。</p>\n<p>6. <strong>输出层</strong>：FFN + tanh 激活，输出每个资产每个时步的仓位 $z^{(i)}_t \\in (-1,1)$（+1 满仓多、-1 满仓空），即 $Z^{(i)}_{T-\\tau+1:T} = (\\tanh \\circ f \\circ g)(U^{(i)}_{T-\\tau+1:T})$。</p>\n<p>7. <strong>训练目标</strong>：直接最小化负 Sharpe $\\mathcal{L}_{\\text{sharpe}} = -\\frac{\\sqrt{252}\\,\\mathbb{E}_\\Omega[R^{(i)}_t]}{\\sqrt{\\text{Var}_\\Omega[R^{(i)}_t]}}$，序列长度 $\\tau=252$（一个交易年），mini-batch SGD 优化。</p>\n<p>8. <strong>交易成本处理</strong>：在损失中加入换手正则项，扣成本收益 $\\bar{R}^{(i)}_{t+1} = R^{(i)}_{t+1} - C\\sigma_{\\text{tgt}}\\left|\\frac{X^{(i)}_t}{\\sigma^{(i)}_t} - \\frac{X^{(i)}_{t-1}}{\\sigma^{(i)}_{t-1}}\\right|$，使模型在给定成本 $C$ 下优化净收益。</p>\n<h2>核心结论与关键结果</h2>\n<p><strong>1995–2020 全期表现（Sharpe）：</strong></p>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>策略</th><th>年化收益</th><th>Sharpe</th><th>MDD</th><th>Calmar</th></tr>\n<tr><td>Long-Only</td><td>2.45%</td><td>0.51</td><td>12.51%</td><td>0.21</td></tr>\n<tr><td>TSMOM</td><td>4.43%</td><td>1.03</td><td>6.34%</td><td>0.94</td></tr>\n<tr><td>LSTM (DMN)</td><td>2.71%</td><td>1.70</td><td>2.14%</td><td>1.68</td></tr>\n<tr><td>Decoder-Only TFT</td><td>4.01%</td><td>2.54</td><td>1.32%</td><td>3.22</td></tr>\n<tr><td><strong>Decoder-Only TFT + CPD</strong></td><td>3.70%</td><td><strong>2.62</strong></td><td>1.29%</td><td>3.22</td></tr>\n</table></div>\n<ul>\n<li>相比 LSTM，Momentum Transformer 的 Sharpe 在 1995–2020 提升 <strong>50%</strong>、在 2015–2020 提升 <strong>109%</strong></li>\n<li>CPD 模块与注意力互补，2015–2020 期可额外提升 Sharpe <strong>17%</strong></li>\n<li><strong>危机鲁棒性</strong>：SARS-CoV-2 期间所有注意力架构稳健（canonical Transformer Sharpe 3.38、Decoder-Only TFT CPD 2.47），而 LSTM 暴跌至 <strong>-1.50</strong></li>\n<li><strong>扣交易成本</strong>：从 0bps→3bps，LSTM 总降幅 228%，而注意力架构仅约 106%；Decoder-Only TFT 在 1bps 时 Sharpe 仍达 1.22；商品期货扣成本后表现最强</li>\n<li><strong>可解释性</strong>：VSN 给出变量重要度（日收益权重最高，CPD 特征合计约 27%）；注意力模式聚焦于动量转折点、对相似制度赋高权重，将时序切分为制度段</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次将（attention-LSTM 混合的）Temporal Fusion Transformer 用于时序动量交易，作为 DMN 的注意力扩展</li>\n<li>注意力直连所有历史时步，同时学短期+长期依赖；多头并发捕捉不同时间尺度的并存制度</li>\n<li>内生可解释性：VSN 变量重要度 + 可解释多头注意力，打破传统 DMN 黑箱</li>\n<li>CPD 与注意力机制互补而非替代关系的实证</li>\n<li>系统比较 5 种 Transformer 变体（canonical / Decoder-Only / Convolutional / Informer / Decoder-Only TFT）在动量交易中的优劣</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>仅用价格信息</strong>：输入全为价格衍生特征，未纳入基本面/截面因子，作者自承可拓展</li>\n<li><strong>TFT 方差较大</strong>：架构更复杂、对超参更敏感，多次重复实验间 Sharpe 方差高于 LSTM</li>\n<li><strong>非混合 Transformer 在牛市/危机后期反超</strong>：SARS-CoV-2 崩盘后的单边上涨中 canonical Transformer 与 Informer 表现优于 TFT，说明无单一最优架构</li>\n<li><strong>期货低协方差假设</strong>：组合构建假设协方差矩阵近似对角（适合期货，不适合高协方差的股票——见课程项目 <code>L9LXFTIL</code> 的迁移失败教训）</li>\n<li><strong>数据为付费源</strong>：Pinnacle Data Corp，且固收期货在组合中权重低导致该类表现偏弱</li>\n<li><strong>回测过拟合风险</strong>：虽用扩展窗口 + deflated Sharpe 视角讨论，但深度模型超参搜索空间大</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: ✅ 期货数据可用天软获取中国期货替代；原文用 Pinnacle（付费）但有公开 GitHub 数据脚本</li>\n<li><strong>方法清晰度</strong>: ✅ 架构、损失、特征构造均给出公式；作者提供完整开源代码（github.com/kieranjwood/trading-momentum-transformer）</li>\n<li><strong>计算成本</strong>: ⚠️ 需 GPU 训练 TFT + 多次重复实验；CPD 模块计算偏重但可选</li>\n<li><strong>综合评分</strong>: ★4.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>高价值原始论文，建议复现。最小可行版本：先实现无 CPD 的 Decoder-Only TFT（VSN → LSTM → MIMHA → FFN-tanh），用多尺度收益 + MACD 作输入，负 Sharpe 为损失，序列长度 252，扩展窗口回测。可直接参考作者开源代码，将资产替换为天软可取的中国商品期货组合。关键风险点：(1) 严格防未来信息泄漏（掩码注意力 + 标签对齐）；(2) 波动率缩放与事前波动估计需点对点（point-in-time）；(3) 交易成本用换手正则项纳入损失而非仅事后扣减；(4) 中国期货品种少、协方差结构与组合假设需重新评估。CPD 模块作为增量模块二期再加。</p>"}, {"key": "94CWU6S8", "title": "FactorVAE: A Probabilistic Dynamic Factor Model Based on Variational Autoencoder for Predicting Cross-Sectional Stock Returns", "year": "2022", "authors": "Yitong Duan, Lei Wang, Qizhong Zhang…", "tags": [], "venue": "Proceedings of the AAAI Conference on Artificial Intelligence", "abstract": "As an asset pricing model in economics and ﬁnance, factor model has been widely used in quantitative investment. Towards building more effective factor models, recent years have witnessed the paradigm shift from linear models to more ﬂexible nonlinear data-driven machine learning models. However, due to low signal-to-noise ratio of the ﬁnancial data, it is quite challenging to learn effective factor models. In this paper, we propose a novel factor model, FactorVAE, as a probabilistic model with inherent randomness for noise modeling. Essentially, our model integrates the dynamic factor model (DFM) with the variational autoencoder (VAE) in machine learning, and we propose a prior-posterior learning method based on VAE, which can effectively guide the learning of model by approximating an optimal posterior factor model with future information. Particularly, considering that risk modeling is important for the noisy stock data, FactorVAE can estimate the variances from the distribution over the latent space of VAE, in addition to predicting returns. The experiments on the real stock market data demonstrate the effectiveness of FactorVAE, which outperforms various baseline methods.", "url": "https://ojs.aaai.org/index.php/AAAI/article/view/20369", "date_added": "2026-05-26", "summarized": true, "rating": "★4.0", "starred": false, "repro": "待复现", "summary_html": "<h1>FactorVAE: A Probabilistic Dynamic Factor Model Based on Variational Autoencoder for Predicting Cross-Sectional Stock Returns</h1>\n<p>&gt; Zotero Key: <code>94CWU6S8</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Yitong Duan, Lei Wang, Qizhong Zhang, Jian Li</li>\n<li><strong>年份</strong>: 2022</li>\n<li><strong>出处</strong>: Proceedings of the AAAI Conference on Artificial Intelligence (AAAI-22), Vol. 36, pp. 4468–4475</li>\n<li><strong>DOI</strong>: 10.1609/aaai.v36i4.20369</li>\n<li><strong>链接</strong>: https://ojs.aaai.org/index.php/AAAI/article/view/20369</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/GUEG9HU6/Duan 等 - 2022 - FactorVAE A Probabilistic Dynamic Factor Model Based on Variational Autoencoder for Predicting Cros.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>FactorVAE 将动态因子模型与变分自编码器结合，通过&quot;先验-后验学习&quot;（prior-posterior learning）从噪声市场数据中提取有效潜在因子，同时输出收益率预测和风险估计，在 A 股数据上显著优于各类基线方法。</p>\n<h2>研究动机与问题</h2>\n<p>金融数据信噪比极低，现有 ML 因子模型（如条件自编码器 CA）端到端训练时难以从噪声数据中学到有效因子。本文核心问题：如何在不引入未来信息泄漏的前提下，利用&quot;未来数据监督&quot;来引导模型从历史数据中学习更有效的因子？解决方案是将 VAE 的后验机制用于训练期监督，预测期只用历史数据。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 中国 A 股（CSI300 成分股，约 3000–3900 只）</li>\n<li><strong>频率</strong>: 日频</li>\n<li><strong>样本区间</strong>: 训练集 2010.01–2017.12（3432 只股票），验证集 2018.01–2018.12（3450 只），测试集 2019.01–2020.12（3923 只）</li>\n<li><strong>数据来源</strong>: Yahoo Finance 日线价量数据，特征来自 Qlib 平台（Alpha158，158 个价量技术特征，选用 20 个）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>整体框架</strong>（编码器-解码器）：</p>\n<p>训练阶段：</p>\n<p>1. <strong>特征提取器</strong> $\\phi_{\\text{feat}}$：GRU 编码历史序列特征 $x_s$（T=20 个时间步），得到股票潜在特征 $e$</p>\n<p>2. <strong>因子编码器</strong> $\\phi_{\\text{enc}}$（后验，访问未来收益 $y$）：将 $e$ 和 $y$ 构建 M 个组合 $y_p$，再映射为后验因子分布 $z_{\\text{post}} \\sim \\mathcal{N}(\\mu_{\\text{post}}, \\text{diag}(\\sigma_{\\text{post}}^2))$</p>\n<p>3. <strong>因子预测器</strong> $\\phi_{\\text{pred}}$（先验，仅用历史 $e$）：多头全局注意力机制聚合市场表示，输出先验因子 $z_{\\text{prior}} \\sim \\mathcal{N}(\\mu_{\\text{prior}}, \\text{diag}(\\sigma_{\\text{prior}}^2))$</p>\n<p>4. <strong>因子解码器</strong> $\\phi_{\\text{dec}}$：用因子 $z$ 和特征 $e$ 重建收益 $\\hat{y} = \\alpha + \\beta z$（Alpha 层输出特异收益，Beta 层输出因子暴露）</p>\n<p><strong>目标函数</strong>（先验-后验学习）：</p>\n<p>$$L(x, y) = -\\frac{1}{N}\\sum_{i=1}^N \\log p_{\\phi_{\\text{dec}}}(\\hat{y}_{\\text{rec}}^{(i)} = y^{(i)} | x, z_{\\text{post}}) + \\gamma \\cdot \\text{KL}(P_{\\phi_{\\text{enc}}}(z|x,y) \\| P_{\\phi_{\\text{pred}}}(z|x))$$</p>\n<p>预测阶段仅用先验路径（无未来信息）。</p>\n<p><strong>评估指标</strong>：Rank IC（排名信息系数）和 Rank ICIR（IC/std(IC)），以及回测年化收益（AR）、夏普比率（SR）、最大回撤（MDD）。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>截面预测：FactorVAE 在测试集上 Rank IC = <strong>0.055</strong>，Rank ICIR = <strong>0.568</strong>，显著优于 CA（0.042/0.226）、GRU（0.032/0.398）、ALSTM（0.031/0.360）</li>\n<li>鲁棒性实验（随机删除 m=50/100/200 只训练股票）：FactorVAE 在所有设置下均最优，表明泛化能力强</li>\n<li>组合回测（TopK-Drop，K=50，考虑交易费用）：年化超额收益 AR=<strong>15.32%</strong>，SR=<strong>1.92</strong>，MDD=<strong>4.47%</strong>，显著优于所有基线</li>\n<li>加入风险调整（TDRisk）后：AR=<strong>16.32%</strong>，SR=<strong>2.09</strong>，验证了概率风险估计对实盘的价值</li>\n<li>去掉后验监督（FactorVAE-prior 变体）性能大幅下降，证明先验-后验学习机制是核心</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次将 VAE 的后验机制引入动态因子模型训练，用未来信息构建更优秀的因子作为&quot;教师信号&quot;</li>\n<li>多头全局注意力机制：捕捉横截面股票的全局市场表示，提取多样化风险溢价</li>\n<li>同时输出收益预测（均值）和风险估计（方差），可做风险调整选股</li>\n<li>组合构建的投资组合层设计减少参数量并提升对缺失股票的鲁棒性</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>仅在 A 股 CSI300 范围内测试，样本量小（3000 只），泛化到更宽股票池未验证</li>\n<li>特征仅用 Qlib Alpha158 中的 20 个价量特征，未使用基本面特征，信号维度有限</li>\n<li>测试期仅 2019–2020 两年，且包含 2020 年新冠行情，样本外鲁棒性存疑</li>\n<li>交易成本仅考虑 30bp，实际 A 股冲击成本可能更高</li>\n<li>超参数（因子数 K、组合数 M、KLD 权重 γ 等）调优过程不透明</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: Qlib 平台开源，Alpha158 特征可免费获取；A 股日线价量数据公开可得；可基本复现</li>\n<li><strong>方法清晰度</strong>: 论文结构清晰，编码器/解码器各模块有公式和架构图，可实现</li>\n<li><strong>计算成本</strong>: 中等，GRU + 注意力机制，GPU 训练数小时可完成</li>\n<li><strong>综合评分</strong>: ★4.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>这是国内 A 股场景下结合 VAE 的动态因子模型最完整的落地方案之一，复现价值高。最小可行版本：基于 Qlib 框架，用 Alpha158 特征构建 GRU 特征提取器 + VAE 因子模块，验证先验-后验学习的有效性。关键风险：（1）后验崩塌（posterior collapse）是 VAE 类模型常见问题，需注意 KLD 权重调优；（2）需仔细处理股票池变动（新股/退市）；（3）A 股非 CSI300 全市场的泛化性需另行验证。</p>"}, {"key": "SGQL9G33", "title": "Factor Investing with a Deep Multi-Factor Model", "year": "2022", "authors": "Zikai Wei, Bo Dai, Dahua Lin", "tags": ["Quantitative Finance - Computational Finance", "Computer Science - Machine Learning"], "venue": "", "abstract": "Modeling and characterizing multiple factors is perhaps the most important step in achieving excess returns over market benchmarks. Both academia and industry are striving to find new factors that have good explanatory power for future stock returns and good stability of their predictive power. In practice, factor investing is still largely based on linear multi-factor models, although many deep learning methods show promising results compared to traditional methods in stock trend prediction and portfolio risk management. However, the existing non-linear methods have two drawbacks: 1) there is a lack of interpretation of the newly discovered factors, 2) the financial insights behind the mining process are unclear, making practitioners reluctant to apply the existing methods to factor investing. To address these two shortcomings, we develop a novel deep multi-factor model that adopts industry neutralization and market neutralization modules with clear financial insights, which help us easily build a dynamic and multi-relational stock graph in a hierarchical structure to learn the graph representation of stock relationships at different levels, e.g., industry level and universal level. Subsequently, graph attention modules are adopted to estimate a series of deep factors that maximize the cumulative factor returns. And a factor-attention module is developed to approximately compose the estimated deep factors from the input factors, as a way to interpret the deep factors explicitly. Extensive experiments on real-world stock market data demonstrate the effectiveness of our deep multi-factor model in the task of factor investing.", "url": "http://arxiv.org/abs/2210.12462", "date_added": "2026-05-26", "summarized": true, "rating": "★4.0", "starred": false, "repro": "待复现", "summary_html": "<h1>Factor Investing with a Deep Multi-Factor Model</h1>\n<p>&gt; Zotero Key: <code>SGQL9G33</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Zikai Wei (CUHK), Bo Dai (Shanghai AI Lab), Dahua Lin (CUHK / Shanghai AI Lab)</li>\n<li><strong>年份</strong>: 2022</li>\n<li><strong>出处</strong>: arXiv:2210.12462</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2210.12462</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2210.12462</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/6Q6PS5Y9/Wei 等 - 2022 - Factor Investing with a Deep Multi-Factor Model.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>提出基于图注意力网络（GAT）的深度多因子模型：在行业和全市场两个层次的动态股图上，通过行业中性化和市场中性化学习深度因子，最大化累积因子收益和 ICIR，并用因子注意力模块将深度因子显式分解为原始输入因子的加权组合，实现完全可解释的因子投资。</p>\n<h2>研究动机与问题</h2>\n<p>传统多因子模型依赖线性假设，忽略因子间交互和非线性关系。深度学习方法虽有更好的预测能力，但存在两个关键障碍：（1）学习的深度因子不可解释——无法知道新因子是什么；（2）建模过程缺乏金融洞见——从业者难以信任&quot;黑箱&quot;。本文旨在将图神经网络引入因子投资，同时保持每个模块的金融含义清晰。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: CSI 300、CSI 500、CSI 800（覆盖 2800+ 只 A 股）</li>\n<li><strong>频率</strong>: 月度</li>\n<li><strong>样本区间</strong>: 2010–2022（训练/验证/测试按时间划分）</li>\n<li><strong>数据来源</strong>: 包含基本面、交易信息和分析师预测等多类因子</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>多层股图构建</strong>：</p>\n<ul>\n<li>行业图（Industry Graph）：同行业股票之间双向连接，学习行业内部影响力</li>\n<li>全市场图（Universe Graph）：所有指数成分之间全连接，学习跨行业影响力</li>\n<li>两图均为动态图，随成分股变动和行业分类变更而更新</li>\n</ul>\n<p><strong>核心模块</strong>：</p>\n<p>1. <strong>Stock Context Encoder</strong>：MLP + BatchNorm 将原始因子编码为隐特征 $C_t$（BatchNorm 相当于因子开发中的 Z-score 标准化）</p>\n<p>2. <strong>行业影响学习</strong>：GAT 在行业图上传播信息，得到行业影响力 $H_t^I$</p>\n<p>3. <strong>行业中性化</strong>：$\\bar{C}_t^I = C_t - H_t^I$，去除行业共同因素</p>\n<p>4. <strong>市场中性化</strong>：在全市场图上再次 GAT，得到 $\\bar{C}_t^G$，进一步去除市场共同因素</p>\n<p>5. <strong>深度因子生成</strong>：三个粒度的特征（原始 / 行业中性 / 市场中性）各自生成深度因子 $f_t^k$，最大化累积因子收益和信息系数信息比（ICIR）</p>\n<p>6. <strong>因子注意力解释</strong>：用 attention 将深度因子分解为原始输入因子的加权组合，权重热力图揭示每个深度因子由哪些传统因子构成</p>\n<p>训练使用交叉截面回归：深度因子 → 因子收益 $b_t^k$ → 预测收益 $\\hat{r}_{t+k} = \\sum b_t^k f_t^k$，局部优化 $b_t^k$ 的同时全局优化 $f_t^k$。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>在 CSI 300 / CSI 500 / CSI 800 三个股票池上，深度多因子模型的 <strong>Alpha、ICIR、IR、Sharpe</strong> 一致优于线性多因子、等权组合（EW）、MLP 和 MLP+GAT 基线</li>\n<li>累积超额收益曲线在三个市场均稳定上升，尤其在大盘（CSI 300）中效果最佳</li>\n<li>因子注意力热力图显示深度因子可以从原始因子中合理拆解（如某个深度因子主要由动量+波动率因子组成）</li>\n<li>行业中性化模块有效去除了行业层面的共同噪音，提升了因子稳定性</li>\n</ul>\n<h2>创新点</h2>\n<p>1. 用动态多层股图显式建模行业内和跨行业的多粒度股票关系</p>\n<p>2. 行业中性化和市场中性化直接嵌入网络架构，赋予明确的金融含义</p>\n<p>3. 因子注意力模块实现了深度因子的显式可解释性——每个深度因子都可以追溯为原始因子的加权组合</p>\n<p>4. 局部+全局两级优化（因子收益局部回归 + 因子权重全局梯度下降）</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>仅在中国 A 股市场测试，未在其他市场验证</li>\n<li>月度频率限制了策略容量和交易信号的时效性</li>\n<li>因子注意力解释是基于近似的软分解，而非精确的线性组合</li>\n<li>图构建依赖行业分类标准（ICB），分类变更可能影响结果</li>\n<li>未考虑交易成本、流动性约束等实际执行因素</li>\n<li>未与最新的深度时序模型（Transformer 类）对比</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: A 股因子数据可通过公开渠道获取，行业分类数据公开</li>\n<li><strong>方法清晰度</strong>: 架构每个模块的金融含义明确，数学公式完整</li>\n<li><strong>计算成本</strong>: 中等 — GAT + 月度数据，单 GPU 可完成</li>\n<li><strong>综合评分</strong>: ★4.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>是 A 股因子投资领域针对性最强的方法之一。最小可行版本：选取 CSI 300 成分，使用常见风格因子作为输入（value/momentum/size/volatility/quality），实现行业中性化 GAT + 因子生成 + 因子注意力解释。关键验证点：(1) ICIR 是否优于线性因子模型，(2) 因子注意力权重是否稳定且反映合理的经济逻辑。</p>"}, {"key": "EKR7ITT7", "title": "Trend-Following Strategies via Dynamic Momentum Learning", "year": "2021", "authors": "Bruno P. C. Levy, Hedibert F. Lopes", "tags": [], "venue": "", "abstract": "Time series momentum strategies are widely applied in the quantitative financial industry and its academic research has grown rapidly since the work of Moskowitz, Ooi and Pedersen (2012). However, trading signals are usually obtained via simple observation of past return measurements. In this article we study the benefits of incorporating dynamic econometric models to sequentially learn the time-varying importance of different look-back periods for individual assets. By the use of a dynamic binary classifier model, the investor is able to switch between time-varying or constant relations between past momentum and future returns, dynamically combining or selecting different momentum speeds during turning points, improving trading signals accuracy and portfolio performance. Using data from 56 future contracts we show that a mean-variance investor will be willing to pay a considerable management fee to switch from the traditional naive time series momentum strategy to the dynamic classifier approach.", "url": "https://arxiv.org/abs/2106.08420v4", "date_added": "2026-05-24", "summarized": true, "rating": "★5", "starred": false, "repro": "复现中", "summary_html": "<h1>Trend-Following Strategies via Dynamic Momentum Learning</h1>\n<p>&gt; Zotero Key: <code>EKR7ITT7</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Bruno P. C. Levy, Hedibert F. Lopes</li>\n<li><strong>年份</strong>: 2021</li>\n<li><strong>出处</strong>: arXiv</li>\n<li><strong>DOI</strong>: -</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2106.08420</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/FQXY7J8B/Levy和Lopes - 2021 - Trend-Following Strategies via Dynamic Momentum Learning.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>使用动态逻辑回归分类器+动态模型平均/选择(DMA/DMS)，让模型在月频上自适应学习不同回看周期(1-12个月)对每个资产的预测能力，实现动量速度的动态切换，将夏普比率从0.81提升至1.23(+52%)，并将2009年动量崩溃期损失从-25.3%转为+22.1%。</p>\n<h2>研究动机与问题</h2>\n<p>传统TSMOM策略仅基于固定回看期的历史收益符号产生多空信号，存在三个缺陷：(1)不同资产对不同回看期的敏感度不同且随时间变化；(2)趋势反转时(如2009年)固定周期信号无法识别转向；(3)没有利用不同周期信息的互补性。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 56个期货合约(12个权益指数、25个商品、11个固收、8个外汇)</li>\n<li><strong>频率</strong>: 月频对数收益率，月频再平衡</li>\n<li><strong>样本区间</strong>: 1980年1月 - 2020年9月</li>\n<li><strong>数据来源</strong>: Refinitiv/Datastream连续价格</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>1. <strong>动态逻辑回归分类器</strong>: 预测下一期收益率方向(涨/跌)，模型 s_t ~ Bernoulli(p_t), logit(p_t) = x_t&#x27;θ_t, θ_t = θ_{t-1} + ω_t (随机游走)</p>\n<p>2. <strong>动量速度不确定性的建模</strong>: 考虑K=7个回看期(1/2/4/6/8/10/12个月)，共M=2^K-1个模型。每个模型包含不同的动量预测变量组合</p>\n<p>3. <strong>动态模型平均(DMA)</strong>: 按预测似然加权平均各模型预测概率</p>\n<p>4. <strong>动态模型选择(DMS)</strong>: 每期选择概率最高的单一模型</p>\n<p>5. <strong>折扣因子</strong>: 系数时变性通过 λ_t ∈ {0.98, 0.99, 1} 网格搜索自适应选择；模型遗忘因子 α ∈ {0.99, 1}</p>\n<p>6. <strong>波动率缩放</strong>: 沿用Moskowitz等(2012)的40%年化波动率目标</p>\n<p>7. <strong>交易成本</strong>: 按Baltas &amp; Kosowski(2020)各品种层级设定，含再平衡和滚动成本</p>\n<h2>核心结论与关键结果</h2>\n<p>1. <strong>全样本绩效(c=50%阈值)</strong>:</p>\n<p>   - DMS-TVP: 年化收益12.3%, SR 1.23, MaxDD 14.8% — 对比Naive-12m: 8.1%, SR 0.81, MaxDD 25.3%</p>\n<p>   - DMS-CP: SR 1.17, DMA-TVP: SR 1.06, DMA-CP: SR 1.05</p>\n<p>   - 均显著优于所有Naive策略(最佳Naive-12m仅SR 0.81)</p>\n<p>2. <strong>管理费等价</strong>: 均值-方差投资者(γ=10)愿意支付425 bps的年化管理费从Naive-12m切换到DMS-TVP</p>\n<p>3. <strong>2009年动量崩盘期间(2009m3-2010m6)</strong>:</p>\n<p>   - Naive-12m累计亏损-25.3%, SR -1.57</p>\n<p>   - DMS-TVP累计盈利+22.1%, SR 1.32 — 完全扭转损失</p>\n<p>   - 管理费等价高达4541 bps</p>\n<p>4. <strong>后崩盘期(2010m7-2020m9)</strong>:</p>\n<p>   - DMS-CP: SR 1.18, 管理费等价699 bps</p>\n<p>   - 1个月单预测器表现突出(SR 1.18)，说明后危机时代短周期动量更具预测力</p>\n<p>5. <strong>预测精度</strong>: DMA/DMS分类准确率约53-53.3%，Naive策略仅50.1-52.3%</p>\n<p>6. <strong>速度选择动态</strong>: 2009年崩盘后，1个月动量预测器的包含概率(inclusion probability)从约0.4升至0.7+，10/12个月从0.6+降至0.2-</p>\n<h2>创新点</h2>\n<p>1. 首次将动态二分类模型(McCormick et al., 2012)引入时间序列动量预测，实现动量速度的自适应选择/组合</p>\n<p>2. 从朴素观察收益符号的&quot;无模型&quot;决策升级为概率化统计推断</p>\n<p>3. 通过动态模型概率的时序学习，自动识别趋势拐点——无需人工设定阈值或规则</p>\n<p>4. 在2009年动量崩溃这一难题上取得了颠覆性的改善(亏损25%→盈利22%)</p>\n<h2>局限与可质疑处</h2>\n<p>1. 后2010年的优异表现很大程度上来自1个月单一预测器——DMA/DMS的附加价值在CP vs TVP差异不显著</p>\n<p>2. 分类准确率仅53%左右，虽然对量化策略足以产生经济价值，但提升幅度有限</p>\n<p>3. 月频再平衡——日频应用中模型更新和交易成本将更高</p>\n<p>4. TVP模型换手率较高(101%月换手)，实际交易成本可能被低估</p>\n<p>5. 仅使用56个期货合约，扩展至A股等更大样本需重新验证</p>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 天软可获取全球期货周/月线，56个合约范围与原文高度匹配</li>\n<li><strong>方法清晰度</strong>: 方法描述极其详尽(含完整公式、折扣因子选择、模型概率更新、CV流程)，FDA可完全复现</li>\n<li><strong>计算成本</strong>: 中等 — 需要为每个资产并行估计2^7-1=127个动态逻辑回归模型，月频计算量可控；无MCMC/深度学习需求</li>\n<li><strong>综合评分</strong>: ★★★★★</li>\n</ul>\n<h2>复现备注</h2>\n<ul>\n<li><strong>关键风险点</strong>: 月频信号 vs 我们常用日频——需要调整折扣因子参数；127个模型的计算量需并行化；交易成本参数需校准</li>\n<li><strong>最小可行版本</strong>: 先实现CP-DMS(常数参数+动态模型选择)——它提供了接近TVP版本的绩效(SR 1.17 vs 1.23)，但更简单稳定。使用K=3个回看期(3/6/12月)即可</li>\n<li><strong>建议 research topic</strong>: <code>tsmom_dynamic_classifier</code></li>\n<li><strong>核心可交付</strong>: 1) 动态逻辑回归分类器 + DMA/DMS 2) 与Naive-TSMOM的绩效对比 3) 速度选择概率时间序列图</li>\n</ul>"}, {"key": "JGMU8T7Z", "title": "The Best Strategies for Inflationary Times", "year": "2021", "authors": "Henry Neville, Teun Draaisma, Ben Funnell…", "tags": ["commodities", "bitcoin", "gold", "asset allocation", "cryptocurrency", "factor investing", "inflation betas", "Inflation hedge", "inflation shocks", "inflation surprises", "permanent inflation", "portfolio management", "risk management", "temporary inflation"], "venue": "", "abstract": "Over the past three decades, a sustained surge in inflation has been absent in developed markets. As a result, investors face the challenge of having limited experience and no recent data to guide the repositioning of their portfolios in the face of heighted inflation risk. We provide some insight by analyzing both passive and active strategies across a variety of asset classes for the U.S., U.K., and Japan over the past 95 years. Unexpected inflation is bad news for traditional assets, such as bonds and equities, with local inflation having the greatest effect. Commodities have positive returns during inflation surges but there is considerable variation within the commodity complex. Among the dynamic strategies, we find that trend-following provides the most reliable protection during important inflation shocks. Active equity factor strategies also provide some degree of hedging ability. We also provide analysis of alternative asset classes such as fine art and discuss the economic rationale for including cryptocurrencies as part of a strategy to protect against inflation.", "url": "https://papers.ssrn.com/abstract=3813202", "date_added": "2026-05-24", "summarized": true, "rating": "★3.5", "starred": false, "repro": "—", "summary_html": "<h1>The Best Strategies for Inflationary Times</h1>\n<p>&gt; Zotero Key: <code>JGMU8T7Z</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Henry Neville, Teun Draaisma, Ben Funnell, Campbell R. Harvey, Otto Van Hemert (Man Group)</li>\n<li><strong>年份</strong>: 2021</li>\n<li><strong>出处</strong>: SSRN</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.3813202</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=3813202</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/CHBMQKCN/Neville 等 - 2021 - The Best Strategies for Inflationary Times.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>利用 1926 年以来美英日三国 95 年数据，系统分析了各类资产和策略在&quot;高且加速的通胀体制&quot;（YoY CPI ≥5% 且仍在上升）中的表现——结论是商品期货收益最高（年化实际 +14%），但趋势跟踪策略提供了最可靠的保护（年化实际 +25%，在所有 8 个美国通胀体制中均实现正实际收益）。</p>\n<h2>研究动机与问题</h2>\n<p>2021 年初，M2 货币供应爆发式增长 + 大规模财政刺激 + 长端收益率上行，通胀风险成为投资者核心关切。但发达市场已近 30 年未经历持续通胀，投资者缺乏经验和近期数据来指导组合再配置。这篇论文不问&quot;通胀会不会来&quot;，只问&quot;如果来了，什么策略历史上表现好&quot;。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 美股、美债（2/10/30Y）、信用债（IG/HY）、TIPS、商品（综合+能源/工业金属/黄金/贵金属/软商品/农产品）、住宅地产、艺术品/葡萄酒/邮票收藏品、比特币</li>\n<li><strong>策略</strong>: 趋势跟踪（跨资产/纯商品/纯债券/纯股票）、横截面动量、质量（QMJ）、价值（HML）、低波（BAB）、规模（SMB）、盈利（RMW）、投资（CMA）</li>\n<li><strong>频率</strong>: 月度</li>\n<li><strong>样本区间</strong>: 1926–2021（美国），UK/日本</li>\n<li><strong>数据来源</strong>: 多种公开和专有数据源</li>\n</ul>\n<h2>方法 / 模型</h2>\n<ul>\n<li><strong>通胀体制定义</strong>: YoY headline CPI 加速上升且水平达到 ≥5%；体制结束 = CPI 达到峰值且没有从 24 个月高点回落超 50%</li>\n<li><strong>8 个美国通胀体制</strong>（1926-2021）：二战（1941-42）、战后（1946-47）、朝鲜战争（1950-51）、布雷顿森林终结（1966-70）、OPEC 石油禁运（1972-74）、伊朗革命（1977-80）、里根繁荣（1987-90）、中国需求繁荣（2007-08）</li>\n<li>趋势跟踪策略按 Hamill, Rattray &amp; Van Hemert (2016) 方法构建</li>\n</ul>\n<h2>核心结论与关键结果</h2>\n<p><strong>美国 8 个通胀体制中的年化实际收益（关键品种）</strong>:</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>策略/资产</th><th>通胀期实际收益</th><th>非通胀期</th><th>命中率</th></tr>\n<tr><td><strong>趋势跟踪 – 全资产</strong></td><td><strong>+25%</strong></td><td>+15%</td><td><strong>100%</strong>（8/8 正）</td></tr>\n<tr><td>趋势跟踪 – 商品</td><td>—</td><td>—</td><td>高</td></tr>\n<tr><td>趋势跟踪 – 债券</td><td>—</td><td>—</td><td>—</td></tr>\n<tr><td>商品 – 综合</td><td><strong>+14%</strong></td><td>-1%</td><td><strong>100%</strong>（8/8 正）</td></tr>\n<tr><td>横截面动量（股票）</td><td>+8%</td><td>+4%</td><td>—</td></tr>\n<tr><td>质量（QMJ）</td><td>+3%</td><td>+3%</td><td>—</td></tr>\n<tr><td>价值（HML）</td><td>-1%</td><td>+2%</td><td>—</td></tr>\n<tr><td>股票 – 综合</td><td><strong>-7%</strong></td><td>+10%</td><td>25%</td></tr>\n<tr><td>10Y 国债</td><td>-5%</td><td>+4%</td><td>—</td></tr>\n<tr><td>60/40 组合</td><td>-6%</td><td>+10%</td><td>50%</td></tr>\n</table></div>\n<ul>\n<li>商品内部差异性大：能源在 OPEC 禁运期间 +264%，但黄金在部分体制中为负</li>\n<li>趋势跟踪的优越性来源于通胀冲击往往是持续性事件而非一次性跳跃，这恰好是趋势策略的优势</li>\n<li>TIPS 在所有体制中提供稳定正实际收益（约 +3-6%），但数据始于 1997 年</li>\n<li>比特币作为通胀对冲存在经济逻辑（固定供给），但数据历史太短无法统计验证</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>系统量化定义了&quot;通胀体制&quot;——不仅是 CPI 超过阈值，还要求处于加速阶段</li>\n<li>覆盖了三种资产的完整谱系：被动资产 → 主动股票因子 → 动态趋势策略 → 另类资产</li>\n<li>明确区分了暂时性和持续性通胀冲击对资产价格的不同影响，并用趋势跟踪天然适配持续性冲击来解释其优越性</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>仅 8 个通胀体制，样本量太小——统计推断需要谨慎</li>\n<li>体制定义（5% 阈值、50% 回撤规则）有一定主观性</li>\n<li>趋势跟踪策略的实际容量远小于被动商品配置——对大型机构投资者而言可扩展性是问题</li>\n<li>2022 年后的通胀周期未包含在样本内（若包含将构成重要的样本外验证）</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 中——基础资产数据易得，但趋势跟踪策略的具体构建参数和期货合约细节不完全公开</li>\n<li><strong>方法清晰度</strong>: 高——通胀体制定义和资产分类清晰</li>\n<li><strong>计算成本</strong>: 低至中——趋势跟踪回测需要多品种期货数据</li>\n<li><strong>综合评分</strong>: ★★★☆☆ 3.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>核心框架值得复现验证。最小可行版本：(1) 用中国 CPI 数据定义中国版的通胀体制；(2) 用简化趋势跟踪（12 月时序动量 + 波动率目标）在中国商品期货上测试通胀期表现；(3) 比较各股票因子（价值/质量/动量/低波）在通胀体制中的表现差异。关键价值在于提供了一个资产配置层面的框架性认知——不是&quot;通胀来了买什么&quot;，而是&quot;不同通胀应对工具在历史上实际表现如何排位&quot;。</p>"}, {"key": "CRIGSRAN", "title": "In Good and in Bad Times? The Relation between Anomaly Returns and Market States", "year": "2021", "authors": "Sebastian Müller, Fabian Preissler", "tags": ["Anomalies", "international stock markets", "market states", "sentiment. market efficiency"], "venue": "", "abstract": "We evaluate the relation between various anomalies/factors and market conditions using data comprising 57 countries from 1980 to 2019. The cross-section of anomalies performs significantly better during unfavorable market states. The value-weighted four-factor alpha is 49.2 bps in bad times while it amounts to 29.4 bps in good times. 92.9% of the performance gain can be attributed to the anomaly short side. Findings remain robust considering sentiment, recessions, and anomaly categories or regions. They underscore the overall importance of mispricing in explaining anomalies, while for certain individual anomalies, risk and data mining may still serve as potential explanations.", "url": "https://papers.ssrn.com/abstract=3926059", "date_added": "2026-06-27", "summarized": false, "rating": "", "starred": false, "repro": "—", "summary_html": ""}, {"key": "WPAXXIGP", "title": "Temporal Fusion Transformers for Interpretable Multi-horizon Time Series Forecasting", "year": "2020", "authors": "Bryan Lim, Sercan O. Arik, Nicolas Loeff…", "tags": ["Computer Science - Machine Learning", "Statistics - Machine Learning"], "venue": "", "abstract": "Multi-horizon forecasting problems often contain a complex mix of inputs -- including static (i.e. time-invariant) covariates, known future inputs, and other exogenous time series that are only observed historically -- without any prior information on how they interact with the target. While several deep learning models have been proposed for multi-step prediction, they typically comprise black-box models which do not account for the full range of inputs present in common scenarios. In this paper, we introduce the Temporal Fusion Transformer (TFT) -- a novel attention-based architecture which combines high-performance multi-horizon forecasting with interpretable insights into temporal dynamics. To learn temporal relationships at different scales, the TFT utilizes recurrent layers for local processing and interpretable self-attention layers for learning long-term dependencies. The TFT also uses specialized components for the judicious selection of relevant features and a series of gating layers to suppress unnecessary components, enabling high performance in a wide range of regimes. On a variety of real-world datasets, we demonstrate significant performance improvements over existing benchmarks, and showcase three practical interpretability use-cases of TFT.", "url": "http://arxiv.org/abs/1912.09363", "date_added": "2026-05-26", "summarized": true, "rating": "★3.5", "starred": false, "repro": "—", "summary_html": "<h1>Temporal Fusion Transformers for Interpretable Multi-horizon Time Series Forecasting</h1>\n<p>&gt; Zotero Key: <code>WPAXXIGP</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Bryan Lim (Oxford), Sercan O. Arik, Nicolas Loeff, Tomas Pfister (Google Cloud AI)</li>\n<li><strong>年份</strong>: 2020</li>\n<li><strong>出处</strong>: International Journal of Forecasting, 37(4):1748–1764</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.1912.09363</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/1912.09363</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/3YEBTTZQ/Lim 等 - 2020 - Temporal Fusion Transformers for Interpretable Multi-horizon Time Series Forecasting.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>提出 Temporal Fusion Transformer (TFT)，专为多步长预测设计的注意力架构，原生支持三类异构输入（静态协变量、已知未来输入、观测到的外生序列），通过变量选择网络和门控机制实现高性能+可解释性，在零售、交通、电力等多个真实数据集上显著超越当时最优方法。</p>\n<h2>研究动机与问题</h2>\n<p>实际多步长预测任务通常有多种不同类型的输入：静态元数据（如店铺位置）、已知未来信息（如节假日）、历史外生序列（如客流量），且缺乏关于它们如何交互的先验知识。现有方法要么不考虑输入异构性，要么是&quot;黑箱&quot;模型，导致两个问题：(1) 性能受限于架构与数据特性不匹配；(2) 预测不可解释，用户难以信任和调试。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 零售销量、交通流量、电力负荷、波动率等</li>\n<li><strong>频率</strong>: 小时级/日级</li>\n<li><strong>样本区间</strong>: 各标准数据集</li>\n<li><strong>数据来源</strong>: UCI Retail、Traffic、Electricity、OMI 波动率等公开数据集</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>TFT 的核心组件：</p>\n<p><strong>1. 变量选择网络（VSN）</strong>：对静态协变量和时序输入分别用门控残差网络（GRN）+ softmax 特征选择，自动识别相关输入，抑制噪声变量。</p>\n<p>$$\\text{GRN}(a, c) = \\text{LayerNorm}(a + \\text{Dropout}(g \\cdot \\eta_1 + (1-g) \\cdot \\eta_2))$$</p>\n<p>其中 $g = \\sigma(W_g a + b_g)$ 为门控，$c$ 为上下文向量。</p>\n<p><strong>2. 静态协变量编码器</strong>：将静态特征编码为四个上下文向量，分别注入 VSN、LSTM 初始状态和注意力层。</p>\n<p><strong>3. LSTM 编解码器</strong>：局部时序处理，编码历史并生成未来初始预测。</p>\n<p><strong>4. 可解释多头注意力</strong>：修改标准 Transformer 注意力，使每个头共享 value 权重，从而每个头的注意力模式可直接解释。</p>\n<p>$$\\text{InterpretableMultiHead}(Q, K, V) = \\tilde{H} W_H, \\quad \\tilde{H} = \\{\\text{Attention}(Q W_Q^{(h)}, K W_K^{(h)}, V W_V)\\}_{h=1}^{m_H}$$</p>\n<p><strong>5. 分位数输出</strong>：输出预测分位数（如 P10/P50/P90），提供预测区间。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>在 Retail、Traffic、Electricity、Volatility 四个数据集上，TFT 的 P50/P90 分位数损失显著优于 DeepAR、DeepSSM、LSTM、MQRNN 等基线。</li>\n<li>变量选择：学到的特征权重能帮助识别全局重要变量（如零售中的价格、交通中的星期几）。</li>\n<li>时间模式：注意力权重揭示了持续的周期模式（如交通的早晚高峰）。</li>\n<li>事件识别：注意力突出显示显著事件时刻（如波动率数据集中的金融危机期间）。</li>\n<li>消融实验：VSN、门控和 LSTM 编码器各自带来显著提升。</li>\n</ul>\n<h2>创新点</h2>\n<p>1. 首次将静态协变量、已知未来输入、观测外生序列三类异构输入统一在一个模型中</p>\n<p>2. VSN + GRN 门控机制实现了样本级自适应的特征选择和网络深度控制</p>\n<p>3. 可解释多头注意力的设计（共享 value 权重）</p>\n<p>4. 分位数回归输出天然提供预测不确定性</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>LSTM 编码器限制了长程依赖的捕捉能力（相比纯 Transformer）</li>\n<li>主要针对低频/中等频率预测，未经高频金融数据验证</li>\n<li>金融时序中静态协变量的概念较弱（股票不会有&quot;位置&quot;这类元数据）</li>\n<li>可解释性依赖注意力机制的可信度，近年文献对注意力的可解释性有争议</li>\n<li>分位数回归不直接优化组合层面的风险/收益指标</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 全部公开数据集，官方 PyTorch 实现开源（google-research/tft）</li>\n<li><strong>方法清晰度</strong>: 期刊长文，每个组件描述详尽</li>\n<li><strong>计算成本</strong>: 中等 — LSTM+Attention，单 GPU 可训练</li>\n<li><strong>综合评分</strong>: ★3.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>TFT 的变量选择网络和可解释性机制对量化研究有参考价值——例如在数百个候选因子中选择真正有预测力的子集并解释其时间模式。但其设计（静态协变量、LSTM 编码器）更偏商业预测场景。若要在金融中应用，建议保留 VSN + 可解释注意力的核心设计，替换 LSTM 为更适合金融时序的编码器。</p>"}, {"key": "EFR8V2SF", "title": "Neural Network-based Automatic Factor Construction", "year": "2020", "authors": "Jie Fang, Jianwu Lin, Shutao Xia…", "tags": ["Computer Science - Machine Learning", "Quantitative Finance - Statistical Finance"], "venue": "", "abstract": "Instead of conducting manual factor construction based on traditional and behavioural finance analysis, academic researchers and quantitative investment managers have leveraged Genetic Programming (GP) as an automatic feature construction tool in recent years, which builds reverse polish mathematical expressions from trading data into new factors. However, with the development of deep learning, more powerful feature extraction tools are available. This paper proposes Neural Network-based Automatic Factor Construction (NNAFC), a tailored neural network framework that can automatically construct diversified financial factors based on financial domain knowledge and a variety of neural network structures. The experiment results show that NNAFC can construct more informative and diversified factors than GP, to effectively enrich the current factor pool. For the current market, both fully connected and recurrent neural network structures are better at extracting information from financial time series than convolution neural network structures. Moreover, new factors constructed by NNAFC can always improve the return, Sharpe ratio, and the max draw-down of a multi-factor quantitative investment strategy due to their introducing more information and diversification to the existing factor pool.", "url": "http://arxiv.org/abs/2008.06225", "date_added": "2026-05-26", "summarized": true, "rating": "★3.0", "starred": false, "repro": "—", "summary_html": "<h1>Neural Network-based Automatic Factor Construction</h1>\n<p>&gt; Zotero Key: <code>EFR8V2SF</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Jie Fang, Jianwu Lin, Shutao Xia, Yong Jiang, Zhikang Xia, Xiang Liu (清华大学)</li>\n<li><strong>年份</strong>: 2020</li>\n<li><strong>出处</strong>: Quantitative Finance, Vol. 08, No. 15, 2020</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2008.06225</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2008.06225</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/KFRQXLXR/Fang 等 - 2020 - Neural Network-based Automatic Factor Construction.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>提出 NNAFC 框架，用多种神经网络结构（全连接/RNN/CNN）自动从金融时序中构建新因子，替代遗传编程（GP）的公式演化方法；新因子与现有因子池合并后能持续提升多因子策略的收益率、夏普比率和最大回撤。</p>\n<h2>研究动机与问题</h2>\n<p>传统因子构建依赖人工定义（如 Fama-French 五因子、Barra 模型），耗时且难以从高维数据中发现非线性因子。遗传编程（GP）虽能自动生成公式因子，但：(1) 演化出的公式高度相似、输出相关性高；(2) 表达能力受限于公式形式。深度学习的兴起提供了更强大的自动特征提取能力，但此前未被系统性地用于金融因子构建。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: A 股（具体成分未列明，推测沪深 300 范围）</li>\n<li><strong>频率</strong>: 日频</li>\n<li><strong>样本区间</strong>: 约 2013-2018</li>\n<li><strong>数据来源</strong>: 中国 A 股市场交易数据和财务数据</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>NNAFC 的核心思路：将每个神经网络视为一个&quot;因子生成器&quot;，网络的输出即为新因子值。</p>\n<p><strong>三种子架构</strong>：</p>\n<p>1. <strong>FC-NN</strong>：全连接网络，输入为经过金融知识预处理的特征向量</p>\n<p>2. <strong>RNN-NN</strong>：LSTM 网络，输入为标准化的时序特征序列，天然捕捉时序依赖</p>\n<p>3. <strong>CNN-NN</strong>：1D 卷积网络，在时间窗口上滑动提取局部模式</p>\n<p><strong>因子构造流程</strong>：</p>\n<p>1. 用金融领域知识对原始数据预处理（对齐、缺失填充、标准化）</p>\n<p>2. 基于神经网络拟合未来收益</p>\n<p>3. 将网络中间层输出或最终预测值作为构造的新因子</p>\n<p>4. 通过组合不同的网络架构和随机种子实现因子多样性</p>\n<p><strong>评估方法</strong>：新因子与现有因子池合并，构建 IC 加权或等权多因子组合，对比加入前后的策略表现。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>NNAFC 构造的因子比 GP 更具信息量和多样性</li>\n<li>对于 A 股市场，FC 和 RNN 结构优于 CNN——时序依赖比局部模式更重要</li>\n<li>将 NNAFC 因子加入现有因子池后，<strong>收益率、夏普比率、最大回撤</strong>三项指标持续改善</li>\n<li>因子多样性是关键贡献——不同架构学习不同方面的信息</li>\n</ul>\n<h2>创新点</h2>\n<p>1. 首次系统性地将多种神经网络作为自动因子构造工具，与 GP 做 head-to-head 对比</p>\n<p>2. 明确了不同网络结构在金融因子构造中的适用性差异（FC/RNN &gt; CNN）</p>\n<p>3. 证明了深度因子对现有因子池的增量贡献（而非简单替代）</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>实验规模和数据细节（股票数、时间段）不够透明</li>\n<li>未明确给出具体 Sharpe/收益数字，结论偏定性</li>\n<li>因子可解释性有限——神经网络的输出难以追溯经济逻辑</li>\n<li>仅 A 股实验，未跨市场验证</li>\n<li>过拟合风险：在有限的 A 股历史上调参可能捕获噪音</li>\n<li>IC 加权组合未考虑真实交易约束</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: A 股日频数据可通过公开渠道获取</li>\n<li><strong>方法清晰度</strong>: 中等 — 框架思路清晰但实现细节（如中间层选取策略）不够具体</li>\n<li><strong>计算成本</strong>: 低至中等 — 日频数据，全连接/RNN 训练成本不高</li>\n<li><strong>综合评分</strong>: ★3.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>NNAFC 的核心思想(&quot;神经网络输出当因子用&quot;)直观且易实现，但论文的实现细节不够充分。最小可行版本：选取若干经典风格因子（momentum/value/size 等），训练一个简单 MLP/LSTM 预测下期收益，取网络输出作为&quot;深度因子&quot;，用 IC 评估其增量信息，再与基准因子池对比多因子组合表现。</p>"}, {"key": "YSFTYNGL", "title": "Enhancing Time Series Momentum Strategies Using Deep Neural Networks", "year": "2020", "authors": "Bryan Lim, Stefan Zohren, Stephen Roberts", "tags": ["Quantitative Finance - Trading and Market Microstructure", "Computer Science - Machine Learning", "Statistics - Machine Learning"], "venue": "", "abstract": "While time series momentum is a well-studied phenomenon in finance, common strategies require the explicit definition of both a trend estimator and a position sizing rule. In this paper, we introduce Deep Momentum Networks -- a hybrid approach which injects deep learning based trading rules into the volatility scaling framework of time series momentum. The model also simultaneously learns both trend estimation and position sizing in a data-driven manner, with networks directly trained by optimising the Sharpe ratio of the signal. Backtesting on a portfolio of 88 continuous futures contracts, we demonstrate that the Sharpe-optimised LSTM improved traditional methods by more than two times in the absence of transactions costs, and continue outperforming when considering transaction costs up to 2-3 basis points. To account for more illiquid assets, we also propose a turnover regularisation term which trains the network to factor in costs at run-time.", "url": "http://arxiv.org/abs/1904.04912", "date_added": "2026-05-26", "summarized": true, "rating": "★4.5", "starred": false, "repro": "复现中", "summary_html": "<h1>Enhancing Time Series Momentum Strategies Using Deep Neural Networks</h1>\n<p>&gt; Zotero Key: <code>YSFTYNGL</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Bryan Lim, Stefan Zohren, Stephen Roberts (Oxford-Man Institute)</li>\n<li><strong>年份</strong>: 2020</li>\n<li><strong>出处</strong>: Journal of Financial Data Science, 2019 / arXiv:1904.04912</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.1904.04912</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/1904.04912</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/FRV9JT4T/Lim 等 - 2020 - Enhancing Time Series Momentum Strategies Using Deep Neural Networks.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>提出 Deep Momentum Networks (DMN)，用 LSTM 直接替代时序动量策略中的趋势估计和头寸管理两个环节，以最大化夏普比率为训练目标，在 88 个连续商品期货上无成本时夏普翻倍，含 2-3 bps 交易成本时仍优于传统方法。</p>\n<h2>研究动机与问题</h2>\n<p>时序动量策略虽经典，但实现细节差异巨大——趋势估计的方法（移动平均 / 突破 / MACD）和头寸映射（固定阈值 / 波动率缩放）都需要显式定义。传统方法将两个步骤分开设计，而深度网络可以同时学习趋势估计和仓位映射，且能以夏普比率（而非 MSE）为直接优化目标。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 88 个连续商品期货合约（股指、固收、外汇、商品四大类）</li>\n<li><strong>频率</strong>: 日频</li>\n<li><strong>样本区间</strong>: 约 2000-2018（按时间划分训练/验证/测试）</li>\n<li><strong>数据来源</strong>: Pinnacle Data / CSI Data 等期货数据库</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>DMN 架构</strong>：</p>\n<p>1. <strong>输入</strong>：过去的日收益率序列（标准化至目标波动率），可选包含 MACD 等传统信号</p>\n<p>2. <strong>LSTM 编码器</strong>：将历史收益序列编码为隐藏状态 $h_t$</p>\n<p>3. <strong>输出头</strong>：全连接层将 $h_t$ 映射为标量信号值 $s_t \\in [-1, 1]$</p>\n<p>4. <strong>波动率缩放</strong>：最终仓位 $p_t = s_t / \\sigma_t^{\\text{target}}$，确保目标波动率恒定</p>\n<p><strong>直接夏普最优化</strong>：训练目标不使用 MSE 或分类损失，而是直接最大化夏普比率：</p>\n<p>$$\\mathcal{L} = -\\frac{\\mathbb{E}[R_t]}{\\sqrt{\\text{Var}[R_t]}}$$</p>\n<p>通过自动微分反向传播梯度。</p>\n<p><strong>换手率正则化</strong>：引入</p>\n<p>$$\\mathcal{L}_{\\text{reg}} = \\mathcal{L}_{\\text{Sharpe}} + \\lambda \\cdot \\text{Turnover}$$</p>\n<p>惩罚高换手，使网络在训练时即&quot;意识到&quot;交易成本，适应流动性较差的品种。</p>\n<p><strong>对比基线</strong>：TSMOM（经典 Moskowitz 方法）、MACD 信号、纯波动率缩放等。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>无成本</strong>：夏普最优 LSTM 将传统 TSMOM 的夏普比率提升超过 <strong>2 倍</strong>（例如从 ~0.5 到 ~1.0+）</li>\n<li><strong>含成本</strong>：在 2-3 bps 交易成本下 DMN 仍优于传统方法</li>\n<li><strong>换手率正则化</strong>有效降低交易频率，使 DMN 在更高成本环境下保持竞争力</li>\n<li><strong>趋势学习</strong>：分析 LSTM 隐藏状态发现网络学会了对不同周期趋势的加权组合，类似自适应 MACD</li>\n<li><strong>跨资产泛化</strong>：在四大类期货上均有提升，不限于特定品种</li>\n</ul>\n<h2>创新点</h2>\n<p>1. 首次将 Sharpe 直接作为神经网络的训练损失函数（而非后验指标）</p>\n<p>2. 端到端学习——同时替代趋势估计和头寸管理</p>\n<p>3. 换手率正则化在训练阶段内化交易成本约束</p>\n<p>4. 保留了波动率缩放框架，使网络专注于信号生成</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>日频动量在近年的表现已有退化（2020 年后的样本未包含）</li>\n<li>Sharpe 直接优化在小样本上容易过拟合（通过训练期间的 batch 设计缓解）</li>\n<li>LSTM 的可解释性仍有限——只对隐藏状态做了方向性分析</li>\n<li>仅连续期货，未测试股票/ETF</li>\n<li>88 个期货中部分高相关性品种可能 inflate 统计显著性</li>\n<li>波动率缩放假设了目标波动率为常数，在急剧变化的市场中可能失效</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 期货日线数据可通过 Bloomberg/天软获取</li>\n<li><strong>方法清晰度</strong>: 架构和训练方法描述清楚，附录有详细超参</li>\n<li><strong>计算成本</strong>: 低 — LSTM + 日频数据，单 GPU 几分钟完成训练</li>\n<li><strong>综合评分</strong>: ★4.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>是时序动量的深度学习方法论标杆，直接夏普优化和换手率正则化两个机制可轻松迁移到其他策略。最小可行版本：选取 10-20 个主要商品期货日线，实现 LSTM + Sharpe loss + 波动率缩放的 DMN，对比 TSMOM 基准。</p>"}, {"key": "G276AUFW", "title": "Building Cross-Sectional Systematic Strategies By Learning to Rank", "year": "2020", "authors": "Daniel Poh, Bryan Lim, Stefan Zohren…", "tags": ["Machine Learning", "Deep Neural Networks", "Information Retrieval", "Learning to Rank", "Momentum Strategies", "Portfolio Construction", "Systematic Trading"], "venue": "", "abstract": "The success of a cross-sectional systematic strategy depends critically on accurately ranking assets prior to portfolio construction. Contemporary techniques perform this ranking step either with simple heuristics or by sorting outputs from standard regression or classification models, which have been demonstrated to be sub-optimal for ranking in other domains (e.g. information retrieval). To address this deficiency, we propose a framework to enhance cross-sectional portfolios by incorporating learning-to-rank algorithms, which lead to improvements of ranking accuracy by learning pairwise and listwise structures across instruments. Using cross-sectional momentum as a demonstrative case study, we show that the use of modern machine learning ranking algorithms can substantially improve the trading performance of cross-sectional strategies -- providing approximately threefold boosting of Sharpe Ratios compared to traditional approaches.", "url": "https://papers.ssrn.com/abstract=3751012", "date_added": "2026-05-24", "summarized": true, "rating": "★4", "starred": false, "repro": "—", "summary_html": "<h1>Building Cross-Sectional Systematic Strategies By Learning to Rank</h1>\n<p>&gt; Zotero Key: <code>G276AUFW</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>:Daniel Poh, Bryan Lim, Stefan Zohren, Stephen Roberts</li>\n<li><strong>年份</strong>:2020</li>\n<li><strong>出处</strong>:SSRN (Oxford-Man Institute)</li>\n<li><strong>DOI</strong>:无</li>\n<li><strong>链接</strong>:https://papers.ssrn.com/abstract=3751012</li>\n<li><strong>本地 PDF</strong>:<code>~/Documents/Zotero/storage/RIMNB2EA/Poh 等 - 2020 - Building Cross-Sectional Systematic Strategies By Learning to Rank.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>将信息检索领域的 Learning-to-Rank(LTR)算法(RankNet、LambdaMART、ListNet、ListMLE)引入截面动量策略,通过学习资产间的 pairwise/listwise 排序结构,将 Sharpe 比提升约三倍(从 0.55-0.70 到 2.16),远超传统&quot;回归-排序&quot;两阶段方法。</p>\n<h2>研究动机与问题</h2>\n<p>截面策略(如截面动量)的核心在于准确排序资产:买入排名靠前的、卖出排名靠后的。现有方法要么用简单启发式(如 Jegadeesh &amp; Titman 的直接累积收益排序),要么用回归模型预测收益后再排序(regress-then-rank)。但回归模型的 MSE 损失只关心预测精度,不关心排序正确性——这在信息检索领域已被证明是次优的。本文首次将 LTR 算法系统性地引入截面系统化策略,提出通用框架。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>:NYSE 上市股票(CRSP share code 10&amp;11),剔除$1 以下股票</li>\n<li><strong>频率</strong>:月频调仓(每个交易日都不交易,避免高频交易成本)</li>\n<li><strong>样本区间</strong>:1980-2019;5 年滚窗重调参数(1980-1984 训练→1985-1989 测试,以此类推)</li>\n<li><strong>数据来源</strong>:CRSP 日频收盘价</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>通用截面策略框架</strong>分为 4 步:</p>\n<p>1. <strong>Score Calculation</strong>:模型 f 对资产 i 给出评分 Y_i</p>\n<p>2. <strong>Score Ranking</strong>:按评分排序得到 Z_i</p>\n<p>3. <strong>Security Selection</strong>:选前后各 10%(固定 100 只多/空)</p>\n<p>4. <strong>Portfolio Construction</strong>:波动率缩放至年化 15% 目标波动</p>\n<p><strong>评分方法对比</strong>:</p>\n<p>1. <strong>经典动量</strong>(Jegadeesh &amp; Titman, 1993):直接用过去 12 个月累积收益作为评分</p>\n<p>2. <strong>经典动量</strong>(Baz et al., 2015):用波动率归一化的 MACD 指标组合作为评分</p>\n<p>3. <strong>Regress-then-Rank(MLP)</strong>:用多层感知器预测未来 21 天收益,MSE 损失</p>\n<p>4. <strong>Pairwise LTR</strong>:</p>\n<p>   - RankNet:对资产对(pair)做交叉熵损失,判断哪只应该排名更高</p>\n<p>   - LambdaMART:结合 LambdaRank 梯度和 MART 树提升,可优化 NDCG 等不可微指标</p>\n<p>5. <strong>Listwise LTR</strong>:</p>\n<p>   - ListNet:用 softmax 计算&quot;top-one&quot;概率分布,交叉熵损失</p>\n<p>   - ListMLE:最大化似然损失,理论性质更好(一致、凸、可微)</p>\n<p><strong>预测因子</strong>(16 维):</p>\n<ul>\n<li>过去 3/6/12 个月原始累积收益</li>\n<li>过去 3/6/12 个月波动率归一化收益</li>\n<li>MACD 指标(8/24,16/48,32/96 三组)及其过去 1/3/6/12 个月的滞后值</li>\n</ul>\n<p><strong>训练细节</strong>:</p>\n<ul>\n<li>超参数用 HyperOpt 做 50 次搜索</li>\n<li>Adam 优化器,早停机制(25 个 epoch 无改善则停)</li>\n<li>2 层隐藏层,宽度为超参数</li>\n<li>Dropout 正则化</li>\n</ul>\n<h2>核心结论与关键结果</h2>\n<p><strong>全样本(年化 15% 波动归一化,不考虑交易成本)</strong>:</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>模型</th><th>期望月收益</th><th>Sharpe</th><th>最大回撤</th><th>Sortino</th><th>Calmar</th><th>胜率</th></tr>\n<tr><td>随机</td><td>2.4%</td><td>0.16</td><td>58.4%</td><td>0.23</td><td>0.04</td><td>54.5%</td></tr>\n<tr><td>JT 经典</td><td>9.2%</td><td>0.55</td><td>32.8%</td><td>0.87</td><td>0.28</td><td>58.2%</td></tr>\n<tr><td>Baz MACD</td><td>11.2%</td><td><strong>0.70</strong></td><td>33.7%</td><td>1.16</td><td>0.33</td><td>59.1%</td></tr>\n<tr><td>MLP 回归</td><td>4.4%</td><td>0.27</td><td>64.1%</td><td>0.39</td><td>0.07</td><td>55.1%</td></tr>\n<tr><td>RankNet</td><td>24.3%</td><td>1.50</td><td>29.4%</td><td>3.01</td><td>0.83</td><td>69.3%</td></tr>\n<tr><td><strong>LambdaMART</strong></td><td><strong>35.9%</strong></td><td><strong>2.16</strong></td><td><strong>23.1%</strong></td><td><strong>5.32</strong></td><td><strong>1.56</strong></td><td><strong>76.2%</strong></td></tr>\n<tr><td>ListNet</td><td>30.6%</td><td>1.97</td><td>27.4%</td><td>4.47</td><td>1.12</td><td>71.5%</td></tr>\n<tr><td>ListMLE</td><td>26.0%</td><td>1.61</td><td>23.6%</td><td>3.65</td><td>1.10</td><td>68.1%</td></tr>\n</table></div>\n<p><strong>排序质量指标</strong>:</p>\n<ul>\n<li>NDCG@100:LambdaMART 0.576(多),0.585(空),显著高于基线</li>\n<li>Kendall&#x27;s Tau:LambdaMART 0.032,ListNet 0.033,基线仅 0.008-0.016</li>\n</ul>\n<p><strong>十分组表现</strong>:LTR 方法的组间区分度显著更强(decile 1 到 decile 10 的 Sharpe 从 0.075/0.263 上升到 1.232/1.238),验证了排序质量与策略表现的直接关联。</p>\n<p><strong>关键发现</strong>:</p>\n<ul>\n<li>LambdaMART 是表现最优的 LTR 模型(树模型天然适合中小样本)</li>\n<li>Listwise 方法(ListNet/ListMLE)并未显著优于 Pairwise(LambdaMART),可能因为金融数据信噪比低,listwise 需要更多样本</li>\n<li>MLP(regress-then-rank)仅略优于随机,证明 MSE 损失对排序目标的次优性</li>\n<li>LTR 约三倍提升 Sharpe(从 0.70 到 2.16)</li>\n</ul>\n<h2>创新点</h2>\n<p>1. <strong>首次将 LTR 系统应用于截面动量策略</strong>:提供通用框架,不限于动量因子</p>\n<p>2. <strong>模块化设计</strong>:预测因子可替换为其他特征(价值、carry 等),框架通用</p>\n<p>3. <strong>全面的对比实验</strong>:覆盖经典启发式、回归方法、pairwise/listwise LTR,含排序质量和财务指标</p>\n<p>4. <strong>验证排序质量与策略表现的直接因果链</strong></p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>未考虑交易成本</strong>:所有结果都是毛收益,高频调仓(月频)下成本不可忽视</li>\n<li><strong>仅美股</strong>:未验证跨资产类别的泛化性</li>\n<li><strong>仅截面动量</strong>:虽然宣称框架通用,但案例仅动量</li>\n<li><strong>数据量有限</strong>:listwise 方法样本不足(单月仅 N_avg 只股票),可能影响比较公平性</li>\n<li><strong>较旧(2020)</strong>:之后深度学习排序方法有新的进展</li>\n<li><strong>特征限于价量</strong>:未包含基本面、另类数据</li>\n<li><strong>过拟合风险</strong>:LambdaMART 的树模型容易过拟合,虽然 5 年滚窗有缓解</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>:美股 CRSP 数据不可直接获取,但可用天软国内股票数据替代测试</li>\n<li><strong>方法清晰度</strong>:非常清晰,含完整框架、损失函数、超参数搜索空间</li>\n<li><strong>计算成本</strong>:低。MLP 和 LTR 模型训练成本很低,CPU 即可</li>\n<li><strong>综合评分</strong>:★★★★☆(想法好实现成本低,但 2020 年论文不是最新)</li>\n</ul>\n<h2>复现备注</h2>\n<p>若决定复现:</p>\n<p>1. <strong>最简版本</strong>:用天软数据,选国内期货品种,构造截面动量信号</p>\n<p>2. <strong>直接调用</strong>:Python 的 XGBoost 库直接支持 LambdaMART(objective=&#x27;rank:pairwise&#x27;, eval_metric=&#x27;ndcg&#x27;)</p>\n<p>3. <strong>推荐用 LambdaMART</strong>:树模型对金融数据信噪比更稳健</p>\n<p>4. 可放在 （内部研究目录） 下</p>"}, {"key": "7L36N8S2", "title": "DeepLOB: Deep Convolutional Neural Networks for Limit Order Books", "year": "2019", "authors": "Zihao Zhang, Stefan Zohren, Stephen Roberts", "tags": ["Quantitative Finance - Computational Finance"], "venue": "IEEE Transactions on Signal Processing", "abstract": "We develop a large-scale deep learning model to predict price movements from limit order book (LOB) data of cash equities. The architecture utilises convolutional filters to capture the spatial structure of the limit order books as well as LSTM modules to capture longer time dependencies. The proposed network outperforms all existing state-of-the-art algorithms on the benchmark LOB dataset [1]. In a more realistic setting, we test our model by using one year market quotes from the London Stock Exchange and the model delivers a remarkably stable out-of-sample prediction accuracy for a variety of instruments. Importantly, our model translates well to instruments which were not part of the training set, indicating the model's ability to extract universal features. In order to better understand these features and to go beyond a \"black box\" model, we perform a sensitivity analysis to understand the rationale behind the model predictions and reveal the components of LOBs that are most relevant. The ability to extract robust features which translate well to other instruments is an important property of our model which has many other applications.", "url": "http://arxiv.org/abs/1808.03668", "date_added": "2026-05-26", "summarized": true, "rating": "★3.5", "starred": false, "repro": "—", "summary_html": "<h1>DeepLOB: Deep Convolutional Neural Networks for Limit Order Books</h1>\n<p>&gt; Zotero Key: <code>7L36N8S2</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Zihao Zhang, Stefan Zohren, Stephen Roberts (Oxford-Man Institute)</li>\n<li><strong>年份</strong>: 2019</li>\n<li><strong>出处</strong>: IEEE Transactions on Signal Processing, 2019</li>\n<li><strong>DOI</strong>: 10.1109/TSP.2019.2907260</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/1808.03668</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/UIN6BSM8/Zhang 等 - 2019 - DeepLOB Deep Convolutional Neural Networks for Limit Order Books.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>提出 DeepLOB，用 Inception 卷积模块提取限价订单簿（LOB）的跨层级空间结构，结合 LSTM 捕捉时序动态，在 FI-2010 基准上全面超越已有方法，并在 LSE 实盘数据上展示了对未见过股票的稳健泛化能力。</p>\n<h2>研究动机与问题</h2>\n<p>LOB 数据是高维、高噪、非平稳的复杂动态环境。传统方法（VAR、ARIMA）依赖手工特征，参数空间受限，难以刻画多个 LOB 层级间的复杂空间交互。已有的机器学习方法（如 SVM、简单 MLP）也受限于手工特征。目标是设计一个端到端的深度学习架构，自动提取 LOB 的跨层级空间特征和时序依赖。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: FI-2010 基准（北欧股票 5 只，10 天）；LSE（5 只股票，1 年 tick 级数据）</li>\n<li><strong>频率</strong>: tick 级 / 降采样至固定档位</li>\n<li><strong>样本区间</strong>: FI-2010 为连续 10 天；LSE 约 1 年训练 + 3 个月测试</li>\n<li><strong>数据来源</strong>: FI-2010 公开基准 + LSE 实盘报价数据</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>DeepLOB 架构</strong>：</p>\n<p>1. <strong>卷积特征提取模块</strong>（Inception Module）：</p>\n<p>   - 输入为过去 $T$ 个时间步的 LOB 快照，每步包含多档（如前 10 档）的价格和量</p>\n<p>   - 多个并行的不同核大小的 1D 卷积（卷积在 LOB 层级维度上）+ MaxPooling，类似 GoogleNet Inception</p>\n<p>   - 目的：在不同感受野上捕捉买/卖两侧各档位的空间交互模式</p>\n<p>2. <strong>LSTM 时序模块</strong>：</p>\n<p>   - 将卷积模块的输出特征图展平后送入 LSTM</p>\n<p>   - 捕捉特征在时间维度上的动态演化</p>\n<p>3. <strong>全连接分类头</strong>：</p>\n<p>   - 输出三分类预测：价格上涨 / 下跌 / 不变（或 $k$ 步后中间价变动方向）</p>\n<p><strong>训练方法</strong>：交叉熵分类损失，严格按照时间顺序划分训练/验证/测试。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>FI-2010 基准</strong>：DeepLOB 在所有预测步长和股票上全面超越当时的 SOTA 方法（多层感知机、SVM、简单 CNN/LSTM 等）</li>\n<li><strong>LSE 数据</strong>：在 5 只 LSE 股票上 3 个月外样本预测准确率稳定且远高于随机</li>\n<li><strong>跨股票泛化</strong>：用部分股票训练的模型在未见过股票上仍保持良好预测能力，表明学到了订单簿的通用特征</li>\n<li><strong>敏感度分析</strong>：通过对输入特征做扰动实验，发现靠近最优买卖价（top of book）的 LOB 层级对预测最重要，且买卖两侧的信息量不对称</li>\n</ul>\n<h2>创新点</h2>\n<p>1. 将 Inception 模块引入 LOB 建模，同时捕捉不同感受野的空间交互</p>\n<p>2. CNN + LSTM 的混合架构首次大规模应用于 LOB 预测</p>\n<p>3. 跨股票泛化能力的系统验证——暗示 LOB 中存在通用微观结构特征</p>\n<p>4. 通过扰动实验提供了一定程度的模型可解释性</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>仅预测价格运动方向（分类），不提供具体的交易信号或仓位建议</li>\n<li>FI-2010 基准数据集太小（仅 10 天），可能导致过拟合</li>\n<li>未考虑交易成本、延迟、队列位置等实际交易约束</li>\n<li>高频策略的高度竞争性——即使有统计显著的方向预测能力，利润也可能被成本和延迟完全侵蚀</li>\n<li>从预测方向到产生利润还需要完整的执行模型，论文未涉及</li>\n<li>IEEE TSP 版本与 arXiv 版本内容基本一致，创新性在同领域接受度良好</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: FI-2010 公开（但规模有限），LSE 数据需购买；A 股 L2 数据可从通达信/聚宽获取</li>\n<li><strong>方法清晰度</strong>: 架构描述完整，代码在 GitHub (zcakhaa/DeepLOB) 开源</li>\n<li><strong>计算成本</strong>: 中等 — tick 级数据 + CNN+LSTM，需 GPU</li>\n<li><strong>综合评分</strong>: ★3.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>DeepLOB 在高频 LOB 预测领域是经典基线，但应用到量化策略需要大量额外工作（信号到仓位、成本建模、执行）。最小可行版本不在因子层面，建议直接使用开源代码在 FI-2010 上复现后评估是否有必要扩展到 A 股 LOB 数据。纯高频方向，与当前组合/因子层面的复现路线不同，回归优先级拉低。</p>"}, {"key": "9XW9DYXS", "title": "A Tale of Two Premiums: The Role of Hedgers and Speculators in Commodity Futures Markets", "year": "2019", "authors": "Wenjin Kang, K. Geert Rouwenhorst, Ke Tang", "tags": ["Commodity futures", "liquidity provision", "hedging pressure", "return predictability", "risk premium", "theory of normal backwardation"], "venue": "",
