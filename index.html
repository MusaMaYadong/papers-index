h><th>S&amp;P 500</th></tr>\n<tr><td>年化收益</td><td>10.87%</td><td>11.17%</td></tr>\n<tr><td>波动率</td><td>8.50%</td><td>15.28%</td></tr>\n<tr><td>Sharpe</td><td><strong>0.89</strong></td><td>0.57</td></tr>\n<tr><td>Sortino</td><td><strong>1.59</strong></td><td>0.83</td></tr>\n<tr><td>最大回撤</td><td><strong>-14.81%</strong></td><td>-50.97%</td></tr>\n<tr><td>最差年份</td><td><strong>-6.94%</strong></td><td>-37.02%</td></tr>\n<tr><td>与标普相关性</td><td>0.45</td><td>0.99</td></tr>\n</table></div>\n<p><strong>危机表现</strong>:</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>事件</th><th>Defense First</th><th>S&amp;P 500</th></tr>\n<tr><td>黑色星期一 (1987)</td><td>-6.43%</td><td>-29.78%</td></tr>\n<tr><td>互联网泡沫 (2000-02)</td><td>-9.77%</td><td>-44.82%</td></tr>\n<tr><td>GFC</td><td>-14.61%</td><td>-50.97%</td></tr>\n<tr><td>COVID (Q1 2020)</td><td><strong>0.00%</strong></td><td>-19.63%</td></tr>\n<tr><td>通胀冲击 (2022)</td><td>-6.70%</td><td>-23.95%</td></tr>\n</table></div>\n<ul>\n<li>年换手率约 230%，按 25 bps 交易成本估算，扣除后年化收益约 9.59%</li>\n<li>Upside capture 42.81%，Downside capture 仅 <strong>12.49%</strong></li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>四维度防御资产框架（久期/货币不稳定/通胀/美元流动性危机），每个对应一个宏观风险体制</li>\n<li>绝对动量过滤 + SPY fallback 机制——保证资金不闲置，防御资产全弱时仍能参与市场</li>\n<li>极其简单的规则（4 个 ETF + 月度调仓），任何人都可以实施</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>极简主义即是弱点也是优点</strong>——没有宏观体制判断、没有波动率目标、没有相关性管理</li>\n<li>ETF 前数据用代理拼接，早期（1986-2004）表现可能存在数据挖掘偏差</li>\n<li>年度换手率 230% 意味着月均近 20%，含税账户中资本利得税会显著侵蚀收益</li>\n<li>未做样本外测试——整段历史就是训练集</li>\n<li>四个防御资产中 UUP（美元指数 ETF）2007 年才成立，早期代理的代表性存疑</li>\n<li>固定 40/30/20/10 权重分配缺乏理论依据</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 极高——所有品种均有公开 ETF 数据，历史代理也可用 futures 替代</li>\n<li><strong>方法清晰度</strong>: 极高——策略规则半页纸即可完整描述</li>\n<li><strong>计算成本</strong>: 极低——月度计算，excel 级别</li>\n<li><strong>综合评分</strong>: ★★★★☆ 4.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>这是这批论文中最容易复现的策略，且实际应用价值高。建议最小可行版本：直接使用 GLD/TLT/DBC/UUP/SPY ETF 数据从 2007 年起的实盘交易数据回测。扩展方向：(1) 用期货替代 ETF 实现更好的资本效率；(2) 加入波动率目标控制；(3) 用更复杂的权重分配替代固定 40/30/20/10；(4) 加入阈值容忍带（±5%）减少不必要换手。需注意 ETF 层面的费用和滑点在中国市场可能有较大差异。</p>"}, {"key": "VUKR6WBK", "title": "Crisis Alpha in the Post-2020 Regime: Optimizing Time Series Momentum via Multi-Frequency Signal Blending", "year": "2025", "authors": "George Coburn", "tags": ["Time-Series Momentum", "Economics", "Finance", "Trading", "Trading Algorithm"], "venue": "", "abstract": "This paper investigates the efficacy of a Time Series Momentum (TSM) trading strategy as a tail-risk hedge in a post-2020 macroeconomic regime. The baseline strategy, as outlined in Time Series Momentum (Moskowitz et al., 2012) implemented a trend-following strategy that provides diversification, however suffered from significant volatility in short-term market reversals. To address this, I propose and test an optimised \"Blended Momentum\" framework that diversifies signal generation across 1month, 3-month, and 12-month lookback horizons, coupled with inverse volatility targeting (", "url": "https://papers.ssrn.com/abstract=5940134", "date_added": "2026-05-24", "summarized": true, "rating": "★2", "starred": false, "repro": "—", "summary_html": "<h1>Crisis Alpha in the Post-2020 Regime: Optimizing Time Series Momentum via Multi-Frequency Signal Blending</h1>\n<p>&gt; Zotero Key: <code>VUKR6WBK</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Coburn, George</li>\n<li><strong>年份</strong>: 2025</li>\n<li><strong>出处</strong>: 昆士兰大学本科生工作论文（B.Com/B.Econ）</li>\n<li><strong>DOI</strong>: —</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=5940134</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/DJIUU2I5/Coburn - 2025 - Crisis Alpha in the Post-2020 Regime...pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>将 TSM 的单一 12 个月信号扩展为 1/3/12 个月多频率混合信号，配合逆波动率仓位调整，将 Sharpe 从 0.91 提升至 0.96，并在 2022 年通胀冲击中产生正绝对收益（&quot;危机 Alpha&quot;）。</p>\n<h2>研究动机与问题</h2>\n<p>2022 年股债同跌使传统 60/40 失效，作者探讨 TSM 趋势跟踪能否作为尾部风险对冲。为减少单一 12 个月信号在快速市场反转时的&quot;鞭打损失&quot;（whipsaw），提出多频率混合信号来平滑反应速度。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 8 只 ETF（SPY, EFA, IEF, TLT, DBC, GLD, VNQ, BTC-USD），覆盖股票/债券/大宗商品/加密货币/房地产</li>\n<li><strong>频率</strong>: 日度（波动率计算）；月度（信号生成）</li>\n<li><strong>样本区间</strong>: 2010 年 1 月–2025 年 12 月</li>\n<li><strong>数据来源</strong>: Yahoo Finance API（yfinance）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>多频率混合信号</strong>:</p>\n<p>$$S_t = \\frac{1}{3}\\left[\\text{sgn}(r_{1m}) + \\text{sgn}(r_{3m}) + \\text{sgn}(r_{12m})\\right]$$</p>\n<p>信号值域为 $\\{-1, -1/3, +1/3, +1\\}$，代表强空/弱空/弱多/强多四档仓位。</p>\n<p><strong>仓位大小</strong>（逆波动率靶向）:</p>\n<p>$$\\text{Position}_{i,t} = S_{i,t} \\times \\frac{\\sigma_{\\text{target}}}{\\sigma_{i,t}}$$</p>\n<ul>\n<li>$\\sigma_{\\text{target}} = 20\\%$（年化）</li>\n<li>$\\sigma_{i,t}$：60 日滚动实现波动率（年化）</li>\n<li>杠杆上限：2.5 倍</li>\n</ul>\n<p><strong>基准</strong>: 12 个月单信号 TSM，同一宇宙。</p>\n<h2>核心结论与关键结果</h2>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>策略</th><th>年化收益</th><th>Sharpe</th></tr>\n<tr><td>S&amp;P500</td><td>11.1%</td><td>0.74</td></tr>\n<tr><td>基准 TSM（12m）</td><td>9.3%</td><td>0.91</td></tr>\n<tr><td>混合动量（1/3/12m）</td><td>10.6%</td><td>0.96</td></tr>\n</table></div>\n<ul>\n<li>CAPM α（年化）= 11.5%，t = 4.61，市场 β = -0.08（策略与市场几乎不相关）。</li>\n<li>2022 年通胀冲击期间：策略持续正收益，S&amp;P500 下跌约 20%，相关性 = 0.04。</li>\n<li>2024 年后特朗普行情中，策略跑输纯股票（符合趋势跟踪在股票单边牛市中的特性）。</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>将多频率信号混合应用于后 2020 宏观制度，验证了&quot;危机 Alpha&quot;的有效性。</li>\n<li>三档信号混合提供连续仓位（而非二元 ±1），减少换仓频率和鞭打损失。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>学术水平较低</strong>：本科生论文，样本期仅 15 年，统计功效不足。</li>\n<li>仅 8 只 ETF，宇宙极小，没有真正的分散化收益。</li>\n<li>多频率混合与逆波动率并非新方法（AQR/Man 等机构已广泛使用），无文献对比。</li>\n<li>未模型化交易成本，换仓频率可能较高（1 个月信号每月可能翻转）。</li>\n<li>回测窗口（2010–2025）包含 GFC 后的货币宽松环境，可能存在结构性偏误。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 数据仅需 Yahoo Finance，极易获取。</li>\n<li><strong>方法清晰度</strong>: 公式完整，Python（pandas/numpy）即可实现，2 小时内可复现。</li>\n<li><strong>计算成本</strong>: 极低。</li>\n<li><strong>综合评分</strong>: ★2.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>不建议复现：样本量太小，论文学术质量不足以支撑进一步研究。</p>"}, {"key": "2XD2MS58", "title": "Caveats of Simple Factor Timing Strategies", "year": "2025", "authors": "David Blitz", "tags": ["Value", "Momentum", "Factor decay", "Factor investing", "Factor timing", "P-hacking", "Quality"], "venue": "", "abstract": "This short article discusses the caveats of apparently simple yet highly effective factor timing strategies. Applying various such strategies to the standard U.S. Fama-French factors we find t-statistics up to 5, with combination strategies reaching even higher levels. However, some factor timing strategies have questionable after-cost profitability because of high turnover. Others suffer from substantial performance decay in recent years. Next to such general concerns we identify various strategy-specific concerns. We propose to establish minimum standards for future factor timing studies, including carefully examining explicit or implicit loadings on the phenomena described in this article, clearly establishing the distinctiveness of reported alphas, and addressing susceptibility to known limitations.", "url": "https://papers.ssrn.com/abstract=5256938", "date_added": "2026-05-24", "summarized": true, "rating": "★4.0", "starred": false, "repro": "—", "summary_html": "<h1>Caveats of Simple Factor Timing Strategies</h1>\n<p>&gt; Zotero Key: <code>2XD2MS58</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: David Blitz (Robeco)</li>\n<li><strong>年份</strong>: 2025</li>\n<li><strong>出处</strong>: SSRN</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.5256938</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=5256938</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/U5GFN49Z/Blitz - 2025 - Caveats of Simple Factor Timing Strategies.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>一篇精悍的&quot;因子择时陷阱清单&quot;——在 Fama-French 五因子上测试了 7 种看似简单有效的择时策略，逐一揭露其隐患（交易成本侵蚀、业绩衰减、对已知因子的隐含暴露、虚假回归等），并提供了可供未来研究自查的 12 条最低标准检查清单。</p>\n<h2>研究动机与问题</h2>\n<p>越来越多研究声称发现了简单而高效的因子择时策略，t 值动辄达到 5 甚至更高。但作者对其&quot;增量贡献&quot;表示失望——很多策略不过是已知现象的重新包装。本文系统梳理 7 种简单因子择时策略的核心隐患，为未来研究设定最低标准。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: Fama-French 五因子（SMB/HML/RMW/CMA/WML，美国股票市场）</li>\n<li><strong>频率</strong>: 月度</li>\n<li><strong>样本区间</strong>: 1963/07–2024/12</li>\n<li><strong>数据来源</strong>: Kenneth French Data Library</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>对以下 7 种策略分别回测，与 1/N（五因子各 20%）基准对比：</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>#</th><th>策略</th><th>超额收益</th><th>t 值</th><th>核心隐患</th></tr>\n<tr><td>1</td><td>短期因子动量（1 月）</td><td>2.8%/年</td><td>4.9</td><td>高换手→交易成本侵蚀；2011 年后超额仅 0.4%；月末再平衡偏差（-30% 调整后）</td></tr>\n<tr><td>2</td><td>中期因子动量（12 月）</td><td>1.7%/年</td><td>3.0</td><td>对 WML 因子的 beta t 值高达 25，alpha 被完全解释；2011 年后也仅 0.4%</td></tr>\n<tr><td>3</td><td>结构性超配 WML/低配 SMB</td><td>1.0%/年</td><td>2.1</td><td>事后才知道动量最好/规模最差；不是择时而是静态配置偏差</td></tr>\n<tr><td>4</td><td>波动率缩放动量</td><td>0.6%/年</td><td>4.2</td><td>用特质动量（idiosyncratic momentum）替代即可实现同等效果</td></tr>\n<tr><td>5</td><td>季节性动量</td><td>1.6%/年</td><td>2.7</td><td>高换手+严重业绩衰减：前半段比后半段强 4 倍，2011 后为负</td></tr>\n<tr><td>6</td><td>投资者情绪（Baker-Wurgler）</td><td>1.8%/年</td><td>3.4</td><td>情绪指数实时计算困难；2009 年后 80%+ 时间为负→等同不投因子；波动率显著高于基准</td></tr>\n<tr><td>7</td><td>因子业绩衰减（线性缩仓）</td><td>0.9%/年</td><td>2.8</td><td>从根本上就有缺陷——到样本期末仓位归零，等于放弃策略</td></tr>\n</table></div>\n<h3>关键交互发现</h3>\n<ul>\n<li>债券收益率水平预测因子收益 t=2.9，但收益率是非平稳序列——与线性时间衰减指标相关 61%，实质是<strong>虚假回归</strong></li>\n<li>估值价差择时类似基础价值投资，因子择时本身无额外贡献</li>\n<li>GDP/失业率等宏观指标存在事后修正问题，回测用的数据和实际可得数据不一致</li>\n</ul>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>7 种策略之间的相关性极低（多在 -0.30 到 +0.30），等权组合超额 1.5%/年、t=6.9</li>\n<li>但每种策略都有其&quot;阿喀琉斯之踵&quot;——要么换手太高、要么业绩衰减、要么隐含暴露于已知因子</li>\n<li>优化权重的组合 t 值可达 8.2（最优权重偏向波动率缩放动量 43%），但这本身就是 p-hacking</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>提供了一份可供所有因子择时研究者使用的 <strong>12 条检查清单</strong>，覆盖：因子范围、业绩衰减、交易成本、spanning alpha、结构性偏差、波动率缩放、情绪指数、风险可比性、杠杆依赖、虚假回归、数据修正、p-hacking、经济关系稳定性</li>\n<li>系统揭示复杂 ML 模型可能隐含地利用了简单已知现象</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>仅用 Fama-French 五因子，结论可能对更广泛的因子库不完全适用</li>\n<li>作者来自 Robeco，其立场天然倾向于&quot;因子择时很难&quot;——存在机构偏见的可能性</li>\n<li>对 ML 方法的批评较为笼统，未具体测试典型 ML 择时架构</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 极高——Fama-French 因子数据完全公开免费</li>\n<li><strong>方法清晰度</strong>: 高——每种策略规则均有明确描述</li>\n<li><strong>计算成本</strong>: 极低——月度数据，无需训练</li>\n<li><strong>综合评分</strong>: ★★★★☆ 4.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>不直接提供可交易的策略，而是提供<strong>研究过程中的自查框架</strong>——这正是其最大价值。在开发任何因子择时策略时，应逐条对照检查清单，尤其注意：(1) 去除交易成本后是否仍有显著 alpha；(2) spanning regression 是否清除了对已知因子的暴露；(3) 业绩是否在 2011 年后仍显著。建议将这份清单整合到因子研究的标准工作流中。</p>"}, {"key": "YCTIETIW", "title": "Breaking the Trend: How to Avoid Cherry-Picked Signals", "year": "2025", "authors": "Sebastien Valeyre", "tags": ["Quantitative Finance - Portfolio Management"], "venue": "", "abstract": "Our empirical results show an impressive fit with the pretty complex theoretical Sharpe formula of a trend-following strategy depending on the parameter of the signal, which was derived by by Grebenkov and Serror (2014). That empirical fit convinces us that a mean-reversion process with only one time scale is enough to model, in a pretty precise way, the reality of the trend-following mechanism at the average scale of CTAs and as a consequence, using only one simple EMA, appears optimal to capture the trend. As a consequence, using a complex basket of different complex indicators as signal, do not seem to be so rational or optimal and exposes to the risk of cherry-picking.", "url": "http://arxiv.org/abs/2504.10914", "date_added": "2026-06-26", "summarized": true, "rating": "★4.0", "starred": false, "repro": "—", "summary_html": "<h1>Breaking the Trend: How to Avoid Cherry-Picked Signals</h1>\n<p>&gt; Zotero Key: <code>YCTIETIW</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Sebastien Valeyre</li>\n<li><strong>年份</strong>: 2025</li>\n<li><strong>出处</strong>: arXiv (2025-04, v11 2025-12-31)</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2504.10914</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2504.10914</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/8FM3QAXR/Valeyre - 2025 - Breaking the Trend How to Avoid Cherry-Picked Signals.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>通过在全球期货 ARP 组合上实证验证 Grebenkov &amp; Serror (2014) 的理论 Sharpe 公式，论文证明仅用一个时间尺度的 EMA 即可最优捕捉趋势，使用多时间尺度复杂信号组合（MACD 等）并不增益，且显著暴露于 cherry-picking 过拟合风险。</p>\n<h2>研究动机与问题</h2>\n<p>CTA 行业普遍使用 SMA、EMA、MACD、Bollinger Bands 等指标的复杂组合作为趋势信号，参数选取主要靠历史回测优化——这天然引入数据窥探偏差。Grebenkov &amp; Serror (2014) 基于 AR(1) 过程推导出趋势跟随策略的理论 Sharpe 公式，但一直缺乏系统性实证验证。本文提供此验证，并以结论反推：若理论成立，EMA 就是最优单指标，复杂指标的超额绩效只不过是样本内过拟合。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 70只全球期货（股指、债券、外汇、商品期货），见附录 C</li>\n<li><strong>频率</strong>: 日频</li>\n<li><strong>样本区间</strong>: 1990年5月29日—2023年12月7日（约33年）</li>\n<li><strong>数据来源</strong>: 未具名商业数据库（未公开）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n    A[70只全球期货日收益\\n1990-2023] --&gt; B[标准化 EMA 指标\\nphi_it = EMA 归一化收益]\n    A --&gt; C[多时间尺度 MACD\\nMACD eta1 eta2 eta3 omega1 omega2 omega3]\n    B &amp; C --&gt; D[ARP 组合构造\\n归一化信号 x 相关矩阵逆平方根]\n    D --&gt; E[目标波动率调仓\\nARP_t+1 = ARP_hat / sqrt ARP_hat Sigma ARP_hat]\n    E --&gt; F[样本外 Sharpe 比实测]\n    F --&gt; G[对比 Grebenkov 理论 Sharpe S eta\\n拟合 beta0 与 lambda 参数]\n    G --&gt; H{理论 vs 实证拟合度}\n    H --&gt;|良好拟合| I[结论: 单 EMA 最优\\n复杂指标无显著增益]\n    H --&gt;|拟合偏离| J[说明多时间尺度记忆效应或噪声]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>收益模型（Grebenkov &amp; Serror, 2014）</strong>: 假设资产收益由 AR(1) 过程生成：</p>\n<p>$$r_{i,t} = \\epsilon_{i,t} + \\beta\\sum_{k=1}^{t-1}(1-\\lambda)^{t-1-k}\\xi_{i,k}$$</p>\n<p>其中 $\\epsilon_{i,t}$ 为 i.i.d. 噪声，$\\xi_{i,k}$ 为趋势驱动项，$\\lambda$ 为均值回归速度，$\\beta$ 为趋势强度。</p>\n<p>2. <strong>归一化 EMA 指标</strong>: 对资产 $i$ 在时刻 $t$，递推更新：</p>\n<p>$$\\sigma_{i,t+1}^2(\\eta) = (1-\\eta)\\sigma_{i,t}^2(\\eta) + \\eta r_{i,t+1}^2$$</p>\n<p>$$\\phi_{i,t+1}(\\eta) = (1-\\eta)\\phi_{i,t}(\\eta) + \\sqrt{\\eta}\\frac{r_{i,t+1}}{\\sigma_{i,t}(\\eta)}$$</p>\n<p>其中 $\\eta$ 为 EMA 平滑参数（半衰期 $\\approx\\ln(2)/\\eta$ 天），$\\phi$ 为归一化趋势指标，方差理论上约为1。</p>\n<p>3. <strong>MACD 三时间尺度指标</strong>: 为测试多时间尺度效益，构造：</p>\n<p>$$\\text{MACD}_{i,t}(\\eta_1,\\eta_2,\\eta_3,\\omega_1,\\omega_2,\\omega_3) = \\omega_1\\phi_{i,t}(\\eta_1)+\\omega_2\\phi_{i,t}(\\eta_2)+\\omega_3\\phi_{i,t}(\\eta_3)$$</p>\n<p>约束 $\\sum_j\\omega_j\\sqrt{\\eta_j}=0$（零斜率条件，排除极短期均值回复贡献）。</p>\n<p>4. <strong>Agnostic Risk Parity（ARP）组合</strong>:</p>\n<p>$$\\hat{\\text{ARP}}_{t+1} = (1-\\rho)\\hat{\\text{ARP}}_t + \\rho\\Sigma_t^{-1}C_t^{-0.5}\\phi_t(\\eta)$$</p>\n<p>$$\\text{ARP}_{t+1} = \\frac{\\hat{\\text{ARP}}_{t+1}}{\\sqrt{\\hat{\\text{ARP}}_{t+1}^\\top C_t\\Sigma_t\\hat{\\text{ARP}}_{t+1}}}$$</p>\n<p>其中 $C_t$ 为相关矩阵（750日 EWA），$\\Sigma_t$ 为波动率向量（40日 EWA），$\\rho=1/20$ 为组合平滑参数。</p>\n<p>5. <strong>理论 Sharpe 公式（Grebenkov &amp; Serror, 2014）</strong>:</p>\n<p>$$\\mathbf{S}(\\eta) = \\frac{\\beta_0^2\\sqrt{2\\eta}-\\frac{2}{\\pi}\\theta\\sqrt{\\eta(\\lambda+\\eta)}}{\\sqrt{(\\lambda+\\eta)^2+2\\beta_0^2(\\lambda+\\eta)}}$$</p>\n<p>其中 $\\beta_0=\\beta/\\sqrt{\\lambda(2-\\lambda)}$ 为归一化趋势强度，$\\theta$ 为交易成本参数。</p>\n<p>6. <strong>实证验证</strong>: 对 ARP 策略在 70 只期货全集上回测，改变 $\\eta$ 扫描 EMA 时间尺度，将实测 Sharpe vs $\\eta$ 曲线拟合理论公式，估计 $\\beta_0$ 和 $\\lambda$（道琼斯 100 年数据拟合值 $\\lambda=0.01$，$\\beta_0=0.1$）。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>理论 Sharpe 公式拟合优秀</strong>：实测 Sharpe 比随 EMA 参数 $\\eta$ 的变化曲线与 Grebenkov 理论公式高度吻合，支持单时间尺度 AR(1) 过程假设。</li>\n<li><strong>单 EMA 已是最优</strong>：在 ARP 框架下，添加更多时间尺度（MACD 类指标）相对于最优单 EMA 无显著增益，且额外参数显著增加 cherry-picking 风险。</li>\n<li><strong>最优 EMA 时间尺度</strong>：理论最优平滑参数 $\\eta_\\text{opt}=\\lambda\\sqrt{1+2\\beta_0^2/\\lambda}$；在道琼斯参数下约对应几十天半衰期，与行业经验一致。</li>\n<li><strong>复杂指标的风险</strong>：Bollinger Bands（非线性路径依赖）、多时间尺度 MACD 等复杂指标可通过参数组合&quot;拟合&quot;出与单 EMA 相近的灵敏度曲线，意味着其历史回测优势主要来自参数选取自由度（cherry-picking），而非捕获了更多市场信息。</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次在覆盖33年、70只期货的全球 ARP 组合上系统验证 Grebenkov-Serror (2014) 理论 Sharpe 公式，提供该理论最强的实证支撑。</li>\n<li>从&quot;最优信号即 EMA&quot;的理论结论反推&quot;复杂指标=cherry-picking 风险&quot;，为 CTA 策略设计提供原则性约束。</li>\n<li>证明了 Bollinger Bands 等非线性指标在均值情形下等价于 EMA 类线性组合，揭示其实质。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>数据来源为非公开商业数据库，无法独立验证。</li>\n<li>AR(1) 单时间尺度假设可能过于简化：市场中确实存在多尺度记忆效应（如长记忆过程），理论拟合对 100 年道琼斯数据的适用性不保证对其他资产或时段成立。</li>\n<li>论文版本多（v11），初版至最终修订跨度较大，部分实证细节可能变化。</li>\n<li>对短期均值回复（如单股）场景的结论不直接适用；ARP 本身是旋转不变组合，结论不完全推广到 Markowitz 框架。</li>\n<li>作者（Valeyre）自己是 ARP/Valeyre 2024 体系的推导者之一，存在观点倾向。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 数据非公开；但结论（最优 EMA 时间尺度与 Grebenkov 理论吻合）可用主要股指期货公开数据验证方向性。</li>\n<li><strong>方法清晰度</strong>: 公式和算法描述清晰，可自行实现 ARP + EMA 扫描回测。</li>\n<li><strong>计算成本</strong>: 极低，纯时序信号 + 矩阵运算，无需 GPU。</li>\n<li><strong>综合评分</strong>: ★4.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>最小可行复现：选取公开期货数据（10—20只品种，股指+债券+商品），实现归一化 EMA（公式5、6）和 ARP 组合（公式9、10），扫描 $\\eta$ 参数得到 Sharpe vs EMA 时间尺度曲线，与 Grebenkov 理论公式（公式3）对比形状是否吻合。不依赖全量70只期货数据，主要验证理论曲线形状一致性。风险在于样本量不足时曲线噪声较大。</p>"}, {"key": "57CG9KSV", "title": "Volatility Targeting Is Trendy: How Trend Following Explains Alpha in Volatility-Managed Strategies", "year": "2024", "authors": "Benjamin Hood, Cameron Raughtigan", "tags": ["leverage effect", "risk parity", "trend", "trend following", "volatility", "volatility control", "volatility management", "volatility targeting"], "venue": "", "abstract": "Why do volatility targeting/management strategies tend to outperform simple buy-and-hold positions in the same assets? We test the hypothesis that this outperformance is mainly due to a loading on trend following that arises because of the negative correlation between return direction (trend) and magnitude (volatility), the so-called “leverage effect.” When controlling for trend exposure, alpha to volatility targeting is shown to mainly accrue to trend for both a long equity history and a set of 14 global equity index futures contracts. By contrast, this is not true for commodity, fixed income, or currency futures, where the leverage effect is not present. We further discuss the mechanical relationship between volatility targeting and trend following, creating a point of connection between these two seemingly different branches of research.", "url": "https://papers.ssrn.com/abstract=4773781", "date_added": "2026-05-24", "summarized": true, "rating": "★4", "starred": false, "repro": "—", "summary_html": "<h1>Volatility Targeting Is Trendy: How Trend Following Explains Alpha in Volatility-Managed Strategies</h1>\n<p>&gt; Zotero Key: <code>57CG9KSV</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Benjamin T. Hood, Cameron Raughtigan</li>\n<li><strong>年份</strong>: 2024</li>\n<li><strong>出处</strong>: SSRN</li>\n<li><strong>DOI</strong>: -</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=4773781</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/TBAJHM7K/Hood和Raughtigan - 2024 - Volatility Targeting Is Trendy How Trend Following Explains Alpha in Volatility-Managed Strategies.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>波动率目标化策略相对买入持有的超额收益(alpha)中约2/3来自其对趋势跟踪策略的暴露，而非独立alpha；这种暴露源于股票市场的杠杆效应(收益率方向与波动率负相关)，在商品/固收/外汇市场中不存在。</p>\n<h2>研究动机与问题</h2>\n<p>Moreira &amp; Muir (2017) 发现波动率管理组合有显著alpha，且不能被SMB/HML等截面因子解释。本文假设这个alpha实际上是对趋势跟踪的时间序列因子暴露——当波动率高时(通常对应下跌)，波动率目标化策略降低仓位；当波动率低时(通常对应上涨)，增加仓位。这与趋势跟踪的信号方向恰好一致。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>:</li>\n</ul>\n<p>  - 长历史: Fama-French Mkt-Rf市场因子(1927-2023)</p>\n<p>  - 宽资产: 50个全球期货合约(含14个权益指数、商品、固收、外汇)</p>\n<ul>\n<li><strong>频率</strong>: 日度</li>\n<li><strong>样本区间</strong>: 1927-2023(长历史)，2000-2023(宽资产)</li>\n<li><strong>数据来源</strong>: Kenneth French网站(长历史)，Refinitiv期货价格(宽资产)</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>1. <strong>Volatility Targeting</strong>: 仓位与过去3个月波动率倒数成正比，目标波动率=标的资产全样本波动率</p>\n<p>2. <strong>Simple Trend</strong> (Hurst et al., 2013): 基于过去1/3/12个月收益符号平均值做多/空</p>\n<p>3. <strong>回归框架</strong>: VT收益 = α + β₁×BH收益 + β₂×Trend收益 + ε</p>\n<p>4. <strong>面板回归</strong>: 按资产类别分组，使用时序聚类稳健标准误(Rogers, 1993)</p>\n<p>5. <strong>杠杆效应度量</strong>: 21天收益与21天波动率变化的相关系数</p>\n<h2>核心结论与关键结果</h2>\n<p>1. <strong>Mkt-Rf长历史(1927-2023)</strong>:</p>\n<p>   - Vol Targeting: 年化收益10.2%, SR 0.54 — BH: 7.6%, SR 0.44; Trend: 4.9%, SR 0.37</p>\n<p>   - 仅回归BH时: alpha 3.07%/年(t=2.9)</p>\n<p>   - 加入Trend后: alpha降为1.25%/年(t=1.3,不显著)，Trend beta=0.30(t=12.0)</p>\n<p>   - alpha下降约59%，趋势暴露吸收了近3/5的&quot;alpha&quot;</p>\n<p>2. <strong>50个期货的面板回归(2000-2023)</strong>:</p>\n<p>   - 权益类: Vol Targeting alpha 1.57%/年, 加入Trend后降为0.65%(降低~59%)，Trend beta=0.35(t=32.4)</p>\n<p>   - 商品/固收/外汇: 加入Trend后alpha几乎不变，Trend beta仅0.04-0.08</p>\n<p>   - 权益的杠杆效应(-0.31)显著高于其他资产类别(-0.03至-0.16)</p>\n<p>3. <strong>杠杆效应-趋势beta关系</strong>: 所有权益资产的趋势beta高于非权益类中的最高值(WTI原油)，且杠杆效应越负，趋势beta越大</p>\n<p>4. <strong>杠杆上限分析</strong>: 2.5x上限与无上限表现几乎一致(仅5.5%时间超过2.5x)</p>\n<h2>创新点</h2>\n<p>1. 首次直接检验波动率目标化策略和趋势跟踪策略之间的交叉暴露</p>\n<p>2. 通过杠杆效应(Black, 1976)建立了两类策略的机械联系——波动率目标化实质上是隐式的趋势跟踪</p>\n<p>3. 解释了为什么波动率目标化的alpha仅存在于权益市场——只有权益市场具有显著的杠杆效应</p>\n<p>4. 提供了更真实的模拟设定(波动率倒数而非方差倒数、1天实施滞后、2bp交易成本)</p>\n<h2>局限与可质疑处</h2>\n<p>1. 宽资产样本的alpha本身就不显著(仅有3/50资产达到t&gt;2)，降低了&quot;趋势解释alpha&quot;的说服力</p>\n<p>2. Simple Trend策略(Hurst et al. 2013)只是趋势跟踪的一种实现，结论对不同的趋势定义是否稳健？(附录C做了部分稳健性检验)</p>\n<p>3. 波动率估计使用滚动3个月历史波动率——其他估计方法(RW、GARCH等)可能改变结论</p>\n<p>4. 交易成本仅假设固定2bp，没有对不同的交易成本场景进行充分的敏感性分析</p>\n<p>5. 2024年11月的最新草稿，未经同行评审</p>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: Fama-French因子数据公开可获取；期货数据可用天软获取</li>\n<li><strong>方法清晰度</strong>: 策略定义和回归方法描述清晰，直接可复现</li>\n<li><strong>计算成本</strong>: 极低 — 仅需简单统计计算，无模型训练需求</li>\n<li><strong>综合评分</strong>: ★★★★</li>\n</ul>\n<h2>复现备注</h2>\n<ul>\n<li><strong>关键风险点</strong>: 主要结论在统计显著性上有一定争议(宽资产alpha本身不显著)；策略的简单性意味着复现价值更多在于&quot;理解机制&quot;而非&quot;改进策略&quot;</li>\n<li><strong>最小可行版本</strong>: 在我们的策略池中对比：</li>\n</ul>\n<p>  1. 标的资产买入持有</p>\n<p>  2. 波动率目标化版本</p>\n<p>  3. 简单趋势版本</p>\n<p>  4. 在回归中检验VT对Trend的暴露，观察alpha的降低程度</p>\n<ul>\n<li><strong>建议 research topic</strong>: <code>vol_targeting_trend_decomposition</code></li>\n<li><strong>核心可交付</strong>: 一个诊断工具——给定任意策略的收益率序列，检验其波动率目标化版本中多大比例alpha来自趋势暴露</li>\n</ul>"}, {"key": "WJARRXL7", "title": "The Cross-Section of Dividend Discount Rates", "year": "2024", "authors": "Xinwei Li", "tags": ["cross-section of stocks", "dividend discount rates", "term structure of equity"], "venue": "", "abstract": "<p>A stock can be viewed as a collection of dividend strips, each representing a <span>claim to a single dividend. I study how individual dividends are pri", "url": "https://papers.ssrn.com/abstract=5007752", "date_added": "2026-06-07", "summarized": true, "rating": "★3.5", "starred": false, "repro": "—", "summary_html": "<h1>The Cross-Section of Dividend Discount Rates</h1>\n<p>&gt; Zotero Key: <code>WJARRXL7</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Xinwei Li (INSEAD PhD Candidate)</li>\n<li><strong>年份</strong>: 2024</li>\n<li><strong>出处</strong>: SSRN (Job Market Paper)</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.5007752</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=5007752</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/Q3QH4VGF/Li - 2024 - The Cross-Section of Dividend Discount Rates.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>利用个股期权通过 put-call parity 合成 1 年和 2 年期股息 strips，发现短期股息贴现率在横截面上存在巨大且系统性的差异（70% 的价格差异来自贴现率而非现金流增长），多空组合月均收益 3.2%（Sharpe 3.5），且无法被 CAPM 或主流因子模型解释。</p>\n<h2>研究动机与问题</h2>\n<p>现有资产定价文献大量研究了贴现率的<strong>时间序列</strong>变动和<strong>期限结构</strong>（BBK 2012），但对贴现率的<strong>横截面</strong>变动了解甚少。核心问题：给定同一期限，不同股票的股息贴现率是否相同？如果相同，股票就只是不同期限现金流的不同组合（Lettau-Wachter 2007，Gormsen-Lazarus 2023）；如果不同，横截面预期收益就是期限结构差异和贴现率差异的复合效应。本文利用个股期权合成股息 strips 价格，首次系统性地估计了短期股息贴现率的横截面差异。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 美国个股期权 + 标的股票</li>\n<li><strong>频率</strong>: 月度（期权价格采样每月第三个周五），月度 rebalance</li>\n<li><strong>样本区间</strong>: 2004–2022（受限于长期个股期权 LEAPS 的可获得性）</li>\n<li><strong>数据来源</strong>: OptionMetrics（期权价格和隐含波动率）、CRSP（股价/收益/退市信息）、Compustat（财务数据）、IHS Markit（融券费用）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[个股期权价格&lt;br/&gt;OptionMetrics] --&gt; B[Put-Call Parity&lt;br/&gt;合成股息价格]\n  B --&gt; C[剔除美式期权&lt;br/&gt;提前行权溢价]\n  C --&gt; D[利用欧洲市场数据&lt;br/&gt;估计调整模型 R²&gt;95%]\n  D --&gt; E[得到 1年期/2年期&lt;br/&gt;股息 strips 价格]\n  E --&gt; F[计算 Price-Dividend Ratio&lt;br/&gt;pd = P_div / D]\n\n  F --&gt; G[横截面方差分解]\n  G --&gt; G1[panel 回归: pd → 股息增长&lt;br/&gt;CF 成分]\n  G --&gt; G2[panel 回归: pd → 持有收益&lt;br/&gt;DR 成分]\n  G1 --&gt; H[约 70%/50% 来自 DR]\n\n  F --&gt; I[Portfolio Sort&lt;br/&gt;按 pd 分五组 + ABK 修正]\n  I --&gt; J[计算 holding-to-maturity&lt;br/&gt;和月度超额收益]\n  J --&gt; K[CAPM / FF5 / q5 / SY4&lt;br/&gt;因子模型 alpha 检验]\n\n  L[资产定价模型评估] --&gt; L1[LW2007: DR 差异≈0]\n  L --&gt; L2[LZ2013: DR 差异极小]\n  L --&gt; L3[KP2013: DR 差异显著 ✓]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>合成股息 strips 价格</strong>：利用个股欧式期权的 put-call parity，$P_{t}^{\\text{div}}(T) = S_t + P_t(T) - C_t(T) - K e^{-rT}$，其中 $S_t$ 为股票现价，$P_t(T), C_t(T)$ 为到期日 $T$ 的欧式看跌/看涨期权，$K$ 为行权价，$r$ 为无风险利率。</p>\n<p>2. <strong>美式期权提前行权溢价调整</strong>：美国个股期权为美式期权，put-call parity 不精确成立。利用同时交易欧式和美式期权的欧洲股票样本，估计线性模型 $P_{div}^{\\text{true}} = f(P_{div}^{\\text{distorted}}, \\text{state vars})$（R² &gt; 95%），然后将该模型应用于美股。</p>\n<p>3. <strong>测量误差修正</strong>：期权价格噪声大，采用多种修正——用不同行权价和到期日的中位数合成值、滞后价格-股息比排序（打破测量误差的负自相关，Asparouhova-Bessembinder-Kalcheva 2010）、滞后收益加权、工具变量法（用相邻期限的价差作为 IV）。</p>\n<p>4. <strong>横截面方差分解</strong>：跑 panel 回归 $\\Delta d_{i,t+n} = \\alpha_t + \\beta \\cdot pd_{i,t}^n + \\epsilon_{i,t}$ 和 $r_{i,t\\to t+n}^{HTM} = \\alpha_t + \\gamma \\cdot pd_{i,t}^n + \\eta_{i,t}$，分别得到 CF 和 DR 成分对 pd 变动的贡献比例。</p>\n<p>5. <strong>Portfolio Sort</strong>：按 pd 分为五等分组，每月再平衡，计算持有至到期收益（equity yields）和月度超额收益（equity risk premia），测 CAPM alpha 和多因子 alpha。</p>\n<p>6. <strong>模型评估</strong>：在 Lettau-Wachter (2007)、Lin-Zhang (2013)、Kogan-Papanikolaou (2013) 三个基准模型中模拟股息 strips 的横截面分布，与实证结果对比。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>价格分布</strong>：1 年期股息 strip 中位数 pd=0.89（即价格约为股息的 89%），占股票总值的 2.5%。跨分位范围：10th=0.40 到 90th=1.61。2 年期 pd 中位数=0.78，占比 1.8%。</li>\n<li><strong>方差分解</strong>：1 年期（2 年期）股息 strip 价格横截面差异中，约 <strong>70%（50%）</strong> 由贴现率差异驱动，非现金流增长差异。</li>\n<li><strong>多空收益</strong>：1 年期 strips 的多空月均超额收益 <strong>3.2%</strong>（Sharpe 3.5），HTM 收益差 10.9%（Sharpe 0.77）。2 年期：月均 1.8%（Sharpe 0.28），HTM 收益差 6.7%（Sharpe 0.63）。</li>\n<li><strong>因子 alpha</strong>：CAPM beta 呈 U 形，多空组合 beta≈0。FF5、q5、SY4、AEM 因子模型的 alpha 几乎等于原始平均收益，无法解释。</li>\n<li><strong>与 Gormsen-Lazarus (2023) 的关系</strong>：用股票特征（BTM、profitability）排序时，股息 strips 风险溢价差异不显著——GL 的发现可复现。但股票特征不擅长捕捉短期风险溢价，而 pd 本身能捕捉。在控制 BTM 的各半子样本中，pd 的预测力依然显著。</li>\n<li><strong>模型评估</strong>：LW2007 和 LZ2013 中，股息贴现率的横截面差异几乎为零（价格差异全来自现金流增长）；<strong>只有 KP2013</strong>（资产在置 + 增长机会，IST 冲击）能产生与实际数据一致的贴现率横截面差异，且期限结构向下倾斜。</li>\n</ul>\n<h2>创新点</h2>\n<p>1. <strong>首次系统估计个股层面短期股息 strips 的横截面分布</strong>，将期限结构文献从聚合层面拓展到 firm-level。</p>\n<p>2. 提出&quot;横截面价格分散的期限结构&quot;（term structure of cross-sectional price dispersion）新概念，对资产定价模型提供额外学科约束。</p>\n<p>3. 用期权数据绕过美国无个股股息衍生品的数据限制，并创新性地用欧洲市场估计美式期权提前行权溢价调整模型。</p>\n<p>4. 挑战了&quot;股票只是不同期限聚合股息 strips 的组合&quot;这一简化假设，证明 firm-specific DR 差异不可忽视。</p>\n<p>5. 为区分主流资产定价模型提供了新的 empirical moments。</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>期权市场覆盖有限</strong>：LEAPS 期权的流动性集中于大市值股票，小市值股票样本代表性不足（虽然 portfolio sort 显示市值在各组间几乎相同）。</li>\n<li><strong>美式期权调整假设强</strong>：假设从欧洲市场学到的调整系数跨市场和跨时期稳定，实际可能不成立。</li>\n<li><strong>噪音问题</strong>：即使经过多重修正，个股期权价格的测量误差仍然可能很大——月均收益 3.2% 的 Sharpe 仅 0.24，说明月间波动极大。</li>\n<li><strong>交易可行性</strong>：策略涉及同时买卖期权和股票，实际执行中的买卖价差、期权流动性、保证金要求可能大幅削减收益。</li>\n<li><strong>2004–2022 样本较短</strong>：相比典型资产定价研究（40+ 年），样本周期有限，且包含两个大危机（2008、2020），外部有效性存疑。</li>\n<li><strong>尚无 peer-review</strong>：目前为 Job Market Paper 阶段，未经过期刊审稿。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: ★★★☆☆ OptionMetrics 需付费订阅（WRDS），CRSP/Compustat 同样需订阅。替代方案难度大。</li>\n<li><strong>方法清晰度</strong>: ★★★★☆ 步骤描述详细，附录完善，但美式期权调整的具体回归设定未完全展开。</li>\n<li><strong>计算成本</strong>: ★★★☆☆ 中等，需逐月逐股匹配期权+股票数据，IV 回归和 panel 回归。</li>\n<li><strong>综合评分</strong>: ★3.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>中等优先级。论文的学术价值高、方法严谨，但对量化策略的直接转化路径较长。复现障碍：（1）OptionMetrics 订阅成本高，且 A 股个股期权品类少、流动性差；（2）核心贡献在资产定价理论层面（区分模型），策略信号层面可考虑简化：直接用个股期权的 implied dividend yield 构建横截面因子，测试 A 股 50ETF 期权的类比指标。建议最小可行版本：提取 50ETF 期权隐含的股息率期限结构，与个股股息率做关联分析。</p>"}, {"key": "2UKAW2VB", "title": "Risk Parity With Trend Following", "year": "2024", "authors": "Vineer Bhansali, Linda Chang, Jeremie Holdom…", "tags": ["Trend-Following", "Risk Parity"], "venue": "", "abstract": "Risk-parity is a widely understood strategy which performed very well in the post-Volcker era of declining interest rates. However, a traditional risk-parity strategy using stocks and bonds is vulnerable to periods like 2022 when both asset classes entered a simultaneous drawdown as inflation caused the correlation between them to switch positive for the first time in over a decade. We propose that a better approach to risk-parity is either replacing bonds or augmenting them with a trend-following strategy. Our results strongly suggest that including trend-following in either capacity improves upon classical risk-parity, especially when carry considerations are included. For robustness, we show that this is still the case even when we include an allocation to commodities in the traditional risk-parity portfolio, an asset class which not only has historically performed well during periods of inflation, but also performed well during 2022.", "url": "https://papers.ssrn.com/abstract=4714859", "date_added": "2026-05-24", "summarized": true, "rating": "★3.0", "starred": false, "repro": "—", "summary_html": "<h1>Risk Parity With Trend Following</h1>\n<p>&gt; Zotero Key: <code>2UKAW2VB</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Vineer Bhansali, Linda Chang, Jeremie Holdom, Matthew Johnson, Colin Suvak (LongTail Alpha)</li>\n<li><strong>年份</strong>: 2024</li>\n<li><strong>出处</strong>: SSRN</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.4714859</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=4714859</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/I978DJQA/Bhansali 等 - 2024 - Risk Parity With Trend Following.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>在传统股债风险平价组合中加入趋势跟踪（尤其是叠加 carry 过滤器的优化版），显著提升了风险调整后收益——三资产组合（股票+债券+carry 优化趋势）年化收益 10.41%、Sharpe 0.71，远超纯股债风险平价的 8.46%/0.56，在 2022 年股债双杀中提供了关键保护。</p>\n<h2>研究动机与问题</h2>\n<p>经典风险平价（股票+债券）在 1990-2020 年极为成功——股债负相关 + 利率下行 + 充裕流动性。但 2022 年通胀冲击导致股债正相关，风险平价遭受重创。趋势跟踪作为一种能够适应变化中的相关性和波动率的动态策略，能否成为风险平价的更好&quot;搭档&quot;？</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: S&amp;P 500 E-mini 期货、Bloomberg US Aggregate 债券指数、Credit Suisse 15% 波动率趋势跟踪指数（vanilla trend）、自建 carry 优化趋势策略（78 个流动性期货合约跨四类资产）、S&amp;P GSCI 商品指数</li>\n<li><strong>频率</strong>: 月度</li>\n<li><strong>样本区间</strong>: 1999/01–2023/11</li>\n<li><strong>数据来源</strong>: Bloomberg, LongTail Alpha</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>1. <strong>经典风险平价</strong>: 用 52 周滚动协方差和波动率计算，所有组合目标波动率 15%，通过期货和 total return swaps 实现杠杆</p>\n<p>2. <strong>Vanilla Trend</strong>: Credit Suisse 15% vol Managed Futures 指数作为代理</p>\n<p>3. <strong>Carry-Optimized Trend</strong>: 200 日均线趋势信号 + carry 同向过滤（仅做多趋势+正 carry 的品种，做空趋势+负 carry），78 个期货合约，每方向 5 bps 交易成本</p>\n<h2>核心结论与关键结果（1999–2023）</h2>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>组合</th><th>CAGR</th><th>Sharpe</th><th>Sortino</th><th>Skew</th></tr>\n<tr><td>股票 + 债券</td><td>8.46%</td><td>0.56</td><td>0.89</td><td>-0.90</td></tr>\n<tr><td>股票 + 债券 + Vanilla Trend</td><td>9.49%</td><td>0.63</td><td>1.14</td><td><strong>-0.19</strong></td></tr>\n<tr><td>股票 + Vanilla Trend（替代债券）</td><td>7.27%</td><td>0.54</td><td>1.03</td><td>0.07</td></tr>\n<tr><td>股票 + Carry-Optimized Trend</td><td>10.58%</td><td><strong>0.79</strong></td><td><strong>1.43</strong></td><td>-0.27</td></tr>\n<tr><td><strong>股票 + 债券 + Carry-Optimized Trend</strong></td><td><strong>10.41%</strong></td><td><strong>0.71</strong></td><td><strong>1.26</strong></td><td><strong>-0.30</strong></td></tr>\n</table></div>\n<ul>\n<li>加入商品后结论不变——股票+债券+商品+optimized trend: CAGR 8.64%, Sharpe 0.59（vs 纯三资产 6.61%/0.45）</li>\n<li>Carry 过滤器使趋势策略在大宗商品上持有空头更多（样本期内商品多为 contango），降低了与商品的关联</li>\n<li>平均权重：股票 64%、债券 251%（高杠杆）、趋势 54%</li>\n</ul>\n<h3>关键发现</h3>\n<ul>\n<li>完全用趋势替代债券不可取——失去了债券 carry 的贡献（2010-2019 年尤其明显）</li>\n<li><strong>三资产组合（股+债+趋势）是最佳方案</strong></li>\n<li>趋势的超额贡献主要集中在 2010 年之前和 2022 年——在 2010-2019 年低波动、弱趋势环境中表现平淡</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次系统比较了&quot;加趋势&quot;vs&quot;替代债券&quot;两种风险平价增强路径</li>\n<li>引入 carry 过滤器作为趋势策略的增强模块，显著优于 vanilla trend</li>\n<li>提供了包含杠杆/保证金/融资成本在内的完整实施模拟</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>行业白皮书（LongTail Alpha），发表方利益相关——其 carry-optimized trend 是其旗舰策略</li>\n<li>仅 24 年样本（1999-2023），覆盖了债券大牛市但未包含 1970s 通胀期的完整测试</li>\n<li>Vanilla trend 用 CSLAB 指数代理——该指数包含费用且可能不完全代表任何实际可投资策略</li>\n<li>风险平价对协方差估计窗口（52 周）敏感，未做敏感性分析</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 中——S&amp;P 500 期货和债券指数公开可得，但 CSLAB 指数需 Bloomberg；carry-optimized trend 为自建策略</li>\n<li><strong>方法清晰度</strong>: 中——框架清晰，但 carry 过滤器的具体实现细节不完整</li>\n<li><strong>计算成本</strong>: 低——月度再平衡，简单协方差计算</li>\n<li><strong>综合评分</strong>: ★★★☆☆ 3.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>核心思想简单且值得验证——在风险平价框架中引入趋势跟踪。最小可行版本：用 S&amp;P 500 + 10Y Treasury futures 构建经典风险平价，叠加简单的 12 月时序动量策略（跨品种），比较 2000 年以来表现。扩展方向：加入 carry 信号过滤、加入商品、不同波动率目标。需注意杠杆实施层面的融资成本和保证金管理。</p>"}, {"key": "BY66XUPY", "title": "RVRAE: A Dynamic Factor Model Based on Variational Recurrent Autoencoder for Stock Returns Prediction", "year": "2024", "authors": "Yilun Wang, Shengjie Guo", "tags": ["Computer Science - Machine Learning", "Quantitative Finance - Portfolio Management", "Quantitative Finance - Pricing of Securities"], "venue": "", "abstract": "In recent years, the dynamic factor model has emerged as a dominant tool in economics and ﬁnance, particularly for investment strategies. This model offers improved handling of complex, nonlinear, and noisy market conditions compared to traditional static factor models. The advancement of machine learning, especially in dealing with nonlinear data, has further enhanced asset pricing methodologies. This paper introduces a groundbreaking dynamic factor model named RVRAE. This model is a probabilistic approach that addresses the temporal dependencies and noise in market data. RVRAE ingeniously combines the principles of dynamic factor modeling with the variational recurrent autoencoder (VRAE) from deep learning. A key feature of RVRAE is its use of a prior-posterior learning method. This method ﬁne-tunes the model’s learning process by seeking an optimal posterior factor model informed by future data. Notably, RVRAE is adept at risk modeling in volatile stock markets, estimating variances from latent space distributions while also predicting returns. Our empirical tests with real stock market data underscore RVRAE’s superior performance compared to various established baseline methods.", "url": "http://arxiv.org/abs/2403.02500", "date_added": "2026-05-26", "summarized": true, "rating": "★3.5", "starred": false, "repro": "—", "summary_html": "<h1>RVRAE: A Dynamic Factor Model Based on Variational Recurrent Autoencoder for Stock Returns Prediction</h1>\n<p>&gt; Zotero Key: <code>BY66XUPY</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Yilun Wang, Shengjie Guo</li>\n<li><strong>年份</strong>: 2024</li>\n<li><strong>出处</strong>: arXiv:2403.02500</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2403.02500</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2403.02500</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/96RVLUEB/Wang和Guo - 2024 - RVRAE A Dynamic Factor Model Based on Variational Recurrent Autoencoder for Stock Returns Predictio.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>RVRAE 将循环神经网络（RNN/LSTM）与变分循环自编码器（VRAE）结合，通过先验-后验学习在时间序列噪声环境中提取有效动态因子，同时预测收益和估计风险，在美国股票 CRSP 数据上样本外夏普比率达 2.26，优于 FactorVAE（1.92）等基线。</p>\n<h2>研究动机与问题</h2>\n<p>现有深度学习因子模型（包括 FactorVAE）主要针对截面数据，忽略了股票收益的时间序列依赖性。RNN/LSTM 虽能捕捉时序依赖，但在噪声市场环境中信噪比低，容易学到无意义的模式。本文旨在结合二者的优势：LSTM 处理时序依赖 + VRAE 处理噪声建模。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 美国股票（CRSP，5682 只）</li>\n<li><strong>频率</strong>: 月度</li>\n<li><strong>样本区间</strong>: 2000.01–2020.12（训练 15 年，验证 3 年，测试 3 年）</li>\n<li><strong>数据来源</strong>: CRSP 月度个股收益，46 个企业特征（参照 Gu et al. 2020 和 Yang et al. 2020）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>双模块结构</strong>：</p>\n<p><strong>Beta 网络</strong>（因子暴露估计）：</p>\n<ul>\n<li>输入：股票特征 $x_t$（46 维）</li>\n<li>用 LSTM 捕捉时序依赖，提取因子暴露 $\\hat{\\beta}_t$</li>\n</ul>\n<p>$$h_t = \\tanh(W_{\\text{decoder}}h_{t-1} + w_r r_t + b_{\\text{decoder}})$$</p>\n<p>$$\\hat{\\beta}_t = h_T$$</p>\n<p><strong>Factor 网络</strong>（因子提取）：</p>\n<ul>\n<li>输入：横截面收益序列 $r_t$</li>\n<li>用 VRAE 的编码器-解码器结构提取因子 $z_t$，建模为高斯潜变量</li>\n<li>编码器（后验）：$q_\\phi(z_t|r_t) = \\mathcal{N}(\\mu_{zt}, \\text{diag}(\\sigma_{zt}^2))$，其中 $[\\mu_{zt}, \\sigma_{zt}] = \\varphi_\\tau^{\\text{encoder}}(\\varphi_\\tau^z(z_t), h_{t-1})$</li>\n<li>解码器（生成）：$p_\\theta(r_t|z_t) = \\mathcal{N}(\\mu_{rt}, \\text{diag}(\\sigma_{rt}^2))$</li>\n</ul>\n<p><strong>目标函数（ELBO）</strong>：</p>\n<p>$$\\text{ELBO} = E_{z \\sim q_\\phi(z_t|r_t)}[\\log p_\\theta(r_{i,t}|z_T)] - \\frac{1}{T}\\sum_{t=1}^T \\text{KL}(q_\\phi(z_t|r_t) \\| p_\\theta(z_t))$$</p>\n<p>对所有时间步平均 KL 散度（区别于仅在最后时间步施加 KL，防止后验崩塌）。</p>\n<p><strong>预测输出</strong>：$\\hat{r}_t = \\hat{\\beta}_t&#x27; \\hat{f}_t$</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>统计表现（预测 $R^2$）：RVRAE 总 $R^2$ = 20.06，预测 $R^2$ = 1.57，均优于 FactorVAE（18.71/0.92）和 ALSTM（20.33/0.91）</li>\n<li>样本外夏普比率（无交易成本）：RVRAE <strong>2.26</strong> &gt; ALSTM 2.15 &gt; Trans 12.03（注：Trans 异常高但加交易成本后降至 1.92）</li>\n<li>样本外夏普比率（30bp 交易成本）：RVRAE <strong>2.03</strong> &gt; ALSTM 2.01 &gt; Trans 1.92</li>\n<li>鲁棒性测试（随机删除 m=50/100/150 只训练股票）：Rank IC 和 Rank ICIR 均最优</li>\n<li>考虑时序依赖的模型（FactorVAE、ALSTM、Trans、RVRAE）普遍优于忽略时序的 DNN（CA、IPCA）</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次将 VRAE（同时处理时序和噪声）引入动态因子模型，区别于 FactorVAE 的静态 VAE 结构</li>\n<li>将 KL 散度施加于所有时间步并平均（而非仅最后时间步），有效缓解后验崩塌</li>\n<li>双模块设计（Beta 网络 + Factor 网络）将因子暴露估计与因子提取分离，提升可解释性</li>\n<li>同时具备收益预测和风险估计能力</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>仅在 CRSP 月度数据上测试，未覆盖其他市场或资产类别</li>\n<li>特征选择（46 个）依赖前人工作，未做特征重要性分析</li>\n<li>测试期仅 2018–2020 三年，包含 COVID 冲击，过拟合风险无法完全排除</li>\n<li>Trans（Transformer）在无交易成本情形下夏普高达 12.03，异常值疑问未被作者充分解释</li>\n<li>与 FactorVAE 对比时数据集不同（CRSP vs. A 股），直接性能比较需谨慎</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: CRSP 需付费；国内可用 A 股替代，但需重新调整特征集；46 个特征中部分需 Compustat，国内无直接等价</li>\n<li><strong>方法清晰度</strong>: 公式和架构图完整，LSTM + VRAE 双模块结构可按描述实现</li>\n<li><strong>计算成本</strong>: 中等，LSTM 训练月度数据计算量不大，单 GPU 可完成</li>\n<li><strong>综合评分</strong>: ★3.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>RVRAE 是 FactorVAE 的时序延伸版本，若已有 FactorVAE 实现基础，迁移成本较低。最小可行版本：以 A 股日频或月频数据，用 Qlib 特征替代 CRSP 的 46 个月度特征，验证时序 VRAE 的因子提取效果。关键风险：（1）A 股月度数据量相对较少（约 5000 只 × 10 年），可能影响 LSTM 训练收敛；（2）VRAE 的 KL 权重 $\\lambda$ 调参敏感；（3）需与 FactorVAE 做同等条件的对比实验。</p>"}, {"key": "6X6E54EH", "title": "NeuralFactors: A Novel Factor Learning Approach to Generative Modeling of Equities", "year": "2024", "authors": "Achintya Gopal", "tags": ["Computer Science - Machine Learning", "Quantitative Finance - Statistical Finance"], "venue": "", "abstract": "The use of machine learning for statistical modeling (and thus, generative modeling) has grown in popularity with the proliferation of time series models, text-to-image models, and especially large language models. Fundamentally, the goal of classical factor modeling is statistical modeling of stock returns, and in this work, we explore using deep generative modeling to enhance classical factor models. Prior work has explored the use of deep generative models in order to model hundreds of stocks, leading to accurate risk forecasting and alpha portfolio construction; however, that specific model does not allow for easy factor modeling interpretation in that the factor exposures cannot be deduced. In this work, we introduce NeuralFactors, a novel machine-learning based approach to factor analysis where a neural network outputs factor exposures and factor returns, trained using the same methodology as variational autoencoders. We show that this model outperforms prior approaches both in terms of log-likelihood performance and computational efficiency. Further, we show that this method is competitive to prior work in generating realistic synthetic data, covariance estimation, risk analysis (e.g., value at risk, or VaR, of portfolios), and portfolio optimization. Finally, due to the connection to classical factor analysis, we analyze how the factors our model learns cluster together and show that the factor exposures could be used for embedding stocks.", "url": "http://arxiv.org/abs/2408.01499", "date_added": "2026-05-26", "summarized": true, "rating": "★4.0", "starred": false, "repro": "待复现", "summary_html": "<h1>NeuralFactors: A Novel Factor Learning Approach to Generative Modeling of Equities</h1>\n<p>&gt; Zotero Key: <code>6X6E54EH</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Achintya Gopal (Bloomberg)</li>\n<li><strong>年份</strong>: 2024</li>\n<li><strong>出处</strong>: arXiv:2408.01499</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2408.01499</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2408.01499</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/VTAV76Q5/Gopal - 2024 - NeuralFactors A Novel Factor Learning Approach to Generative Modeling of Equities.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>用条件变分自编码器（VAE）框架实现端到端的因子学习：编码器从股票特征和历史收益中推断因子暴露 $\\beta_i$ 和特质项，解码器将潜变量（因子收益 $z_t$）乘以因子暴露后加重构得到股票收益，直接将因子分析重新表述为深度生成建模任务。</p>\n<h2>研究动机与问题</h2>\n<p>传统因子模型有三类：定义因子收益（Fama-French）、定义因子暴露（Barra）、或从数据推断（PPCA）。深度学习方法能建模数百只股票，但现有方法（如 BDG）需要预先选择因子集合，且因子暴露不可解释。NeuralFactors 的目标是：(1) 无需预先指定因子，(2) 同时学习因子暴露和因子收益，(3) 保持模型的可解释性。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: S&amp;P 500 成分股（point-in-time）</li>\n<li><strong>频率</strong>: 日频收益</li>\n<li><strong>样本区间</strong>: 论文未明确给定期限，典型覆盖数年</li>\n<li><strong>数据来源</strong>: Bloomberg 内部数据，包含约 40 个基本面/技术面/情绪类特征</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>核心架构基于条件重要性加权自编码器（CIWAE），使用 Student&#x27;s T 分布建模收益的厚尾性。生成过程：</p>\n<p>$$z_t \\sim \\mathcal{N}(0, I), \\quad r_{i,t} \\sim t_\\nu(\\beta_i^\\top z_t + \\alpha_{i,t}, \\sigma_{i,t}^2)$$</p>\n<p>其中 $\\beta_i$ 为股票 $i$ 的因子暴露向量，$z_t$ 为时刻 $t$ 的因子收益，$\\alpha_{i,t}$ 为特质收益（alpha），$\\sigma_{i,t}^2$ 为特质方差，$\\nu$ 为自由度。</p>\n<p>编码器用 LSTM 或 attention 网络处理各股票的历史收益和特征序列，输出 $\\alpha_{i,t}$、$\\beta_i$、$\\sigma_{i,t}$ 和 $\\nu_i$。训练使用 ELBO 加重要性加权（IWAE），解码器给出收益的线性因子结构使暴露直接可解释。潜变量维度（因子数 $F$）为超参。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>NLL 表现</strong>：NeuralFactors 在联合负对数似然（NLLjoint）和边际负对数似然（NLLind）上均优于 BDG 和 PPCA。</li>\n<li><strong>协方差预测</strong>：在协方差矩阵预测任务上优于 BDG 和 PPCA。</li>\n<li><strong>VaR 分析</strong>：测试集上优于 PPCA 和 BDG，但 GARCH 在 calibration error 上仍优于 NeuralFactors。</li>\n<li><strong>组合优化</strong>：NeuralFactors 构建的组合跑赢市场基准（S&amp;P 500）。</li>\n<li><strong>计算效率</strong>：训练和推理均比 BDG 快，得益于封闭形式的解码器。</li>\n<li><strong>因子聚类分析</strong>：学到的因子暴露可用于股票嵌入（embedding），同一行业的股票暴露自然聚集。</li>\n</ul>\n<h2>创新点</h2>\n<p>1. 首次将 VAE 框架直接映射到因子分析范式：编码器→因子暴露，潜变量→因子收益，解码器→线性因子结构</p>\n<p>2. 无需预先定义因子集合，从数据中自动发现因子</p>\n<p>3. 使用 Student&#x27;s T 分布替代高斯，适应金融收益的厚尾特性</p>\n<p>4. 解码器的线性结构保持了完整的因子可解释性</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>仅 S&amp;P 500 测试，未在 A 股/新兴市场验证</li>\n<li>因子数是固定超参，未做自动化选择</li>\n<li>VaR 校准不如 GARCH，在极端风险管理场景可能不够</li>\n<li>Student&#x27;s T 的线性因子结构假设可能过于简化真实市场因子结构</li>\n<li>输入特征集仅约 40 个，未必涵盖了所有重要因子来源</li>\n<li>Bloomberg 内部数据，外部复现需找替代数据源</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 需要 Bloomberg 级别的 point-in-time 数据，但可用其他财务数据源替代</li>\n<li><strong>方法清晰度</strong>: 架构描述清晰，数学推导完整</li>\n<li><strong>计算成本</strong>: 中等 — VAE 训练，S&amp;P 500 规模需 GPU，但比 BDG 高效</li>\n<li><strong>综合评分</strong>: ★4.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>模型架构清晰、与经典因子分析一一对应，是当前因子学习方向中最适合复现的方法之一。最大挑战在于获取与 Bloomberg 同等质量的特征数据。最小可行版本：使用 A 股 + 常见风格因子（value/momentum/size/volatility）作为输入特征，3-5 个潜因子，验证学到的因子暴露与传统因子的对应关系及组合表现。</p>"}, {"key": "A4PE2Q77", "title": "Leveraging the Low-Volatility Effect", "year": "2024", "authors": "Lodewijk van der Linden, Amar Soebhag, Pim van Vliet", "tags": ["benchmark constraints", "leverage constraints", "long-extension", "Low-volatility investing", "short-extension", "strategic asset allocation", "tail risk protection"], "venue": "", "abstract": "Low-volatility has become a mainstream investment style over the past two decades, recognized for delivering high risk-adjusted returns. However, many investors fail to fully capitalize on this strategy due to benchmark constraints. Low-volatility stocks tend to lag during prolonged bull market, a challenge that can be addressed using leverage. This paper outlines five use cases to leverage upon the low-volatility effect, including an enhanced strategy, an alternative to the 60/40 asset allocation, and the use of long and short-extension with stocks and market futures. These approaches help investors aiming to meet objectives ranging from stable performance, consistent outperformance, market-neutral returns, or as an alternative for put options, unlocking the full potential of this underutilized factor.", "url": "https://papers.ssrn.com/abstract=4995381", "date_added": "2026-05-25", "summarized": true, "rating": "★4.5", "starred": false, "repro": "待复现", "summary_html": "<h1>Leveraging the Low-Volatility Effect</h1>\n<p>&gt; Zotero Key: <code>A4PE2Q77</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Lodewijk van der Linden, Amar Soebhag, Pim van Vliet</li>\n<li><strong>年份</strong>: 2024</li>\n<li><strong>出处</strong>: SSRN (Robeco)</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.4995381</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=4995381</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/LVYEJGC7/van der Linden 等 - 2024 - Leveraging the Low-Volatility Effect.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>本文系统梳理了低波动异象的五种杠杆化应用——增强收益、战略资产配置替代、Beta-1 做多、Beta-0 绝对收益、负 Beta 下行保护——证明杠杆化低波动策略在不同投资目标下均优于传统方法。</p>\n<h2>研究动机与问题</h2>\n<p>低波动异象（低波动股票获得高于高波动股票的风险调整收益）已被广泛记录，但许多投资者因基准约束、杠杆厌恶等原因无法充分利用。尤其在牛市中低波动策略容易跑输基准，导致投资者放弃该策略。本文旨在回答：<strong>如何通过杠杆化手段将低波动异象转化为可实操的投资方案</strong>，以满足不同投资目标（稳定表现、跑赢市场、市场中性、下行保护）。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 美国市场市值最大的 1,000 只股票</li>\n<li><strong>频率</strong>: 月度调仓</li>\n<li><strong>样本区间</strong>: 1990 年 1 月 – 2023 年 12 月</li>\n<li><strong>数据来源</strong>: Kenneth French 数据库（股票收益）、FRED（债券收益率与信用利差）、Robeco 网站（低波动数据）、CBOE（VIX 与看跌期权指数）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n    A[美国 Top 1000 股票] --&gt; B[计算 3 年月度波动率]\n    B --&gt; C[选出最低波动 500 只&lt;br/&gt;Lowvol 500]\n    C --&gt; D[按动量+净派息收益率&lt;br/&gt;排序取 Top 100]\n    D --&gt; E[Lowvol+ 基准组合&lt;br/&gt;月度等权再平衡]\n    E --&gt; F{投资目标?}\n    F --&gt;|稳定表现| G[Case 1: 增强收益&lt;br/&gt;直接持有 Lowvol+]\n    F --&gt;|战略配置| H[Case 2: SAA 杠杆&lt;br/&gt;替换 60/40 中的债券]\n    F --&gt;|跑赢市场| I[Case 3: Beta-1&lt;br/&gt;140% 做多或 130% 期货]\n    F --&gt;|绝对收益| J[Case 4: Beta-0&lt;br/&gt;做空投机股或期货]\n    F --&gt;|下行保护| K[Case 5: 负 Beta&lt;br/&gt;做空投机股+期货]</div>\n<h3>步骤详解</h3>\n<p><strong>基准策略构建（Lowvol+）：</strong></p>\n<p>1. <strong>选股池</strong>：从美国市值最大的 1,000 只股票中，选取过去 3 年月度收益率标准差最低的 500 只（低波动池）。</p>\n<p>2. <strong>双因子排序</strong>：在低波动池内，按 12-1 月价格动量和净派息收益率（股息+回购-增发）的综合排名，选取前 100 只。</p>\n<p>3. <strong>组合构建</strong>：等权持有 100 只股票，月度再平衡。该策略即 Blitz &amp; van Vliet (2018) 的&quot;保守公式&quot;（Conservative Formula）。</p>\n<p>4. <strong>关键属性</strong>：相比纯低波动（Lowvol），Lowvol+ 收益率提高 2.0%（12.5% vs 10.5%），Sharpe 从 0.68 升至 0.73，相对风险从 11.4% 降至 8.4%。</p>\n<p><strong>Case 1 — 增强低波动（无显式杠杆）：</strong></p>\n<ul>\n<li>直接持有 Lowvol+，通过动量和价值因子的叠加提升收益，无需额外杠杆。</li>\n</ul>\n<p><strong>Case 2 — 战略资产配置（SAA）杠杆：</strong></p>\n<ul>\n<li>在传统 60/40 组合中，用 Lowvol+ 替换部分股票和债券。例如：50% 股票 + 15% Lowvol+ + 35% 债券，Sharpe 从 0.64 升至 0.70。</li>\n<li>等权三资产（33% 股票 / 33% Lowvol+ / 33% 债券）Sharpe 达 0.75；70% Lowvol+ / 30% 债券 Sharpe 达 0.82。</li>\n<li>核心逻辑：Lowvol+ 介于股票和债券之间的风险特征，天然适合作为 SAA 的桥梁资产。</li>\n</ul>\n<p><strong>Case 3 — Beta-1 杠杆化（跑赢市场）：</strong></p>\n<ul>\n<li><strong>个股杠杆</strong>：140% 做多 Lowvol+，借入 40%，借款成本按 T-bill + 信用利差（Baa-Aaa 约 1.0%）计算。收益 15.7%，Sharpe 0.69。</li>\n<li><strong>期货杠杆</strong>：130% 敞口（30% 保证金），期货隐含成本约 0.2%/年。收益 14.6%，Sharpe 0.68。</li>\n<li>两种方式的 Information Ratio 均约 0.25–0.52，远高于未杠杆的 0.25。</li>\n</ul>\n<p><strong>Case 4 — Beta-0 绝对收益（市场中性）：</strong></p>\n<ul>\n<li><strong>做空个股</strong>：100% 做多 Lowvol+，做空 48% 投机股（高波动、低派息、低动量）。收益 9.6%，Sharpe 0.65，最大回撤 -26.4%。</li>\n<li><strong>做空期货</strong>：100% 做多 Lowvol+，做空 72% 股指期货。收益 6.5%，Sharpe 0.50，最大回撤 -28.9%。</li>\n<li>两种策略约 83% 的月份获得正收益。</li>\n</ul>\n<p><strong>Case 5 — 负 Beta 下行保护（替代看跌期权）：</strong></p>\n<ul>\n<li>目标：构建 beta 约 -0.5 的组合，在市场下跌时获得正收益。</li>\n<li><strong>30% 做多 Lowvol+ / 50% 做空投机股</strong>：单独持有收益 1.9%，Sharpe -0.06；但叠加到股票组合后，总收益 11.2%，Sharpe 0.85，最大回撤从 -50.4% 降至 -31.4%。</li>\n<li><strong>70% 做多 Lowvol+ / 100% 做空期货</strong>：叠加后收益 9.4%，Sharpe 0.74，最大回撤 -31.1%。</li>\n<li>对比 5% OTM 看跌期权策略：期权单独收益 -1.0%，叠加后收益 7.3%，Sharpe 0.37，远不如多空低波动策略。</li>\n</ul>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>Lowvol+ 基准策略：年化 12.5%，Sharpe 0.73（vs 市场 10.4%/0.50），最大回撤 -42.5%（vs 市场 -50.4%）。</li>\n<li>SAA 场景：将 Lowvol+ 纳入 60/40 组合，可在不增加波动率的前提下将 Sharpe 从 0.64 提升至 0.70–0.82。</li>\n<li>Beta-1 杠杆化：收益提升至 15.7%，Information Ratio 从 0.25 翻倍至 0.52。</li>\n<li>Beta-0 市场中性：83% 月份正收益，Sharpe 0.65。</li>\n<li>下行保护：多空低波动策略比看跌期权更优——叠加到股票组合后 Sharpe 0.85 vs 期权的 0.37，最大回撤降低约 19 个百分点。</li>\n</ul>\n<h2>创新点</h2>\n<p>1. <strong>系统性框架</strong>：首次将低波动异象的杠杆化应用按投资目标（收益增强、SAA、Beta-1/0/-0.5）系统梳理为五个 Use Case。</p>\n<p>2. <strong>保守公式（Lowvol+）</strong>：在低波动池内叠加动量和价值因子，解决了纯低波动策略在牛市跑输的问题。</p>\n<p>3. <strong>多空下行保护</strong>：提出以多空低波动组合替代看跌期权进行尾部风险对冲，成本更低、长期表现更优。</p>\n<p>4. <strong>实操导向</strong>：所有策略均基于公开数据，且考虑了杠杆成本、交易成本和做空限制。</p>\n<h2>局限与可质疑处</h2>\n<p>1. <strong>仅限美股大盘</strong>：样本为美国最大的 1,000 只股票，对小盘股、新兴市场、其他资产类别的适用性未验证。</p>\n<p>2. <strong>做空假设偏乐观</strong>：投机股做空假设 2% 成本，实际中小盘股做空成本可能远高于此（借券困难、逼空风险）。</p>\n<p>3. <strong>静态杠杆</strong>：所有策略均使用固定杠杆比率，未考虑动态调杠杆（如波动率目标、风险平价），实际中可能更优但也更复杂。</p>\n<p>4. <strong>幸存者偏差</strong>：使用当前存在的股票回溯 1990 年数据，可能存在生存偏差。</p>\n<p>5. <strong>无交易摩擦细节</strong>：虽提及成本假设，但未详细讨论调仓时的市场冲击、流动性约束等微观结构问题。</p>\n<p>6. <strong>样本期特征</strong>：1990–2023 年包含低利率环境和量化宽松时期，低波动策略可能受益于这一宏观背景。</p>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>：高。股票收益和因子数据来自 Kenneth French 数据库（公开），债券数据来自 FRED，方法完全可用公开数据复现。</li>\n<li><strong>方法清晰度</strong>：高。选股规则、因子构造、组合构建方式均有明确描述，可直接实现。</li>\n<li><strong>计算成本</strong>：低。月度再平衡，无重型模型训练，普通机器即可完成。</li>\n<li><strong>综合评分</strong>: ★4.5</li>\n</ul>\n<h2>复现备注</h2>\n<ul>\n<li>最小可行版本：用 Kenneth French 的 US stock 数据构建 Lowvol+（500 低波动 → Top 100 动量+价值），月度等权再平衡，回测 1990–2023。</li>\n<li>关键风险点：动量和净派息收益率的综合排序方式需精确复现（文中未给出具体公式，需参考 Blitz &amp; van Vliet 2018）。</li>\n<li>建议优先复现 Case 1（增强低波动）和 Case 3（Beta-1 杠杆化），这两个最具实操价值。</li>\n<li>可扩展方向：加入动态杠杆（波动率目标）、测试 A 股/港股市场、对比其他防御性因子（质量、低 Beta）。</li>\n</ul>"}, {"key": "HFFHRRMS", "title": "Is the Best Dividend Strategy to Avoid Them?", "year": "2024", "authors": "Meb Faber", "tags": ["After-tax returns", "Dividend Avoidance", "Tax efficiency", "Value investing"], "venue": "", "abstract": "We challenge the sacred status of dividend investing, proposing a strategy that avoids dividends altogether. While dividend stocks have historically outperformed, their tax inefficiency erodes returns—especially for taxable investors. We test various value-tilted portfolios that exclude dividend payers and find that not only do they deliver similar or better total returns, but they also significantly improve after-tax results. This paper is a data-driven call to rethink the behavioral and structural biases toward dividends and consider a more tax-aware, value-focused approach to equity investing.", "url": "https://papers.ssrn.com/abstract=5271422", "date_added": "2026-06-07", "summarized": true, "rating": "★2.0", "starred": false, "repro": "—", "summary_html": "<h1>Is the Best Dividend Strategy to Avoid Them?</h1>\n<p>&gt; Zotero Key: <code>HFFHRRMS</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Meb Faber (Cambria Investments)</li>\n<li><strong>年份</strong>: 2024</li>\n<li><strong>出处</strong>: SSRN / Cambria Investments White Paper</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.5271422</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=5271422</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/382BGGCB/Faber - 2024 - Is the Best Dividend Strategy to Avoid Them.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>用价值因子（P/E + P/S + P/B + EV/EBITDA 综合排名）替代股息率选股并排除高股息股，税前收益已超越股息策略，税后优势更显著（高税率投资者年化改善可达 1+ 个百分点）。</p>\n<h2>研究动机与问题</h2>\n<p>股息策略广受推崇但存在税负劣势——股息收入每年征税，显著侵蚀复利效应。论文提出的核心替代方案是：能否用价值因子复制股息策略的收益特征，同时避免股息税？</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 美股（top 2000 等权）</li>\n<li><strong>频率</strong>: 年度再平衡</li>\n<li><strong>样本区间</strong>: 1974–2022</li>\n<li><strong>数据来源</strong>: French-Fama 数据库、Global Financial Data、Alpha Architect</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>方法极为简单——仅做 portfolio sort 和税后收益模拟，画流程图反而冗余。</p>\n<h3>步骤详解</h3>\n<p>1. <strong>策略构建</strong>：从 top 2000 等权美股出发，构建四因子综合价值排名（P/E + P/S + P/B + EV/EBITDA 各排序后取 composite rank），选排名最高的 100 只等权。</p>\n<p>2. <strong>股息剔除变体</strong>：在价值排名基础上，依次剔除股息率 top 25%、top 50%、全部股息支付的股票，各构建一个 portfolio。</p>\n<p>3. <strong>基准对比</strong>：S&amp;P 500、top 2000 等权、top 100 股息率等权。</p>\n<p>4. <strong>税后模拟</strong>：用历史实际税率，模拟四种情景（低/高股息税率 × 低/高清算税率），计算各策略的年化税后收益。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>税前收益（1974–2022）</strong>：价值综合排名 16.78% &gt; 股息率 top 100 13.97% &gt; S&amp;P 500 10.87%。排除 top 25% 股息股后仍达 16.31%。</li>\n<li><strong>排全部股息后</strong>：价值排除全部股息股仍有 13.20%，仍超过 S&amp;P 500 和单纯股息策略。</li>\n<li><strong>税后收益</strong>：高税率投资者情景下，价值排除高股息策略年化超越股息策略数个百分点的复利差距。在大多数模拟中，top 100 股息率策略和 S&amp;P 500 是<strong>表现最差</strong>的两个。</li>\n<li><strong>波动率和回撤</strong>：价值策略波动率（20–23%）和最大回撤（52–56%）与股息策略（16.5%/55%）可比。</li>\n</ul>\n<h2>创新点</h2>\n<p><strong>几乎无学术创新</strong>。论文是投资白皮书（非同行评议），核心观点（价值优于股息，税后更重要）在学术文献中早已确立。其价值在于用简洁的 backtest 和税后模拟将这一结论以易于理解的方式传达给个人投资者。</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>非学术论文</strong>：投资白皮书，未经同行评议，无假设检验，无统计推断。</li>\n<li><strong>方法过于简单</strong>：等权 top 100 排序无市值/行业控制，可能是小盘股和价值股溢价的复合效应。</li>\n<li><strong>生存者偏差</strong>：1974 年起的回测未讨论数据可获性和退市处理。</li>\n<li><strong>交易成本未计入</strong>：top 2000 中选 top 100 等权重，实际执行中的 bid-ask spread 和市场冲击可能显著（小市值端尤其严重）。</li>\n<li><strong>税收假设过于乐观</strong>：假设投资者能完全避开股息，现实中很多价值股仍然派息；且税法因国家和时期而异。</li>\n<li><strong>样本内优化风险</strong>：仅报告了一种价值定义，可能存在 data snooping。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: ★★★★★ French-Fama 公开，价值因子数据容易获取。</li>\n<li><strong>方法清晰度</strong>: ★★★★☆ 策略描述简单清晰，但具体再平衡日期、入选标准细节未完全说明。</li>\n<li><strong>计算成本</strong>: ★★★★★ 极低。</li>\n<li><strong>综合评分</strong>: ★2.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>低优先级。核心发现（价值因子 + 避开高股息可改善税后收益）在量化实践中已被广泛认知。可复现价值在于：（1）作为 A 股股息税差异（1 年以上免税 vs 1 月以内 20%）下的类比分析；（2）验证 A 股价值因子是否也能在不依赖股息的情况下提供超额收益。建议最小可行版本：沪深 300 内按 BTM 排序选 top 20%，分有股息/无股息两组，对比 3 年/5 年收益差异。</p>"}, {"key": "P96JTT2Y", "title": "Identifying Risk Factor Regimes with Machine Learning: Implications for Tactical Asset Allocation", "year": "2024", "authors": "Sheikh Sadik", "tags": ["Machine Learning", "Portfolio Construction", "Trend Following", "Tactical Asset Allocation", "Equity Risk", "Global Macro", "Meta Labelling", "Regime Detection", "Risk Modelling", "Supervised Learning", "Systematic Macro", "Tree based Learning"], "venue": "", "abstract": "Financial risk factors are time varying and tend to demonstrate structural breaks/regime shifts. Such structural breaks can have important implication on asset allocation, both strategic and tactical. We propose a supervised learning approach to identifying risk factor regimes. Our methodology is focused on modelling the regimes for the Equity Factor. The reason behind choosing the Equity Factor is mostly driven by the favorability this particular source of risk has received by institutional investors and small alternatives alike. Most traditional assets, systematic or discretionary process tend to have some or significant exposure in equity risk, and thus managing such exposure is crucial for portfolio construction. However, this analysis can also be replicated for other traditional factors, like interest rates, short volatility, and inflation etc.; and also for alternative risk factors like value, carry and, momentum etc, depending upon an investor’s composition of the portfolio and which sources of risk is he/she most exposed to. We show that by predicting the probability of risk factor drawdown below a given threshold, otherwise named as crash probability, we can identify two distinct states for our equity risk factor. We employ a large set of market features to estimate our models and compare the ensemble model performance against traditional benchmarks (i.e. simple rule based trend following, hidden markov models etc.). We also show few portfolio construction use cases, where we can use the forecasts to shift the overall risk allocation of a portfolio and also can use the forecasts for more accurate risk forecasts for risk based portfolios.", "url": "https://papers.ssrn.com/abstract=4689090", "date_added": "2026-05-24", "summarized": true, "rating": "★2.5", "starred": false, "repro": "—", "summary_html": "<h1>Identifying Risk Factor Regimes with Machine Learning: Implications for Tactical Asset Allocation</h1>\n<p>&gt; Zotero Key: <code>P96JTT2Y</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Sheikh Sadik</li>\n<li><strong>年份</strong>: 2024</li>\n<li><strong>出处</strong>: SSRN（早期草稿）</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.4689090</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=4689090</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/U2ENEEAN/Sadik - 2024 - Identifying Risk Factor Regimes with Machine Learning Implications for Tactical Asset Allocation.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>用监督学习（ensemble 模型 + 500+ 工程化特征）预测全球权益因子的&quot;崩溃体制&quot;（crash regime，定义为滚动回撤超过 -10%），通过降低假阳性率来提升精确率，从而在战术资产配置中实现比传统趋势跟踪和 HMM 更好的风险调整收益，并用 Shapley 值解释模型决策。</p>\n<h2>研究动机与问题</h2>\n<p>传统体制检测方法（HMM、MA 过滤、规则化趋势跟踪）有两个核心缺陷：(1) 仅依赖少数特征，在体制转换时可能失效；(2) 参数化框架对数据分布和状态过程有预设假设，不一定符合现实。ML 方法可以处理大量特征并自动捕捉非线性和交互效应，但&quot;黑箱&quot;问题让人难以信任。本文用 Shapley 值解决可解释性问题。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 全球权益因子（7 个发达+新兴市场指数等权，50% 美国），目标波动率 10%</li>\n<li><strong>频率</strong>: 日度特征 → 预测 21 天（1 个月）后的体制概率</li>\n<li><strong>样本区间</strong>: 未明确给出（推测 ~2000-2023）</li>\n<li><strong>数据来源</strong>: Bloomberg、DataStream</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>体制标注</h3>\n<ul>\n<li>将权益因子日收益缩放至 10% 目标波动率 → 计算水下曲线</li>\n<li>&quot;崩溃体制&quot;定义为滚动回撤超过 -10%（≈ 1 vol point），包括峰-谷期和谷-恢复期内的局部回撤</li>\n<li>二分类标签：1 = crash regime, 0 = normal</li>\n</ul>\n<h3>特征工程（初始 206 → 最终 ~501 个）</h3>\n<ul>\n<li><strong>19 类初始变量</strong>: 全球股债汇商品总收益指数、VIX 系列及波动率曲面、HY/IG 信用利差、经济/通胀意外指数、CFTC 持仓、期权成交量/PCR、指数广度（200 日均线上方占比）、EPS 修正、名义/实际/盈亏平衡收益率、主权 CDS、央行利率预期、流动性指标</li>\n<li><strong>核心派生特征</strong>: </li>\n</ul>\n<p>  - Mahalanobis 距离（金融湍流指标，衡量资产价格的非典型运动）</p>\n<p>  - Absorption Ratio（吸收比率，衡量系统性风险——前 1/5 特征值解释的总方差占比）</p>\n<p>  - 多时间尺度的风险调整动量（22/66/252 天）</p>\n<p>  - 权益偏度和峰度</p>\n<p>  - 跨资产相关性（股-债、股-外汇）</p>\n<p>  - 期权成交量的均线交叉</p>\n<h3>模型</h3>\n<ul>\n<li>监督学习分类器（ensemble methods）</li>\n<li>对比基准：VIX 阈值法、简单趋势跟踪规则、HMM</li>\n<li>预测输出：$P(\\text{crash}_{t+21} \\mid X_t)$</li>\n<li>评估指标：Precision / Recall（侧重降低假阳性）</li>\n</ul>\n<h3>可解释性</h3>\n<ul>\n<li>用 Shapley 值（合作博弈论）量化每个特征对预测的贡献</li>\n</ul>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>ML 模型在降低假阳性率方面优于传统方法，从而改善了策略的风险调整收益</li>\n<li>Shapley 值提供了直观的特征重要性排序，解决了 ML&quot;黑箱&quot;问题</li>\n<li>体制概率可用于多种组合构建场景：仓位调整（风险分配倾斜）、更准确的风险预测（用于风险平价等）、叠加在现有配置流程上</li>\n<li>方法可推广至利率、波动率、通胀、价值、carry、动量等其他风险因子</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>将 Mahalanobis 距离和 Absorption Ratio 等系统性风险度量融入体制预测特征集</li>\n<li>用 Shapley 值为 ML 体制分类提供可解释性</li>\n<li>标注方法覆盖峰-谷期和谷-恢复期内的局部崩溃（避免了仅标注主回撤忽略次级危机的盲点）</li>\n<li>强调 Precision 优于 Recall（降低假阳性比发现所有崩盘更重要）</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>&quot;早期草稿&quot;——方法论部分详细但结果部分不完整，关键指标（Sharpe、回撤改善幅度、分类准确率等）缺乏</li>\n<li>500+ 特征在短期金融时间序列上有严重的过拟合风险——投资期限内的体制事件（标签=1）样本本身就很少</li>\n<li>定义&quot;crash&quot;为 -10% 回撤是主观的——不同投资者可能有不同阈值</li>\n<li>未讨论预测概率到仓位的具体映射方案</li>\n<li>仅覆盖权益因子，未展示推广到其他因子的实际结果</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 低——Bloomberg/DataStream 的大量专有数据（VIX 曲面、CFTC 持仓、CDS 等）不易免费获取</li>\n<li><strong>方法清晰度</strong>: 中——特征工程流程详细，但模型训练和评估细节不足（草稿性质）</li>\n<li><strong>计算成本</strong>: 中高——500+ 特征 + 滚动训练 + 超参调优</li>\n<li><strong>综合评分</strong>: ★★☆☆☆ 2.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>论文的思路有参考价值但复现成本高且结果不完整。不建议完整复现，但可以借鉴几个关键思想：(1) Mahalanobis 距离和 Absorption Ratio 可作为现有趋势跟踪策略的辅助过滤指标；(2) 用 Shapley 值解释 ML 策略决策的方法论值得纳入研究流程；(3) 精确率 &gt; 召回率的框架设计理念（宁可错过机会也不冒进假信号）。若要做最小可行版本：仅用公开 VIX + 信用利差 + 跨资产相关性作为特征，用 XGBoost 做二分类预测大幅回撤。</p>"}, {"key": "RYQLHEKH", "title": "Equity Risk Premiums (ERP): Determinants, Estimation, and Implications – The 2024 Edition", "year": "2024", "authors": "Aswath Damodaran", "tags": ["Equity Risk Premiums", "ERP", "Market Timing", "Price of Risk", "Valuation"], "venue": "", "abstract": "The equity risk premium is the price of risk in equity markets, and it is not just a key input in estimating costs of equity and capital in both corporate finance and valuation, but it is also a key metric in assessing the overall market. Given its importance, it is surprising how haphazard the estimation of equity risk premiums remains in practice. We begin this paper by looking at the economic determinants of equity risk premiums, including investor risk aversion, information uncertainty and perceptions of macroeconomic risk. In the standard approach to estimating the equity risk premium, historical returns are used, with the difference in annual returns on stocks versus bonds, over a long period, comprising the expected risk premium. We note the limitations of this approach, even in markets with an abundance of data, like the United States, and its complete failure in emerging markets, where the historical data tends to be limited and volatile. We look at two other approaches to estimating equity risk premiums – the survey approach, where investors and managers are asked to assess the risk premium and the implied premium approach, where a forward-looking estimate of the premium is estimated using either current equity prices or risk premiums in other markets. In the next section, we look at the relationship between the equity risk premium and risk premiums in the bond market (default spreads) and in real estate (cap rates) and how that relationship can be mined to generate expected equity risk premiums. We close the paper by examining why different approaches yield different values for the equity risk premium, and how to choose the “right” number to use in analysis.", "url": "https://papers.ssrn.com/abstract=4751941", "date_added": "2026-06-07", "summarized": true, "rating": "★2.5", "starred": false, "repro": "—", "summary_html": "<h1>Equity Risk Premiums (ERP): Determinants, Estimation, and Implications – The 2024 Edition</h1>\n<p>&gt; Zotero Key: <code>RYQLHEKH</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Aswath Damodaran (NYU Stern School of Business)</li>\n<li><strong>年份</strong>: 2024</li>\n<li><strong>出处</strong>: SSRN（第 15 次年更新，首版 2008）</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.4751941</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=4751941</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/ESF7YUPF/Damodaran - 2024 - Equity Risk Premiums (ERP) Determinants, Estimation, and Implications – The 2024 Edition.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>关于股权风险溢价（ERP）的综合性综述与实操手册，系统涵盖 ERP 的经济学决定因素、三种估计方法（调查法/历史法/隐含法）的优劣对比，以及如何在实践中选择合适的 ERP 数值。</p>\n<h2>研究动机与问题</h2>\n<p>ERP 是公司金融和估值中最关键的输入参数之一，但实务中其估计方式极为随意（通常直接取 5–6% 的历史均值）。论文旨在为从业者提供一个框架性指南：理解什么因素驱动 ERP、如何用不同方法估计 ERP、以及为什么不同方法会得出不同数值——最终帮助读者选择&quot;正确&quot;的 ERP。</p>\n<h2>数据与样本</h2>\n<p>不适用——本文为方法论综述，非实证论文。但引用的数据集涵盖：</p>\n<ul>\n<li>美国股票/债券/国库券历史收益（1928–2023）</li>\n<li>全球 100+ 国家的评级和风险溢价数据</li>\n<li>年度隐含 ERP 时间序列（1961–2023，Damodaran 自算）</li>\n<li>调查数据（基金经理、学者、CFO）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>论文为方法论综述，无统一数学模型。三大估计方法的核心逻辑如下：</p>\n<h3>步骤详解</h3>\n<p><strong>方法一：调查法（Survey Premiums）</strong></p>\n<p>直接询问投资者/CFO/学者对 ERP 的预期。优点：简单、前瞻性；缺点：受访者群体偏差、对近期市场表现过度敏感、无理论支撑。</p>\n<p><strong>方法二：历史溢价法（Historical Premiums）</strong></p>\n<p>计算股票相对无风险资产的长期历史超额收益：</p>\n<p>$$ERP = \\frac{1}{T} \\sum_{t=1}^{T} (R_{stock,t} - R_{f,t})$$</p>\n<p>关键选择：算术平均还是几何平均？（算术 &gt; 几何，差异约 1.5%）；无风险利率配对（短期国库券还是长期国债？）；样本区间是否包含大萧条/二战？美国 1928–2023 算术平均 ERP ≈ 5–6%（相对 10Y 国债）。<strong>核心局限</strong>：新兴市场数据短且波动大，历史法完全失效。</p>\n<p><strong>方法三：隐含 ERP 法（Implied Premiums）</strong></p>\n<p>从当前市场价格反推市场对未来收益的贴现率。Damodaran 的方法为两阶段 DCF：</p>\n<p>$$MV_{index} = \\sum_{t=1}^{5} \\frac{E_t \\times (1 - b_t)}{(1 + r)^t} + \\frac{E_5 \\times (1 - b_5) \\times (1 + g)}{(r - g)(1 + r)^5}$$</p>\n<p>其中 $E_t$ 为分析师一致预期盈利，$b_t$ 为再投资率，解出的 $r$ 减无风险利率即隐含 ERP。2024 年 1 月美国隐含 ERP ≈ 4.60%。<strong>特点</strong>：纯粹 forward-looking，随市场情绪变化波动大。</p>\n<p><strong>辅助方法：违约利差法（Default Spread Based）</strong></p>\n<p>利用主权 CDS 利差或评级隐含的违约概率，将国家风险溢价（CRP）叠加到成熟市场 ERP 上，得到新兴市场的 ERP 估计。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>2024 年 1 月美国隐含 ERP</strong>：约 4.60%（基于 S&amp;P 500 和分析师一致预期）</li>\n<li><strong>历史 ERP（1928–2023）</strong>：算术均值约 5–6%，几何均值约 4%</li>\n<li><strong>ERP 与违约利差的关系</strong>：Baa 级公司债利差能解释约 40% 的隐含 ERP 变动</li>\n<li><strong>国家风险溢价分布</strong>：发达市场接近 0% 额外 CRP，新兴市场可从 1% 到 10%+（如委内瑞拉、阿根廷）</li>\n<li><strong>隐含 ERP 的时序特征</strong>：2008 年金融危机时飙升到 ~8%，2020 年 COVID 短暂飙升后迅速回落</li>\n</ul>\n<h2>创新点</h2>\n<p>论文本身不追求学术创新——它是从业者导向的年度综述和方法论指南。但其核心贡献在于：</p>\n<p>1. 将 ERP 的三大估计方法系统化呈现，提供可直接操作的 Excel 计算框架。</p>\n<p>2. 每年更新全球隐含 ERP 数据集（公开免费下载），成为业界广泛引用的参考基准。</p>\n<p>3. 阐明了&quot;为什么不同方法得出不同 ERP&quot;的分析框架——历史溢价 ≠ 当前要求的溢价，前者包含意外收益（surprise returns）。</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>隐含 ERP 依赖于分析师盈利预期</strong>：分析师一致预期存在乐观偏差，可能导致 ERP 被高估。</li>\n<li><strong>两阶段 DCF 的假设敏感</strong>：稳定增长率 $g$ 取无风险利率（名义 GDP 代理），对终端价值占比极高的情形下假设敏感。</li>\n<li><strong>国家风险溢价的估计依赖评级机构</strong>：主权评级调整滞后于市场（如 1997 年亚洲金融危机、2020 年 COVID）。</li>\n<li><strong>非学术论文</strong>：无文献综述、无计量检验、无假设检验框架。本质是&quot;业界最佳实践&quot;文档。</li>\n<li><strong>&quot;正确&quot;的 ERP 不存在</strong>：作者坦承不同方法适用于不同场景，读者仍需自行判断。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: ★★★★★ Damodaran 网站公开所有 ERP 数据（excel 格式，每年更新）。</li>\n<li><strong>方法清晰度</strong>: ★★★★★ 步骤详实，有完整的 spreadsheets 和计算演示。</li>\n<li><strong>计算成本</strong>: ★★★★★ 仅需 Excel。Bloomberg/分析师一致预期数据有一定门槛但可近似替代。</li>\n<li><strong>综合评分</strong>: ★2.5（综述性论文，方法论参考价值高但无可复现的实证结果）</li>\n</ul>\n<h2>复现备注</h2>\n<p>低优先级复现（但<strong>高参考价值</strong>）。本文是方法论工具书而非实证论文——它告诉你&quot;怎么做&quot;而非&quot;发现了什么&quot;。对量化研究的价值在于：（1）隐含 ERP 可作为市场择时信号（高 ERP → 未来收益高，Damodaran 本人有实证）；（2）国家风险溢价框架可用于全球资产配置中的国别权重调整；（3）A 股的隐含 ERP 可自行构建（用 Wind 一致预期替代 IBES），作为 A 股估值温度计。</p>"}, {"key": "KSGBCPW8", "title": "Deep Learning in Characteristics-Sorted Factor Models", "year": "2024", "authors": "Guanhao Feng, Jingyu He, Nicholas G. Polson…", "tags": ["Statistics - Methodology"], "venue": "Journal of Financial and Quantitative Analysis", "abstract": "This paper presents an augmented deep factor model that generates latent factors for cross-sectional asset pricing. The conventional security sorting on firm characteristics for constructing long-short factor portfolio weights is nonlinear modeling, while factors are treated as inputs in linear models. We provide a structural deep learning framework to generalize the complete mechanism for fitting cross-sectional returns by firm characteristics through generating risk factors -- hidden layers. Our model has an economic-guided objective function that minimizes aggregated realized pricing errors. Empirical results on high-dimensional characteristics demonstrate robust asset pricing performance and strong investment improvements by identifying important raw characteristic sources.", "url": "http://arxiv.org/abs/1805.01104", "date_added": "2026-05-26", "summarized": true, "rating": "★3.5", "starred": false, "repro": "—", "summary_html": "<h1>Deep Learning in Characteristics-Sorted Factor Models</h1>\n<p>&gt; Zotero Key: <code>KSGBCPW8</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Guanhao Feng, Jingyu He, Nicholas G. Polson, Jianeng Xu</li>\n<li><strong>年份</strong>: 2024</li>\n<li><strong>出处</strong>: Journal of Financial and Quantitative Analysis (JFQA), Vol. 59</li>\n<li><strong>DOI</strong>: 10.1017/S0022109023000893</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/1805.01104</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/2TPRP3GF/Feng 等 - 2024 - Deep Learning in Characteristics-Sorted Factor Models.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>将传统特征排序因子模型（如 Fama-French）重新解读为一个深度学习架构，把特征（输入）→深度特征（中间层）→风险因子（中间层）→模型隐含收益（输出）全链路统一在最小化定价误差的经济引导目标函数下，样本外 MVE 组合夏普比率最高达 3.00（超过 FF5 基准的 2.49）。</p>\n<h2>研究动机与问题</h2>\n<p>现有资产定价文献要么聚焦于因子→收益的线性映射（如 PCA 类方法），要么聚焦于特征→收益的端到端预测，但&quot;特征如何生成因子&quot;这一中间环节被忽视。同时，传统排序分组（security sorting）本质是非线性激活函数，但这一视角未被系统化利用。本文问：能否用深度学习把特征排序、因子生成、模型定价三步统一在一个可优化的框架里？</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 美国个股（CRSP/Compustat）</li>\n<li><strong>频率</strong>: 月度</li>\n<li><strong>样本区间</strong>: 样本内 1972.01–2011.12，样本外 2012.01–2021.12（约 50 年）</li>\n<li><strong>数据来源</strong>: CRSP 收益、Compustat 账面数据；测试组合包含 Fama-French 25/100 规模-价值组合等标准测试资产</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>增广深度因子模型（Augmented Deep Factor Model）</strong>：</p>\n<p>网络结构（以 DL-FF5 三层为例）：</p>\n<ul>\n<li><strong>输入层</strong>：企业特征 $x_{i,t}$（高维）</li>\n<li><strong>隐层 I（深度学习层）</strong>：非线性变换学习&quot;深度特征&quot;，等价于对特征空间降维</li>\n<li><strong>隐层 II（排序层）</strong>：对深度特征排序，生成多空因子权重（排序 = 非线性激活函数）</li>\n<li><strong>隐层 III（因子生成层）</strong>：用因子权重对实现收益做线性加权，得到风险因子 $f_t$</li>\n<li><strong>输出层</strong>：$R_{i,t} = \\alpha_i + \\beta_i f_t + \\epsilon_{i,t}$（最小化跨股票跨时间的定价误差 $\\alpha$）</li>\n</ul>\n<p><strong>目标函数（经济引导）</strong>：最小化聚合实现定价误差，等价于 GRS 检验框架但从优化视角出发——寻找使截距 $\\alpha$ 最小的因子集合，而非假设检验。</p>\n<p><strong>MVE 组合</strong>：在深度因子 + 基准因子（市场/FF5）张成的空间中构建均值-方差有效组合，评估样本内外夏普比率。</p>\n<p><strong>可解释性</strong>：从降维视角解读深度特征的线性/非线性暴露，识别出盈余意外（SUE）、账面市值比、零交易天数（流动性）为最重要的特征来源。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>样本内 MVE 夏普比率：DL-CAPM 模型 4.57，DL-FF5 模型 6.49</li>\n<li>样本外 MVE 夏普比率：DL-CAPM <strong>2.49</strong>，DL-FF5 <strong>3.00</strong>（相比 IPCA 和 RP-PCA 显著更高）</li>\n<li>深度因子组合对 FF5 和市场因子具有近乎完美的对冲（hedging）性能，说明深度因子捕捉了不被传统因子解释的信息</li>\n<li>最重要的原始特征来源：盈余意外（SUE）、B/M、零交易比率；动量类特征的非线性暴露最显著</li>\n<li>与 IPCA 和 RP-PCA 相比，该模型在 Fama-French 测试组合上的定价误差更小</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>将特征排序机制（security sorting）形式化为深度学习的非线性激活函数，打通特征→因子的完整链路</li>\n<li>经济引导的目标函数：最小化定价误差而非统计拟合优度，与资产定价理论高度一致</li>\n<li>三层结构（深度特征 → 排序 → 因子）将传统 Fama-French 框架统一纳入深度学习</li>\n<li>可从降维视角解释原始特征对深度特征的贡献，提供一定的可解释性</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>仅在美国个股市场验证，未测试其他资产类别</li>\n<li>样本内夏普比率异常高（DL-FF5 达 6.49），样本外大幅下降（3.00），存在过拟合嫌疑</li>\n<li>测试集仅 2012–2021 约 10 年，包含 2020 年大涨行情，代表性存疑</li>\n<li>与 FactorVAE/CA 等概率模型相比，未提供不确定性估计</li>\n<li>深度特征的&quot;排序层&quot;激活函数设计相对特殊，可能难以推广到非美国市场（传统排序规则不同）</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: CRSP/Compustat 需付费，国内无直接等价；若用 A 股基本面特征可尝试迁移，但 FF5 对标因子在国内意义有限</li>\n<li><strong>方法清晰度</strong>: 架构图和公式清晰，但&quot;排序层&quot;的具体激活函数实现需参考补充材料</li>\n<li><strong>计算成本</strong>: 中等，标准前向神经网络，无循环结构，GPU 训练较快</li>\n<li><strong>综合评分</strong>: ★3.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>该论文的核心贡献是理论框架（将 Fama-French 解读为深度学习），工程实现并不复杂。最小可行版本：在 A 股数据上构建双层网络（深度特征层 + 排序层），以最小化多因子定价误差为目标，检验是否优于 IPCA 基准。主要风险：（1）A 股基本面数据质量和覆盖度不如 Compustat；（2）&quot;排序&quot;这一非线性激活函数需谨慎设计，直接用 softmax 排序效果可能不稳定；（3）与基准因子的比较需使用国内对应的 Fama-French 因子库。</p>"}, {"key": "UKSQ4UCY", "title": "Call the Zookeeper: A Unified Framework for Commodity Risk Premiums", "year": "2024", "authors": "John Hua Fan, Xihang Li, Xiao Qiao…", "tags": ["Commodities", "Cross section", "Nonlinear", "Prediction", "Time series"], "venue": "", "abstract": "We evaluate competing explanations of commodity risk premiums within a unified return predictability framework. Using 81 variables spanning commodity-specific characteristics, macroeconomic indicators, and investor sentiment measures, we document significant predictability along time-series and cross-sectional dimensions. Predictive power is distributed across inventory, hedging, and liquidity effects, whose importance changes over time. A zookeeper factor constructed by dynamically aggregating information across theories explains cross-sectional expected returns and exhibits strong predictive power for macroeconomic variables, emerging as a strong candidate state variable that captures future investment opportunities.", "url": "https://papers.ssrn.com/abstract=6618461", "date_added": "2026-05-28", "summarized": true, "rating": "★4.5", "starred": false, "repro": "已复现", "summary_html": "<h1>Call the Zookeeper: A Unified Framework for Commodity Risk Premiums</h1>\n<p>&gt; Zotero Key: <code>UKSQ4UCY</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: John Hua Fan, Xihang Li, Xiao Qiao, Tingxi Zhang</li>\n<li><strong>年份</strong>: 2024</li>\n<li><strong>出处</strong>: SSRN Working Paper</li>\n<li><strong>DOI</strong>: —</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=6618461</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/MI9E3N8Q/Fan 等 - 2024 - Call the Zookeeper A Unified Framework for Commodity Risk Premiums.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>在统一的可预测性框架下，用 81 个变量同时检验存货理论、正常期现价差理论和流动性理论对商品风险溢价的解释力，发现三种渠道均不可或缺，并由此构造&quot;zookeeper&quot;合成因子，在截面资产定价中胜过现有多因子模型。</p>\n<h2>研究动机与问题</h2>\n<p>商品风险溢价文献长期存在三大竞争性解释——存货理论（Theory of Storage）、正常期现价差理论（Theory of Normal Backwardation）、流动性需求与供给——但各研究孤立检验单一渠道、采用不同数据集和方法，导致理论优劣无法横向比较。本文提出一个统一框架：将三类理论的代理变量共同纳入预测模型，通过样本外 R²和 SHAP 归因量化各渠道相对重要性，并在时序和截面两个维度同步评估，填补了&quot;多理论联合检验&quot;的文献空白。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 25 种主要商品期货（软商品、谷物、油脂、牲畜、贵金属、工业原料、能源），最近合约滚动</li>\n<li><strong>频率</strong>: 日频转月频（月度超额收益）</li>\n<li><strong>样本区间</strong>: 约 1987–2022（训练集截至 2005 年前 201 个月；测试集 2005 年起 205 个月）</li>\n<li><strong>数据来源</strong>: Datastream（期货价格、成交量、持仓量）；CFTC COT 报告（套保压力）；FRED 及公开渠道（宏观指标）；WSJ 822,595 篇经济新闻 + FinBERT（情绪得分）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>整体架构：将 81 个预测变量分三组，分别在<strong>时序（TS）</strong>（目标 = 等权市场组合 AVG 月度超额收益）和<strong>截面（CS）</strong>（目标 = 25 个商品各自超额收益）两个维度训练 10 个预测模型 + 集成，再通过 SHAP 归因和多空组合评估经济价值。</p>\n<p>1. <strong>特征构造（81 个预测变量）</strong></p>\n<p>   - <strong>Group C</strong>（37 个，商品特有）：按理论分四类——存货类（carry、relative basis、rbasis12、seasonality 等）；正常期现价差类（hedging pressure hp1/hp12/hptot12、开放性持仓 dOI/dmaOI、偏度 skew 等）；流动性类（basis-momentum bmom/bmom12、Amivest 非流动性 ivolaBGR、异常交易量 atv 等）；其他（货币/通胀敞口、价值等）。</p>\n<p>   - <strong>Group M</strong>（40 个，宏观）：利率（实际利率、联邦基金利率）、商业周期（违约利差、期限利差）、增长与通胀（全球 GDP、G7 通胀、Kilian 指数）、不确定性（EPU、GPR、TMU）、全球股票因子（AQR value/momentum/carry/defensive）等。</p>\n<p>   - <strong>Group S</strong>（4 个，情绪）：Baker-Wurgler 投资者情绪指数；FinBERT 对 WSJ 月度新闻聚合的正面/负面/中性概率。</p>\n<p>   - 在截面预测中，宏观和情绪变量不随品种变化，故用滚动 60 个月 OLS 将个品种收益对 $m_t$/$s_t$ 回归，所得载荷作为品种级 $m_{i,t}$/$s_{i,t}$。</p>\n<p>2. <strong>10 个预测模型</strong></p>\n<p>   - <strong>线性</strong>：OLS（基准）、Stepwise、PLS、Ridge（L2 正则）、LASSO（L1 正则）、Elastic Net（L1+L2）</p>\n<p>   - <strong>非线性</strong>：Random Forest（RF）、Gradient Boosted Regression Trees（GBRT）、XGBoost、MLP（ReLU 激活，Adam 优化，L2 权重衰减）</p>\n<p>   - 超参数调优：10-fold 时序交叉验证，最小化验证集 MSE；固定后滚动 120 个月窗口做 OOS 预测，每月重估系数（超参不变）。标准化：训练集零均值单位方差；预测时用训练集均值/标准差还原。</p>\n<p>3. <strong>集成预测</strong></p>\n<p>   - 线性集成 L-En：5 个线性模型（去 OLS）等权平均</p>\n<p>   - 非线性集成 N-En：4 个非线性模型等权平均</p>\n<p>   - 跨组预测组合：对 C、M、S 三组各自的集成预测再做等权平均</p>\n<p>4. <strong>模型评估</strong></p>\n<p>   - 样本外 $R^2_{OOS}$（对比历史均值基准，滚动 120 个月）：</p>\n<p>   $$R^2_{OOS} = 1 - \\frac{MSFE_M}{MSFE_B}$$</p>\n<p>   - 统计显著性：Clark-West 检验（TS）；对截面 $R^2_{OOS}$ 进行 bootstrap 推断。</p>\n<p>5. <strong>SHAP 变量重要性归因</strong></p>\n<p>   - 计算每个变量在每期的 SHAP 值 $\\phi_j$，缩放为比例 $SP_{j,t} = \\frac{|\\phi_{j,t}|}{\\sum_j |\\phi_{j,t}|}$，再对 OOS 期间取平均得到整体重要性 $SP_j$；按理论分组加总，衡量各渠道贡献。</p>\n<p>6. <strong>Zookeeper 因子构造（截面应用）</strong></p>\n<p>   - 对每期月末，用线性集成模型（Group C，37 个特征）预测 25 个商品下月超额收益，按预测值排序分四分位。</p>\n<p>   - 多（高预测组）空（低预测组）全抵押月度再平衡，构造 zookeeper 长短因子。</p>\n<p>   - 因子收益序列用于：(i) 截面资产定价（155 个测试组合上的 GRS 检验 + Fama-MacBeth 回归）；(ii) 与 AVG 组成两因子模型。</p>\n<p>7. <strong>状态变量检验</strong></p>\n<p>   - 用 zookeeper 过去 60 个月累计收益作为右端变量，预测未来 AVG 收益、AVG 波动率、G7 通胀、联邦基金利率、实际利率，评估其 ICAPM 状态变量属性。</p>\n<h2>核心结论与关键结果</h2>\n<p><strong>时序可预测性：</strong></p>\n<ul>\n<li>Ridge 和 Elastic Net OOS $R^2$：2.80%–3.81%；非线性模型：2.78%–3.17%；线性集成（C+M+S 组合）：<strong>3.55%</strong></li>\n<li>线性与非线性模型表现相当，商品市场低信噪比+小截面使非线性模型无明显优势</li>\n</ul>\n<p><strong>截面可预测性：</strong></p>\n<ul>\n<li>OOS $R^2$：0.11%–0.83%，集成模型最优；商品特有变量优于宏观变量</li>\n</ul>\n<p><strong>SHAP 渠道归因（时序 | 截面）：</strong></p>\n<ul>\n<li>正常期现价差理论：32% | 29%（最强）</li>\n<li>流动性需求与供给：31% | 24%</li>\n<li>存货理论：18% | 25%</li>\n<li>重要性随时间变化：GFC 期间流动性主导，2010 年代后正常期现价差贡献上升</li>\n</ul>\n<p><strong>Zookeeper 经济价值：</strong></p>\n<ul>\n<li>截面多空：年化收益 <strong>5.8%</strong>，Sharpe <strong>0.64</strong>，t 统计量 <strong>3.2</strong>（远优于单因子平均 1.8%/Sharpe 0.19）</li>\n<li>市场择时：年化收益 <strong>5.7%</strong>，Sharpe <strong>0.49</strong>（vs. 买入持有 2.3%，Sharpe 0.22）</li>\n<li>Zookeeper 可以 span 文献中 basis、momentum、relative basis、basis-momentum、hedging pressure；反向不成立</li>\n<li>两因子模型（AVG + Zookeeper）在 155 个测试组合上 GRS F 统计量接近或优于文献中的 3-4 因子模型</li>\n</ul>\n<p><strong>状态变量：</strong></p>\n<ul>\n<li>Zookeeper 正向预测未来 AVG 市场收益和波动率；负向预测 G7 通胀；正向预测联邦基金利率和实际利率 → 符合 ICAPM 状态变量特征</li>\n</ul>\n<p><strong>商业周期：</strong></p>\n<ul>\n<li>实现收益顺周期（衰退期 -12.23% vs. 扩张期 3.87%），与 Gorton-Rouwenhorst 一致</li>\n<li><strong>预期收益逆周期</strong>（衰退晚期远期预期收益最高），与股票风险溢价行为高度相似</li>\n</ul>\n<h2>创新点</h2>\n<p>1. <strong>首个多理论统一检验框架</strong>：在一致方法论下同时评估三大竞争性解释，避免各自为政的偏差</p>\n<p>2. <strong>商品期货文献中最大预测变量集</strong>（81 个），显著扩展已有工作</p>\n<p>3. <strong>SHAP 归因量化渠道重要性</strong>并揭示其时变性，给出&quot;无主导理论&quot;的结论</p>\n<p>4. <strong>Zookeeper 合成因子</strong>：由预测模型直接生成，综合多理论信号，一个因子（+AVG）替代 3-4 个现有因子</p>\n<p>5. 文献中首次区分<strong>实现收益（顺周期）vs. 预期收益（逆周期）</strong>，揭示商品期货的风险资产本质</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>小截面问题</strong>：仅 25 个商品，横截面维度极小，ML 优势受限；样本外 CS $R^2$（≤0.83%）显著低于 TS</li>\n<li><strong>数据窥探风险</strong>：81 个变量中部分为事后发现的因子，SHAP 归因可能受样本选择影响</li>\n<li><strong>FinBERT 情绪复现难度</strong>：需要 WSJ 新闻订阅（822,595 篇），非公开免费数据</li>\n<li><strong>Zookeeper 权重时变性</strong>：因子权重随滚动窗口变化，长期稳定性有待评估</li>\n<li><strong>较短 OOS 样本</strong>：OOS 测试集 205 个月（约 17 年），覆盖的商业周期有限</li>\n<li><strong>套保压力数据</strong>：CFTC COT 数据在国内商品期货市场无直接对应，迁移适用性受限</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 期货价格、成交量可通过 Wind/Bloomberg 获取，宏观指标多为公开数据，情绪指标（FinBERT+WSJ）需自行爬取或替换；CFTC COT 对国内期货不适用，可用国内持仓数据替代</li>\n<li><strong>方法清晰度</strong>: 方法描述详尽，模型均为标准 ML（sklearn/xgboost），超参范围在附录列出，可基本照着实现</li>\n<li><strong>计算成本</strong>: 中等，10 个模型 × 滚动窗口 × 25 品种，单机 CPU 可完成，无需 GPU</li>\n<li><strong>综合评分</strong>: ★4.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>核心复现路径建议分两步：第一步先在国内商品期货市场（约 60+ 品种）用公开信号（carry、momentum、basis-momentum、波动率等）构建简化版 Group C 特征，复现线性集成预测框架和 zookeeper 多空因子；第二步逐步补入宏观因子（Group M）。关键风险点：①国内市场无 CFTC 套保压力数据，可用分品种持仓占比或净持仓变化替代；②样本数量（品种×月份）较美国市场更大，ML 过拟合风险相对降低；③注意剔除市场微观结构噪声（移仓换月附近日期）。最小可行版本：用 10 个 Group C 子因子做等权线性集成，月度截面排序多空，验证是否能复现类似夏普水平。</p>"}, {"key": "SSTEDRJC", "title": "A Century of Profitable Industry Trends", "year": "2024", "authors": "Carlo Zarattini, Gary Antonacci", "tags": ["Momentum", "Trend-Following", "Algo Trading", "Dual Momentum", "Industry Rotation"], "venue": "", "abstract": "This paper evaluates the profitability of an industry-based long-only trend-following portfolio. Utilizing 48 industry portfolios from 1926 to 2024, our analysis explores the model's profitability over a century, highlighting its adaptability and effectiveness across diverse market epochs. We assess the overall profitability of the model and examine the distribution of long-term returns and associated risks. Our analysis includes the impact of individual industry contributions on overall portfolio performance, focusing on t
