的实现细节：仓位缩放用的<strong>波动率估计量</strong>和判断趋势用的<strong>交易规则</strong>。二者都直接决定换手，而换手决定成本。同时 Baltas–Kosowski (2013) 发现 TSMOM 在 2008 后显著跑输，可能原因是趋势缺失或资产间相关性上升（商品金融化 + 危机后跨资产联动）——而标准 TSMOM 的加权方案里<strong>完全没有相关性结构</strong>，只按各自波动率独立缩放，这在联动升高时是次优的。本文同时补上这两块缺口，并给出一个适配期货的成本模型来量化经济意义。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>：56 个期货合约 —— 25 商品、14 发达国家股指、6 外汇、11 国债</li>\n<li><strong>频率</strong>：日频 OHLC（用于区间波动率估计），策略月度再平衡</li>\n<li><strong>样本区间</strong>：数据起于 1974-12；实证聚焦 1983-01 至 2013-02（首个策略月收益为 1984-01，因需 12 个月回看）</li>\n<li><strong>数据来源</strong>：Tick Data（日 OHLC 期货价格）；股指用 Datastream 现货价回补早期</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[56 个期货日频 OHLC&lt;br/&gt;按比例回溯调整拼接连续合约] --&gt; B[计算全额抵押日超额收益]\n  B --&gt; C1[波动率估计模块]\n  B --&gt; C2[趋势信号模块]\n  C1 --&gt;|基线| D1[SD: 收盘价标准差]\n  C1 --&gt;|改进| D2[YZ: 隔夜跳空 + 收盘 SD + Rogers-Satchell&lt;br/&gt;效率约为 SD 的 8.2 倍]\n  C2 --&gt;|基线| E1[SIGN: 过去 12 月收益符号 ±1]\n  C2 --&gt;|改进| E2[TREND: 日对数收益 NW t 统计量&lt;br/&gt;截断于 正负 1 之间连续取值]\n  D1 --&gt; F[单资产权重 = 信号 × 目标波动 / 个股波动]\n  D2 --&gt; F\n  E1 --&gt; F\n  E2 --&gt; F\n  F --&gt; G{是否做相关性调整}\n  G --&gt;|否| H[等权平均 → TSMOM 组合]\n  G --&gt;|是| I[按带符号仓位算平均成对相关 rho_bar]\n  I --&gt; J[相关因子 CF = 根号 N / 1 + N-1 乘 rho_bar]\n  J --&gt; K[组合层动态杠杆 → TSMOM-CF]\n  H --&gt; L[成本模型: 展期成本 + 再平衡成本]\n  K --&gt; L\n  L --&gt; M[税后夏普 / 换手 / Sortino / Calmar]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>输入与收益构造</strong>：56 个合约按&quot;最流动合约&quot;滚动，滚动日用<strong>向后比例调整</strong>（乘以新旧合约价比）拼接连续序列，避免展期日产生虚假收益。全额抵押超额收益为</p>\n<p>   $$r_{t,t+1}=\\frac{F_{t+1,T}-F_{t,T}}{F_{t,T}}$$</p>\n<p>   日频复合成月频。</p>\n<p>2. <strong>基线 TSMOM</strong>：</p>\n<p>   $$r^{TSMOM}_{t,t+1}=\\frac{1}{N_t}\\sum_{i=1}^{N_t} X_t^i\\cdot\\frac{\\sigma_{tgt}}{\\sigma_t^i}\\cdot r_{t,t+1}^i,\\qquad X_t^i=\\mathrm{sign}\\!\\left[r^i_{t-12,t}\\right]$$</p>\n<p>   其中 $\\sigma_{tgt}=40\\%$（单资产目标波动，沿用 MOP2012，使组合事后波动约 12%）。</p>\n<p>3. <strong>换手的两个来源</strong>（本文的分析骨架）：波动率变化和信号翻转，可分别写成</p>\n<p>   $$\\text{turnover}_{vol}\\propto\\left|\\Delta\\!\\left(\\tfrac{1}{\\sigma_t}\\right)\\right|,\\qquad \\text{turnover}_{rule}\\propto\\frac{|\\Delta X_t|}{\\sigma}$$</p>\n<p>   前者说明<strong>估计误差越大、换手越高</strong>（因为 $\\hat\\sigma=\\sigma+\\varepsilon$，噪声直接进分母）；后者说明二值规则每翻转一次 $|\\Delta X|=2$，是换手的主要来源。</p>\n<p>4. <strong>改进一：Yang–Zhang 波动率</strong>。用日内 OHLC 构造，是三个分量的线性组合：</p>\n<p>   $$\\sigma^2_{YZ}(t)=\\sigma^2_{OJ}(t)+k\\,\\sigma^2_{SD}(t)+(1-k)\\,\\sigma^2_{RS}(t)$$</p>\n<p>   分别为隔夜跳空方差、收盘价标准差、Rogers–Satchell 区间估计量；$k=\\dfrac{0.34}{1.34+\\frac{N_D+1}{N_D-1}}$。YZ 对 SD 的效率比为 $1+\\tfrac1k$，月度（约 21 个交易日）约 <strong>8.2 倍</strong>。它是唯一同时对隔夜跳空与漂移项都稳健的区间估计量。</p>\n<p>5. <strong>改进二：TREND 交易规则</strong>。对过去 12 个月日对数收益的均值做 Newey–West t 统计量，并截断在 $\\pm1$：</p>\n<p>   $$\\mathrm{TREND}^{12M}_t=\\begin{cases}+1,&amp; t(r_{t-12,t})&gt;+1\\\\ t(r_{t-12,t}),&amp;\\text{否则}\\\\ -1,&amp; t(r_{t-12,t})&lt;-1\\end{cases}$$</p>\n<p>   这个 t 统计量恰好等于该资产过去 12 个月的年化夏普比率（经异方差与序列相关调整），因此有直接经济含义。它是一条 sigmoid 型响应函数：趋势不够强时按比例减仓，因而 $L^{TREND}_t\\le L^{SIGN}_t$（组合总杠杆 $L_t=\\sum_i \\frac{|X^i_t|}{N_t}\\cdot\\frac{\\sigma_{tgt}}{\\sigma^i_t}$），构成一个<strong>内生的降杠杆机制</strong>。作者还指出这条 sigmoid 与回望式期权跨式的 delta 形状一致。</p>\n<p>6. <strong>改进三：带符号相关性调整</strong>。将等权 TSMOM 权重代入组合方差公式，可得</p>\n<p>   $$\\sigma_P=\\sigma_{tgt}\\sqrt{\\frac{1+(N-1)\\bar\\rho}{N}},\\qquad \\bar\\rho=\\frac{2\\sum_{i}\\sum_{j&gt;i}X_iX_j\\rho_{i,j}}{N(N-1)}$$</p>\n<p>   注意 $\\bar\\rho$ 是<strong>带符号</strong>的：两个负相关资产若一多一空，其对分散化的实际贡献是正相关。反解出为达成组合目标波动 $\\sigma_{P,tgt}$ 所需的单资产目标波动，得相关因子</p>\n<p>   $$CF(\\bar\\rho)=\\sqrt{\\frac{N}{1+(N-1)\\bar\\rho}}$$</p>\n<p>   于是相关性调整后的策略为</p>\n<p>   $$r^{TSMOM-CF}_{t,t+1}=\\frac{1}{N_t}\\sum_i X^i_t\\cdot\\frac{\\sigma_{P,tgt}}{\\sigma^i_t}\\cdot CF(\\bar\\rho_t)\\cdot r^i_{t,t+1}$$</p>\n<p>   $\\bar\\rho$ 用 3 个月滚动窗估计，$\\sigma_{P,tgt}=12\\%$。联动升高 → $CF$ 下降 → 全组合降杠杆。</p>\n<p>7. <strong>成本模型</strong>（本文另一独立贡献）：把期货成本拆成两块，</p>\n<p>   $$RO_{t,t+1}=\\sum_i |w^i_t|\\cdot\\theta_i \\qquad\\text{（展期成本，只看毛敞口）}$$</p>\n<p>   $$RB_{t,t+1}=\\sum_i |w^i_{t+1}-w^i_t|\\cdot\\eta_i \\qquad\\text{（再平衡成本，只看净权重变化）}$$</p>\n<p>   税后收益 $r^{after}=r^{TSMOM}-RO-RB$。$\\theta_i,\\eta_i$ 按资产类别取市场从业者提供的现实水平。这是对 Barroso–Santa-Clara (2015a) 成本模型的推广——后者因为月度结算的 FX 远期只有再平衡成本，无需建模展期。</p>\n<p>8. <strong>输出</strong>：用三位二进制码标记设定（交易规则 0/1 = SIGN/TREND，波动估计 0/1 = SD/YZ，相关调整 0/1 = 无/有），000 为文献默认设定，111 为全套改进，报告税前/税后夏普、Sortino、Calmar、换手和年化成本。</p>\n<h2>核心结论与关键结果</h2>\n<p><strong>换手（Table II）</strong></p>\n<ul>\n<li>YZ 替换 SD：换手 −17%（t=5.33），夏普 1.15 vs 1.15，Ledoit–Wolf p 值极大 → 无业绩代价。</li>\n<li>TREND 替换 SIGN：换手 −24%（t=8.49），夏普 1.15→1.11，统计上不可区分。</li>\n<li>两者合用：换手 <strong>−36.23%</strong>（t=13.19）。默认设定的月度换手（含杠杆）为 <strong>170%</strong>。</li>\n<li>降换手在<strong>全部 56 个合约上无一例外</strong>（Figure 2 两个 Panel），低波动品种（利率期货）效果最强。</li>\n</ul>\n<p><strong>相关性调整（Table III）</strong></p>\n<ul>\n<li>全样本夏普 1.15→1.19，Sortino 2.08→2.31。</li>\n<li>后危机期（2009–2013）夏普 0.01→0.11，全套改进（YZ+TREND+CF）后达 <strong>0.17</strong>。</li>\n<li>代价是换手从 170% 升至 208.6%（t=3.98）；但配合 YZ+TREND 后净换手反而降至 <strong>130.2%</strong>（较默认 −23%，t=6.34）。</li>\n</ul>\n<p><strong>成本（Table V）</strong></p>\n<ul>\n<li>默认设定年化成本 <strong>163bp</strong>，约占税前年化收益 16.12% 的 <strong>10%</strong>。</li>\n<li>YZ 单独降 13%，TREND 单独降 25%，两者合用降 <strong>35%</strong>（→105bp）。</li>\n<li>相关性调整单独<strong>增加</strong> 13%（→185bp）；但 111 全套设定为 <strong>118bp</strong>（较默认 −28%）。</li>\n<li>后危机期：默认设定税后夏普 <strong>−0.09</strong>（税前 0.01）；111 设定税后 <strong>+0.06</strong>（税前 0.17）——即成本视角下相关性调整是把策略从亏钱拉回微赚的关键。</li>\n</ul>\n<p><strong>趋势强度的时序证据（Figure 3）</strong>：无序列相关时 TREND 触及 $\\pm1$ 的理论概率为 31.7%；实际几乎所有资产都高于此，说明存在显著收益延续性。而 GFC 期间及之后，强趋势资产占比出现史上最大跌幅——这正是后危机期表现退化的直接证据。</p>\n<p><strong>事件研究（Figure 4）</strong>：强 TREND 与弱 TREND 资产在成组后 12 个月内实现的动量幅度<strong>相当</strong>（这解释了为何 TREND 降杠杆却不损业绩）；但组合成立满一年后，强 TREND 资产的反转显著更剧烈，空头腿的反转还提前约 6 个月出现。</p>\n<h2>创新点</h2>\n<p>1. 首次把 TSMOM 的<strong>换手</strong>当作一等公民来分析，并在解析上把换手拆成&quot;波动率估计误差&quot;和&quot;信号翻转&quot;两个可独立优化的通道。</p>\n<p>2. 把区间波动率估计量（Yang–Zhang）引入 TSMOM 的仓位缩放，证明估计效率直接转化为换手节约。</p>\n<p>3. TREND 规则：用 Newey–West t 统计量（= 过去 12 个月夏普）取代二值符号，既是连续信号又自带降杠杆，还与回望期权跨式的 delta 建立了理论联系。</p>\n<p>4. 带符号平均成对相关 $\\bar\\rho$ 驱动的<strong>组合层动态杠杆</strong>机制——与 Baltas (2015) 的多空风险平价路线互补但更轻量（只需一个标量）。</p>\n<p>5. 期货专用交易成本模型：展期成本（看毛敞口）与再平衡成本（看净权重变化）分离，适用于展期与再平衡日程不重合的任何期货组合。</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>样本止于 2013-02</strong>。2013 年后 CTA 的表现（尤其 2014–2015 的强势与 2016–2019 的低迷）完全未覆盖，而论文的核心论断之一恰恰是&quot;近期表现退化&quot;——用一个已过去十余年的样本谈&quot;近期&quot;需要更新验证。</li>\n<li><strong>成本参数是&quot;与市场参与者讨论&quot;得来的</strong>，非交易数据实测，且按资产类别取常数、不随时间和成交量变化。163bp 这个绝对水平可信度有限，好在文中主要用它做<strong>相对</strong>比较。</li>\n<li><strong>相关性调整的收益提升幅度并不大</strong>（全样本 1.15→1.19），统计显著性未用 Ledoit–Wolf 检验报告；后危机期的 0.01→0.11 虽是相对巨变，但绝对水平都接近零，从零附近的改善很难说是稳健的经济效应。</li>\n<li>$\\bar\\rho$ 用 3 个月滚动窗估计，56 个资产的相关矩阵在 63 个观测上估计噪声不小；对窗口长度的敏感性未做稳健性检验。</li>\n<li><strong>TREND 的 $\\pm1$ 截断阈值是外生给定的</strong>，没有做阈值敏感性分析，存在轻微的参数选择自由度。</li>\n<li>换手 −36% 的收益很实在，但作者自己也承认：成本只占毛收益 10%，所以砍成本对税后夏普的<strong>绝对</strong>提升有限；真正价值在容量与可扩展性，而非收益率。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>：需要跨四大类的期货日频 <strong>OHLC</strong>（YZ 估计量必须要开高低收，光有收盘价做不了核心改进之一）和展期日程。国内商品期货 + 部分金融期货的 OHLC 齐备；海外多资产（国债、外汇、发达股指）需外部数据源。若只在国内商品期货池上复现，方法完全可移植，只是资产池的相关结构与原文不同。</li>\n<li><strong>方法清晰度</strong>：极高。所有公式（式 1–24）都完整给出，YZ 的 $k$ 参数、NW t 统计量、$CF(\\bar\\rho)$、两类成本的计算式都无歧义，参数取值（$\\sigma_{tgt}=40\\%$、$\\sigma_{P,tgt}=12\\%$、12 个月回看、月度再平衡、3 个月相关窗）全部明确。可以照着实现，几乎不需要猜。</li>\n<li><strong>计算成本</strong>：极低。纯截面/时序统计，无需训练，几十个资产 × 三十年月频，单机秒级。</li>\n<li><strong>综合评分</strong>：★4.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>这是少见的&quot;改动小、收益明确、可直接搬&quot;的论文，非常适合作为已有趋势跟踪流程的增量改造：</p>\n<p>1. <strong>最小可行版本</strong>：在现有 TSMOM 上只替换波动率估计量（SD → Yang–Zhang），验证换手是否下降约 15–20% 且夏普不变。这一步只依赖 OHLC，改动局限在单个函数，是性价比最高的一步。</p>\n<p>2. <strong>第二步</strong>：把二值信号换成 NW t 统计量截断规则，检验换手再降约 20%。注意 t 统计量要用<strong>日频对数收益</strong>在 12 个月窗内算，NW 滞后阶数论文未明说，需自己定（可用 $\\lfloor 4(T/100)^{2/9}\\rfloor$ 的标准选择并做敏感性）。</p>\n<p>3. <strong>第三步（最有价值也最需谨慎）</strong>：$CF(\\bar\\rho)$ 动态杠杆。关键风险点是 $\\bar\\rho$ 的估计噪声——3 个月窗在资产数多时相关矩阵很不稳，建议加 shrinkage 或延长窗口并做敏感性；同时要留意 $CF$ 在 $\\bar\\rho\\to$ 负值时会放大杠杆，需设上限（论文未讨论这个边界情形，实盘必须加约束）。</p>\n<p>4. <strong>成本模型值得单独抽出来复用</strong>：展期 / 再平衡分离的记账方式对任何期货组合的成本归因都适用，且比&quot;单一 bp 乘换手&quot;精细得多。国内品种的 $\\theta,\\eta$ 需按实际手续费与冲击成本自行标定。</p>\n<p>5. <strong>务必把样本延到当下</strong>。论文的后危机期结论建立在 2009–2013 这段特殊窗口上，2013 年后是否成立是复现时最该先回答的问题，也是最容易做出增量贡献的地方。</p>"}, {"key": "7L36N8S2", "title": "DeepLOB: Deep Convolutional Neural Networks for Limit Order Books", "year": "2019", "authors": "Zihao Zhang, Stefan Zohren, Stephen Roberts", "tags": ["Quantitative Finance - Computational Finance"], "venue": "IEEE Transactions on Signal Processing", "abstract": "We develop a large-scale deep learning model to predict price movements from limit order book (LOB) data of cash equities. The architecture utilises convolutional filters to capture the spatial structure of the limit order books as well as LSTM modules to capture longer time dependencies. The proposed network outperforms all existing state-of-the-art algorithms on the benchmark LOB dataset [1]. In a more realistic setting, we test our model by using one year market quotes from the London Stock Exchange and the model delivers a remarkably stable out-of-sample prediction accuracy for a variety of instruments. Importantly, our model translates well to instruments which were not part of the training set, indicating the model's ability to extract universal features. In order to better understand these features and to go beyond a \"black box\" model, we perform a sensitivity analysis to understand the rationale behind the model predictions and reveal the components of LOBs that are most relevant. The ability to extract robust features which translate well to other instruments is an important property of our model which has many other applications.", "url": "http://arxiv.org/abs/1808.03668", "date_added": "2026-05-26", "summarized": true, "rating": "★3.5", "starred": false, "repro": "—", "summary_html": "<h1>DeepLOB: Deep Convolutional Neural Networks for Limit Order Books</h1>\n<p>&gt; Zotero Key: <code>7L36N8S2</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Zihao Zhang, Stefan Zohren, Stephen Roberts (Oxford-Man Institute)</li>\n<li><strong>年份</strong>: 2019</li>\n<li><strong>出处</strong>: IEEE Transactions on Signal Processing, 2019</li>\n<li><strong>DOI</strong>: 10.1109/TSP.2019.2907260</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/1808.03668</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/UIN6BSM8/Zhang 等 - 2019 - DeepLOB Deep Convolutional Neural Networks for Limit Order Books.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>:限价订单簿(LOB)高维、高噪、非平稳，传统方法(VAR/ARIMA)依赖手工特征，难以刻画多档位间的复杂空间交互。</li>\n<li><strong>方法</strong>:端到端深度网络 DeepLOB——Inception 卷积模块提取 LOB 跨档空间结构 + LSTM 捕捉时序动态，对未来中间价做&quot;涨/跌/平&quot;三分类。</li>\n<li><strong>结论</strong>:在 FI-2010 基准上全面超越当时 SOTA(MLP/SVM/简单 CNN-LSTM 等)，并在 LSE 实盘数据上对未见过的股票稳健泛化；扰动分析显示越靠近最优买卖价的档位越重要、买卖两侧信息量不对称。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>LOB 数据是高维、高噪、非平稳的复杂动态环境。传统方法（VAR、ARIMA）依赖手工特征，参数空间受限，难以刻画多个 LOB 层级间的复杂空间交互。已有的机器学习方法（如 SVM、简单 MLP）也受限于手工特征。目标是设计一个端到端的深度学习架构，自动提取 LOB 的跨层级空间特征和时序依赖。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: FI-2010 基准（北欧股票 5 只，10 天）；LSE（5 只股票，1 年 tick 级数据）</li>\n<li><strong>频率</strong>: tick 级 / 降采样至固定档位</li>\n<li><strong>样本区间</strong>: FI-2010 为连续 10 天；LSE 约 1 年训练 + 3 个月测试</li>\n<li><strong>数据来源</strong>: FI-2010 公开基准 + LSE 实盘报价数据</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>DeepLOB 架构</strong>：</p>\n<p>1. <strong>卷积特征提取模块</strong>（Inception Module）：</p>\n<p>   - 输入为过去 $T$ 个时间步的 LOB 快照，每步包含多档（如前 10 档）的价格和量</p>\n<p>   - 多个并行的不同核大小的 1D 卷积（卷积在 LOB 层级维度上）+ MaxPooling，类似 GoogleNet Inception</p>\n<p>   - 目的：在不同感受野上捕捉买/卖两侧各档位的空间交互模式</p>\n<p>2. <strong>LSTM 时序模块</strong>：</p>\n<p>   - 将卷积模块的输出特征图展平后送入 LSTM</p>\n<p>   - 捕捉特征在时间维度上的动态演化</p>\n<p>3. <strong>全连接分类头</strong>：</p>\n<p>   - 输出三分类预测：价格上涨 / 下跌 / 不变（或 $k$ 步后中间价变动方向）</p>\n<p><strong>训练方法</strong>：交叉熵分类损失，严格按照时间顺序划分训练/验证/测试。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>FI-2010 基准</strong>：DeepLOB 在所有预测步长和股票上全面超越当时的 SOTA 方法（多层感知机、SVM、简单 CNN/LSTM 等）</li>\n<li><strong>LSE 数据</strong>：在 5 只 LSE 股票上 3 个月外样本预测准确率稳定且远高于随机</li>\n<li><strong>跨股票泛化</strong>：用部分股票训练的模型在未见过股票上仍保持良好预测能力，表明学到了订单簿的通用特征</li>\n<li><strong>敏感度分析</strong>：通过对输入特征做扰动实验，发现靠近最优买卖价（top of book）的 LOB 层级对预测最重要，且买卖两侧的信息量不对称</li>\n</ul>\n<h2>创新点</h2>\n<p>1. 将 Inception 模块引入 LOB 建模，同时捕捉不同感受野的空间交互</p>\n<p>2. CNN + LSTM 的混合架构首次大规模应用于 LOB 预测</p>\n<p>3. 跨股票泛化能力的系统验证——暗示 LOB 中存在通用微观结构特征</p>\n<p>4. 通过扰动实验提供了一定程度的模型可解释性</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>仅预测价格运动方向（分类），不提供具体的交易信号或仓位建议</li>\n<li>FI-2010 基准数据集太小（仅 10 天），可能导致过拟合</li>\n<li>未考虑交易成本、延迟、队列位置等实际交易约束</li>\n<li>高频策略的高度竞争性——即使有统计显著的方向预测能力，利润也可能被成本和延迟完全侵蚀</li>\n<li>从预测方向到产生利润还需要完整的执行模型，论文未涉及</li>\n<li>IEEE TSP 版本与 arXiv 版本内容基本一致，创新性在同领域接受度良好</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: FI-2010 公开（但规模有限），LSE 数据需购买；A 股 L2 数据可从通达信/聚宽获取</li>\n<li><strong>方法清晰度</strong>: 架构描述完整，代码在 GitHub (zcakhaa/DeepLOB) 开源</li>\n<li><strong>计算成本</strong>: 中等 — tick 级数据 + CNN+LSTM，需 GPU</li>\n<li><strong>综合评分</strong>: ★3.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>DeepLOB 在高频 LOB 预测领域是经典基线，但应用到量化策略需要大量额外工作（信号到仓位、成本建模、执行）。最小可行版本不在因子层面，建议直接使用开源代码在 FI-2010 上复现后评估是否有必要扩展到 A 股 LOB 数据。纯高频方向，与当前组合/因子层面的复现路线不同，回归优先级拉低。</p>"}, {"key": "9XW9DYXS", "title": "A Tale of Two Premiums: The Role of Hedgers and Speculators in Commodity Futures Markets", "year": "2019", "authors": "Wenjin Kang, K. Geert Rouwenhorst, Ke Tang", "tags": ["Commodity futures", "liquidity provision", "hedging pressure", "return predictability", "risk premium", "theory of normal backwardation"], "venue": "", "abstract": "This paper studies the dynamic interaction between the net positions of traders and risk premiums in commodity futures markets. Short-term position changes are mainly driven by the liquidity demands of non-commercial traders, while long-term variation is primarily driven by the hedging demands of commercial traders. These two components influence expected futures returns with opposite signs. The gains from providing liquidity by commercials largely offset the premium they pay for obtaining price insurance.", "url": "https://papers.ssrn.com/abstract=2449315", "date_added": "2026-05-30", "summarized": true, "rating": "★4.5", "starred": false, "repro": "待复现", "summary_html": "<h1>A Tale of Two Premiums: The Role of Hedgers and Speculators in Commodity Futures Markets</h1>\n<p>&gt; Zotero Key: <code>9XW9DYXS</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Wenjin Kang, K. Geert Rouwenhorst, Ke Tang</li>\n<li><strong>年份</strong>: 2019</li>\n<li><strong>出处</strong>: Review of Financial Studies (SSRN working paper)</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.2449315</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=2449315</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/F8KCMJMI/Kang 等 - 2019 - A Tale of Two Premiums The Role of Hedgers and Speculators in Commodity Futures Markets.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：Keynes 正常贴水理论预测套保者净空头产生正风险溢价，但实证长期找不到对冲压力与预期收益的稳健正相关——为何对冲压力理论经常失效？</li>\n<li><strong>方法</strong>：用 CFTC COT 周度持仓构造对冲压力 HP、净交易流 Q、交易倾向 PT，对 26 个商品做 Fama-MacBeth 回归，用 52 周移动平均分离慢速对冲需求与短期流动性噪声，并做持仓利润三分解（1994–2017）。</li>\n<li><strong>结论</strong>：价格嵌入两个方向相反的溢价——慢速对冲溢价（$\\overline{HP}$ 正向预测）与快速流动性溢价（Q 反向预测），二者在单因子回归中相互抵消故 HP 失显著；商业交易者逆向提供流动性（买入后 t+1 跑赢，$t=4.95$），净流动性利润 3.41%/年，解释了投机者整体盈利微薄之谜。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>Keynes 正常贴水理论认为商业套保者（hedgers）的净空头头寸会产生正的风险溢价，即对冲压力越大、预期收益越高。但实证文献（Rouwenhorst and Tang 2012 综述）始终难以找到对冲压力与预期收益之间的稳健正相关关系。本文提出两个解释：(1) CFTC 分类中的商业/非商业划分并不精确反映套保/投机动机；(2) <strong>对冲压力的周度变化中混入了大量由非商业交易者短期流动性需求驱动的噪音</strong>，这与对冲动机产生的溢价方向相反，互相抵消。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 26 种在北美交易所（NYMEX、NYBOT、CBOT、CME）交易的商品期货</li>\n<li><strong>频率</strong>: 周度（周二测量，周五发布 COT 报告）</li>\n<li><strong>样本区间</strong>: 1994 年 1 月 2 日 – 2017 年 12 月 31 日</li>\n<li><strong>数据来源</strong>: CFTC 的 Commitment of Traders (COT) 报告（周度持仓数据）、Pinnacle Corp.（期货价格）、CBOE/期权隐含波动率（商品特异性风险）、DCOT 报告（2006 年起的细分持仓数据）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n    A[CFTC COT 周度持仓报告&lt;br/&gt;26 种商品] --&gt; B[构建三个核心变量&lt;br/&gt;HP 对冲压力&lt;br/&gt;Q 净交易&lt;br/&gt;PT 交易倾向]\n    B --&gt; C{分析目标}\n    C --&gt;|短期流动性| D[Fama-MBeth 回归&lt;br/&gt;Q → R t+1,t+2&lt;br/&gt;控制 basis/momentum/idiosyncratic vol]\n    C --&gt;|对冲压力分解| E[52周移动平均 HP_bar&lt;br/&gt;分离慢速对冲需求&lt;br/&gt;与短期流动性噪音]\n    C --&gt;|利润分解| F[将持仓分解为&lt;br/&gt;对冲需求/动量交易/流动性提供&lt;br/&gt;三组件利润]\n    D --&gt; G[流动性提供溢价&lt;br/&gt;commercials 买入后价格上涨&lt;br/&gt;non-commercials 买入后价格下跌]\n    E --&gt; H[HP_bar 正向预测收益&lt;br/&gt;Q 反向预测收益&lt;br/&gt;两因子独立且方向相反]\n    F --&gt; I[commercials 流动性提供利润&lt;br/&gt;5.27% − 1.86% = 3.41%&lt;br/&gt;部分抵消对冲损失 −4.71%]</div>\n<h3>步骤详解</h3>\n<p><strong>核心变量构建：</strong></p>\n<p>1. <strong>对冲压力</strong>：$HP_{i,t} = \\frac{CS_{i,t} - CL_{i,t}}{OI_{i,t}}$，即商业交易者净空头合约数除以未平仓合约量（$CS$=商业空头，$CL$=商业多头，$OI$=未平仓量）。</p>\n<p>2. <strong>净交易量</strong>：$Q_{i,t} = \\frac{\\text{netlong}_{i,t} - \\text{netlong}_{i,t-1}}{OI_{i,t-1}}$，衡量各类交易者的净买入强度。</p>\n<p>3. <strong>交易倾向</strong>：$PT_{i,t} = \\frac{|\\Delta CL| + |\\Delta CS|}{CL_{t-1} + CS_{t-1}}$，衡量换手频率。非商业交易者的 PT（8.89%/周）几乎是商业交易者（5.30%/周）的两倍。</p>\n<p><strong>流动性提供实证检验：</strong></p>\n<p>4. <strong>Fama-MBeth 回归</strong>：$R_{i,t+j} = b_0 + b_1 Q_{i,t} + b_2 B_{i,t} + b_3 S_{i,t}\\hat{v}_{i,t} + b_4 R_{i,t} + \\varepsilon_{i,t+j}$，其中 $B$ 为对数基差，$\\hat{v}$ 为特质波动率，$S$ 为非商业方向符号变量。</p>\n<p>5. <strong>关键发现</strong>：商业交易者买入的商品在 t+1 周显著跑赢（t=4.95），非商业交易者买入的商品在 t+1 周显著跑输（t=6.60）——商业交易者是流动性提供者，非商业交易者是流动性消耗者。</p>\n<p><strong>对冲压力分解：</strong></p>\n<p>6. <strong>平滑对冲压力</strong>：$\\overline{HP}_{i,t}$ = HP 的 52 周移动平均，滤除短期流动性噪音，保留慢速对冲需求信号。</p>\n<p>7. <strong>双因子回归</strong>：同时纳入 $Q$ 和 $\\overline{HP}$，两者均显著但方向相反——$\\overline{HP}$ 正向预测收益（对冲溢价），$Q$ 反向预测收益（流动性消耗成本）。这解释了传统单因子回归中 HP 系数不显著的原因。</p>\n<p><strong>利润分解框架：</strong></p>\n<p>8. <strong>持仓三分解</strong>：$np_{i,t} = \\overline{np}_{i,t} + Mnp_{i,t} + Lnp_{i,t}$，分别对应对冲需求（慢速）、动量交易（与过去 52 周收益相关）和流动性提供（残差）。</p>\n<p>9. <strong>利润等式</strong>：$\\text{Profit}_{i,t+1} = \\overline{np} \\cdot R + Mnp \\cdot R + Lnp \\cdot R$ = 对冲动量 + 动量交易 + 流动性提供。</p>\n<p><strong>风险环境与流动性提供：</strong></p>\n<p>10. <strong>商品特异性波动率</strong>：使用期权隐含波动率（delta 0.375–0.5 的期权加权平均）。当商品隐含波动率高于中位数时，流动性提供溢价翻倍（从 8.2bp 升至 15.6bp）。</p>\n<p>11. <strong>VIX 不影响</strong>：VIX 交互项不显著——说明流动性提供者是实物市场参与者而非金融中介。</p>\n<p>12. <strong>资本约束与订单不平衡</strong>：商业交易者亏损后或连续同方向交易后，流动性提供成本上升（资本约束收紧时更不愿提供流动性）。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>两个溢价</strong>：商品期货价格嵌入两个方向相反的溢价——对冲溢价（慢速，正向预测收益）和流动性溢价（快速，反向预测收益）。</li>\n<li><strong>流动性提供者</strong>：商业交易者（尤其是生产商）在短期内逆向交易，为非商业交易者提供流动性，获得流动性提供溢价。</li>\n<li><strong>流动性消耗者</strong>：非商业交易者（尤其是资金管理人/CTA）追随动量策略，消耗流动性，支付流动性成本。</li>\n<li><strong>利润分解</strong>：商业交易者的流动性提供利润为 5.27%/年，减去对动量交易者的损失 1.86%，净流动性利润 3.41%/年，部分抵消了对冲需求损失 4.71%/年。</li>\n<li><strong>非商业交易者低盈利之谜</strong>：对冲需求带来的溢价收益被短期流动性消耗成本大致抵消，解释了为何投机者整体盈利微薄。</li>\n<li><strong>组合排序</strong>：按商业交易者净买入排序的五分位组合，最高五分位在 20 个交易日内跑赢最低五分位约 73bp（年化约 9%）。</li>\n<li><strong>DCOT 验证</strong>：2006 年后的细分数据显示，生产商是流动性提供者，资金管理人是流动性消耗者，互换交易商不提供流动性。</li>\n</ul>\n<h2>创新点</h2>\n<p>1. <strong>流动性提供渠道</strong>：首次系统性地在商品期货市场中建立&quot;商业交易者提供流动性、非商业交易者消耗流动性&quot;的完整实证框架。</p>\n<p>2. <strong>对冲压力分解</strong>：用 52 周移动平均滤除短期噪音，分离出对冲需求的慢速信号，解决了传统对冲压力实证不显著的长期困惑。</p>\n<p>3. <strong>利润三分解</strong>：将交易者利润分解为对冲需求、动量交易、流动性提供三个来源，量化了各类动机的经济重要性。</p>\n<p>4. <strong>风险环境分析</strong>：发现流动性提供成本取决于商品特异性风险（而非系统性风险 VIX），有力支持了实物市场参与者而非金融中介作为流动性提供者的假说。</p>\n<p>5. <strong>解释投机者低盈利</strong>：为文献中&quot;投机者整体不赚钱&quot;的发现提供了结构性解释——对冲溢价收益被流动性消耗成本抵消。</p>\n<h2>局限与可质疑处</h2>\n<p>1. <strong>CFTC 分类粗糙</strong>：COT 报告将交易者分为商业/非商业/不可报告三类，商业类别中包含掉期交易商（DCOT 分析部分修正了这一点，但仅覆盖 2006 年后）。</p>\n<p>2. <strong>流动性推断而非直接观测</strong>：流动性提供方向是通过&quot;买入后价格上涨&quot;推断的，而非直接观测到的订单流，可能存在内生性问题。</p>\n<p>3. <strong>26 种商品样本</strong>：仅覆盖北美交易所交易的商品，对能源、农产品、金属以外的品种（如软商品、牲畜）覆盖有限。</p>\n<p>4. <strong>周度频率限制</strong>：COT 报告为周度数据，可能错过日内或更短时间尺度的流动性动态。</p>\n<p>5. <strong>动量分解简化</strong>：动量成分用过去 52 周收益的线性回归拟合（R² 仅 4.70%），可能过于简化了非商业交易者的实际动量策略。</p>\n<p>6. <strong>前视偏差风险</strong>：COT 报告在周五发布（反映周二持仓），但价格数据使用的是周二到周二的收益，可能存在时间匹配上的微妙问题。</p>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>：高。CFTC COT 报告为公开数据（cftc.gov），期货价格来自公开数据库，DCOT 报告自 2006 年起公开。</li>\n<li><strong>方法清晰度</strong>：高。所有变量定义、回归设定、利润分解公式均有明确的数学表达，可直接实现。</li>\n<li><strong>计算成本</strong>：低。主要是 Fama-MBeth 回归和组合排序，无需重型计算。</li>\n<li><strong>综合评分</strong>: ★4.5</li>\n</ul>\n<h2>复现备注</h2>\n<ul>\n<li>最小可行版本：用 CFTC 公开的 COT 数据构建 HP 和 Q 变量，对 26 种商品做 Fama-MBeth 回归验证流动性提供效应。</li>\n<li>关键数据源：CFTC COT 数据可从 cftc.gov 下载（历史数据格式需处理），或使用 R 包 <code>cftc</code>、Python 包 <code>cotreports</code>。</li>\n<li>建议重点复现：(1) 表 III 的流动性提供回归；(2) 表 VI 的对冲压力分解；(3) 表 XI 的利润分解。</li>\n<li>扩展方向：将框架应用于中国商品期货市场（大商所/郑商所/上商所的持仓数据），检验流动性提供效应在不同市场结构下的稳健性。</li>\n</ul>"}, {"key": "9LCIPXCX", "title": "Designing Robust Trend-following System: Behind the Scenes of Trend-following", "year": "2018", "authors": "Dobromir Tzotchev", "tags": ["time-series momentum", "AR(1)", "CTA", "trend-following"], "venue": "", "abstract": "Trend-following has actively been on investors’ radar for the last few decades. The J.P. Morgan primer on momentum strategies (Kolanovic and Wei, 2015) provides an extensive review of the momentum strategies. The current paper focuses on a concrete trend-following solution and analyzes its properties alongside the practical implementation.  More concretely, the goal of the current paper is threefold:•\tFirst, a trend-following signal based on statistical theory is proposed and we analytically investigate its properties. We reconcile the theoretical results with stylized facts about trend-following investing – ‘CTA smile’, the link to straddles and the better performance of so-called ‘slower’ signals. •\tSecond, based on the theoretical results we propose a prototype trend-following solution that uses a unified approach across assets and diversifies across time-frames. Its performance versus benchmarks and diversification properties for long-only portfolios are highlighted within simulation examples.•\tThird, we elaborate on the portfolio and risk management of the trend-following strategy. We illustrate how the risk-budgeting and the Hierarchical Risk Parity (HRP) approaches can be adapted to the trend-following framework. Various methods to manage the transaction costs aspects of the strategy have also been discussed. In particular, we show how to limit the downside in the case of trendless market and how to take into account the implications of the carry component in many futures and FX forwards.", "url": "https://papers.ssrn.com/abstract=4677166", "date_added": "2026-05-24", "summarized": true, "rating": "★4.5", "starred": false, "repro": "待复现", "summary_html": "<h1>Designing Robust Trend-following System: Behind the Scenes of Trend-following</h1>\n<p>&gt; Zotero Key: <code>9LCIPXCX</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Dobromir Tzotchev (J.P. Morgan)</li>\n<li><strong>年份</strong>: 2018</li>\n<li><strong>出处</strong>: SSRN</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.4677166</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=4677166</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/JREUZ9LJ/Tzotchev - 2018 - Designing Robust Trend-following System Behind the Scenes of Trend-following.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：趋势跟踪的实践远走在理论前面——CTA smile、慢信号优越性等核心观察缺乏严谨推导</li>\n<li><strong>方法</strong>：基于 $t$ 统计量构造信号（$2 \\times N(t\\text{-stat}) - 1$ = 跨式期权 delta），在 AR(1) 框架下解析推导</li>\n<li><strong>结论</strong>：信号等价于跨式期权 delta；当资产 $|$Sharpe$| &gt; 1$ 时趋势策略 Sharpe 可超标的；慢信号是纯趋势暴露，短信号混杂自相关套利</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>趋势跟踪的实践远走在理论前面——&quot;CTA smile&quot;（无论涨跌都能赚钱的凸性收益曲线）、慢信号优于快信号、多时间尺度分散的益处等均为实证观察，缺乏严谨的理论推导。这篇论文填补了理论空白，并在理论基础上构建了一个完整的趋势跟踪系统。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 跨资产期货和外汇远期（具体品种列表详见附录，典型 CTA universe）</li>\n<li><strong>频率</strong>: 日度</li>\n<li><strong>样本区间</strong>: 未明确给出（推测 ~2000-2017）</li>\n<li><strong>数据来源</strong>: J.P. Morgan</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>核心信号：基于 t 统计量的 &quot;delta-straddle&quot; 信号</h3>\n<ul>\n<li><strong>信号构造</strong>: $\\text{Signal} = 2 \\times N(t\\text{-stat}) - 1$，范围 [-1, 1]</li>\n<li>当 $\\bar{R}_{t,T} &gt; 0$ 时，$t\\text{-stat} = \\sqrt{T} \\cdot \\bar{R}_{t,T} / \\hat{\\sigma}$，$1-N(t\\text{-stat})$ 越小 → 越有信心 $\\mu &gt; 0$</li>\n<li>当 $\\bar{R}_{t,T} &lt; 0$ 时，$N(t\\text{-stat})$ 越小 → 越有信心 $\\mu &lt; 0$</li>\n</ul>\n<h3>理论贡献（在 AR(1) 框架下）</h3>\n<p>1. <strong>CTA Smile 的数学证明</strong>: 策略的 gross P&amp;L 与资产 Sharpe ratio 的关系呈跨式期权形态——无论正负 Sharpe 都能盈利，且具有凸性</p>\n<p>2. <strong>慢信号优越性的证明</strong>: 长回看期信号是&quot;纯趋势&quot;玩法——自相关的影响随回看期增加而消失；短回看期信号 (≤1 月) 的 P&amp;L 严重受自相关干扰</p>\n<p>3. <strong>自相关效应</strong>: $\\rho=0.1$ 的自相关可使 4 日回看期的信号 Sharpe 超 0.8（但不代表真实 alpha，而是利用了短期自相关结构）</p>\n<p>4. <strong>交易成本建模</strong>: 成本随 bid-ask spread 增加、随波动率和回看期增加而降低</p>\n<p>5. <strong>多信号相关性</strong>: 不同回看期信号的 P&amp;L 相关性取决于回看期之比，可从理论推导</p>\n<p>6. <strong>均值回归推论</strong>: 短回看期的反向信号（做均值回归）仅当自相关为负时盈利</p>\n<h3>原型方案设计</h3>\n<ul>\n<li><strong>统一方法论</strong>: 同一信号形式应用于所有资产类别</li>\n<li><strong>多时间尺度分散</strong>: 快/中/慢信号组合</li>\n<li><strong>投资组合管理</strong>: 比较了逆波动率加权、风险预算、HRP（分层风险平价）三种方法</li>\n<li><strong>成本控制</strong>: carry 过滤（只有 trend 方向与 carry 方向一致时才交易）；信号阈值（避免微小信号触发交易）</li>\n</ul>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>信号在理论上是<strong>跨式期权 delta</strong>——趋势跟踪本质上等价于持有一个动态 delta 对冲的 straddle 组合</li>\n<li>当资产 |Sharpe| &gt; 1 时，趋势策略的 Sharpe 可能超过标的资产本身——这解释了 CTA 在危机中的优异表现（危机中 Sharpe 大幅为负，趋势做空获取正收益）</li>\n<li>长回看期信号是&quot;纯趋势暴露&quot;，短回看期信号混杂了自相关捕捉（即隐性地在做统计套利/均值回归）</li>\n<li>多时间尺度信号平均仅在适当的相关结构下才是最优的——不是随便平均都有好处</li>\n<li>HRP 在趋势跟踪组合管理中优于简单逆波动率加权</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次将趋势跟踪信号与统计假设检验严格关联，并证明其等于跨式期权 delta</li>\n<li>在 AR(1) 框架下系统地解析推导了信号的全部核心性质（P&amp;L、成本、相关性）</li>\n<li>从理论上解释了为什么慢信号优于快信号、CTA smile 为什么存在</li>\n<li>澄清了短周期趋势信号其实在做&quot;自相关套利&quot;而非纯趋势跟踪</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>理论推导依赖 AR(1) 假设和正态性假设——真实市场的肥尾、波动率聚类、体制转换未建模</li>\n<li>JP Morgan 出品——原型方案的参数可能有未公开的商业优化</li>\n<li>未展示完整的样本外回测结果（论文核心是方法论和理论，实证部分较薄弱）</li>\n<li>carry 过滤器的引入改变了策略的性质（部分从纯趋势变成了 carry+trend 混合）</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 中——期货数据需要商业数据源，但可用公开来源替代</li>\n<li><strong>方法清晰度</strong>: 极高——信号公式和推导完整，可以直接编码实现</li>\n<li><strong>计算成本</strong>: 低——不需要训练，纯信号计算</li>\n<li><strong>综合评分</strong>: ★★★★☆ 4.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>这是最值得深入复现的论文之一，因为其理论框架可以指导实际策略设计。建议最小可行版本：(1) 实现 t-stat 信号（比常用的 Z-score 或二元信号理论更稳健）；(2) 在不同资产上验证慢信号 &gt; 快信号的结论；(3) 测试不同时间尺度信号的相关性结构是否与理论预测一致；(4) 比较逆波动率 vs HRP 组合管理方法的差异。关键价值在于为趋势跟踪提供了一个有理论根基的信号构造方法，而非纯经验调参。</p>"}, {"key": "XWURDXI8", "title": "Deep Value", "year": "2017", "authors": "Clifford S. Asness, John M. Liew, Lasse Heje Pedersen…", "tags": ["behavioral finance", "arbitrage", "bubbles", "demand pressure", "market efficiency", "noise", "over-reaction", "value investing"], "venue": "", "abstract": "We define “deep value” as episodes where the valuation spread between cheap and expensive securities is wide relative to its history. Examining deep value across global individual equities, equity index futures, currencies, and global bonds provides new evidence on competing theories for the value premium.", "url": "https://papers.ssrn.com/abstract=3076181", "date_added": "2026-05-25", "summarized": true, "rating": "★3.5", "starred": false, "repro": "—", "summary_html": "<h1>Deep Value</h1>\n<p>&gt; Zotero Key: <code>XWURDXI8</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Clifford S. Asness, John M. Liew, Lasse Heje Pedersen, Ashwin K. Thapar</li>\n<li><strong>年份</strong>: 2017</li>\n<li><strong>出处</strong>: SSRN (3076181)</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.3076181</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=3076181</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/UUN7S4MZ/Asness 等 - 2017 - Deep Value.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：价值因子长期有效但时变剧烈，有时出现&quot;价值陷阱&quot;——能否通过估值价差宽度预测价值因子未来收益？&quot;深度价值&quot;事件后价值策略是否异常强劲？</li>\n<li><strong>方法</strong>：定义&quot;深度价值&quot;为估值价差相对自身 5 年 Z-score 超过 +1 标准差的状态，在全球个股（24 国约 30,000 只）、股指期货、外汇和债券四个资产类别 1980—2016 年上检验。</li>\n<li><strong>结论</strong>：深度价值事件后价值因子收益显著高于常态，支持行为金融学解释（过度反应 + 套利限制）而非纯风险补偿；效应在四个资产类别上一致存在。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<ul>\n<li>价值因子长期有效但时变剧烈，有时出现&quot;价值陷阱&quot;（便宜的一直便宜）。以往文献对价值策略<strong>择时</strong>的研究较少。</li>\n<li>本文问：能不能通过估值价差的宽度来预测价值因子的未来收益？即&quot;深度价值&quot;事件是否意味着随后价值策略异常强劲？</li>\n<li>同时利用这一现象检验两类竞争理论：风险补偿（价值股风险在深度价值期更高）vs 行为金融（过度反应 + 套利资本不足）。</li>\n</ul>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>:</li>\n</ul>\n<p>  - 全球个股：24 个发达市场，约 30,000 只股票</p>\n<p>  - 股指期货：14 个国家</p>\n<p>  - 外汇：27 个货币对</p>\n<p>  - 全球债券：13 个国家政府债</p>\n<ul>\n<li><strong>频率</strong>: 月度再平衡</li>\n<li><strong>样本区间</strong>: 约 1980–2016（不同资产类略有差异）</li>\n<li><strong>数据来源</strong>: 个股用 XpressFeed，股指期货和外汇用 Datastream，债券用 Bloomberg/Barclays</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>深度价值的定义</h3>\n<p>1. 每个时间点计算估值价差：<code>spread = P(cheap) − P(expensive)</code>，其中 P 为估值指标（如 B/P，E/P，CF/P 等）。个股用综合 Z-score，外汇用实际有效汇率与 PPP 偏离，债券用实际收益率差。</p>\n<p>2. 对 spread 取过去 5 年的 Z-score：<code>deep_value_z = (spread_t − mean(spread_{t−60:t−1})) / std(spread_{t−60:t−1})</code></p>\n<p>3. 当 <code>deep_value_z</code> 超过历史 +1 标准差时视为&quot;深度价值&quot;事件。</p>\n<h3>资产类别特定估值指标</h3>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>资产类别</th><th>估值指标</th></tr>\n<tr><td>全球个股</td><td>B/P, E/P, CF/P, 股利收益率等综合评分</td></tr>\n<tr><td>股指期货</td><td>CAPE 的倒数，B/P</td></tr>\n<tr><td>外汇</td><td>对 PPP 的偏离 + 实际汇率均值回复</td></tr>\n<tr><td>全球债券</td><td>实际收益率（相对于历史均值）</td></tr>\n</table></div>\n<h3>分析框架</h3>\n<ul>\n<li>按 deep_value_z 分位分别计算后续 value factor 的收益（多减空）。</li>\n<li>回归：<code>value_factor_return_t = α + β × deep_value_z_{t−1} + controls</code>。</li>\n<li>控制项包括 value factor 自身的动量（短期反转）、流动性、波动率等。</li>\n</ul>\n<h2>核心结论与关键结果</h2>\n<p>1. <strong>深度价值显著预测价值因子收益</strong>：当价差处于历史高分位（&gt; +1σ）时，后续 1–3 年价值因子年化收益比常态高约 5–10 个百分点。</p>\n<p>2. <strong>跨资产稳健</strong>：四个资产类别均存在深度价值效应，无一是反例。</p>\n<p>3. <strong>支持行为解释 &gt; 风险解释</strong>：深度价值事件后，便宜资产估值修复（而非继续恶化），且价差在高分位后往往均值回复（而非趋势延续），这不符合&quot;风险补偿随时间上升&quot;的预测。此外，深度价值事件常伴随市场压力（高波动、低流动性），更符合套利限制故事。</p>\n<p>4. <strong>价值因子的反转效应</strong>：深度价值信号低（价差窄）时，价值因子后续收益弱甚至为负——此时盲目做多价值因子可能亏钱。</p>\n<p>5. <strong>与价值动量的关系</strong>：深度价值信号与价值因子自身的 1 年动量有重叠但独立，两者结合效果更好。</p>\n<h2>创新点</h2>\n<ul>\n<li>首次将&quot;价差宽度&quot;系统化为一个可交易的<strong>择时指标</strong>，而非仅描述性统计。</li>\n<li>跨四个资产类别统一验证，证据面广。</li>\n<li>巧妙利用深度价值现象<strong>区分竞争理论</strong>，而非仅报告收益。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>样本内优化风险</strong>：价差的五年滚动 Z-score 参数（窗口长度、阈值）存在回顾偏差。</li>\n<li><strong>深度价值事件稀少</strong>：超过 +1σ 的事件占总样本约 16%，实际交易机会有限，且样本量小使得统计推断不够稳健。</li>\n<li><strong>只做多空不做净多头</strong>：未讨论纯粹做多便宜资产的策略，实践中很受仓位限制。</li>\n<li><strong>尾部风险</strong>：深度价值信号也可能指示的是结构性破裂（如行业永久衰退），而非均值回复机会。</li>\n<li><strong>2017 年后未验证</strong>：样本止于约 2016 年，近几年价值因子表现波动剧烈，需要更近期检验。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: ★★★ 个股需要 XpressFeed 等昂贵数据源，但股指期货/ETF 层面可用公开数据近似复现。</li>\n<li><strong>方法清晰度</strong>: ★★★★ 方法论描述详细，公式和回归方程完整，不难实现。</li>\n<li><strong>计算成本</strong>: ★★★★ 月度再平衡，计算量轻，单机可完成。</li>\n<li><strong>综合评分</strong>: ★★★3.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>核心是估值价差的时间序列标准化，实现难度低。建议在期货横截面（商品+股指+债券）上复现深层价值逻辑：计算每个品种的估值指标（如基差/展期、基本面估值代理），按月标准化价差，事件触发时放大该品种价值信号的权重。这个框架可直接嵌入现有的横截面择时模块中，把深度价值作为一个动态仓位缩放器使用。优先测股指和商品期货，这两个资产类别数据最容易对齐。</p>"}, {"key": "TJJQV3D5", "title": "Meta-CTA Trading Strategies based on the Kelly Criterion", "year": "2016", "authors": "Bernhard K. Meister", "tags": ["Quantitative Finance - Portfolio Management"], "venue": "", "abstract": "The influence of Commodity Trading Advisors (CTA) on the price process is explored with the help of a simple model. CTA managers are taken to be Kelly optimisers, which invest a fixed proportion of their assets in the risky asset and the remainder in a riskless asset. This requires regular adjustment of the portfolio weights as prices evolve. The CTA trading activity impacts the price change in the form of a power law. These two rules governing investment ratios and price impact are combined and lead through updating at fixed time intervals to a deterministic price dynamic. For different choices of the model parameters one gets qualitatively different dynamics. The result can be expressed as a phase diagram. Meta-CTA strategies can be devised to exploit the predictability inherent in the model dynamics by avoiding critical areas of the phase diagram or by taking a contrarian position at an opportune time.", "url": "http://arxiv.org/abs/1610.10029", "date_added": "2026-06-26", "summarized": true, "rating": "★2.0", "starred": false, "repro": "—", "summary_html": "<h1>Meta-CTA Trading Strategies based on the Kelly Criterion</h1>\n<p>&gt; Zotero Key: <code>TJJQV3D5</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Bernhard K. Meister</li>\n<li><strong>年份</strong>: 2016</li>\n<li><strong>出处</strong>: arXiv (2016-10-31)</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.1610.10029</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/1610.10029</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/J5CAVCC8/Meister - 2016 - Meta-CTA Trading Strategies based on the Kelly Criterion.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：CTA 行业规模从 1980 年 3 亿增长到 2014 年超 3000 亿美元，大量资金按相似趋势跟随逻辑操作，其集体再平衡行为对底层资产价格的反馈影响缺乏系统分析。</li>\n<li><strong>方法</strong>：构建&quot;Kelly 优化者 + 价格冲击幂律&quot;玩具模型，推导三相位相图（杠杆比 $\\Lambda$ vs 冲击指数 $\\gamma$），分析不同参数区间的价格行为模式。</li>\n<li><strong>结论</strong>：相位 III（$\\Lambda&gt;1$、$\\gamma$ 大）中价格爆炸性增长不稳定，大规模 CTA 机械性再平衡可引发价格不稳定；为设计反制 CTA 行为的 Meta-CTA 策略提供理论基础。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>CTA 行业规模从1980年的3亿美元增长到2014年的超过3000亿美元，大量资金按相似的趋势跟随逻辑操作，其集体再平衡行为可能对底层资产价格产生反馈影响。现有研究主要关注 CTA 策略本身的回报特征，缺乏对 CTA 集体行为引发的价格动态及其可利用性的系统分析。本文构建玩具模型探索 Kelly CTA 投资者对价格过程的影响，并推导相位图揭示不同参数区间的价格行为模式。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 无真实数据；纯理论/仿真模型，以1只风险资产 + 1只无风险资产为分析对象</li>\n<li><strong>频率</strong>: 离散时间步（模拟日频再平衡）</li>\n<li><strong>样本区间</strong>: 无</li>\n<li><strong>数据来源</strong>: 理论推导</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n    A[Kelly 优化者假设\\n固定杠杆比 Lambda = lambda/sigma] --&gt; B[最优持仓规则\\ntheta_t = Lambda * V_t / S_t]\n    C[价格冲击幂律\\nDeltaS^gamma ~ DeltaN] --&gt; D[仓位变动驱动价格变化\\nDeltaS_t ~ DeltaN_t^1/gamma]\n    B --&gt; E[每期再平衡: 仓位变动量]\n    E --&gt; D\n    D --&gt; F[价格变动反馈\\n影响下一期 Kelly 权重]\n    F --&gt; A\n    F --&gt; G[相位图分析\\nx轴: 杠杆比 Lambda\\ny轴: 冲击指数 gamma]\n    G --&gt; H1[相位 I: gamma小 Lambda小\\n价格振荡趋零 稳定]\n    G --&gt; H2[相位 II: Lambda&gt;1 gamma中\\n价格单调趋零 稳定]\n    G --&gt; H3[相位 III: Lambda&gt;1 gamma大\\n价格爆炸性增长 不稳定]\n    H3 --&gt; I[Meta-CTA 机会\\n在不稳定区做反转\\n在相位 II 卖 gamma]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>Kelly 准则推导</strong>: 风险资产服从几何布朗运动 $dS_t/S_t=\\mu_t dt+\\sigma_t dW_t$，Kelly 投资者最大化对数期望增长，最优杠杆比为：</p>\n<p>$$\\Lambda_t^* = \\frac{\\lambda_t}{\\sigma_t} = \\theta_t^*\\frac{S_t}{V_t}$$</p>\n<p>其中 $\\lambda_t=(\\mu_t-r_t)/\\sigma_t$ 为风险市场价格，$V_t$ 为组合价值。模型中假设 $\\lambda$、$\\sigma$、$r$ 为缓慢变化的准常数，因此杠杆比 $\\Lambda$ 视为固定。</p>\n<p>2. <strong>再平衡导致仓位变动</strong>: 每期价格变动 $dS_t$ 后 Kelly 投资者调整持仓，仓位变化量满足：</p>\n<p>$$\\Delta\\theta_t \\sim \\left[(\\Lambda-1)\\frac{dS_t}{S_t}\\right] \\quad (*)$$</p>\n<p>当 $\\Lambda&gt;1$ 时（股票多头），价格上涨引发追加买入（正反馈）。</p>\n<p>3. <strong>价格冲击幂律</strong>: 仓位变化 $\\Delta N$ 对价格的冲击满足经验幂律：</p>\n<p>$$(\\Delta S)^\\gamma \\sim \\Delta N, \\quad \\gamma\\approx 0.5$$</p>\n<p>其中 $\\gamma$ 为市场冲击系数。结合再平衡规则 $(*)$ 得到价格动态的离散迭代方程。</p>\n<p>4. <strong>相位图（图 2）</strong>: 以杠杆比 $\\Lambda$（$x$ 轴）和市场冲击系数 $\\gamma$（$y$ 轴）为参数，价格动态分三相：</p>\n<p>   - <strong>相位 I</strong>（$\\Lambda&lt;1$ 或 $\\gamma&lt;1/2$）：价格振荡衰减趋零，稳定不动点</p>\n<p>   - <strong>相位 II</strong>（$\\Lambda&gt;1$，$\\gamma$ 中等）：价格单调递减趋零，稳定吸引子</p>\n<p>   - <strong>相位 III</strong>（$\\Lambda&gt;1$，$\\gamma$ 较大）：价格爆炸性增长，系统不稳定，最终崩溃</p>\n<p>5. <strong>Meta-CTA 策略框架</strong>:</p>\n<p>   - <strong>相位 III 下的对手方策略</strong>：识别市场处于相位 III 时（大规模 CTA 资金+强价格冲击），预期必有均值回归，可提前建反向仓位或用期权做多波动率</p>\n<p>   - <strong>相位 II 下的 Gamma 卖出</strong>：相位 II 趋向均值，波动率下降，可卖出 Gamma</p>\n<p>   - <strong>相位 I</strong>：方向性机会减少，不利于趋势跟随</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>三相结构是模型的核心结论：CTA 规模（决定 $\\Lambda$）和市场流动性（决定 $\\gamma$）共同决定价格动态的定性特征</li>\n<li>当 $\\Lambda&gt;1$（CTA 高杠杆）且 $\\gamma&gt;1/2$（强冲击）时，传统 CTA 策略自身会制造不稳定并最终崩溃，为逆势策略提供可预测的获利窗口</li>\n<li>实际市场中 $\\gamma\\approx 0.5$（平方根冲击律），处于相位边界附近，意味着 CTA 规模扩大时系统更容易落入相位 III</li>\n<li>模型完全确定性（无随机噪声），说明单靠机制性的 Kelly 再平衡 + 价格冲击即可产生复杂的价格行为</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>将 Kelly 准则与价格冲击幂律耦合为确定性动力系统，推导出解析相位图，为 CTA 行为对市场的系统性影响提供理论框架</li>\n<li>提出 Meta-CTA 概念：不跟随趋势，而是利用 CTA 集体行为的可预测性设计对手方策略</li>\n<li>建立 Kelly 最优组合与欧式看涨期权复制组合的等价关系（附录）</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>纯玩具模型：单风险资产、无噪声、CTA 行为完全同质化——真实市场中 CTA 策略高度异质，集体效应弱得多</li>\n<li>假设 $\\lambda$、$\\sigma$ 准常数与真实市场参数动态变化不符</li>\n<li>相位图定性分析，无具体的信号时机、仓位规模或进出场规则</li>\n<li>2016年论文，未经后续研究引用验证（引用量有限）</li>\n<li>无实证数据支撑，结论停留在&quot;理论启示&quot;层面</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 纯理论，无需数据；数值仿真可完全自行构造</li>\n<li><strong>方法清晰度</strong>: 公式推导清晰，相位图边界可数值计算</li>\n<li><strong>计算成本</strong>: 极低，简单离散迭代方程</li>\n<li><strong>综合评分</strong>: ★2.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>理论玩具模型，复现价值有限。若感兴趣可实现式 (*)、(**)的离散迭代，用 Python 绘制不同 $(\\Lambda,\\gamma)$ 参数下的价格路径，复现图 2 相位图。实用意义主要在概念层面：理解 CTA 规模效应与流动性冲击的相互作用，用于构建对 CTA 行为的反制思路，而非直接复现可交易策略。</p>"}, {"key": "4XYHNIU3", "title": "Dissecting Investment Strategies in the Cross Section and Time Series", "year": "2015", "authors": "Jamil Baz, Nicolas Granger, Campbell R. Harvey…", "tags": ["carry", "commodities", "cross-section", "equity", "fixed income", "foreign exchange", "FX", "interest rates", "momentum", "multiple testing", "Sharpe ratio", "skew", "time-series", "trading strategies", "Value"], "venue": "", "abstract": "We contrast the time-series and cross-sectional performance of three popular investment strategies: carry, momentum and value. While considerable research has examined the performance of these strategies in either a directional or cross-asset settings, we offer some insights on the market conditions that favor the application of a particular setting.", "url": "https://papers.ssrn.com/abstract=2695101", "date_added": "2026-05-24", "summarized": true, "rating": "★3", "starred": false, "repro": "—", "summary_html": "<h1>Dissecting Investment Strategies in the Cross Section and Time Series</h1>\n<p>&gt; Zotero Key: <code>4XYHNIU3</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>:Jamil Baz, Nick Granger, Campbell R. Harvey, Nicolas Le Roux, Sandy Rattray</li>\n<li><strong>年份</strong>:2015</li>\n<li><strong>出处</strong>:SSRN (Man Group / Man AHL)</li>\n<li><strong>DOI</strong>:无</li>\n<li><strong>链接</strong>:https://papers.ssrn.com/abstract=2695101</li>\n<li><strong>本地 PDF</strong>:<code>~/Developer/Zotero/storage/GIFUSG6D/Baz 等 - 2015 - Dissecting Investment Strategies in the Cross Section and Time Series.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：carry、momentum、value 三大策略在时间序列（方向性）vs 截面（多空）两种实现方式下表现差异的原因尚无统一框架解释。</li>\n<li><strong>方法</strong>：在 80+ 期货/掉期/外汇品种上，统一构造 carry/momentum/value 信号，分别构建截面和时序组合进行系统对比。</li>\n<li><strong>结论</strong>：momentum 适合时序（Sharpe 0.96 vs 截面 0.42），value 适合截面（0.75 vs 0.28），carry 两者皆可（1.27 vs 1.25）；截面+时序联合组合 Sharpe 达 1.61。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<ul>\n<li>传统文献分别研究 carry、momentum、value,但很少有在统一框架下系统比较时间序列(方向性) vs 截面(多空)两种实现方式的优劣</li>\n<li>实际投资中:股票 momentum 通常做截面,期货 momentum 通常做时序。为什么?什么条件决定哪种实现更好?</li>\n<li>需要理解&quot;何时用哪个实现&quot;的先验框架</li>\n</ul>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>:26 个股指期货、14 个利率掉期、31 个外汇货币对、16 个商品期货(共约 80+)</li>\n<li><strong>频率</strong>:日频调仓(少数例外如 FX carry/value 按 1/252 逐步轮动)</li>\n<li><strong>样本区间</strong>:1990 年 1 月至 2015 年 4 月</li>\n<li><strong>数据来源</strong>:Bloomberg、Global Financial Data、Man-AHL 自建数据库</li>\n<li><strong>注意</strong>:未扣除交易成本(使用中间价)</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>信号构造</strong>:</p>\n<p>1. <strong>Carry</strong>(持有收益):</p>\n<p>   - FX:3 个月远期升贴水率</p>\n<p>   - Equity:近远月期货价差经季节性调整</p>\n<p>   - Commodities:近月与 1 年后远月期货价差</p>\n<p>   - Swap:10Y 互换利率的 carry+rolldown</p>\n<p>2. <strong>Momentum</strong>(CTA 风格 MACD 信号):</p>\n<p>   - 三组 EWMA 交叉:(8,24)、(16,48)、(32,96)</p>\n<p>   - 波动率归一化 + 响应函数 phi(x)=x*exp(-x^2/4)/0.89</p>\n<p>   - 等权组合三个时间尺度的信号</p>\n<p>3. <strong>Value</strong>(估值):</p>\n<p>   - FX:购买力平价(PPP)偏离度</p>\n<p>   - Equity:股息率</p>\n<p>   - Commodities:经 CPI 调整的实际价格 vs 历史均值</p>\n<p>   - Swap:10Y 利率 vs GDP 增速</p>\n<p><strong>组合构建</strong>:</p>\n<ul>\n<li><strong>截面组合</strong>:每个&quot;品种×风格&quot;组合内,取信号最极端的 6 个品种(3 多 3 空),等权</li>\n<li><strong>时序组合</strong>:同一品种所有资产等权,信号方向决定多空</li>\n<li>组合层面做年化 15% 波动率缩放</li>\n</ul>\n<h2>核心结论与关键结果</h2>\n<p><strong>截面组合(各品种内信号多空)</strong>:</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>风格</th><th>FX</th><th>Equity</th><th>Commo</th><th>IR</th><th>全资产</th></tr>\n<tr><td>Value</td><td>0.42</td><td>0.39</td><td>0.07</td><td>0.56</td><td><strong>0.75</strong></td></tr>\n<tr><td>Carry</td><td>0.67</td><td>0.33</td><td>0.77</td><td>0.76</td><td><strong>1.27</strong></td></tr>\n<tr><td>Momentum</td><td>0.74</td><td>0.01</td><td>0.45</td><td>-0.31</td><td><strong>0.42</strong></td></tr>\n<tr><td>V+C+M</td><td>1.07</td><td>0.42</td><td>0.83</td><td>0.54</td><td><strong>1.40</strong></td></tr>\n</table></div>\n<p><strong>时序组合(方向性)</strong>:</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>风格</th><th>FX</th><th>Equity</th><th>Commo</th><th>IR</th><th>全资产</th></tr>\n<tr><td>Value</td><td>0.27</td><td>-0.13</td><td>0.22</td><td>0.48</td><td><strong>0.28</strong></td></tr>\n<tr><td>Carry</td><td>0.55</td><td>0.23</td><td>0.64</td><td>0.83</td><td><strong>1.25</strong></td></tr>\n<tr><td>Momentum</td><td>0.72</td><td>0.41</td><td>0.45</td><td>0.77</td><td><strong>0.96</strong></td></tr>\n<tr><td>V+C+M</td><td>1.14</td><td>0.31</td><td>0.79</td><td>1.04</td><td><strong>1.37</strong></td></tr>\n</table></div>\n<p><strong>核心对比</strong>:</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>策略</th><th>截面 Sharpe</th><th>时序 Sharpe</th><th>更适合</th></tr>\n<tr><td>Value</td><td>0.75</td><td>0.28</td><td><strong>截面</strong>(多空对冲)</td></tr>\n<tr><td>Carry</td><td>1.27</td><td>1.25</td><td><strong>两者皆宜</strong></td></tr>\n<tr><td>Momentum</td><td>0.42</td><td>0.96</td><td><strong>时序</strong>(方向性)</td></tr>\n<tr><td>三者综合</td><td>1.40</td><td>1.37</td><td>两者皆宜</td></tr>\n<tr><td><strong>综合 CS+TS</strong></td><td><strong>1.61</strong></td><td>-</td><td>分散化最佳</td></tr>\n</table></div>\n<p><strong>截面+时序联合组合</strong>:Sharpe 1.61,3 年滚动 Sharpe 在 0.5-2.7 之间波动,从未为负。</p>\n<p><strong>最大回撤/波动比</strong>:</p>\n<ul>\n<li>截面:Value -1.8,Carry -3.1,Momentum -2.6</li>\n<li>时序:Value -4.4,Carry -2.5,Momentum -2.4</li>\n</ul>\n<p><strong>偏度</strong>:截面/时序 Momentum 均正偏,Carry 负偏(FX carry 有明显的危机风险)</p>\n<p><strong>Cross Section vs Time Series 差异的三种解释</strong>:</p>\n<p>1. Momentum 对全球因子的变化更敏感(价格本身包含新信息),时序 momentum 抓住了全球因子趋势,而价值依赖均值回复在趋势市吃亏</p>\n<p>2. 全球因子(如央行宽松)长期趋势性强,压制了均值回复的价值策略</p>\n<p>3. 资产间高相关性+信号间高相关性:截面 momentum 对冲掉了大量信息(因为信号高度相关),而价值信号间相关性低,截面效果更好</p>\n<h2>创新点</h2>\n<p>1. <strong>统一框架</strong>:首次在相同数据和框架下全面比较 carry/momentum/value 的时序和截面实现</p>\n<p>2. <strong>跨资产/跨地区的全面性</strong>:覆盖 4 大类资产,80+品种</p>\n<p>3. <strong>实用性见解</strong>:给出实操指南——momentum 做时序、value 做截面、carry 两者皆可</p>\n<p>4. <strong>解释性框架</strong>:提出信号相关性 vs 资产相关性的对比分析来解释表现差异</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>未扣交易成本</strong>:论文明确说明使用中间价,高频调仓(日频)的换手率会产生大量成本</li>\n<li><strong>选择偏误</strong>:carry/momentum/value 是被广泛验证有效的风格,选它们本身就有 look-ahead 偏误</li>\n<li><strong>生存偏误</strong>:1990 年还存在的品种筛选到 2015 年,入选的多是趋势向上的品种</li>\n<li><strong>信号构造武断性</strong>:参数(如 MACD 窗口 8/16/32、选 6 个品种)未详细论证</li>\n<li><strong>2015 年的论文</strong>:分析截至 2015 年,缺少近 10 年数据验证</li>\n<li><strong>截面组合简单</strong>:等权+固定数量(6 个品种),未用波动率缩放或风险平价</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>:天软可获取国内期货数据,全球 80+品种有难度</li>\n<li><strong>方法清晰度</strong>:信号公式清晰可重复,组合构建逻辑简单</li>\n<li><strong>计算成本</strong>:极低,无复杂计算需求</li>\n<li><strong>综合评分</strong>:★★★☆☆(经典但较旧,核心见解已内化到行业实践)</li>\n</ul>\n<h2>复现备注</h2>\n<p>该论文核心结论已经是行业共识,且 2015 年较旧:</p>\n<ul>\n<li><strong>不复现完整的全球版本</strong></li>\n<li>核心见解可用于因子选择和信号方向决策</li>\n<li>MACD 连续信号(公式 32-33)可作为 CTA 趋势的基准实现</li>\n<li>若需详细信号公式参考,可从论文 3.2 节直接提取代码</li>\n</ul>"}, {"key": "LBK4MJTW", "title": "Absolute Momentum: A Simple Rule-Based Strategy and Universal Trend-Following Overlay", "year": "2013", "authors": "Gary Antonacci", "tags": ["momentum", "momentum investing", "tactical asset allocation", "technical analysis", "trading rules"], "venue": "", "abstract": "There is a considerable body of research on relative strength price momentum but much less on absolute momentum, also known as time series momentum.  In this paper, we explore the practical side of absolute momentum. We first explore its sole parameter - the formation, or look back, period. We then examine the reward, risk, and correlation characteristics of absolute momentum applied to stocks, bonds, and real assets. We finally apply absolute momentum to a 60/40 stock/bond portfolio and a simple risk parity portfolio. We show that absolute momentum can effectively identify regime change and add significant value as an easy-to-implement, rule-based approach with many potential uses as both a stand-alone program and trend-following overlay.", "url": "https://papers.ssrn.com/abstract=2244633", "date_added": "2026-05-24", "summarized": true, "rating": "★2", "starred": false, "repro": "—", "summary_html": "<h1>Absolute Momentum: A Simple Rule-Based Strategy and Universal Trend-Following Overlay</h1>\n<p>&gt; Zotero Key: <code>LBK4MJTW</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Antonacci, Gary</li>\n<li><strong>年份</strong>: 2013（2014 年 4 月修订版）</li>\n<li><strong>出处</strong>: Portfolio Management Consultants / SSRN Working Paper</li>\n<li><strong>DOI</strong>: —</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=2244633</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/294T9SIU/Antonacci - 2013 - Absolute Momentum...pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：相对强度动量（截面）研究丰富，但绝对动量（时序动量）在实际投资中的应用较少被系统探索——最优形成期是多少？作为叠加层效果如何？</li>\n<li><strong>方法</strong>：在 8 类资产（美股/国际股票/国债/信用/高收益/REITs/商品/黄金）上测试 2—18 个月形成期的绝对动量信号，超额收益为正则持有资产，否则切换至国库券，1974—2012 年。</li>\n<li><strong>结论</strong>：12 个月形成期最优，一致性地将 Sharpe 中位数从 0.38 提升至 0.53，最大回撤从 -53% 压缩至 -21%，约 79% 月份正收益。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>相对强度动量（截面）研究丰富，但&quot;绝对动量&quot;（时序动量，资产相对自身历史的表现）在实际投资中的应用较少被系统探索。本文聚焦两个问题：最优形成期是多少月？绝对动量作为叠加层应用于多资产组合效果如何？</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: MSCI US、MSCI EAFE、美国国债（TBOND）、信用债（CREDIT）、高收益债（HI YLD）、REITs、GSCI 大宗商品指数、黄金（伦敦 PM 定盘）</li>\n<li><strong>频率</strong>: 月度</li>\n<li><strong>样本区间</strong>: 1974 年 1 月–2012 年 12 月（38 年）；高收益债自 1984 年起</li>\n<li><strong>数据来源</strong>: MSCI、Barclays/Lehman 债券指数、FTSE NAREIT、S&amp;P GSCI、伦敦金交所</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>绝对动量信号</strong>:</p>\n<ul>\n<li>若资产过去 $k$ 个月超额收益（相对 90 日美国国库券）&gt; 0，则持有资产（多头）。</li>\n<li>若超额收益 ≤ 0，则切换至 90 日国库券（不做空）。</li>\n<li>每月月底重新评估信号；每次进出 T-Bill 收取 20 bps 交易成本。</li>\n</ul>\n<p><strong>形成期选择</strong>:</p>\n<ul>\n<li>测试 2 至 18 个月，12 个月在大多数资产中 Sharpe 最高，与截面动量文献一致。</li>\n</ul>\n<p><strong>策略规则</strong>:</p>\n<p>$$\\text{Position}_t = \\begin{cases} \\text{持有资产} &amp; \\text{若 } \\sum_{m=1}^{12}r_{t-m} &gt; r_{f} \\\\ \\text{持有国库券} &amp; \\text{否则} \\end{cases}$$</p>\n<h2>核心结论与关键结果</h2>\n<p><strong>表 2 主要结果（1974–2012）</strong>:</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>资产</th><th>有动量 SR</th><th>无动量 SR</th><th>有动量 MaxDD</th><th>无动量 MaxDD</th><th>盈利月份%</th></tr>\n<tr><td>MSCI US</td><td>0.55</td><td>0.37</td><td>-22.9%</td><td>-50.6%</td><td>75%</td></tr>\n<tr><td>EAFE</td><td>0.39</td><td>0.33</td><td>-25.1%</td><td>-56.4%</td><td>78%</td></tr>\n<tr><td>T-Bond</td><td>0.52</td><td>0.39</td><td>-12.9%</td><td>-20.1%</td><td>77%</td></tr>\n<tr><td>GSCI</td><td>0.17</td><td>-0.02</td><td>-48.9%</td><td>-61.0%</td><td>81%</td></tr>\n<tr><td>Gold</td><td>0.46</td><td>0.19</td><td>-24.8%</td><td>-61.8%</td><td>81%</td></tr>\n<tr><td>中位数</td><td>0.53</td><td>0.38</td><td>-21.4%</td><td>-53.5%</td><td>79%</td></tr>\n</table></div>\n<ul>\n<li>绝对动量后，<strong>每类资产</strong> Sharpe 提升、MaxDD 降低、盈利月份比例升高。</li>\n<li>60/40 股债组合：有动量 SR = 0.72 / MaxDD = -13.5%，vs 无动量 SR = 0.47 / MaxDD = -29.3%。</li>\n<li>绝对动量叠加后，资产间相关性基本不变（平均相关 0.22 → 0.21），无分散化损失。</li>\n<li>GSCI 是受益最显著的资产：SR 从 -0.02 → 0.17，印证了动量信号对商品尤为重要。</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>系统梳理绝对动量的实践维度：形成期选择、资产类别普适性、多资产组合叠加。</li>\n<li>提出&quot;绝对动量作为通用趋势跟踪叠加层&quot;的框架，强调其在长期投资者中的优势（相对动量可能导致某类资产被完全排除）。</li>\n<li>量化了12 个月形成期的稳健性（跨资产、跨十年子样本均成立）。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>数据样本仅涵盖少数大类资产，单一商品期货的适用性未验证。</li>\n<li>信号仅 ±1 二元切换（持仓/持现），不考虑信号强度（连续仓位）。</li>\n<li>样本期（1974–2012）利率持续下行，债券多头大幅受益，结构性顺风未来未必存在。</li>\n<li>无双向交易成本（仅扣除进出 T-Bill 时的费用），对期货品种的换仓成本估算不充分。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 大类资产指数均可通过 Wind/Bloomberg 获取；不含中国期货数据。</li>\n<li><strong>方法清晰度</strong>: 规则极简，5 行代码可实现。</li>\n<li><strong>计算成本</strong>: 极低。</li>\n<li><strong>综合评分</strong>: ★2.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>不建议复现：本文仅做大类资产指数回测，对品种级商品期货策略的改进增量极小。</p>"}, {"key": "BSCCT6A8", "title": "Value and Momentum Everywhere", "year": "2012", "authors": "Clifford S. Asness, Tobias J. Moskowitz, Lasse Heje Pedersen", "tags": ["Lasse Heje Pedersen", "SSRN", "Tobias J. Moskowitz", "Clifford S. Asness", "Value and Momentum Everywhere"], "venue": "", "abstract": "We study the returns to value and momentum strategies jointly across eight diverse markets and asset classes. Finding consistent value and momentum premia in every asset class, we further find strong common factor structure among their returns. Value and momentum are more positively correlated across asset classes than passive exposures to the asset classes themselves. However, value and momentum are negatively correlated both within and across asset classes. Our results indicate the presence of common global risks that we characterize with a three factor model. Global funding liquidity risk is a partial source of these patterns, which are identifiable only when examining value and momentum simultaneously across markets. Our findings present a challenge to existing behavioral, institutional, and rational asset pricing theories that largely focus on U.S. equities.", "url": "https://papers.ssrn.com/abstract=2174501", "date_added": "2026-07-29", "summarized": true, "rating": "★4.5", "starred": false, "repro": "待复现", "summary_html": "<h1>Value and Momentum Everywhere</h1>\n<p>&gt; Zotero Key: <code>BSCCT6A8</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>:Clifford S. Asness, Tobias J. Moskowitz, Lasse Heje Pedersen</li>\n<li><strong>年份</strong>:2012</li>\n<li><strong>出处</strong>:The Journal of Finance, 68(3), 929-985</li>\n<li><strong>DOI</strong>:10.2139/ssrn.2174501</li>\n<li><strong>链接</strong>:https://papers.ssrn.com/abstract=2174501</li>\n<li><strong>本地 PDF</strong>:<code>~/Developer/Zotero/storage/7DXK47IT/Asness 等 - 2012 - Value and Momentum Everywhere.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：价值和动量效应是否存在于美股以外的市场和资产类别？它们之间有何共同因子结构？全球流动性风险是否是其驱动力？</li>\n<li><strong>方法</strong>：在 8 类资产（美股、英股、欧股、日股、国家股指期货、国债、货币、商品期货）中同时构建价值和动量组合，检验跨资产类别的收益相关性和因子结构。</li>\n<li><strong>结论</strong>：价值和动量在所有资产类别中均存在显著溢价；两者在同类资产内和跨资产类别间均呈负相关；全球资金流动性风险可部分解释动量溢价，但无法完全解释价值溢价；三因子模型（市场+全球价值+全球动量）可有效解释跨资产类别收益。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>价值和动量是金融市场最经典的两大异象，但现有文献主要聚焦美股，且通常分别研究。本文首次在 8 类资产中同时检验两种效应，旨在回答：(1) 这些效应是否具有全球普遍性？(2) 跨资产类别间是否存在共同因子结构？(3) 全球流动性风险是否驱动这些模式？</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>：美股、英股、欧股、日股个股（各市场市值前 20%），18 国股指期货，10 国国债，10 种货币远期，商品期货</li>\n<li><strong>频率</strong>：月度</li>\n<li><strong>样本区间</strong>：1972年1月 - 2011年7月（不同资产起始时间不同）</li>\n<li><strong>数据来源</strong>：CRSP/Compustat（美股）、Datastream（其他市场）、Bloomberg（债券）、MSCI（指数）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[8类资产价格/基本面数据] --&gt; B[价值组合构建&lt;br/&gt;账面市值比排序]\n  A --&gt; C[动量组合构建&lt;br/&gt;过去12个月收益排序]\n  B --&gt; D[全球价值因子&lt;br/&gt;各类资产价值组合等权平均]\n  C --&gt; E[全球动量因子&lt;br/&gt;各类资产动量组合等权平均]\n  D --&gt; F[三因子回归分析&lt;br/&gt;市场+全球价值+全球动量]\n  E --&gt; F\n  F --&gt; G[流动性风险检验&lt;br/&gt;资金流动性/市场流动性]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>价值组合构建</strong>：对每类资产按账面市值比排序，买入低估值组、卖出高估值组，形成价值因子。</p>\n<p>2. <strong>动量组合构建</strong>：对每类资产按过去 12 个月收益排序（跳过最近 1 个月），买入赢家、卖出输家，形成动量因子。</p>\n<p>3. <strong>全球因子构造</strong>：将各类资产的价值/动量因子等权平均，得到全球价值因子（Val）和全球动量因子（Mom）。</p>\n<p>4. <strong>三因子模型</strong>：用全球市场组合（Mkt）、全球价值因子（Val）和全球动量因子（Mom）解释各类资产收益。</p>\n<p>5. <strong>流动性检验</strong>：引入 Pastor-Stambaugh 流动性因子和资金流动性因子，检验其对价值/动量收益的解释力。</p>\n<p>6. <strong>负相关性分析</strong>：检验价值与动量在同类资产内和跨资产类别间的相关性。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>价值和动量在所有 8 类资产中均显著存在（t 值普遍 &gt; 2）</li>\n<li>全球价值因子月均收益约 0.5-0.8%（t 值 4-6），全球动量因子约 0.6-1.2%（t 值 6-9）</li>\n<li>价值与动量在同类资产内相关系数约 -0.3 至 -0.5，跨资产类别间价值-价值/动量-动量正相关，价值-动量负相关</li>\n<li>三因子模型解释力：R² 约 50-70%，Fama-French 三因子 + 动量的四因子模型表现接近</li>\n<li>资金流动性风险对动量有正向暴露，对价值有负向暴露，但只能解释部分溢价</li>\n<li>价值+动量组合的夏普比率约 1.4，远高于单一策略</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次在 8 类资产中同时研究价值和动量的共同因子结构</li>\n<li>发现全球资金流动性风险是价值-动量负相关性的来源之一</li>\n<li>提出适用于全球多资产类别的三因子模型</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>仅使用月频数据，日频可能有不同结论</li>\n<li>价值/动量定义相对简单（账面市值比、过去 12 月收益），未考虑更复杂的定义</li>\n<li>流动性因子只能部分解释，价值溢价仍是一个谜</li>\n<li>实际交易中可能面临流动性冲击和交易成本</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>：中等，个股数据需 CRSP/Datastream 订阅，国债/货币/商品数据相对公开</li>\n<li><strong>方法清晰度</strong>：高，组合构建方法描述详细，可直接复现</li>\n<li><strong>计算成本</strong>：低，主要为组合构建和回归分析</li>\n<li><strong>综合评分</strong>:★4.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>本文是资产定价领域的经典论文，方法描述清晰，数据可得性较好。最小可行版本可使用公开的国家股指期货、国债、货币数据复现。对理解全球多资产类别的价值/动量效应有重要参考价值。建议优先复现。</p>"}, {"key": "EDSMU9S9", "title": "Time Series Momentum", "year": "2011", "authors": "Tobias J. Moskowitz, Yao Hua Ooi, Lasse Heje Pedersen", "tags": ["Time Series Momentum", "Lasse Heje Pedersen", "SSRN", "Tobias J. Moskowitz", "Yao Hua Ooi"], "venue": "", "abstract": "We document significant “time series momentum” in equity index, currency, commodity, and bond futures for each of the 58 liquid instruments we consider. We find persistence in returns for 1 to 12 months that partially reverses over longer horizons, consistent with sentiment theories of initial under-reaction and delayed over-reaction. A diversified portfolio of time series momentum strategies across all asset classes delivers substantial abnormal returns with little exposure to standard asset pricing factors and performs best during extreme markets. Examining the trading activities of speculators and hedgers, we find that speculators profit from time series momentum at the expense of hedgers.", "url": "https://papers.ssrn.com/abstract=2089463", "date_added": "2026-05-24", "summarized": true, "rating": "★3", "starred": false, "repro": "复现中", "summary_html": "<h1>Time Series Momentum</h1>\n<p>&gt; Zotero Key: <code>EDSMU9S9</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Moskowitz, Tobias J.; Ooi, Yao Hua; Pedersen, Lasse H.</li>\n<li><strong>年份</strong>: 2011（最终版 2012 年发表于 Journal of Financial Economics）</li>\n<li><strong>出处</strong>: *Journal of Financial Economics*, Vol. 104, No. 2, pp. 228–250</li>\n<li><strong>DOI</strong>: 10.1016/j.jfineco.2011.11.003</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=2089463</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/XADAYVEW/Moskowitz 等 - 2011 - Time Series Momentum.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：截面动量已被广泛研究，但&quot;时序动量&quot;（资产自身过去收益预测未来收益）是否作为独立效应存在于多资产期货市场中？</li>\n<li><strong>方法</strong>：在 58 个期货合约（股票/债券/商品/外汇）上，用过去 12 个月收益方向做多/空，波动率归一化至 40% 目标波动率，构建多元化 TSMOM 组合。</li>\n<li><strong>结论</strong>：TSMOM 组合 Sharpe &gt; 1（约为市场组合 2.5 倍），在 2008 年金融危机等极端市场中表现最优；信号与投机者/对冲者净头寸显著相关。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>截面动量（某资产相对同伴的历史强弱预测未来）已被广泛研究，但&quot;时序动量&quot;（资产的自身过去收益预测其未来收益）是否作为独立效应存在？本文首次系统地为时序动量命名并在多资产期货市场实证记录，同时探讨其与截面动量的关系及机制（投机者 vs 对冲者头寸）。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 58 只流动性最强的期货合约：24 个商品期货（S&amp;P GSCI 成分）、12 个货币对（9 种货币）、9 个发达市场股票指数期货、13 个国债期货</li>\n<li><strong>频率</strong>: 日度（波动率计算）；月度（回测）</li>\n<li><strong>样本区间</strong>: 1985 年 1 月–2009 年 12 月（主要分析）；部分合约可追溯至 1965 年</li>\n<li><strong>数据来源</strong>: Datastream、Bloomberg、各交易所；CFTC 持仓数据（投机者/对冲者分类）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>信号定义</strong>（12-1 月时序动量，TSMOM）:</p>\n<p>$$r_{t,t+1}^{\\text{TSMOM},s} = \\text{sign}(r_{t-12,t}^s) \\cdot \\frac{40\\%}{\\sigma_t^s} \\cdot r_{t,t+1}^s$$</p>\n<p>其中正号表示&quot;过去 12 个月超额收益为正 → 做多&quot;，负号表示&quot;做空&quot;。</p>\n<p><strong>波动率估计</strong>（指数加权，60 日质心）:</p>\n<p>$$\\sigma_t^2 = 261 \\cdot \\sum_{i=0}^{\\infty}(1-\\delta)\\delta^i\\left(r_{t-1-i} - \\bar{r}_t\\right)^2, \\quad \\frac{\\delta}{1-\\delta} = 60$$</p>\n<p>这相当于简单 GARCH 模型，使用 $t-1$ 时刻估计（避免前视偏差）。</p>\n<p><strong>多元化 TSMOM 组合</strong>:</p>\n<p>$$r_{t,t+1}^{\\text{TSMOM}} = \\frac{1}{S_t}\\sum_{s=1}^{S_t} \\text{sign}(r_{t-12,t}^s) \\cdot \\frac{40\\%}{\\sigma_t^s} \\cdot r_{t,t+1}^s$$</p>\n<p>所有 $S_t$ 个可用合约等权平均，每只合约目标波动率 40%（便于跨品种比较）。</p>\n<p><strong>资产定价基准</strong>（用于 α 估算）:</p>\n<p>$$r_t^{\\text{TSMOM}} = \\alpha + \\beta_1 MKT_t + \\beta_2 BOND_t + \\beta_3 GSCI_t + s\\,SMB_t + h\\,HML_t + m\\,UMD_t + \\varepsilon_t$$</p>\n<p><strong>持仓分析</strong>（CFTC 数据）:</p>\n<p>$$\\text{Net Speculator Position} = \\frac{\\text{投机者多头} - \\text{投机者空头}}{\\text{总持仓量}}$$</p>\n<h2>核心结论与关键结果</h2>\n<p>1. <strong>普适性</strong>: 58 只合约中，<strong>全部</strong>均有正 TSMOM 收益，52 只在 5% 显著性水平统计显著。</p>\n<p>2. <strong>收益期限结构</strong>: 1–12 个月持续性（正自相关），12 个月后出现逆转（5 年内均值回归）。</p>\n<p>3. <strong>多元化 TSMOM 表现</strong>:</p>\n<p>   - Sharpe &gt; 1.0（年化），约为市场 Sharpe 的 2.5 倍。</p>\n<p>   - α ≈ 1.58%/月，t ≈ 5.0（Fama-French 五因子调整后）；α ≈ 1.09%/月，t = 5.40（全球跨资产动量因子控制后）。</p>\n<p>4. <strong>极端市场</strong>: TSMOM 在全球股市收益率最高和最低（各 10%）的月份表现最好——即危机 α 属性。</p>\n<p>5. <strong>机制</strong>: 投机者在趋势形成阶段增持，在逆转阶段减持，从对冲者处获利；VAR 证实了这一动态。</p>\n<p>6. <strong>收益来源</strong>: 现货价格变化（信息驱动）和展期收益（hedging pressure）均贡献 TSM，但只有现货部分长期逆转。</p>\n<p>7. <strong>与截面动量的关系</strong>: TSMOM 与 UMD 因子显著相关（正向），但 α 仍高度显著，两者有共同来源（自相关），也有独立成分。</p>\n<h2>创新点</h2>\n<ul>\n<li>首次正式定义和系统记录&quot;时序动量&quot;作为独立可交易效应（区别于截面动量）。</li>\n<li>在 58 个跨资产类别期货上同时验证，普适性远超已有单资产/单类资产研究。</li>\n<li>用 CFTC 持仓数据提供机制解释（投机者 vs 对冲者）。</li>\n<li>区分现货收益与展期收益对 TSM 的贡献。</li>\n<li>指数加权波动率归一化方案成为行业标准。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>样本以发达市场为主（中国商品期货未覆盖），2009 年后数据是否持续有效需外样本验证。</li>\n<li>12 个月形成期 + 1 个月持有是文献选择，参数敏感性可能被低估。</li>\n<li>波动率归一化后每只合约目标波动率 40%，在合约流动性差时可能不可实现。</li>\n<li>&quot;做空&quot;在大宗商品期货中因 backwardation/contango 的影响，实际收益可能与理论不符。</li>\n<li>论文的数据期（1985–2009）包含多个利率下行周期，债券期货可能有结构性顺风。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 国际期货数据需 Bloomberg/Datastream；中国商品期货可通过天软完整获取。</li>\n<li><strong>方法清晰度</strong>: 公式完整，指数加权波动率 + 信号 + 等权平均，可直接实现。</li>\n<li><strong>计算成本</strong>: 极低，日度波动率估计 + 月度信号。</li>\n<li><strong>综合评分</strong>: ★3.0（对本项目：这是基础文献，策略已复现，无需重复；但方法细节值得对照）</li>\n</ul>\n<h2>复现备注</h2>\n<p>策略为经典基础实现，可用于基准对齐：</p>\n<p>1. 验证波动率估计是否使用 $t-1$ 时刻（避免前视偏差）。</p>\n<p>2. 对照本文 Figure 2 中的 Sharpe 分布，验证商品期货宇宙的 TSM Sharpe 分布是否合理。</p>\n<p>3. 若探索持仓机制，可考虑使用交易所持仓分布数据作为&quot;投机者信号&quot;的替代。</p>"}, {"key": "NPA46UTG", "title": "Which Trend is Your Friend?", "year": "", "authors": "Ari Levine, Lasse Heje Pedersen", "tags": [], "venue": "", "abstract": "Managed-futures funds and CTAs trade predominantly on trends. There are several ways of identifying trends, either using heuristics or statistical measures often called “filters.” Two important statistical measures of price trends are time series momentum and moving average crossovers. We show both empirically and theoretically that these trend indicators are closely connected. In fact, they are equivalent representations in their most general forms, and they also capture many other types of filters such as the HP filter, the Kalman filter, and all other linear filters. Further, we show how these filters can be represented through “trend signature plots” showing their dependence on past prices and returns by horizon. Our results unify and broaden a range of trend-following strategies and we discuss the implications for investors.", "url": "", "date_added": "2026-05-27", "summarized": true, "rating": "★3.5", "starred": false, "repro": "—", "summary_html": "<h1>Which Trend is Your Friend?</h1>\n<p>&gt; Zotero Key: <code>NPA46UTG</code> ｜ 摘要状态: ✅ ｜ 复现优先级: —</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Ari Levine, Lasse Heje Pedersen</li>\n<li><strong>年份</strong>: 2016</li>\n<li><strong>出处</strong>: Financial Analysts Journal, Vol. 72, No. 3</li>\n<li><strong>DOI</strong>: —</li>\n<li><strong>链接</strong>: —</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/UJN7W5HJ/Levine and Pedersen - Which Trend is Your Friend.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：CTA 和趋势跟随基金使用多种趋势信号（时序动量、移动平均交叉等），从业者对&quot;哪种方法更好&quot;争论不休，缺少统一语言描述、可视化和比较不同趋势过滤器。</li>\n<li><strong>方法</strong>：通过线性滤波器统一表示证明时序动量（TSMOM）与移动平均交叉（MACROSS）在最一般形式下等价，引入&quot;趋势特征图&quot;（trend signature plots）可视化不同过滤器的有效视野与敏感度分布。</li>\n<li><strong>结论</strong>：所有线性趋势过滤器本质上等价——它们只是对历史价格/收益的不同加权方案；方法选择不如时间尺度选择重要。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>CTA 和趋势跟随基金使用多种趋势信号，从业者与学术界对&quot;哪种方法更好&quot;争论不休：时序动量（Moskowitz, Ooi &amp; Pedersen 2012）与移动平均交叉（技术分析传统）看似不同，两者是否可比较、可统一？研究者和实践者缺少一套统一语言来描述、可视化和比较不同趋势过滤器的经济直觉，导致选型往往依赖经验或习惯。本文问：（1）TSMOM 与 MACROSS 是否等价？（2）如何用统一框架描述所有线性趋势过滤器？（3）在相同框架下不同过滤器的差异如何可视化？</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 理论文章，无独立实证数据集；以黄金期货为示例说明趋势特征图</li>\n<li><strong>频率</strong>: —</li>\n<li><strong>样本区间</strong>: —</li>\n<li><strong>数据来源</strong>: 理论推导为主；示例使用历史期货价格，具体来源未披露</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>整体框架</strong>：通过线性滤波器统一表示 → 证明 TSMOM/MACROSS 等价 → 引入趋势特征图可视化 → 讨论实践含义。</p>\n<p>---</p>\n<p><strong>步骤 1：统一表示——线性趋势信号的一般形式</strong></p>\n<p>任意线性趋势信号均可用加权过去价格或过去收益的线性组合表示：</p>\n<p><strong>以收益权重形式（TSMOM 视角）</strong>：</p>\n<p>$$\\text{TSMOM}_t^c = \\sum_{s=1}^{\\infty} c_s \\cdot (P_{t-s+1} - P_{t-s}) = \\sum_{s=1}^{\\infty} c_s \\cdot R_{t-s+1}$$</p>\n<p>权重 $c_s$ 刻画过去第 $s$ 期收益在信号中的贡献大小；正权重表示跟随趋势，负权重表示均值回归。</p>\n<p><strong>以价格权重形式（MACROSS 视角）</strong>：</p>\n<p>$$\\text{MACROSS}_t = \\text{MA}_t^{\\text{fast}} - \\text{MA}_t^{\\text{slow}} = \\sum_{s=1}^{\\infty} (w_s^{\\text{fast}} - w_s^{\\text{slow}}) \\cdot P_{t-s+1}$$</p>\n<p>快均线减慢均线等价于对历史价格赋差分权重。</p>\n<p>---</p>\n<p><strong>步骤 2：证明等价性</strong></p>\n<p><strong>MACROSS → TSMOM</strong>（任意 MACROSS 都是 TSMOM）：</p>\n<p>设差分权重 $d_s = w_s^{\\text{fast}} - w_s^{\\text{slow}}$，则对应的收益权重为：</p>\n<p>$$c_s = \\sum_{j=1}^{s} d_j$$</p>\n<p>即收益权重是价格差分权重的前缀和（cumulative sum）。</p>\n<p><strong>TSMOM → MACROSS</strong>（任意 TSMOM 都是 MACROSS）：</p>\n<p>$m$ 期时序动量信号 $P_t - P_{t-m}$ 等价于快均线 = 当期价格（权重全在 $s=1$）、慢均线 = $m$ 期前价格（权重全在 $s=m+1$）的 MACROSS。对一般 TSMOM，权重 $c_s$ 对应快慢均线权重差的离散微分。</p>\n<p><strong>统一类</strong>：HP 滤波器、卡尔曼滤波器（趋势成分）、Butterworth 滤波器等所有线性过滤器均满足上述形式，均可用收益权重序列 $\\{c_s\\}$ 完整描述。</p>\n<p>---</p>\n<p><strong>步骤 3：趋势特征图（Trend Signature Plots）</strong></p>\n<p>对任意线性趋势过滤器，绘制收益权重 $c_s$ 关于滞后期 $s$ 的函数图像，即&quot;趋势特征图&quot;：</p>\n<ul>\n<li>横轴：滞后期 $s$（1 期至若干期）</li>\n<li>纵轴：对应收益权重 $c_s$</li>\n<li>面积下方积分 = 信号总体趋势方向性；峰值位置 = 信号最敏感的回看视野</li>\n</ul>\n<p>典型特征图形态：</p>\n<ul>\n<li><strong>纯动量</strong>（$P_t - P_{t-m}$）：矩形脉冲，在 $s=1$ 到 $s=m$ 均匀权重</li>\n<li><strong>指数移动均线差</strong>：指数衰减权重，近期权重高</li>\n<li><strong>HP 滤波器趋势</strong>：钟形，中期权重最高</li>\n<li><strong>卡尔曼滤波器</strong>：由噪声/信号比决定形态，理论最优形式</li>\n</ul>\n<p>---</p>\n<p><strong>步骤 4：实践讨论</strong></p>\n<p>给定等价性，驱动策略收益差异的不是信号形式本身，而是：</p>\n<p>1. <strong>回看视野（Horizon）的选择</strong>：趋势特征图揭示不同信号对哪个时间窗口最敏感</p>\n<p>2. <strong>品种多元化</strong>：跨资产相关性低，是趋势跟随的主要收益来源</p>\n<p>3. <strong>组合构造</strong>：等权、波动率加权、CVaR 等方式的影响远大于信号选择</p>\n<p>4. <strong>交易成本</strong>：高换手率信号（短期趋势）的净收益大幅劣于低换手率信号（长期趋势）</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>等价性</strong>：TSMOM 与 MACROSS 在最一般形式下相互可转换，不存在本质差异</li>\n<li><strong>通用框架</strong>：所有线性过滤器（HP、卡尔曼等）均可纳入统一的收益权重表示</li>\n<li><strong>趋势特征图</strong>：提供直观的可视化工具，无需逐一推导就能比较不同过滤器的视野与权重分布</li>\n<li><strong>实践含义</strong>：信号类型的选择对长期表现影响有限，视野选取、多元化和交易成本管理更关键</li>\n<li><strong>黄金示例</strong>：以黄金期货展示不同过滤器在同一趋势特征图框架下的形态对比</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次从线性代数角度严格证明 TSMOM ↔ MACROSS 等价，终结两个流派的&quot;优劣之争&quot;</li>\n<li>将 HP 滤波器、卡尔曼滤波器等统计方法统一纳入趋势跟随框架，连接信号处理与金融实践</li>\n<li>趋势特征图是该领域的方法论贡献，此后被 CTA 文献广泛引用</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>纯理论文章，无大规模实证检验；黄金期货仅作示例说明，不具统计效力</li>\n<li>等价性成立的前提是&quot;最一般形式&quot;（无限历史、连续权重），实践中有限历史和参数离散化会引入差异</li>\n<li>未讨论非线性趋势信号（如 sign() 函数、Sharpe 归一化动量）的情形，而这些在实践中更常见</li>\n<li>结论&quot;信号选择不重要&quot;在参数化空间很大时可能反而增加过拟合风险（选了更多超参）</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 理论推导无需数据；趋势特征图只需实现权重序列的计算，任意期货收益数据即可验证</li>\n<li><strong>方法清晰度</strong>: 等价性证明清晰，趋势特征图可用 10 行代码复现</li>\n<li><strong>计算成本</strong>: 极低，纯数学推导 + 简单统计</li>\n<li><strong>综合评分</strong>: ★3.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>本文是方法论性质的基础文献，核心价值在于理解框架，不在于复现一个可交易策略。若需动手实践，最有价值的是实现趋势特征图工具：给定任意线性趋势信号（TSMOM、EMA差、HP滤波），自动绘制收益权重 $c_s$ 关于滞后期的曲线，用于后续设计自定义趋势信号时直观评估其&quot;视野&quot;。不复现的主要原因：无独立数据集，无超额收益量化结论，学术贡献集中在理论统一，已被后续文献充分吸收。</p>"}, {"key": "IHZWDIAR", "title": "Factoring in the Low-Volatility Factor", "year": "", "authors": "Amar Soebhag, Guido Baltussen, Pim van Vliet", "tags": [], "venue": "", "abstract": "Low-volatility investing is among the most robust empirical findings in finance and one of the most widely adopted factor approaches in practice, yet it remains largely absent from standard asset pricing models. We examine this disconnect and show that it stems from differences between traditional factor tests — assuming symmetric long-short positions and frictionless markets — and real-world portfolio implementation. Once we account for factor asymmetry and investment frictions, low-volatility materially improves leading asset pricing models. Our findings help reconcile academic asset pricing with investment practice and support integrating the low-volatility factor into asset pricing and investor factor models.", "url": "", "date_added": "2026-06-07", "summarized": true, "rating": "★3.5", "starred": false, "repro": "—", "summary_html": "<h1>Factoring in the Low-Volatility Factor</h1>\n<p>&gt; Zotero Key: <code>IHZWDIAR</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Amar Soebhag (Erasmus/Robeco), Guido Baltussen (Erasmus/Northern Trust), Pim van Vliet (Robeco)</li>\n<li><strong>年份</strong>: 2026 年 5 月（工作论文）</li>\n<li><strong>出处</strong>: SSRN / Working Paper</li>\n<li><strong>DOI</strong>: 无</li>\n<li><strong>链接</strong>: 无</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/6C2D35VS/Soebhag 等 - Factoring in the Low-Volatility Factor.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：低波动率异象是实证金融中最稳健的发现之一（AUM 超 $3920 亿），但在主流因子模型（FF5/q5/BS2018）中被视为冗余，这一脱节的根源是什么？</li>\n<li><strong>方法</strong>：在美股 1972—2023 年上，检验四种设定下低波动率因子的增量贡献：标准多空、多空分解定价、计入交易/做空摩擦、仅多头，用 Bootstrapped 模型比较。</li>\n<li><strong>结论</strong>：传统假设下低波动率看似冗余；允许多空腿分别定价后 Sharpe 比提升 11.9%，计入摩擦后提升 13%，hedged long leg 平均权重 26%——低波动率应纳入因子模型。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>低波动率异象是实证金融中最稳健的发现之一（跨市场、跨资产、跨时期），且业界 AUM 超 $3920 亿。但它在主流资产定价模型（FF5、q5、BS2018、DHS2020）中被视为冗余——低波动率因子被盈利和投资因子&quot;包含&quot;。论文提出：这个脱节是否源于学术界对多空对称性和零交易成本的假设？</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 美股（NYSE/AMEX/Nasdaq，share code 10/11，排除金融股和负 BTM）</li>\n<li><strong>频率</strong>: 月度 rebalance（波动率因子）/ 年度 rebalance（财务因子）</li>\n<li><strong>样本区间</strong>: 1972 年 1 月 – 2023 年 12 月</li>\n<li><strong>数据来源</strong>: CRSP（价格/收益）、Compustat（财务数据）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[传统因子模型&lt;br/&gt;FF3/FF5/q5/BS2018/DHS2020] --&gt; B[低波动率因子 V OL&lt;br/&gt;2×3 sort + 市场 beta 对冲]\n  B --&gt; C{四种设定}\n\n  C --&gt; C1[设定 1: 标准多空&lt;br/&gt;V OL = L - H - β×MKT&lt;br/&gt;最大 Sharpe 比仅 +0.57%]\n  C1 --&gt; D1[结论: 低波动率无增量 → 冗余]\n\n  C --&gt; C2[设定 2: 多空分解&lt;br/&gt;L_hedged 和 H_hedged&lt;br/&gt;分别定价]\n  C2 --&gt; D2[Sharpe 比 +11.9%&lt;br/&gt;L_hedged 权重 26.2%]\n\n  C --&gt; C3[设定 3: 计入摩擦&lt;br/&gt;bid-ask spread + 做空费]\n  C3 --&gt; D3[Sharpe 比 +13%&lt;br/&gt;PEAD 因子收益 3.45%→-0.87%]\n\n  C --&gt; C4[设定 4: 仅多头&lt;br/&gt;移除做空腿]\n  C4 --&gt; D4[等价 Sharpe 比&lt;br/&gt;低波动多头稳健]\n\n  D2 --&gt; E[Bootstrapped 模型比较&lt;br/&gt;低波动率在多数模拟中胜出]\n  D3 --&gt; E\n  D4 --&gt; E\n  E --&gt; F[结论: 低波动率应纳入因子模型]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>低波动率因子构造</strong>：用过去 252 个交易日的日超额收益标准差排序，2×3 sort（Size × Volatility），30%/70% 分位点。多空组合做市场 beta 对冲：</p>\n<p>   $$VOL_t = r_{L,t} - r_{H,t} - (\\beta_{L,t-1} - \\beta_{H,t-1}) \\times MKT_t$$</p>\n<p>   beta 用 36 个月滚动窗口估计，caps 在 [0.25, 2.0]，低波动腿 beta 上限为 1。</p>\n<p>2. <strong>因子模型集合</strong>：纳入 FF3、FF5、FF6（FF5+MOM）、HXZ q5、BS2018（6 因子）、DHS2020（3 因子）。所有因子统一用 30/70 分位点构建以控制自由度差异。</p>\n<p>3. <strong>四种设定递增现实主义</strong>：</p>\n<p>   - 设定 1（基准）：标准多空因子，两个可投资性过滤（排除微盘股 + 处理缺失数据）</p>\n<p>   - 设定 2（不对称）：将每个因子的多空腿拆分为 hedged long 和 hedged short（各做市场 beta 对冲），作为独立因子进入模型</p>\n<p>   - 设定 3（+摩擦）：在设定 2 基础上加入 bid-ask spread（Hasbrouck 2009 方法）和做空费</p>\n<p>   - 设定 4（仅多头）：移除做空腿，仅保留 hedged long legs</p>\n<p>4. <strong>模型比较</strong>：以最大 Sharpe 比（切线组合）为主要评判标准（Barillas and Shanken 2017），辅以 spanning test 和 bootstrapped 模型比较（估计某模型在 N 次模拟中胜出的概率）。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>设定 1（传统）</strong>：加入 VOL 仅使最大 Sharpe 比从 0.57% 提升至 0.58%（几乎无改善），与已有结论一致——VOL 在传统框架中冗余。</li>\n<li><strong>设定 2（分解多空）</strong>：hedged long legs 平均收益高于 hedged short legs。VOL 加入后模型最大 Sharpe 比<strong>提升 11.9%</strong>，hedged low-volatility leg 获平均 26.2% 权重。Spanning test 在所有模型中 1% 显著。</li>\n<li><strong>设定 3（+成本）</strong>：PEAD 因子年化收益从 3.45% 骤降至 <strong>-0.87%</strong>；低波动率因子（尤其是多头方向）依然稳健（hedged long leg 年化 2.7%）。VOL 改善幅度平均 <strong>13%</strong>，hedged low-volatility leg 权重 26.4%。</li>\n<li><strong>设定 4（仅多头）</strong>：排除做空腿后，模型结构和最大 Sharpe 比几乎不变，低波动率多头持续改善所有模型。</li>\n<li><strong>稳健性</strong>：结论在（1）1930 年起更长样本、（2）替代低风险定义（Beta / IVOL / 杠杆化低波动）、（3）数千种因子构造方法变体中均成立。</li>\n</ul>\n<h2>创新点</h2>\n<p>1. <strong>提出&quot;因子定价不对称性&quot;框架</strong>——多空因子的 long/short legs 有不同的定价内涵和摩擦暴露，不应被对称处理。</p>\n<p>2. <strong>系统性地将投资摩擦嵌入因子模型比较</strong>，连接了学术因子文献和业界投资实践。</p>\n<p>3. 为&quot;低波动率异象&quot;提供了<strong>模型内生的解释</strong>：它之所以被排除不是因为它&quot;不存在&quot;，而是因为<strong>传统检验框架排除了它存在的必要条件</strong>（不对称 + 摩擦）。</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>最大 Sharpe 比的样本内偏差</strong>：作者承认并做了 out-of-sample 递归检验和 bootstrap，但审稿人可能质疑这一评判标准本身。</li>\n<li><strong>beta 对冲的假定</strong>：VOL 因子通过滚动 beta 做市场中性，但 beta 本身有时变性——对冲误差可能影响结论。</li>\n<li><strong>成本模型简化</strong>：仅用 bid-ask spread 代理交易成本，未考虑价格冲击、延迟成本、opportunity cost 等更复杂的成本项。</li>\n<li><strong>业界导向的作者群</strong>：三位作者中有两位来自 Robeco/Northern Trust（低波动策略的资管机构），存在确认偏误的潜在风险——但方法的严谨性在一定程度上缓解了这一担忧。</li>\n<li><strong>仅美股</strong>：未在国际市场验证，但论文声称低波动率是全球性现象。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: ★★★★★ CRSP/Compustat（WRDS 订阅），数据获取标准。</li>\n<li><strong>方法清晰度</strong>: ★★★★☆ 因子构建步骤描述详细，但成本估算的 Hasbrouck (2009) 方法和 bootstrapped 模型比较的具体实现需参考原文附录。</li>\n<li><strong>计算成本</strong>: ★★☆☆☆ 低，基本 portfolio sort + 线性回归，无需 GPU。</li>\n<li><strong>综合评分</strong>: ★3.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>中等优先级。论文的方法论意义大于信号贡献——它论证了&quot;在做因子研究时应如何处理多空不对称性和交易成本&quot;，而不仅仅是&quot;低波动率因子好用&quot;。复现建议：（1）在 A 股做类比分析：A 股低波动率效应同样显著但常被&quot;反转效应&quot;掩盖，用不对称框架重新检验；（2）将&quot;因子腿分解&quot;思路推广到其他因子（如 A 股小市值、反转），看哪些因子的 hedged long leg 驱动主要 alpha。</p>"}];
const M=Object.fromEntries(D.map(p=>[p.key,p]));
let curFilter='all',curView='card',sc='date_added',sd=1,firstRender=true;

function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function reproCls(r){return r==='待复现'?'badge-repro':r==='复现中'?'badge-wip':r==='已复现'?'badge-reproduced':''}
function isNew(p){
  if(!p.date_added)return false;
  const t=new Date();
  const cutoff=new Date(t.getFullYear(),t.getMonth(),t.getDate()-2);
  const cs=cutoff.getFullYear()+'-'+String(cutoff.getMonth()+1).padStart(2,'0')+'-'+String(cutoff.getDate()).padStart(2,'0');
  return p.date_added>=cs;
}

// 关键词高亮（作用于已转义字符串）
function highlight(raw,q){
  const s=esc(raw);
  if(!q)return s;
  const words=q.trim().split(/\s+/).filter(w=>w.length>0);
  let r=s;
  for(const w of words){
    const safe=esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    if(safe)r=r.replace(new RegExp(safe,'gi'),'<mark>$&</mark>');
  }
  return r;
}

function isToday(p){
  if(!p.date_added)return false;
  const t=new Date();
  const ts=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
  return p.date_added===ts;
}

// 点击 Tag 直接检索
function searchTag(tag){
  const q=document.getElementById('q');
  q.value=tag;q.focus();render();
}
function clearSearch(){const q=document.getElementById('q');q.value='';q.focus();render();}

// 主题切换
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',cur);
  try{localStorage.setItem('theme',cur)}catch(e){}
}

// 数字 count-up 动画
function countUp(el,target){
  if(target<=0){el.textContent='0';return;}
  const dur=650,start=performance.now();
  function step(now){
    const p=Math.min((now-start)/dur,1);
    el.textContent=Math.round(target*(1-Math.pow(1-p,3)));
    if(p<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

const COUNTS=()=>({
  all:D.length,
  done:D.filter(p=>p.summarized).length,
  todo:D.filter(p=>!p.summarized).length,
  repro:D.filter(p=>p.repro==='待复现').length,
  wip:D.filter(p=>p.repro==='复现中').length,
  star:D.filter(p=>p.starred).length,
});

function stats(){
  const c=COUNTS();
  const repro=c.repro+c.wip;
  document.getElementById('stats').innerHTML=
    `<div class="stat-tab active" id="st-all" onclick="setFilter('all')"><span class="stat-num" data-n="${c.all}">0</span><span class="stat-label">篇论文</span></div>`+
    `<div class="stat-tab green" id="st-done" onclick="setFilter('done')"><span class="stat-num" data-n="${c.done}">0</span><span class="stat-label">已总结</span></div>`+
    `<div class="stat-tab orange" id="st-repro" onclick="setFilter('repro')"><span class="stat-num" data-n="${repro}">0</span><span class="stat-label">待复现</span></div>`;
  document.querySelectorAll('.stat-num').forEach(el=>countUp(el,+el.dataset.n));
  // 筛选按钮数量徽标
  const labels={all:'全部',done:'已总结',todo:'未总结',repro:'待复现',wip:'复现中',star:'⭐ 精选'};
  for(const k in labels){
    const b=document.getElementById('f-'+k);
    if(b)b.innerHTML=`${labels[k]}<span class="cnt">${c[k]}</span>`;
  }
  // 今日上新提示胶囊
  const newCount=D.filter(isToday).length;
  const np=document.getElementById('newPill');
  if(np){
    if(newCount>0){np.textContent=`今日上新 ${newCount} 篇`;np.classList.add('show');}
    else np.classList.remove('show');
  }
}

function filtered(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  return D.filter(p=>{
    const mq=!q||[p.title,p.authors,p.tags.join(' '),p.venue||'',p.abstract||''].join(' ').toLowerCase().includes(q);
    const mf=curFilter==='all'||(curFilter==='done'&&p.summarized)||(curFilter==='todo'&&!p.summarized)||(curFilter==='repro'&&p.repro==='待复现')||(curFilter==='wip'&&p.repro==='复现中')||(curFilter==='star'&&p.starred);
    return mq&&mf;
  });
}

function sorted(rows){
  return [...rows].sort((a,b)=>{
    let av=a[sc]??'',bv=b[sc]??'';
    if(sc==='year'){av=parseInt(av)||0;bv=parseInt(bv)||0;}
    else if(sc==='date_added'){av=av.replace(/-/g,'')||'0';bv=bv.replace(/-/g,'')||'0';}
    else if(sc==='rating'){av=parseFloat((String(av).match(/[\d.]+/)||['0'])[0]);bv=parseFloat((String(bv).match(/[\d.]+/)||['0'])[0]);}
    else if(sc==='summarized'){av=a.summarized?1:0;bv=b.summarized?1:0;}
    return av<bv?sd:av>bv?-sd:0;
  });
}

function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  document.getElementById('sw').classList.toggle('has-text',q.length>0);
  const rows=sorted(filtered());
  document.getElementById('cnt').textContent=`${rows.length} / ${D.length} 篇`;
  const anim=firstRender;

  document.getElementById('cards').innerHTML=rows.length?rows.map((p,i)=>`
    <div class="card${p.starred?' starred':''}${anim?' anim':''}"${anim?` style="--i:${i}"`:''} onclick="openDrawer('${p.key}')">
      <div class="card-meta">
        <span class="card-year">${esc(p.year)||'—'}</span>
        ${isNew(p)?'<span class="card-badge badge-new">上新</span>':''}
        ${p.starred?'<span class="card-badge badge-star">⭐ 精选</span>':''}
        ${p.summarized?'<span class="card-badge badge-done">✅ 已总结</span>':'<span class="card-badge badge-todo">待总结</span>'}
        ${p.repro&&p.repro!=='—'?`<span class="card-badge ${reproCls(p.repro)}">${esc(p.repro)}</span>`:''}
        <span class="card-rating">${esc(p.rating)||''}</span>
        ${p.url?`<a class="link-out" href="${esc(p.url)}" target="_blank" rel="noopener" title="原文" onclick="event.stopPropagation()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a>`:''}
      </div>
      <div class="card-title">${highlight(p.title,q)}</div>
      <div class="card-authors">${highlight(p.authors,q)||'—'}</div>
      <div class="card-tags">
        ${p.tags.slice(0,3).map(t=>`<span class="tag" onclick="event.stopPropagation();searchTag('${esc(t)}')" title="检索此 Tag">${highlight(t,q)}</span>`).join('')}
        ${p.tags.length>3?`<span class="tag more">+${p.tags.length-3}</span>`:''}
      </div>
    </div>`).join(''):emptyHTML();

  document.getElementById('tbody').innerHTML=rows.length?rows.map(p=>{
    const titleEl=p.url
      ?`<a href="${esc(p.url)}" target="_blank" rel="noopener">${highlight(p.title,q)}</a>`
      :highlight(p.title,q);
    return`<tr>
      <td><span class="t-key">${esc(p.key)}</span></td>
      <td class="t-title" onclick="openDrawer('${p.key}')">${titleEl}</td>
      <td class="t-year">${esc(p.year)||'—'}</td>
      <td class="t-authors" title="${esc(p.authors)}">${esc(p.authors)||'—'}</td>
      <td>${p.tags.slice(0,2).map(t=>`<span class="tag" onclick="searchTag('${esc(t)}')" title="检索此 Tag">${highlight(t,q)}</span>`).join(' ')}${p.tags.length>2?` <span class="tag more">+${p.tags.length-2}</span>`:''}</td>
      <td class="t-rating">${esc(p.rating)||'—'}</td>
      <td>${p.summarized&&p.summary_html?`<button class="btn-read" onclick="openDrawer('${p.key}')">阅读</button>`:(p.summarized?'✅':'⬜')}</td>
      <td>${p.repro&&p.repro!=='—'?`<span class="card-badge ${reproCls(p.repro)}">${esc(p.repro)}</span>`:'<span style="color:var(--text-muted)">—</span>'}</td>
      <td style="color:var(--text-muted);font-size:12px;white-space:nowrap">${isNew(p)?'<span class="card-badge badge-new">上新</span> ':''}${esc(p.date_added)||'—'}</td>
    </tr>`}).join(''):`<tr><td colspan="9" style="padding:0">${emptyHTML()}</td></tr>`;

  firstRender=false;
}

function emptyHTML(){
  return `<div class="empty"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg><div class="et">没有匹配的论文</div><div class="es">试试更换关键词或筛选条件</div></div>`;
}

function applyActive(f){
  ['all','done','todo','repro','wip','star'].forEach(x=>document.getElementById('f-'+x).classList.toggle('active',x===f));
  ['all','done','repro'].forEach(x=>{const e=document.getElementById('st-'+x);if(e)e.classList.toggle('active',x===f);});
}
function setFilter(f){curFilter=f;applyActive(f);render();}
function setView(v){curView=v;document.getElementById('main').className=`main view-${v==='card'?'cards':'table'}`;document.getElementById('vb-card').classList.toggle('active',v==='card');document.getElementById('vb-table').classList.toggle('active',v==='table');}
// 同步表头箭头指示与下拉框选中项到当前 sc/sd（sd===1 为降序）。
function syncSort(){
  document.querySelectorAll('th').forEach(th=>th.classList.remove('sort-asc','sort-desc'));
  const cols=['key','title','year','','','rating','summarized','repro','date_added'];
  const i=cols.indexOf(sc);
  if(i>=0)document.querySelectorAll('th')[i].classList.add(sd===1?'sort-desc':'sort-asc');
  const sel=document.getElementById('sortSel');
  if(sel){const v=`${sc}:${sd}`;sel.value=[...sel.options].some(o=>o.value===v)?v:'';}
}
function sortBy(col){if(sc===col){sd*=-1;}else{sc=col;sd=1;}syncSort();render();}
function setSort(v){const[col,dir]=v.split(':');sc=col;sd=parseInt(dir);syncSort();render();}

function openDrawer(key){
  const p=M[key];if(!p)return;
  document.getElementById('dt').textContent=p.title;
  document.getElementById('dm').innerHTML=`
    <span class="d-meta-line">
      <span class="d-meta-item"><strong>年份</strong> ${esc(p.year)||'—'}</span>
      <span class="d-meta-item"><strong>作者</strong> ${esc(p.authors)||'—'}</span>
    </span>
    <span class="d-meta-line">
      <span class="d-meta-item"><strong>评分</strong> <span style="color:var(--gold)">${esc(p.rating)||'—'}</span></span>
      ${p.date_added?`<span class="d-meta-item"><strong>入库</strong> ${esc(p.date_added)}</span>`:''}
      ${p.repro&&p.repro!=='—'?`<span class="card-badge ${reproCls(p.repro)}">${esc(p.repro)}</span>`:''}
      ${p.url?`<a class="d-link-out" href="${esc(p.url)}" target="_blank" rel="noopener"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>原文</a>`:''}
    </span>`;
  document.getElementById('db').innerHTML=p.summary_html||'<p style="color:var(--text-muted)">暂无摘要内容</p>';
  document.getElementById('db').scrollTop=0;
  document.getElementById('dr').classList.add('open');
  document.getElementById('ov').classList.add('open');
  if(window.MathJax&&window.MathJax.typesetPromise) MathJax.typesetPromise([document.getElementById('db')]);
  if(window.renderMermaid) window.renderMermaid(document.getElementById('db'));
}

function closeDrawer(){document.getElementById('dr').classList.remove('open');document.getElementById('ov').classList.remove('open');}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeDrawer();return;}
  // "/" 聚焦搜索框
  if(e.key==='/'&&document.activeElement!==document.getElementById('q')){e.preventDefault();document.getElementById('q').focus();}
});
// 顶栏滚动浮现阴影
addEventListener('scroll',()=>{document.querySelector('.header').classList.toggle('scrolled',scrollY>4)},{passive:true});

// 初始排序：入库时间（新→旧），同步表头与下拉框
syncSort();
stats();render();
</script>
</body>
</html>
