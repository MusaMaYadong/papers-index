晰度</strong>: 极高，所有参数固定、代码公开、流程严格</li>\n<li><strong>计算成本</strong>: 极低（HistGBM 和单层 LSTM，笔记本可跑）</li>\n<li><strong>综合评分</strong>: ★3.0（评分给的是方法论质量而非结果——负面结果本身可信、流程严谨）</li>\n</ul>\n<h2>复现备注</h2>\n<p>不建议复现本文的&quot;预测模型&quot;（因为作者已验证它们不工作）。但有价值的复现方向：</p>\n<ul>\n<li><strong>提高数据量</strong>：用 MNQ tick 数据（3–5 百万条）训练 LSTM/Transformer，验证&quot;样本量阈值&quot;假设</li>\n<li><strong>多品种联合训练</strong>：ES + NQ + MES + MNQ 同时训练，扩大有效样本量</li>\n<li><strong>用 Kronos 微调</strong>：直接加载 Kronos checkpoint 做 MNQ 微调——这是论文提及但未实施的最直接路径</li>\n<li>本文的 walk-forward + permutation test 验证框架本身就是可复用的好模板</li>\n</ul>"}, {"key": "N7BSGZUA", "title": "Rough volatility dynamics in commodity markets", "year": "2026", "authors": "Roberto Daluiso, Héctor Folgar-Cameán, Andrea Pallavicini…", "tags": ["Quantitative Finance - Computational Finance", "Quantitative Finance - Pricing of Securities"], "venue": "", "abstract": "In this paper, we develop a general rough volatility model for commodities that provides an automatic calibration of the initial term structure of the futures prices and an appropriate treatment of the Samuelson effect. After the theoretical analysis of this general model, we focus on the rBergomi and rHeston models and their calibration to market data of vanilla futures options on WTI Crude Oil. Finally, numerical results illustrate the performance of the proposed rough volatility models for commodities pricing.", "url": "http://arxiv.org/abs/2603.26514", "date_added": "2026-06-27", "summarized": true, "rating": "★2.0", "starred": false, "repro": "—", "summary_html": "<h1>Rough volatility dynamics in commodity markets</h1>\n<p>&gt; Zotero Key: <code>N7BSGZUA</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 不复现</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Roberto Daluiso, Héctor Folgar-Cameán, Andrea Pallavicini, Carlos Vázquez</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: arXiv:2603.26514</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2603.26514</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2603.26514</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/JVGRX7IX/Daluiso 等 - 2026 - Rough volatility dynamics in commodity markets.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：粗糙波动率模型（Hurst 参数 $H&lt;0.5$）在股票市场已成功解释 ATM 波动率偏斜的指数衰减（Fukasawa 效应），但在商品市场应用几乎空白。</li>\n<li><strong>方法</strong>：将 rBergomi 和 rHeston 推广至商品市场——引入虚构现货价格、嵌套校准（外层优化常数参数 + 内层二分法校准初始远期方差曲线），自动拟合期货期限结构并处理 Samuelson 效应。</li>\n<li><strong>结论</strong>：在 WTI 原油期权数据上完成校准验证，粗糙波动率框架可有效拟合商品期权隐含波动率曲面。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>经典随机波动率模型（如 Heston）假设波动率驱动为标准布朗运动，无法解释实证中观测到的 ATM 波动率偏斜随到期时间指数衰减的 Fukasawa 效应。粗糙波动率模型（Hurst 参数 $H &lt; 0.5$）在股票市场已成功解决这一问题，但在商品市场的应用几乎空白。已有文献仅 Alfeus &amp; Nikitopoulos (2022) 估计了商品的 Hurst 参数，尚未建立完整的商品粗糙波动率定价模型。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: WTI 原油期货及期权</li>\n<li><strong>频率</strong>: 10 秒级高频数据（Hurst 参数估计用 5 分钟收益率）</li>\n<li><strong>样本区间</strong>: 2025-01-16 至 2025-07-31（Hurst 估计）；校准日为 2025-03-14 和 2025-06-04</li>\n<li><strong>数据来源</strong>: NYMEX 市场数据，包含买卖报价、隐含波动率、交易量</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[虚构现货价格 S_t] --&gt; B[标准化 s_t = S_t / F_0]\n  B --&gt; C[通用粗糙波动率 SDE]\n  C --&gt; D{波动率过程选择}\n  D --&gt;|粗糙 Bergomi| E1[分数布朗运动驱动方差]\n  D --&gt;|粗糙 Heston| E2[均值回复方差 + 分数噪声]\n  C --&gt; F[期货价格公式 F_t=T = F_0·条件期望]\n  F --&gt; G[嵌套校准]\n  G --&gt; H[外层: 优化常数参数 Θ]\n  G --&gt; I[内层: 二分法校准初始远期方差曲线]\n  H --&gt; J[加权损失函数 L]\n  I --&gt; J\n  J --&gt; K[隐含波动率曲面拟合]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>虚构现货价格定义</strong>：由于商品期货交割机制复杂，引入虚构现货价格 $S_t$，使得 $F_t(T) = \\mathbb{E}_t[S_{T^{\\text{last}}}]$，即期货价格是虚构现货价格的条件期望。</p>\n<p>2. <strong>标准化</strong>：定义归一化虚构现货价格 $s_t := S_t / F_0(t)$，满足 SDE：</p>\n<p>   $$ds_t = (a(t) + (\\beta(t) - \\partial_t \\ln F_0(t))s_t)dt + \\sqrt{\\xi_t^u} s_t dW_t^1, \\quad s_0 = 1$$</p>\n<p>3. <strong>自动校准期限结构</strong>：通过求解关于期货价格的 ODE，得到参数 $\\beta(T) = \\partial_T \\ln F_0(T) - a(T)$，实现期货价格初始期限结构的自动校准：</p>\n<p>   $$F_t(T) = F_0(T)\\left(1 - (1 - s_t)\\exp\\left(-\\int_t^T a(u)du\\right)\\right)$$</p>\n<p>4. <strong>粗糙波动率实现</strong>：将方差过程 $\\xi_t^u$ 设为由分数布朗运动驱动的前向方差模型，分别具体化为：</p>\n<p>   - <strong>rBergomi</strong>：$v_t = \\xi_0(t)\\exp\\left(-\\frac{\\eta^2}{2}t^{2H} + \\eta\\sqrt{2H}\\int_0^t \\frac{dW_s^2}{(t-s)^{1/2-H}}\\right)$</p>\n<p>   - <strong>rHeston</strong>：方差过程包含均值回复漂移和分数噪声驱动项</p>\n<p>5. <strong>Samuelson 效应处理</strong>：通过均值回复速度 $a(t)$ 刻画。$a$ 越大，临近到期的 ATM 隐含波动率越高，符合商品期货的已实现波动率期限结构。</p>\n<p>6. <strong>嵌套校准流程</strong>：</p>\n<p>   - <strong>外层</strong>：用 MATLAB <code>surrogateopt</code> + <code>fmincon</code> 优化常数参数 $\\Theta = (H, \\eta, \\rho, \\kappa)$</p>\n<p>   - <strong>内层</strong>：用二分法逐到期日校准初始远期方差曲线 $\\xi_0(t)$（逐层影响波动率曲面的垂直偏移）</p>\n<p>   - <strong>损失函数</strong>：加权买卖价差损失，权重正比于成交量；对深度 ITM/OTM 区域加惩罚项防止过度拟合</p>\n<p>7. <strong>数值模拟</strong>：rBergomi 用 Hybrid Scheme (Bennedsen et al., 2017)，rHeston 用 Hybrid Quadratic Scheme (Gatheral, 2022)；模拟 100,000 条路径；短期到期用细网格 $n=2000$，其余用 $n=300$ 的双网格策略。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>WTI 原油的 Hurst 参数估计值范围为 $H \\in [0.14, 0.21]$，确认了粗糙行为的存在</li>\n<li>rBergomi 校准参数 $H \\approx 0.046 \\sim 0.078$，rHeston $H \\approx 0.277 \\sim 0.321$</li>\n<li>粗糙模型（rBergomi、rHeston）校准损失显著低于经典 Bergomi 和 Heston 模型（尤其在近期到期合约上）</li>\n<li>允许相关性 $\\rho$ 依赖到期日（时间分段常数）可显著改善波动率曲面拟合，特别是 rHeston 模型</li>\n<li>经典模型通过极大的 vol-vol $\\eta$ 和均值回复速度 $\\kappa$ 能近似复现粗糙模型的结果，但参数不经济</li>\n</ul>\n<h2>创新点</h2>\n<p>1. 首次将粗糙波动率模型系统性地应用于商品市场定价</p>\n<p>2. 提出通用商品粗糙波动率框架，通过虚构现货价格实现期货价格初始期限结构的自动校准</p>\n<p>3. 证明了在 $Y_t$ 为鞅的条件下，通用前向方差模型可写为最终定价形式（Theorem 3.4）</p>\n<p>4. 引入到期日依赖的相关性结构以改善曲面拟合</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>仅以 WTI 原油为实证对象，未推广至其他商品（天然气、金属、农产品等）</li>\n<li>均值回复速度 $a$ 固定为 0.5，缺乏系统校准方法（作者承认这是开放问题）</li>\n<li>校准使用的是欧式期权近似（假设美式与欧式隐含波动率差异可忽略），对深度实值期权可能不成立</li>\n<li>模拟计算成本较高（100,000 条路径 + 双网格），未考虑神经网络加速等近似方法</li>\n<li>样本量有限（两个校准日），缺乏样本外预测能力的验证</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>：需 NYMEX WTI 期权高频市场数据（买卖报价、成交量），非公开数据</li>\n<li><strong>方法清晰度</strong>：理论推导详尽，校准方案描述完整，但依赖 MATLAB Global Optimization Toolbox</li>\n<li><strong>计算成本</strong>：高——Monte Carlo 模拟 100k 路径 + 嵌套优化，单次校准可能需数小时</li>\n<li><strong>综合评分</strong>: ★2.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>不复现。原因：(1) 纯理论定价模型，非交易信号/因子研究，与量化交易策略复现目标不匹配；(2) 依赖非公开 NYMEX 市场数据；(3) 计算成本高且依赖 MATLAB 商业工具箱；(4) 仅 WTI 单一品种实证，推广性存疑。</p>"}, {"key": "N3PXTJF5", "title": "Returns to “Do-Nothing” Portfolios", "year": "2026", "authors": "Hendrik Bessembinder", "tags": ["SSRN", "Returns to"], "venue": "", "abstract": "I study outcomes for a variety of \"do-nothing\" portfolios constructed from constituents of the S&P 500 index, from 1971 to 2025. These portfolios maintain their positions even for those stocks that exit the index. The findings include (i) initially equal-weighted portfolios outperform initially value-weighted portfolios over the full sample period, (ii) value-weighted \"do-nothing\" portfolios essentially match the index on average, (iii) portfolios constructed from the largest constituent stocks have recently outperformed portfolios constructed from all index constituents, but this is atypical, as over the full sample the largest-stock portfolios performed quite poorly, and (iv) narrow portfolios of randomly selected component stocks generate average returns similar to the index, but underperform the majority of the time, and more so over longer periods and for narrow portfolios.", "url": "https://papers.ssrn.com/abstract=7023959", "date_added": "2026-07-13", "summarized": true, "rating": "★2.0", "starred": false, "repro": "—", "summary_html": "<h1>Returns to &quot;Do-Nothing&quot; Portfolios</h1>\n<p>&gt; Zotero Key: <code>N3PXTJF5</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 不复现</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>:Hendrik Bessembinder</li>\n<li><strong>年份</strong>:2026</li>\n<li><strong>出处</strong>:SSRN Working Paper</li>\n<li><strong>DOI</strong>:10.2139/ssrn.7023959</li>\n<li><strong>链接</strong>:https://papers.ssrn.com/abstract=7023959</li>\n<li><strong>本地 PDF</strong>:<code>~/Developer/Zotero/storage/57HDS5CZ/Bessembinder - 2026 - Returns to “Do-Nothing” Portfolios.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>:&quot;什么都不做&quot;（买入后长期持有、不再调仓的&quot;咖啡罐&quot;组合）相对指数基金和主动再平衡组合，长期收益究竟如何，尤其在当下标普500指数集中度飙升的背景下，重仓头部大盘股是否划算。</li>\n<li><strong>方法</strong>:用 CRSP 数据，对 1971–2025 年每年末的标普500成分股构建等权/市值加权&quot;do-nothing&quot;组合（持有期内不调仓，个股退市后收益转投国库券），比较 1/5/10 年及 55 年复合收益，并对随机抽取的窄组合做 5000 次蒙特卡洛模拟。</li>\n<li><strong>结论</strong>:市值加权 do-nothing 组合与指数本身收益几乎一致（55年复合 $361 vs 指数 $344，年化再平衡口径）；等权 do-nothing 长期跑赢市值加权（$678 vs $361），但优势随持有期拉长而大幅缩水；仅持有最大单一成分股的策略过去55年显著跑输全市场组合（$59 vs $361，仅为其16%），2014–2025 年头部股（主要是苹果）罕见地大幅跑赢，但这在历史上是反常现象，1971–2013 年头部股组合表现很差；随机窄组合（个股或少数股票）跑赢指数的概率不到一半，且持有期越长、组合越窄，跑输概率越高。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>&quot;咖啡罐组合&quot;（coffee-can portfolio，Kirby 1984 提出）主张选出一批优质股票后长期不动，作为指数化投资的替代方案。现实中散户也普遍持有高度集中的头寸（Polkovnichenko 2005：80、90年代散户权益仓位三分之二集中在个股，常年只持1–3只股票）。作者想系统检验：(1) 等权 vs 市值加权的 do-nothing 组合谁更优；(2) do-nothing 组合与真实指数（会定期增删成分股、按流通市值加权）相比表现如何；(3) 只持有最大市值股票是否划算，延伸 Mouboussin and Callahan (2024) 关于头部三大股的研究，回应当前标普500指数集中度创新高（截至2026年5月中旬，前十大权重合计38%，英伟达7.8%、苹果6.4%、微软4.6%、亚马逊4.4%）背景下的争议；(4) 继承少量随机个股后，&quot;放着不动&quot;和&quot;卖出买指数基金&quot;哪个更优。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>:标普500指数历年成分股（普通股，以 CRSP Permno 识别，各年末成分数量 499–506 只）</li>\n<li><strong>频率</strong>:月度收益，年度组合构建/再平衡</li>\n<li><strong>样本区间</strong>:1971–2025（55年）</li>\n<li><strong>数据来源</strong>:CRSP（月度收益与市值，含再投资分红及退市收益）；标普500指数收益数据由 Morningstar 的 Jeff Ptak 提供（1971–2025，含再投资分红）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[CRSP: 历年末标普500成分股&lt;br/&gt;月度收益+市值] --&gt; B[按年末构建组合]\n  B --&gt; C{加权方式}\n  C --&gt;|等权| D1[Equal-Weighted]\n  C --&gt;|市值加权| D2[Value-Weighted]\n  D1 --&gt; E[Do-Nothing 持有&lt;br/&gt;1/5/10年不调仓]\n  D2 --&gt; E\n  E --&gt; F{退市处理}\n  F --&gt;|个股退市| G[退市收益转投1月期国库券至期末]\n  E --&gt; H[计算组合买入持有复合收益]\n  H --&gt; I[对比: 指数本身收益]\n  H --&gt; J[对比: 按市值排序的&lt;br/&gt;全部/100/50/10/1只头部股组合]\n  H --&gt; K[对比: 随机抽取N只股票组合&lt;br/&gt;蒙特卡洛5000次/年]\n  I --&gt; L[结论: 集中度与再平衡频率&lt;br/&gt;对长期收益的影响]\n  J --&gt; L\n  K --&gt; L</div>\n<h3>步骤详解</h3>\n<p>1. <strong>组合构建</strong>：在每年末（1970年末起），取当时标普500全部成分股，分别按等权、市值加权构建初始组合；此后不再调仓（&quot;do-nothing&quot;），仅在个股分红时买入同一只股票再投资，若某只股票在持有期内退市则假设退市所得转投1月期国库券直至期末。不考虑交易成本和税收。</p>\n<p>2. <strong>收益计算</strong>：对每个组合分别计算 1年、5年、10年的复合（买入持有）收益，取全部起始年份的均值（算术/几何）；用连续年度的1年收益链接得到55年累计复合收益（annually-rebalanced 口径），也用&quot;5年+多个10年&quot;链接得到低频再平衡口径下的55年累计收益，二者对比反映调仓频率的影响。</p>\n<p>3. <strong>等权 vs 市值加权对比</strong>（Table 1，第II节）：比较两种加权下的 do-nothing 组合收益差异，归因于小盘股效应（等权组合对小盘股权重更高）。</p>\n<p>4. <strong>do-nothing vs 指数对比</strong>（Table 2，第III节）：市值加权 do-nothing 组合与标普500指数本身对比，差异来源于指数会定期增删成分股、且用流通调整市值加权，而 do-nothing 组合期内成分固定。</p>\n<p>5. <strong>头部股票集中度分析</strong>（Table 3–5，第IV节）：按年末市值将成分股排序，分别构建&quot;全部/100只最大/50只最大/10只最大/1只最大&quot;的市值加权 do-nothing 组合，计算 1/5/10年复合收益的算术均值与几何均值，并展示55年累计复合收益及2013年末至今的相对增长倍数，识别历年最大市值个股（IBM/GE/微软/埃克森美孚/苹果等）及其对结果的驱动作用。</p>\n<p>6. <strong>随机窄组合的蒙特卡洛模拟</strong>（Table 6，第V节）：对每个起始年份，从当年全部成分股中不放回随机抽取 100/50/25/10/5/1 只股票构建市值加权（及等权对照）组合，重复5000次，计算 1/5/10年 do-nothing 组合跑赢指数的比例均值。</p>\n<p>7. <strong>输出</strong>：各类 do-nothing 组合相对指数、相对不同集中度基准的复合收益对比表与图（Figure 1–3），以及随机窄组合跑赢指数的概率分布。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>等权 vs 市值加权：1年算术均值收益 14.02%（等权）vs 12.69%（市值加权），几何均值 12.59% vs 11.30%；55年年度再平衡复合收益 $678 vs $361（每1美元初始投资）；若换成5/10年低频再平衡，优势大幅收窄至 $387 vs $342。</li>\n<li>do-nothing vs 指数：市值加权 do-nothing 组合1年算术均值 12.69% 略高于指数 12.64%，年度再平衡口径55年复合 $361 vs 指数 $344；但低频再平衡口径下二者几乎相等（$342 vs $344），验证并推广了 Jeff Ptak 此前基于2013年起10年窗口的发现。</li>\n<li>头部集中度：全部/100大/50大/10大/1大 组合1年算术均值收益依次为 12.7%/12.5%/12.5%/12.8%/11.3%，但几何均值单调递减为 11.30%/11.01%/10.92%/10.72%/7.71%；55年复合收益 $361/$312/$298/$270/$59，单一最大股策略仅为全市场组合的16%；1971–2013年单一最大股策略仅涨到 $4.56（全市场组合 $78.62）；但2013年末至2025年末，全市场组合增长4.6倍，100/50/10大分别5.3/5.6/7.6倍，单一最大股高达13.0倍（主要由苹果驱动），显示近十余年头部股的强势是历史罕见现象而非常态。</li>\n<li>随机窄组合：100只随机股票的市值加权组合跑赢指数概率接近50%，组合越窄跑赢概率越低；单只随机股票跑赢指数的比例仅 47.6%（1年）/46.1%（5年）/41.5%（10年）；等权随机组合因小盘股效应表现略好（5只等权组合跑赢概率 50.7%/52.7%/49.0%）；单只随机股票跑赢概率在2000–2002年均值高达64.2%，但近三年仅28.9%，反映近年收益集中度上升。</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次系统性地把&quot;coffee-can/do-nothing 组合&quot;思想扩展到 1971–2025 全部55年样本，覆盖多种加权方式、多种持有期（1/5/10年及55年全周期）、多种再平衡频率。</li>\n<li>延伸 Mouboussin and Callahan (2024) 对头部三大股的分析至更宽的头部集中度谱系（100/50/10/1只），并明确指出近年头部股跑赢是&quot;非典型&quot;现象。</li>\n<li>用5000次蒙特卡洛模拟量化窄随机组合跑赢/跑输指数的概率及其时间序列变化，为&quot;继承少量个股要不要卖出换指数基金&quot;这一现实决策提供概率依据。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>纯描述性实证研究，不构成可直接交易的策略或信号，无样本外预测、无统计显著性检验（t值等），也未做多重检验/数据窥探控制。</li>\n<li>完全不考虑交易成本和税收，等权组合需要更频繁调仓其小盘股权重带来的摩擦成本被忽略，作者自己也提示这会侵蚀等权组合的表观优势。</li>\n<li>仅限标普500成分股，结论对其他市场/更广基准（如罗素3000、全市场）的外推性未知。</li>\n<li>&quot;退市收益转投国库券&quot;的假设是一种简化处理，实际投资者行为（继续持有兼并方股票、再投资其他资产等）会有差异。</li>\n<li>头部股票近年的强势表现高度依赖苹果等极少数个股，样本内头部股票身份也随时间剧烈变动（IBM→GE→埃克森美孚→苹果），结论对&quot;未来头部股是否继续跑赢&quot;没有预测力，作者本人也强调这是atypical。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>:核心是标普500历年成分股名单+月度收益+市值+退市收益，CRSP为付费数据源；国内可用万得/Wind、Bloomberg 或天软的标普成分历史与月度收益近似替代，公开可得性中等。</li>\n<li><strong>方法清晰度</strong>:方法本身极其简单（买入持有复合收益计算+排序+蒙特卡洛抽样），描述清楚，容易照搬实现。</li>\n<li><strong>计算成本</strong>:很低，无需模型训练，5000次蒙特卡洛抽样在个人电脑上即可秒级完成。</li>\n<li><strong>综合评分</strong>:★2.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>不复现。理由：这是一篇偏学术/科普性质的实证观察报告，核心结论（被动持有 do-nothing 组合长期收益接近指数、等权略优于市值加权、头部集中策略长期跑输但近年反常跑赢、随机窄组合跑赢概率低于50%）均为已知的资产定价常识（小盘股效应、集中度风险）在新样本上的再验证，不涉及可直接转化为交易信号或组合构建规则的新方法论。可作为理解&quot;指数集中度&quot;&quot;被动vs主动再平衡&quot;背景知识的参考读物，暂无复现必要。</p>"}, {"key": "JWKSTW4H", "title": "Rethinking Trend Following: Optimal Regime-Dependent Allocation", "year": "2026", "authors": "Valeriy Zakamulin", "tags": ["Trend Following", "Market Regimes", "Optimal Portfolio Choice", "Regime-Dependent Allocation", "Tactical Asset Allocation", "Time-Series Momentum"], "venue": "", "abstract": "We propose a simple and transparent theoretical framework for optimal regime-dependent allocation in trend-following strategies. While the existing literature on time-series momentum and related approaches focuses primarily on signal construction, portfolio exposures are typically imposed exogenously. In contrast, we treat detected market regimes as conditioning information and derive regime-specific asset exposures directly from a Sharpe-ratio maximization problem. The resulting allocation rule is fully tractable, applies to an arbitrary number of market regimes, and nests standard trend-following strategies as special, and generally suboptimal, cases. Using U.S. equity portfolios, international equity indices, and a broad set of diversified portfolio datasets, we show that optimal regime-dependent allocation delivers economically meaningful and robust improvements in out-of-sample risk-adjusted performance relative to the time-series momentum strategy of Moskowitz, Ooi, and Pedersen (2012) and the dynamic speed momentum strategy of Goulding, Harvey, and Mazzoleni (2023). These gains persist across assets and portfolio implementations, highlighting the central role of optimal positioning in trend following.", "url": "https://papers.ssrn.com/abstract=6376479", "date_added": "2026-05-24", "summarized": true, "rating": "★4.5", "starred": false, "repro": "已复现", "summary_html": "<h1>Rethinking Trend Following: Optimal Regime-Dependent Strategy Weights</h1>\n<p>&gt; Zotero Key: <code>JWKSTW4H</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Zakamulin, Valeriy</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: SSRN Working Paper</li>\n<li><strong>DOI</strong>: —</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=5290578</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/MB5PDRY4/Zakamulin - 2026 - Rethinking Trend Following...pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：经典趋势跟踪在牛市持多 +1、熊市持空 -1 的二元开关是次优的——不同政体的预期收益与波动率不同，最优暴露应按政体加权。</li>\n<li><strong>方法</strong>：用 HMM 识别 $S$ 个政体并估计各政体 $\\mu_s$、$\\sigma_s^2$，通过无条件 Sharpe 最大化推导出最优政体权重的闭合解 $w_s^*\\propto \\mu_s/(\\sigma_s^2+\\mu_s^2)$（OPT），并扩展至两状态/四状态，与 TSM、DSM 对比。</li>\n<li><strong>结论</strong>：OPT 相比 TSM 在美国（+0.15 至 +0.23）及 14 个国际市场（平均 +0.241）均显著提升 Sharpe；熊市最优权重几乎从不为 -1（做空损害 Sharpe），四状态 OPT 进一步超越两状态、且在所有市场优于 DSM。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>经典趋势跟踪在牛市持多 +1、熊市持空 -1（或持空/持现金 0）。但这种二元开关是次优的：不同政体的预期收益与波动率不同，最优暴露应按政体加权而非简单切换。本文用 Sharpe 最大化的闭合解回答&quot;各政体最优权重是多少&quot;，并实证检验该框架能否系统性地超越 TSM。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 美国股票（Kenneth French 数据库）；14 个国际市场指数</li>\n<li><strong>频率</strong>: 月度</li>\n<li><strong>样本区间</strong>: 美国 1926 年 7 月–2025 年 12 月；国际市场 1975 年 1 月–2025 年 12 月</li>\n<li><strong>数据来源</strong>: Kenneth French 数据库；MSCI 国际指数</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>政体识别</strong>: 用隐马尔可夫模型（HMM）识别 $S$ 个政体，每个政体 $s$ 对应估计的均值 $\\mu_s$、方差 $\\sigma_s^2$。</p>\n<p><strong>最优权重推导</strong>:</p>\n<p>在给定各政体权重 $w_s \\in [-1, 1]$ 下，无条件 Sharpe 最大化。</p>\n<p>闭合解（比例形式）:</p>\n<p>$$w_s^* \\propto \\frac{\\mu_s}{\\sigma_s^2 + \\mu_s^2} = \\frac{m_s}{q_s}$$</p>\n<p>其中 $q_s = \\sigma_s^2 + m_s^2$（即政体 $s$ 的二阶矩）。</p>\n<p><strong>归一化</strong>: 以最高正权重政体设 $w = 1$，其余政体按比例缩放，确保最大暴露为 1。</p>\n<p><strong>两状态（牛/熊）结果</strong>: 熊市最优权重通常在 $[0, +0.31]$，几乎从不取 -1——说明做空是次优的。</p>\n<p><strong>四状态（牛/调整/熊/反弹）</strong>: 进一步分化，对 Goulding et al. (2023) 的 DSM 有额外改进。</p>\n<p><strong>对比基准</strong>: Buy &amp; Hold、TSM（$w \\in \\{-1, +1\\}$）、DSM（$w \\in \\{0, +1\\}$ 或特定政体权重）。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>美国市场（两状态）</strong>: OPT vs TSM，Sharpe 提升约 +0.15 至 +0.23。</li>\n<li><strong>14 个国际市场平均</strong>: OPT vs TSM，Sharpe 平均提升 +0.241。</li>\n<li>熊市最优权重几乎从不为 -1，做空往往损害 Sharpe（熊市波动率极高，抵消了方向收益）。</li>\n<li>四状态 OPT 进一步超越两状态 OPT；反弹政体（熊转牛）权重通常最高。</li>\n<li>在所有测试市场中，OPT 的 Sharpe 均优于 DSM。</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次给出趋势跟踪政体权重的<strong>闭合解</strong>，不需要数值优化。</li>\n<li>理论上证明二元 ±1 权重是次优的，并量化了损失。</li>\n<li>将框架从两状态扩展至四状态，覆盖市场周期全貌。</li>\n<li>在跨越近百年的美国数据及多个国际市场中验证结论。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>政体由 HMM 识别，参数估计存在不确定性（均值估计噪声大）。</li>\n<li>闭合解依赖政体参数的精确估计，实盘中政体转换存在滞后。</li>\n<li>权重计算基于历史均值/方差，在分布不稳定的商品期货中泛化性待验证。</li>\n<li>样本以月度股权为主，商品/债券等多资产的适用性未直接检验。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: Kenneth French 库公开；国际 MSCI 数据需 Bloomberg/Wind，中国商品期货需天软。</li>\n<li><strong>方法清晰度</strong>: 闭合解公式完整，HMM 用标准库（hmmlearn）即可实现。</li>\n<li><strong>计算成本</strong>: 低，月度频率，HMM 收敛快。</li>\n<li><strong>综合评分</strong>: ★4.5</li>\n</ul>\n<h2>复现备注</h2>\n<p><strong>最小可行版本</strong>:</p>\n<p>1. 用 hmmlearn 对单个品种（如 IF 股指期货）拟合两状态 HMM（月度收益）。</p>\n<p>2. 计算各政体的 $\\mu_s$、$\\sigma_s^2$，代入闭合解得 $w_s^*$。</p>\n<p>3. 与现有 TSM 信号的等权 ±1 切换做回测对比。</p>\n<p>关键风险：政体参数估计不稳定；建议用扩展窗口（expanding window）而非滚动窗口避免过拟合。</p>\n<p>对接路径: <code>（内部研究目录）</code></p>"}, {"key": "HPFM2DPL", "title": "Reinforcement Learning for Risk-Sensitive Investment Management: a Free Energy--Entropy Duality Approach", "year": "2026", "authors": "Sebastien Lleo, Wolfgang Runggaldier", "tags": ["Quantitative Finance - Portfolio Management", "Mathematics - Optimization and Control"], "venue": "", "abstract": "This paper develops a reinforcement-learning approach to continuous-time risk-sensitive benchmarked asset allocation in a partly model-based setting. The benchmarked problem does not directly fit the standard Markovian stochastic-control template: the state is uncontrolled, whereas the terminal reward contains a controlled Itô integral. We use free energy-entropy duality to reformulate the problem as a linear-quadratic-Gaussian stochastic differential game under an equivalent probability measure, yielding explicit finite- and infinite-horizon saddle-point solutions. This structure guides a continuous-time $q$-learning actor-critic method: the quadratic value function motivates the critic, while the affine saddle-point controls motivate deterministic actors for the portfolio allocation and adversarial control. The learned allocation admits an economic interpretation through fractional Kelly decompositions. A proof-of-concept implementation calibrated to U.S. equity data shows that the actors learn the optimal policy with high accuracy and reveals a favorable asymmetry: the portfolio actor receives a cleaner learning signal than the auxiliary adversarial actor.", "url": "http://arxiv.org/abs/2606.20903", "date_added": "2026-06-23", "summarized": true, "rating": "★2.5", "starred": false, "repro": "—", "summary_html": "<h1>Reinforcement Learning for Risk-Sensitive Investment Management: a Free Energy–Entropy Duality Approach</h1>\n<p>&gt; Zotero Key: <code>HPFM2DPL</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>:Sébastien Lleo (NEOMA Business School), Wolfgang Runggaldier (University of Padova / Institut Louis Bachelier)</li>\n<li><strong>年份</strong>:2026</li>\n<li><strong>出处</strong>:arXiv preprint (q-fin.PM)</li>\n<li><strong>DOI</strong>:10.48550/arXiv.2606.20903</li>\n<li><strong>链接</strong>:http://arxiv.org/abs/2606.20903</li>\n<li><strong>本地 PDF</strong>:<code>~/Developer/Zotero/storage/A4FUNM4Q/Lleo和Runggaldier - 2026 - Reinforcement Learning for Risk-Sensitive Investment Management a Free Energy--Entropy Duality Appr.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：连续时间风险敏感基准化资产配置中模型参数极难精确估计，且标准RL模板因受控伊藤积分而不适用</li>\n<li><strong>方法</strong>：自由能-熵对偶重构为LQG随机微分博弈 + 连续时间$q$-learning actor-critic算法</li>\n<li><strong>结论</strong>：算法高精度恢复解析鞍点策略，组合actor学得几乎精确，支持分数Kelly三基金分解（Kelly+基准跟踪+跨期对冲），权重仅由风险敏感参数$\\theta$决定</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>连续时间资产配置通常假设投资者已知或能精确估计模型参数(预期收益、因子暴露、协方差),但实践中这些极难估准,估计误差会严重扭曲最优组合。强化学习提供了一条从数据学策略、减少对精确模型依赖的互补路径。但风险敏感的<strong>基准化</strong>配置问题不直接套用标准马尔可夫随机控制模板:状态过程不受控,而终端奖励里含一个<strong>受控的伊藤积分</strong>(组合相对基准的对数超额收益),期望下不消失。本文要解决:如何把这类问题转化为可学习、可解释的 RL 框架。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>:美股 ETF 配置问题,$m=13$ 只 ETF(11 只跟踪 S&amp;P 500 GICS 行业,可复制 S&amp;P 500;另加 iShares S&amp;P 400 中盘 IJH 与 S&amp;P 600 小盘 IJR)</li>\n<li><strong>基准</strong>:90% S&amp;P 500 + 10% S&amp;P 400</li>\n<li><strong>因子</strong>:六因子(Fama-French 五因子 + Carhart 动量)</li>\n<li><strong>频率</strong>:日频,$\\Delta t = 1/252$,$\\mathcal{T}=1644$ 个观测</li>\n<li><strong>样本区间</strong>:2018-06-20 至 2024-12-31(GICS 行业修订后最早可得日,涵盖 2019 上涨、2020 新冠崩盘与反弹)</li>\n<li><strong>数据来源</strong>:因子与货币市场收益来自 Kenneth French 数据库;ETF 收益来自 CRSP。注意:实现是用解析模型<strong>模拟</strong>数据来训练,属概念验证而非全 model-free</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[风险敏感基准化配置问题&lt;br/&gt;状态不受控+终端含受控伊藤积分] --&gt; B[自由能-熵对偶&lt;br/&gt;换等价测度]\n  B --&gt; C[LQG 随机微分博弈&lt;br/&gt;极小化:组合 H / 极大化:对抗 Γ]\n  C --&gt; D[Bellman-Isaacs PDE&lt;br/&gt;值函数二次型 + 仿射鞍点策略]\n  D --&gt; E1[有限期解&lt;br/&gt;Riccati 方程 Q,q,k]\n  D --&gt; E2[无限期/遍历解&lt;br/&gt;代数 Riccati + 长期值 ρ]\n  E1 &amp; E2 --&gt; F[结构指导参数化:&lt;br/&gt;critic 二次型值函数 / actor 仿射策略]\n  F --&gt; G[连续时间 q-learning&lt;br/&gt;actor-critic 鞅正交条件]\n  G --&gt; H[组合策略 h* + 对抗策略 γ*]\n  H --&gt; I[分数 Kelly 分解:&lt;br/&gt;Kelly + 基准跟踪 + 跨期对冲]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>市场模型</strong>:$m$ 个风险资产价格 $dS_s = \\mathrm{diag}(S_s)[(a_s+A_sX_s)ds + \\Sigma_s dW_s]$,因子(状态)过程 $dX_s=(b_s+B_sX_s)ds+\\Lambda_s dW_s$,基准 $L$ 类似。组合的对数价格相对 $R_s=\\ln(V_s/L_s)$ 度量相对基准的累计超额。</p>\n<p>2. <strong>风险敏感准则</strong>:最大化 $J_T(H,\\theta)=-\\tfrac{1}{\\theta}\\ln \\mathbf{E}[e^{-\\theta(R_T-R_0)}]$,$\\theta$ 为风险敏感参数(主要关注 $\\theta&gt;0$)。</p>\n<p>3. <strong>自由能-熵对偶</strong>:把上式重写为等价测度 $\\mathbb{P}^\\Gamma$ 下的极小极大:</p>\n<p>$$\\inf_H I_T(H,\\theta)=\\exp\\Big\\{\\inf_H \\sup_\\Gamma \\mathbf{E}^{\\mathbb{P}^\\Gamma}\\big[\\theta\\!\\int_0^T g(s,X_s,h_s,\\gamma_s;\\theta)ds\\big]\\Big\\}$$</p>\n<p>其中 $\\Gamma$ 是通过 Girsanov 引入测度变换的&quot;对抗&quot;控制。这把风险敏感控制变成<strong>两人零和随机微分博弈</strong>。</p>\n<p>4. <strong>LQG 博弈求解</strong>:对应 Bellman-Isaacs PDE 的值函数是状态的二次型 $u(t,x)=-\\theta(\\tfrac12 x&#x27;Q_tx+q_t&#x27;x+k_t)$,其中 $Q_t$ 解矩阵 Riccati 方程、$q_t$ 解线性 ODE、$k_t$ 由积分给出;最优组合 $\\hat h$ 与对抗 $\\hat\\gamma$ 均为状态的<strong>仿射</strong>函数(显式鞍点)。</p>\n<p>5. <strong>无限期/遍历扩展(第 3 节)</strong>:常系数下 Riccati 系统收敛到代数 Riccati 方程,给出相对值函数与长期标量值 $\\rho$,适合机构&quot;持续经营、长期风险调整收益&quot;的设定。</p>\n<p>6. <strong>连续时间 actor-critic(第 4 节)</strong>:沿 Jia-Zhou 的连续时间 RL 鞅方法。值函数二次型 → critic 参数化;仿射鞍点 → actor 参数化(确定性 Markov 策略);定义连续时间 action-value $q$,用鞅正交条件构造半梯度 TD 更新。critic 用 TD 残差更新,两个 actor(组合 $h$ 用确定性策略梯度下降、对抗 $\\gamma$ 上升)用 $q$ 的 action-梯度更新(Algorithm 1,在线 on-policy)。</p>\n<p>7. <strong>可解释性——分数 Kelly 分解(第 4.5 节)</strong>:学到的配置可分解为三只基金的固定组合:</p>\n<p>$$h^*(s,X_s)=f\\,h^K + (1-f)h^{\\text{Bench}} - (1-f)h^{\\text{IHP}},\\quad f=\\tfrac{1}{\\theta+1}$$</p>\n<p>即 Kelly 组合 + 基准跟踪组合 + 跨期对冲组合(IHP),相对权重只取决于已知的风险敏感度 $\\theta$,使 RL 输出有经济解释。</p>\n<p>8. <strong>概念验证实现(第 5 节)</strong>:固定遍历相对值函数为解析形式,critic 只学 actor 相关的 $q$ 梯度($M_h, M_\\gamma$ 用递归最小二乘),用解析模型模拟的标准化动态生成数据,检验 actor-critic 能否从零学到解析最优策略。R 语言实现。</p>\n<p>9. <strong>输出</strong>:学到的组合策略 $h^*$(经济相关的可交易配置)与对抗策略 $\\gamma^*$。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>算法能以<strong>高精度</strong>恢复解析鞍点最优策略,验证了&quot;用博弈结构指导 actor/critic 参数化&quot;的可行性。</li>\n<li>发现一个有利的<strong>结构不对称</strong>:组合 actor(策略梯度 critic)学得几乎精确,而对抗 actor 因对抗控制进入状态转移而保留小的残差误差。由于组合配置才是经济上相关的控制,这种不对称对资产管理应用是好事。</li>\n<li>Kelly 组合对应风险中性极限($\\theta\\to 0$),基准化配置呈分数 Kelly 形式;三基金分解的相对权重仅由 $\\theta$ 决定,可在有限额外算力下让 RL 输出可解释(基准跟踪组合 = 用资产对冲基准的最小方差对冲比,可由序贯多元回归在线估计)。</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>把自由能-熵对偶用作 RL 的桥梁:将风险敏感基准化控制等价转成 LQG 随机微分博弈,从而获得二次值函数 + 仿射策略的精确结构来设计 critic/actor。</li>\n<li>在连续时间 RL 中采用<strong>确定性</strong>策略(而非探索型随机策略),探索通过 behavior policy 引入。</li>\n<li>同时给出 episodic(有限期)与 continuing(遍历)两套 RL 形式,后者贴合机构长期投资。</li>\n<li>用分数 Kelly 三基金分解解决 RL 在投资管理中&quot;难以向客户/监管解释&quot;的痛点。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>本质是<strong>理论 + 概念验证</strong>论文:实现用解析模型模拟数据训练,并非真正 model-free,也未在真实市场数据上做样本外回测或与基准策略比较收益/夏普。</li>\n<li>强依赖 LQG 线性高斯假设(收益对因子线性、常系数遍历设定),真实市场的非线性、厚尾、状态依赖波动不在框架内。</li>\n<li>对抗 actor 的残差误差与一般非 LQG 情形下的收敛性未充分讨论。</li>\n<li>没有交易成本、容量、做空约束等实务摩擦。</li>\n<li>风险敏感参数 $\\theta$ 的选取、参数估计误差对学习结果的影响未系统评估。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>:好(因子来自 Kenneth French 公开库,ETF 来自 CRSP),但论文本身用模拟数据,真实数据复现需自行搭建。</li>\n<li><strong>方法清晰度</strong>:数学推导完整(Riccati、鞍点、算法伪代码齐全),但偏理论;把它落成稳定的真实数据 RL 系统需要大量额外工程与调参。</li>\n<li><strong>计算成本</strong>:概念验证算力低(R 实现、模拟数据),但若扩展到 model-free、真实数据、多客户场景则成本上升。</li>\n<li><strong>综合评分</strong>:★2.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>不建议作为优先复现对象:这是一篇连续时间随机控制 + RL 的理论方法论文,实证仅为模拟数据的概念验证,缺乏真实市场样本外业绩,直接落地为可交易策略的距离较远。若要借鉴,价值点在两处:① <strong>分数 Kelly 三基金分解</strong>(Kelly + 基准跟踪 + 跨期对冲)作为可解释的基准化配置框架,可独立于 RL 使用;② 把风险敏感目标转成对偶博弈的建模思路。最小验证版可先在合成 LQG 因子模型上复现解析 Riccati 解与 Algorithm 1 的收敛性,确认 actor-critic 能恢复鞍点,再评估是否值得投入真实数据扩展。属理论参考类,复现优先级低。</p>"}, {"key": "ZR5X4JYK", "title": "Regime-Aware Asset Allocation with Dual-Regime Signals and Regime-Dependent Asset Selection", "year": "2026", "authors": "Yirui Luo, John M. Mulvey", "tags": ["SSRN", "John M. Mulvey", "Regime-Aware Asset Allocation with Dual-Regime Signals and Regime-Dependent Asset Selection", "Yirui Luo"], "venue": "", "abstract": "Prior studies in regime-aware asset allocation typically focus on either global market-wide regimes or asset-specific regimes in isolation. However, effective multi-asset allocation requires capturing the interactions and heterogeneity across both market-wide and asset-level dynamics. To address this gap, the authors propose a systems-oriented dual-regime allocation framework with two main contributions. First, it integrates separately estimated global and asset-specific regime signals within a unified allocation framework. Second, it converts interactions between the two regime layers into time-varying, regime-dependent asset universes that adapt to changing markets. The proposed framework consists of three linked components: regime identification, regime forecasting, and regime-dependent portfolio construction. Statistical Jump Models identify global and assetspecific regimes; XGBoost classifiers forecast next-period regimes; and the joint regime forecasts define two dynamic investable universes: Bear-Market Defensive Assets (BMDA) and Bull-Market Growth Assets (BMGA). Empirical results for a multi-asset portfolio from 1990 to 2025 show that the dual-regime framework outperforms classical regime-switching benchmarks by improving downside resilience and cross-regime diversification through adaptive BMDA/BMGA asset selection.", "url": "https://papers.ssrn.com/abstract=6933278", "date_added": "2026-07-10", "summarized": true, "rating": "★4.0", "starred": false, "repro": "待复现", "summary_html": "<h1>Regime-Aware Asset Allocation with Dual-Regime Signals and Regime-Dependent Asset Selection</h1>\n<p>&gt; Zotero Key: <code>ZR5X4JYK</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>:Yirui Luo, John M. Mulvey</li>\n<li><strong>年份</strong>:2026</li>\n<li><strong>出处</strong>:SSRN</li>\n<li><strong>DOI</strong>:—</li>\n<li><strong>链接</strong>:https://papers.ssrn.com/abstract=6933278</li>\n<li><strong>本地 PDF</strong>:<code>~/Developer/Zotero/storage/MUIDLLXA/Luo和Mulvey - 2026 - Regime-Aware Asset Allocation with Dual-Regime Signals and Regime-Dependent Asset Selection.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>:传统 regime-aware 资产配置只单独建模&quot;全局市场regime&quot;或&quot;单资产regime&quot;，无法同时捕捉市场整体状态与各资产在该状态下的异质表现，且经典 0/1 切换策略往往把防御仓位死板地押注单一资产（如无风险资产/国债/黄金），在该资产失效时（如 2022 加息周期）无法分散风险。</li>\n<li><strong>方法</strong>:用 Statistical Jump Model（SJM）分别识别&quot;全局&quot;和&quot;资产专属&quot;两层牛熊 regime，再用 XGBoost 对两层 regime 做次日预测，并将预测结果交叉映射为两个动态资产池——熊市防御资产池 BMDA（全局熊市+该资产自身仍牛）与牛市成长资产池 BMGA（全局牛市+该资产自身也牛），最后用等权配置这两个动态资产池构建组合，滚动8年训练/2年验证/3个月测试。</li>\n<li><strong>结论</strong>:0/1 BMDA-BMGA 策略 2000–2025 年样本外年化超额收益 15.2%，Sharpe 1.43（对比 SP500 Buy-and-Hold 的 7.7% / 0.40，经典 0/1 RiskFree-SP500 的 9.5% / 0.85），最大回撤仅 -17.7%（vs Buy-and-Hold -55.3%）；相对 CalPERS 75/25 基准的信息比率达 0.81，全局熊市期间下行捕获率 DCR 仅 0.05（几乎不参与下跌）。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>现有 regime-aware 配置文献要么只用全局市场 regime（如用 S&amp;P500 做趋势过滤识别牛熊），要么只研究单资产的 regime 行为，两者割裂：全局 regime 能反映&quot;风险开/关&quot;环境但忽视资产间的截面异质性；资产专属 regime 能描述单个资产自身状态但不知道该资产在当前宏观环境下是否值得配置。此外，经典 0/1 regime-switching 策略（熊市全仓无风险资产、牛市全仓权益）依赖静态单资产切换，一旦该防御资产本身失效（如 2022 年国债和黄金同时下跌的加息周期），组合就失去缓冲。论文试图用&quot;双层 regime 交叉&quot;的方式，构造随时间变化、能感知市场环境的动态资产池，替代静态单资产切换。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>:10 个风险资产（美股大/中/小盘、发达市场除美 EAFE、美国国债、高收益债、公司债、REIT、大宗商品、黄金）+ 1 个无风险资产（3个月美国国债收益率）</li>\n<li><strong>频率</strong>:日频</li>\n<li><strong>样本区间</strong>:1990–2025（滚动训练从1990年起，样本外测试 2000–2025）</li>\n<li><strong>数据来源</strong>:Bloomberg Terminal（风险资产日收益）、FRED（无风险利率代理）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[资产universe: 10风险资产+1无风险资产&lt;br/&gt;日收益率] --&gt; B1[全局特征构造&lt;br/&gt;S&amp;P500收益衍生12维]\n  A --&gt; B2[各资产专属特征构造&lt;br/&gt;逐资产收益衍生12维]\n  B1 --&gt; C1[Statistical Jump Model&lt;br/&gt;全局牛熊regime识别]\n  B2 --&gt; C2[Statistical Jump Model&lt;br/&gt;资产专属牛熊regime识别]\n  C1 --&gt; D1[标签滞后一天]\n  C2 --&gt; D2[标签滞后一天]\n  D1 --&gt; E1[XGBoost分类器&lt;br/&gt;预测次日全局regime]\n  D2 --&gt; E2[XGBoost分类器&lt;br/&gt;预测次日资产专属regime]\n  A --&gt; F[综合特征集&lt;br/&gt;+VIX/利差/股债相关性等宏观变量]\n  F --&gt; E1\n  F --&gt; E2\n  E1 --&gt; G{全局预测regime}\n  E2 --&gt; H{资产专属预测regime}\n  G --&gt;|全局熊+资产牛| I[BMDA池&lt;br/&gt;熊市防御资产]\n  G --&gt;|全局牛+资产牛| J[BMGA池&lt;br/&gt;牛市成长资产]\n  H --&gt; I\n  H --&gt; J\n  I --&gt; K[63日EWMA平滑&lt;br/&gt;降低换手]\n  J --&gt; K\n  K --&gt; L[等权配置&lt;br/&gt;熊市配BMDA/牛市配BMGA]\n  L --&gt; M[组合权重/回测]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>输入</strong>：10 个风险资产 + 1 个无风险资产的日收益率序列，1990–2025。</p>\n<p>2. <strong>特征工程（两套特征集）</strong>：识别阶段用&quot;极简特征集&quot;（每资产 12 维：平均收益、下行标准差、Sortino 比率，各配 1/5/10/21 日半衰期 EWMA），只用收益信息避免噪声；预测阶段用&quot;综合特征集&quot;（23 维，在极简特征基础上加入 VIX、天然气价格（CPI 代理）、10Y-2Y 与 10Y-3M 期限利差、252 日滚动股债 beta 等宏观变量），所有宏观特征做实时可得性滞后处理防止未来函数。</p>\n<p>3. <strong>Step 1 - Regime 识别（无监督 SJM）</strong>：对全局特征（以 S&amp;P500 为代理）和每个资产的专属特征分别拟合两状态 Statistical Jump Model，优化目标为</p>\n<p>   $$\\min_{\\{\\theta_k\\},\\{s_t\\}} \\sum_{t}\\|x_t-\\theta_{s_t}\\|_2^2 + \\lambda\\sum_t \\mathbf{1}\\{s_{t-1}\\neq s_t\\}$$</p>\n<p>   其中跳跃惩罚项 $\\lambda$ 抑制过频切换，用坐标下降 + 动态规划求解，得到全局标签 $s_t^\\star$ 和各资产专属标签 $s_{i,t}^\\star$。</p>\n<p>4. <strong>Step 2 - Regime 预测（有监督 XGBoost）</strong>：把 SJM 得到的 in-sample 标签整体滞后一天作为训练目标，用综合特征集训练 XGBoost 分类器预测次日全局 regime 和次日各资产专属 regime，预测概率超过 0.7 阈值才触发状态切换（高于常规 0.5 以降低误判和过度换手）。</p>\n<p>5. <strong>动态资产池构造</strong>：BMDA（Bear-Market Defensive Assets）= 全局预测为熊 且 该资产专属预测为牛 的资产集合（若无资产满足则退化为纯 RiskFree）；BMGA（Bull-Market Growth Assets）= 全局预测为牛 且 该资产专属预测也为牛 的资产集合。再用 63 交易日回看窗口做指数衰减加权平滑（式 12），使入选资产呈连续区块而非零散跳变，降低换手。</p>\n<p>6. <strong>滚动训练与调参</strong>：8 年训练 + 2 年验证 + 3 个月样本外测试的滚动窗口（从 1990 训练、1998 验证、2000 起测试，每季度滚动），跳跃惩罚 $\\lambda\\in[1,100]$ 网格搜索，用验证期换手调整后 Sharpe 选最优值，再在训练+验证合并窗口上重新拟合，应用于样本外测试窗口。</p>\n<p>7. <strong>组合构建</strong>：以经典 0/1 RiskFree-SP500 为基准，扩展出单资产防御对冲（熊市切国债或黄金）和多资产 regime 相关配置（熊市等权 BMDA、牛市等权 BMGA）两条路线；交易成本按单边 10bp 计入。</p>\n<p>8. <strong>输出</strong>：每期的资产配置权重（0/1 BMDA-BMGA 组合），可直接转化为可交易信号。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>绝对表现（2000–2025 样本外）</strong>：0/1 BMDA-BMGA 年化超额收益 15.2%，超额波动 10.7%，Sharpe 1.43，Calmar 1.02，最大回撤 -17.7%；相较经典 0/1 RiskFree-SP500（超额收益 9.5%、Sharpe 0.85、MDD -16.2%）和 SP500 Buy-and-Hold（7.7%、0.40、-55.3%）显著更优。</li>\n<li><strong>分 regime 表现</strong>：BMDA-BMGA 在全局牛市 Sharpe 1.58、熊市 Sharpe 1.31，均高于其他策略；单资产对冲策略（Gold-SP500、Treasury-SP500）虽提升收益但因押注单一防御资产在极端熊市（如2022加息周期）回撤更大（MDD 达 -34%~-36%）。</li>\n<li><strong>主动表现（对 CalPERS 75/25 基准）</strong>：BMDA-BMGA 整体信息比率 0.81（牛市 1.03、熊市 0.90），上行捕获率 UCR 全局牛市 1.01（几乎完全参与上涨），下行捕获率 DCR 全局熊市 -0.18（几乎不参与下跌）。</li>\n<li><strong>XGBoost 预测准确率</strong>：全局 regime 预测 accuracy 0.666、ROC-AUC 0.70；各资产专属预测 accuracy 0.64–0.83、ROC-AUC 0.56–0.76。</li>\n<li><strong>资产池组成规律</strong>：BMDA 中国债/黄金/公司债占比高但随时间变化（Treasury 选中频率从 2000–2012 的 85.2% 降至 2013–2025 的 36.4%，Gold 则从 13% 升至 40.2%）；权益类资产几乎从不进入 BMDA，说明 regime 过滤能有效剔除熊市中的顺周期高风险资产。</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次将&quot;全局市场 regime&quot;与&quot;资产专属 regime&quot;两层信号在统一框架内交叉，而非孤立建模。</li>\n<li>提出把两层 regime 的交互直接转化为动态可投资资产池（BMDA/BMGA），而非停留在 regime 识别/预测本身。</li>\n<li>用等权配置隔离&quot;资产选择&quot;和&quot;组合优化&quot;两个价值来源，第一层评估更透明、抗估计误差。</li>\n<li>特征工程上区分&quot;识别用极简特征&quot;和&quot;预测用综合特征&quot;，避免功能重叠。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>等权配置是刻意选择的简化基线，未做协方差/预期收益优化，实际可实现收益上限尚待用优化器验证（作者称留待后续用强化学习扩展）。</li>\n<li>SJM 与 XGBoost 的组合流程有多个超参数（跳跃惩罚 $\\lambda$、切换阈值 0.7、平滑窗口 63 日），论文虽做了部分敏感性分析（附录），但整体流程复杂度较高，容易过拟合样本内regime划分。</li>\n<li>资产universe仅 10 个大类资产，样本区间覆盖 1990–2025 但资产数量有限，跨资产类别的可扩展性未知。</li>\n<li>交易成本仅按 10bp 单边估算，未考虑不同资产流动性差异（如 REIT、高收益债的真实冲击成本可能更高）。</li>\n<li>XGBoost 预测准确率中等（部分资产 ROC-AUC 仅 0.56），预测阶段噪声可能被后续平滑层部分掩盖，实际样本外表现对切换阈值和平滑窗口选择较敏感。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>:全部为主流公开资产（美股规模指数、EAFE、美国国债、公司债/高收益债 ETF、REIT、商品、黄金），天软/公开数据源均可获取日频收益，VIX、期限利差、天然气价格等宏观变量也是标准公开数据。</li>\n<li><strong>方法清晰度</strong>:论文给出完整的 SJM 优化目标式（式7、8）、XGBoost 训练细节、BMDA/BMGA 构造公式（式9-12）及滚动训练算法伪代码（Algorithm 1、2），复现路径清晰。</li>\n<li><strong>计算成本</strong>:SJM 需要坐标下降+动态规划求解，XGBoost 训练量不大（10+9 个分类器 × 每季度滚动），整体计算量中等，单机可行，不需要重型算力。</li>\n<li><strong>综合评分</strong>:★4.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>方法论清晰、数据全部可公开获取，是较适合复现的一篇。建议先实现最小可行版本：仅用价格数据构造极简特征集 + SJM 识别双层 regime（可先固定 $\\lambda$，跳过网格搜索），验证 regime 标签的经济意义（是否对齐历史危机期）；再加入 XGBoost 预测层和 BMDA/BMGA 动态池构造，最后对比等权 BMDA-BMGA 与经典 0/1 RiskFree-SP500 的样本外表现。核心风险点：滚动调参（$\\lambda$ 网格搜索 + 验证期 Sharpe 选优）实现较繁琐，需要严格避免用未来数据泄漏到训练/验证窗口；平滑层（式12）的指数衰减权重实现细节容易出错，建议对照原文公式单元测试。</p>"}, {"key": "589ZKP55", "title": "Regime-Adaptive Continual Learning for Portfolio Management", "year": "2026", "authors": "Chaofan Pan, Lingfei Ren, Linbo Xiong…", "tags": ["Quantitative Finance - Portfolio Management", "Computer Science - Artificial Intelligence"], "venue": "", "abstract": "Financial markets are inherently non-stationary, exhibiting frequent regime shifts and structural changes that render traditional Portfolio Management (PM) approaches ineffective. Existing remedies, such as rolling-window retraining and naive online fine-tuning, are hindered by high computational costs and insufficient knowledge utilization, respectively, resulting in low returns and limited adaptability. Continual learning (CL) offers a promising paradigm by enabling trading agents to accumulate and transfer knowledge across sequential tasks. In this paper, we propose \\textbf{Re}gime-aware \\textbf{C}ontinual \\textbf{A}daptive \\textbf{P}ortfolio management (\\textbf{ReCAP}), a novel framework that integrates CL into PM to address the challenges of dynamic financial environments. ReCAP employs an adaptive regime detection module to segment historical market data into variable-length regimes, enabling regime-specific learning of policy vectors and the construction of a policy library. During continual trading, a regime-gate module adaptively combines policy vectors from the library based on the current market state, facilitating rapid adaptation to newly detected regimes. Only the regime-gate and the current regime's policy vector are continually updated to preserve useful knowledge effectively. Extensive experiments on five real-world datasets demonstrate that ReCAP consistently outperforms popular baselines, achieving superior returns in long-term investment horizons and rapid adaptation to regime shifts.", "url": "http://arxiv.org/abs/2606.00143", "date_added": "2026-06-26", "summarized": true, "rating": "★4.0", "starred": false, "repro": "待复现", "summary_html": "<h1>Regime-Adaptive Continual Learning for Portfolio Management</h1>\n<p>&gt; Zotero Key: <code>589ZKP55</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Chaofan Pan, Longbing Cao, Weiqing Liu, Jiang Bian</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: KDD 2026（第32届ACM知识发现与数据挖掘会议，2026年8月9—13日，济州岛）</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2606.00143</li>\n<li><strong>链接</strong>: https://arxiv.org/abs/2606.00143</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/Y32REE7M/Pan 等 - 2026 - Regime-Adaptive Continual Learning for Portfolio Management.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：强化学习组合管理在真实市场中面临分布漂移，单一静态策略无法适应多变市场状态，反复全量重训效率低且会遗忘历史规律。</li>\n<li><strong>方法</strong>：ReCAP 框架——CUSUM 在线检测制度切换、为每段制度微调策略参数存入增量向量库、推理时 softmax 注意力动态合并历史制度策略。</li>\n<li><strong>结论</strong>：在 DOW30/NAS100/SP500/NIKKEI30/COMMODITY_ETF 5 个数据集上全面超越 13 个基线，NAS100 累积收益 164.89%、夏普 1.14，测试期覆盖 2020—2025 多种极端市场。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>强化学习组合管理方法在真实市场中面临分布漂移：单一静态策略无法适应多变市场状态，而反复全量重训效率低且会遗忘历史规律。现有持续学习方法（EWC、Replay等）未针对金融市场的机制切换特性专门设计，导致策略在不同市场阶段泛化能力差。ReCAP 提出&quot;制度感知持续学习&quot;，让模型在不遗忘历史知识的前提下持续适应新制度。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: DOW30（29只）、NAS100（73只）、SP500（398只）、NIKKEI30（29只）、COMMODITY_ETF（7只）</li>\n<li><strong>频率</strong>: 日频</li>\n<li><strong>样本区间</strong>: 2008-05-01 至 2025-04-29；训练期截止 2020-04-30，测试期 2020-05-01 起</li>\n<li><strong>数据来源</strong>: Yahoo Finance</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n    A[历史日收益时序] --&gt; B[ARD 模块\\nCUSUM 在线制度检测]\n    B --&gt; C{检测到制度切换?}\n    C --&gt;|是| D[截取当前制度片段\\n对基础策略 theta_0 微调]\n    C --&gt;|否| E[继续积累当前制度数据]\n    D --&gt; F[策略库 Policy Library\\n存储增量向量 d_j = theta_j - theta_0]\n    F --&gt; G[RGM 模块\\n实时市场编码 m_t]\n    G --&gt; H[Softmax 注意力\\nalpha_t = Softmax g_phi m_t]\n    H --&gt; I[策略组合\\ntheta_t = theta_0 + D tilde alpha_t]\n    I --&gt; J[组合权重输出\\nw_t = Softmax theta_t dot s_t]\n    J --&gt; K[投资组合收益]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>基础策略预训练</strong>: 在完整训练集上用标准深度强化学习（如 PPO/A2C）训练基础策略参数 $\\theta_0$，作为所有历史知识的公共基础。</p>\n<p>2. <strong>ARD（自适应制度检测）模块</strong>: 用 CUSUM（累积和控制图）统计量在线检测均值漂移。当收益序列的累积偏差超过阈值 $h$ 时触发制度切换信号，将时序切分为若干连续制度片段 $[t_j, t_{j+1})$。</p>\n<p>3. <strong>制度级策略微调</strong>: 对每个识别出的制度片段，以 $\\theta_0$ 为初始化，在该片段数据上轻量微调得到制度专属参数 $\\theta_j$，计算增量向量 $d_j = \\theta_j - \\theta_0$；每个 $d_j$ 代表该制度相对基础策略的知识增量。</p>\n<p>4. <strong>策略库（Policy Library）</strong>: 将所有历史制度的增量向量 $\\{d_j\\}_{j=1}^J$ 存成矩阵 $\\tilde{D} = [d_1,\\ldots,d_J]$。库动态扩充，无需删除历史知识。</p>\n<p>5. <strong>RGM（制度门控模块）</strong>: 在推理时刻 $t$，提取实时市场状态特征 $m_t$（包含近期收益、波动率等），通过参数化注意力网络 $g_\\phi$ 计算对库中每个制度策略的相似度权重：</p>\n<p>$$\\alpha_t = \\text{Softmax}(g_\\phi(m_t)) \\in \\mathbb{R}^J$$</p>\n<p>6. <strong>动态策略组合</strong>: 将库中各制度增量按权重加权叠加回基础策略：</p>\n<p>$$\\theta_t = \\theta_0 + \\tilde{D}\\,\\alpha_t$$</p>\n<p>这保证了对历史所有制度知识的软组合，同时仍以基础策略为锚。</p>\n<p>7. <strong>组合权重输出</strong>: 用当前时刻各股票的状态表征 $s_t$（价量特征）与策略向量 $\\theta_t$ 点积后经 Softmax 归一化得到投资权重 $w_t$，执行多头做多组合。</p>\n<h2>核心结论与关键结果</h2>\n<p>在5个数据集的测试期（2020—2025）上与13个基线对比：</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>数据集</th><th>CR（累积收益）</th><th>SR（夏普比）</th><th>MDD（最大回撤）</th></tr>\n<tr><td>NAS100</td><td><strong>164.89%</strong></td><td><strong>1.14</strong></td><td>23.86%</td></tr>\n<tr><td>DOW30</td><td>优于所有基线</td><td>—</td><td>—</td></tr>\n<tr><td>SP500</td><td>优于所有基线</td><td>—</td><td>—</td></tr>\n<tr><td>NIKKEI30</td><td>优于所有基线</td><td>—</td><td>—</td></tr>\n<tr><td>COMMODITY_ETF</td><td>优于所有基线</td><td>—</td><td>—</td></tr>\n</table></div>\n<p>测试期覆盖新冠疫情、2022年加息周期、2023年 AI 行情等多种极端市场状态，ReCAP 在所有制度下均保持竞争力。</p>\n<p><strong>消融实验</strong>（去除各模块影响）：</p>\n<ul>\n<li>去掉 ARD（固定窗口划分）影响最大，印证制度检测的核心价值</li>\n<li>去掉策略库（退化为单策略）次之</li>\n<li>去掉 RGM（均等权重组合）影响最小</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li><strong>三模块解耦设计</strong>：ARD 负责制度边界，策略库负责知识积累，RGM 负责软路由，三者可独立验证与替换。</li>\n<li><strong>增量向量库</strong>：以差值 $d_j=\\theta_j-\\theta_0$ 存储而非完整参数，极大减小库空间并保持对公共基础的可解释偏差。</li>\n<li><strong>制度感知持续学习首次用于组合管理</strong>：系统性解决 DRL 组合管理中的灾难性遗忘与分布漂移问题。</li>\n<li>测试期跨越2020—2025年，是近年公开工作中时间覆盖最丰富之一。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>CUSUM 阈值 $h$ 需人工设定，制度数量和边界对该参数敏感。</li>\n<li>策略库随时间线性增长，长期运行时推理成本上升（$J$ 变大后注意力计算量增加）。</li>\n<li>测试数据来自 Yahoo Finance 未经清洗，价格数据质量和股息处理对结果有影响。</li>\n<li>仅测试做多策略，未考虑做空与杠杆；交易成本假设从简。</li>\n<li>在 COMMODITY_ETF（仅7个标的）上样本量极小，结果稳健性存疑。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: Yahoo Finance 公开可下载，5个数据集标的列表论文附录给出。</li>\n<li><strong>方法清晰度</strong>: 三模块各自描述清晰，Algorithm 伪代码完整，CUSUM 参数给出。</li>\n<li><strong>计算成本</strong>: 需要 GPU 训练 DRL 基础策略，微调轻量；测试期推理极快。</li>\n<li><strong>综合评分</strong>: ★4.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>官方代码已公开：github.com/Dumail/ReCAP。复现路径：先在 DOW30 数据上跑通基础 DRL（PPO）→ 实现 CUSUM 分割 → 制度微调 → 策略库 + RGM。最小可行版本可先固定 CUSUM 阈值跑 NAS100，验证 CR 和 SR 量级是否与论文一致（NAS100 CR=164.89%）。主要风险：DRL 训练随机性较大，结果可能需要多次运行取均值。</p>"}, {"key": "MSGVPZNI", "title": "Pricing Compute Futures: Forward Curve and Volatility for a Non-Storable, Depreciating Commodity", "year": "2026", "authors": "Amine Assody", "tags": ["AI infrastructure", "basis risk", "commodity derivatives", "compute futures", "forward curve", "GPU rental rates", "implied volatility", "jump diffusion", "non-storable commodities", "Schwartz-Smith model"], "venue": "", "abstract": "<p>GPU rental rates are becoming a benchmarked, exchange-traded underlying. In May 2026 CME Group and ICE both announced cash-settled compute futures referencin", "url": "https://papers.ssrn.com/abstract=6926798", "date_added": "2026-06-20", "summarized": true, "rating": "★2.5", "starred": false, "repro": "—", "summary_html": "<h1>Pricing Compute Futures: Forward Curve and Volatility for a Non-Storable, Depreciating Commodity</h1>\n<p>&gt; Zotero Key: <code>MSGVPZNI</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Amine Assody</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: SSRN Working Paper v1.1</li>\n<li><strong>DOI</strong>: —</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=6926798</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/Z7WR3EKF/Assody - 2026 - Pricing Compute Futures Forward Curve and Volatility for a Non-Storable, Depreciating Commodity.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：CME/ICE 即将推出 GPU 算力期货，但传统大宗商品定价工具无法直接使用——算力不可储存、硬件代际贬值、废代事件类似财报日跳跃，需要新的定价框架。</li>\n<li><strong>方法</strong>：Schwartz-Smith 双因子框架 + 调度跳跃扩展——短期偏差 $\\chi$ 均值回归 + 长期均衡 $\\xi$ 负漂移（约 -6%/年）+ 代际跳跃 $J$，推导远期曲线和隐含波动率闭式解。</li>\n<li><strong>结论</strong>：模型预测结构性反向市场（1 年远期约 0.90 倍现货、3 年约 0.68），ATM 隐含波动率从 3 个月 50.3% 降至 3 年 27.5%，发布窗口处有局部隆起；三个可证伪预测供市场验证。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>2026 年 5 月 CME 和 ICE 相继宣布推出以 GPU 日租价指数现金结算的算力期货。传统大宗商品定价工具（现货-期货无套利、持有成本模型）无法直接用于算力期货，因为：① 算力不可储存（空闲算力不可转移），无套利远期定价不成立；② 底层资产（GPU 硬件代际）每代贬值，导致均衡租价系统性下行；③ 废代事件（新硬件上市）按计划到来、幅度不确定，类似股票期权中的财报日；④ 现货均值回归到一个能源成本锚定的下限而非固定值。本文目标：提出最简可用的定价框架，并在市场有历史数据之前给出可被市场验证的预测。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: H100 GPU 小时租价（Silicon Data SDH100RT 混合指数，Ornn Compute Price Index），以及 A100 历史报价（CoreWeave 挂牌价与市场成交价）</li>\n<li><strong>频率</strong>: 日频（指数序列自 2024 年 9 月至 2026 年 6 月）；月度 / 季度节点用于代际跳跃标定</li>\n<li><strong>样本区间</strong>: A100 参考价 2023–2026 年；H100 Blackwell 替换窗口 2024 年 9 月至 2025 年 6 月</li>\n<li><strong>数据来源</strong>: Silicon Data 公开日线序列、Ornn 市场成交记录、各提供商公开挂牌价；无专有数据</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[GPU 日租价现货 S_t] --&gt; B[对数分解&lt;br/&gt;ln S = chi + xi + J]\n  B --&gt; C[短期因子 chi&lt;br/&gt;均值回归至零 速率 kappa&lt;br/&gt;半衰期约3个月]\n  B --&gt; D[长期均衡因子 xi&lt;br/&gt;负漂移 mu_xi 约-6%/年&lt;br/&gt;随机游走]\n  B --&gt; E[代际跳跃 J&lt;br/&gt;集中于公告发布窗口&lt;br/&gt;均值约-0.22对数]\n  C --&gt; F[远期曲线 F t T&lt;br/&gt;闭式解含漂移校正项&lt;br/&gt;和跳跃补偿项 Lambda]\n  D --&gt; F\n  E --&gt; F\n  F --&gt; G[结构性反向市场预测&lt;br/&gt;F 1y ~1.90 F 3y ~1.37]\n  F --&gt; H[Black-76 期权定价&lt;br/&gt;总方差 = 扩散方差 + 跳跃方差]\n  H --&gt; I[隐含波动率期限结构&lt;br/&gt;ATM IV 50.3% 3m 至 27.5% 3y&lt;br/&gt;发布窗口处有局部隆起]</div>\n<h3>步骤详解</h3>\n<p><strong>整体架构</strong>：Schwartz-Smith（2000）双因子框架 + 调度跳跃扩展，以&quot;收益率预期 + 风险溢价&quot;替换无套利定价。</p>\n<p>1. <strong>现货价格分解</strong>：对数现货价格拆成三部分：</p>\n<p>   $$\\ln S(t) = \\chi(t) + \\xi(t) + J(t)$$</p>\n<p>   - $\\chi$：短期偏差，以速度 $\\kappa$（月级半衰期）均值回归至零，捕捉供需紧张与产能摩擦</p>\n<p>   - $\\xi$：长期均衡对数租价，负漂移 $\\mu_\\xi \\approx -6\\%$/年（代际容量扩张推动），自相关随机游走</p>\n<p>   - $J$：在公告的硬件发布窗口内集中发生的跳跃，每窗口一个跳跃事件（确定发生，幅度不确定），跳跃幅度服从均值 $-0.22$、方差从两次完成代际替换标定</p>\n<p>2. <strong>远期曲线闭式解</strong>：因资产不可储存，远期价格为现货的风险中性期望（风险溢价折入漂移）：</p>\n<p>   $$F(t,T) = \\exp\\left(e^{-\\kappa(T-t)}\\chi(t) + \\xi(t) + A(T-t) + \\Lambda(t,T)\\right)$$</p>\n<p>   其中 $A(\\tau)$ 包含双扩散因子的漂移和凸性校正；$\\Lambda(t,T)$ 为跳跃补偿量——在远期曲线经过的每个发布窗口处产生台阶式下降，而非平滑衰减。</p>\n<p>3. <strong>代际跳跃参数标定</strong>：利用两次已完成的代际替换（A100→H100、H100→Blackwell）做事件研究：取替换前后同档位锚点价格的对数差，减去结构漂移贡献，余量归因于代际事件。三次独立测量（$-0.23$、$-0.21$、$-0.22$）高度集中，均值取 $-0.22$（价格层面约 $-20\\%$）。</p>\n<p>4. <strong>期权定价（Black-76）</strong>：期货是可持有的对冲工具（现货不可持有），故用 Black-76 对远期定价。到期选项的总方差为：</p>\n<p>   $$\\text{TotalVar} = \\underbrace{\\text{扩散方差（按均值回归速度衰减）}}_{\\text{随期限延长快速减小}} + \\underbrace{\\text{跳跃方差（窗口内最大）}}_{\\text{窗口过后归零}}$$</p>\n<p>   跳跃方差在发布窗口附近的到期日处产生局部隆起；Poisson 变体（跳跃次数随机）使这些隆起更大，因为计数的不确定性叠加幅度的不确定性。</p>\n<p>5. <strong>三个可证伪预测</strong>（在合约上市前给出）：</p>\n<p>   - <strong>预测一（形状）</strong>：结构性反向市场——远期价格从 $2.60 → $1.90（1 年）→ $1.37（3 年），约每年对数下跌 21%</p>\n<p>   - <strong>预测二（波动率）</strong>：隐含波动率急剧下行期限结构（50.3% @ 3m → 27.5% @ 3y），发布窗口处有局部隆起</p>\n<p>   - <strong>预测三（偏斜）</strong>：偏斜期限结构反转——近端看涨偏斜（消费者担心价格上涨）、远端看跌偏斜（运营商卖出远期对冲边际成本下限）</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>代际跳跃幅度</strong>：跨两代硬件三次独立测量集中在 $-0.22$ 对数单位（$\\approx -20\\%$ 价格），残差漂移约 $-6\\%$/年</li>\n<li><strong>远期曲线形状</strong>：模型预测 1 年期远期 \\$1.90，3 年期 \\$1.37；发布窗口（9 个月、24 个月）处有台阶式下跌（见图 1）</li>\n<li><strong>隐含波动率</strong>：ATM IV 从 3 个月的 50.3% 降至 3 年的 27.5%（约 Brownian scaling 的 1/3）；Poisson 变体 1 年期 IV 约 41.9%，base case 约 36.0%</li>\n<li><strong>现货仅标定可识别总波动率</strong>：从现货序列单独标定无法分离双因子（均值回归速度和漂移），需要期货条带价格联合标定（Kalman 滤波极大似然）</li>\n<li><strong>Basis 风险</strong>：同一张 H100 卡在 2025 年 H2 的不同供应商层（marketplace \\$1.95，neocloud \\$3.33，hyperscaler \\$6.26），指数混合平均不等于任何具体买方的暴露</li>\n</ul>\n<h2>创新点</h2>\n<p>1. 将 Schwartz-Smith 双因子商品框架首次系统化地应用于 GPU 算力租赁这一&quot;不可储存且贬值&quot;的新品种</p>\n<p>2. 将代际废代事件类比于股票财报日处理（确定发生、幅度不确定），而非随机 Poisson 到达，从而给出更精确的发布窗口波动率隆起</p>\n<p>3. 在期货上市前提出三个可证伪的定量预测，提供了罕见的事前验证机会</p>\n<p>4. 明确区分 basis 风险（指数混合 vs 具体采购暴露）对套保有效性测试的影响</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>Working Paper / 未经同行评审</strong>：结论未经独立核实，模型参数大量依赖少数公开数据点</li>\n<li><strong>仅两次代际样本</strong>：A100→H100 和 H100→Blackwell 均处于同一宏观需求周期，统计独立性存疑；跳跃幅度估计区间宽（$-0.27$ 至 $-0.17$）</li>\n<li><strong>风险溢价未识别</strong>：折入漂移处理使远期曲线产出&quot;期望现货预测&quot;而非真正的风险中性价格，模型在没有期货价格历史时无法分离风险溢价</li>\n<li><strong>双因子无法从现货单独识别</strong>：均值回归速度和长短期漂移分解需要期货条带；当前只有不足两年的现货序列</li>\n<li><strong>Basis 风险未建模</strong>：混合结算指数与实际采购暴露的楔子在极端情况下超过 3:1，套保比率误差极大</li>\n<li><strong>期权定价简化</strong>：Black-76 + 对数正态近似在左尾（负向大跳跃）系统性低估 put 翼，文章承认 Merton（1976）混合模型是自然扩展</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: Silicon Data 和 Ornn 指数需授权（非公开免费）；月度节点可从各提供商公开网页和二手报道拼凑；A100 / H100 跳跃事件数据有限但可查</li>\n<li><strong>方法清晰度</strong>: 核心模型（Schwartz-Smith + 跳跃）框架清晰；作者声称模型代码可应要求提供；标定部分细节有待期货条带数据</li>\n<li><strong>计算成本</strong>: 闭式远期 + Black-76，计算极轻量；Kalman 滤波全标定中等复杂度</li>\n<li><strong>综合评分</strong>: ★2.5</li>\n</ul>\n<h2>复现备注</h2>\n<p><strong>不建议投入复现</strong>，主要原因：</p>\n<p>1. 核心标的（GPU 算力期货）目前国内不可交易，无实盘应用场景</p>\n<p>2. 模型本质是 Schwartz-Smith 的经典框架搬运，方法论创新有限</p>\n<p>3. 关键数据（Silicon Data 日线序列）需付费授权，最少可行版本数据缺口明显</p>\n<p>4. 学术质量属 Working Paper 级别，尚未经过同行评审</p>\n<p>若纯学术兴趣可从 Schwartz-Smith（2000）原始电力期货框架出发，用公开的 H100 月度价格点验证跳跃幅度标定逻辑即可。</p>"}, {"key": "2G9U8RUJ", "title": "Portfolio Optimization under Fast and Slow Latent Mean-Reverting and Momentum Drift", "year": "2026", "authors": "Dannin J. Eccles, Roger Lee", "tags": ["Quantitative Finance - Mathematical Finance"], "venue": "", "abstract": "We consider a class of partial-information portfolio optimization problems in which the drift of a risky asset is driven by two latent stochastic factors evolving at distinct time scales. We show that the filtered estimate of the latent mean-reversion level is driven by the difference between fast and slow exponential moving average (EMA)-type processes of the trailing price history, yielding a Moving Average Convergence Divergence (MACD)-type signal, along with a deterministic Volterra correction. Under logarithmic, power, and exponential utility, we derive candidate optimal strategies in explicit feedback form and establish admissibility and verification results. In particular, the results provide a mathematical foundation for the endogenous emergence of MACD-type trading signals as estimators of latent drift information contained in observed price paths.", "url": "http://arxiv.org/abs/2607.01705", "date_added": "2026-07-10", "summarized": true, "rating": "★2.5", "starred": false, "repro": "—", "summary_html": "<h1>Portfolio Optimization under Fast and Slow Latent Mean-Reverting and Momentum Drift</h1>\n<p>&gt; Zotero Key: <code>2G9U8RUJ</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>:Dannin J. Eccles, Roger Lee</li>\n<li><strong>年份</strong>:2026</li>\n<li><strong>出处</strong>:arXiv (q-fin.MF)</li>\n<li><strong>DOI</strong>:10.48550/arXiv.2607.01705</li>\n<li><strong>链接</strong>:http://arxiv.org/abs/2607.01705</li>\n<li><strong>本地 PDF</strong>:<code>~/Developer/Zotero/storage/Y5KIUMPV/Eccles和Lee - 2026 - Portfolio Optimization under Fast and Slow Latent Mean-Reverting and Momentum Drift.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>:MACD（快慢均线差）作为技术分析中最常用的信号之一，长期以来主要靠经验有效性支撑，缺乏从最优化理论出发的严格数学基础——它究竟是不是某类投资问题下的最优交易信号？</li>\n<li><strong>方法</strong>:构建一个两因子（快/慢时间尺度）隐变量漂移的部分信息（partial-information）连续时间资产定价模型，用 Kalman-Bucy 滤波求解投资者只能观测价格、无法观测隐藏漂移因子时的最优滤波估计，再在对数、幂、指数三种效用函数下求解 Hamilton-Jacobi-Bellman 方程得到显式反馈最优交易策略。</li>\n<li><strong>结论</strong>:证明了隐藏均值回归漂移水平的滤波估计天然等于&quot;快、慢两个指数移动平均（EMA）价格滤波器之差&quot;加一个确定性 Volterra 修正项，即 MACD 型信号在该模型下是内生涌现（endogenously emerge）的最优滤波量，且该信号直接进入三种效用函数下的最优反馈交易策略公式，为 MACD 这一经典技术分析工具提供了严格的随机控制理论基础，属于纯理论/数学结果，无实证回测。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>技术分析中的 MACD（Moving Average Convergence Divergence，快慢均线差）被广泛使用，但学界普遍认为其缺乏理论根基，多是&quot;实践先于理论&quot;。已有的部分信息组合优化文献（Lakner 1995/1998；Kim and Omberg 1996；Karatzas and Zhao 2001 等）研究了投资者只能观测价格、无法观测驱动收益的隐藏因子时的最优交易问题，但多以单一隐藏因子（如 Chen and Lee 2023 的单因子模型，其最优策略退化为单一 EMA 型的&quot;水平信号&quot;）为主。本文的核心问题是：如果价格漂移由两个演化速度不同的隐藏因子驱动（一个快速因子代表短期动量/情绪效应，一个慢速因子代表持久性均值回归水平），最优交易策略的形式是否会从&quot;单一EMA水平信号&quot;质变为&quot;双EMA之差的发散型信号&quot;，从而为 MACD 提供内生的数学解释。</p>\n<h2>数据与样本</h2>\n<p>本文为纯理论/数学论文，不涉及实证数据、历史价格样本或回测。所有结果均为在给定线性-高斯扩散模型假设下的解析推导与证明。</p>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[价格过程 P_t&lt;br/&gt;线性高斯扩散, 漂移由隐变量驱动] --&gt; B[隐藏漂移向量 Θ_t=快因子F_t,慢因子S_t&lt;br/&gt;快慢时间尺度均值回归]\n  B --&gt; C[投资者只观测价格&lt;br/&gt;部分信息 F^P_t]\n  C --&gt; D[Kalman-Bucy滤波&lt;br/&gt;求解条件均值/协方差]\n  D --&gt; E[定理3.1: 滤波估计F_t^hat&lt;br/&gt;= 快EMA - 慢EMA + Volterra修正项]\n  E --&gt; F[MACD型发散信号&lt;br/&gt;内生涌现]\n  F --&gt; G[HJB方程&lt;br/&gt;状态: 财富/价格/滤波漂移]\n  G --&gt; H1[对数效用&lt;br/&gt;线性ODE系统]\n  G --&gt; H2[幂效用&lt;br/&gt;矩阵Riccati系统]\n  G --&gt; H3[指数效用&lt;br/&gt;线性ODE系统]\n  H1 --&gt; I[显式最优反馈策略&lt;br/&gt;均含MACD信号 m=λ_p F_hat - κ_p P]\n  H2 --&gt; I\n  H3 --&gt; I\n  I --&gt; J[可容许性验证 + 验证定理&lt;br/&gt;证明候选策略确为全局最优]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>价格与隐藏因子动态</strong>：价格 $P_t$ 满足 $dP_t=(\\lambda_pF_t-\\kappa_pP_t)dt+\\sigma_pdW_t^P$，隐藏漂移向量 $\\Theta_t=(F_t,S_t)^\\top$（快因子、慢因子）满足 $d\\Theta_t=(\\mu-\\kappa\\Theta_t)dt+\\sigma d\\mathbf{W}_t$，其中 $\\kappa=\\begin{pmatrix}\\kappa_f&amp;-\\lambda_f\\\\0&amp;\\kappa_s\\end{pmatrix}$、$\\kappa_f&gt;\\kappa_s$ 保证快因子确实比慢因子演化更快，$\\lambda_f&gt;0$ 使慢因子的信息通过耦合传导进快因子（进而传导进价格漂移）。</p>\n<p>2. <strong>部分信息设定</strong>：投资者只能观测价格路径生成的滤波 $\\mathbb{F}^P$，交易策略 $\\varphi$ 必须是价格自适应（price-adapted）过程；目标是最大化终端财富的期望效用 $\\sup_\\varphi \\mathbb{E}[U(V_T^\\varphi)]$，考虑对数、幂、指数三类效用。</p>\n<p>3. <strong>Kalman-Bucy 滤波</strong>：将系统改写为标准线性滤波形式后，用 Kalman-Bucy 方程求解条件均值 $\\hat\\Theta_t=\\mathbb{E}[\\Theta_t|\\mathcal{F}_t^P]$ 和条件协方差 $\\Sigma_t$ 的演化 ODE（式7），核心是求出快因子的滤波估计 $\\hat F_t=\\mathbb{E}[F_t|\\mathcal{F}_t^P]$。</p>\n<p>4. <strong>MACD 型表示（核心定理 3.1）</strong>：证明 $\\hat F_t=H(t)+\\mathcal{E}_t(\\kappa_f,\\alpha)-\\mathcal{E}_t(\\kappa_s,\\beta)+\\mathfrak{B}_t(\\cdot)$，其中 $H(t)$ 是确定性初值贡献项，$\\mathcal{E}_t(\\gamma,\\delta)$ 是衰减率为 $\\gamma$、权重为 $\\delta$ 的 EMA 型价格滤波器（对价格路径做指数加权移动平均），$\\mathfrak{B}_t$ 是由固定核的线性 Volterra 积分方程解出的确定性修正算子。因此滤波估计的核心路径依赖部分正是&quot;快衰减率 $\\kappa_f$ 的 EMA 减去慢衰减率 $\\kappa_s$ 的 EMA&quot;，即经典 MACD 指标的连续时间类比——但权重 $\\alpha,\\beta$ 由 Kalman 滤波内生决定且随时间变化，而非离散 MACD 的固定权重。</p>\n<p>5. <strong>HJB 方程与效用具体化</strong>：状态变量为（财富、价格、滤波漂移）三元组，HJB 方程（式13）的一阶条件给出候选最优策略 $\\varphi_U^*=-\\frac{(\\lambda_p\\hat f-\\kappa_p\\mathfrak p)\\partial_{\\mathfrak w}\\mathcal V_U+\\ldots}{\\sigma_p^2\\partial_{\\mathfrak{ww}}\\mathcal V_U}$，其中关键量 $m(\\mathfrak p,\\mathfrak f):=\\lambda_p\\hat f-\\kappa_p\\mathfrak p$ 就是滤波漂移进入策略的通道。对数效用下通过可加分离假设把 HJB 化为线性 ODE 系统（式16），得到显式反馈 $\\varphi_{\\log}^*=\\frac{\\mathfrak w}{\\sigma_p^2}m(\\mathfrak p,\\mathfrak f)$；幂效用下化为矩阵 Riccati 系统（式20）；指数效用下化为另一组线性 ODE（式22）。三种情形下最优策略都通过同一个 MACD 型量 $m(\\mathfrak p,\\hat F_t)$ 进入。</p>\n<p>6. <strong>可容许性与验证</strong>：分别证明三种候选反馈策略满足可容许交易策略类的定义（正性、平方可积性、鞅性条件），并用验证定理（Theorem 5.1）严格证明候选价值函数确实等于最优价值函数，从而候选反馈策略确为全局最优。</p>\n<p>7. <strong>输出</strong>：定理性结论——在双因子（快/慢）隐藏漂移的部分信息组合优化问题中，MACD 型的快慢 EMA 发散信号并非人为施加的交易规则，而是从滤波+最优控制理论中自然涌现的最优信号载体；三种效用函数下最优策略的具体形式不同，但都通过同一个滤波驱动量 $m(\\mathfrak p,\\hat F_t)$（本质是 MACD 信号）决定仓位。全文不产出可直接交易的数值信号或参数标定，是理论基础研究。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>主定理（3.1）：滤波后的快因子估计 $\\hat F_t$ 精确等于确定性项 + 快慢EMA之差（MACD型信号）+ Volterra 修正项，为技术分析中 MACD 指标提供了严格的最优滤波理论解释。</li>\n<li>该结论把单因子模型（Chen and Lee 2023，最优策略退化为单一 EMA&quot;水平信号&quot;）推广到双因子模型，证明隐藏因子数量从一个增至两个会使最优信号的定性形式从&quot;水平型&quot;变为&quot;发散型（MACD型）&quot;。</li>\n<li>三种效用（对数、幂、指数）下的最优反馈策略都共享同一个核心驱动量 $m(\\mathfrak p,\\mathfrak f)=\\lambda_p\\mathfrak f-\\kappa_p\\mathfrak p$，即 MACD 型信号并非只在特定效用假设下才出现，而是这一类部分信息模型的结构性特征。</li>\n<li>论文完整证明了可容许性（admissibility）和验证定理（verification theorem），保证候选策略在数学上严格最优，而非仅仅是一阶条件的形式解。</li>\n<li>全文没有任何实证回测、参数标定或历史数据检验——所有结果是给定模型假设下的解析证明。</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次在双隐藏因子（快/慢时间尺度）线性-高斯部分信息模型下，严格推导出 MACD 型信号作为最优滤波量的内生涌现（而非作为限制性交易规则强加），是对 Lorig, Zhou and Zou (2019) 等&quot;技术分析数学分析&quot;研究路线的推进。</li>\n<li>把滤波理论（Kalman-Bucy）与随机控制理论（HJB + 验证定理）在同一个双因子模型中完整衔接，覆盖对数、幂、指数三种代表性效用函数。</li>\n<li>提出的 Volterra 修正算子 $\\mathfrak{B}$ 是对经典离散 MACD 指标的连续时间精细化——区别于教科书里固定权重的离散 MACD，这里的权重 $\\alpha_t,\\beta_t$ 由 Kalman 增益内生决定、随时间变化，且额外带有确定性修正项。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>全文纯理论，没有任何实证检验、参数标定或历史数据回测，无法直接判断该模型隐含的 MACD 型策略在真实市场中的经济价值或统计显著性。</li>\n<li>模型假设为线性-高斯扩散（价格和隐藏因子均为常系数线性 SDE），现实市场的漂移、波动率往往是非线性、非高斯、随机波动率驱动的，模型的现实适配性有限。</li>\n<li>快慢因子的参数（$\\kappa_f,\\kappa_s,\\lambda_f,\\sigma$ 等）在实践中需要通过历史数据估计（如最大似然或矩估计），论文未提供参数估计方法或对参数敏感性的讨论。</li>\n<li>最优策略依赖价值函数的 ODE/Riccati 系统全局存在 $C^1$ 解这一假设（尤其幂效用情形），论文虽证明了对数和指数情形的全局存在性，但幂效用情形的存在性是&quot;假设&quot;而非证明，实践中需要额外验证。</li>\n<li>论文未讨论交易成本、离散再平衡频率、有限杠杆约束等实务因素，纯连续时间无摩擦框架与实盘交易存在较大差距。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>:本文不使用任何真实市场数据，理论结果不依赖数据可得性；若要做实证验证（用历史价格标定双因子模型参数并检验滤波 MACD 信号的样本外表现），可用天软等公开可得的价格数据。</li>\n<li><strong>方法清晰度</strong>:定理证明详尽严谨（Kalman-Bucy滤波推导、HJB化简、可容许性证明、验证定理证明均完整给出），但涉及随机分析、滤波理论、矩阵 Riccati 方程等较高深的数学工具，复现证明本身需要较强数理基础；若目标只是&quot;实现滤波+反馈策略&quot;的数值版本，则相对可行。</li>\n<li><strong>计算成本</strong>:数值实现（Kalman滤波递推 + ODE/Riccati求解 + 反馈策略计算）计算量很小，可在普通PC上快速完成；真正的成本在于用真实数据做参数估计（如最大似然拟合双因子模型）。</li>\n<li><strong>综合评分</strong>:★2.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>不建议按论文原样&quot;复现&quot;（无实证部分可复现），但可以考虑借鉴其理论框架做一个小型实证延伸项目：用历史价格数据（如股指或商品期货连续合约）通过最大似然或EM算法标定双因子线性-高斯漂移模型参数（$\\kappa_f,\\kappa_s,\\lambda_f,\\sigma_p$等），用 Kalman-Bucy 滤波复现论文定理3.1给出的&quot;快慢EMA之差+Volterra修正&quot;滤波信号，并与传统离散 MACD 指标做对比（相关性、领先滞后关系），检验该&quot;理论最优MACD&quot;是否比经验MACD参数（如12/26/9日）更具预测力或交易价值。这类延伸有一定研究价值，但工作量和风险主要在参数估计和实证检验环节，而非论文本身给出的理论推导。</p>"}, {"key": "J9UMMZ2T", "title": "Portfolio Optimization for Commodity ETFs under Heavy-Tailed Returns", "year": "2026", "authors": "Nicholas Appiah, Ali Jaffri, Dilmi C. W. Hettiachchi-Halpe-Kankanamalage…", "tags": ["Quantitative Finance - Risk Management", "Quantitative Finance - Portfolio Management"], "venue": "", "abstract": "This paper examines portfolio optimization for commodity exchange-traded funds (ETFs) under heavy-tailed return behavior. Using daily Bloomberg data for 30 U.S.-listed commodity ETFs from 12 December 2018 to 16 December 2024, we study funds spanning agriculture, energy, metals, and broad commodity index exposure. We compare a passive buy-and-hold portfolio with rolling-window optimized portfolios formed under mean--variance and conditional value-at-risk (CVaR) criteria, considering both long-only and restricted long--short strategies. The results showed substantial heterogeneity across commodity sectors, with energy and broad commodity index funds displaying pronounced volatility, skewness, and excess kurtosis. Historical optimization indicated that minimum-risk and CVaR-based portfolios provided more stable cumulative performance than tangent portfolios and generally improved Sharpe, Calmar, and STARR$_{0.95}$ ratios. Extreme-value diagnostics showed that optimized portfolios remained exposed to heavy downside tails, so improved risk-adjusted performance did not eliminate extreme-loss risk. A dynamic extension based on ARMA--GARCH marginal models, Student--$t$ copula dependence, and one-step-ahead predictive scenarios improved performance mainly when combined with minimum-risk or CVaR-based objectives. Dynamic mean--variance tangent portfolios performed less reliably, reflecting sensitivity to expected-return estimation error. Transaction-cost robustness checks further showed that the practical value of dynamic optimization depended on turnover control, with low-turnover dynamic CVaR tangent portfolios remaining more resilient to implementation costs. Overall, the analysis showed that commodity ETF allocation benefited most from conservative and downside-risk-aware optimization, while optimized portfolios continued to require explicit tail-risk and implementation diagnostics.", "url": "http://arxiv.org/abs/2606.26625", "date_added": "2026-06-26", "summarized": true, "rating": "★2.5", "starred": false, "repro": "—", "summary_html": "<h1>Portfolio Optimization for Commodity ETFs under Heavy-Tailed Returns</h1>\n<p>&gt; Zotero Key: <code>J9UMMZ2T</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Nicholas Appiah, Ali Jaffri, Dilmi C. W. Hettiachchi-Halpe-Kankanamalage, Svetlozar T. Rachev</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: arXiv (2026-06-25)</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2606.26625</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2606.26625</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/HXLEUMTA/Appiah 等 - 2026 - Portfolio Optimization for Commodity ETFs under Heavy-Tailed Returns.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：商品 ETF 收益呈现显著偏度、超额峰度和厚尾，传统均值-方差框架无法完整描述下行尾风险，不同优化方法在商品这一特殊资产类别上的表现差异未被系统比较。</li>\n<li><strong>方法</strong>：对 30 只美国商品 ETF 比较均值-方差与 CVaR 组合优化（静态 + 动态 ARMA-GARCH-Student-t Copula），结合 EVT 极端值分析验证尾风险，2018—2024 年。</li>\n<li><strong>结论</strong>：最小风险和 CVaR 策略优于切点组合，但所有策略均无法消除极端下行尾部风险；动态 Copula 扩展可改善尾依赖建模但不能消除厚尾本质。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>商品 ETF 收益呈现显著偏度、超额峰度和异质波动，传统均值-方差框架无法完整描述下行尾风险。已有研究多聚焦于股票/债券组合；此文在商品 ETF 这一具有期货滚仓损耗、便利收益率等特殊属性的资产类别上系统对比静态与动态两阶段优化框架，并引入极端值分析（EVT）验证尾风险是否被消除。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 30只美国上市商品 ETF，覆盖农业（DBA、CORN、WEAT）、能源（USO、UNG、DBE 等）、金属（GLD、SLV、PPLT、PALL 等）、宽泛商品指数（DBC、GSG、BCI 等）四大类别</li>\n<li><strong>频率</strong>: 日频（算术收益）</li>\n<li><strong>样本区间</strong>: 2018年12月12日—2024年12月16日（约1,500个交易日）；滚动优化样本外起点约2020年底</li>\n<li><strong>数据来源</strong>: Bloomberg Professional Services（价格、分红、市值、美国3月期国债收益率）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n    A[30只商品 ETF 日收益\\nBloomberg 2018-2024] --&gt; B[阶段一: 历史滚动窗口优化\\n504 交易日估计窗口]\n    B --&gt; C1[均值-方差优化\\nMVP / TVP]\n    B --&gt; C2[CVaR 优化\\nC95 / C99 / TC95 / TC99]\n    C1 &amp; C2 --&gt; D[多空约束\\nw_i in 0,1 或 -1/30, 1+1/30\\n换手约束 C_TO]\n    D --&gt; E[样本外组合收益序列]\n    E --&gt; F[绩效评估\\nSharpe / Calmar / STARR_0.95]\n    E --&gt; G[极端值分析 EVT\\nHill 估计量 alpha_hat]\n    A --&gt; H[阶段二: 动态 ARMA-GARCH 扩展\\nStudent-t Copula]\n    H --&gt; I[条件边际模型\\nr_it = mu_it + sigma_it z_it]\n    I --&gt; J[Student-t Copula 捕捉尾依赖]\n    J --&gt; K[前向一步场景模拟]\n    K --&gt; C1\n    K --&gt; C2</div>\n<h3>步骤详解</h3>\n<p>1. <strong>组合设置</strong>: 收益向量 $r_t$，组合权重 $w_t$ 满足 $\\mathbf{1}^\\top w_t=1$；纯多头约束 $w_i\\ge 0$（LO）或限制多空 $-1/30\\le w_i\\le 1+1/30$（LS）；换手约束 $\\frac{1}{2}\\sum_i|w_i(t_k)-w_i(t_{k-1})|&lt;C_{TO}$，$C_{TO}=1/(30\\times252)$。</p>\n<p>2. <strong>阶段一——历史滚动优化</strong>: 以过去504个交易日的样本均值/协方差/CVaR 估计为输入，每日滚动重新估计权重并应用于下一交易日。优化目标分四类：</p>\n<p>   - MVP: $\\min_w w^\\top\\Sigma w$ 主多头</p>\n<p>   - TVP: $\\max_w(\\mu-r_f)^\\top w/\\sqrt{w^\\top\\Sigma w}$（Sharpe 切点）</p>\n<p>   - C95/C99: $\\min_w \\text{CVaR}_\\alpha(-R_p)$，$\\alpha\\in\\{0.95,0.99\\}$</p>\n<p>   - TC95/TC99: CVaR 切点组合（最大 Excess Return / CVaR 比）</p>\n<p>3. <strong>绩效度量</strong>: Sharpe = $\\bar{Z}_p/\\sigma(Z_p)$；Calmar = CAGR$_p$/MDD$_p$；STARR$_{0.95}=\\bar{Z}_p/\\text{CVaR}_{0.95}(-Z_p)$。</p>\n<p>4. <strong>极端值分析</strong>: 对每个策略计算左尾 Hill 估计量 $\\hat{\\alpha}(k)=\\left[\\frac{1}{k}\\sum_{j=1}^k\\log(X_{(j)}/X_{(k+1)})\\right]^{-1}$，用最大5%的正损失观测，跨 $k\\in[10,50]$ 范围绘制 Hill 曲线，避免阈值选取的单点不稳定性。</p>\n<p>5. <strong>阶段二——动态 ARMA-GARCH-Copula</strong>: 每只 ETF 拟合 $r_{i,t}=\\mu_{i,t}+\\varepsilon_{i,t}$，$\\varepsilon_{i,t}=\\sigma_{i,t}z_{i,t}$（ARMA-GARCH 边际模型捕捉条件均值和波动）；标准化残差用 Student-$t$ Copula 建模横截面依赖（含尾部依赖参数）；在估计窗口末端模拟前向一步场景，用相同均值-方差/CVaR 目标优化场景均值/协方差/CVaR 投入。</p>\n<h2>核心结论与关键结果</h2>\n<p><strong>静态历史优化（Table 1/2）</strong>:</p>\n<ul>\n<li>LO MVP 和 LO C95 的 Sharpe（≈0.50—0.53）、Calmar（≈0.44—0.45）和 STARR（≈0.013—0.014）均最优，显著优于被动等权 BHP（Sharpe≈0.40）。</li>\n<li>切点组合（TVP/TC95/TC99）各指标均弱于最小风险组合，反映预期收益估计误差的放大效应。</li>\n<li>多空策略未能显著提升性能；长短组合与纯多头尾风险结构高度相似。</li>\n</ul>\n<p><strong>EVT 分析（Table 1）</strong>:</p>\n<ul>\n<li>Hill 尾指数 $\\hat{\\alpha}$ 在 2.59—2.91 之间，所有策略保持相近水平——CVaR 优化降低了尾损失幅度，但<strong>未消除重尾结构</strong>；商品 ETF 组合本质上仍是重尾分布。</li>\n</ul>\n<p><strong>动态 ARMA-GARCH-Copula 扩展（Table 2）</strong>:</p>\n<ul>\n<li>对最小风险和 CVaR 组合：动态扩展使 Calmar 显著提升（MVP 从 0.45 升至 0.54），Δ Calmar 最大约 0.08—0.21。</li>\n<li>切点 TVP 动态扩展<strong>显著恶化</strong>，Sharpe 和 STARR 差值均负显著（Bootstrap 95%置信区间排除零）——表明期望收益预测误差被动态切点策略放大。</li>\n<li>低换手动态 CVaR 切点（TC95/TC99）在实施成本扣除后最具韧性。</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>将 EVT 诊断（Hill 曲线）与经典绩效指标组合评估整合，说明&quot;Sharpe 改善&quot;不等价于&quot;尾风险消除&quot;。</li>\n<li>系统对比历史滚动与动态 ARMA-GARCH-Copula 两阶段框架，识别出预期收益估计在切点策略中的不稳定性是核心瓶颈。</li>\n<li>纳入换手约束与交易成本敏感性分析，指出动态策略实际收益依赖于换手控制。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>Bloomberg 商业数据无法公开复现，限制了研究可验证性。</li>\n<li>样本期（2018—2024）较短且横跨新冠冲击，结论的时间外推性存疑。</li>\n<li>研究方法均为已有技术的组合应用，无方法论层面的创新。</li>\n<li>Copula 模型选择（Student-$t$）固定，未与其他 Copula 族比较。</li>\n<li>ETF 的期货滚仓损耗、分红处理等细节对结果影响未深入讨论。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: Bloomberg 数据需付费订阅；部分 ETF（GLD、SLV 等）的历史价格可从 Yahoo Finance 获取替代，但无法完全复现。</li>\n<li><strong>方法清晰度</strong>: 方法描述完整，标准工具链（均值-方差/CVaR + ARMA-GARCH + Copula）成熟，可参考现有库实现。</li>\n<li><strong>计算成本</strong>: 低，标准凸优化 + GARCH 拟合，无需 GPU。</li>\n<li><strong>综合评分</strong>: ★2.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>方法标准，主要瓶颈在数据。若用 Yahoo Finance 数据替代 Bloomberg，可部分复现能源与金属 ETF 子集（如 USO、GLD、SLV）；结论方向性应可验证。不建议列为高优先级复现对象，更适合作为 CVaR 组合优化的参考实现案例。</p>"}, {"key": "JI94985V", "title": "Passive Flows, Active Woes: Passive Investing and the Decline of Active Mutual Fund Alpha", "year": "2026", "authors": "Hannah Unterberg", "tags": ["Fund Flows", "Institutional Demand", "Mutual Funds", "Passive Investing"], "venue": "", "abstract": "This paper studies whether the secular shift toward passive investing has affected active fund performance through flow-induced demand effects. Using U.S. equity fund data (1984-2024), I document a decline in active fund performance after 2010, with average annual four-factor alpha falling by around one percentage point and the previously positive relation between Active Share and performance reversing. These patterns contrast with theories predicting improved performance as the active sector shrinks. A flow-driven framework shows that capital reallocations toward passive funds generate asymmetric price pressure, penalizing funds' active tilts. Flow-induced demand significantly impacts fund returns, with the effects of passive flows persisting over multiple years. Controlling for flow-induced trading can explain the negative Active Share-performance relationship, suggesting that underperformance reflects structural demand headwinds rather than declining manager skill. Higher-frequency tests exploiting plausibly exogenous, beginning-of-month passive flows provide additional evidence.", "url": "https://papers.ssrn.com/abstract=6902444", "date_added": "2026-07-10", "summarized": true, "rating": "★2.0", "starred": false, "repro": "—", "summary_html": "<h1>Passive Flows, Active Woes: Passive Investing and the Decline of Active Mutual Fund Alpha</h1>\n<p>&gt; Zotero Key: <code>JI94985V</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 不复现</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>:Hannah Unterberg</li>\n<li><strong>年份</strong>:2026</li>\n<li><strong>出处</strong>:SSRN</li>\n<li><strong>DOI</strong>:10.2139/ssrn.6902444</li>\n<li><strong>链接</strong>:https://papers.ssrn.com/abstract=6902444</li>\n<li><strong>本地 PDF</strong>:<code>~/Developer/Zotero/storage/4TNNLCR3/Unterberg - 2026 - Passive Flows, Active Woes Passive Investing and the Decline of Active Mutual Fund Alpha.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>:2010 年后被动投资规模超越主动基金，理论上主动板块收缩应减少管理者间竞争、提升剩余主动基金的 alpha，但实证却观察到主动基金业绩持续恶化，且 Active Share 与业绩的关系从正转负——这一反常现象的经济机制是什么？</li>\n<li><strong>方法</strong>:基于委托组合模型（delegated-portfolio model）推导&quot;资金从主动流向被动&quot;如何通过被动基金的机械性、无弹性买卖压力冲击主动基金重仓股价格，并用 CRSP 共同基金数据库 + Thomson Reuters S12 持仓数据（1984–2024）构造基金层面&quot;流量驱动需求&quot;（flow-induced trading, FIT）指标做实证检验。</li>\n<li><strong>结论</strong>:2010 年后主动基金四因子净 alpha 从 -0.72% 恶化至 -1.82%（年化）；高 Active Share 基金相对低 Active Share 基金的业绩利差从 2000 年前的 +0.43%（四因子）反转为 -1.51%；基金层面流量对收益的价格乘数 M 在 1.8–2.7 之间（被动资金流的冲击乘数 3.02 明显大于主动资金流的 1.91），控制流量驱动需求后 Active Share 系数的显著负相关性消失，说明主动基金业绩下滑主要源于结构性资金流冲击而非管理者能力下降。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>理论文献（Pástor and Stambaugh 2012；Pástor, Stambaugh, and Taylor 2015）预测主动基金行业规模收缩应提升剩余管理者的选股机会集、提高整体 alpha，被动化也应通过淘汰弱管理者提升幸存主动基金的平均技能。但近十五年实证数据显示相反：2010 年后美国主动股票基金业绩显著恶化，且历史上能正向预测业绩的 Active Share 指标（衡量基金持仓偏离基准的程度）转为负向预测。论文试图从&quot;资金流动引发的机械性价格压力&quot;这一被以往文献忽视的渠道来解释这一反转——被动资金流入是完全无弹性、按基准权重买入的，而主动资金流出迫使主动基金按现有持仓比例卖出，这种非对称、持续的资金再配置会系统性打压主动基金重仓股价格。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>:美国国内主动管理股票共同基金 + 被动指数基金/ETF（剔除均衡型、债券型、行业型、杠杆型、国际型基金）</li>\n<li><strong>频率</strong>:月频收益（部分分析用日频）；持仓数据季度更新</li>\n<li><strong>样本区间</strong>:1984–2024（Active Share 数据 1990–2023；日频高频检验从 1998-09 起）</li>\n<li><strong>数据来源</strong>:CRSP Mutual Fund Database（基金收益、规模、费率）、Thomson Reuters（Refinitiv）S12 持仓数据库（通过 MFLINKS 匹配）、Cremers 网站 Active Share 数据、Kenneth French Data Library（因子收益）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[委托组合理论模型&lt;br/&gt;直接投资者+主动基金+被动基金] --&gt; B[推导均衡价格&lt;br/&gt;及资金再配置对价格的影响]\n  B --&gt; C[预测: 主动→被动资金再配置&lt;br/&gt;压低主动基金相对收益&lt;br/&gt;压力随active tilt放大]\n  D[CRSP基金收益/规模数据] --&gt; E[计算基金流量 f_j,t]\n  F[S12持仓数据] --&gt; G[逐股票加总:&lt;br/&gt;流量驱动需求 Δd_i,t]\n  E --&gt; G\n  G --&gt; H[组合权重加权&lt;br/&gt;得到基金层面FIT_j,t]\n  H --&gt; I{检验1: Active Share预测FIT&lt;br/&gt;面板回归}\n  H --&gt; J{检验2: FIT预测基金收益&lt;br/&gt;价格乘数M}\n  H --&gt; K{检验3: 控制FIT后&lt;br/&gt;Active Share系数是否消失}\n  L[月初被动资金流&lt;br/&gt;准外生变异] --&gt; M{检验4: 三重差分&lt;br/&gt;月初收益 x Active Share x 被动流}\n  N[行业主动/被动规模占比] --&gt; O{检验5: 行业构成&lt;br/&gt;预测主动-被动收益利差}\n  I --&gt; P[结论: 流量驱动需求是&lt;br/&gt;主动基金业绩下滑的经济机制]\n  J --&gt; P\n  K --&gt; P\n  M --&gt; P\n  O --&gt; P</div>\n<h3>步骤详解</h3>\n<p>1. <strong>理论框架</strong>：构建两期委托组合模型，四类投资者（直接投资者、主动基金、被动基金、基金投资者）均为 CARA 效用。被动基金需求 $\\theta_P=\\omega_M$（严格按基准权重、价格无弹性）；主动基金需求 $\\theta_A=\\frac{1}{\\gamma(a+b)}\\Sigma^{-1}(\\bar D-S)+\\frac{b}{a+b}\\omega_M$，由基本面驱动部分和基准跟踪部分构成。市场出清给出均衡价格 $S=\\bar D-\\frac{\\gamma\\sigma_\\epsilon^2}{A}[\\bar\\theta-\\lambda_P\\omega_M-\\lambda_A\\xi\\omega_M]$，对 $\\lambda_P,\\lambda_A$ 做一阶展开得到价格变化 $\\Delta S=K\\Delta\\lambda_P(\\omega_M-\\theta_A)$，其中 $K$ 为价格冲击因子。核心推论：主动基金超配的股票（$\\theta_A&gt;\\omega_M$）在资金流向被动基金时承受负向价格压力，且压力幅度随主动基金的 active tilt（$\\|\\theta_A-\\omega_M\\|_2^2$）放大。</p>\n<p>2. <strong>基金层面流量驱动需求（FIT）构造</strong>：follow Lou (2012)。先计算每只股票的流量驱动需求 $\\Delta d_{i,t}=\\frac{\\sum_j f_{j,t}\\cdot \\text{shares}_{j,i,t-1}\\cdot PSF_{j,t}}{\\sum_j \\text{shares}_{j,i,t-1}}$，其中 $f_{j,t}$ 为基金 $j$ 的百分比净流量（$F_{j,t}=\\text{AUM}_{j,t}-\\text{AUM}_{j,t-1}(1+R_{j,t})$），$PSF$ 为部分调整比例因子（主动基金流入 0.618、流出 0.970，被动基金进出均为 1，反映管理者对流入有更多自由裁量、流出则近乎被动清仓）。再按滞后持仓权重加总到基金层面：$\\text{FIT}_{j,t}=\\sum_i w_{j,i,t-1}\\cdot\\Delta d_{i,t}$，可进一步分解为主动流部分 $\\text{FIT}^A$ 和被动流部分 $\\text{FIT}^P$。</p>\n<p>3. <strong>Active Share 计算</strong>：$\\text{Active Share}_j=\\frac{1}{2}\\sum_i|w_{j,i}-w_{b,i}|$，取使 Active Share 最小的基准作为该基金对应基准（避免自选基准带来的偏差）。</p>\n<p>4. <strong>业绩衡量</strong>：用 CAPM、Fama-French-Carhart 四因子、六因子模型估计基金/组合 alpha（$R_{j,t}-RF_t=\\alpha_j+\\sum_k\\beta_{j,k}F_{k,t}+\\epsilon_{j,t}$），对比 1984–2009 与 2010–2024 两个子样本。</p>\n<p>5. <strong>检验链</strong>：(a) 面板回归 $\\text{FIT}_{j,t+1}=\\gamma\\text{ActiveShare}_{j,t}+\\ldots$，验证 Active Share 对未来 FIT 暴露的预测符号在两期间反转；(b) 价格乘数回归 $R_{j,t}=c+M\\cdot\\text{FIT}_{j,t}+\\ldots$，估计流量对基金收益的因果冲击；(c) 在 Active Share 预测收益回归中加入 FIT 控制变量，看 Active Share 系数是否被吸收；(d) 用月初被动资金流（源自 401(k) 定期薪资划拨，具有准外生性）做三重差分检验，观察不同 Active Share 分位组在被动资金流冲击下的月初收益差异；(e) 用行业主动/被动规模占比做月度时间序列回归，检验行业构成对主动-被动收益利差的预测方向是否反转。</p>\n<p>6. <strong>长期效应分解</strong>：用分布滞后面板回归估计 FIT 对未来最多 20 个季度收益的累积影响，被动资金流冲击的持续性（12 季度后仍保留约一半初始幅度）明显强于主动资金流冲击（1–3 年内基本回归均值），说明被动资金流代表更持久的结构性资金再配置。</p>\n<p>7. <strong>输出</strong>：基金层面 alpha 时间序列、Active Share 分位组合收益利差、FIT 价格乘数估计值、月初三重差分系数——共同支撑&quot;流量驱动需求&quot;渠道能解释主动基金业绩下滑的结论，属于纯实证归因分析，不直接产出可交易信号。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>主动基金四因子净 alpha：1984–2009 年 -0.72%/年 → 2010–2024 年 -1.82%/年；扣费前（gross）alpha 从正转负（等权组合 0.58% → -0.87%，市值加权组合 -0.01% → -0.66%）。</li>\n<li>Active Share 分位组合利差（四因子净 alpha，高减低）：1990–2009 为 +0.43%，2010–2024 反转为 -1.51%（CAPM 口径利差从 +1.52% 反转为 -3.96%）。</li>\n<li>价格乘数 $M$：全样本 1.76–2.68（随控制变量增加而上升）；分解后被动流乘数 3.02 显著大于主动流乘数 1.91，说明被动需求更难被市场吸收。</li>\n<li>控制 FIT 后，Active Share 系数在 2010–2024 期间从显著负值变为统计不显著，FIT 系数保持显著正值——支持&quot;流量驱动需求&quot;是业绩下滑的传导机制而非管理者技能退化。</li>\n<li>月初三重差分：低 Active Share 基金在被动资金流冲击一个标准差上升时月初收益提升 2.6bp，高 Active Share 基金则下降 2.1bp（对主动资金流做同样检验无此梯度），证据支持因果解释。</li>\n<li>行业构成回归：1990–2009 年被动份额上升预测更高的主动-被动收益利差（符合&quot;主动收缩→竞争减少→主动占优&quot;），2010–2024 年该关系反转为负，与流量驱动需求渠道相符。</li>\n<li>被动份额从 2010 年不到 1% 增长到 2024 年近 20%，2020 年资产规模超越主动基金；被动资金流累计超 4 万亿美元，主动基金累计流出超 3 万亿美元。</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次将&quot;主动→被动资金再配置&quot;的委托组合理论模型与实证联系起来，同时纳入主动流和被动流两个渠道，区分二者的价格冲击强度和持续性差异。</li>\n<li>用 Lou (2012) 式的机械性流量驱动需求指标隔离&quot;流量引发的被动交易&quot;与&quot;管理者主观信息驱动交易&quot;，避免了内生性混淆。</li>\n<li>用月初被动资金流的准外生变异（401(k) 定期扣款）提供因果层面的补充证据，弥补了面板回归可能存在的内生性担忧。</li>\n<li>记录了 Active Share-业绩关系的历史性反转，并给出结构性经济解释，而非简单归因于样本外可预测性衰减。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>结论建立在美国国内股票共同基金样本，跨境或其他资产类别（债券、另类资产）是否有类似机制尚未验证（作者也承认这是未来方向）。</li>\n<li>流量驱动需求测度依赖 Lou (2012) 的部分调整比例因子（0.618/0.970 等固定参数），这些参数来自另一篇论文的估计值，并非本文样本内重新估计，可能带来测量误差。</li>\n<li>Active Share 数据来自 Cremers 个人维护网站，样本截至 2023 年，与基金收益数据 2024 年末不完全对齐，且该数据的可得性/持续更新依赖第三方维护。</li>\n<li>价格乘数的经济解释依赖&quot;时间固定效应吸收市场整体流量冲击、基金固定效应吸收基金异质性&quot;的假设，虽然做了多种稳健性检验（WLS、多期滞后控制），但仍是简化的线性归因框架，无法完全排除遗漏变量。</li>\n<li>论文性质是资产管理行业结构性研究，不直接产出可复现的量化交易策略或选股信号，对国内市场（无对应&quot;被动基金颠覆主动基金&quot;的等量级现象）参考意义有限。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>:核心数据依赖 CRSP Mutual Fund Database、Thomson Reuters S12 持仓数据库以及 Cremers 个人维护的 Active Share 数据集，均为付费/受限的美国机构数据源，国内环境（天软等）无法直接获取，可得性低。</li>\n<li><strong>方法清晰度</strong>:理论模型推导和实证设计（FIT 构造、价格乘数回归、三重差分）在论文中给出完整公式，方法透明度较高。</li>\n<li><strong>计算成本</strong>:面板回归和分布滞后模型计算量不大，主要瓶颈在数据获取和处理（40 年基金全样本+持仓匹配），非算力密集型。</li>\n<li><strong>综合评分</strong>:★2.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>不建议复现。核心结论依赖美国专有数据库（CRSP、Thomson Reuters S12、Cremers Active Share），国内量化环境难以获取对应数据，且论文属于资产管理行业实证归因研究（解释&quot;为什么主动基金跑输&quot;），不产出可直接交易的策略或因子信号，与本项目&quot;策略复现&quot;的定位不匹配。可作为理解海外主动/被动资金流动态背景的参考文献保留。</p>"}, {"key": "ES92EXNT", "title": "Option-Implied Market Risk Premium and Asset Pricing", "year": "2026", "authors": "Xiaoyu Kang, Bei Chen, Quan Gan", "tags": ["CAPM", "Conditional Beta Pricing", "Option-Implied Equity Premium"], "venue": "", "abstract": "We show that the positive beta-return relation predicted by the CAPM emerges strongly in periods when the option-implied market risk premium is high. Unlike the ex-post market risk premium, which is noisy and often negative, the option-implied premium is derived from a model-free lower bound on the equity premium and is always positive, providing a forward-looking measure of investors' required compensation for market risk. Conditioning on this measure reveals a robust beta-return trade-off, consistent with periods of elevated aggregate risk aversion restoring the validity of the CAPM. These results are not driven by macroeconomic or earnings announcements, nor by variation in sentiment, disagreement, investor attention, inflation, variance risk premium, or VIX. Our findings highlight the importance of using forward-looking risk-premium measures to uncover conditional asset-pricing relationships that remain hidden in unconditional tests.", "url": "https://papers.ssrn.com/abstract=6824883", "date_added": "2026-06-12", "summarized": true, "rating": "★3.5", "starred": false, "repro": "—", "summary_html": "<h1>Option-Implied Market Risk Premium and Asset Pricing</h1>\n<p>&gt; Zotero Key: <code>ES92EXNT</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Xiaoyu Kang, Bei Chen, Quan Gan</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: SSRN</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.6824883</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=6824883</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/IL3UWZNL/Kang 等 - 2026 - Option-Implied Market Risk Premium and Asset Pricing.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：CAPM 预测 beta 与预期收益正相关，但实证中 SML 长期过于平坦甚至反转，何时成立缺乏前瞻性条件变量。</li>\n<li><strong>方法</strong>：基于 S&amp;P 500 指数期权计算 SVIX 风险中性方差指数，推导期权隐含的前瞻性市场风险溢价，以此为条件变量检验 beta-收益关系。</li>\n<li><strong>结论</strong>：高期权隐含风险溢价时期 beta 每增加 1 单位次日超额收益增加约 10—18 bps，SML $R^2$ 达 90%；低风险溢价时期关系消失甚至反转；效应独立于情绪、VIX 等变量。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>CAPM 预测 beta 与预期收益呈正线性关系，但实证中这一关系长期难以验证（SML 过于平坦甚至反转）。现有文献尝试用通胀、宏观公告、情绪、分歧等变量做条件检验，但这些变量多为事后或低频。本文提出用期权隐含的前瞻性风险溢价作为条件变量，以更直接地识别 CAPM 何时成立。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 美国股票（NYSE/AMEX/NASDAQ 普通股）、S&amp;P 500 指数期权</li>\n<li><strong>频率</strong>: 日频</li>\n<li><strong>样本区间</strong>: 1996年1月 – 2022年12月</li>\n<li><strong>数据来源</strong>: CRSP（股票收益）、OptionMetrics（期权数据）、Kenneth French 数据库（Fama-French 因子）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n    A[S&amp;P 500 指数期权价格] --&gt; B[计算 SVIX 风险中性方差指数]\n    B --&gt; C[推导期权隐含市场风险溢价下界]\n    C --&gt; D{风险溢价水平分组}\n    D --&gt;|高| E[高风险溢价时期]\n    D --&gt;|低| F[低风险溢价时期]\n    E --&gt; G[横截面回归: beta vs 收益]\n    F --&gt; G\n    G --&gt; H[比较 SML 斜率差异]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>期权隐含风险溢价构建</strong>：基于 Martin (2017) 的无套利下界方法，利用 S&amp;P 500 指数期权的看涨/看跌价格跨行权价积分，计算 SVIX（风险中性方差指数）。期权隐含的年化预期市场超额收益近似为 $R_{f,t} \\cdot SVIX^2_{t \\to T}$，该指标天然为正且前瞻性。</p>\n<p>2. <strong>条件分组</strong>：按30天期权隐含预期市场超额收益的分布，将样本日分为三组：低于25分位为低风险溢价期，高于75分位为高风险溢价期，其余为中等风险溢价期。</p>\n<p>3. <strong>证券市场线（SML）检验</strong>：在每个分组内，用前12个月日频数据估计各股票/组合的滚动 beta，然后检验 beta 与次日超额收益的横截面关系。高风险溢价期 SML 斜率约 13.8 bps/unit beta（t=8.64），R² 达 90.32%；低风险溢价期斜率几乎为零。</p>\n<p>4. <strong>Fama-MacBeth 回归</strong>：在各分组内运行横截面回归 $R_{j,t+1} - R_{f,t+1} = \\gamma_0 + \\gamma_1 \\hat{\\beta}_{j,t} + \\epsilon_{j,t+1}$，并构建包含交互项 $HSVIX_t \\times \\hat{\\beta}_{j,t}$ 的合并回归。高风险溢价期 beta 系数显著为正（约 10-18 bps），低风险溢价期为负或不显著。</p>\n<p>5. <strong>稳健性检验</strong>：排除微盘股和仙股后结果更强；限制在 S&amp;P 500 成分股中效果最明显（高-低差异达 21 bps）；控制公司特征（规模、账面市值比、动量）和常见因子后结论不变。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>高期权隐含风险溢价时期：beta 每增加1单位，次日超额收益增加约 10-18 bps，SML 陡峭且 R² 高达 90%</li>\n<li>低期权隐含风险溢价时期：beta-收益关系平坦甚至反转（斜率为负）</li>\n<li>该条件效应独立于宏观公告、情绪、分歧、投资者注意力、通胀、VIX 和方差风险溢价</li>\n<li>高风险溢价期与市场危机（2000互联网泡沫、2008金融危机、2020新冠）高度重合</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次使用期权隐含的前瞻性风险溢价作为 CAPM 条件检验的变量，相比事后实现收益更干净</li>\n<li>该指标天然为正、日频、聚合了跨行权价的市场级信息</li>\n<li>证明 CAPM 在无条件检验中的&quot;失败&quot;主要反映风险溢价的时变性，而非 beta 本身的失效</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>仅基于 S&amp;P 500 期权，对非美股市场的适用性未检验</li>\n<li>日频分析的经济直觉（次日收益与风险溢价的匹配）需进一步论证</li>\n<li>SVIX 下界的紧性假设在极端市场条件下可能失效</li>\n<li>高风险溢价期样本量相对较少（尾部 25%），统计推断需谨慎</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: OptionMetrics 为付费数据，CRSP 需机构订阅；天软无法直接获取</li>\n<li><strong>方法清晰度</strong>: 方法描述详尽，SVIX 计算公式明确，可照着实现</li>\n<li><strong>计算成本</strong>: 中等，主要成本在期权数据处理和大规模横截面回归</li>\n<li><strong>综合评分</strong>: ★3.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>若复现，核心是 SVIX 的构建（需 S&amp;P 500 期权数据）和滚动 beta 估计。最小可行版本：用公开的 VIX 数据做近似替代（虽非完全等价），或聚焦于 S&amp;P 500 ETF 期权。建议先复现 SML 图（Figure 2）作为概念验证。</p>"}, {"key": "EM7W6LZS", "title": "Momentum and Reversal on the Short-Term Horizon: Evidence from Commodity Markets", "year": "2026", "authors": "Shen Zhao, Yiyi Ding, Jianfeng Yu…", "tags": ["Momentum", "Commodity futures", "Liquidity provision", "Reversal", "Trend-chasing"], "venue": "", "abstract": "This paper documents the coexistence of momentum and reversal on the short-term horizon. Utilizing unique investors' position data from commodity futures markets, we decompose returns into a flow component tied to speculators' net trading (Q) and an orthogonal residual component (R nonQ). We find that R nonQ can significantly and positively predict next-week return (short-term return-based momentum), while Q forecasts nextweek return in a negative manner (short-term trading-based reversal). The short-term momentum effect applies to the entire cross-section of sample commodities and also to different subsamples of commodities with different characteristics. Further analysis shows that this short-term momentum primarily reflects speculat
