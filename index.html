2. <strong>行业分类敏感性</strong>：结果依赖于行业分类标准（如GICS或SIC），不同分类可能改变&quot;行业同行&quot;的定义，影响调整效果。</p>\n<p>3. <strong>交易成本未考虑</strong>：月度换仓频率在实际交易中可能面临显著成本，尤其在流动性较差的新兴市场。</p>\n<p>4. <strong>样本内vs样本外</strong>：虽然分时段检验显示稳健性，但主要结论基于1990-2023全样本，存在数据窥探风险。</p>\n<p>5. <strong>因果机制不明确</strong>：作者提出&quot;公司特有冲击反转vs行业冲击持续&quot;的解释，但未提供直接的微观结构证据。</p>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>:中等。需要CRSP/Compustat数据（学术数据库）或等效的国际股票数据库。行业分类需要GICS/SIC代码。</li>\n<li><strong>方法清晰度</strong>:高。方法描述简洁明确，核心公式清晰，可直接复现。</li>\n<li><strong>计算成本</strong>:低。主要是股票排序和组合构建，无需复杂模型训练。</li>\n<li><strong>综合评分</strong>:★4.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>1. <strong>关键风险点</strong>：</p>\n<p>   - 行业分类标准的选择会影响结果，建议使用GICS（全球统一）</p>\n<p>   - 国际数据获取可能有难度，可先用美国CRSP数据验证核心逻辑</p>\n<p>2. <strong>最小可行版本</strong>：</p>\n<p>   - 先用美国市场数据（1990-2023）复现标准反转 vs 行业调整反转的对比</p>\n<p>   - 验证行业调整后Alpha是否显著提升</p>\n<p>   - 可扩展至其他主要市场（英国、日本、欧洲）</p>\n<p>3. <strong>扩展方向</strong>：</p>\n<p>   - 测试不同行业分类标准的敏感性</p>\n<p>   - 分析交易成本对策略的影响</p>\n<p>   - 探索行业冲击与公司特有冲击的微观结构证据</p>"}, {"key": "ZCZ33Q7K", "title": "Sequential Structure in Intraday Futures Data: LSTM vs Gradient Boosting on MNQ", "year": "2026", "authors": "Mathias Mesfin", "tags": ["Quantitative Finance - Computational Finance", "Quantitative Finance - Trading and Market Microstructure", "Computer Science - Machine Learning", "Quantitative Finance - Statistical Finance"], "venue": "", "abstract": "This paper compares gradient boosting and long short-term memory (LSTM) architectures for intraday directional prediction in Micro E-Mini Nasdaq 100 futures (MNQ). Motivated by recent foundation-model research on financial candlestick data, including the Kronos architecture, we test whether five-minute OHLCV bar sequences contain exploitable sequential predictive structure at the scale of a single instrument dataset. Using 944 trading days from 2021-2025, four model configurations are evaluated under strict expanding-window walk-forward validation across three out-of-sample periods. The target variable is whether the session close exceeds the 10:30 AM open by more than ten points. No configuration produces statistically significant out-of-sample accuracy above the 51.8% base rate. Combined OOS accuracies range from 50.00% to 50.89% across gradient boosting variants, while the LSTM achieves 50.59%. Permutation tests yield p-values of 0.135 for the best gradient boosting model and 0.515 for the LSTM, indicating no statistically significant predictive edge. Feature importance instability across walk-forward folds suggests noise fitting rather than stable structural signal capture. The results indicate that four years of single-instrument five-minute OHLCV data are insufficient for reliable sequential ML-based intraday forecasting. The primary contribution is a documented evaluation of a Kronos-inspired architecture on a constrained real-world dataset, providing an empirical lower bound on data scale requirements for sequential financial ML.", "url": "http://arxiv.org/abs/2605.17724", "date_added": "2026-06-07", "summarized": true, "rating": "★3.0", "starred": false, "repro": "—", "summary_html": "<h1>Sequential Structure in Intraday Futures Data: LSTM vs Gradient Boosting on MNQ</h1>\n<p>&gt; Zotero Key: <code>ZCZ33Q7K</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 不复现</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Mathias Mesfin（独立研究者）</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: arXiv</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2605.17724</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2605.17724</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/EY5NSCQK/Mesfin - 2026 - Sequential Structure in Intraday Futures Data LSTM vs Gradient Boosting on MNQ.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>一篇&quot;诚实的负面结果&quot;论文——用四年 MNQ 期货 5 分钟 K 线数据（944 个交易日）测试 LSTM 和梯度提升能否预测日内方向，所有模型 OOS 准确率 50–51%，permutation test p 值 0.135–0.515，均不显著。结论：此数据规模下 5 分钟 K 线序列不含可提取的预测结构，为 sequential ML 日内预测建立了经验下界。</p>\n<h2>研究动机与问题</h2>\n<p>Kronos（Shi et al., 2025）在百万级 K 线上用 Transformer 证明了 bar-level 序列结构的预测价值。问题来了：如果只有单个品种、四年 5 分钟数据（72,604 根 bar）——典型的独立研究者资源约束——同样的方法论是否还有效？本文给出严格检验和沉没结论。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: Micro E-Mini Nasdaq 100 期货（MNQ）</li>\n<li><strong>频率</strong>: 5 分钟 OHLCV，仅 RTH（09:30–16:00 ET）</li>\n<li><strong>样本区间</strong>: 2021-12 至 2025-09，944 个完整交易日（含特征处理后的可用数）</li>\n<li><strong>数据来源</strong>: 未明确说明（推测 Databento 或类似 CME 历史数据源）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[5分钟 OHLCV K线&lt;br/&gt;72,604 根, 2021-2025] --&gt; B1[日频特征矩阵&lt;br/&gt;29维, 含收益/缺口/波动&lt;br/&gt;日结构/前日特征]\n  A --&gt; B2[日内特征矩阵&lt;br/&gt;30维, 首60分钟&lt;br/&gt;含12根K线收益序列]\n  \n  B1 --&gt; C1[Tokenization&lt;br/&gt;扩窗十分位数分箱&lt;br/&gt;0-9 离散 token]\n  B2 --&gt; C2[标准化 + 清洗]\n  \n  C1 --&gt; D1[GB-Daily&lt;br/&gt;HistGradientBoosting&lt;br/&gt;29 tokens → 日内涨跌]\n  C2 --&gt; D2[GB-Intraday&lt;br/&gt;HistGradientBoosting&lt;br/&gt;30 特征 → rest-of-session 涨跌]\n  C2 --&gt; D3[GB-VolAdj&lt;br/&gt;目标 ATR 归一化&lt;br/&gt;消除波动率混杂]\n  B2 --&gt; D4[LSTM&lt;br/&gt;12-bar 收益序列&lt;br/&gt;1层 16单元 + Dropout 0.3]\n  \n  D1 --&gt; E[扩张窗 Walk-Forward&lt;br/&gt;Fold1: 2022训→2023测&lt;br/&gt;Fold2: 2022-23训→2024测&lt;br/&gt;Fold3: 2022-24训→2025测]\n  D2 --&gt; E\n  D3 --&gt; E\n  D4 --&gt; E\n  \n  E --&gt; F[Permutation Test&lt;br/&gt;目标 200 次随机打乱&lt;br/&gt;p &lt; 0.05 显著]\n  F --&gt; G[全部 FAIL&lt;br/&gt;最佳 p=0.135]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>特征工程</strong>：</p>\n<p>   - 日频矩阵（29 特征）：收益/缺口滞后、滚动收益（5/10/20 日）、波动率（10/20 日滚动标准差 + ATR 比值）、日内结构特征（range ratio、close position、首/末 30 分钟收益、首 bar 量偏离）、前日特征、周几哑变量、一个来自前期工作的 regime 标签</p>\n<p>   - 日内矩阵（30 特征）：在上述基础上增加 12 根 bar 的收益序列（bar_ret_1 到 bar_ret_12，即 09:35–10:25 的 5 分钟收益），作为 LSTM 的时序输入</p>\n<p>   - Tokenization：连续特征用扩窗十分位数分箱为 0–9 离散 token，类似 Kronos 的 binary spherical quantization</p>\n<p>2. <strong>目标变量</strong>：二分类——session close &gt; 10:30 bar open + 10 点。基准率 51.80%（接近均衡）。选择 10 点阈值的原因：基线 ATR 约 10.34 点，代表经济意义上的一整倍 ATR 方向运动。</p>\n<p>3. <strong>梯度提升（3 种配置）</strong>：HistGradientBoostingClassifier，参数固定不变（max_leaf_nodes=15, min_samples_leaf=50, lr=0.05, max_iter=200, L2=1.0）</p>\n<p>   - GB-Daily：日频 token 预测次日涨跌</p>\n<p>   - GB-Intraday：日内特征（含 12 bar 序列但作为独立特征）预测 rest-of-session</p>\n<p>   - GB-VolAdj：同上但目标用 ATR 归一化（阈值 = ATR 比值 × 10.34），消除波动率混杂</p>\n<p>4. <strong>LSTM</strong>：极简架构（1 层 16 单元 + Dropout 0.3），Keras/JAX。输入形状 (12, 1)——仅 12 根 bar 收益。刻意极小化，避免小样本过拟合。若存在序列依赖，应被捕获。</p>\n<p>5. <strong>Walk-Forward + Permutation Test</strong>：严格的三折扩张窗。对显示信号的模型在 Fold 3 做 200 次 permutation test。</p>\n<h2>核心结论与关键结果</h2>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>模型</th><th>合并 OOS 准确率</th><th>最佳折准确率</th><th>Permutation p 值</th><th>结论</th></tr>\n<tr><td>GB-Daily</td><td>50.00%</td><td>53.31% (Fold 1)</td><td>未跑</td><td>FAIL</td></tr>\n<tr><td>GB-Intraday</td><td>50.45%</td><td>54.76% (Fold 3)</td><td><strong>0.135</strong></td><td>FAIL</td></tr>\n<tr><td>GB-VolAdj</td><td>50.89%</td><td>53.01% (Fold 2)</td><td>0.390</td><td>FAIL</td></tr>\n<tr><td>LSTM</td><td>50.59%</td><td>51.00% (Fold 2)</td><td>0.515</td><td>FAIL</td></tr>\n<tr><td>基准率</td><td>51.80%</td><td>—</td><td>—</td><td>—</td></tr>\n</table></div>\n<p>关键发现：</p>\n<ul>\n<li><strong>无一模型统计显著</strong>：最佳结果 p=0.135，远超 0.05 阈值</li>\n<li><strong>LSTM 学到&quot;什么也没有&quot;</strong>：校准曲线近乎平坦——模型对所有输入返回接近 50% 的预测概率。这是&quot;在不足数据上训练的小模型&quot;的预期行为——不过拟合、也不学习</li>\n<li><strong>特征重要性不稳定</strong>：三折 top feature 完全不同（Fold 1: atr_ratio_val → Fold 2: bar_ret_6 → Fold 3: bar_ret_10），确认噪声拟合而非信号捕获</li>\n<li><strong>max permutation accuracy = 61.31%</strong>：在小测试集上，纯随机打乱的标签也能训练出 61% 的准确率——54.76% 远在此范围内</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li><strong>诚实的负面结果</strong>：在金融 ML 论文普遍选择性汇报正结果的背景下，完整记录失败实验具有方法论价值</li>\n<li><strong>经验下界</strong>：为 sequential ML 日内预测建立了数据规模的经验截止值——单品种 944 天 5 分钟数据不够</li>\n<li><strong>严格验证</strong>：扩张窗 walk-forward + permutation test + 校准曲线 + 特征重要性稳定性分析，多维度诊断失败模式</li>\n<li>估算了从失败到成功的桥接距离：Kronos 用了约 920 万根 bar，本文用 7.26 万根 bar，差约 127 倍</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>LSTM 过于极简</strong>：1 层 16 单元可能是&quot;自证预言&quot;——架构小到不可能学到任何东西。作者辩解为有意设计（避免过拟合），但无法区分&quot;模型太小&quot;和&quot;信号不存在&quot;</li>\n<li><strong>仅 MNQ 一个品种</strong>：结论不能简单推广到其他品种（ES、CL、GC 等可能有不同的日内结构）</li>\n<li><strong>仅 5 分钟 K 线</strong>：未测试更细粒度（1 分钟、tick），可能该频率的结构在更高频才存在</li>\n<li><strong>特征仅技术面</strong>：LSTM 仅用 12 根 bar 收益序列，无 OHLCV 四维完整信息</li>\n<li><strong>目标粗粒度</strong>：10 点的二元方向损失了大量路径信息（最大有利偏移、中间入场机会等）</li>\n<li><strong>无迁移学习实验</strong>：如果 Kronos 是真正的 foundation model，fine-tune 到 MNQ 才应是首选方案——但需要额外的工程基础设施</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 中等（CME MNQ tick/bar 数据需购买，但 Databento 较便宜 ≈$42/季度）</li>\n<li><strong>方法清晰度</strong>: 极高，所有参数固定、代码公开、流程严格</li>\n<li><strong>计算成本</strong>: 极低（HistGBM 和单层 LSTM，笔记本可跑）</li>\n<li><strong>综合评分</strong>: ★3.0（评分给的是方法论质量而非结果——负面结果本身可信、流程严谨）</li>\n</ul>\n<h2>复现备注</h2>\n<p>不建议复现本文的&quot;预测模型&quot;（因为作者已验证它们不工作）。但有价值的复现方向：</p>\n<ul>\n<li><strong>提高数据量</strong>：用 MNQ tick 数据（3–5 百万条）训练 LSTM/Transformer，验证&quot;样本量阈值&quot;假设</li>\n<li><strong>多品种联合训练</strong>：ES + NQ + MES + MNQ 同时训练，扩大有效样本量</li>\n<li><strong>用 Kronos 微调</strong>：直接加载 Kronos checkpoint 做 MNQ 微调——这是论文提及但未实施的最直接路径</li>\n<li>本文的 walk-forward + permutation test 验证框架本身就是可复用的好模板</li>\n</ul>"}, {"key": "N7BSGZUA", "title": "Rough volatility dynamics in commodity markets", "year": "2026", "authors": "Roberto Daluiso, Héctor Folgar-Cameán, Andrea Pallavicini…", "tags": ["Quantitative Finance - Computational Finance", "Quantitative Finance - Pricing of Securities"], "venue": "", "abstract": "In this paper, we develop a general rough volatility model for commodities that provides an automatic calibration of the initial term structure of the futures prices and an appropriate treatment of the Samuelson effect. After the theoretical analysis of this general model, we focus on the rBergomi and rHeston models and their calibration to market data of vanilla futures options on WTI Crude Oil. Finally, numerical results illustrate the performance of the proposed rough volatility models for commodities pricing.", "url": "http://arxiv.org/abs/2603.26514", "date_added": "2026-06-27", "summarized": false, "rating": "", "starred": false, "repro": "—", "summary_html": ""}, {"key": "JWKSTW4H", "title": "Rethinking Trend Following: Optimal Regime-Dependent Allocation", "year": "2026", "authors": "Valeriy Zakamulin", "tags": ["Trend Following", "Market Regimes", "Optimal Portfolio Choice", "Regime-Dependent Allocation", "Tactical Asset Allocation", "Time-Series Momentum"], "venue": "", "abstract": "We propose a simple and transparent theoretical framework for optimal regime-dependent allocation in trend-following strategies. While the existing literature on time-series momentum and related approaches focuses primarily on signal construction, portfolio exposures are typically imposed exogenously. In contrast, we treat detected market regimes as conditioning information and derive regime-specific asset exposures directly from a Sharpe-ratio maximization problem. The resulting allocation rule is fully tractable, applies to an arbitrary number of market regimes, and nests standard trend-following strategies as special, and generally suboptimal, cases. Using U.S. equity portfolios, international equity indices, and a broad set of diversified portfolio datasets, we show that optimal regime-dependent allocation delivers economically meaningful and robust improvements in out-of-sample risk-adjusted performance relative to the time-series momentum strategy of Moskowitz, Ooi, and Pedersen (2012) and the dynamic speed momentum strategy of Goulding, Harvey, and Mazzoleni (2023). These gains persist across assets and portfolio implementations, highlighting the central role of optimal positioning in trend following.", "url": "https://papers.ssrn.com/abstract=6376479", "date_added": "2026-05-24", "summarized": true, "rating": "★4.5", "starred": false, "repro": "已复现", "summary_html": "<h1>Rethinking Trend Following: Optimal Regime-Dependent Strategy Weights</h1>\n<p>&gt; Zotero Key: <code>JWKSTW4H</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Zakamulin, Valeriy</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: SSRN Working Paper</li>\n<li><strong>DOI</strong>: —</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=5290578</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/MB5PDRY4/Zakamulin - 2026 - Rethinking Trend Following...pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>通过最大化 Sharpe 比率推导出最优政体依赖型趋势跟踪权重（OPT），相比传统时序动量（TSM）在美国及 14 个国际市场均有显著 Sharpe 提升（+0.15 至 +0.24）。</p>\n<h2>研究动机与问题</h2>\n<p>经典趋势跟踪在牛市持多 +1、熊市持空 -1（或持空/持现金 0）。但这种二元开关是次优的：不同政体的预期收益与波动率不同，最优暴露应按政体加权而非简单切换。本文用 Sharpe 最大化的闭合解回答&quot;各政体最优权重是多少&quot;，并实证检验该框架能否系统性地超越 TSM。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 美国股票（Kenneth French 数据库）；14 个国际市场指数</li>\n<li><strong>频率</strong>: 月度</li>\n<li><strong>样本区间</strong>: 美国 1926 年 7 月–2025 年 12 月；国际市场 1975 年 1 月–2025 年 12 月</li>\n<li><strong>数据来源</strong>: Kenneth French 数据库；MSCI 国际指数</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>政体识别</strong>: 用隐马尔可夫模型（HMM）识别 $S$ 个政体，每个政体 $s$ 对应估计的均值 $\\mu_s$、方差 $\\sigma_s^2$。</p>\n<p><strong>最优权重推导</strong>:</p>\n<p>在给定各政体权重 $w_s \\in [-1, 1]$ 下，无条件 Sharpe 最大化。</p>\n<p>闭合解（比例形式）:</p>\n<p>$$w_s^* \\propto \\frac{\\mu_s}{\\sigma_s^2 + \\mu_s^2} = \\frac{m_s}{q_s}$$</p>\n<p>其中 $q_s = \\sigma_s^2 + m_s^2$（即政体 $s$ 的二阶矩）。</p>\n<p><strong>归一化</strong>: 以最高正权重政体设 $w = 1$，其余政体按比例缩放，确保最大暴露为 1。</p>\n<p><strong>两状态（牛/熊）结果</strong>: 熊市最优权重通常在 $[0, +0.31]$，几乎从不取 -1——说明做空是次优的。</p>\n<p><strong>四状态（牛/调整/熊/反弹）</strong>: 进一步分化，对 Goulding et al. (2023) 的 DSM 有额外改进。</p>\n<p><strong>对比基准</strong>: Buy &amp; Hold、TSM（$w \\in \\{-1, +1\\}$）、DSM（$w \\in \\{0, +1\\}$ 或特定政体权重）。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>美国市场（两状态）</strong>: OPT vs TSM，Sharpe 提升约 +0.15 至 +0.23。</li>\n<li><strong>14 个国际市场平均</strong>: OPT vs TSM，Sharpe 平均提升 +0.241。</li>\n<li>熊市最优权重几乎从不为 -1，做空往往损害 Sharpe（熊市波动率极高，抵消了方向收益）。</li>\n<li>四状态 OPT 进一步超越两状态 OPT；反弹政体（熊转牛）权重通常最高。</li>\n<li>在所有测试市场中，OPT 的 Sharpe 均优于 DSM。</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次给出趋势跟踪政体权重的<strong>闭合解</strong>，不需要数值优化。</li>\n<li>理论上证明二元 ±1 权重是次优的，并量化了损失。</li>\n<li>将框架从两状态扩展至四状态，覆盖市场周期全貌。</li>\n<li>在跨越近百年的美国数据及多个国际市场中验证结论。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>政体由 HMM 识别，参数估计存在不确定性（均值估计噪声大）。</li>\n<li>闭合解依赖政体参数的精确估计，实盘中政体转换存在滞后。</li>\n<li>权重计算基于历史均值/方差，在分布不稳定的商品期货中泛化性待验证。</li>\n<li>样本以月度股权为主，商品/债券等多资产的适用性未直接检验。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: Kenneth French 库公开；国际 MSCI 数据需 Bloomberg/Wind，中国商品期货需天软。</li>\n<li><strong>方法清晰度</strong>: 闭合解公式完整，HMM 用标准库（hmmlearn）即可实现。</li>\n<li><strong>计算成本</strong>: 低，月度频率，HMM 收敛快。</li>\n<li><strong>综合评分</strong>: ★4.5</li>\n</ul>\n<h2>复现备注</h2>\n<p><strong>最小可行版本</strong>:</p>\n<p>1. 用 hmmlearn 对单个品种（如 IF 股指期货）拟合两状态 HMM（月度收益）。</p>\n<p>2. 计算各政体的 $\\mu_s$、$\\sigma_s^2$，代入闭合解得 $w_s^*$。</p>\n<p>3. 与现有 TSM 信号的等权 ±1 切换做回测对比。</p>\n<p>关键风险：政体参数估计不稳定；建议用扩展窗口（expanding window）而非滚动窗口避免过拟合。</p>\n<p>对接路径: <code>（内部研究目录）</code></p>"}, {"key": "HPFM2DPL", "title": "Reinforcement Learning for Risk-Sensitive Investment Management: a Free Energy--Entropy Duality Approach", "year": "2026", "authors": "Sebastien Lleo, Wolfgang Runggaldier", "tags": ["Quantitative Finance - Portfolio Management", "Mathematics - Optimization and Control"], "venue": "", "abstract": "This paper develops a reinforcement-learning approach to continuous-time risk-sensitive benchmarked asset allocation in a partly model-based setting. The benchmarked problem does not directly fit the standard Markovian stochastic-control template: the state is uncontrolled, whereas the terminal reward contains a controlled Itô integral. We use free energy-entropy duality to reformulate the problem as a linear-quadratic-Gaussian stochastic differential game under an equivalent probability measure, yielding explicit finite- and infinite-horizon saddle-point solutions. This structure guides a continuous-time $q$-learning actor-critic method: the quadratic value function motivates the critic, while the affine saddle-point controls motivate deterministic actors for the portfolio allocation and adversarial control. The learned allocation admits an economic interpretation through fractional Kelly decompositions. A proof-of-concept implementation calibrated to U.S. equity data shows that the actors learn the optimal policy with high accuracy and reveals a favorable asymmetry: the portfolio actor receives a cleaner learning signal than the auxiliary adversarial actor.", "url": "http://arxiv.org/abs/2606.20903", "date_added": "2026-06-23", "summarized": true, "rating": "★2.5", "starred": false, "repro": "—", "summary_html": "<h1>Reinforcement Learning for Risk-Sensitive Investment Management: a Free Energy–Entropy Duality Approach</h1>\n<p>&gt; Zotero Key: <code>HPFM2DPL</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>:Sébastien Lleo (NEOMA Business School), Wolfgang Runggaldier (University of Padova / Institut Louis Bachelier)</li>\n<li><strong>年份</strong>:2026</li>\n<li><strong>出处</strong>:arXiv preprint (q-fin.PM)</li>\n<li><strong>DOI</strong>:10.48550/arXiv.2606.20903</li>\n<li><strong>链接</strong>:http://arxiv.org/abs/2606.20903</li>\n<li><strong>本地 PDF</strong>:<code>~/Documents/Zotero/storage/A4FUNM4Q/Lleo和Runggaldier - 2026 - Reinforcement Learning for Risk-Sensitive Investment Management a Free Energy--Entropy Duality Appr.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>针对连续时间、风险敏感、带基准(benchmarked)的资产配置问题,作者用自由能-熵对偶把它重构成一个等价测度下的线性二次高斯(LQG)随机微分博弈,得到显式鞍点解,并据此设计可解释的连续时间 $q$-learning actor-critic 算法;用美股 ETF 数据做概念验证,算法能高精度学到最优策略,且组合 actor 比对抗 actor 学得更准。</p>\n<h2>研究动机与问题</h2>\n<p>连续时间资产配置通常假设投资者已知或能精确估计模型参数(预期收益、因子暴露、协方差),但实践中这些极难估准,估计误差会严重扭曲最优组合。强化学习提供了一条从数据学策略、减少对精确模型依赖的互补路径。但风险敏感的<strong>基准化</strong>配置问题不直接套用标准马尔可夫随机控制模板:状态过程不受控,而终端奖励里含一个<strong>受控的伊藤积分</strong>(组合相对基准的对数超额收益),期望下不消失。本文要解决:如何把这类问题转化为可学习、可解释的 RL 框架。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>:美股 ETF 配置问题,$m=13$ 只 ETF(11 只跟踪 S&amp;P 500 GICS 行业,可复制 S&amp;P 500;另加 iShares S&amp;P 400 中盘 IJH 与 S&amp;P 600 小盘 IJR)</li>\n<li><strong>基准</strong>:90% S&amp;P 500 + 10% S&amp;P 400</li>\n<li><strong>因子</strong>:六因子(Fama-French 五因子 + Carhart 动量)</li>\n<li><strong>频率</strong>:日频,$\\Delta t = 1/252$,$\\mathcal{T}=1644$ 个观测</li>\n<li><strong>样本区间</strong>:2018-06-20 至 2024-12-31(GICS 行业修订后最早可得日,涵盖 2019 上涨、2020 新冠崩盘与反弹)</li>\n<li><strong>数据来源</strong>:因子与货币市场收益来自 Kenneth French 数据库;ETF 收益来自 CRSP。注意:实现是用解析模型<strong>模拟</strong>数据来训练,属概念验证而非全 model-free</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[风险敏感基准化配置问题&lt;br/&gt;状态不受控+终端含受控伊藤积分] --&gt; B[自由能-熵对偶&lt;br/&gt;换等价测度]\n  B --&gt; C[LQG 随机微分博弈&lt;br/&gt;极小化:组合 H / 极大化:对抗 Γ]\n  C --&gt; D[Bellman-Isaacs PDE&lt;br/&gt;值函数二次型 + 仿射鞍点策略]\n  D --&gt; E1[有限期解&lt;br/&gt;Riccati 方程 Q,q,k]\n  D --&gt; E2[无限期/遍历解&lt;br/&gt;代数 Riccati + 长期值 ρ]\n  E1 &amp; E2 --&gt; F[结构指导参数化:&lt;br/&gt;critic 二次型值函数 / actor 仿射策略]\n  F --&gt; G[连续时间 q-learning&lt;br/&gt;actor-critic 鞅正交条件]\n  G --&gt; H[组合策略 h* + 对抗策略 γ*]\n  H --&gt; I[分数 Kelly 分解:&lt;br/&gt;Kelly + 基准跟踪 + 跨期对冲]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>市场模型</strong>:$m$ 个风险资产价格 $dS_s = \\mathrm{diag}(S_s)[(a_s+A_sX_s)ds + \\Sigma_s dW_s]$,因子(状态)过程 $dX_s=(b_s+B_sX_s)ds+\\Lambda_s dW_s$,基准 $L$ 类似。组合的对数价格相对 $R_s=\\ln(V_s/L_s)$ 度量相对基准的累计超额。</p>\n<p>2. <strong>风险敏感准则</strong>:最大化 $J_T(H,\\theta)=-\\tfrac{1}{\\theta}\\ln \\mathbf{E}[e^{-\\theta(R_T-R_0)}]$,$\\theta$ 为风险敏感参数(主要关注 $\\theta&gt;0$)。</p>\n<p>3. <strong>自由能-熵对偶</strong>:把上式重写为等价测度 $\\mathbb{P}^\\Gamma$ 下的极小极大:</p>\n<p>$$\\inf_H I_T(H,\\theta)=\\exp\\Big\\{\\inf_H \\sup_\\Gamma \\mathbf{E}^{\\mathbb{P}^\\Gamma}\\big[\\theta\\!\\int_0^T g(s,X_s,h_s,\\gamma_s;\\theta)ds\\big]\\Big\\}$$</p>\n<p>其中 $\\Gamma$ 是通过 Girsanov 引入测度变换的&quot;对抗&quot;控制。这把风险敏感控制变成<strong>两人零和随机微分博弈</strong>。</p>\n<p>4. <strong>LQG 博弈求解</strong>:对应 Bellman-Isaacs PDE 的值函数是状态的二次型 $u(t,x)=-\\theta(\\tfrac12 x&#x27;Q_tx+q_t&#x27;x+k_t)$,其中 $Q_t$ 解矩阵 Riccati 方程、$q_t$ 解线性 ODE、$k_t$ 由积分给出;最优组合 $\\hat h$ 与对抗 $\\hat\\gamma$ 均为状态的<strong>仿射</strong>函数(显式鞍点)。</p>\n<p>5. <strong>无限期/遍历扩展(第 3 节)</strong>:常系数下 Riccati 系统收敛到代数 Riccati 方程,给出相对值函数与长期标量值 $\\rho$,适合机构&quot;持续经营、长期风险调整收益&quot;的设定。</p>\n<p>6. <strong>连续时间 actor-critic(第 4 节)</strong>:沿 Jia-Zhou 的连续时间 RL 鞅方法。值函数二次型 → critic 参数化;仿射鞍点 → actor 参数化(确定性 Markov 策略);定义连续时间 action-value $q$,用鞅正交条件构造半梯度 TD 更新。critic 用 TD 残差更新,两个 actor(组合 $h$ 用确定性策略梯度下降、对抗 $\\gamma$ 上升)用 $q$ 的 action-梯度更新(Algorithm 1,在线 on-policy)。</p>\n<p>7. <strong>可解释性——分数 Kelly 分解(第 4.5 节)</strong>:学到的配置可分解为三只基金的固定组合:</p>\n<p>$$h^*(s,X_s)=f\\,h^K + (1-f)h^{\\text{Bench}} - (1-f)h^{\\text{IHP}},\\quad f=\\tfrac{1}{\\theta+1}$$</p>\n<p>即 Kelly 组合 + 基准跟踪组合 + 跨期对冲组合(IHP),相对权重只取决于已知的风险敏感度 $\\theta$,使 RL 输出有经济解释。</p>\n<p>8. <strong>概念验证实现(第 5 节)</strong>:固定遍历相对值函数为解析形式,critic 只学 actor 相关的 $q$ 梯度($M_h, M_\\gamma$ 用递归最小二乘),用解析模型模拟的标准化动态生成数据,检验 actor-critic 能否从零学到解析最优策略。R 语言实现。</p>\n<p>9. <strong>输出</strong>:学到的组合策略 $h^*$(经济相关的可交易配置)与对抗策略 $\\gamma^*$。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>算法能以<strong>高精度</strong>恢复解析鞍点最优策略,验证了&quot;用博弈结构指导 actor/critic 参数化&quot;的可行性。</li>\n<li>发现一个有利的<strong>结构不对称</strong>:组合 actor(策略梯度 critic)学得几乎精确,而对抗 actor 因对抗控制进入状态转移而保留小的残差误差。由于组合配置才是经济上相关的控制,这种不对称对资产管理应用是好事。</li>\n<li>Kelly 组合对应风险中性极限($\\theta\\to 0$),基准化配置呈分数 Kelly 形式;三基金分解的相对权重仅由 $\\theta$ 决定,可在有限额外算力下让 RL 输出可解释(基准跟踪组合 = 用资产对冲基准的最小方差对冲比,可由序贯多元回归在线估计)。</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>把自由能-熵对偶用作 RL 的桥梁:将风险敏感基准化控制等价转成 LQG 随机微分博弈,从而获得二次值函数 + 仿射策略的精确结构来设计 critic/actor。</li>\n<li>在连续时间 RL 中采用<strong>确定性</strong>策略(而非探索型随机策略),探索通过 behavior policy 引入。</li>\n<li>同时给出 episodic(有限期)与 continuing(遍历)两套 RL 形式,后者贴合机构长期投资。</li>\n<li>用分数 Kelly 三基金分解解决 RL 在投资管理中&quot;难以向客户/监管解释&quot;的痛点。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>本质是<strong>理论 + 概念验证</strong>论文:实现用解析模型模拟数据训练,并非真正 model-free,也未在真实市场数据上做样本外回测或与基准策略比较收益/夏普。</li>\n<li>强依赖 LQG 线性高斯假设(收益对因子线性、常系数遍历设定),真实市场的非线性、厚尾、状态依赖波动不在框架内。</li>\n<li>对抗 actor 的残差误差与一般非 LQG 情形下的收敛性未充分讨论。</li>\n<li>没有交易成本、容量、做空约束等实务摩擦。</li>\n<li>风险敏感参数 $\\theta$ 的选取、参数估计误差对学习结果的影响未系统评估。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>:好(因子来自 Kenneth French 公开库,ETF 来自 CRSP),但论文本身用模拟数据,真实数据复现需自行搭建。</li>\n<li><strong>方法清晰度</strong>:数学推导完整(Riccati、鞍点、算法伪代码齐全),但偏理论;把它落成稳定的真实数据 RL 系统需要大量额外工程与调参。</li>\n<li><strong>计算成本</strong>:概念验证算力低(R 实现、模拟数据),但若扩展到 model-free、真实数据、多客户场景则成本上升。</li>\n<li><strong>综合评分</strong>:★2.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>不建议作为优先复现对象:这是一篇连续时间随机控制 + RL 的理论方法论文,实证仅为模拟数据的概念验证,缺乏真实市场样本外业绩,直接落地为可交易策略的距离较远。若要借鉴,价值点在两处:① <strong>分数 Kelly 三基金分解</strong>(Kelly + 基准跟踪 + 跨期对冲)作为可解释的基准化配置框架,可独立于 RL 使用;② 把风险敏感目标转成对偶博弈的建模思路。最小验证版可先在合成 LQG 因子模型上复现解析 Riccati 解与 Algorithm 1 的收敛性,确认 actor-critic 能恢复鞍点,再评估是否值得投入真实数据扩展。属理论参考类,复现优先级低。</p>"}, {"key": "589ZKP55", "title": "Regime-Adaptive Continual Learning for Portfolio Management", "year": "2026", "authors": "Chaofan Pan, Lingfei Ren, Linbo Xiong…", "tags": ["Quantitative Finance - Portfolio Management", "Computer Science - Artificial Intelligence"], "venue": "", "abstract": "Financial markets are inherently non-stationary, exhibiting frequent regime shifts and structural changes that render traditional Portfolio Management (PM) approaches ineffective. Existing remedies, such as rolling-window retraining and naive online fine-tuning, are hindered by high computational costs and insufficient knowledge utilization, respectively, resulting in low returns and limited adaptability. Continual learning (CL) offers a promising paradigm by enabling trading agents to accumulate and transfer knowledge across sequential tasks. In this paper, we propose \\textbf{Re}gime-aware \\textbf{C}ontinual \\textbf{A}daptive \\textbf{P}ortfolio management (\\textbf{ReCAP}), a novel framework that integrates CL into PM to address the challenges of dynamic financial environments. ReCAP employs an adaptive regime detection module to segment historical market data into variable-length regimes, enabling regime-specific learning of policy vectors and the construction of a policy library. During continual trading, a regime-gate module adaptively combines policy vectors from the library based on the current market state, facilitating rapid adaptation to newly detected regimes. Only the regime-gate and the current regime's policy vector are continually updated to preserve useful knowledge effectively. Extensive experiments on five real-world datasets demonstrate that ReCAP consistently outperforms popular baselines, achieving superior returns in long-term investment horizons and rapid adaptation to regime shifts.", "url": "http://arxiv.org/abs/2606.00143", "date_added": "2026-06-26", "summarized": true, "rating": "★4.0", "starred": false, "repro": "待复现", "summary_html": "<h1>Regime-Adaptive Continual Learning for Portfolio Management</h1>\n<p>&gt; Zotero Key: <code>589ZKP55</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Chaofan Pan, Longbing Cao, Weiqing Liu, Jiang Bian</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: KDD 2026（第32届ACM知识发现与数据挖掘会议，2026年8月9—13日，济州岛）</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2606.00143</li>\n<li><strong>链接</strong>: https://arxiv.org/abs/2606.00143</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/Y32REE7M/Pan 等 - 2026 - Regime-Adaptive Continual Learning for Portfolio Management.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>ReCAP 框架将市场机制检测、在线策略库积累、动态策略组合融为一体，通过 CUSUM 分割历史数据、为每段制度微调独立策略参数并将其存入库、推理时用 softmax 注意力动态合并，在 5 个真实股票/商品数据集上全面超越 13 个基线方法。</p>\n<h2>研究动机与问题</h2>\n<p>强化学习组合管理方法在真实市场中面临分布漂移：单一静态策略无法适应多变市场状态，而反复全量重训效率低且会遗忘历史规律。现有持续学习方法（EWC、Replay等）未针对金融市场的机制切换特性专门设计，导致策略在不同市场阶段泛化能力差。ReCAP 提出&quot;制度感知持续学习&quot;，让模型在不遗忘历史知识的前提下持续适应新制度。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: DOW30（29只）、NAS100（73只）、SP500（398只）、NIKKEI30（29只）、COMMODITY_ETF（7只）</li>\n<li><strong>频率</strong>: 日频</li>\n<li><strong>样本区间</strong>: 2008-05-01 至 2025-04-29；训练期截止 2020-04-30，测试期 2020-05-01 起</li>\n<li><strong>数据来源</strong>: Yahoo Finance</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n    A[历史日收益时序] --&gt; B[ARD 模块\\nCUSUM 在线制度检测]\n    B --&gt; C{检测到制度切换?}\n    C --&gt;|是| D[截取当前制度片段\\n对基础策略 theta_0 微调]\n    C --&gt;|否| E[继续积累当前制度数据]\n    D --&gt; F[策略库 Policy Library\\n存储增量向量 d_j = theta_j - theta_0]\n    F --&gt; G[RGM 模块\\n实时市场编码 m_t]\n    G --&gt; H[Softmax 注意力\\nalpha_t = Softmax g_phi m_t]\n    H --&gt; I[策略组合\\ntheta_t = theta_0 + D tilde alpha_t]\n    I --&gt; J[组合权重输出\\nw_t = Softmax theta_t dot s_t]\n    J --&gt; K[投资组合收益]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>基础策略预训练</strong>: 在完整训练集上用标准深度强化学习（如 PPO/A2C）训练基础策略参数 $\\theta_0$，作为所有历史知识的公共基础。</p>\n<p>2. <strong>ARD（自适应制度检测）模块</strong>: 用 CUSUM（累积和控制图）统计量在线检测均值漂移。当收益序列的累积偏差超过阈值 $h$ 时触发制度切换信号，将时序切分为若干连续制度片段 $[t_j, t_{j+1})$。</p>\n<p>3. <strong>制度级策略微调</strong>: 对每个识别出的制度片段，以 $\\theta_0$ 为初始化，在该片段数据上轻量微调得到制度专属参数 $\\theta_j$，计算增量向量 $d_j = \\theta_j - \\theta_0$；每个 $d_j$ 代表该制度相对基础策略的知识增量。</p>\n<p>4. <strong>策略库（Policy Library）</strong>: 将所有历史制度的增量向量 $\\{d_j\\}_{j=1}^J$ 存成矩阵 $\\tilde{D} = [d_1,\\ldots,d_J]$。库动态扩充，无需删除历史知识。</p>\n<p>5. <strong>RGM（制度门控模块）</strong>: 在推理时刻 $t$，提取实时市场状态特征 $m_t$（包含近期收益、波动率等），通过参数化注意力网络 $g_\\phi$ 计算对库中每个制度策略的相似度权重：</p>\n<p>$$\\alpha_t = \\text{Softmax}(g_\\phi(m_t)) \\in \\mathbb{R}^J$$</p>\n<p>6. <strong>动态策略组合</strong>: 将库中各制度增量按权重加权叠加回基础策略：</p>\n<p>$$\\theta_t = \\theta_0 + \\tilde{D}\\,\\alpha_t$$</p>\n<p>这保证了对历史所有制度知识的软组合，同时仍以基础策略为锚。</p>\n<p>7. <strong>组合权重输出</strong>: 用当前时刻各股票的状态表征 $s_t$（价量特征）与策略向量 $\\theta_t$ 点积后经 Softmax 归一化得到投资权重 $w_t$，执行多头做多组合。</p>\n<h2>核心结论与关键结果</h2>\n<p>在5个数据集的测试期（2020—2025）上与13个基线对比：</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>数据集</th><th>CR（累积收益）</th><th>SR（夏普比）</th><th>MDD（最大回撤）</th></tr>\n<tr><td>NAS100</td><td><strong>164.89%</strong></td><td><strong>1.14</strong></td><td>23.86%</td></tr>\n<tr><td>DOW30</td><td>优于所有基线</td><td>—</td><td>—</td></tr>\n<tr><td>SP500</td><td>优于所有基线</td><td>—</td><td>—</td></tr>\n<tr><td>NIKKEI30</td><td>优于所有基线</td><td>—</td><td>—</td></tr>\n<tr><td>COMMODITY_ETF</td><td>优于所有基线</td><td>—</td><td>—</td></tr>\n</table></div>\n<p>测试期覆盖新冠疫情、2022年加息周期、2023年 AI 行情等多种极端市场状态，ReCAP 在所有制度下均保持竞争力。</p>\n<p><strong>消融实验</strong>（去除各模块影响）：</p>\n<ul>\n<li>去掉 ARD（固定窗口划分）影响最大，印证制度检测的核心价值</li>\n<li>去掉策略库（退化为单策略）次之</li>\n<li>去掉 RGM（均等权重组合）影响最小</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li><strong>三模块解耦设计</strong>：ARD 负责制度边界，策略库负责知识积累，RGM 负责软路由，三者可独立验证与替换。</li>\n<li><strong>增量向量库</strong>：以差值 $d_j=\\theta_j-\\theta_0$ 存储而非完整参数，极大减小库空间并保持对公共基础的可解释偏差。</li>\n<li><strong>制度感知持续学习首次用于组合管理</strong>：系统性解决 DRL 组合管理中的灾难性遗忘与分布漂移问题。</li>\n<li>测试期跨越2020—2025年，是近年公开工作中时间覆盖最丰富之一。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>CUSUM 阈值 $h$ 需人工设定，制度数量和边界对该参数敏感。</li>\n<li>策略库随时间线性增长，长期运行时推理成本上升（$J$ 变大后注意力计算量增加）。</li>\n<li>测试数据来自 Yahoo Finance 未经清洗，价格数据质量和股息处理对结果有影响。</li>\n<li>仅测试做多策略，未考虑做空与杠杆；交易成本假设从简。</li>\n<li>在 COMMODITY_ETF（仅7个标的）上样本量极小，结果稳健性存疑。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: Yahoo Finance 公开可下载，5个数据集标的列表论文附录给出。</li>\n<li><strong>方法清晰度</strong>: 三模块各自描述清晰，Algorithm 伪代码完整，CUSUM 参数给出。</li>\n<li><strong>计算成本</strong>: 需要 GPU 训练 DRL 基础策略，微调轻量；测试期推理极快。</li>\n<li><strong>综合评分</strong>: ★4.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>官方代码已公开：github.com/Dumail/ReCAP。复现路径：先在 DOW30 数据上跑通基础 DRL（PPO）→ 实现 CUSUM 分割 → 制度微调 → 策略库 + RGM。最小可行版本可先固定 CUSUM 阈值跑 NAS100，验证 CR 和 SR 量级是否与论文一致（NAS100 CR=164.89%）。主要风险：DRL 训练随机性较大，结果可能需要多次运行取均值。</p>"}, {"key": "MSGVPZNI", "title": "Pricing Compute Futures: Forward Curve and Volatility for a Non-Storable, Depreciating Commodity", "year": "2026", "authors": "Amine Assody", "tags": ["AI infrastructure", "basis risk", "commodity derivatives", "compute futures", "forward curve", "GPU rental rates", "implied volatility", "jump diffusion", "non-storable commodities", "Schwartz-Smith model"], "venue": "", "abstract": "<p>GPU rental rates are becoming a benchmarked, exchange-traded underlying. In May 2026 CME Group and ICE both announced cash-settled compute futures referencin", "url": "https://papers.ssrn.com/abstract=6926798", "date_added": "2026-06-20", "summarized": true, "rating": "★2.5", "starred": false, "repro": "—", "summary_html": "<h1>Pricing Compute Futures: Forward Curve and Volatility for a Non-Storable, Depreciating Commodity</h1>\n<p>&gt; Zotero Key: <code>MSGVPZNI</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Amine Assody</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: SSRN Working Paper v1.1</li>\n<li><strong>DOI</strong>: —</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=6926798</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/Z7WR3EKF/Assody - 2026 - Pricing Compute Futures Forward Curve and Volatility for a Non-Storable, Depreciating Commodity.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>针对 GPU 算力租赁期货这一新兴品种，提出 Schwartz-Smith 双因子加调度跳跃模型，推导出结构性反向市场（backwardation）的远期曲线和含发布窗口隆起的隐含波动率期限结构，并在市场上线前给出三个可证伪预测。</p>\n<h2>研究动机与问题</h2>\n<p>2026 年 5 月 CME 和 ICE 相继宣布推出以 GPU 日租价指数现金结算的算力期货。传统大宗商品定价工具（现货-期货无套利、持有成本模型）无法直接用于算力期货，因为：① 算力不可储存（空闲算力不可转移），无套利远期定价不成立；② 底层资产（GPU 硬件代际）每代贬值，导致均衡租价系统性下行；③ 废代事件（新硬件上市）按计划到来、幅度不确定，类似股票期权中的财报日；④ 现货均值回归到一个能源成本锚定的下限而非固定值。本文目标：提出最简可用的定价框架，并在市场有历史数据之前给出可被市场验证的预测。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: H100 GPU 小时租价（Silicon Data SDH100RT 混合指数，Ornn Compute Price Index），以及 A100 历史报价（CoreWeave 挂牌价与市场成交价）</li>\n<li><strong>频率</strong>: 日频（指数序列自 2024 年 9 月至 2026 年 6 月）；月度 / 季度节点用于代际跳跃标定</li>\n<li><strong>样本区间</strong>: A100 参考价 2023–2026 年；H100 Blackwell 替换窗口 2024 年 9 月至 2025 年 6 月</li>\n<li><strong>数据来源</strong>: Silicon Data 公开日线序列、Ornn 市场成交记录、各提供商公开挂牌价；无专有数据</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[GPU 日租价现货 S_t] --&gt; B[对数分解&lt;br/&gt;ln S = chi + xi + J]\n  B --&gt; C[短期因子 chi&lt;br/&gt;均值回归至零 速率 kappa&lt;br/&gt;半衰期约3个月]\n  B --&gt; D[长期均衡因子 xi&lt;br/&gt;负漂移 mu_xi 约-6%/年&lt;br/&gt;随机游走]\n  B --&gt; E[代际跳跃 J&lt;br/&gt;集中于公告发布窗口&lt;br/&gt;均值约-0.22对数]\n  C --&gt; F[远期曲线 F t T&lt;br/&gt;闭式解含漂移校正项&lt;br/&gt;和跳跃补偿项 Lambda]\n  D --&gt; F\n  E --&gt; F\n  F --&gt; G[结构性反向市场预测&lt;br/&gt;F 1y ~1.90 F 3y ~1.37]\n  F --&gt; H[Black-76 期权定价&lt;br/&gt;总方差 = 扩散方差 + 跳跃方差]\n  H --&gt; I[隐含波动率期限结构&lt;br/&gt;ATM IV 50.3% 3m 至 27.5% 3y&lt;br/&gt;发布窗口处有局部隆起]</div>\n<h3>步骤详解</h3>\n<p><strong>整体架构</strong>：Schwartz-Smith（2000）双因子框架 + 调度跳跃扩展，以&quot;收益率预期 + 风险溢价&quot;替换无套利定价。</p>\n<p>1. <strong>现货价格分解</strong>：对数现货价格拆成三部分：</p>\n<p>   $$\\ln S(t) = \\chi(t) + \\xi(t) + J(t)$$</p>\n<p>   - $\\chi$：短期偏差，以速度 $\\kappa$（月级半衰期）均值回归至零，捕捉供需紧张与产能摩擦</p>\n<p>   - $\\xi$：长期均衡对数租价，负漂移 $\\mu_\\xi \\approx -6\\%$/年（代际容量扩张推动），自相关随机游走</p>\n<p>   - $J$：在公告的硬件发布窗口内集中发生的跳跃，每窗口一个跳跃事件（确定发生，幅度不确定），跳跃幅度服从均值 $-0.22$、方差从两次完成代际替换标定</p>\n<p>2. <strong>远期曲线闭式解</strong>：因资产不可储存，远期价格为现货的风险中性期望（风险溢价折入漂移）：</p>\n<p>   $$F(t,T) = \\exp\\left(e^{-\\kappa(T-t)}\\chi(t) + \\xi(t) + A(T-t) + \\Lambda(t,T)\\right)$$</p>\n<p>   其中 $A(\\tau)$ 包含双扩散因子的漂移和凸性校正；$\\Lambda(t,T)$ 为跳跃补偿量——在远期曲线经过的每个发布窗口处产生台阶式下降，而非平滑衰减。</p>\n<p>3. <strong>代际跳跃参数标定</strong>：利用两次已完成的代际替换（A100→H100、H100→Blackwell）做事件研究：取替换前后同档位锚点价格的对数差，减去结构漂移贡献，余量归因于代际事件。三次独立测量（$-0.23$、$-0.21$、$-0.22$）高度集中，均值取 $-0.22$（价格层面约 $-20\\%$）。</p>\n<p>4. <strong>期权定价（Black-76）</strong>：期货是可持有的对冲工具（现货不可持有），故用 Black-76 对远期定价。到期选项的总方差为：</p>\n<p>   $$\\text{TotalVar} = \\underbrace{\\text{扩散方差（按均值回归速度衰减）}}_{\\text{随期限延长快速减小}} + \\underbrace{\\text{跳跃方差（窗口内最大）}}_{\\text{窗口过后归零}}$$</p>\n<p>   跳跃方差在发布窗口附近的到期日处产生局部隆起；Poisson 变体（跳跃次数随机）使这些隆起更大，因为计数的不确定性叠加幅度的不确定性。</p>\n<p>5. <strong>三个可证伪预测</strong>（在合约上市前给出）：</p>\n<p>   - <strong>预测一（形状）</strong>：结构性反向市场——远期价格从 $2.60 → $1.90（1 年）→ $1.37（3 年），约每年对数下跌 21%</p>\n<p>   - <strong>预测二（波动率）</strong>：隐含波动率急剧下行期限结构（50.3% @ 3m → 27.5% @ 3y），发布窗口处有局部隆起</p>\n<p>   - <strong>预测三（偏斜）</strong>：偏斜期限结构反转——近端看涨偏斜（消费者担心价格上涨）、远端看跌偏斜（运营商卖出远期对冲边际成本下限）</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>代际跳跃幅度</strong>：跨两代硬件三次独立测量集中在 $-0.22$ 对数单位（$\\approx -20\\%$ 价格），残差漂移约 $-6\\%$/年</li>\n<li><strong>远期曲线形状</strong>：模型预测 1 年期远期 \\$1.90，3 年期 \\$1.37；发布窗口（9 个月、24 个月）处有台阶式下跌（见图 1）</li>\n<li><strong>隐含波动率</strong>：ATM IV 从 3 个月的 50.3% 降至 3 年的 27.5%（约 Brownian scaling 的 1/3）；Poisson 变体 1 年期 IV 约 41.9%，base case 约 36.0%</li>\n<li><strong>现货仅标定可识别总波动率</strong>：从现货序列单独标定无法分离双因子（均值回归速度和漂移），需要期货条带价格联合标定（Kalman 滤波极大似然）</li>\n<li><strong>Basis 风险</strong>：同一张 H100 卡在 2025 年 H2 的不同供应商层（marketplace \\$1.95，neocloud \\$3.33，hyperscaler \\$6.26），指数混合平均不等于任何具体买方的暴露</li>\n</ul>\n<h2>创新点</h2>\n<p>1. 将 Schwartz-Smith 双因子商品框架首次系统化地应用于 GPU 算力租赁这一&quot;不可储存且贬值&quot;的新品种</p>\n<p>2. 将代际废代事件类比于股票财报日处理（确定发生、幅度不确定），而非随机 Poisson 到达，从而给出更精确的发布窗口波动率隆起</p>\n<p>3. 在期货上市前提出三个可证伪的定量预测，提供了罕见的事前验证机会</p>\n<p>4. 明确区分 basis 风险（指数混合 vs 具体采购暴露）对套保有效性测试的影响</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>Working Paper / 未经同行评审</strong>：结论未经独立核实，模型参数大量依赖少数公开数据点</li>\n<li><strong>仅两次代际样本</strong>：A100→H100 和 H100→Blackwell 均处于同一宏观需求周期，统计独立性存疑；跳跃幅度估计区间宽（$-0.27$ 至 $-0.17$）</li>\n<li><strong>风险溢价未识别</strong>：折入漂移处理使远期曲线产出&quot;期望现货预测&quot;而非真正的风险中性价格，模型在没有期货价格历史时无法分离风险溢价</li>\n<li><strong>双因子无法从现货单独识别</strong>：均值回归速度和长短期漂移分解需要期货条带；当前只有不足两年的现货序列</li>\n<li><strong>Basis 风险未建模</strong>：混合结算指数与实际采购暴露的楔子在极端情况下超过 3:1，套保比率误差极大</li>\n<li><strong>期权定价简化</strong>：Black-76 + 对数正态近似在左尾（负向大跳跃）系统性低估 put 翼，文章承认 Merton（1976）混合模型是自然扩展</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: Silicon Data 和 Ornn 指数需授权（非公开免费）；月度节点可从各提供商公开网页和二手报道拼凑；A100 / H100 跳跃事件数据有限但可查</li>\n<li><strong>方法清晰度</strong>: 核心模型（Schwartz-Smith + 跳跃）框架清晰；作者声称模型代码可应要求提供；标定部分细节有待期货条带数据</li>\n<li><strong>计算成本</strong>: 闭式远期 + Black-76，计算极轻量；Kalman 滤波全标定中等复杂度</li>\n<li><strong>综合评分</strong>: ★2.5</li>\n</ul>\n<h2>复现备注</h2>\n<p><strong>不建议投入复现</strong>，主要原因：</p>\n<p>1. 核心标的（GPU 算力期货）目前国内不可交易，无实盘应用场景</p>\n<p>2. 模型本质是 Schwartz-Smith 的经典框架搬运，方法论创新有限</p>\n<p>3. 关键数据（Silicon Data 日线序列）需付费授权，最少可行版本数据缺口明显</p>\n<p>4. 学术质量属 Working Paper 级别，尚未经过同行评审</p>\n<p>若纯学术兴趣可从 Schwartz-Smith（2000）原始电力期货框架出发，用公开的 H100 月度价格点验证跳跃幅度标定逻辑即可。</p>"}, {"key": "J9UMMZ2T", "title": "Portfolio Optimization for Commodity ETFs under Heavy-Tailed Returns", "year": "2026", "authors": "Nicholas Appiah, Ali Jaffri, Dilmi C. W. Hettiachchi-Halpe-Kankanamalage…", "tags": ["Quantitative Finance - Risk Management", "Quantitative Finance - Portfolio Management"], "venue": "", "abstract": "This paper examines portfolio optimization for commodity exchange-traded funds (ETFs) under heavy-tailed return behavior. Using daily Bloomberg data for 30 U.S.-listed commodity ETFs from 12 December 2018 to 16 December 2024, we study funds spanning agriculture, energy, metals, and broad commodity index exposure. We compare a passive buy-and-hold portfolio with rolling-window optimized portfolios formed under mean--variance and conditional value-at-risk (CVaR) criteria, considering both long-only and restricted long--short strategies. The results showed substantial heterogeneity across commodity sectors, with energy and broad commodity index funds displaying pronounced volatility, skewness, and excess kurtosis. Historical optimization indicated that minimum-risk and CVaR-based portfolios provided more stable cumulative performance than tangent portfolios and generally improved Sharpe, Calmar, and STARR$_{0.95}$ ratios. Extreme-value diagnostics showed that optimized portfolios remained exposed to heavy downside tails, so improved risk-adjusted performance did not eliminate extreme-loss risk. A dynamic extension based on ARMA--GARCH marginal models, Student--$t$ copula dependence, and one-step-ahead predictive scenarios improved performance mainly when combined with minimum-risk or CVaR-based objectives. Dynamic mean--variance tangent portfolios performed less reliably, reflecting sensitivity to expected-return estimation error. Transaction-cost robustness checks further showed that the practical value of dynamic optimization depended on turnover control, with low-turnover dynamic CVaR tangent portfolios remaining more resilient to implementation costs. Overall, the analysis showed that commodity ETF allocation benefited most from conservative and downside-risk-aware optimization, while optimized portfolios continued to require explicit tail-risk and implementation diagnostics.", "url": "http://arxiv.org/abs/2606.26625", "date_added": "2026-06-26", "summarized": true, "rating": "★2.5", "starred": false, "repro": "—", "summary_html": "<h1>Portfolio Optimization for Commodity ETFs under Heavy-Tailed Returns</h1>\n<p>&gt; Zotero Key: <code>J9UMMZ2T</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Nicholas Appiah, Ali Jaffri, Dilmi C. W. Hettiachchi-Halpe-Kankanamalage, Svetlozar T. Rachev</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: arXiv (2026-06-25)</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2606.26625</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2606.26625</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/HXLEUMTA/Appiah 等 - 2026 - Portfolio Optimization for Commodity ETFs under Heavy-Tailed Returns.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>对30只美国商品 ETF 比较均值-方差与 CVaR 组合优化（静态+动态 ARMA-GARCH-Student-t Copula），发现最小风险和 CVaR 策略优于切点组合，但所有策略均无法消除极端下行尾部风险。</p>\n<h2>研究动机与问题</h2>\n<p>商品 ETF 收益呈现显著偏度、超额峰度和异质波动，传统均值-方差框架无法完整描述下行尾风险。已有研究多聚焦于股票/债券组合；此文在商品 ETF 这一具有期货滚仓损耗、便利收益率等特殊属性的资产类别上系统对比静态与动态两阶段优化框架，并引入极端值分析（EVT）验证尾风险是否被消除。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 30只美国上市商品 ETF，覆盖农业（DBA、CORN、WEAT）、能源（USO、UNG、DBE 等）、金属（GLD、SLV、PPLT、PALL 等）、宽泛商品指数（DBC、GSG、BCI 等）四大类别</li>\n<li><strong>频率</strong>: 日频（算术收益）</li>\n<li><strong>样本区间</strong>: 2018年12月12日—2024年12月16日（约1,500个交易日）；滚动优化样本外起点约2020年底</li>\n<li><strong>数据来源</strong>: Bloomberg Professional Services（价格、分红、市值、美国3月期国债收益率）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n    A[30只商品 ETF 日收益\\nBloomberg 2018-2024] --&gt; B[阶段一: 历史滚动窗口优化\\n504 交易日估计窗口]\n    B --&gt; C1[均值-方差优化\\nMVP / TVP]\n    B --&gt; C2[CVaR 优化\\nC95 / C99 / TC95 / TC99]\n    C1 &amp; C2 --&gt; D[多空约束\\nw_i in 0,1 或 -1/30, 1+1/30\\n换手约束 C_TO]\n    D --&gt; E[样本外组合收益序列]\n    E --&gt; F[绩效评估\\nSharpe / Calmar / STARR_0.95]\n    E --&gt; G[极端值分析 EVT\\nHill 估计量 alpha_hat]\n    A --&gt; H[阶段二: 动态 ARMA-GARCH 扩展\\nStudent-t Copula]\n    H --&gt; I[条件边际模型\\nr_it = mu_it + sigma_it z_it]\n    I --&gt; J[Student-t Copula 捕捉尾依赖]\n    J --&gt; K[前向一步场景模拟]\n    K --&gt; C1\n    K --&gt; C2</div>\n<h3>步骤详解</h3>\n<p>1. <strong>组合设置</strong>: 收益向量 $r_t$，组合权重 $w_t$ 满足 $\\mathbf{1}^\\top w_t=1$；纯多头约束 $w_i\\ge 0$（LO）或限制多空 $-1/30\\le w_i\\le 1+1/30$（LS）；换手约束 $\\frac{1}{2}\\sum_i|w_i(t_k)-w_i(t_{k-1})|&lt;C_{TO}$，$C_{TO}=1/(30\\times252)$。</p>\n<p>2. <strong>阶段一——历史滚动优化</strong>: 以过去504个交易日的样本均值/协方差/CVaR 估计为输入，每日滚动重新估计权重并应用于下一交易日。优化目标分四类：</p>\n<p>   - MVP: $\\min_w w^\\top\\Sigma w$ 主多头</p>\n<p>   - TVP: $\\max_w(\\mu-r_f)^\\top w/\\sqrt{w^\\top\\Sigma w}$（Sharpe 切点）</p>\n<p>   - C95/C99: $\\min_w \\text{CVaR}_\\alpha(-R_p)$，$\\alpha\\in\\{0.95,0.99\\}$</p>\n<p>   - TC95/TC99: CVaR 切点组合（最大 Excess Return / CVaR 比）</p>\n<p>3. <strong>绩效度量</strong>: Sharpe = $\\bar{Z}_p/\\sigma(Z_p)$；Calmar = CAGR$_p$/MDD$_p$；STARR$_{0.95}=\\bar{Z}_p/\\text{CVaR}_{0.95}(-Z_p)$。</p>\n<p>4. <strong>极端值分析</strong>: 对每个策略计算左尾 Hill 估计量 $\\hat{\\alpha}(k)=\\left[\\frac{1}{k}\\sum_{j=1}^k\\log(X_{(j)}/X_{(k+1)})\\right]^{-1}$，用最大5%的正损失观测，跨 $k\\in[10,50]$ 范围绘制 Hill 曲线，避免阈值选取的单点不稳定性。</p>\n<p>5. <strong>阶段二——动态 ARMA-GARCH-Copula</strong>: 每只 ETF 拟合 $r_{i,t}=\\mu_{i,t}+\\varepsilon_{i,t}$，$\\varepsilon_{i,t}=\\sigma_{i,t}z_{i,t}$（ARMA-GARCH 边际模型捕捉条件均值和波动）；标准化残差用 Student-$t$ Copula 建模横截面依赖（含尾部依赖参数）；在估计窗口末端模拟前向一步场景，用相同均值-方差/CVaR 目标优化场景均值/协方差/CVaR 投入。</p>\n<h2>核心结论与关键结果</h2>\n<p><strong>静态历史优化（Table 1/2）</strong>:</p>\n<ul>\n<li>LO MVP 和 LO C95 的 Sharpe（≈0.50—0.53）、Calmar（≈0.44—0.45）和 STARR（≈0.013—0.014）均最优，显著优于被动等权 BHP（Sharpe≈0.40）。</li>\n<li>切点组合（TVP/TC95/TC99）各指标均弱于最小风险组合，反映预期收益估计误差的放大效应。</li>\n<li>多空策略未能显著提升性能；长短组合与纯多头尾风险结构高度相似。</li>\n</ul>\n<p><strong>EVT 分析（Table 1）</strong>:</p>\n<ul>\n<li>Hill 尾指数 $\\hat{\\alpha}$ 在 2.59—2.91 之间，所有策略保持相近水平——CVaR 优化降低了尾损失幅度，但<strong>未消除重尾结构</strong>；商品 ETF 组合本质上仍是重尾分布。</li>\n</ul>\n<p><strong>动态 ARMA-GARCH-Copula 扩展（Table 2）</strong>:</p>\n<ul>\n<li>对最小风险和 CVaR 组合：动态扩展使 Calmar 显著提升（MVP 从 0.45 升至 0.54），Δ Calmar 最大约 0.08—0.21。</li>\n<li>切点 TVP 动态扩展<strong>显著恶化</strong>，Sharpe 和 STARR 差值均负显著（Bootstrap 95%置信区间排除零）——表明期望收益预测误差被动态切点策略放大。</li>\n<li>低换手动态 CVaR 切点（TC95/TC99）在实施成本扣除后最具韧性。</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>将 EVT 诊断（Hill 曲线）与经典绩效指标组合评估整合，说明&quot;Sharpe 改善&quot;不等价于&quot;尾风险消除&quot;。</li>\n<li>系统对比历史滚动与动态 ARMA-GARCH-Copula 两阶段框架，识别出预期收益估计在切点策略中的不稳定性是核心瓶颈。</li>\n<li>纳入换手约束与交易成本敏感性分析，指出动态策略实际收益依赖于换手控制。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>Bloomberg 商业数据无法公开复现，限制了研究可验证性。</li>\n<li>样本期（2018—2024）较短且横跨新冠冲击，结论的时间外推性存疑。</li>\n<li>研究方法均为已有技术的组合应用，无方法论层面的创新。</li>\n<li>Copula 模型选择（Student-$t$）固定，未与其他 Copula 族比较。</li>\n<li>ETF 的期货滚仓损耗、分红处理等细节对结果影响未深入讨论。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: Bloomberg 数据需付费订阅；部分 ETF（GLD、SLV 等）的历史价格可从 Yahoo Finance 获取替代，但无法完全复现。</li>\n<li><strong>方法清晰度</strong>: 方法描述完整，标准工具链（均值-方差/CVaR + ARMA-GARCH + Copula）成熟，可参考现有库实现。</li>\n<li><strong>计算成本</strong>: 低，标准凸优化 + GARCH 拟合，无需 GPU。</li>\n<li><strong>综合评分</strong>: ★2.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>方法标准，主要瓶颈在数据。若用 Yahoo Finance 数据替代 Bloomberg，可部分复现能源与金属 ETF 子集（如 USO、GLD、SLV）；结论方向性应可验证。不建议列为高优先级复现对象，更适合作为 CVaR 组合优化的参考实现案例。</p>"}, {"key": "ES92EXNT", "title": "Option-Implied Market Risk Premium and Asset Pricing", "year": "2026", "authors": "Xiaoyu Kang, Bei Chen, Quan Gan", "tags": ["CAPM", "Conditional Beta Pricing", "Option-Implied Equity Premium"], "venue": "", "abstract": "We show that the positive beta-return relation predicted by the CAPM emerges strongly in periods when the option-implied market risk premium is high. Unlike the ex-post market risk premium, which is noisy and often negative, the option-implied premium is derived from a model-free lower bound on the equity premium and is always positive, providing a forward-looking measure of investors' required compensation for market risk. Conditioning on this measure reveals a robust beta-return trade-off, consistent with periods of elevated aggregate risk aversion restoring the validity of the CAPM. These results are not driven by macroeconomic or earnings announcements, nor by variation in sentiment, disagreement, investor attention, inflation, variance risk premium, or VIX. Our findings highlight the importance of using forward-looking risk-premium measures to uncover conditional asset-pricing relationships that remain hidden in unconditional tests.", "url": "https://papers.ssrn.com/abstract=6824883", "date_added": "2026-06-12", "summarized": true, "rating": "★3.5", "starred": false, "repro": "—", "summary_html": "<h1>Option-Implied Market Risk Premium and Asset Pricing</h1>\n<p>&gt; Zotero Key: <code>ES92EXNT</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Xiaoyu Kang, Bei Chen, Quan Gan</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: SSRN</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.6824883</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=6824883</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/IL3UWZNL/Kang 等 - 2026 - Option-Implied Market Risk Premium and Asset Pricing.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>利用期权隐含的前瞻性市场风险溢价作为条件变量，发现 CAPM 的 beta-收益正相关关系在高风险溢价时期显著成立，而在低风险溢价时期消失。</p>\n<h2>研究动机与问题</h2>\n<p>CAPM 预测 beta 与预期收益呈正线性关系，但实证中这一关系长期难以验证（SML 过于平坦甚至反转）。现有文献尝试用通胀、宏观公告、情绪、分歧等变量做条件检验，但这些变量多为事后或低频。本文提出用期权隐含的前瞻性风险溢价作为条件变量，以更直接地识别 CAPM 何时成立。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 美国股票（NYSE/AMEX/NASDAQ 普通股）、S&amp;P 500 指数期权</li>\n<li><strong>频率</strong>: 日频</li>\n<li><strong>样本区间</strong>: 1996年1月 – 2022年12月</li>\n<li><strong>数据来源</strong>: CRSP（股票收益）、OptionMetrics（期权数据）、Kenneth French 数据库（Fama-French 因子）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n    A[S&amp;P 500 指数期权价格] --&gt; B[计算 SVIX 风险中性方差指数]\n    B --&gt; C[推导期权隐含市场风险溢价下界]\n    C --&gt; D{风险溢价水平分组}\n    D --&gt;|高| E[高风险溢价时期]\n    D --&gt;|低| F[低风险溢价时期]\n    E --&gt; G[横截面回归: beta vs 收益]\n    F --&gt; G\n    G --&gt; H[比较 SML 斜率差异]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>期权隐含风险溢价构建</strong>：基于 Martin (2017) 的无套利下界方法，利用 S&amp;P 500 指数期权的看涨/看跌价格跨行权价积分，计算 SVIX（风险中性方差指数）。期权隐含的年化预期市场超额收益近似为 $R_{f,t} \\cdot SVIX^2_{t \\to T}$，该指标天然为正且前瞻性。</p>\n<p>2. <strong>条件分组</strong>：按30天期权隐含预期市场超额收益的分布，将样本日分为三组：低于25分位为低风险溢价期，高于75分位为高风险溢价期，其余为中等风险溢价期。</p>\n<p>3. <strong>证券市场线（SML）检验</strong>：在每个分组内，用前12个月日频数据估计各股票/组合的滚动 beta，然后检验 beta 与次日超额收益的横截面关系。高风险溢价期 SML 斜率约 13.8 bps/unit beta（t=8.64），R² 达 90.32%；低风险溢价期斜率几乎为零。</p>\n<p>4. <strong>Fama-MacBeth 回归</strong>：在各分组内运行横截面回归 $R_{j,t+1} - R_{f,t+1} = \\gamma_0 + \\gamma_1 \\hat{\\beta}_{j,t} + \\epsilon_{j,t+1}$，并构建包含交互项 $HSVIX_t \\times \\hat{\\beta}_{j,t}$ 的合并回归。高风险溢价期 beta 系数显著为正（约 10-18 bps），低风险溢价期为负或不显著。</p>\n<p>5. <strong>稳健性检验</strong>：排除微盘股和仙股后结果更强；限制在 S&amp;P 500 成分股中效果最明显（高-低差异达 21 bps）；控制公司特征（规模、账面市值比、动量）和常见因子后结论不变。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>高期权隐含风险溢价时期：beta 每增加1单位，次日超额收益增加约 10-18 bps，SML 陡峭且 R² 高达 90%</li>\n<li>低期权隐含风险溢价时期：beta-收益关系平坦甚至反转（斜率为负）</li>\n<li>该条件效应独立于宏观公告、情绪、分歧、投资者注意力、通胀、VIX 和方差风险溢价</li>\n<li>高风险溢价期与市场危机（2000互联网泡沫、2008金融危机、2020新冠）高度重合</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次使用期权隐含的前瞻性风险溢价作为 CAPM 条件检验的变量，相比事后实现收益更干净</li>\n<li>该指标天然为正、日频、聚合了跨行权价的市场级信息</li>\n<li>证明 CAPM 在无条件检验中的&quot;失败&quot;主要反映风险溢价的时变性，而非 beta 本身的失效</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>仅基于 S&amp;P 500 期权，对非美股市场的适用性未检验</li>\n<li>日频分析的经济直觉（次日收益与风险溢价的匹配）需进一步论证</li>\n<li>SVIX 下界的紧性假设在极端市场条件下可能失效</li>\n<li>高风险溢价期样本量相对较少（尾部 25%），统计推断需谨慎</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: OptionMetrics 为付费数据，CRSP 需机构订阅；天软无法直接获取</li>\n<li><strong>方法清晰度</strong>: 方法描述详尽，SVIX 计算公式明确，可照着实现</li>\n<li><strong>计算成本</strong>: 中等，主要成本在期权数据处理和大规模横截面回归</li>\n<li><strong>综合评分</strong>: ★3.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>若复现，核心是 SVIX 的构建（需 S&amp;P 500 期权数据）和滚动 beta 估计。最小可行版本：用公开的 VIX 数据做近似替代（虽非完全等价），或聚焦于 S&amp;P 500 ETF 期权。建议先复现 SML 图（Figure 2）作为概念验证。</p>"}, {"key": "EM7W6LZS", "title": "Momentum and Reversal on the Short-Term Horizon: Evidence from Commodity Markets", "year": "2026", "authors": "Shen Zhao, Yiyi Ding, Jianfeng Yu…", "tags": ["Momentum", "Commodity futures", "Liquidity provision", "Reversal", "Trend-chasing"], "venue": "", "abstract": "This paper documents the coexistence of momentum and reversal on the short-term horizon. Utilizing unique investors' position data from commodity futures markets, we decompose returns into a flow component tied to speculators' net trading (Q) and an orthogonal residual component (R nonQ). We find that R nonQ can significantly and positively predict next-week return (short-term return-based momentum), while Q forecasts nextweek return in a negative manner (short-term trading-based reversal). The short-term momentum effect applies to the entire cross-section of sample commodities and also to different subsamples of commodities with different characteristics. Further analysis shows that this short-term momentum primarily reflects speculators' trend-chasing trading behavior, which strengthens when volatility/uncertainty is low and when the expected profitability of momentum strategy is high. We also show that short-term momentum signals (R nonQ) can be aggregated to enhance the traditional intermediate-term momentum strategy and substantially improve its performance. By combining our empirical findings with a parsimonious model, we synthesize the microstructure-based liquidity-provision and behavioral trend-following mechanisms. Overall, our study demonstrates that momentum and reversal coexist on the same short-term horizon in commodity markets, overturns the previous canonical \"reversal-at-short-horizon, momentum-at-intermediatehorizon\" segmented perception, and therefore deepens our understanding about the overall return predictability in financial markets.", "url": "https://papers.ssrn.com/abstract=6425598", "date_added": "2026-05-30", "summarized": true, "rating": "★4.5", "starred": false, "repro": "待复现", "summary_html": "<h1>Momentum and Reversal on the Short-Term Horizon: Evidence from Commodity Markets</h1>\n<p>&gt; Zotero Key: <code>EM7W6LZS</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Shen Zhao, Yiyi Ding, Jianfeng Yu, Wenjin Kang</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: SSRN</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.6425598</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=6425598</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/M26L3U54/Zhao 等 - 2026 - Momentum and Reversal on the Short-Term Horizon Evidence from Commodity Markets.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>利用 CFTC 持仓数据将商品期货周度收益分解为投机者交易流成分 (Q) 和正交残差成分 (R_nonQ)，发现两者在同一短周期内分别驱动反转和动量效应，颠覆了&quot;短期反转、中期动量&quot;的传统认知。</p>\n<h2>研究动机与问题</h2>\n<p>传统资产定价文献将短期（周/月）反转和中期（3–12 月）动量视为不同时间尺度上的独立现象。近期股票市场研究开始发现短期动量的存在（如高换手率股票），但证据有限且局限于特定子样本。核心问题：动量和反转能否在同一短期周期内共存？如果能，如何分离各自的驱动机制？</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 26 种北美期货交易所的商品期货</li>\n<li><strong>频率</strong>: 周度（周二到周二）</li>\n<li><strong>样本区间</strong>: 1993 年 1 月 – 2025 年 9 月</li>\n<li><strong>数据来源</strong>: Commodity System Inc.（价格数据）、CFTC Commitment of Traders 报告（持仓数据）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n    A[商品期货周度收益 R_i,t] --&gt; B[截面回归&lt;br/&gt;R_i,t = b0 + b1 × Q_i,t + ε]\n    B --&gt; C[分离两个正交成分]\n    C --&gt; D[Q_i,t: 投机者净交易流&lt;br/&gt;流动性需求驱动]\n    C --&gt; E[R_nonQ_i,t: 正交残差&lt;br/&gt;基本面/信息驱动]\n    D --&gt; F[预测下一周收益&lt;br/&gt;Q 负向预测 → 反转]\n    E --&gt; G[预测下一周收益&lt;br/&gt;R_nonQ 正向预测 → 动量]\n    F --&gt; H[双策略组合排序&lt;br/&gt;2×2 独立分组]\n    G --&gt; H\n    H --&gt; I[量化动量与反转的独立贡献]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>数据构建</strong>：使用 26 种商品期货的近月合约价格计算周度收益 $R_{i,t}$，从 CFTC COT 报告获取非商业交易者（投机者）的净多头持仓变化，计算净交易流指标：</p>\n<p>$$Q_{i,t} = \\frac{\\text{NetLong}_{i,t} - \\text{NetLong}_{i,t-1}}{OI_{i,t-1}}$$</p>\n<p>2. <strong>收益分解</strong>：对每周进行截面回归 $R_{i,t} = b_{0,t} + b_{1,t} \\cdot Q_{i,t} + \\varepsilon_{i,t}$，将收益分解为 Q 成分（投机者交易流驱动）和 R_nonQ 成分（正交残差，与宏观基本面变量相关）。Fama-MacBeth 回归的 $b_1$ 时间序列均值为 0.41（t = 46.83），说明投机者净买入压力与同期价格正相关。</p>\n<p>3. <strong>短周期动量检验</strong>：估计 $R_{i,t+1} = c_0 + c_1 R\\_nonQ_{i,t} + c_2 Q_{i,t} + \\text{Controls} + u_{i,t+1}$。发现 Q 显著负向预测下周收益（反转），R_nonQ 显著正向预测下周收益（动量）。一个标准差 R_nonQ 增加对应下周收益上升 11.6 个基点（年化 6.2%）。</p>\n<p>4. <strong>机制分析</strong>：追踪 R_nonQ 对下周两个成分的影响。发现 R_nonQ 主要正向预测下周的 Q_{t+1}（即投机者在下周追涨），这是动量的核心驱动力——投机者的趋势追逐行为。同时 Q 对 R_nonQ_{t+1} 有显著负向影响（流动性提供者的报价平滑），这是反转的驱动力。</p>\n<p>5. <strong>条件分析</strong>：动量效应在波动率低时更强（投机者更敢于追涨），在拥挤度高时更弱（预期获利空间缩小）。</p>\n<p>6. <strong>与中期动量的连接</strong>：R_nonQ 信号可有效聚合用于传统中期动量策略。用 R_nonQ 替代原始收益排序，6 个月形成期动量收益从年化 5.2% 提升至 9.9%（改善 4.7%）。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>短期动量和反转在同一周度 horizon 共存，颠覆传统&quot;短期反转、中期动量&quot;的分段认知</li>\n<li>R_nonQ 驱动的动量效应：一个标准差增加 → 下周收益 +11.6bp（年化 6.2%），全截面普遍适用</li>\n<li>Q 驱动的反转效应：投机者大量买入的品种下周表现较差</li>\n<li>动量的主要驱动力是投机者的趋势追逐行为（R_nonQ 正向预测下周 Q_{t+1}）</li>\n<li>用 R_nonQ 替代原始收益构建中期动量组合，年化收益从 5.2% 提升至 9.9%</li>\n<li>短期反转本质上应被刻画为&quot;基于交易的反转&quot;而非&quot;基于收益的反转&quot;</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次在商品市场利用 CFTC 持仓数据分离交易流驱动的反转和信息驱动的动量</li>\n<li>证明动量和反转可在同一短周期内共存且独立运作</li>\n<li>将短期动量与中期动量通过 R_nonQ 信号连接起来</li>\n<li>提供投机者趋势追逐行为的直接高频（周度）证据</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>仅覆盖 26 种商品，样本量有限</li>\n<li>CFTC 持仓数据为周度频率，可能遗漏日内的微观结构效应</li>\n<li>非商业交易者的定义包含多种类型的投资者，不一定是纯粹的趋势追逐者</li>\n<li>R_nonQ 的经济含义不够直观，作为交易信号的可操作性需进一步验证</li>\n<li>回测中的交易成本和滑点未详细讨论</li>\n<li>周度频率的策略在实际执行中面临再平衡频率和执行时机的挑战</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>：高，CFTC COT 报告为公开数据，商品期货价格数据广泛可得</li>\n<li><strong>方法清晰度</strong>：高，回归方程和构造方法描述详细，可照着实现</li>\n<li><strong>计算成本</strong>：低，主要是截面回归和 Fama-MacBeth 回归，无重型计算</li>\n<li><strong>综合评分</strong>: ★4.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>强烈建议复现。关键步骤：(1) 获取 CFTC COT 周报数据（可通过 CFTC 网站或 Quandl/Refinitiv 获取）；(2) 构建 Q 和 R_nonQ 分解；(3) 运行 Fama-MacBeth 回归验证动量和反转效应；(4) 用 R_nonQ 重新排序构建中期动量组合。注意 COT 数据的报告规则和非商业交易者的分类定义。</p>"}, {"key": "8R785B43", "title": "Measuring Strategy-Decay Risk: Minimum Regime Performance and the Durability of Systematic Investing", "year": "2026", "authors": "Nolan Alexander, Frank Fabozzi", "tags": [], "venue": "", "abstract": "Systematic investment strategies are exposed to a subtle but pervasive vulnerability: the progressive erosion of their effectiveness as market regimes change. Traditional risk measures, designed to capture volatility or drawdowns, overlook this form of structural fragility. This article introduces a quantitative framework for assessing the durability of systematic strategies through minimum regime performance (MRP), defined as the lowest realized risk-adjusted return across distinct historical regimes. MRP serves as a lower bound on a strategy's robustness, capturing how performance deteriorates when underlying relationships weaken or competitive pressures compress alpha. Applied to a broad universe of established factor strategies, the measure reveals a consistent trade-off between efficiency and resilience -- strategies with higher long-term Sharpe ratios do not always exhibit higher MRPs. By translating the persistence of investment efficacy into a measurable quantity, the framework provides investors with a practical diagnostic for identifying and managing strategy-decay risk, a novel dimension of portfolio fragility that complements traditional measures of market and liquidity risk.", "url": "https://arxiv.org/abs/2604.08356v1", "date_added": "2026-06-04", "summarized": true, "rating": "★3.5", "starred": false, "repro": "—", "summary_html": "<h1>Measuring Strategy-Decay Risk: Minimum Regime Performance and the Durability of Systematic Investing</h1>\n<p>&gt; Zotero Key: <code>8R785B43</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Alexander, Nolan; Fabozzi, Frank J.</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: The Journal of Portfolio Management（DOI: 10.3905/jpm.2025.1.807）</li>\n<li><strong>DOI</strong>: 10.3905/jpm.2025.1.807</li>\n<li><strong>链接</strong>: https://arxiv.org/abs/2604.08356v1</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/R8EVSMNX/Alexander和Fabozzi - 2026 - Measuring Strategy-Decay Risk Minimum Regime Performance and the Durability of Systematic Investing.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>提出<strong>最小政权绩效（MRP）</strong>指标，将策略在所有可能的历史政权分割下最差区间的 Sharpe 比率定义为&quot;策略衰减风险&quot;的可量化下界，并在 13 个美股因子上绘制出效率–韧性的&quot;衰减风险前沿&quot;。</p>\n<h2>研究动机与问题</h2>\n<p>量化策略的核心脆弱性不是波动率或回撤，而是<strong>alpha 生成机制本身的失效</strong>——当市场环境切换后，支撑策略的统计规律被套利、拥挤或结构性变化侵蚀。McLean &amp; Pontiff（2016）记录了学术因子发表后大幅衰减的现象，但现有风险指标（波动率、VaR、回撤）均描述<strong>结果分布</strong>，而非<strong>过程有效性的退化</strong>。论文的缺口：缺乏一个可计算、可监控、能量化&quot;策略在最坏结构环境下能撑多久&quot;的单一指标。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: Jensen、Kelly &amp; Pedersen（2023）编制的 13 个美股横截面因子：Accruals、Debt Issuance、Investment、Low Leverage、Low Risk、Momentum、Profit Growth、Profitability、Quality、Seasonality、Short Term Reversal、Size、Value</li>\n<li><strong>频率</strong>: 月度超额收益</li>\n<li><strong>样本区间</strong>: 1980–2023（40 年回溯）</li>\n<li><strong>数据来源</strong>: Jensen-Kelly-Pedersen（2023）因子库（公开）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[因子月度收益序列 x\\n长度 T] --&gt; B[枚举所有可能的分割点\\n每段最短 d 年]\n  B --&gt; C{s 次分割\\n产生 s+1 个政权}\n  C --&gt; D[在每个政权内\\n计算年化 Sharpe 比率]\n  D --&gt; E[取各政权 Sharpe 最小值\\nm_s = min SR_1...SR_s+1]\n  E --&gt; F[在所有合法分割方案中\\n再取最小值]\n  F --&gt; G[MRP_s = min over T of m_s\\n策略衰减风险下界]\n  G --&gt; H[MRP vs 全样本 Sharpe\\n绘制衰减风险前沿]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>输入</strong>：单个策略的月度收益序列 $x$，长度 $T$；设定参数：分割次数 $s$（通常取 1，即两政权）、最小政权窗口 $d$（论文用 2 年）、回溯长度（论文用 40 年）。</p>\n<p>2. <strong>单次分割（$s=1$）的 MRP</strong>：给定分割点 $t_1$，将序列分为 $r_1 = x_{0:t_1-1}$ 和 $r_2 = x_{t_1:T}$，计算两段各自的年化 Sharpe 比率，取最小值：</p>\n<p>   $$m_1(x,\\{t_1\\}) = \\min\\bigl(S(r_1),\\, S(r_2)\\bigr)$$</p>\n<p>   在所有合法分割点（满足 $t_1 \\in [d, T-d]$）上对 $m_1$ 最小化：</p>\n<p>   $$\\text{MRP}_1(x) = \\min_{t_1 \\in [d,\\, T-d]} m_1(x,\\{t_1\\})$$</p>\n<p>3. <strong>广义 $s$ 次分割的 MRP</strong>：分割集合 $\\mathcal{T} = \\{t_1,\\ldots,t_s\\}$ 产生 $s+1$ 段 $\\{r_1,\\ldots,r_{s+1}\\}$：</p>\n<p>   $$m_s(x,\\mathcal{T}) = \\min\\bigl(S(r_1),\\ldots,S(r_{s+1})\\bigr), \\quad \\text{MRP}_s(x) = \\min_{\\mathcal{T}} m_s(x,\\mathcal{T})$$</p>\n<p>   直觉类比：MRP 之于策略有效性，如同<strong>期望尾部损失（ES）</strong>之于收益分布——捕捉最差结构性表现，而非平均。</p>\n<p>4. <strong>偏差特性</strong>：MRP 是全样本 Sharpe 的下偏估计（intentional downward bias），$\\text{MRP}_s \\leq S(x)$ 恒成立，反映了鲁棒性偏好——类似压力测试或最坏情形优化。</p>\n<p>5. <strong>投资组合扩展</strong>：组合收益 $w&#x27;X_t$，组合 MRP 对策略级脆弱性及政权协方差均敏感，可识别衰减风险集中度。</p>\n<p>6. <strong>衰减风险前沿</strong>：在&quot;全样本 Sharpe（横轴）vs MRP（纵轴）&quot;的散点图上，每个因子为一点，形成类似均方差前沿的&quot;效率–韧性权衡面&quot;。前沿右上角为优势策略（高效率 + 高韧性）。</p>\n<h2>核心结论与关键结果</h2>\n<p><strong>13 个因子的全样本 Sharpe 与 MRP 对比（1980–2023，40 年回溯，$d=2$ 年）</strong>：</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>因子</th><th>全样本 SR</th><th>MRP</th><th>最优分割日期</th></tr>\n<tr><td>Debt Issuance</td><td>1.14</td><td>-0.05</td><td>2016-12</td></tr>\n<tr><td>Quality</td><td>0.65</td><td><strong>+0.06</strong>（唯一正值）</td><td>2020-11</td></tr>\n<tr><td>Accruals</td><td>0.74</td><td>-0.09</td><td>2021-09</td></tr>\n<tr><td>Seasonality</td><td>0.70</td><td>-0.22</td><td>2016-06</td></tr>\n<tr><td>Profitability</td><td>0.49</td><td>-0.25</td><td>1984-03</td></tr>\n<tr><td>Value</td><td>0.37</td><td>-0.41</td><td>2022-12</td></tr>\n<tr><td>Low Risk</td><td>0.13</td><td>-0.61</td><td>2022-12</td></tr>\n<tr><td>Investment</td><td>0.45</td><td>-1.01</td><td>2022-12</td></tr>\n<tr><td>Low Leverage</td><td>0.01</td><td>-0.89</td><td>1985-06</td></tr>\n<tr><td>Size</td><td>0.16</td><td>-0.93</td><td>2021-03</td></tr>\n</table></div>\n<p><strong>关键发现</strong>：</p>\n<ul>\n<li>全部 13 个因子的 MRP 均为负值（除 Quality 外），说明结构性脆弱普遍存在</li>\n<li>高 Sharpe ≠ 高 MRP：Debt Issuance SR 最高（1.14）但 MRP 仅 -0.05；Investment SR 居中但 MRP 低至 -1.01</li>\n<li>MRP 与波动率、回撤等指标弱相关，捕捉的是正交的脆弱性维度</li>\n<li>敏感性分析：回溯窗口 10–40 年、最小窗口 $d$ 1–5 年，因子间排名高度稳定，结论不是方法设定的产物</li>\n</ul>\n<h2>创新点</h2>\n<p>1. <strong>策略衰减风险的首个可计算指标</strong>：将&quot;alpha 的结构性消亡&quot;从定性描述转化为单一可监控数字</p>\n<p>2. <strong>衰减风险前沿</strong>：类比均方差前沿，提供效率（Sharpe）vs 韧性（MRP）的二维决策框架</p>\n<p>3. <strong>实时监控工具</strong>：MRP 随新数据连续更新，MRP 轨迹下降是模型疲劳的早期预警信号</p>\n<p>4. <strong>与现有风险指标正交</strong>：弥补波动率和回撤无法捕捉&quot;过程有效性退化&quot;的盲区</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>政权分割的内生性</strong>：MRP 选择&quot;最差分割&quot;而非&quot;最合理分割&quot;，算法最小化的结果可能在经济上并不对应真实的结构断点；附录 B 的敏感性测试一定程度上缓解了此问题</li>\n<li><strong>仅覆盖美股因子</strong>：跨资产类别（商品、FX、期货）的普适性未验证</li>\n<li><strong>样本内无前向预测力</strong>：论文明确指出 MRP 是诊断而非预测工具，无法回答&quot;MRP 低的策略未来会更快衰减吗&quot;</li>\n<li><strong>月度频率</strong>：MRP 基于月度 Sharpe，高频策略或跨期不一致的策略可能需要调整</li>\n<li><strong>仅单因子层面测试</strong>：组合层面 MRP 的实证结果未展示，组合效果仍是理论推演</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: Jensen-Kelly-Pedersen（2023）因子库有公开版本（AQR 数据库 / 论文附录），可直接使用</li>\n<li><strong>方法清晰度</strong>: 公式完整清晰，一次分割的实现极简（枚举所有分割点取最小 Sharpe），多次分割需动态规划</li>\n<li><strong>计算成本</strong>: 极低——纯 Python/NumPy 即可，月度数据枚举不超过几百个分割点</li>\n<li><strong>综合评分</strong>: ★3.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>实现分两步：① 复现单因子 MRP（一次分割），验证 Exhibit 3 的 13 个因子数值；② 绘制衰减风险前沿（Exhibit 4）。最小可行版本约 50 行代码。可扩展方向：将 MRP 应用到期货趋势跟踪策略的不同市场政权（高/低波动、通胀/紧缩周期），验证 MRP 是否在模型调参前提供额外风险诊断维度。</p>"}, {"key": "RZ9SUV7F", "title": "Macro-aware time series forecasting via hierarchical mixed-frequency attention models", "year": "2026", "authors": "Daniel Cunha Oliveira, Kieran Wood, Stefan Zohren…", "tags": [], "venue": "", "abstract": "Deep learning models show promise in financial forecasting, yet their generalization is often undermined by small datasets, noisy signals, and non-stationarity. While meta-learning and related techniques mitigate some of these issues, they typically do not account for a core limitation in macro-financial prediction: the scarcity of distinct macroeconomic regimes that drive asset returns. We introduce HANET (Hierarchical Attention Network), a hybrid LSTM-based architecture that integrates macroeconomic domain knowledge through attention over long-run macro contexts while preserving high-frequency market dynamics. HANET organizes information in a hierarchical mixed-frequency structure, with daily asset-return signals nested within monthly macroeconomic windows, and introduces a Hierarchical Cross-Attention mechanism that reconciles low-frequency macro signals with high-frequency returns without discarding granular daily information. By framing regime selection as attention over macroeconomic contexts, the model adapts to scarce and shifting regimes. Empirically, across 55 liquid futures spanning multiple asset classes, HANET consistently outperforms neural forecasters that ignore macroeconomic information, particularly during turbulent periods, improving risk-adjusted returns and mitigating losses. Ablation studies show that these gains rely on structured macro conditioning rather than naive feature augmentation: an LSTM with the same macro representation performs poorly, and shuffling macro contexts substantially degrades performance. Finally, HANET provides interpretability through attention weights, highlighting which historical regimes are most influential for each forecast and linking macro conditions to portfolio outcomes. These results establish HANET as a systematic approach to integrating macroeconomic information into attention-based deep learning for financial forecasting.", "url": "https://arxiv.org/abs/2606.00624v1", "date_added": "2026-06-05", "summarized": true, "rating": "★4.0", "starred": false, "repro": "待复现", "summary_html": "<h1>Macro-aware time series forecasting via hierarchical mixed-frequency attention models</h1>\n<p>&gt; Zotero Key: <code>RZ9SUV7F</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Oliveira, Daniel Cunha; Wood, Kieran; Zohren, Stefan; Cucuringu, Mihai; Fujita, André</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: arXiv 预印本（arXiv:2606.00624v1）</li>\n<li><strong>DOI</strong>: —</li>\n<li><strong>链接</strong>: https://arxiv.org/abs/2606.00624v1</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/2B3JQLNG/Oliveira 等 - 2026 - Macro-aware time series forecasting via hierarchical mixed-frequency attention models.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>提出 HANET（分层注意力网络），通过分层跨频率注意力机制将月度宏观经济信息（FRED-MD）嵌入日度期货交易决策，在 55 品种期货的 2005–2024 样本外测试中，动量任务夏普达 1.99（LSTM 基准 1.19），并首次将深度学习应用于时序 carry 预测任务。</p>\n<h2>研究动机与问题</h2>\n<p>深度学习在金融预测中受限于小样本、非平稳性与宏观政权稀缺三大问题：过去 20 年仅经历了少数几次明显的宏观政权切换（衰退、通胀周期、金融危机），即便资产宇宙再大，独立的宏观&quot;片段&quot;依然稀少。现有方法（DMN、Momentum Transformer、X-Trend）几乎只用价格/收益序列，宏观信息要么被忽略，要么以&quot;直接拼接&quot;的方式引入，而论文的消融实验证明后者反而严重损害性能（Sharpe 从 1.19 跌至 0.06）。核心缺口：如何将低频月度宏观数据与高频日度交易数据在结构上融合，避免频率错位与信息丢失？</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 55 只流动性期货（商品、债券、货币、股票指数），来自 Pinnacle 数据库；carry 任务中排除债券期货（无法构造完整 carry）</li>\n<li><strong>频率</strong>: 日度收益 + 月度宏观（FRED-MD，127 个变量），使用 point-in-time vintage 规避前视偏差</li>\n<li><strong>样本区间</strong>: 训练集在 2005 年前，样本外测试 2005–2024（约 20 年）</li>\n<li><strong>数据来源</strong>: Pinnacle（期货价格/carry 曲线）+ FRED-MD（美国宏观数据库，St. Louis Fed）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[日度期货价格 + 信号特征\\n55 品种] --&gt; B[动量/Carry 特征构造\\nMACD / TSMom / Carry]\n  M[月度宏观数据 FRED-MD\\n127 变量] --&gt; PCA[PCA 降维\\n训练集拟合，固定载荷]\n  PCA --&gt; QE[查询编码器 LSTM-q\\n当月宏观状态 → 查询向量 q]\n  PCA --&gt; KE[键编码器 LSTM-k\\n历史宏观序列 → 键矩阵 K]\n  B --&gt; VE[值编码器 LSTM-v + 自注意力\\n日度价格窗口 → 值序列 V]\n  QE --&gt; CA[分层跨频率注意力\\n月度粒度计算权重\\n映射到日度网格]\n  KE --&gt; CA\n  VE --&gt; CA\n  CA --&gt; S[宏观加权汇总向量 s_t,i]\n  B --&gt; Fus[融合模块 f_fus\\n拼接 s_t,i + 日度特征]\n  S --&gt; Fus\n  Fus --&gt; Dec[LSTM 解码器]\n  Dec --&gt; W[交易权重 w_t,i = tanh\\n组合收益 w_t * r_t+1]\n  W --&gt; Loss[Sharpe 目标函数\\n端到端训练]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>特征构造</strong>：对每个资产 $i$ 在日度 $t$ 构造两类交易信号作为神经网络输入特征：</p>\n<p>   - MACD：$\\text{MACD}_{t,i}^{(s,\\ell)} = \\text{EMA}^{(s)}(P_{t,i}) - \\text{EMA}^{(\\ell)}(P_{t,i})$（窗口对 (8,96)）</p>\n<p>   - 时序动量（TSMom）：$R_{t,i}^{(k)} = P_{t,i}/P_{t-k,i} - 1$（回看 264 日）</p>\n<p>   - Carry（FX/股指/商品各有不同计算方式，基于期限结构斜率）</p>\n<p>2. <strong>宏观数据预处理</strong>：FRED-MD 127 维月度数据在训练集上拟合 PCA，取前 5 个主成分作为低频宏观向量 $\\kappa_k \\in \\mathbb{R}^{d_\\kappa}$；验证/测试集投影到训练载荷，确保无前视偏差。</p>\n<p>3. <strong>三路编码器（HANET 核心）</strong>：</p>\n<p>   - <strong>查询（Query）编码器</strong>：将当月宏观向量 $\\kappa_{\\mu(t)}$ 通过 LSTM-q + FFN 编码为查询 $q_{\\mu(t)} \\in \\mathbb{R}^{d_\\text{att}}$，代表当前宏观状态</p>\n<p>   - <strong>键（Key）编码器</strong>：将历史宏观序列 $\\{\\kappa_{1:\\mu(t)-1}\\}$ 通过 LSTM-k + FFN 编码为键矩阵 $K \\in \\mathbb{R}^{(\\mu(t)-1) \\times d_\\text{att}}$，代表历史各月宏观环境</p>\n<p>   - <strong>值（Value）编码器</strong>：将日度价格窗口 $\\{z_{t-L:t-1,i}\\}$ 通过 LSTM-v 编码后经自注意力模块精炼，得到高频值序列 $V_{t-L:t-1,i}$</p>\n<p>4. <strong>分层跨频率注意力</strong>：注意力权重在月度层面计算，带可学习温度参数 $\\tau_\\text{att} = \\exp(\\theta_\\text{att})$：</p>\n<p>   $$\\alpha_{\\mu(t),\\tau} = \\frac{\\exp\\!\\left(\\tau_\\text{att} \\cdot \\frac{1}{\\sqrt{d_\\text{att}}} \\langle W_q q_{\\mu(t)}, W_k k_\\tau \\rangle\\right)}{\\sum_{\\ell=1}^{\\mu(t)-1} \\exp\\!\\left(\\tau_\\text{att} \\cdot \\frac{1}{\\sqrt{d_\\text{att}}} \\langle W_q q_{\\mu(t)}, W_k k_\\ell \\rangle\\right)}$$</p>\n<p>   再将月度权重展开到日度网格：$\\tilde{\\alpha}_{t,u} = \\alpha_{\\mu(t),\\mu(u)}$，宏观加权汇总为 $s_{t,i} = f_\\text{att}\\!\\left(\\sum_{u=t-L}^{t-1} \\tilde{\\alpha}_{t,u} W_v v_{u,i}\\right)$。核心思想：低频宏观相似度决定哪些历史&quot;日度信息&quot;被重点提取，保留粒度不丢高频细节。</p>\n<p>5. <strong>解码与输出</strong>：将宏观汇总 $s_{t,i}$ 与当日特征融合后送入 LSTM 解码器，线性头输出分数后经 $\\tanh$ 得到仓位权重 $w_{t,i} \\in (-1,1)$；投资组合收益 $r_{t+1}^\\text{port} = w_t^\\prime r_{t+1}$。</p>\n<p>6. <strong>训练目标</strong>：端到端最大化样本内 Sharpe 比率；波动率目标设为年化 10%（每资产指数加权标准差 60 日窗口缩放）；全品种等权合并。</p>\n<h2>核心结论与关键结果</h2>\n<p><strong>时序动量任务（样本外 2005–2024，年化 10% 波动目标，总收益）</strong>：</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>策略</th><th>均值收益</th><th>Sharpe</th><th>Sortino</th><th>最大回撤</th></tr>\n<tr><td>MACD(8,96) 基准</td><td>13.73%</td><td>1.19</td><td>1.61</td><td>-14.16%</td></tr>\n<tr><td>LSTM 基准</td><td>同 MACD</td><td>1.19</td><td>—</td><td>—</td></tr>\n<tr><td>LSTM + 宏观 PCA 拼接</td><td>0.64%</td><td>0.06</td><td>0.07</td><td>-25.82%</td></tr>\n<tr><td><strong>HANET</strong></td><td><strong>22.45%</strong></td><td><strong>1.99</strong></td><td><strong>2.50</strong></td><td><strong>-15.87%</strong></td></tr>\n<tr><td>HANET 打乱宏观时序</td><td>9.41%</td><td>0.81</td><td>0.98</td><td>-16.90%</td></tr>\n</table></div>\n<p><strong>时序 Carry 任务</strong>：HANET Sharpe 0.91 vs LSTM 0.76 vs 经典 Carry 信号 0.62；最大回撤 -17.71% 为全组最优。</p>\n<p><strong>交易成本敏感性（动量任务）</strong>：1 bps 时净 Sharpe 1.60，5 bps 时仅 0.17，10 bps 时转负——策略对高交易成本较脆弱（共 4,622 次双边交易）。</p>\n<p><strong>关键消融结论</strong>：宏观信息的价值高度依赖架构设计——简单拼接反而有害，打乱时序显著损失性能，分层跨频率注意力是核心。</p>\n<h2>创新点</h2>\n<p>1. <strong>混频注意力原语</strong>：首次提出在月度粒度计算注意力权重、再映射至日度网格的分层跨频率注意力机制，解决低/高频数据融合的频率错位问题。</p>\n<p>2. <strong>宏观政权检索框架</strong>：将宏观政权选择形式化为对历史月度宏观序列的注意力检索，无需显式政权标签即可自适应稀少的宏观状态切换。</p>\n<p>3. <strong>首个 TS-Carry 深度学习框架</strong>：据作者所知，首次将时序 carry 任务形式化为深度学习预测问题，并验证 HANET 在 carry 上的普适性。</p>\n<p>4. <strong>可解释性层</strong>：注意力权重 $\\{\\alpha_{\\mu(t),\\tau}\\}$ 直接揭示哪些历史宏观月份对当前预测最具影响，提供模型行为的宏观解释。</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>期货数据专有</strong>：Pinnacle 数据库非公开，复现时需要等效数据源，且 point-in-time FRED-MD vintage 需要专门接口（或合理代替）。</li>\n<li><strong>交易成本脆弱</strong>：超过 5 bps 时策略近乎失效，实盘期货在流动性差时可能超过此阈值。</li>\n<li><strong>仅测试美国宏观</strong>：FRED-MD 为美国数据，对非美资产（日本商品、欧洲货币等）的宏观代理能力未验证。</li>\n<li><strong>PCA 降维信息损失</strong>：仅取前 5 个主成分，可能丢失特定政权信号（如特定行业或区域危机）。</li>\n<li><strong>样本期宏观政权少</strong>：2005–2024 含约 2 次大危机，样本量本就是动机问题，但用于评估仍相对有限。</li>\n<li><strong>无代码发布</strong>：arXiv 预印本，暂无代码，架构细节（LSTM 隐藏层大小、FFN 层数等）需自行设定。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: FRED-MD 公开可下载；Pinnacle 期货数据专有，需寻找等效连续期货序列（如 Quandl/Barchart）</li>\n<li><strong>方法清晰度</strong>: 论文方程完整，公式覆盖所有模块接口，能照着实现；超参数多数有明确说明</li>\n<li><strong>计算成本</strong>: 中等——55 资产 × 20 年日度数据，LSTM + 注意力，单 GPU 可训练，但调优成本不低</li>\n<li><strong>综合评分</strong>: ★4.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>最小可行路径：先用 FRED-MD（可免费下载 vintage 版本）+ 公开连续期货数据（如 Yahoo Finance 部分品种）验证分层注意力核心机制；关键要验证&quot;拼接宏观 vs 分层注意力&quot;消融实验——这是论文最强的核心声明。建议先在 10–20 品种上快速验证 Sharpe 对比后再扩展至 55 品种。需要特别注意 point-in-time 宏观 vintage 的正确对齐，否则存在前视偏差。</p>"}, {"key": "26ZQKKEQ", "title": "Latent Matters: Learning Deep State-Space Models", "year": "2026", "authors": "Alexej Klushyn, Richard Kurle, Maximilian Soelch…", "tags": [], "venue": "", "abstract": "Deep state-space models (DSSMs) enable temporal predictions by learning the underlying dynamics of observed sequence data. They are often trained by maximising the evidence lower bound. However, as we show, this does not ensure the model actually learns the underlying dynamics. We therefore propose a constrained optimisation framework as a general approach for training DSSMs. Building upon this, we introduce the extended Kalman VAE (EKVAE), which combines amortised variational inference with classic Bayesian filtering/smoothing to model dynamics more accurately than RNN-based DSSMs. Our results show that the constrained optimisation framework significantly improves system identification and prediction accuracy on the example of established state-of-the-art DSSMs. The EKVAE outperforms previous models w.r.t. prediction accuracy, achieves remarkable results in identifying dynamical systems, and can furthermore successfully learn state-space representations where static and dynamic features are disentangled.", "url": "https://arxiv.org/abs/2602.23050v1", "date_added": "2026-05-26", "summarized": true, "rating": "★3.0", "starred": false, "repro": "—", "summary_html": "<h1>Latent Matters: Learning Deep State-Space Models</h1>\n<p>&gt; Zotero Key: <code>26ZQKKEQ</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Alexej Klushyn (TUM), Richard Kurle (TUM/AWS), Maximilian Soelch, Botond Cseke, Patrick van der Smagt (Volkswagen Group / ELTE)</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: NeurIPS 2021 / arXiv:2602.23050</li>\n<li><strong>DOI</strong>: —</li>\n<li><strong>链接</strong>: https://arxiv.org/abs/2602.23050v1</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/3UFSAI6S/Klushyn 等 - 2026 - Latent Matters Learning Deep State-Space Models.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>提出约束优化（CO）框架训练深度状态空间模型（DSSM），确保先学好重构再学动力学；并在此基础上提出扩展卡尔曼 VAE（EKVAE），用神经线性化替代 RNN 实现更精确的贝叶斯滤波/平滑，在 pendulum 和 reacher 等控制任务上显著超越已有 DSSM。</p>\n<h2>研究动机与问题</h2>\n<p>DSSM 通常通过最大化序列 ELBO 训练，但高 ELBO 并不保证学到了正确的系统动力学。作者识别出三个原因：（1）ELBO 中 distortion 和 rate 的不同组合可得相同值，优化方向不确定；（2）标准高斯先验导致近似后验过度正则化，甚至产生&quot;破损生成模型&quot;（transition model 未学会处理先验样本）；（3）大多数 DSSM 用 RNN 近似贝叶斯滤波/平滑，限制了动力学建模精度，且 RNN 基转移模型可能导致非马尔可夫状态空间。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: pendulum 摆锤（16×16 像素图像，500 条序列，每条 15 步）、reacher 机械臂（角度数据 + 64×64 RGB 图像，2000 条序列，每条 30 步）</li>\n<li><strong>频率</strong>: 仿真控制步长</li>\n<li><strong>样本区间</strong>: 仿真生成数据（非真实时间序列）</li>\n<li><strong>数据来源</strong>: DeepMind Control Suite</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>约束优化框架（CO）</strong>：将序列 ELBO 重新表述为约束优化问题的拉格朗日函数：</p>\n<p>$$L(\\theta, \\psi, \\phi; \\lambda) = R(\\psi, \\phi) + \\lambda(D(\\theta, \\phi) - D_0)$$</p>\n<p>其中 $D(\\theta, \\phi)$ 为 distortion（重构损失），$R(\\psi, \\phi)$ 为 rate（压缩项），$D_0$ 为期望重构质量基线。训练分两阶段：初始阶段只优化重构（$\\theta, \\phi$），满足约束 $D \\leq D_0$ 后才开始学习动力学参数（$\\psi$）。$\\lambda$ 通过 REWO 算法自适应更新。</p>\n<p><strong>变分层次先验（VHP）</strong>：用可学习的层次先验 $p_{\\psi_0}(z_1) = \\int p_{\\psi_0}(z_1|\\zeta)p(\\zeta)d\\zeta$ 替代标准高斯，避免过度正则化。</p>\n<p><strong>EKVAE</strong>：用神经线性化替代 RNN，在局部线性转移模型基础上：</p>\n<p>$$p_{\\psi}(z_{t+1}|z_t, u_t) = \\mathcal{N}(z_{t+1} | F_{\\psi}(z_t, u_t)z_t + B_{\\psi}(z_t, u_t)u_t, Q_{\\psi}(z_t, u_t))$$</p>\n<p>其中 $F_{\\psi}$ 等由基础矩阵的加权组合表示，权重由神经网络 $g_{\\psi}(z_t, u_t)$ 输出。辅以线性辅助变量模型 $p_{\\psi}(a_t|z_t) = \\mathcal{N}(a_t|Hz_t, R)$，使后验可通过扩展卡尔曼平滑解析计算。</p>\n<p><strong>解耦表示</strong>：设 $H$ 为矩形单位矩阵，迫使前 $D_a$ 维表示静态特征（位置），剩余维度表示动态特征（速度），可用于无外部奖励的基于模型的强化学习。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>Pendulum（图像）</strong>：VHP-EKVAE (CO) 预测 MSE = $1.99 \\times 10^{-4}$，角度 $R^2=0.992$，角速度 $R^2=0.998$。相比之下 annealing 训练的 DKS 角速度 $R^2$ 仅 0.040。</li>\n<li><strong>Reacher（角度）</strong>：VHP-EKVAE (CO) 四个状态变量 $R^2$ 均 &gt; 0.98，预测 MSE = $2.13 \\times 10^{-5}$。</li>\n<li><strong>Reacher（RGB）</strong>：EKVAE 在 64×64 像素原始图像上仍能识别动力学系统，四个状态 $R^2$ &gt; 0.98。</li>\n<li><strong>CO vs Annealing</strong>：CO 框架对 DKS/DVBS/EKVAE 均带来显著提升；VHP 进一步避免破损生成模型。</li>\n<li><strong>RNN 局限</strong>：KVAE 和 RSSM 的角速度未编码在 $z_t$ 而在 RNN 隐藏状态中（$R^2=0.043$），导致平滑预测失效。</li>\n<li><strong>RL 验证</strong>：EKVAE 的解耦表示可直接编码目标位置/速度并学习 swing-up 和旋转策略，无需外部奖励信号。</li>\n</ul>\n<h2>创新点</h2>\n<p>1. 首次将 VAE 的约束优化视角推广到 DSSM，给出通用的序列 ELBO 拉格朗日形式</p>\n<p>2. 神经线性化替代扩展卡尔曼滤波中的泰勒展开，降低计算成本</p>\n<p>3. 线性时不变辅助变量模型自然实现位置-速度解耦</p>\n<p>4. 系统性地证明了 RNN 基转移模型导致非马尔可夫状态空间</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>仅在简单控制任务（pendulum、reacher）上测试，未涉及真实世界数据尤其是金融时间序列</li>\n<li>约束超参数 $D_0$ 需启发式确定（$D_0 = 0.9 D_{\\max}$），对不同领域的敏感性未知</li>\n<li>线性辅助变量模型在高度非线性的金融观测中可能不够</li>\n<li>局部线性转移假设在金融数据的非平稳、厚尾分布下可能受限</li>\n<li>未提供代码仓库链接，复现难度较高</li>\n<li>无交易成本/实际部署约束考虑</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 仿真数据（DeepMind Control Suite）完全公开可复现</li>\n<li><strong>方法清晰度</strong>: 数学推导详尽（含 30+ 页附录），算法伪代码完整</li>\n<li><strong>计算成本</strong>: 低 — 简单控制任务，单 GPU 即可训练</li>\n<li><strong>综合评分</strong>: ★3.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>CO 框架本身是通用的，理论上可应用于金融 DSSM，但论文未提供金融领域的实验验证。EKVAE 的神经线性化和局部线性转移假设在金融场景需要大幅改造。不建议优先复现——若要用 DSSM 做金融建模，CO 训练框架可参考但 EKVAE 架构对金融数据的适用性存疑。</p>"}, {"key": "DDXN62CM", "title": "Large and Deep Factor Models", "year": "2026", "authors": "Bryan Kelly, Boris Kuznetsov, Semyon Malamud…", "tags": ["Computer Science - Machine Learning", "Quantitative Finance - Statistical Finance", "Computer Science - Computational Engineering, Finance, and Science"], "venue": "", "abstract": "We show that a deep neural network (DNN) trained to construct a stochastic discount factor (SDF) admits a sharp additive decomposition that separates nonlinear characteristic discovery from the pricing rule that aggregates them. The economically relevant component of this decomposition is governed by a new object, the Portfolio Tangent Kernel (PTK), which captures the features learned by the network and induces an explicit linear factor pricing representation for the SDF. In population, the PTK-implied SDF converges to a ridge-regularized version of the true SDF, with the effective strength of regularization determined by the spectral complexity of the PTK. Using U.S. equity data, we show that the PTK representation delivers large and statistically significant performance gains, while its spectral complexity has risen sharply-by roughly a factor of six since the early 2000s-imposing increasingly tight limits on finite-sample pricing performance.", "url": "http://arxiv.org/abs/2402.06635", "date_added": "2026-05-26", "summarized": true, "rating": "★3.5", "starred": false, "repro": "—", "summary_html": "<h1>Large and Deep Factor Models</h1>\n<p>&gt; Zotero Key: <code>DDXN62CM</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Bryan Kelly, Boris Kuznetsov, Semyon Malamud, Teng Andrea Xu, Yuan Zhang</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: arXiv:2402.06635</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2402.06635</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2402.06635</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/LIEZJBZU/Kelly 等 - 2026 - Large and Deep Factor Models.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>通过&quot;组合切线核&quot;（PTK）将深度神经网络 SDF 分解为特征发现与定价规则两个独立环节，PTK-SDF 在样本外显著优于原始 DNN-SDF，并揭示了过去二十年因子模型谱复杂度提升约六倍所带来的有限样本定价极限。</p>\n<h2>研究动机与问题</h2>\n<p>深度神经网络（DNN）在资产定价中的成功引出了一个基本问题：网络究竟学到了什么？现有框架将特征发现（学什么定价）与定价规则（怎样组合）联合训练，导致两者耦合、经济解释困难、且统计上低效。本文希望将二者分离，揭示 DNN 的可解释结构，并在此基础上建立更高效的 SDF 估计方法。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 美国股票市场个股</li>\n<li><strong>频率</strong>: 月度</li>\n<li><strong>样本区间</strong>: 约 1970s–2020s（覆盖早期 2000 年代以来的时变分析）</li>\n<li><strong>数据来源</strong>: CRSP/Compustat，企业特征（对标 Gu et al. 2020 的 94 个特征）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>核心框架：将 DNN-SDF 做加法分解</p>\n<p>$$M_{t+1} = 1 - \\pi_t&#x27; R_{t+1}$$</p>\n<p>其中 $\\pi_t = \\pi(X_t)$，用梯度下降最小化</p>\n<p>$$L(\\theta) = \\frac{1}{T}\\sum_{t=1}^T \\left(1 - f(X_t;\\theta)&#x27; R_{t+1}\\right)^2 + z\\|\\theta\\|^2$$</p>\n<p><strong>Portfolio Tangent Kernel（PTK）</strong>：对梯度下降训练的网络，SDF 可分解为特征项（由 PTK 决定）加残差模型项。PTK 给出一个封闭形式的大因子模型（LFM）表示：</p>\n<p>$$\\text{PTK-SDF} = \\text{Markowitz portfolio of char-managed factors}$$</p>\n<p>即 DNN 隐层学出的非线性特征，映射为海量特征管理因子的均值-方差最优组合，称为 Large Factor Model（LFM）。</p>\n<p><strong>谱复杂度</strong>：PTK 的谱复杂度（特征值分布的平坦程度）决定有效正则化强度；谱复杂度越高，有限样本估计误差越大，可达夏普比率越受限制。</p>\n<p>三步估计流程：</p>\n<p>1. 用 DNN 学习非线性特征 $\\phi(X_t)$</p>\n<p>2. 用 PTK 构建封闭形式的大因子集合</p>\n<p>3. 用岭回归在大因子集合上求最优组合权重</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>PTK-SDF 系统性优于原始 DNN-SDF，在不同市值分组上均有显著更高的夏普比率和经济显著的 alpha</li>\n<li>PTK 谱复杂度在过去二十年提升约 <strong>6 倍</strong>，这与因子模型样本外表现下降的时期吻合</li>\n<li>尽管涉及数十万个因子，PTK-SDF 的最优定价规则实质上无需额外缩减（&quot;ridgeless&quot;），因为学习特征本身的高谱复杂度已产生强隐式正则化</li>\n<li>PTK-based SDF 与长期消费风险的对齐度显著强于纯 DNN-SDF 和随机特征基准</li>\n<li>学习特征因子的谱复杂度约比随机特征高一个数量级</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次对 DNN-SDF 给出严格的加法分解，将特征发现与定价规则分离</li>\n<li>引入 PTK 概念，将深度网络与高维统计（随机矩阵理论）连接</li>\n<li>用&quot;对齐度&quot;（alignment）和&quot;谱复杂度&quot;（spectral complexity）两个可量化指标解释因子模型的有限样本极限</li>\n<li>打通了大因子模型（LFM）文献与深度学习资产定价文献</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>仅在美国股票市场验证，能否推广到其他资产类别（债券、商品、外汇）未知</li>\n<li>PTK 的封闭形式推导依赖神经切线核（NTK）假设，即网络在极宽/无限宽极限下训练，实际有限宽网络偏离程度不明</li>\n<li>谱复杂度的时变性质意味着不同时期的最优模型深度/宽度可能不同，实际使用中难以事前确定</li>\n<li>计算成本较高：需要训练大型 DNN 再提取 PTK，并对海量因子做矩阵运算</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 美国股票数据（CRSP/Compustat）需付费订阅，国内难以直接复现；若以国内 A 股特征数据替代，原理可复现</li>\n<li><strong>方法清晰度</strong>: 论文公式推导详尽，PTK 构造步骤清晰，但涉及随
