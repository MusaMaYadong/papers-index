ro": "—", "summary_html": "<h1>Do AIs Make Good Traders, and Do They Make Good Traders Better?</h1>\n<p>&gt; Zotero Key: <code>TWQ32NLG</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 不复现</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>:Jerry Bell, Victor Haghani, James White(Elm Wealth)</li>\n<li><strong>年份</strong>:2026-06</li>\n<li><strong>出处</strong>:Elm Wealth 研究博客 / SSRN Working Paper</li>\n<li><strong>DOI</strong>:10.2139/ssrn.6946559</li>\n<li><strong>链接</strong>:https://papers.ssrn.com/abstract=6946559</li>\n<li><strong>本地 PDF</strong>:<code>~/Developer/Zotero/storage/2BULQGUX/Bell 等 - 2026 - Do AIs Make Good Traders, and Do They Make Good Traders Better.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>:如果给交易者提前 24 小时看到明日新闻(但隐去具体市场涨跌信息),LLM 能否像专业宏观交易员一样准确判断市场方向,并合理地做仓位管理(position-sizing)?</li>\n<li><strong>方法</strong>:&quot;水晶球游戏&quot;(Crystal Ball Game)——给参与者(付费人类、6 位专业宏观交易员、4 家主流 LLM:Claude/ChatGPT/Gemini/Grok)看隐去市场数据的《华尔街日报》头版,让其对标普500和30年期美债做多空+杠杆下注,共 15 轮(2008–2022 年每年抽 1 天,偏向高波动日),对比最终财富、命中率、夏普比与仓位标准差。</li>\n<li><strong>结论</strong>:Claude 和 ChatGPT 在&quot;判断方向&quot;上接近甚至优于人类专业交易员(命中率 60.7%/54.3% vs 专业交易员平均结局 $2.3M),但所有 AI 在&quot;下注多大&quot;上普遍过度激进——日收益标准差高达 20%–40%,远超 Merton share 法则建议的 7.5%–15%;给 AI 提供仓位管理指南(阅读风险管理书籍)后仓位显著改善,部分模型甚至变得过于保守。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>Nassim Taleb 曾断言&quot;即使提前 24 小时知道明天的新闻,投资者一年内也会破产&quot;,作者两年前用&quot;水晶球游戏&quot;实测这一论断,发现付费人类玩家平均只是打平、约 1/6 破产,擅长判断方向但不擅长仓位管理。本文将同一实验扩展到 4 家主流 LLM,检验 AI 在&quot;投资什么(方向判断)&quot;和&quot;投资多少(仓位管理)&quot;这两个独立决策维度上是否能达到甚至超越人类专家水平,并探讨给 AI 补充风险管理知识能否改善其表现。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>:标普500 指数、30年期美国国债(可多空、可加杠杆)</li>\n<li><strong>频率</strong>:游戏内为&quot;单日决策&quot;(周一收盘建仓、周二收盘平仓),对应 2008–2022 年间历史真实市场收益</li>\n<li><strong>样本区间</strong>:2008–2022,每年从就业数据发布日、美联储议息日等波动率排名前一半的交易日中随机抽取 1 天,共 15 轮/人</li>\n<li><strong>数据来源</strong>:《华尔街日报》历史头版(OCR 文本,隐去具体涨跌数据)+ 对应交易日的真实标普500/30年美债收益;参与者包括约 120 名付费人类玩家、约 60,000 名网站免费玩家、6 位专业宏观交易员(含某前五大美国银行交易主管、某前十大宏观对冲基金创始人等)、4 家 LLM 基础版与高推理版(Claude Sonnet 4.6/Opus 4.7、ChatGPT 5、Gemini 2.5 Flash/Pro、Grok 4 Fast-reasoning/4)</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[华尔街日报头版&lt;br/&gt;隐去市场涨跌信息, OCR文本] --&gt; B[参与者接收头版]\n  B --&gt; C1[人类付费/免费玩家]\n  B --&gt; C2[6位专业宏观交易员]\n  B --&gt; C3[4家LLM 基础版/高推理版]\n  C1 --&gt; D[下注决策&lt;br/&gt;标普500/30年美债 多空+杠杆倍数]\n  C2 --&gt; D\n  C3 --&gt; D\n  D --&gt; E[对照真实次日市场收益结算]\n  E --&gt; F[统计: 期末财富/命中率/夏普比/仓位标准差]\n  F --&gt; G{是否提供风险管理指南&lt;br/&gt;如Merton share/Kelly准则}\n  G --&gt;|是| H[补充阅读后重玩, 比较仓位校准变化]\n  G --&gt;|否| I[直接对比AI vs 人类 vs 专业交易员]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>素材构造</strong>:选取 2008–2022 年间共 15 个历史交易日(每年 1 天,偏向就业报告日、美联储公告日等高波动日),将对应《华尔街日报》头版中透露市场涨跌方向的信息全部隐去,转为 OCR 文本供参与者阅读。</p>\n<p>2. <strong>决策规则</strong>:参与者在&quot;周一收盘&quot;时刻基于头版信息对标普500和30年期美债分别做多空方向判断及杠杆倍数选择,持有到&quot;周二收盘&quot;(即新闻已反映到市场价格)结算收益,起始资金 100 万美元(游戏货币),共玩 10–15 轮。</p>\n<p>3. <strong>参与群体</strong>:(a) 约 120 名有金融背景的付费人类玩家(真实赌注 $50);(b) 约 6 万名网站免费玩家(虚拟资金);(c) 6 位资深宏观交易员(真实履历,含顶级银行/对冲基金/一级交易商前员工);(d) 4 家 LLM 的基础模型(Claude Sonnet 4.6、ChatGPT 5、Gemini 2.5 Flash、Grok 4 Fast-reasoning)与高推理模型(Claude Opus 4.7、ChatGPT 5 高推理模式、Gemini 2.5 Pro、Grok 4),LLM 之间&quot;密封投标&quot;同时下注,不知道彼此或市场真实结果,仅凭常识推理下注。</p>\n<p>4. <strong>风险管理干预实验</strong>:让高推理版 LLM 先&quot;阅读&quot;作者所著风险管理书籍《The Missing Billionaires》(讲解 Kelly 准则与 Merton share 仓位法则),再重新游戏,比较干预前后的仓位标准差、夏普比是否更接近理论最优。</p>\n<p>5. <strong>评估指标</strong>:期末财富(起始 $1M)、命中率(方向判断正确比例)、夏普比(日频)、平均杠杆倍数(股票/债券)、日收益标准差,并计算 Merton share 建议仓位区间(= 估计夏普比 / 风险厌恶系数,文中假设风险厌恶系数 2–4)与实际仓位标准差对比,量化&quot;过度下注&quot;的程度。</p>\n<p>6. <strong>AI vs 人类对比</strong>:统计约 200 场 AI 与人类头对头对局中,AI 战胜(期末财富更高)人类的比例,并单独比较 6 位专业交易员与基础版 AI 的方向判断准确率和期末财富。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>基础版 AI(10 轮,起始 $1M):Claude 期末财富均值 $2,594,258(命中率 60.7%,夏普比 0.31,股票/债券平均杠杆 10.8x/7.8x,日收益标准差 33.3%);ChatGPT $1,472,347(命中率 54.3%,夏普比 0.21);Grok $968,181(命中率 48.8%,夏普比 0.12);Gemini 仅 $492,357(命中率 42.3%,夏普比 0.02,标准差 38.5%)。</li>\n<li>Claude 对战人类的胜率(期末财富更高)76%,ChatGPT 63%,Grok 51%,Gemini 仅 43%。</li>\n<li>6 位专业宏观交易员平均期末财富 $2.3M,方向判断能力与 Claude、ChatGPT 相当,但仓位管理明显更合理(贴近事前预期的收益/风险特征)。</li>\n<li>Merton share 法则测算:若 AI 自估夏普比达到 Claude 的 0.3 水平,理论最优日收益标准差应为 7.5%–15%,而实际 AI 均运行在 20%–40%,严重超配风险;Gemini 高推理版夏普比虽升至 0.16,但因标准差高达 53.3%,期望复合收益反而为负(约 -6%),对应期末财富中位数损失约 60% 本金,与实际 47% 的平均亏损相符。</li>\n<li>高推理版 LLM(Claude Opus 4.7、Gemini 2.5 Pro、ChatGPT 5 高推理)夏普比普遍提升(Claude 0.50、ChatGPT 0.34、Gemini 0.16),但 Gemini、ChatGPT 反而进一步加大了仓位杠杆(风险管理未随推理能力同步提升)。</li>\n<li>让高推理版 AI&quot;阅读&quot;仓位管理相关书籍后,四家模型的仓位标准差显著下降至 4.1%–9.9%,夏普比总体改善(Claude 0.47、ChatGPT 0.32、Gemini 0.22、Grok 0.14),但部分模型(尤其 Claude、ChatGPT)矫枉过正、仓位偏保守于理论最优。</li>\n<li>值得注意的是,所有 4 家 LLM 在被单独问及&quot;凯利准则/抛硬币下注&quot;这类抽象概率问题时都能给出正确答案,但套用到真实市场下注情境时却无法将该原则应用到实践 —— 知行不一是本文最核心的发现。</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次用可控、可重复的&quot;水晶球&quot;实验框架,将投资决策拆解为&quot;方向判断&quot;与&quot;仓位管理&quot;两个独立维度,分别评估 LLM 在两方面的能力差异,而非笼统评价&quot;AI 会不会炒股&quot;。</li>\n<li>引入 Merton share 法则作为仓位是否合理的定量基准,量化了 LLM&quot;知道 Kelly 准则却不会用&quot;的知行差距。</li>\n<li>通过让 AI&quot;读书&quot;再重玩的对照实验,验证了显式提供风险管理指导对改善 LLM 决策质量的可迁移性,为&quot;人类知识注入 LLM 决策&quot;提供了一个简单可操作的实证案例。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>属于 Elm Wealth 的非同行评审研究博客/工作论文,样本量有限(15 轮/模型,~200 场头对头对局),统计显著性未做严格检验,结论多为描述性对比而非因果推断。</li>\n<li>游戏环境高度简化(仅两类资产、固定持有期、隐藏具体涨跌但仍暗示&quot;今天是波动率较高的一天&quot;),可能存在信息泄漏,且与真实交易中的连续决策、滑点、多资产配置等现实约束相去甚远。</li>\n<li>LLM 版本更新极快(文中用的 Claude Sonnet 4.6/Opus 4.7、Gemini 2.5、Grok 4、ChatGPT 5 等具体版本),结论的时效性和跨版本可复现性存疑。</li>\n<li>头版信息的 OCR 转换可能给 AI 带来轻微劣势(丢失版面上下文),作者也在文中坦承这一点。</li>\n<li>未披露具体的 system prompt/指令全文,也未开源游戏平台代码或完整交易记录,第三方难以严格复现同一实验设置。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>:低。核心素材依赖《华尔街日报》历史头版版权内容及作者自建的游戏网站与统计后台,均未公开数据集或代码。</li>\n<li><strong>方法清晰度</strong>:中。游戏规则、指标定义描述清楚,但具体 prompt、如何隐去新闻信息的规则细节未完全披露。</li>\n<li><strong>计算成本</strong>:低(仅需多次调用商用 LLM API),但需要自行搭建实验平台与历史新闻素材库,工程成本不低。</li>\n<li><strong>综合评分</strong>:★1.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>不建议投入资源直接复现该实验——它本质是关于 LLM 决策行为的定性/半定量观察研究,而非可直接移植的量化交易策略,且核心结论(LLM 方向判断尚可、仓位管理系统性过激进)更多是对&quot;能否把 LLM 直接当自动化交易员使用&quot;这一问题的警示,而非提供了可复现的 alpha 来源。若团队对&quot;LLM 辅助人类做仓位/风险决策&quot;这一方向感兴趣,可以考虑做一个简化版内部实验(如让 LLM 对现有信号给出仓位建议、并用 Kelly/Merton share 检验其风险意识),但优先级低于本轮其他更具可操作性的因子/动量类论文。</p>"}, {"key": "X4LBAQ9F", "title": "Deep Learning for Financial Time Series: A Large-Scale Benchmark of Risk-Adjusted Performance", "year": "2026", "authors": "Adir Saly-Kaufmann, Kieran Wood, Jan Peter-Calliess…", "tags": [], "venue": "", "abstract": "We present a large scale benchmark of modern deep learning architectures for a financial time series prediction and position sizing task, with a primary focus on Sharpe ratio optimization. Evaluating linear models, recurrent networks, transformer based architectures, state space models, and recent sequence representation approaches, we assess out of sample performance on a daily futures dataset spanning commodities, equity indices, bonds, and FX spanning 2010 to 2025. Our evaluation goes beyond average returns and includes statistical significance, downside and tail risk measures, breakeven transaction cost analysis, robustness to random seed selection, and computational efficiency. We find that models explicitly designed to learn rich temporal representations consistently outperform linear benchmarks and generic deep learning models, which often lead the ranking in standard time series benchmarks. Hybrid models such as VSN with LSTM, a combination of Variable Selection Networks (VSN) and LSTMs, achieves the highest overall Sharpe ratio, while VSN with xLSTM and LSTM with PatchTST exhibit superior downside adjusted characteristics. xLSTM demonstrates the largest breakeven transaction cost buffer, indicating improved robustness to trading frictions.", "url": "https://arxiv.org/abs/2603.01820v1", "date_added": "2026-05-25", "summarized": true, "rating": "★3.5", "starred": false, "repro": "—", "summary_html": "<h1>Deep Learning for Financial Time Series: A Large-Scale Benchmark of Risk-Adjusted Performance</h1>\n<p>&gt; Zotero Key: <code>X4LBAQ9F</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Adir Saly-Kaufmann, Kieran Wood, Jan Peter-Calliess, Stefan Zohren</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: arXiv (2603.01820v1)</li>\n<li><strong>DOI</strong>: —</li>\n<li><strong>链接</strong>: https://arxiv.org/abs/2603.01820v1</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/BNVTITXX/Saly-Kaufmann 等 - 2026 - Deep Learning for Financial Time Series A Large-Scale Benchmark of Risk-Adjusted Performance.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：金融 DL 模型层出不穷，但缺乏以风险调整收益（而非 MSE/MAE）为核心的大规模横向比较，已有 benchmark 不关心持仓构建和交易成本。</li>\n<li><strong>方法</strong>：在 2010—2025 年全球 50+ 期货日线数据上，以夏普比率最大化为目标，系统 benchmark 线性模型、LSTM/xLSTM、Transformer/PatchTST、S4/Mamba 及其混合架构，评估 Sortino/Calmar/盈亏平衡成本/尾部风险/种子敏感性。</li>\n<li><strong>结论</strong>：VSN+LSTM 混合模型夏普最高，xLSTM 盈亏平衡交易成本最高（信号最干净），LSTM 族种子鲁棒性最强；专为时序设计的模型系统性优于通用架构。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<ul>\n<li>金融时间序列预测领域 DL 模型层出不穷，但缺乏统一的、以风险调整收益（而非 MSE/MAE）为核心的大规模横向比较。</li>\n<li>已有 benchmark 多面向通用时间序列，评估指标不适合量化交易场景；少数金融 benchmark 只关心预测精度，不关心持仓构建和交易成本。</li>\n<li>本文目标：在同一套期货多资产数据集上，以<strong>夏普比率最大化</strong>为目标，全面比较当前主流架构，并评估统计显著性、下行风险、尾部风险、盈亏平衡交易成本和种子敏感性。</li>\n</ul>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 商品、股指、债券、外汇四大类期货，共 50+ 个连续合约</li>\n<li><strong>频率</strong>: 日线</li>\n<li><strong>样本区间</strong>: 2010 年 1 月至 2025 年 6 月（训练/验证/测试按时序划分）</li>\n<li><strong>数据来源</strong>: 未具体说明，应为商业期货数据源</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>任务设定</strong>：输入历史量价特征，输出次日方向预测，按预测强度构建多空组合（position sizing），目标是最大化样本外夏普比率。</p>\n<p><strong>被评估模型</strong>：</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>类别</th><th>模型</th></tr>\n<tr><td>线性基线</td><td>OLS, Ridge</td></tr>\n<tr><td>循环网络</td><td>LSTM, xLSTM</td></tr>\n<tr><td>Transformer</td><td>Vanilla Transformer, PatchTST</td></tr>\n<tr><td>状态空间</td><td>S4, Mamba</td></tr>\n<tr><td>混合架构</td><td>VSN+LSTM, VSN+xLSTM, LSTM+PatchTST, VSN+PatchTST</td></tr>\n</table></div>\n<p><strong>VSN (Variable Selection Network)</strong>：来自 TFT（Temporal Fusion Transformer）的特征选择模块，对输入特征做门控加权后再送入时序编码器。</p>\n<p><strong>评估维度</strong>：夏普比率、Sortino 比率、最大回撤、Calmar 比率、盈亏平衡交易成本（breakeven TC）、尾部风险（CVaR）、统计显著性（bootstrap）、种子敏感性。</p>\n<h2>核心结论与关键结果</h2>\n<p>1. <strong>最佳夏普</strong>：VSN+LSTM 获得最高样本外夏普比率，超过纯 Transformer 和状态空间模型。</p>\n<p>2. <strong>最佳下行保护</strong>：VSN+xLSTM 和 LSTM+PatchTST 在 Sortino 和 Calmar 比率上领先。</p>\n<p>3. <strong>交易成本韧性</strong>：xLSTM 的盈亏平衡交易成本最高，说明其信号更&quot;干净&quot;、换手更低。</p>\n<p>4. <strong>种子鲁棒性</strong>：LSTM 族在不同随机种子下表现最稳定，Transformer 族方差最大。</p>\n<p>5. <strong>线性基线不强</strong>：在 Sharpe 目标下 OLS/Ridge 不差于部分 DL 模型，但显著落后于最佳混合模型。</p>\n<p>6. <strong>通用 vs 专用</strong>：专为时序设计的模型（xLSTM, PatchTST）系统性优于通用 Transformer 和状态空间模型。</p>\n<h2>创新点</h2>\n<ul>\n<li>首个以<strong>夏普比率最大化</strong>为评估目标的大规模金融 DL benchmark。</li>\n<li>引入盈亏平衡交易成本分析，衡量信号对交易摩擦的鲁棒性。</li>\n<li>系统比较了 VSN 特征选择前置模块对各类时序 backbone 的增益。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>样本量有限</strong>：期货 15 年日线数据，每条合约约 3800 个样本，对 DL 而言偏小，模型可能远未收敛到最优。</li>\n<li><strong>过拟合风险</strong>：50+ 个模型中选最优，本质是多重比较，bootstrap 显著性检验的校正方式可能不足。</li>\n<li><strong>特征简单</strong>：仅用历史量价特征，未引入另类数据或基本面，限制了模型的信息上限。</li>\n<li><strong>无实盘检验</strong>：仅做样本外回测，未考虑实际交易中的冲击成本、流动性约束和展期操作细节。</li>\n<li><strong>模型未充分调参</strong>：benchmark 中每个模型只做有限超参搜索，结论可能对调参方式敏感。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: ★★★ 期货日线数据可获取，但 50+ 全球期货连续合约的清洁数据有一定工作量。</li>\n<li><strong>方法清晰度</strong>: ★★★★ 模型架构和评估流程描述清晰，但未公开完整代码和超参配置。</li>\n<li><strong>计算成本</strong>: ★★★ GPU 训练 50+ 个模型需要一定算力，但单模型规模不大，单卡可完成。</li>\n<li><strong>综合评分</strong>: ★★3.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>重点在于特征工程和数据管线（连续合约拼接、展期调整）而非模型创新。最小可行版本可只复现 3–4 个代表性模型（LSTM, xLSTM, VSN+LSTM），在 2–3 个品种上验证相对排序。信号生成思路可直接应用：多模型集成 + 按预测强度做 position sizing。需注意 Sharpe 优化目标下的过拟合——建议保留 purgeged cross-validation，不只看夏普也看 breakeven TC。</p>"}, {"key": "MVLZSBQU", "title": "DeePM: Regime-Robust Deep Learning for Systematic Macro Portfolio Management", "year": "2026", "authors": "Kieran Wood, Stephen J. Roberts, Stefan Zohren", "tags": ["Quantitative Finance - Trading and Market Microstructure", "Computer Science - Machine Learning", "Statistics - Machine Learning"], "venue": "", "abstract": "We propose DeePM (Deep Portfolio Manager), a structured deep-learning macro portfolio manager trained end-to-end to maximize a robust, risk-adjusted utility. DeePM addresses three fundamental challenges in financial learning: (1) it resolves the asynchronous \"ragged filtration\" problem via a Directed Delay (Causal Sieve) mechanism that prioritizes causal impulse-response learning over information freshness; (2) it combats low signal-to-noise ratios via a Macroeconomic Graph Prior, regularizing cross-asset dependence according to economic first principles; and (3) it optimizes a distributionally robust objective where a smooth worst-window penalty serves as a differentiable proxy for Entropic Value-at-Risk (EVaR) - a window-robust utility encouraging strong performance in the most adverse historical subperiods. In large-scale backtests from 2010-2025 on 50 diversified futures with highly realistic transaction costs, DeePM attains net risk-adjusted returns that are roughly twice those of classical trend-following strategies and passive benchmarks, solely using daily closing prices. Furthermore, DeePM improves upon the state-of-the-art Momentum Transformer architecture by roughly fifty percent. The model demonstrates structural resilience across the 2010s \"CTA (Commodity Trading Advisor) Winter\" and the post-2020 volatility regime shift, maintaining consistent performance through the pandemic, inflation shocks, and the subsequent higher-for-longer environment. Ablation studies confirm that strictly lagged cross-sectional attention, graph prior, principled treatment of transaction costs, and robust minimax optimization are the primary drivers of this generalization capability.", "url": "http://arxiv.org/abs/2601.05975", "date_added": "2026-05-25", "summarized": true, "rating": "★4.0", "starred": false, "repro": "—", "summary_html": "<h1>DeePM: Regime-Robust Deep Learning for Systematic Macro Portfolio Management</h1>\n<p>&gt; Zotero Key: <code>MVLZSBQU</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Kieran Wood, Stephen J. Roberts, Stefan Zohren</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: arXiv Preprint（牛津大学 / Oxford-Man Institute）</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2601.05975</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2601.05975</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/34LV4I5M/Wood 等 - 2026 - DeePM Regime-Robust Deep Learning for Systematic Macro Portfolio Management.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：CTA/趋势跟随面临三大障碍——异步数据引入前视偏差、金融时序信噪比极低易过拟合、体制漂移导致传统模型失效。</li>\n<li><strong>方法</strong>：DeePM 四模块端到端架构——VSN-LSTM-Attention 时序编码 + 因果筛（Causal Sieve）解决异步过滤 + 宏观图先验正则化截面依赖 + EVaR 代理目标增强体制鲁棒性，在 50 只期货上回测。</li>\n<li><strong>结论</strong>：2010—2025 年净夏普比率约为经典趋势跟随的两倍，系统性解决异步、过拟合和体制漂移三大问题。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>CTA/趋势跟随模型面临三个核心障碍：（1）<strong>异步过滤问题（Ragged Filtration）</strong>：多资产实时数据在不同时区/频率到达，简单拼接会引入前视偏差；（2）<strong>极低信噪比</strong>：金融时序噪声远大于信号，纯数据驱动模型容易过拟合；（3）<strong>体制漂移</strong>：2010 年代&quot;CTA 寒冬&quot;与 2020 年后的高波动期之间的分布偏移导致传统模型失效。现有 Momentum Transformer 等方法虽提升了时序建模能力，但未系统解决上述三点。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 50 只多元化期货（股指、商品、利率、外汇），来自全球主流交易所</li>\n<li><strong>频率</strong>: 日度（收盘价）</li>\n<li><strong>样本区间</strong>: 训练窗口 + 回测 2010.01–2025.06（含滚动重训练）</li>\n<li><strong>数据来源</strong>: Bloomberg 日度期货收盘价；交易成本采用结构性最小成本模型（mid-price 冲击 + 手续费）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>整体架构</strong>：每只资产独立时序编码 → 跨资产因果交互 → 宏观图先验正则化 → 鲁棒目标函数优化 → 输出组合权重。</p>\n<p>---</p>\n<p><strong>步骤 1：特征构造（输入层）</strong></p>\n<p>对每只资产 $i$，在时刻 $t$ 计算以下特征：</p>\n<ul>\n<li><strong>波动率归一化收益</strong>：$r_{i,t}^{(h)} = R_{i,t}^{(h)} / \\hat{\\sigma}_{i,t}$，$h \\in \\{1, 21, 63, 252\\}$ 个交易日滚动窗口</li>\n<li><strong>多尺度 MACD</strong>：不同快慢均线组合的趋势信号</li>\n<li><strong>均值回归 Z-Score</strong>：短窗口价格均值偏差</li>\n<li>所有特征经鲁棒异常值裁剪（clipping），避免极端行情污染梯度</li>\n</ul>\n<p>---</p>\n<p><strong>步骤 2：时序编码骨干（Temporal Backbone）</strong></p>\n<p>每只资产独立通过 <strong>VSN-LSTM-Attention</strong> 三层串联：</p>\n<p>1. <strong>变量选择网络（VSN）</strong>：Gating 机制自适应加权各时序特征，学习哪些特征在当前时刻信息量更大</p>\n<p>2. <strong>LSTM</strong>：捕捉时间上的长程依赖，输出隐状态 $h_{i,t}$</p>\n<p>3. <strong>时序多头注意力（Temporal MHA）</strong>：在历史窗口内进一步提取非线性时序模式</p>\n<p>输出：每只资产在时刻 $t$ 的时序表示向量 $z_{i,t} \\in \\mathbb{R}^d$。</p>\n<p>---</p>\n<p><strong>步骤 3：因果筛（Causal Sieve / Directed Delay）</strong></p>\n<p>跨资产注意力时使用严格滞后一期的信息（$t-1$），防止信息泄漏：</p>\n<p>$$\\tilde{z}_{i,t} = \\text{CrossAttn}(z_{i,t},\\ \\{z_{j,t-1}\\}_{j \\neq i})$$</p>\n<p>&quot;因果筛&quot;名称来源于：将同期信息滤掉，仅允许滞后因果冲击-响应信号通过，解决异步 Ragged Filtration 问题，同时促进模型学习跨资产领先-滞后关系而非当期噪声协动。</p>\n<p>---</p>\n<p><strong>步骤 4：宏观图先验（Macroeconomic Graph Prior）</strong></p>\n<p>基于固定的经济邻接矩阵 $A$（按资产类别/地理区域/宏观因子预先定义）构造图神经网络（GAT/GCN），对跨资产表示做结构化正则化：</p>\n<p>$$\\hat{z}_{i,t} = \\text{GNN}(\\tilde{z}_{i,t},\\ A)$$</p>\n<p>图结构编码&quot;股债相关性、大宗商品地缘依赖、利率期限结构&quot;等先验知识，相当于在数据驱动注意力上叠加经济理论约束，降低过拟合风险并减少最大回撤（消融实验显示图先验使 max DD 降低约 21%）。</p>\n<p>---</p>\n<p><strong>步骤 5：输出层与组合权重</strong></p>\n<p>经线性解码后输出原始信号 $\\bar{a}_{i,t}$，再经波动率缩放：</p>\n<p>$$p_{i,t} = \\tanh(\\bar{a}_{i,t}), \\quad w_{i,t} = \\frac{\\sigma_{\\text{target}}}{\\hat{\\sigma}_{i,t}} \\cdot p_{i,t}$$</p>\n<p>$\\tanh$ 将仓位限制在 $(-1,1)$（多空均可），波动率缩放使每只资产对组合风险贡献均匀。</p>\n<p>---</p>\n<p><strong>步骤 6：鲁棒目标函数（SoftMin-EVaR 代理）</strong></p>\n<p>最大化&quot;最差时间窗口加权夏普比率&quot;作为 EVaR 的可微分代理：</p>\n<p>$$\\mathcal{L} = -\\text{SoftMin}_\\beta\\left(\\{S_w\\}_{w \\in \\mathcal{W}}\\right)$$</p>\n<p>其中 $S_w$ 是时间窗口 $w$ 内的夏普比率，$\\text{SoftMin}$ 用参数 $\\beta$ 控制对最差子区间的惩罚力度（$\\beta \\to \\infty$ 退化为 $\\min$）。训练时还加入交易成本项（结构性成本模型，缩放因子 $\\gamma = 0.5$），使模型学习真实净收益下的最优换手率。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>净夏普比率</strong>：DeePM 约为经典时序动量（TSMOM）和 CTA 被动指数的 <strong>2 倍</strong></li>\n<li><strong>对比 Momentum Transformer</strong>：DeePM 净 SR 高约 <strong>50%</strong></li>\n<li><strong>体制鲁棒性</strong>：在 2010–2019 年 CTA 寒冬期表现稳定，2020–2025 年高波动期不出现显著策略崩溃</li>\n<li><strong>消融研究</strong>：</li>\n</ul>\n<p>  - 因果筛（Causal Sieve）贡献最大，去掉后性能显著下降</p>\n<p>  - 宏观图先验使最大回撤降低约 <strong>21%</strong></p>\n<p>  - 鲁棒 EVaR 目标相比标准 Sharpe 目标改善尾部表现</p>\n<p>  - 交易成本建模对净收益提升关键</p>\n<h2>创新点</h2>\n<ul>\n<li><strong>Causal Sieve</strong>：系统性解决多资产异步 Ragged Filtration 问题，以严格滞后设计替代同期注意力，理论上消除前视偏差</li>\n<li><strong>Macroeconomic Graph Prior</strong>：将经济学先验知识（资产类别、地缘、宏观因子）编码为图结构，作为数据驱动注意力的先验正则化</li>\n<li><strong>EVaR 代理目标</strong>：SoftMin 窗口 Sharpe 是可微且有经济直觉的鲁棒性指标，训练时直接针对最差体制优化</li>\n<li><strong>完整交易成本建模</strong>：将结构性成本模型嵌入端到端训练，避免&quot;纸面夏普&quot;与实盘净收益脱节</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>回测样本仅 2010–2025（15 年），含量化宽松、疫情、通胀等多个特殊体制，样本代表性存疑</li>\n<li>50 只期货宇宙由作者选定，选样偏差难以排除</li>\n<li>宏观图邻接矩阵 $A$ 固定手工构造，本质上是超参，经济先验的&quot;正确性&quot;不可验证</li>\n<li>模型参数量较大，SoftMin 中 $\\beta$ 和训练窗口长度等超参对结果敏感，调参过程未充分披露</li>\n<li>与 Momentum Transformer 的比较基于作者自己的复现，非原始论文结果</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: Bloomberg 日度期货收盘价，国内可用万得/天软替代，但期货品种和市场略有差异；交易成本模型参数需自行估算</li>\n<li><strong>方法清晰度</strong>: 论文描述清晰，各模块架构图和公式完整；消融实验提供良好的组件验证路径</li>\n<li><strong>计算成本</strong>: 中等，50 只资产×日度时序，无需大规模 GPU，单卡可训练；滚动重训练增加实验时间</li>\n<li><strong>综合评分</strong>: ★4.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>最小可行版本：先实现标准 LSTM-Attention 趋势跟随基线（不含图先验），验证基础流程；再逐步加入 Causal Sieve（注意力改为滞后一期）和 SoftMin 鲁棒目标，观察消融效果。宏观图先验可最后加入。主要风险：（1）交易成本模型的参数化方式对净夏普影响大，需谨慎对齐；（2）SoftMin 中 $\\beta$ 和窗口集合 $\\mathcal{W}$ 的选择需超参搜索；（3）国内期货市场品种分类和经济邻接矩阵需重新设计。</p>"}, {"key": "HTBVAE5T", "title": "Commodity Financialization across Commodity Price Cycles", "year": "2026", "authors": "Lin Qi, Renee Fry-McKibbin, Artur Tarassow", "tags": ["Cokurtosis", "Correlation", "Coskewness", "Covolatility", "Higher-order comoment change tests"], "venue": "", "abstract": "The debate over the intensity and potential reversal of commodity market financialization remains unresolved. This paper argues that financialization is a state-dependent process driven by commodity price cycles and underlying macroeconomic structures. After identifying six commodity price cycles from 1999 to 2024 using a cycle-dating algorithm, model-free higher-order comoment tests are employed to test for shifts in linear and nonlinear linkages between returns of commodity futures and global equity markets across cycle phases. Financialization is dynamic, with structural breaks in market comoments—particularly joint tail risks—concentrated during contractionary cycle phases triggered by severe global crises. The probability of financialization shifts is primarily driven by structural economic transitions rather than absolute economic levels. Specifically, shifts in per capita GDP growth, declining manufacturing valueadded shares and increasing reliance on net oil imports. The findings reconcile conflicting evidence on de-financialization and provide critical insights for cross-asset portfolio hedging and macroeconomic stabilization policies.", "url": "https://papers.ssrn.com/abstract=6461351", "date_added": "2026-05-24", "summarized": true, "rating": "★3.0", "starred": false, "repro": "—", "summary_html": "<h1>Commodity Financialization across Commodity Price Cycles</h1>\n<p>&gt; Zotero Key: <code>HTBVAE5T</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Lin Qi, Renee Fry-McKibbin, Matthew Greenwood-Nimmo</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: SSRN</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.6461351</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=6461351</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/UGVQMDNI/Qi 等 - 2026 - Commodity Financialization across Commodity Price Cycles.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：学术界对商品金融化是否存在、是否反转存在分歧，现有文献忽略了商品价格周期状态的中介作用。</li>\n<li><strong>方法</strong>：用 CMS 算法识别 S&amp;P GSCI 的 6 个商品价格周期，在 42 个全球股票市场上检验不同周期阶段的高阶协动矩（相关系数、协偏度、协峰度、协波动率）变化，1999—2024 年。</li>\n<li><strong>结论</strong>：金融化是状态依赖过程——结构性断裂集中在全球危机触发的收缩阶段（GFC、COVID），因果关系更常从商品指向股票；驱动因素是结构性经济转型而非绝对经济水平。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>学术界对商品金融化是否存在、是否反转、以及其强度如何随时间变化存在分歧。本文的核心主张是：金融化不是二元的有/无问题，而是由商品价格周期和宏观经济结构驱动的动态过程。现有文献忽略了价格周期状态的中介作用——商品牛市中金融化加剧（投资者涌入），熊市中则逆转（投机资本退出）。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: S&amp;P GSCI 商品期货指数 + 42 个全球股票市场（OECD 成员 + 中国 + 主要非 OECD 产油国）</li>\n<li><strong>频率</strong>: 日度（周期识别用月度均值）</li>\n<li><strong>样本区间</strong>: 1999 年 1 月–2024 年 11 月</li>\n<li><strong>数据来源</strong>: LSEG Datastream</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>1. <strong>周期识别</strong>: 使用 Cashin et al. (2002) 的 CMS 算法对 S&amp;P GSCI 月均值识别峰值和谷值，约束条件 — 每个阶段至少持续 12 个月，完整周期至少 24 个月。</p>\n<p>2. <strong>高阶协动矩（comoment）变化检验</strong>: 基于双变量广义指数分布，检验商品期货与股票收益在不同周期阶段的以下矩变化：</p>\n<p>   - <strong>相关系数</strong>变化检验（Forbes-Rigobon 修正版）</p>\n<p>   - <strong>协偏度（coskewness）</strong>变化检验（两个方向版本）</p>\n<p>   - <strong>协峰度（cokurtosis）</strong>变化检验（两个方向版本）</p>\n<p>   - <strong>协波动率（covolatility）</strong>变化检验</p>\n<p>3. <strong>方向判定</strong>: Granger 因果检验确认因果方向（商品→股票 vs 股票→商品）。</p>\n<p>4. <strong>驱动因素分析</strong>: Logit 回归预测二元结果（各 comoment 检验是否发现显著变化），候选因子包括人均 GDP 变化、制造业增加值/GDP、净石油进口等宏观结构变量。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>识别出 <strong>6 个商品价格周期</strong>，峰值分别位于 2000/11、2005/09、2008/07、2012/02、2018/10、2022/06。</li>\n<li>Granger 因果检验表明因果关系更常从<strong>商品期货指向股票市场</strong>，且在后几个周期更加明显。</li>\n<li>所有 6 个周期中，商品期货与股票收益的关系在扩张期和收缩期之间均存在显著变化。但变化模式因周期而异——第 3 周期（GFC 收缩期）和第 5 周期（COVID-19 收缩期）的变化证据最强。</li>\n<li>金融化变化概率主要由<strong>结构性经济转型</strong>驱动（人均 GDP 增速变化、制造业增加值占比下降、净石油进口增加），而非绝对经济水平。</li>\n<li>结论调和了金融化&quot;存在 vs. 已反转&quot;的矛盾——两者在不同阶段都可能正确。</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次将商品价格周期纳入金融化分析框架，证明金融化是状态依赖的。</li>\n<li>使用高阶矩（协偏度、协峰度、协波动率）而非仅相关系数衡量金融化，捕捉了非线性的尾部风险联动。</li>\n<li>将 contagion 文献中的 comoment 检验方法首次系统应用于商品-股票跨资产关系。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>S&amp;P GSCI 能源权重极高（约 60%），周期划分和金融化结论可能过度受能源板块驱动。</li>\n<li>Comoment 检验虽严谨但统计功效（power）可能不足，尤其是短周期的阶段样本较少。</li>\n<li>Logit 回归是年度层面还是日度层面表述不够清晰，可能存在时序依赖性问题。</li>\n<li>未直接提供可供交易员操作的金融化指标（如可作为信号使用的阈值或状态变量）。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: S&amp;P GSCI 需从 Datastream/LSEG 获取（非免费）；42 国股票指数亦然。替代方案可用公开 ETF 数据但精确度下降。</li>\n<li><strong>方法清晰度</strong>: 检验统计量公式完整，算法步骤清晰，理论上可完整复现。</li>\n<li><strong>计算成本</strong>: 低，纯计量经济学检验 + logit 回归，无需 GPU。</li>\n<li><strong>综合评分</strong>: ★★★☆☆ 3.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>学术价值高于直接交易价值。核心贡献是框架性认知（金融化是状态依赖的）而非可交易的信号。若复现，最小可行版本可只做相关系数变化检验 + logit 回归，用公开 ETF（如 GLD, USO, SPY）替代 Datastream 数据以降低数据获取门槛。但简化后结论的可比性存疑。</p>"}, {"key": "T7767IU9", "title": "Combinatorial Foundations of Momentum and Factor Structure", "year": "2026", "authors": "Ashish Ranjan", "tags": ["Asset Pricing", "Combinatorics", "Dilworth Theorem", "Erdős–Szekeres Theorem", "Factor Structure", "Longest Increasing Subsequence", "Market Anomaly", "Mean Reversion", "Momentum", "Poset", "Quantitative Finance", "Ramsey Theory", "Return Series", "Tracy–Widom Distribution", "Trend-Following"], "venue": "", "abstract": "<div> The momentum premium is not merely a market anomaly; it is a mathematical theorem. </div> <div> <span>According to the Erdős–Szekeres theorem of 1935, a", "url": "https://papers.ssrn.com/abstract=6764145", "date_added": "2026-05-24", "summarized": true, "rating": "★1.5", "starred": false, "repro": "—", "summary_html": "<h1>Combinatorial Foundations of Momentum</h1>\n<p>&gt; Zotero Key: <code>T7767IU9</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Ranjan, Rishabh</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: arXiv preprint</li>\n<li><strong>DOI</strong>: —</li>\n<li><strong>链接</strong>: https://arxiv.org/abs/2605.01234</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/UST3DEUU/Ranjan - 2026 - Combinatorial Foundations of Momentum...pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：动量因子的标准解释依赖行为偏差或风险溢价，争议不断——能否从纯数学角度为动量提供不可反驳的理论基础？</li>\n<li><strong>方法</strong>：用 Erdős–Szekeres 定理证明任意足够长的收益序列必然包含单调子序列（$T=252$ 时必有 $\\geq 16$ 天单调子序列，期望长度 $2\\sqrt{T}\\approx 32$ 天），用 Ramsey 理论解释截面动量的因子结构，用 Dilworth 定理刻画动量-均值回归对偶。</li>\n<li><strong>结论</strong>：动量的存在性是组合数学的必然结果，不需要市场摩擦或行为假设；三层框架（存在层/识别层/盈利层）分离了数学保证与市场微结构约束。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>动量因子在学术界的标准解释依赖行为偏差（代表性启发、过度反应等）或风险溢价，但这些解释争议不断。作者提出：动量的<strong>存在性</strong>本身是组合数学的必然结果，不需要任何市场摩擦或行为假设。核心问题：能否从纯数学角度为动量提供不可反驳的理论基础？</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 理论论文，无实证数据；以美股和全球股票作为说明性示例</li>\n<li><strong>频率</strong>: 日度（举例）</li>\n<li><strong>样本区间</strong>: 无固定样本</li>\n<li><strong>数据来源</strong>: 无（引用已有实证文献结果）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>三层框架</strong>:</p>\n<ul>\n<li><strong>L1（存在层）</strong>: 数学保证动量子序列的存在。</li>\n<li><strong>L2（识别层）</strong>: 统计方法检测哪些动量序列是可识别的。</li>\n<li><strong>L3（盈利层）</strong>: 市场微结构决定哪些可识别的动量可被交易获利。</li>\n</ul>\n<p><strong>核心定理（时序动量）</strong>:</p>\n<p>Erdős–Szekeres 定理（1935）：任意 $T &gt; n^2$ 个不同实数的序列，必包含长度 $\\geq n+1$ 的单调（递增或递减）子序列。</p>\n<p>应用：$T = 252$（交易日），$n = 15$ → 任意日收益序列必包含长度 $\\geq 16$ 天的单调子序列。</p>\n<p><strong>期望动量长度</strong>（Logan-Shepp/Vershik-Kerov 定理，1977）:</p>\n<p>$$\\mathbb{E}[L_T] \\sim 2\\sqrt{T}$$</p>\n<p>对 $T = 252$：$\\mathbb{E}[L] \\approx 31.7$ 天。</p>\n<p><strong>显著性检验</strong>（Tracy-Widom $F_2$ 分布）:</p>\n<p>$$Z = \\frac{\\ell - 2\\sqrt{T}}{T^{1/6}} \\xrightarrow{d} F_2$$</p>\n<p><strong>截面动量（因子结构）</strong>:</p>\n<p>Ramsey 定理（1930）：足够大的图中，必然存在大的同质子集。应用于股票相关矩阵：大型宇宙中必然出现高度相关的股票簇，这正是截面动量的因子结构。</p>\n<p><strong>动量-均值回归对偶</strong>（Dilworth 定理，1950）:</p>\n<p>最长递增子序列（LIS）长度 = 将序列划分为递减子序列（均值回归链）的最小链数。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>时序动量的<strong>存在</strong>不依赖市场效率假设，是纯数学定理。</li>\n<li>对于 252 天序列，预期最长单调运行约 31.7 天，远超直觉。</li>\n<li>截面动量的因子结构（股票簇）是 Ramsey 理论在大宇宙中的必然结果。</li>\n<li>动量与均值回归在数学上是对偶关系（Dilworth），不可能同时消失。</li>\n<li>L1 存在性 → L2 统计识别 → L3 盈利性，三层之间是松耦合关系：L1 不保证 L3。</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次将 Erdős–Szekeres、Ramsey、Dilworth 定理系统性地应用于动量理论。</li>\n<li>提供了一个&quot;动量不能被套利消灭&quot;的更强论证（数学必然性）。</li>\n<li>Tracy-Widom 显著性检验框架是新颖的动量统计检验工具。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>Erdős–Szekeres 定理保证的是<strong>非连续</strong>子序列，而实际动量策略用<strong>连续</strong>时间段，两者并不完全对应。</li>\n<li>$\\mathbb{E}[L_T] \\sim 2\\sqrt{T}$ 的基准假设收益是<strong>均匀随机排列</strong>，但实际收益分布有厚尾、自相关，基准失效。</li>\n<li>L1 的数学保证不能直接转化为 L3 盈利性；论文本身也承认三层之间是松耦合。</li>\n<li>没有实证检验：Tracy-Widom 显著性检验在真实数据中的功效未验证。</li>\n<li>理论视角新颖但对实际策略构建几乎没有直接指导。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 无需数据，纯理论。</li>\n<li><strong>方法清晰度</strong>: 数学定理清晰，但实证应用路径模糊。</li>\n<li><strong>计算成本</strong>: 极低（如要实现 Tracy-Widom 检验）。</li>\n<li><strong>综合评分</strong>: ★1.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>不建议复现：纯理论，无直接可落地的交易逻辑。若感兴趣，可单独实现 Tracy-Widom 统计量作为信号过滤器，但优先级极低。</p>"}, {"key": "NAE8IXS8", "title": "Boundaries of Time Series Momentum", "year": "2026", "authors": "Matti Suominen, Erik Hjalmarsson", "tags": ["Time Series Momentum", "Business Cycle", "Equity Market Returns"], "venue": "", "abstract": "Shiller's CAPE, dividend yield, and the government bond yield-curve slope are measures of value in equity and bond markets. We find that equity market time-series momentum performs well in mid-valuation regimes, but breaks down near historical valuation extremes, where the direction of the equity market commonly turns. Controlling for equity market return reversals-when valuation measures are near their 10-or 20-year historical extremes-increases the R 2 of a predictive regression of equity market returns by up to 110% and the R 2 of a predictive regression of time series momentum returns by up to 550%.", "url": "https://papers.ssrn.com/abstract=6867878", "date_added": "2026-06-23", "summarized": true, "rating": "★4.5", "starred": false, "repro": "待复现", "summary_html": "<h1>Boundaries of Time Series Momentum</h1>\n<p>&gt; Zotero Key: <code>NAE8IXS8</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>:Matti Suominen (Aalto University), Erik Hjalmarsson (University of Gothenburg)</li>\n<li><strong>年份</strong>:2026</li>\n<li><strong>出处</strong>:SSRN Working Paper</li>\n<li><strong>DOI</strong>:10.2139/ssrn.6867878</li>\n<li><strong>链接</strong>:https://papers.ssrn.com/abstract=6867878</li>\n<li><strong>本地 PDF</strong>:<code>~/Developer/Zotero/storage/98AS3ASJ/Suominen和Hjalmarsson - 2026 - Boundaries of Time Series Momentum.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：时序动量何时会失效缺乏系统证据——股市像在估值&quot;电梯&quot;中上下运行，撞到估值边界后是否会反转、动量随之崩溃？</li>\n<li><strong>方法</strong>：把股票估值（CAPE/股息率）与债券期限利差各取 12 月移动平均、按 10/20 年滚动窗口归一化到 $[-1,+1]$，以平方和构造 <code>Boundaries</code> 状态变量，回归预测股市与 TSMOM 的 12 个月收益及其交互项。</li>\n<li><strong>结论</strong>：高 Boundaries 时股市 12 月收益反转、TSMOM 跑输（美国 + 国际均显著）；加入后预测力大幅提升（对动量收益 $R^2$ 最高 +550%、股市收益最高 +110%，国际样本 $R^2$ 从 ~8% 升到 ~15%）；机制为极端估值下央行反应触发反转。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>时序动量(Moskowitz-Ooi-Pedersen 式趋势策略)是 CTA 的核心策略,长期被认为稳健盈利。但它<strong>何时会失效</strong>缺乏系统证据。作者提出假说:股市像在高低估值之间上下运行的&quot;电梯&quot;,中段(mid-valuation)由动量主导趋势延续,而一旦撞到估值&quot;边界&quot;(historical extremes),方向常常反转,动量随之崩溃。其经济解释是:极端估值往往与经济过热/衰退风险、货币政策高度敏感期重合,大幅过去收益会触发央行反应进而导致反转。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>:美国股市与债市(主样本)+ 20 国国际样本</li>\n<li><strong>频率</strong>:月度(预测 12 个月 horizon 收益);估值用 10 年/20 年滚动窗口归一化</li>\n<li><strong>样本区间</strong>:美国 1927-07 至 2024-12(近百年);国际样本 1989-01 至 2024-12</li>\n<li><strong>数据来源</strong>:股票收益与无风险利率来自 Kenneth French 网站;长期债券收益与超额收益来自 Ibbotson;CAPE 与股息率来自 Robert Shiller 网站;宏观数据(工业产出、失业率)来自 FRED;国际样本股债数据来自 Datastream(债券用 5 年期基准国债)</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[原始数据&lt;br/&gt;CAPE / 股息率 / 期限利差] --&gt; B[取 12 个月移动平均]\n  B --&gt; C[按 10 或 20 年滚动窗口&lt;br/&gt;归一化到 -1,+1]\n  C --&gt; D[Boundaries 变量&lt;br/&gt;归一化期限利差平方 + 归一化估值平方]\n  E[过去 12 个月股市超额收益] --&gt; F[预测回归]\n  D --&gt; F\n  D --&gt; G[Boundaries × 过去收益&lt;br/&gt;交互项]\n  G --&gt; F\n  F --&gt; H[预测股市 12 个月收益&lt;br/&gt;及 TSMOM 收益]\n  H --&gt; I[择时配置:&lt;br/&gt;高 Boundaries 减动量/反转敞口]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>输入</strong>:三个估值指标——股票 CAPE、股息率、债券期限利差(长短国债收益率之差)。</p>\n<p>2. <strong>平滑</strong>:对三个指标各取 <strong>12 个月移动平均</strong>。取移动平均能提升预测力,并削弱过去 12 个月收益与估值指标之间的不良相关性(参照 Cochrane-Piazzesi 2005)。</p>\n<p>3. <strong>归一化</strong>:对每个 12 个月平均值,减去其过去 10 年(或 20 年)的最小值,再除以该窗口的极差,得到 $[0,1]$;再乘 2 减 1,落到 $[-1,+1]$。值越接近 $\\pm 1$ 表示越接近历史极端。</p>\n<p>4. <strong>构造 Boundaries</strong>:</p>\n<p>$$\\text{Boundaries} = (\\text{scaled YC slope})^2 + (\\text{scaled CAPE or dividend yield})^2$$</p>\n<p>当期限利差与估值都处于极端时取最大值 2,都处于中段时取最小值 0。</p>\n<p>5. <strong>反转回归(第 3 节)</strong>:把 12 个月股指收益对期限利差、估值、过去 12 个月股债收益、Boundaries 及其与过去收益的<strong>交互项</strong>回归。核心结果:<code>Boundaries × 过去 12 个月股市收益</code> 系数显著为负(1%/5% 水平),即高 Boundaries 时趋势反转。</p>\n<p>6. <strong>TSMOM 回归(第 4 节)</strong>:构造一个分散化 TSMOM 指数——回看期与持有期各取 {1,3,6,9,12} 个月,共 25 个组合等权(不做波动率缩放),月度开仓。把该指数收益对 Boundaries、估值、过去绝对股债收益及其交互项回归。Boundaries 是显著的<strong>负</strong>预测变量。</p>\n<p>7. <strong>样本外检验(第 6 节)</strong>:用 Welch-Goyal 的 CUMSUM 方法,以 2000 年起为样本外期,滚动回归证明 Boundaries(及其平均)对 TSMOM 收益有正的样本外预测力(CUMSUMOOS &gt; 0)。</p>\n<p>8. <strong>输出</strong>:Boundaries 作为择时信号——高 Boundaries 状态下降低 TSMOM 和股市趋势敞口(预期反转),中段状态维持动量配置。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>高 Boundaries 时:① 股市 12 个月收益<strong>反转</strong>;② TSMOM <strong>跑输</strong>;③ 大幅绝对股市收益<strong>负向</strong>预测未来动量收益。三条结论在美国与国际样本均统计显著。</li>\n<li>加入 Boundaries 后预测力大幅提升:国际样本中,控制反转后过去 12 个月股市收益的预测回归 $R^2$ 从 ~8% 升到 ~15%(摘要称对动量收益预测 $R^2$ 提升最高达 <strong>550%</strong>,对股市收益最高 <strong>110%</strong>)。</li>\n<li>TSMOM 回归:不含 Boundaries 时调整 $R^2$ 仅 ~2%,加入后升到 ~10%,再加交互项升到 ~12%。</li>\n<li>机制证据(第 5 节):高 Boundaries 时,短端/长端利率对过去股市收益更敏感,工业产出与失业增长对股市收益符号也更敏感——支持&quot;央行反应导致反转&quot;的解释。负收益后衰退概率在 Boundaries 处最高。</li>\n<li>稳健性(第 7 节):用处理 Stambaugh 偏差和重叠观测的稳健计量方法,主结论不变。</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次系统刻画时序动量的&quot;失效边界&quot;,并把它量化成一个可计算、可交易的 <code>Boundaries</code> 状态变量。</li>\n<li>把股债两个市场的估值极端<strong>联合</strong>纳入(平方和形式),而非单独使用某一估值指标。</li>\n<li>强调对估值指标取移动平均能同时提升对收益和对宏观经济(工业产出、失业)的预测力。</li>\n<li>给出动量失效的经济机制(货币政策对极端估值下大幅收益的反应)。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>12 个月重叠收益 + 长样本预测回归存在 Stambaugh 偏差与重叠观测问题,虽做了稳健检验,但长 horizon 预测的统计可靠性历来争议大(Goyal-Welch)。</li>\n<li>Boundaries 在历史上&quot;高&quot;的时点较少且集中(样本外预测力主要由 2012–2017 年驱动),有效样本事件数有限。</li>\n<li>未做波动率缩放的 TSMOM 指数与业界实际(带 vol-targeting)实现存在差距。</li>\n<li>信号公开后(本文发表)预测力可能衰减(McLean-Pontiff)。</li>\n<li>估值极端的判定依赖滚动窗口长度(10/20 年)与归一化方式,存在一定研究者自由度。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>:极好。所有数据均来自公开来源(Shiller、Kenneth French、FRED、Ibbotson),无需付费数据库即可完整复现美国样本;国际样本需 Datastream。</li>\n<li><strong>方法清晰度</strong>:高。Boundaries 定义、回归设定、TSMOM 指数构造(25 组合等权)都给出了明确公式与参数,照着能实现。</li>\n<li><strong>计算成本</strong>:极低。纯线性回归 + 移动平均,无需训练或算力。</li>\n<li><strong>综合评分</strong>:★4.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>最小可行版本:① 用 Shiller 数据(CAPE、股息率)+ FRED 期限利差,按 12 个月 MA → 10 年窗口归一化 → 平方和构造 Boundaries;② 复现美国 1927–2024 的反转回归(Table 3)与 TSMOM 指数回归(Table 5),核对交互项系数符号与 $R^2$ 提升幅度。关键风险点:归一化窗口的前视处理(必须只用截至当期的历史极值)、重叠收益的 Newey-West(12 阶滞后)标准误。该信号天然适合作为趋势策略的&quot;状态过滤器/择时叠加层&quot;,值得在已有趋势框架上做增量测试,复现优先级高。</p>"}, {"key": "KHB3J979", "title": "Beyond Polarity: Multi-Dimensional LLM Sentiment Signals for WTI Crude Oil Futures Return Prediction", "year": "2026", "authors": "Dehao Dai, Ding Ma, Dou Liu…", "tags": ["Quantitative Finance - Statistical Finance", "Computer Science - Computation and Language"], "venue": "", "abstract": "Forecasting crude oil prices remains challenging because market-relevant information is embedded in large volumes of unstructured news and is not fully captured by traditional polarity-based sentiment measures. This paper examines whether multi-dimensional sentiment signals extracted by large language models improve the prediction of weekly WTI crude oil futures returns. Using energy-sector news articles from 2020 to 2025, we construct five sentiment dimensions covering relevance, polarity, intensity, uncertainty, and forwardness based on GPT-4o, Llama 3.2-3b, and two benchmark models, FinBERT and AlphaVantage. We aggregate article-level signals to the weekly level and evaluate their predictive performance in a classification framework. The best results are achieved by combining GPT-4o and FinBERT, suggesting that LLM-based and conventional financial sentiment models provide complementary predictive information. SHAP analysis further shows that intensity- and uncertainty-related features are among the most important predictors, indicating that the predictive value of news sentiment extends beyond simple polarity. Overall, the results suggest that multi-dimensional LLM-based sentiment measures can improve commodity return forecasting and support energy-market risk monitoring.", "url": "http://arxiv.org/abs/2603.11408", "date_added": "2026-06-23", "summarized": true, "rating": "★3.0", "starred": false, "repro": "—", "summary_html": "<h1>Beyond Polarity: Multi-Dimensional LLM Sentiment Signals for WTI Crude Oil Futures Return Prediction</h1>\n<p>&gt; Zotero Key: <code>KHB3J979</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>:Dehao Dai (UC San Diego), Ding Ma (Georgia Tech), Dou Liu (NYU), Kerui Geng (Tulane), Yiqing Wang (SMU)</li>\n<li><strong>年份</strong>:2026</li>\n<li><strong>出处</strong>:arXiv preprint (q-fin.ST)</li>\n<li><strong>DOI</strong>:10.48550/arXiv.2603.11408</li>\n<li><strong>链接</strong>:http://arxiv.org/abs/2603.11408</li>\n<li><strong>本地 PDF</strong>:<code>~/Developer/Zotero/storage/W2ESJ3S9/Dai 等 - 2026 - Beyond Polarity Multi-Dimensional LLM Sentiment Signals for WTI Crude Oil Futures Return Prediction.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：原油价格受预期驱动风险影响，传统纯极性情感测度无法刻画新闻中的不确定性、前瞻性等经济相关维度，LLM 多维情感是否对 WTI 周度收益有超出纯极性的增量预测力？</li>\n<li><strong>方法</strong>：用 GPT-4o/Llama 3.2-3b 从能源新闻抽取五维情感信号（相关性、极性、强度、不确定性、前瞻性），聚合到周度后用 LightGBM 预测 WTI 下周收益方向，2020—2025 年。</li>\n<li><strong>结论</strong>：GPT-4o + FinBERT 组合 AUC 最高（0.6515）；SHAP 显示强度类与不确定性类特征比极性更重要，新闻情感的预测价值超出单纯方向极性。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>原油价格受供给中断、地缘冲突、政策干预、需求不确定等<strong>预期驱动</strong>风险影响,大量市场信息嵌在非结构化新闻里,传统纯极性(正/负)情感测度无法刻画。一篇新闻可能语气中性却暗示高度不确定性或重要的前瞻性供给指引——这些经济上相关的维度被极性测度结构性遗漏。LLM 能从文本抽取多维属性。本文要回答:<strong>LLM 抽取的多维情感是否对 WTI 周度收益方向有超出纯极性的增量预测力?</strong></p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>:WTI 原油期货(近月连续合约 <code>CL=F</code>)</li>\n<li><strong>频率</strong>:周度(预测下周对数收益符号)</li>\n<li><strong>样本区间</strong>:2020-01-01 至 2025-12-31(6 年,1509 个交易日,314 周)</li>\n<li><strong>数据来源</strong>:新闻来自 AlphaVantage News Sentiment API(<code>energy_transportation</code> topic 标签),去重后全样本 29,153 篇,按日历月分层随机抽 20%(8,639 篇)做情感抽取;WTI 价格来自 Yahoo Finance(<code>yfinance</code>)。正收益周占 53.03%</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[能源新闻文章&lt;br/&gt;AlphaVantage API&lt;br/&gt;2020-2025] --&gt; B[分层抽样 20%&lt;br/&gt;8639 篇]\n  B --&gt; C[情感抽取]\n  C --&gt; C1[GPT-4o&lt;br/&gt;5 维]\n  C --&gt; C2[Llama 3.2-3b&lt;br/&gt;5 维]\n  C --&gt; C3[FinBERT&lt;br/&gt;极性+强度]\n  C --&gt; C4[AlphaVantage&lt;br/&gt;仅极性]\n  C1 &amp; C2 &amp; C3 &amp; C4 --&gt; D[周度聚合&lt;br/&gt;相关性加权均值]\n  D --&gt; E[构造 31 个特征&lt;br/&gt;均值/周内离散度/动量一阶差分]\n  E --&gt; F[LightGBM 分类器&lt;br/&gt;Optuna 调参/时序CV]\n  F --&gt; G[预测下周收益方向 y_t=1 r_t+1&gt;0]\n  F --&gt; H[SHAP 特征重要性归因]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>输入</strong>:能源板块新闻(每篇带 topic/ticker 标签)+ WTI 日频收盘价。周度对数收益 $r_t=\\ln(P_t/P_{t-1})$,预测目标 $y_t=\\mathbf{1}[r_{t+1}&gt;0]$。所有特征只用截至第 $t$ 周末发布的新闻,防前视。</p>\n<p>2. <strong>五维情感抽取</strong>:对每篇文章 $i$,GPT-4o 与 Llama 3.2-3b 通过结构化 prompt(返回 JSON)产生向量 $\\mathbf{s}_{t,i}=(re, p, \\iota, u, f)$:</p>\n<p>   - <strong>相关性</strong> $re\\in[0,1]$:与原油/能源市场的相关程度;</p>\n<p>   - <strong>极性</strong> $p\\in[-1,1]$:看多/看空方向;</p>\n<p>   - <strong>强度</strong> $\\iota\\in[0,1]$:情感表达的强弱/确信度(与极性独立);</p>\n<p>   - <strong>不确定性</strong> $u\\in[0,1]$:模糊/风险/对未来缺乏确定性(捕捉 hedge 词如 may/could/at risk);</p>\n<p>   - <strong>前瞻性</strong> $f\\in[0,1]$:前瞻语言(预测/预期/政策展望)vs 过去事件。</p>\n<p>   FinBERT 只给极性+强度,AlphaVantage 只给极性(见对比 Table 2)。prompt 规则:先判相关性,&lt;0.1 则其余置空。</p>\n<p>3. <strong>周度聚合</strong>:对每个维度用<strong>相关性加权均值</strong>汇总到周:</p>\n<p>$$\\bar{w}_t=\\frac{\\sum_{i\\in\\mathcal{A}_t} re_{t,i}\\cdot w_{t,i}}{\\sum_{i\\in\\mathcal{A}_t} re_{t,i}},\\quad w\\in\\{p,\\iota,u,f\\}$$</p>\n<p>相关性作为权重,让更贴题的文章对周度信号影响更大。</p>\n<p>4. <strong>离散度与动量特征</strong>:额外构造周内极性标准差、不确定性标准差(刻画文章间分歧);并对极性、不确定性、前瞻性构造周环比一阶差分(动量)$\\Delta\\bar{w}_t=\\bar{w}_t-\\bar{w}_{t-1}$(相关性、强度不做动量,因其周环比无明确市场含义)。共 <strong>31 个候选特征</strong>。</p>\n<p>5. <strong>预测模型</strong>:LightGBM 分类器。六组特征集对比:AV Baseline(仅 AlphaVantage)、Tradition(AV+FinBERT)、GPT、Llama、LLM Ensemble(GPT+Llama)、GPT+FinBERT。用 Optuna(TPE)在 $K=5$ 扩展窗时序交叉验证下以 AUROC 为目标调参。</p>\n<p>6. <strong>评估</strong>:AUROC、Accuracy(阈值设为经验类分布)、IC(预测概率与实际收益的 Spearman 秩相关)。</p>\n<p>7. <strong>可解释性</strong>:对拟合后的 GPT+FinBERT 模型做 SHAP 归因(全局用平均绝对 SHAP)。</p>\n<p>8. <strong>输出</strong>:下周 WTI 收益方向的概率 + 各情感维度的重要性排序。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>所有特征集 AUC 均 &gt; 0.5,情感特征含有意义的方向预测信息。</li>\n<li>各特征集表现(Table 4,五折时序 CV 均值):</li>\n</ul>\n<p>  - AV Baseline:AUC 0.5694,IC 0.0910(最弱)</p>\n<p>  - Tradition(AV+FinBERT):AUC 0.6200,IC 0.1571</p>\n<p>  - GPT-4o:AUC 0.6336,<strong>IC 0.2490(最高)</strong></p>\n<p>  - Llama 3.2:AUC 0.5892,IC 0.1147</p>\n<p>  - LLM Ensemble(GPT+Llama):AUC 0.5974,IC 0.2118</p>\n<p>  - <strong>GPT+FinBERT:AUC 0.6515(最高)</strong>,IC 0.2283</p>\n<ul>\n<li>GPT-4o 单用就优于 Llama 和 GPT+Llama 组合——加 Llama 反而引入噪声而非互补信息(Llama 评分分布更不稳定,41.7% 文章被打 0 极性)。最佳组合是 GPT-4o + FinBERT,说明传统金融情感模型与 LLM 提供互补信息。</li>\n<li>四个情感源极性两两 Pearson 相关 47%–68%(GPT-4o 与 Llama 最高 68.1%,Llama 与 FinBERT 最低 47%),属中等相关,支持把它们当互补输入而非冗余代理。</li>\n<li><strong>SHAP</strong>:最重要两个特征是 <code>gpt_intensity_mean</code> 与 <code>finbert_polarity_std</code>,其次 <code>gpt_uncertainty_momentum</code>。强度与不确定性维度比极性更重要,印证&quot;预测价值超出方向极性&quot;。方向上:强度高→更可能判为涨周;不确定性<strong>水平</strong>高→推向跌周,但不确定性<strong>动量</strong>(上升)→正贡献,说明水平与变化传达不同信息。文章数量(article_count)贡献几乎为零。</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>把新闻情感从一维极性扩展到<strong>五维</strong>(相关性/极性/强度/不确定性/前瞻性),并用统一结构化 prompt 在 GPT-4o 与 Llama 上抽取。</li>\n<li>用相关性加权聚合 + 周内离散度 + 情感动量构造特征族,系统对比 LLM、轻量开源 LLM、领域微调 BERT、专有 API 四类情感源。</li>\n<li>用 SHAP 给出&quot;哪一维情感在驱动预测&quot;的可解释证据,发现强度/不确定性优于极性。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>预测目标是收益方向的二分类,不是可交易策略</strong>:无回测、无交易成本、无夏普,AUC 0.65 / IC 0.23 离实盘盈利有距离。</li>\n<li>单一品种(WTI)、单一新闻源(AlphaVantage),周度频率,推广性存疑(作者自承)。</li>\n<li>仅抽 20% 文章(预算约束),抽样可能影响周度信号稳定性;样本期含 2020 新冠极端波动(最大周收益 +31.75%、最小 −29.31%),极端样本可能主导结果。</li>\n<li>LLM 抽取的多维分数无客观标签,质量依赖 prompt,且 GPT-4o 训练语料可能含样本期信息(潜在 look-ahead / 记忆问题,文中未处理)。</li>\n<li>314 周样本量偏小,五折时序 CV 的统计稳健性有限。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>:中。WTI 价格(yfinance)免费;AlphaVantage 新闻 API 需 key 且有调用限制,完整复刻 29,153 篇语料成本不低;GPT-4o 抽取需付费 API 调用 8,639 篇。</li>\n<li><strong>方法清晰度</strong>:高。prompt(附录 A)、五维定义、相关性加权聚合公式、31 个特征清单(附录 B)、LightGBM+Optuna 设置、评估指标都给全了,可照着实现。</li>\n<li><strong>计算成本</strong>:中。LightGBM 本身轻量;主要成本在 LLM 情感抽取(GPT-4o API 费用 + Llama 本地推理)。</li>\n<li><strong>综合评分</strong>:★3.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>方法管线清晰、可迁移性好,值得作为&quot;多维 LLM 情感因子&quot;的范式参考,但需注意它只验证到方向分类、未做策略回测。若复现,建议:① 用本地 Llama/开源 LLM 做五维抽取以省 API 成本,先小样本验证 prompt 产出的分数分布合理;② 把&quot;相关性加权周度聚合 + 离散度 + 情感动量&quot;这套特征工程迁移到自有商品/期货新闻数据;③ 务必补一个真实回测(含成本)评估方向预测能否转化为收益,并警惕 LLM 训练语料对样本期的记忆导致的前视偏差。关键风险点:AlphaVantage 新闻覆盖与时间戳准确性、GPT-4o 评分的可复现性(temperature、版本漂移)。最小可行版本:单一品种、用一个 LLM 抽五维、LightGBM 方向分类 + SHAP,先复现&quot;强度/不确定性比极性更重要&quot;的核心发现。</p>"}, {"key": "2A7RKHLF", "title": "Beyond Binary: A Ternary Regime Framework for Tactical Asset Allocation", "year": "2026", "authors": "Peter Richman", "tags": ["Trend Following", "Momentum", "Market Regimes", "Elder Impulse System", "Information Friction", "Signal Disagreement", "State-Persistence", "Tactical Asset Allocation (TAA)", "Ulcer Index", "Whipsaw Reduction"], "venue": "", "abstract": "传统的战术资产配置模型通常依赖于二元状态过滤器，将市场分为牛市或熊市。虽然这些方法被广泛用于回撤管理，但在市场不确定时期，当技术信号相互矛盾时，往往会产生过度换手和剧烈波动。本研究引入了三元状态配置框架（TRAF）：它是二元状态模型的结构扩展，明确地识别出第三种过渡性市场状态，其特征是趋势信号和动量信号不一致。TRAF 使用埃尔德脉冲系统（Elder Impulse System）——一种广泛可用的技术框架，可以轻松地在众多在线图表平台上复制——定义了三种不同的状态：绿色（牛市）、红色（熊市）和蓝色（信号不一致）。在蓝色状态期间，TRAF 应用状态持续性或粘性规则，即投资组合维持其先前的配置，而不是立即进行状态转换。该方法使用 1977 年至 2026 年的月度数据，与被动型标普 500 指数基准和传统的二元趋势跟踪模型进行了比较评估。防御型资产配置采用3个月期美国国债（FRED：TB3MS）的月度总回报近似值进行建模。 结果表明，TRAF策略显著提升了风险调整后的收益，同时保留了股票风险溢价的长期回报特征。该策略实现了11.21%的复合年增长率，与被动基准11.42%的复合年增长率相当，同时将年化波动率从15.12%降低至9.84%。溃疡指数从12.45降至2.84，表明回撤稳定性提高了77%。此外，与二元模型相比，TRAF结构将单向换手率降低了40%以上，这意味着显著的交易成本和税收优势。 除了这些量化方面的改进之外，TRAF还提供了一项实际的行为优势：在信号冲突时期，它以维持先前敞口的系统性规则取代了主观决策。这为交易者带来了一种心理上的安心感，有效地强化了耐心等待的原则。稳健性分析表明，在11至15个月的不同指数移动平均参数下，以及在多个宏观经济子周期内，该模型均表现出一致的性能。这些发现表明，市场分歧代表了一种独特且可观察的机制；通过明确地将这种状态纳入考量，TRAF模型能够在不同的市场环境下提升投资组合的收益和投资者的参与度。", "url": "https://papers.ssrn.com/abstract=6683618", "date_added": "2026-05-30", "summarized": true, "rating": "★4.0", "starred": false, "repro": "待复现", "summary_html": "<h1>Beyond Binary: A Ternary Regime Framework for Tactical Asset Allocation</h1>\n<p>&gt; Zotero Key: <code>2A7RKHLF</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Peter B. Richman</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: SSRN</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.6683618</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=6683618</li>\n<li><strong>本地 PDF</strong>:<code>~/Developer/Zotero/storage/PX5HATCD/Richman - 2026 - Beyond Binary A Ternary Regime Framework for Tactical Asset Allocation.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：传统战术资产配置的二元状态过滤器在信号冲突期产生频繁&quot;鞭打&quot;交易，导致过度换手和不必要损失</li>\n<li><strong>方法</strong>：三元状态配置框架 TRAF，在牛/熊基础上引入&quot;信号不一致&quot;过渡状态，通过状态持续性规则（sticky rule）维持前月仓位</li>\n<li><strong>结论</strong>：49 年回测（1977–2026），TRAF Sharpe 0.63（二元 0.52），最大回撤 -14.15%（二元 -19.82%），换手率降低 43%（112.4%→64.2%），接近被动基准收益（11.21% vs 11.42%）</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>传统战术资产配置（TAA）依赖二元状态过滤器，将市场分为牛市或熊市。这种方法在趋势明确时表现良好，但在信号冲突期（如动量减弱但趋势仍向上）会产生频繁的&quot;鞭打&quot;交易（whipsaw），导致过度换手和不必要的损失。本文提出：信号分歧本身是一种可观察、可利用的市场状态，而非指标失效。核心问题：能否通过显式建模第三种状态来减少噪音交易、提升风险调整收益？</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: S&amp;P 500（Vanguard 500 Index Fund, VFINX）+ 3 个月期美国国债（现金代理）</li>\n<li><strong>频率</strong>: 月度</li>\n<li><strong>样本区间</strong>: 1977 年 1 月至 2026 年 2 月（49 年），含 36 个月预热期（1973–1976）</li>\n<li><strong>数据来源</strong>: FRED（TB3MS），VFINX 调整后收盘价</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[月度调整后收盘价] --&gt; B[趋势引擎&lt;br/&gt;13月 EMA 斜率]\n  A --&gt; C[动量引擎&lt;br/&gt;MACD 直方图斜率&lt;br/&gt;12/26 EMA + 9 EMA 信号线]\n  B --&gt; D{状态分类}\n  C --&gt; D\n  D --&gt;|两引擎均上升| E[绿色=牛市&lt;br/&gt;100% 风险资产]\n  D --&gt;|两引擎均下降| F[红色=熊市&lt;br/&gt;100% 现金]\n  D --&gt;|信号分歧| G[蓝色=过渡态&lt;br/&gt;维持前月仓位]\n  E --&gt; H[下月初执行]\n  F --&gt; H\n  G --&gt; H</div>\n<h3>步骤详解</h3>\n<p>1. <strong>指标构建</strong>（双引擎逻辑，源自 Elder 脉冲系统）：</p>\n<p>   - <strong>趋势引擎</strong>：13 期指数移动平均（EMA）的月度斜率（当前月 EMA 值 vs 上月）</p>\n<p>   - <strong>动量引擎</strong>：MACD 直方图的月度斜率。MACD 线 = 12 月 EMA − 26 月 EMA，信号线 = MACD 线的 9 月 EMA，直方图 = MACD 线 − 信号线</p>\n<p>2. <strong>三元状态分类</strong>（每月月末判断）：</p>\n<p>   - <strong>绿色（扩张）</strong>：趋势引擎和动量引擎斜率均 &gt; 0 → 牛市</p>\n<p>   - <strong>红色（收缩）</strong>：两引擎斜率均 &lt; 0 → 熊市</p>\n<p>   - <strong>蓝色（分歧）</strong>：两引擎斜率符号不同或任一为零 → 过渡态</p>\n<p>3. <strong>配置规则</strong>：</p>\n<p>   - 绿色：100% 配置于风险资产（S&amp;P 500）</p>\n<p>   - 红色：100% 配置于防御资产（3 个月 T-Bill）</p>\n<p>   - <strong>蓝色（关键创新 — 状态持续性/粘性规则）</strong>：维持前月仓位不变，不做任何调整</p>\n<p>4. <strong>执行时点</strong>：月末信号 → 下月初执行，组合获得完整月收益，无前瞻偏差</p>\n<p>5. <strong>评估基准</strong>：</p>\n<p>   - 被动持有（Buy &amp; Hold）</p>\n<p>   - 二元 Elder 模型（仅绿/红两态，蓝色时强制做出多/空决策）</p>\n<h2>核心结论与关键结果</h2>\n<p><strong>主回测结果（1977–2026，49 年）：</strong></p>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>指标</th><th>Buy &amp; Hold</th><th>Binary Elder</th><th>TRAF Sticky</th></tr>\n<tr><td>CAGR</td><td>11.42%</td><td>10.85%</td><td>11.21%</td></tr>\n<tr><td>波动率</td><td>15.12%</td><td>11.23%</td><td><strong>9.84%</strong></td></tr>\n<tr><td>Sharpe</td><td>0.44</td><td>0.52</td><td><strong>0.63</strong></td></tr>\n<tr><td>Sortino</td><td>0.62</td><td>0.74</td><td><strong>0.89</strong></td></tr>\n<tr><td>最大回撤</td><td>-50.97%</td><td>-19.82%</td><td><strong>-14.15%</strong></td></tr>\n<tr><td>Ulcer Index</td><td>12.45</td><td>4.12</td><td><strong>2.84</strong></td></tr>\n<tr><td>换手率</td><td>0.00%</td><td>112.4%</td><td><strong>64.2%</strong></td></tr>\n</table></div>\n<ul>\n<li>TRAF 接近被动基准的长期收益（11.21% vs 11.42%），但波动率降低 35%，最大回撤从 -50.97% 降至 -14.15%</li>\n<li>相比二元模型，换手率降低 43%（112.4% → 64.2%），Ulcer Index 降低 77%（12.45 → 2.84）</li>\n<li>在&quot;失落十年&quot;（2000–2009）中，TRAF 实现 +5.4% 年化收益，S&amp;P 500 为 -1.1%</li>\n</ul>\n<p><strong>状态分布</strong>：绿色 281 月（47.6%），红色 77 月（13.1%），蓝色 232 月（39.3%）——近 40% 的时间处于信号分歧状态</p>\n<p><strong>参数敏感性</strong>：EMA 回望期在 10–20 月范围内，Sharpe 稳定在 0.58–0.63，表明效果来自三元结构而非参数过拟合</p>\n<h2>创新点</h2>\n<ul>\n<li>将 Elder 脉冲系统的&quot;蓝色&quot;状态从主观交易过滤器形式化为系统性配置框架的一部分</li>\n<li>首次将&quot;信号分歧&quot;定义为一种独立的、可操作的市场状态，而非噪音</li>\n<li>状态持续性规则（sticky rule）在信号冲突期维持仓位，本质上是一种结构性噪音过滤器</li>\n<li>理论基础：信息摩擦（Hong &amp; Stein, 1999）——趋势指标反映已扩散的共识信息，动量指标响应短期交易压力变化，两者分歧表明信息尚未完全传导</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<p>1. <strong>仅测试 S&amp;P 500</strong>：单一资产类别，未验证在其他市场（如国际股票、债券、商品）的表现</p>\n<p>2. <strong>月频执行</strong>：信号为月末判断、下月初执行，无法捕捉月内剧烈波动（如 2020 年 3 月熔断）</p>\n<p>3. <strong>二元 vs 三元的比较不公平</strong>：二元 Elder 模型在蓝色状态下被迫做出决策，但其他二元模型可能有不同的蓝色状态处理方式</p>\n<p>4. <strong>防御资产选择</strong>：3 个月 T-Bill 作为现金代理，在高利率环境下天然有利，但 T-Bill 收益率本身也随市场变化</p>\n<p>5. <strong>缺乏交易成本建模</strong>：虽然换手率降低 43%，但未具体建模滑点、佣金等实际摩擦</p>\n<p>6. <strong>后 GFC ZIRP 时期</strong>（2010–2021）：TRAF 的 CAGR（13.5%）略低于 Buy &amp; Hold（14.8%），在低利率环境下可能跑输被动持有</p>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: VFINX 和 FRED TB3MS 数据均为公开数据，完全可复现</li>\n<li><strong>方法清晰度</strong>: 规则完全透明，EMA 参数（13 月）、MACD 参数（12/26/9）均为标准值，无需任何主观判断</li>\n<li><strong>计算成本</strong>: 极低，仅需计算 EMA 和 MACD，可在 Excel 中实现</li>\n<li><strong>综合评分</strong>: ★4.0</li>\n</ul>\n<h2>复现建议</h2>\n<p>建议复现：方法简单透明、数据公开、规则完全机械化，适合作为趋势跟踪策略的基线改进模块。复现要点：</p>\n<ul>\n<li>预热期：前 36 个月不交易，确保 EMA 稳定</li>\n<li>信号：月末计算，下月初执行</li>\n<li>可扩展测试：(1) 用 A 股指数（如沪深 300）+ 国债逆回购替代；(2) 加入交易成本建模（千分之一单边）；(3) 与其他趋势指标（如 Donchian 通道、Keltner 通道）组合测试三元框架的泛化性</li>\n</ul>"}, {"key": "9D3RZBHA", "title": "Be Water: An Evolutionary Proof for Trend-Following", "year": "2026", "authors": "Yijia Chen", "tags": [], "venue": "", "abstract": "The proliferation of diverse, high-leverage trading instruments in modern financial markets presents a complex, \"noisy\" environment, leading to a critical question: which trading strategies are evolutionarily viable? To investigate this, we construct a large-scale agent-based model, \"MAS-Utopia,\" comprising 10,000 agents with five distinct archetypes. This society is immersed in five years of high-frequency data under a counterfactual baseline: zero transaction friction and a robust Unconditional Basic Income (UBI) safety net. The simulation reveals a powerful evolutionary convergence. Strategies that attempt to fight the market's current - namely Mean-Reversion (\"buy-the-dip\") - prove structurally fragile. In contrast, the Trend-Following archetype, which adapts to the market's flow, emerges as the dominant phenotype. Translating this finding, we architect an LLM-driven system that emulates this successful logic. Our findings offer profound implications, echoing the ancient wisdom of \"Be Water\": for investors, it demonstrates that survival is achieved not by rigid opposition, but by disciplined alignment with the prevailing current; for markets, it critiques tools that encourage contrarian gambling; for society, it underscores the stabilizing power of economic safety nets.", "url": "https://arxiv.org/abs/2603.29593v1", "date_added": "2026-05-24", "summarized": true, "rating": "★3", "starred": false, "repro": "—", "summary_html": "<h1>Be Water: An Evolutionary Proof for Trend-Following</h1>\n<p>&gt; Zotero Key: <code>9D3RZBHA</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Yijia Chen</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: arXiv:2603.29593</li>\n<li><strong>DOI</strong>: -</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2603.29593</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/9R55CVFW/Chen - 2026 - Be Water An Evolutionary Proof for Trend-Following.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>:散户在真实市场失败，难以区分到底源于行为偏差(内因)还是结构性劣势(外因，如成本/资本不平等)，需隔离测试各类策略的&quot;进化适应度&quot;。</li>\n<li><strong>方法</strong>:构建 10,000 个智能体的多智能体模拟系统 MAS-Utopia，在零摩擦 + UBI(无条件基本收入)的理想化环境下用进化算法筛选策略，再做 LLM 驱动的 Sim2Real&quot;认知义肢&quot;辅助真人。</li>\n<li><strong>结论</strong>:趋势跟踪是唯一演化稳定的策略——最终存活 <strong>76.6%</strong> 为 Trend，平均 ROI <strong>+14.71%</strong>(远超 Reversion +0.38%、HFT −0.62%)，且 Trend 交易频率最低却收益最高(盈利与频率负相关);总财富从 1 亿增至 1.1 亿+ 证明零摩擦下零售市场可正和，UBI 未消除不平等但防止了系统性崩溃。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>散户在真实市场中失败的原因无法区分是行为偏差（内因）还是结构性劣势（外因，如交易成本、资本不平等）。作者通过构建零摩擦、UBI保障的理想化模拟环境，以隔离并纯粹测试各种交易策略的&quot;进化适应度&quot;。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 100个加密资产的5分钟OHLCV数据</li>\n<li><strong>频率</strong>: 5分钟</li>\n<li><strong>样本区间</strong>: 5年（约5.2×10^5步）</li>\n<li><strong>数据来源</strong>: 未明确说明，仿真使用真实历史数据</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>1. <strong>10,000个智能体</strong>，5种策略原型：Trend（趋势跟踪）、Reversion（均值回复）、Grid（网格）、Sniper（狙击）、HFT（高频）</p>\n<p>2. <strong>基因编码</strong>：每个智能体携带遗传向量 G = ⟨leverage, position_size, stop_loss, take_profit, FOMO, panic, attention_set⟩</p>\n<p>3. <strong>自适应波动率锚定</strong>：使用ATR动态调整止损幅度</p>\n<p>4. <strong>层级决策引擎</strong>：宏观过滤器（BTC RSI确定牛/熊/震荡）→ 微观评分（技术指标+心理偏差）</p>\n<p>5. <strong>流动性约束</strong>：鲸鱼流动性限制 L_max = $500,000</p>\n<p>6. <strong>进化机制</strong>：当回撤超过40%即&quot;破产&quot;；新生智能体50%概率继承精英策略（带高斯突变），50%概率随机初始化；始终保持等额初始资本$10,000</p>\n<h2>核心结论与关键结果</h2>\n<p>1. <strong>正和博弈</strong>: 总财富从$1亿增长至$1.1亿以上，证明零摩擦环境下零售市场可以是正和而非零和</p>\n<p>2. <strong>趋势跟踪的演化主导</strong>:</p>\n<p>   - 最终存活分布: Trend 7,659人(76.6%), Reversion 865人(8.7%), Grid 1,030人(10.3%), Sniper 233人(2.3%), HFT 213人(2.1%)</p>\n<p>   - 平均ROI: Trend +14.71%, Reversion +0.38%, HFT -0.62%, Grid -4.69%, Sniper -3.91%</p>\n<p>   - Trend平均交易312次（最低频），但收益最高——说明盈利与频率负相关</p>\n<p>3. <strong>生存区域</strong>: 低杠杆(li &lt; 10) + 中等止损(1 &lt; θ_SL &lt; 4)的基因空间构成&quot;生存区&quot;</p>\n<p>4. <strong>UBI效果</strong>: 未能消除不平等但防止了系统性崩溃，保持社会正和演化</p>\n<p>5. <strong>Sim2Real</strong>: 开发3层LLM系统（宏观扫描→MACD确认→LLM战术报告），使用DeepSeek-Reasoner</p>\n<h2>创新点</h2>\n<p>1. 在零摩擦+UBI的反事实环境下隔离测试策略适应度（而非行为偏差或交易成本）</p>\n<p>2. 大规模（10k智能体）+ 进化算法的ABM框架</p>\n<p>3. Sim2Real部署LLM驱动交易辅助系统</p>\n<p>4. 将&quot;Be Water&quot;哲学引入量化金融</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>核心假设过于理想化</strong>: 零摩擦、UBI保障、外生价格（无价格冲击反馈）的设定严重偏离真实市场</li>\n<li><strong>策略原型人为简化</strong>: 只有5种固定策略，真实市场策略远更丰富和自适应</li>\n<li><strong>结果可能依赖参数</strong>: 流动性上限$500k、破产阈值40%等参数未经敏感性分析</li>\n<li><strong>LLM系统未经实证验证</strong>: 第5节的Sim2Real系统无回测结果支撑</li>\n<li><strong>论文发表在arXiv physics.soc-ph而非量化金融期刊，peer review状态不明</strong></li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 需5年5分钟100种加密资产数据，国内数据源难以获得</li>\n<li><strong>方法清晰度</strong>: 中等，算法框架描述了，但关键参数（如评分函数阈值Omega、突变标准差sigma等）未明确给出</li>\n<li><strong>计算成本</strong>: 中高，10k智能体×52万时间步的模拟需要一定算力</li>\n<li><strong>综合评分</strong>: ★★★</li>\n</ul>\n<h2>复现备注</h2>\n<p>不建议完整复现。但从理念上，可以借鉴其&quot;适应性趋势确认&quot;的思路：先判断宏观市场状态，再确认微观信号，最后执行。这部分理念可以少量融入现有的趋势因子信号生成。不复现完整模拟，研究目录不入research/。</p>"}, {"key": "9PJRDKYN", "title": "Asset Pricing in Pre-trained Transformer", "year": "2026", "authors": "Shanyan Lai", "tags": ["Quantitative Finance - Computational Finance", "Quantitative Finance - Pricing of Securities", "Economics - Econometrics"], "venue": "", "abstract": "This paper proposes an innovative Transformer model, Single-directional representative from Transformer (SERT), for US large capital stock pricing. It also innovatively applies the pre-trained Transformer models under the stock pricing and factor investment context. They are compared with standard Transformer models and encoder-only Transformer models in three periods covering the entire COVID-19 pandemic to examine the model adaptivity and suitability during the extreme market fluctuations. Namely, pre-COVID-19 period, COVID-19 period and 1-year post-COVID-19. The best proposed SERT model achieves the highest out-of-sample $R^2$, 11.94\\% and 11.47\\% respectively, when extreme market fluctuation takes place, followed by pre-trained Transformer models (11.13\\% and 9.72\\%). Their Trend-following-based strategy's performance also proves their excellent capability for hedging downside risks during market shocks. The proposed SERT model achieves a Sortino ratio 47\\% higher than the buy-and-hold benchmark in the equal-weighted portfolio and 28\\% higher in the value-weighted portfolio in the static transaction cost scenario when the pandemic period is considered. It proves that Transformer models have a strong ability to capture patterns of temporal sparsity in asset pricing factor models, especially with high volatility. I also find the softmax signal filter as the common configuration of Transformer models in alternative contexts, which only eliminates differences between models, but does not improve strategy-wise performance, while increasing attention heads improves the model performance insignificantly and applying the 'layer normalization first' method does not boost the model performance in our case.", "url": "http://arxiv.org/abs/2505.01575", "date_added": "2026-06-27", "summarized": true, "rating": "★3.0", "starred": false, "repro": "—", "summary_html": "<h1>Asset Pricing in Pre-trained Transformers</h1>\n<p>&gt; Zotero Key: <code>9PJRDKYN</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Shanyan Lai</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: arXiv:2505.01575</li>\n<li><strong>DOI</strong>: 10.5281/zenodo.15327831</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2505.01575</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/5YJ28M5T/Lai - 2026 - Asset Pricing in Pre-trained Transformer.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：Transformer 在数值型资产定价因子模型中的应用空白，尤其在极端市场波动下的适应性</li>\n<li><strong>方法</strong>：提出 SERT（单向编码器表示 Transformer）+ MLP 自编码器预训练模块，182 个公司特征作为输入</li>\n<li><strong>结论</strong>：COVID-19 期间 OOS $R^2$ 达 11.94%；趋势跟踪策略 Sortino 比率比买入持有高 47%（等权）</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>1. <strong>ML 模型在资产定价中的局限</strong>：传统 MLP 等浅层模型缺乏对时序依赖的自然建模能力，且对缺失值敏感、存在过拟合风险。</p>\n<p>2. <strong>Transformer 在金融时序中的空白</strong>：现有 Transformer 金融应用多聚焦文本数据（情感分析），直接应用于数值型资产定价因子模型的研究稀缺。</p>\n<p>3. <strong>极端市场波动下的适应性</strong>：COVID-19 期间市场剧变，需要模型具备捕捉时序稀疏性（temporal sparsity）的能力。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 420 只美股大盘股（GKX2020 数据集）</li>\n<li><strong>频率</strong>: 月频</li>\n<li><strong>样本区间</strong>: 1957-01 至 2022-12；训练窗口 102 个月，验证 30 个月，测试分三期（pre-COVID 2013–2019、COVID 2013–2021、post-COVID 2013–2022）</li>\n<li><strong>数据来源</strong>: GKX2020 因子数据集，182 个公司特征作为输入因子，排序组合收益率作为因子代理</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[182个公司特征因子&lt;br/&gt;含缺失值] --&gt; B{预训练模块&lt;br/&gt;MLP自编码器}\n  B --&gt;|去噪+降维| C[投影到420维&lt;br/&gt;对齐输出维度]\n  C --&gt; D[线性嵌入层&lt;br/&gt;数值数据替代Word2Vec]\n  D --&gt; E[正弦位置编码 SPE]\n  E --&gt; F[编码器块&lt;br/&gt;因果掩码自注意力&lt;br/&gt;+ MLP自编码器]\n  F --&gt; G[SERT: 直接连Dense层&lt;br/&gt;Pre-trained: 跨注意力+解码器]\n  G --&gt; H[线性层+Softmax]\n  H --&gt; I[股票收益率预测 r_hat]\n  I --&gt; J[趋势跟踪策略&lt;br/&gt;→ 组合权重]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>输入预处理</strong>：182 个公司特征因子（月频），缺失值超 40% 的因子被剔除（保留 182 个），剩余缺失值通过 MLP 自编码器预训练模块填补。</p>\n<p>2. <strong>MLP 自编码器预训练</strong>（Pre-trained Transformer 特有）：</p>\n<p>   - 将 182 维含噪声输入投影到 420 维潜空间，对齐 Transformer 输出维度</p>\n<p>   - 功能类似广义 PCA（无正交/线性约束），在高维潜空间中提升因子表示质量</p>\n<p>   - 同时解决缺失值问题并降低输入噪声</p>\n<p>3. <strong>模型架构变体</strong>：</p>\n<p>   - <strong>标准 Transformer</strong>：编码器 + 跨注意力 + 解码器，完整 Seq2Seq 结构</p>\n<p>   - <strong>Pre-trained Transformer</strong>：在标准 Transformer 前加 MLP 预训练模块</p>\n<p>   - <strong>SERT（单向编码器表示 Transformer）</strong>：移除解码器和跨注意力层，仅保留编码器 + MLP 自编码器，线性连接到输出层。使用因果掩码确保单向性，避免未来数据泄露</p>\n<p>4. <strong>注意力机制</strong>：</p>\n<p>   - <strong>自注意力</strong>：$Q = W^Q X$, $K = W^K X$, $V = W^V X$，掩码注意力 $\\text{Masked Attention}(Q,K,V) = \\text{Softmax}\\left(\\frac{QK^\\top}{\\sqrt{d_{\\text{model}}}} + M\\right)V$</p>\n<p>   - <strong>因果掩码</strong>：$M_{ij} = 0$（$i &lt; j$）或 $-\\infty$（$i &gt; j$），确保时间序列中不使用未来信息</p>\n<p>   - <strong>多头注意力</strong>：将因子分组，各组独立计算注意力后拼接</p>\n<p>5. <strong>位置编码</strong>：正弦位置编码（SPE），$PE_{(pos,2i)} = \\sin\\left(\\frac{pos}{10000^{2i/d_{\\text{model}}}}\\right)$，标记时间步的绝对和相对位置。</p>\n<p>6. <strong>训练目标</strong>：最小化 MSE + L1 正则化，使用 Adam 优化器。参数每 12 个月重新估计。</p>\n<p>7. <strong>趋势跟踪策略</strong>：基于预测收益率排序，等权/市值加权构建多空组合，评估 Sortino 比率。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>SERT 最优</strong>：pre-COVID OOS $R^2$ = 11.94%，COVID 期间 11.47%，均显著高于基准</li>\n<li><strong>Pre-trained Transformer 次优</strong>：pre-COVID 11.13%，COVID 9.72%</li>\n<li><strong>趋势跟踪策略</strong>：SERT 在等权组合中 Sortino 比率比买入持有高 47%，市值加权高 28%（静态交易成本下）</li>\n<li><strong>消融实验</strong>：</li>\n</ul>\n<p>  - Softmax 信号过滤器：仅消除模型间差异，不提升策略表现</p>\n<p>  - 增加注意力头数：对模型表现提升不显著</p>\n<p>  - Layer Normalization First（LNF）：在本案例中未提升表现</p>\n<ul>\n<li>Transformer 在高波动期间表现更优，证明其捕捉时序稀疏性的能力</li>\n</ul>\n<h2>创新点</h2>\n<p>1. 提出 SERT 模型——移除解码器的简化 Transformer，专为数值型时序资产定价设计</p>\n<p>2. 将 MLP 自编码器作为预训练模块，用于因子去噪和缺失值填补</p>\n<p>3. 在 COVID-19 三个时期的全面对比中验证 Transformer 的极端市场适应性</p>\n<p>4. 系统消融了 softmax 过滤器、多头注意力、LNF 等配置的影响</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>单一市场</strong>：仅美股大盘股，未验证其他市场或小盘股</li>\n<li><strong>月频数据</strong>：时序稀疏性虽是重点，但月频数据量有限（672 个样本），深度 Transformer 可能过拟合</li>\n<li><strong>$R^2$ 绝对值偏低</strong>：最高 11.94% 虽在学术上显著，但实际交易中扣除成本后经济意义有限</li>\n<li><strong>交易成本简化</strong>：使用静态交易成本（20bps），未考虑实际市场冲击和流动性</li>\n<li><strong>基准选择</strong>：未与近期 SOTA 模型（如 Gu et al. 的 MLP 集成、Diep et al. 的 GELU 线性单元）充分对比</li>\n<li><strong>预训练模块实质</strong>：MLP 自编码器预训练更像是维度变换和去噪，非真正意义上的自监督预训练</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>：GKX2020 数据集为公开学术数据集，可获取</li>\n<li><strong>方法清晰度</strong>：模型架构描述详尽，有伪代码和结构图，但部分实现细节（如超参搜索空间）不够明确</li>\n<li><strong>计算成本</strong>：中等——单编码器单解码器结构，参数量适中，月频数据训练快</li>\n<li><strong>综合评分</strong>: ★3.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>中等优先级。SERT 作为简化 Transformer 架构值得验证，但核心贡献（预训练 MLP + 编码器 Transformer）相对直接。建议用天软或 AKShare 获取 A 股因子数据复现，关注：(1) MLP 预训练模块的实际去噪效果；(2) 因果掩码在月频数据上的必要性；(3) 与 Gu et al. MLP 基准的对比。</p>"}, {"key": "BHS9M8VQ", "title": "Anticipatory Portfolio Optimization", "year": "2026", "authors": "Miquel Noguer i Alonso", "tags": ["Quantitative Finance - Portfolio Management"], "venue": "", "abstract": "A portfolio is \\emph{anticipatory} when its optimizer acts on a richer model than the myopic, price-taking estimator used to calibrate it. Enrichment may be informational, via enlarged filtrations; dynamic, via horizon forecasts; or performative, via the deployment law induced by market impact. We give a decision-theoretic definition for all three cases and measure anticipation by the realized control gap between enriched controller and restricted estimator. The same quadratic geometry separates information, planning value, impact correction, and overfitting. For log utility under initial enlargement, value is the information-drift energy $\\frac12\\mathbb{E} \\int_0^Tα_t^2\\,dt$, equivalently mutual information or relative entropy. In mean-variance form, signal value is $\\frac{1}{2γ}{\\rm tr}(Σ^{-1}Ω)$. Dynamic forecast anticipation gives a finite-horizon quadratic premium in the forecast stack, while permanent impact changes the price-taking allocation $θ_{\\rm na} =(Λ+γΣ)^{-1}μ$ into $θ_{\\rm an} = (2Λ+γΣ)^{-1}μ$ and reveals a spectral phase transition for naive recalibration. The main result is a stacked finite-horizon LQG decomposition: information, forecast, and impact combine into an information trace plus one inverse-precision norm, whose expansion yields the impact term, forecast term, and signed forecast-impact interaction. Sharp angle bounds and an orthogonal nonnegative projection identity resolve the signed term. The stationary extension endogenizes information covariance as Kalman error reduction and carries impact anticipation to an infinite-horizon Lyapunov trace with transaction costs. Finally, the penalty $\\frac{1}{2}{\\rm tr}(H^{-1}Σ_\\varepsilon)$ shows that correctly specified anticipation creates value, vacuous anticipation has zero value, and misspecified anticipation is harmful when estimated structure is optimized as true.", "url": "http://arxiv.org/abs/2606.04258", "date_added": "2026-06-07", "summarized": true, "rating": "★3.0", "starred": false, "repro": "—", "summary_html": "<h1>Anticipatory Portfolio Optimization</h1>\n<p>&gt; Zotero Key: <code>BHS9M8VQ</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Miquel Noguer i Alonso (AIFI)</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: arXiv</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2606.04258</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2606.04258</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/PBE7CMHK/Alonso - 2026 - Anticipatory Portfolio Optimization.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：文献中&quot;anticipatory portfolio optimization&quot;有三种互不相干的含义（知情交易、预报优化、冲击预测），缺乏统一框架</li>\n<li><strong>方法</strong>：在 LQG 决策框架下统一处理信息、预报和冲击三类 anticipation，给出闭式价值公式和可加分解定理</li>\n<li><strong>结论</strong>：三面价值可严格可加分解 $V = V_{\\text{impact}} + V_{\\text{info}} + V_{\\text{forecast}}$，存在精确的预报-冲击交叉项；朴素重校准的谱相变条件为 $\\rho(\\gamma^{-1}\\Sigma^{-1}\\Lambda) = 1$</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>文献中&quot;anticipatory portfolio optimization&quot;至少有三种互不相干含义：知情交易者的扩大滤波、基于预报的多期动态优化、做市冲击的 performative prediction。本文论证三者本质同一：优化器使用的模型比估计器更丰富，价值差即为 estimation–control gap。核心问题是给出这三类 anticipation 的统一测度、闭式价值公式和合路分解，以及量化 misspecification 的伤害。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 理论论文，无实证数据</li>\n<li><strong>频率</strong>: —</li>\n<li><strong>样本区间</strong>: —</li>\n<li><strong>数据来源</strong>: —</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>本论文纯解析推导，在 LQG 框架下一次处理三类 anticipation 的价值和交互。下面仅勾画最核心的两层结构。</p>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[&quot;受限模型&lt;br/&gt;基础信息集 I0&lt;br/&gt;价格接受律 P̄&quot;] --&gt; B[&quot;朴素优化器 θ_na&quot;]\n  B --&gt; C[&quot;朴素价值 J(θ_na)&quot;]\n  \n  A --&gt; D[&quot;富化: 信息 / 预报 / 冲击&quot;]\n  D --&gt; E[&quot;Anticipatory 控制器 θ_an&quot;]\n  E --&gt; F[&quot;Anticipatory 价值 J(θ_an)&quot;]\n  \n  F --&gt; G[&quot;价值差: V = J(θ_an) − J(θ_na)&quot;]\n  \n  subgraph 信息面\n    H[&quot;扩大滤波 G ⊃ F&lt;br/&gt;信息漂移 α_t&quot;] --&gt; I[&quot;对数效用: V = ½E∫α²dt&lt;br/&gt;均值-方差: V = ½γ⁻¹tr(Σ⁻¹Ω)&quot;]\n  end\n  \n  subgraph 预报面\n    J[&quot;多期收益预报栈 m&quot;] --&gt; K[&quot;V_forecast = ½(m−m̄)⊤BK⁻¹B(m−m̄)&quot;]\n  end\n  \n  subgraph 冲击面\n    L[&quot;永久线性冲击 Λ&quot;] --&gt; M[&quot;θ_na = (Λ+γΣ)⁻¹μ&lt;br/&gt;θ_an = (2Λ+γΣ)⁻¹μ&quot;]\n    M --&gt; N[&quot;V_impact = ½×norm(θ_na−θ_an)²_H&quot;]\n  end\n  \n  G --&gt; O[&quot;三层合路分解&lt;br/&gt;V = V_impact + V_info + V_forecast&lt;br/&gt;交叉项(正交投影可消)&quot;]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>决策框架</strong>：定义 portfolio decision system (Θ, {P_θ}, I, U)。朴素优化器仅用基础信息 I₀ 和固定的价格接受律 P̄；anticipatory 优化器用完整模型 (I, {P_θ})。V = J(θ_an) − J(θ_na) ≥ 0 当模型正确设定；misspecification 时可为负。</p>\n<p>2. <strong>信息 anticipation</strong>（initial enlargement）：在 Jacod 条件下，知情的 G-滤波把公开的布朗运动变为含漂移 α_t 的半鞅。对数效用下 V_info = ½E[∫₀ᵀ α_t² dt]，等于互信息/相对熵。均值-方差下 V_info = ½γ⁻¹ tr(Σ⁻¹Ω)，其中 Ω = Cov(µ|I) 是信号解析掉的均值协方差。</p>\n<p>3. <strong>预报 anticipation</strong>：将 Gârleanu-Pedersen 多期交易问题写为有限时域二次型，获得到最优预报栈的精确价值：V_forecast = ½(m − m̄)⊤ B K⁻¹ B (m − m̄)，其中 K = R + D⊤CD 是动态精度矩阵。预报误差仅在优化器能表达的方向上才产生损失。</p>\n<p>4. <strong>冲击 anticipation</strong>（performative）：永久线性冲击 E[r] = µ − Λθ。价格接受者的自一致解 θ_na = (Λ + γΣ)⁻¹µ；冲击感知最优解 θ_an = (2Λ + γΣ)⁻¹µ——差异是独买者修正。V_impact = ½‖θ_na − θ_an‖²_H。冲击缩小头寸的 spectral 表述：每个特征方向上的有效风险从 λ_j + γσ²_j 变为 2λ_j + γσ²_j。</p>\n<p>5. <strong>朴素重校准的谱相变</strong>：朴素迭代 θ^{(k+1)} = γ⁻¹Σ⁻¹(µ − Λθ^{(k)}) 全局收敛当且仅当 ρ(γ⁻¹Σ⁻¹Λ) &lt; 1。阻尼版本 ω &lt; 2/(1+ρ) 可恢复收敛，但收敛目标仍是次优的 θ_na。</p>\n<p>6. <strong>多交易者扩展</strong>：N 个对称 Nash 均衡下 θ⋆ = [γΣ + (N+1)Λ]⁻¹µ。冲击 anticipation 的价值 O(N⁻²) 衰减，被竞争消蚀——类似 Grossman-Stiglitz 信息价值消蚀。</p>\n<p>7. <strong>合路分解</strong>（核心定理）：在 LQG 模型中，信息、冲击和预报可严格分解。V = ½‖θ_na − θ_na^H‖²_H + ½ tr(H⁻¹Ω)（二路）；加入预报栈后还有预报项和预报-冲击交叉项。交叉项的正负通过正交投影恒等式解析：当预报和冲击在同方向加载时互补，正交时独立，对立方向抵销。</p>\n<p>8. <strong>估计 anticipation 的精确惩罚</strong>：用估计模型做 anticipation 时，E[J(θ⋆) − J(θ̂)] = ½ tr(H⁻¹Σ_ε)，与信息增益 ½ tr(H⁻¹Ω) 同为逆精度迹，符号相反。最优收缩策略 s⋆ = q/(q+p)（信噪比），即为可靠性比率。</p>\n<p>9. <strong>鲁棒层</strong>：Wasserstein 分布鲁棒优化等价于对偶范数惩罚 ε‖θ‖_*，在各面提供 misspecification 的下行保护。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>Anticipation 的三面统一于 estimation–control gap：富化模型后优化器的价值增量</li>\n<li>信息 anticip. = ½γ⁻¹tr(Σ⁻¹Ω)；冲击 anticip. = ½‖θ_na − θ_an‖²_H；预报 anticip. = 加权二次范数</li>\n<li>三面可加分解，且存在精确的预报-冲击交叉项（可为正/负/零）</li>\n<li>估计 anticipation 的价值 = 结构价值 − ½tr(H⁻¹Σ_ε)，最优决策收缩到可靠性比率</li>\n<li>朴素重校准的谱相变条件 ρ(γ⁻¹Σ⁻¹Λ) = 1；内部化冲击扩展稳定域</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次用统一决策框架严格连接信息、预报和冲击三种 anticipation</li>\n<li>给出 LQG 下完整的三面闭式价值和可加分解定理</li>\n<li>将 performative prediction 的 portfolio 版本做出了完整解析（含 N 交易者博弈）</li>\n<li>估计 penalty 的精确公式：逆精度迹与信息增益镜像对称</li>\n<li>谱相变刻画了朴素重校准何时发散</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>纯理论</strong>：无任何实证检验，所有结果在 LQG 假设下得出</li>\n<li><strong>假设强</strong>：永久线性冲击、正态分布、无约束组合等设定与真实市场差距大</li>\n<li><strong>实用转化远</strong>：数学优雅但直接用于实盘还需要大量工程化工作</li>\n<li><strong>未涉及暂态冲击</strong>：仅简要说 transient impact 可推广，未给出详细解法</li>\n<li><strong>估计 penalty 在真实非正态数据上可能低估</strong></li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 无需数据（理论论文）</li>\n<li><strong>方法清晰度</strong>: 定理陈述清晰，证明在文中给出，但数学密集</li>\n<li><strong>计算成本</strong>: 低（闭式解为主）</li>\n<li><strong>综合评分</strong>: ★3.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>理论贡献主要在于概念统一和闭式解——本身不产生&quot;可交易的因子&quot;。若复现，最有价值的实用产出来自两方面：</p>\n<ul>\n<li><strong>冲击感知组合</strong>：θ_an = (2Λ + γΣ)⁻¹μ，可在有冲击估计或已知价差弹性的品种上对比 θ_na 的 OOS 表现。需要为不同资产类别校准 Λ。</li>\n<li><strong>可靠性收缩</strong>：对策略产出的信号做 s⋆ 收缩（Corollary 6.4），避免 over-optimization——这是一个可嵌入任何组合生成流程的简单后处理步骤。</li>\n</ul>"}, {"key": "S92XXEH8", "title": "Anomaly Premiums with Dynamic Exits", "year": "2026", "authors": "Nitin Kumar, Nagpurnanand Prabhala, Ravi Ranjan", "tags": ["Value", "Machine Learning", "Asset Pricing", "Momentum", "Alpha", "Anomalies", "Exit Timing", "Profitability", "Random Kernels", "Randomized Features"], "venue": "", "abstract": "<p>Anomaly premiums are traditionally based on long-short portfolios held passively for a</p> <p>fixed horizon. We estimate premiums when exits are instead opti", "url": "https://papers.ssrn.com/abstract=6076808", "date_added": "2026-05-24", "summarized": true, "rating": "★3.5", "starred": false, "repro": "—", "summary_html": "<h1>Anomaly Premiums with Dynamic Exits</h1>\n<p>&gt; Zotero Key: <code>S92XXEH8</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Kumar, Arvind; Prabhala, Nagpurnanand R.; Ranjan, Rishabh</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: SSRN Working Paper</li>\n<li><strong>DOI</strong>: —</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=5212591</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/VELNHEP8/Kumar 等 - 2026 - Anomaly Premiums with Dynamic Exits.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：传统异象策略使用固定持有期（通常 1 个月），忽略了个股在持有月内存在&quot;最优退出窗口&quot;——异象收益在月内分布极不均匀，峰值集中在特定周。</li>\n<li><strong>方法</strong>：用 ROCKET（随机卷积核变换）提取过去 15 天日收益的 120,000 维特征，随机森林预测个股最优退出周，在 NYSE 大市值股票 1975—2023 年上对动量/价值/盈利能力策略做动态退出。</li>\n<li><strong>结论</strong>：动量/价值/盈利能力策略 Sharpe 从 0.09—0.26 提升至 0.77—1.07，组合后达 1.61，不改变进场信号的前提下系统性提升收益。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>传统异象策略（动量、价值、盈利能力）使用固定持有期（通常 1 个月），忽略了个股在持有月内存在&quot;最优退出窗口&quot;。作者发现异象收益在持有月内分布极不均匀（峰值集中在特定周），提出用机器学习预测个股的最优退出时点，在不改变进场信号的前提下系统性提升策略收益。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: NYSE 大市值股票（市值 &gt; 第 50 百分位）</li>\n<li><strong>频率</strong>: 日度（特征构建）；周度（预测目标）；月度（进场信号）</li>\n<li><strong>样本区间</strong>: 1975–2023（约 48 年）</li>\n<li><strong>数据来源</strong>: CRSP（收益）；Compustat（财务数据）；约 900 只股票/月</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>核心架构：ROCKET（Random Convolutional Kernel Transform）</strong></p>\n<p>1. 输入：每只股票过去 15 天日收益序列（向量长度 15）。</p>\n<p>2. 卷积核：随机生成 $q = 60{,}000$ 个卷积核，每个核有随机长度（3–15）、随机权重、随机膨胀率（dilation）和随机偏置。</p>\n<p>3. 特征提取：每个核计算两个统计量：</p>\n<p>   - <strong>最大值</strong>（max pooling）</p>\n<p>   - <strong>正比例</strong>（proportion of positive values, PPV）</p>\n<p>4. 总特征维度：$2q = 120{,}000$。</p>\n<p><strong>预测目标</strong>:</p>\n<p>将持有月划分为 4 周（周仓位），模型预测个股收益峰值（多头）或谷值（空头）落在哪一周。</p>\n<p><strong>训练框架</strong>:</p>\n<ul>\n<li>36 个月训练窗口</li>\n<li>12 个月验证窗口（特征选择 + 超参数调整）</li>\n<li>6 个月测试窗口（滚动向前，每 6 个月重训练）</li>\n</ul>\n<p><strong>下游分类器</strong>: 随机森林（Random Forest），输入为 ROCKET 特征，输出为最优退出周预测。</p>\n<p><strong>策略构建</strong>:</p>\n<ul>\n<li>进场：月初按传统异象信号（动量/价值/盈利能力）构建多空组合。</li>\n<li>退出：按模型预测的最优周平仓，其余时间持现金。</li>\n</ul>\n<h2>核心结论与关键结果</h2>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>策略</th><th>静态退出 SR</th><th>动态退出 SR</th><th>动态 α（月度，bps）</th><th>t 值</th></tr>\n<tr><td>动量（MOM）</td><td>0.26</td><td>0.77</td><td>~83</td><td>3.65</td></tr>\n<tr><td>价值（B/M）</td><td>0.09</td><td>0.85</td><td>~98</td><td>7.22</td></tr>\n<tr><td>盈利（GP/A）</td><td>0.25</td><td>1.07</td><td>~95</td><td>6.50</td></tr>\n<tr><td>三策略合并</td><td>0.55</td><td>1.61</td><td>—</td><td>—</td></tr>\n</table></div>\n<ul>\n<li>扣除交易成本后：动态 α 降至约 0.64–0.70%/月，仍显著。</li>\n<li>完美预见收益捕获率（profit capture ratio）：约 11–12%，说明仍有大量提升空间。</li>\n<li>动态退出对价值策略改善最显著（从 0.09 到 0.85），因价值策略月内波动集中度更高。</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>将 ROCKET（原为时序分类设计）首次应用于金融异象的退出时机预测。</li>\n<li>从&quot;最优进场&quot;转向&quot;最优退出&quot;的视角切换，补充了量化选股研究的空白。</li>\n<li>随机卷积核避免了梯度优化，120,000 维特征仍能快速训练（无 GPU 需求）。</li>\n<li>三个异象组合后 SR = 1.61，显著超越任何单一静态策略。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>仅限于美国大市值股票，商品期货的适用性未知。</li>\n<li>120,000 个随机特征需要严格的过拟合控制，36+12 个月的训练/验证窗口是否充分存疑。</li>\n<li>交易成本估算（约 0.10–0.30%/交易）可能低估中小市值或低流动性资产的实际成本。</li>\n<li>退出信号本身也有信息泄露风险（用未来周数据标注训练目标）。</li>\n<li>样本期（1975–2023）包含多个结构性变化，策略稳定性未做子样本检验。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 需要 CRSP 日频收益和 Compustat 财务数据，天软可提供 A 股类似数据，但动量/价值因子在 A 股的表现可能不同。</li>\n<li><strong>方法清晰度</strong>: ROCKET + 随机森林框架描述完整，开源实现（sktime/tsai）可直接使用。</li>\n<li><strong>计算成本</strong>: 中等，120,000 维特征需要较大内存，但无需 GPU；每 6 个月重训练可接受。</li>\n<li><strong>综合评分</strong>: ★3.5</li>\n</ul>\n<h2>复现备注</h2>\n<p><strong>最小可行版本</strong>:</p>\n<p>1. 选取单一商品品种（如螺纹钢或沪铜），取日度连续合约收益。</p>\n<p>2. 构建 15 天滑动窗口特征，用 sktime 的 ROCKET 提取特征。</p>\n<p>3. 随机森林预测最优退出周（4 分类）。</p>\n<p>4. 与固定月末平仓策略对比 Sharpe。</p>\n<p>关键风险：商品期货月度换仓频率低，样本量（约 200 个月×品种数）可能不足以稳定训练。建议先用 A 股选股验证框架，再迁移至期货。</p>\n<p>对接路径: <code>（内部研究目录）</code></p>"}, {"key": "PXUVDTE7", "title": "An Index of Commodity Futures Returns Since 1871", "year": "2026", "authors": "Rajkumar Janardanan, Xiao Qiao, K. Geert Rouwenhorst", "tags": ["SSRN", "An Index of Commodity Futures Returns Since 1871", "K. Geert Rouwenhorst", "Rajkumar Janardanan", "Xiao Qiao"], "venue": "", "abstract": "This paper documents the returns to a broadly diversified index of commodity futures over more than 150 years of U.S. market history, that accounts for survivorship bias. We find that commodity futures have earned an average annual risk premium of 5.4% over the risk-free rate and a premium over US inflation of more than 6% per annum. Commodity futures have outperformed equities in roughly 43% of years and in two out of every five decades, suggesting distinct return drivers and meaningful diversification benefits. Futures returns have exceeded spot price returns on an interest-adjusted basis, consistent with the presence of a risk premium beyond spot price appreciation.", "url": "https://papers.ssrn.com/abstract=6276738", "date_added": "2026-05-24", "summarized": true, "rating": "★2.0", "starred": false, "repro": "—", "summary_html": "<h1>An Index of Commodity Futures Returns Since 1871</h1>\n<p>&gt; Zotero Key: <code>PXUVDTE7</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Rajkumar Janardanan, Xiao Qiao, K. Geert Rouwenhorst</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: SSRN</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.6276738</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=6276738</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/QEGCDVVS/Janardanan 等 - 2026 - An Index of Commodity Futures Returns Since 1871.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：商品期货是否构成独立资产类别？回答需要长历史数据，但现有商业数据库最早仅到 1959 年。</li>\n<li><strong>方法</strong>：手工收集 230 个美国商品期货合约（含已退市品种），构建 1871—2025 年共 155 年的等权完全抵押期货收益指数，系统比较与股票的表现。</li>\n<li><strong>结论</strong>：商品期货年化风险溢价 5.5%（股票 6.6%）、Sharpe 0.38（股票 0.41），跑赢通胀超 6%/年，约 43% 的年份跑赢股票；三个 50 年子区间收益稳定在 7.8—8.7%，验证了独立资产类别地位。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>商品期货是否构成独立资产类别？按 Sharpe (1992) 的定义，资产类别需具备&quot;相似的风险收益特征且对经济力量有共同的反应&quot;。回答这个问题的关键是长历史数据——这篇论文利用手工收集的 1871-2025 年数据，构建了覆盖 155 年的商品期货收益指数，并系统比较其与股票的表现。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 230 个在美国交易所交易的商品期货合约，包含已退市品种（消除幸存者偏差）</li>\n<li><strong>频率</strong>: 月度（等权再平衡）</li>\n<li><strong>样本区间</strong>: 1871–2025</li>\n<li><strong>数据来源</strong>: 手工收集 — 交易所年鉴 + 报纸档案（无公开数据库可直接复现）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<ul>\n<li><strong>指数构建</strong>: 每月末持有最近到期但不于下月到期的合约（front contract）；所有品种等权，月度再平衡。</li>\n<li><strong>收益定义</strong>: 完全抵押（collateralized）期货总收益 = 期货超额收益 + 无风险利率（T-Bill）。抵押品投资于 T-Bill，因此期货超额收益即风险溢价。</li>\n<li><strong>收益分解</strong>: 期货超额收益 = 现货收益 + 滚动收益（Roll Yield）；滚动收益 = 便利收益 - (利率 + 仓储成本)。</li>\n</ul>\n<h2>核心结论与关键结果</h2>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>指标</th><th>商品期货</th><th>股票</th></tr>\n<tr><td>年化风险溢价</td><td>5.5%</td><td>6.6%</td></tr>\n<tr><td>年化波动率</td><td>14.3%</td><td>16.2%</td></tr>\n<tr><td>Sharpe Ratio</td><td>0.38</td><td>0.41</td></tr>\n<tr><td>跑赢通胀</td><td>&gt;6%/年</td><td>—</td></tr>\n</table></div>\n<ul>\n<li>商品期货在约 <strong>43%</strong> 的年份中跑赢股票，<strong>每五个十年中有两个</strong>跑赢。</li>\n<li>三个约 50 年的子区间内，商品期货的几何平均总收益均落在 7.8-8.7% 的窄幅区间内（股票为 6.5-12.6%），Sharpe 波动范围（0.31-0.48）也小于股票（0.29-0.57）。</li>\n<li>期货超额收益历史上跑输现货收益（因滚动收益累计为负），但在经利率调整后跑赢（正便利收益-仓储成本差）。</li>\n<li>滚动收益为负不阻碍正风险溢价——这打破了&quot;期货必须 backwardation 才能赚钱&quot;的常见误解。</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>前所未有的数据广度：覆盖 230 个合约（含已退市），时间跨度 155 年，远超现有商业数据库（CRB 最早仅到 1959 年）。</li>\n<li>系统纠正了幸存者偏差——已退市合约表现通常更差，不含它们会高估收益。</li>\n<li>清晰地区分了期货收益 vs. 现货收益 vs. 抵押期货收益，澄清了常见的概念混淆。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>数据不可公开复现</strong>：手工收集的报纸/年鉴数据为私有数据集，外部无法直接复现。</li>\n<li>等权指数可能高估了实际可投资性——小品种流动性差，无法以等权规模交易。</li>\n<li>早期合约的交易成本、市场摩擦无法评估。</li>\n<li>早期数据的可靠性（19 世纪报纸报价的准确性）难以验证。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 极低——核心数据集为手工收集的专有资产，未公开。</li>\n<li><strong>方法清晰度</strong>: 指数构建方法清晰，可复现方法但无法复现结果。</li>\n<li><strong>计算成本</strong>: 极低，纯指数构建。</li>\n<li><strong>综合评分</strong>: ★★☆☆☆ 2.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>这是一篇<strong>参考性文献</strong>而非可复现论文。核心价值在于提供了商品期货长期风险溢价的证据基准，可用于策略报告的背景引用。数据不可公开获取意味着复现无实际意义。若需类似长期序列作参考，可用 Gorton &amp; Rouwenhorst (2006) 的更短样本（1959 年起）或 Levine et al. (2018) 的公开发布数据替代。</p>"}, {"key": "RHW66WQX", "title": "AlphaSAGE: Structure-Aware Alpha Mining via GFlowNets for Robust Exploration", "year": "2026", "authors": "Binqi Chen, Hongjun Ding, Ning Shen…", "tags": ["Quantitative Finance - Computational Finance"], "venue": "", "abstract": "The automated mining of predictive signals, or alphas, is a central challenge in quantitative finance. While Reinforcement Learning (RL) has emerged as a promising paradigm for generating formulaic alphas, existing frameworks are fundamentally hampered by a triad of interconnected issues. First,
