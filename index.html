>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>：N/A（纯理论模型，无需实证数据复现）。</li>\n<li><strong>方法清晰度</strong>：中等。模型设定和均衡条件有明确的数学表达，但推导过程较长且依赖较多假设，完整复现需要较强的宏观金融建模能力。</li>\n<li><strong>计算成本</strong>：中等。需要实现 DSGE 模型的数值求解和校准模拟（Dynare 或 MATLAB）。</li>\n<li><strong>综合评分</strong>: ★2.5</li>\n</ul>\n<h2>复现备注</h2>\n<ul>\n<li>本文为纯理论模型论文，复现价值主要在于理解金融监管套利对商品定价的影响机制，而非直接用于交易策略开发。</li>\n<li>如需复现，建议使用 Dynare（MATLAB/Octave）或 Python 的 <code>sequence-jacobian</code> 包实现 DSGE 模型求解。</li>\n<li>校准参数见文中各图注（$\\alpha_j=1$, $\\theta_j=0.002$, $\\eta=0.002$, $\\nu_j^j=0.9$, $\\bar{c}_i^j/\\bar{Q}_i^j=1.5$, $\\ln p^j=10$, $\\beta=0.9975$, $\\bar{R}=0.5\\%$/月）。</li>\n<li>扩展方向：引入异质性投资者、多期套利、非完全市场摩擦，或与中国商品期货市场的实证数据进行结构估计。</li>\n</ul>"}, {"key": "DMSPG8TW", "title": "Factor Pricing Across Asset Classes", "year": "2025", "authors": "Thuy Duong Dang, Fabian Hollstein, Marcel Prokopczuk", "tags": ["asset classes", "Factor models", "market integration", "model comparison"], "venue": "", "abstract": "An integrated factor model is valuable for multi-asset class investing and proves superior for analyzing fund performance. We study factor pricing across seven major asset classes, including U.S. and international equities, corporate bonds, commodities, currencies, equity indices, and government bonds. The pricing power of models from one asset class for others is limited. We use a factor selection methodology to create an optimal integrated factor model across asset classes. This model includes several equity and corporate bond factors, but prices assets across all asset classes without requiring factors from each. The results suggest that markets are significantly but imperfectly integrated.", "url": "https://papers.ssrn.com/abstract=4481121", "date_added": "2026-05-25", "summarized": true, "rating": "★2.0", "starred": false, "repro": "—", "summary_html": "<h1>Factor Pricing Across Asset Classes</h1>\n<p>&gt; Zotero Key: <code>DMSPG8TW</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Thuy Duong Dang, Fabian Hollstein, Marcel Prokopczuk</li>\n<li><strong>年份</strong>: 2025</li>\n<li><strong>出处</strong>: SSRN (4481121)</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.4481121</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=4481121</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/3KNGJNBH/Dang 等 - 2025 - Factor Pricing Across Asset Classes.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：现有因子模型几乎都在单一资产类别内开发，跨资产通用性未经验证，多资产投资者缺乏统一定价框架。</li>\n<li><strong>方法</strong>：对七大资产类别（美股、国际股票、公司债、商品、外汇、股指期货、国债）做 42 方向跨资产定价检验，并用因子筛选方法构建跨资产集成因子模型。</li>\n<li><strong>结论</strong>：单一资产类别因子跨类通用性差；最优集成模型主要由美股+公司债因子构成即可覆盖多数资产类别，但市场整合非完美（部分类别截距仍显著）。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<ul>\n<li>现有因子模型几乎都是单资产类别内开发的（如 Fama-French 对股票，Asness/Koijen 对商品），跨资产通用性未经验证。</li>\n<li>多资产投资者（如桥水、AQR）需要统一的定价框架来理解不同资产之间的风险补偿来源。</li>\n<li>本文问：一个资产类别的因子能否给另一个资产类别定价？如果可以，哪些因子是&quot;跨资产通用&quot;的？</li>\n</ul>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 七大类别</li>\n</ul>\n<p>  - 美国股票（个股）</p>\n<p>  - 国际股票（发达市场，个股）</p>\n<p>  - 公司债券（投资级 + 高收益）</p>\n<p>  - 商品期货（能源、金属、农产品）</p>\n<p>  - 外汇（G10 + 新兴市场）</p>\n<p>  - 股指期货（全球主要市场）</p>\n<p>  - 国债（美国 + 发达市场）</p>\n<ul>\n<li><strong>频率</strong>: 月度</li>\n<li><strong>样本区间</strong>: 约 1990–2021</li>\n<li><strong>数据来源</strong>: CRSP, Compustat, Bloomberg, Datastream, Refinitiv</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>第一步：跨资产定价能力检验</h3>\n<p>对每个资产类别，用其他六大类别的因子模型逐一套入，评估截距项（alpha）是否为零：</p>\n<ul>\n<li>如果某类别的因子能&quot;解释&quot;另一类别的资产收益→截距不显著→跨资产定价有效</li>\n<li>对所有 7×6=42 个方向做完整的检验</li>\n</ul>\n<h3>第二步：集成因子模型构建</h3>\n<p>使用因子筛选方法（stepwise / LASSO / elastic net）从全部候选因子（覆盖七大类别共 50+ 个因子）中选出最优子集，使其最大化跨资产的定价能力（最小化各资产类别的平均 alpha 绝对值）。</p>\n<h3>第三步：市场整合度评估</h3>\n<p>通过集成模型对各资产类别截距的大小和显著性，判断市场一体化程度——截距越小=整合度越高。</p>\n<h2>核心结论与关键结果</h2>\n<p>1. <strong>单一资产类别的因子跨类通用性差</strong>：商品的展期收益因子对股票几乎没有解释力，股票的 HML/SMB 对商品和外汇的解释力也很弱</p>\n<p>2. <strong>最优集成模型主要由美股+公司债因子构成</strong>：这两类因子的跨资产定价能力最强，可以覆盖商品、外汇、国债等其他类别</p>\n<p>3. <strong>不需要每个类别各取一个因子</strong>：集成模型中的因子数远少于资产类别数，说明不同类别的风险补偿有共同驱动</p>\n<p>4. <strong>市场显著但非完美整合</strong>：集成模型无法完全消除所有资产类别的 alpha（部分类别截距仍显著），说明存在资产类别特定的风险溢价</p>\n<p>5. <strong>集成模型在基金业绩评估中优于单类别模型</strong>：用跨资产模型评估多资产基金时，alpha 更小且更稳健</p>\n<h2>创新点</h2>\n<ul>\n<li>首次对七大资产类别做系统性的跨资产因子定价能力比较</li>\n<li>采用因子筛选方法构建&quot;最小必要&quot;跨资产集成模型</li>\n<li>为多资产投资实践（业绩归因、风险分解）提供实证基础</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>样本内模型选择偏差</strong>：因子筛选在样本内进行，最优子集可能过度适应历史数据</li>\n<li><strong>因子定义版本差异</strong>：不同数据源对同一因子（如 value, momentum）的定义略有区别，可能影响跨资产比较</li>\n<li><strong>仅覆盖长周期月度数据</strong>：未讨论因子定价能力在高频/危机期的时变性</li>\n<li><strong>实用落地有限</strong>：论文主要是描述性统计和实证验证，不产生可交易的信号或策略</li>\n<li><strong>新兴市场覆盖不足</strong>：国际股票以外的新兴市场资产类别（新兴市场债券、新兴货币）未深入讨论</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: ★★ 覆盖七个资产类别的全面数据库需要大量商业数据源（CRSP, Bloomberg, Datastream），成本高</li>\n<li><strong>方法清晰度</strong>: ★★★★ 因子定义和回归框架标准，但因子筛选的具体步骤和阈值需大量摸索</li>\n<li><strong>计算成本</strong>: ★★★★ 月度回归，计算量轻</li>\n<li><strong>综合评分</strong>: ★★2.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>论文偏学术实证验证而非策略开发，对交易策略的直接指导价值有限。不复现。若未来需要建立跨资产风险模型做仓位分配或风控，可参考文中的集成因子框架——核心结论&quot;美股+公司债因子即可覆盖多数资产&quot;是一个实用的简化原则。已有因子体系可据此优先关注这两类因子的跨资产信号质量和相关性。</p>"}, {"key": "WGB5XPIT", "title": "Exploiting Myopia: The Returns to Long-Term Investing", "year": "2025", "authors": "Kalash Jain, Dian Jiao", "tags": ["Institutional Investors", "Long-term Investing", "Mispricing", "Myopia"], "venue": "", "abstract": "Institutional investors face short-term performance pressures that constrain their ability to hold positions through temporary underperformance. We show that this myopia generates systematic mispricing in the cross-section of stocks. We introduce Horizon, a ﬁrm-level measure of active institutional holding periods, and document that long-Horizon ﬁrms earn signiﬁcantly higher future returns. Consistent with a myopia-based mechanism, the Horizon premium is most pronounced among stocks that are structurally harder for short-term managers to hold and the premium attenuates when mechanically patient passive ownership is high. Exploiting a 2004 SEC regulatory change that increased interim monitoring of mutual fund managers, we ﬁnd that heightened short-term pressure reduced Horizon, increased turnover, and ampliﬁed the Horizon return premium for treated ﬁrms. Overall, our results indicate that institutional myopia in delegated asset management is an economically important determinant of expected returns.", "url": "https://papers.ssrn.com/abstract=5464715", "date_added": "2026-06-07", "summarized": true, "rating": "★4.0", "starred": false, "repro": "待复现", "summary_html": "<h1>Exploiting Myopia: The Returns to Long-Term Investing</h1>\n<p>&gt; Zotero Key: <code>WGB5XPIT</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Kalash Jain, Dian Jiao (Columbia Business School)</li>\n<li><strong>年份</strong>: 2025</li>\n<li><strong>出处</strong>: SSRN</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.5464715</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=5464715</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/TLIISGMZ/Jain和Jiao - 2025 - Exploiting Myopia The Returns to Long-Term Investing.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：机构投资者面临短期业绩评估压力，难以持有短期表现不佳的仓位——机构短视是否在股票横截面上产生系统性的风险溢价？</li>\n<li><strong>方法</strong>：提出 Horizon 指标（机构主动持股加权平均连续持有季度数），用 Fama-MacBeth 回归和 2004 年 SEC 季度披露规则冲击的 DiD 设计检验机制，在美股 1983—2024 年上分析。</li>\n<li><strong>结论</strong>：长 Horizon 公司未来收益显著更高（月均 13.5 bps/$\\sigma$，$t=4.45$），DiD 证明机制是机构短视导致的错误定价而非风险补偿；效应在高 IVol、近期亏损、年轻经理持仓的公司中更强。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>机构投资者面临短期业绩评估压力（赎回风险、职业关注、基准比较），难以持有短期表现不佳的仓位。论文提出核心问题：<strong>机构短视（myopia）是否在股票横截面上产生系统性的风险溢价？</strong> 已有文献多从基金层面研究投资者持有期与业绩的关系，本文首次从公司层面证明股东基础的持有期构成本身即被定价，并提出委托代理摩擦（而非信息优势）是主要驱动机制。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 美国普通股</li>\n<li><strong>频率</strong>: 月度（Fama-MacBeth）/ 季度（DiD）</li>\n<li><strong>样本区间</strong>: 1983 年 9 月 – 2024 年 12 月</li>\n<li><strong>数据来源</strong>: SEC 13F 持仓（机构持股）、CRSP（股价/收益）、Compustat（财务数据）、I/B/E/S（盈利指引）、Bushee (2001) 分类（区分主动/被动/准指数投资者）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[13F 季度持仓数据] --&gt; B[剔除指数/准指数投资者&lt;br/&gt;Bushee 2001 分类]\n  B --&gt; C[计算每只股票每位主动投资者的&lt;br/&gt;连续持有季度数]\n  C --&gt; D[按持股比例加权平均&lt;br/&gt;得到 Horizon]\n  D --&gt; E[取自然对数 Ln Horizon]\n  E --&gt; F[Fama-MacBeth 横截面回归&lt;br/&gt;控制 BTM/Size/动量/反转/盈利/IVol/流动性]\n  F --&gt; G[预期收益 ↑ 与 Horizon 正相关]\n\n  H[2004 SEC 季度披露规定] --&gt; I[DiD: 受冲击基金持仓占比&lt;br/&gt;高于中位数的公司 = Treat 组]\n  I --&gt; J[H3a: Treat 公司 Horizon ↓]\n  I --&gt; K[H3b: Treat 公司换手率 ↑&lt;br/&gt;高 Horizon 公司缓冲]\n  I --&gt; L[H3c: Treat 公司 Horizon-收益敏感性 ↑]\n\n  E --&gt; M[横截面交互项检验]\n  M --&gt; N[H2a: × IVol ↑ 效应更强]\n  M --&gt; O[H2b: × Ret−1 ↓ 效应更强]\n  M --&gt; P[H2c: × Age Mgr ↓ 效应更强]\n\n  E --&gt; Q[时间序列: 3×2 排序&lt;br/&gt;构建 Horizon 多空因子]\n  Q --&gt; R[计算 FF5+MOM+STR+IVol+Age 因子 alpha]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>输入</strong>：SEC 13F 季度持仓数据，按 Bushee (2001) 分类剔除指数基金和准指数基金，仅保留主动机构投资者。</p>\n<p>2. <strong>Horizon 构造</strong>：对每只股票 $i$ 在每个季度 $t$，</p>\n<p>   $$Horizon_{i,t} = \\sum_{j \\in \\text{Active}} w_{i,j,t} \\times \\text{Duration}_{i,j,t}$$</p>\n<p>   其中 $w_{i,j,t}$ 是投资者 $j$ 持有股票 $i$ 的市值占该股票所有主动机构持股总市值的比例，$\\text{Duration}_{i,j,t}$ 是投资者 $j$ 连续持有该股票的季度数。最终取自然对数 $\\ln(Horizon)$，使分布接近正态（见图 1）。</p>\n<p>3. <strong>Fama-MacBeth 回归</strong>：每月横截面回归，因变量为未来 1/2/3/6/12 个月收益，核心自变量为 $\\ln(Horizon)$，控制变量：$\\ln(BTM)$、Size、短期反转 $Ret_{-1}$、动量 $Ret_{-12,-2}$、盈利能力、IVol、公司年龄、Amihud 非流动性。标准误用 Newey-West（3 阶滞后）。</p>\n<p>4. <strong>横截面检验</strong>：在回归中加入 $\\ln(Horizon)$ 与 IVol / $Ret_{-1}$ / $\\ln(Age(Mgr))$ 的交互项，检验短视约束更强的子样本中 Horizon 溢价是否更大。</p>\n<p>5. <strong>时间序列检验</strong>：3×2 双重排序（Horizon × Size / IVol / $Ret_{-1}$ / Age(Mgr)），构建多空投资组合，对 FF5 + 动量 + 短期反转 + IVol + 经理年龄进行 spanning regression 求 alpha。</p>\n<p>6. <strong>DiD 机制检验</strong>：利用 2004 年 5 月 SEC 要求共同基金从半年度改为季度披露的规定。受冲击基金（事前未自愿季度披露的基金）持股占比高于中位数的公司定义为 Treat 组。前后窗口：2001Q2–2004Q1（前）vs 2004Q3–2007Q2（后）。验证三条假设：Horizon 下降、换手率上升、收益敏感性增强。</p>\n<p>7. <strong>输出</strong>：Horizon 因子多空组合收益，以及按 IVol/$Ret_{-1}$/Age(Mgr) 子样本构建的增强版多空组合收益。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>主回归</strong>：$\\ln(Horizon)$ 月度收益系数 0.152（t=4.45），1σ 提升对应月均 13.5 bps / 年化 1.62%。预测力在 2/3/6/12 个月持续递增（年化系数 1.402，t=5.95），且冻结 Horizon 后 t 值维持 &gt;2 近五年。</li>\n<li><strong>横截面</strong>：高 IVol（交互项 β=3.862, t=4.00）、低近期收益（交互项 β=-0.013, t=-4.78）、年轻经理（交互项 β=-0.127, 全控制下不显著但方向一致）子样本中溢价更强。</li>\n<li><strong>时间序列 alpha</strong>：Horizon 多空因子月均 26.1 bps（Sharpe 0.320），FF5+MOM+STR+IVol+Age 模型 alpha 为 16.8 bps（t=2.56）。子样本版本 alpha 更高：IVol×Horizon 32.0 bps，$Ret_{-1}$×Horizon 25.5 bps，Age(Mgr)×Horizon 17.3 bps。</li>\n<li><strong>DiD</strong>：受冲击公司 Horizon 显著下降（-0.087, t=-2.62），换手率上升（三重交互 -0.543, t=-2.71），收益-Horizon 敏感性增强（三重交互 0.302，加控制后减弱至不显著）。</li>\n<li><strong>附加检验</strong>：高 Horizon 公司发布更多/更精确/更长远的盈利指引；被动持股比例高时溢价减弱；非流动性高时溢价增强；&quot;逆类型&quot;（短视经理长期持有）信号更强。</li>\n</ul>\n<h2>创新点</h2>\n<p>1. 首次提出公司层面的机构持有期度量 Horizon（基于 13F 的 revealed preferences，不含经理特征假设），比基金持有期（Cremers and Pareek 2016）和持仓久期（Lan et al. 2023）更直接反映公司股东基础的短视程度。</p>\n<p>2. 用 DiD + SEC 2004 披露冲击<strong>因果识别</strong>短视机制，区别于以往仅依赖横截面相关的文献。</p>\n<p>3. 从委托代理摩擦（而非信息优势）角度解释长期持有的超额收益，填补了 Koijen-Yogo 需求系统资产定价框架中&quot;投资者异质性如何产生定价效应&quot;的经验证据。</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>内生性残留</strong>：DiD 中基金是否自愿季度披露是内生选择，处理组/控制组划分依赖该选择，可能遗漏变量。作者承认并做了平行趋势检验、安慰剂检验（1997 年），但无法完全排除。</li>\n<li><strong>Horizon 构造依赖 Bushee 分类</strong>：主动/被动/准指数分类精度影响度量质量，且 13F 仅报告多头仓位，忽略空头和衍生品。</li>\n<li><strong>交易成本未纳入</strong>：多空组合换手率和实际可交易性未充分讨论，尤其是高 IVol、低流动性子样本中交易成本更高。</li>\n<li><strong>与已知因子的相关性</strong>：Horizon 与 BTM 相关系数高达 0.55，虽然回归中控制了 BTM，但经济含义上可能与价值因子有较大重叠（spanning regression 中 alpha 的 Sharpe 仅 0.16）。</li>\n<li><strong>2024 年样本结束</strong>：论文时间序列截至 2024 年底，但近年来被动投资占比大幅上升（Chinco and Sammon 2024），Horizon 溢价的结构性变化值得关注。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: ★★★★☆ 13F 公开可得（Wharton WRDS / 直接 SEC），CRSP/Compustat 需订阅，但可替代。</li>\n<li><strong>方法清晰度</strong>: ★★★★★ 构造方法描述详细，附录有完整变量定义，Bushee 分类代码公开。</li>\n<li><strong>计算成本</strong>: ★★★☆☆ 需处理横跨 40+ 年的 13F 季度数据（逐季匹配机构-股票对），数据清洗工作量大但不需 GPU。</li>\n<li><strong>综合评分</strong>: ★4.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>高优先级复现。Horizon 指标直观且能从 13F 构建，方法透明度高。关键风险点：（1）13F 数据清洗和 Bushee 分类匹配是主要工程瓶颈；（2）A 股市场 13F 等价物为季报机构持仓，可类比构建但机构类型分类体系不同（公募/私募/社保/外资）；（3）建议最小可行版本：先基于公募季报重仓股数据构建简化 Horizon，验证 Fama-MacBeth 预测力，再扩展到全机构。</p>"}, {"key": "NKQMFQVF", "title": "Episodic Factor Pricing", "year": "2025", "authors": "Sophia Zhengzi Li, Peixuan Yuan, Guofu Zhou", "tags": ["SSRN", "Episodic Factor Pricing", "Guofu Zhou", "Peixuan Yuan", "Sophia Zhengzi Li"], "venue": "", "abstract": "Conventional factor models assume that risk factors are priced consistently over time. We challenge this view by showing that factor pricing power switches between active and inactive regimes. We develop a real-time method to identify ex ante whether a factor or factor model is \"pricing on\" or \"pricing off.\" We find that factor premia are concentrated almost entirely in active states and are largely absent otherwise. For instance, the Fama-French models are active in only about half of the sample. Conditioning on these states delivers economically and statistically significant out-of-sample performance gains. These findings establish that factor pricing is episodic rather than persistent.", "url": "https://papers.ssrn.com/abstract=6083826", "date_added": "2026-07-17", "summarized": true, "rating": "★4.0", "starred": false, "repro": "—", "summary_html": "<h1>Episodic Factor Pricing</h1>\n<p>&gt; Zotero Key: <code>NKQMFQVF</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>：Sophia Zhengzi Li (Rutgers Business School), Peixuan Yuan (香港浸会大学商学院), Guofu Zhou (Washington University in St. Louis, Olin)</li>\n<li><strong>年份</strong>：2025（本版 2026-03-09）</li>\n<li><strong>出处</strong>：SSRN Working Paper</li>\n<li><strong>DOI</strong>：10.2139/ssrn.6083826</li>\n<li><strong>链接</strong>：https://papers.ssrn.com/abstract=6083826</li>\n<li><strong>本地 PDF</strong>：<code>~/Developer/Zotero/storage/CGWEUS5F/Li 等 - 2025 - Episodic Factor Pricing.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：主流因子模型隐含假设因子<strong>始终</strong>被定价（风险溢价恒定）。但如果因子的定价能力是断续的——有时&quot;开机&quot;有时&quot;关机&quot;——那么无条件估计会把两种状态混在一起，既低估了活跃期的溢价，也让投资者在无效期白白承担暴露。能不能<strong>事前实时</strong>判断某因子此刻在不在定价？</li>\n<li><strong>方法</strong>：不预测因子收益，而是直接对&quot;定价能力状态&quot;建模。用 Fama–MacBeth 截面回归生成基于特征的样本外个股收益预测，定义<strong>截面预测误差差</strong> SED（相对&quot;零去均值收益&quot;基准的 MSE 改善）；再用 LASSO、以 28 个变量（16 个 Welch–Goyal 宏观变量 + 5 个 Baker–Wurgler 情绪指标 + 7 个不同期限的历史 SED 均值）实时预测下月 SED，$\\widehat{SED}&gt;0$ 判为 pricing-on，否则 pricing-off。</li>\n<li><strong>结论</strong>：FF3 只有约 <strong>50%</strong> 的月份（588 个月中 295 个）处于 pricing-on，FF5 为 53%。定价能力几乎完全集中在 on 状态：FF3 的多空组合 on 时月均 1.21%（t=4.12）、夏普 0.95，off 时 −0.35%（t=−1.46）、夏普 −0.28。\\$1 起始，静态策略终值 \\$7.31，on/off 择时策略 <strong>\\$110.06</strong>（FF5：\\$23.28 → \\$229.02）。九因子均值-方差组合样本外夏普 1.18 → <strong>1.56</strong>（+32%）；扣除交易成本后（保留比例 $\\eta=0.1$）1.09 → <strong>1.10</strong> 仍显著优于 0.94。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>经验资产定价的标准做法是假定预设因子的风险溢价在时间上恒定（Sharpe/Lintner/FF3/FF5/HXZ/SY/DHS 全部如此）。已有的放松方式是让暴露或风险价格随公司特征或经济条件<strong>连续</strong>变化（Ferson–Harvey、Lettau–Ludvigson、Kelly–Pruitt–Su 等）。本文换了个角度：不建模连续时变，而问<strong>定价能力本身是否是间歇性的（episodic）</strong>，且能否用丰富的实时信息集事前识别。</p>\n<p>灵感来自 Farmer–Schmidt–Timmermann (2023) 关于市场收益可预测性存在&quot;短暂窗口&quot;的发现，但本文有三点不同：（i）研究<strong>截面</strong>定价能力而非时序市场收益；（ii）不只用滞后预测变量，而是同时纳入市场层面与因子特有信息；（iii）用正则化（LASSO）抑制过拟合。作者也明确回应了 Cakici et al. (2024) 对 FST 原实现的批评——那篇发现 FST 的样本外表现在修正后减弱，因此本文改用更丰富的信号集而非单纯的时间趋势。</p>\n<p>关键的证伪性检验：这个状态信号会不会只是市场波动率的代理？作者把样本按已实现市场波动分三档，发现 <strong>on 月份在高波动和低波动子样本里都给出高夏普，off 月份都不给</strong> —— 说明定价状态携带了波动率之外的信息，且优于 Moreira–Muir (2017) 的波动率择时（后者对 SMB 完全无效）。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>：CRSP 月频美股（NYSE/AMEX/Nasdaq 普通股，美国注册公司）</li>\n<li><strong>频率</strong>：月频（波动率相关量用日频计算）</li>\n<li><strong>样本区间</strong>：1970-01 至 2023-12；前 5 年为初始样本内窗口，样本外评估期 <strong>1975-01 至 2023-12</strong>（588 个月）。多因子组合的样本外期为 1980-01 起（首个 60 月估计窗），含成本分析止于 2020-12</li>\n<li><strong>数据来源</strong>：CRSP 月度个股文件；公司特征取自 Chen–Zimmermann (2022) 的开放数据集；九个因子（MKT、SMB、HML、RMW、CMA、UMD、ROE、IA、BAB）从各作者网站下载；宏观变量 Welch–Goyal (2008)；情绪指标 Baker–Wurgler (2006)</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[CRSP 月频个股收益 + Chen-Zimmermann 公司特征] --&gt; B[特征横截面排序标准化&lt;br/&gt;映射到 -0.5 到 +0.5 区间]\n  B --&gt; C[Fama-MacBeth 单变量截面回归&lt;br/&gt;市值加权]\n  C --&gt; D[系数跨期平均 → 样本外收益预测 r_hat]\n  D --&gt; E[计算截面预测误差差 SED&lt;br/&gt;相对零去均值收益基准的 MSE 改善]\n  E --&gt; F[按上月市场波动归一化 SED]\n  F --&gt; G[LASSO 扩展窗回归&lt;br/&gt;28 个预测变量 · AIC 选 lambda]\n  H[16 个 Welch-Goyal 宏观变量] --&gt; G\n  I[5 个 Baker-Wurgler 情绪指标] --&gt; G\n  J[7 个期限的历史 SED 均值&lt;br/&gt;1/3/6/9/12/18/24 月] --&gt; G\n  G --&gt; K{预测的下月 SED 是否大于 0}\n  K --&gt;|是| L[pricing-on 状态 I=1]\n  K --&gt;|否| M[pricing-off 状态 I=0]\n  L --&gt; N[持有模型多空价差组合]\n  M --&gt; O[切换到波动率匹配的市场组合]\n  L --&gt; P[MVE 多因子组合 SMP&lt;br/&gt;off 因子只保留 eta 比例仓位]\n  M --&gt; P\n  P --&gt; Q[含成本优化 → 净夏普 / 评价比]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>输入与特征标准化</strong>：对每个公司特征 $C_j$，逐月做横截面排序，除以非缺失样本数并减 0.5，映射到 $[-0.5,+0.5]$（沿用 Kelly–Pruitt–Su、Kozak–Nagel–Santosh 的做法），只保留序数信息、对异常值稳健。</p>\n<p>2. <strong>Fama–MacBeth 样本外收益预测</strong>：逐月估计单变量截面回归</p>\n<p>   $$r_{i,t}=a_{j,t}+b_{j,t}C_{j,i,t-1}+\\varepsilon_{i,t}$$</p>\n<p>   用上月末市值作回归权重以提升斜率估计效率。预测时用<strong>历史系数的时序均值</strong>（而非当期系数）：</p>\n<p>   $$\\hat r_{j,i,t+1|t}=\\bar a_{j,t}+\\bar b_{j,t}C_{j,i,t},\\qquad \\bar b_{j,t}=\\frac1M\\sum_{m=0}^{M-1}\\hat b_{j,t-m}$$</p>\n<p>   平滑系数可稳定估计、降低过拟合（Han–He–Rapach–Zhou 2024）。整个流程严格只用 $t$ 时刻可得信息，无前视。</p>\n<p>3. <strong>定义 SED（核心度量）</strong>：截面均方预测误差差</p>\n<p>   $$SED_{j,t}=\\frac{1}{N_t}\\sum_{i=1}^{N_t}\\Big[(dr_{i,t})^2-(dr_{i,t}-\\widehat{dr}_{j,i,t})^2\\Big]$$</p>\n<p>   其中 $dr_{i,t}=r_{i,t}-\\bar r_t$ 是<strong>去均值</strong>后的个股收益，基准预测是&quot;全部为零&quot;。去掉横截面共同成分是关键——否则市场层面的变动会污染截面可预测性的择时。$SED&gt;0$ 表示特征预测优于基准。</p>\n<p>4. <strong>实时预测 SED（LASSO）</strong>：先按上月市场波动归一化 $SED_{j,t}/\\sigma_{M,t-1}$ 以稳定回归，再估计</p>\n<p>   $$SED_{j,t}=\\gamma_{0,j,t}+\\sum_z \\gamma_{z,j,t}Z_{z,t-1}+\\epsilon_{j,t}$$</p>\n<p>   $Z$ 共 28 个：16 个 Welch–Goyal 宏观变量（股息价格比、期限利差、违约利差、通胀、净股本扩张等）、5 个 Baker–Wurgler 情绪分量（IPO 数量与首日收益、封闭式基金折价、换手率、股息溢价，均滞后处理避免前视）、7 个不同回看期限的历史 SED 均值。用<strong>扩展窗</strong> LASSO，$\\lambda$ 由 AIC 选择。定义 pricing-on 为 $\\widehat{SED}_{j,t+1}&gt;0$。</p>\n<p>5. <strong>模型层评估</strong>：把某模型的全部特征一起放进截面回归</p>\n<p>   $$r_{i,t}=a_{model,t}+\\sum_{k\\in model}b_{k,t}C_{k,i,t-1}+\\varepsilon_{i,t}$$</p>\n<p>   （FF3 用 CAPM beta、市值、账面市值比；FF5 再加营业利润率与投资率）。评估指标三类：截面样本外 $R^2_{OS}$、Lewellen (2015) 的截面 Mincer–Zarnowitz 斜率 $\\delta$（$\\delta=1$ 为无偏，$\\delta&lt;1$ 表示预测夸大了截面离散度）、以及按预测收益排序做多头十分位/空头十分位的价差组合收益与夏普。</p>\n<p>6. <strong>择时策略</strong>：pricing-on 月持有模型价差组合，pricing-off 月切换到<strong>波动率匹配的市场组合</strong>——市场权重 $c_t$ 事前设定，使 $c_t\\cdot Market_t$ 的波动等于价差组合波动（60 月滚动窗估计），从而保持风险水平可比。</p>\n<p>7. <strong>多因子组合（MVE）</strong>：在因子空间做均值-方差优化</p>\n<p>   $$\\max_{\\boldsymbol\\omega\\ge0}\\ \\boldsymbol\\omega^\\top\\hat{\\boldsymbol\\mu}-\\frac{\\gamma}{2}\\boldsymbol\\omega^\\top\\hat{\\boldsymbol\\Sigma}\\boldsymbol\\omega,\\qquad \\gamma=5$$</p>\n<p>   非负约束用于抑制估计误差（沿用 DeMiguel–Martín-utrera–Uppal 2024）。扩展窗，首个估计窗 1975-01 至 1979-12。<strong>状态管理组合 SMP</strong> 的收益为</p>\n<p>   $$r_{SMP,t}=\\boldsymbol\\omega_{t|t-1}^\\top\\,\\mathrm{diag}\\!\\big(\\eta\\mathbf e+(1-\\eta)\\mathbf I_{t|t-1}\\big)\\mathbf R_t$$</p>\n<p>   即预测为 off 的因子只保留 $\\eta$ 比例仓位、清掉 $1-\\eta$。市场因子始终不做状态管理（识别方法针对截面定价能力，市场择时是另一类问题）。</p>\n<p>8. <strong>含成本版本</strong>：最大化净成本效用</p>\n<p>   $$\\max_{\\boldsymbol\\omega\\ge0}\\ \\boldsymbol\\omega^\\top\\hat{\\boldsymbol\\mu}-\\widehat{TC}(\\boldsymbol\\omega)-\\frac{\\gamma}{2}\\boldsymbol\\omega^\\top\\hat{\\boldsymbol\\Sigma}\\boldsymbol\\omega$$</p>\n<p>   成本先在 $K$ 个因子组合间<strong>净额轧差</strong>再在个股层面收费：$\\widehat{TC}(\\boldsymbol\\omega)=\\frac{1}{T-1}\\sum_t\\|\\boldsymbol\\Lambda_t\\Delta\\mathbf W_{t+1}(\\boldsymbol\\omega)\\|_1$，个股成本参数 $\\kappa_{i,t}$ 取 Abdi–Ranaldo (2017) 两日修正买卖价差的一半。另构造 $SMP^+$：把 MP 与 SMP 当两个 sleeve 再做一次 MVE 组合（等效同时交易 17 个因子组合），进一步利用交易分散化。</p>\n<p>9. <strong>条件 SDF</strong>：假设因子 $k$ 的风险价格是其定价状态的仿射函数，</p>\n<p>   $$M^I_{t+1}=1-\\sum_{k=1}^K(\\alpha_k+\\beta_k\\tilde I_{k,t+1|t})\\tilde r_{k,t+1}$$</p>\n<p>   为避免估计 $K(K+1)/2$ 个协方差，采用忽略跨因子相关的简化形式</p>\n<p>   $$E_t(r_{k,t+1})=(\\alpha_k+\\beta_k\\tilde I_{k,t+1|t})\\mathrm{var}_t(r_{k,t+1})$$</p>\n<p>   于是条件风险-收益权衡 $E_t(r_k)/\\mathrm{var}_t(r_k)=\\alpha_k+\\beta_k\\tilde I_{k,t+1|t}$ 可直接检验。</p>\n<h2>核心结论与关键结果</h2>\n<p><strong>模型层（Table I，1975–2023，588 个月）</strong></p>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th></th><th>N</th><th>$R^2_{OS}$</th><th>$\\hat\\delta$</th><th>多空月均</th><th>夏普</th><th>终值(\\$1)</th></tr>\n<tr><td>FF3 全样本</td><td>588</td><td>0.00 (0.02)</td><td>0.42</td><td>0.43% (2.25)</td><td>0.34</td><td>7.31</td></tr>\n<tr><td>FF3 pricing-on</td><td>295</td><td>0.06 (2.83)</td><td>1.59</td><td><strong>1.21%</strong> (4.12)</td><td><strong>0.95</strong></td><td><strong>110.06</strong></td></tr>\n<tr><td>FF3 pricing-off</td><td>293</td><td>−0.06 (−2.85)</td><td>−0.76</td><td>−0.35% (−1.46)</td><td>−0.28</td><td>—</td></tr>\n<tr><td>FF5 全样本</td><td>588</td><td>0.02 (1.22)</td><td>0.79</td><td>0.63% (3.09)</td><td>0.50</td><td>23.28</td></tr>\n<tr><td>FF5 pricing-on</td><td>309</td><td>0.10 (3.81)</td><td>1.63</td><td><strong>1.36%</strong> (4.87)</td><td><strong>1.06</strong></td><td><strong>229.02</strong></td></tr>\n<tr><td>FF5 pricing-off</td><td>279</td><td>−0.07 (−2.96)</td><td>−0.14</td><td>−0.18% (−0.68)</td><td>−0.15</td><td>—</td></tr>\n</table></div>\n<p>FF3 只有 50.2% 的月份在定价，FF5 为 52.6%。全样本下 FF3 的 $\\hat\\delta=0.42$ 说明预测严重高估截面离散度；一旦条件在 on 状态，$\\hat\\delta$ 升至 1.59（反而略微低估）。</p>\n<p><strong>单因子层（Table IV，八个因子）</strong>：full-sample vs on vs off 的月均收益（%）</p>\n<ul>\n<li>SMB：0.23 → <strong>0.73 (t=3.66)</strong> vs −0.21 (t=−1.31)，评价比 0.89</li>\n<li>HML：0.25 → <strong>0.60 (3.94)</strong> vs −0.29 (−1.10)，评价比 0.64</li>\n<li>RMW：0.35 → <strong>0.51 (5.18)</strong> vs 0.04，UMD：0.52 → <strong>0.76 (2.81)</strong> vs 0.21</li>\n<li>ROE：0.52 → <strong>0.64 (6.37)</strong> vs 0.07，BAB：0.87 → <strong>1.43 (6.18)</strong> vs 0.17，评价比 1.08（最高）</li>\n<li>这直接调和了 size 溢价&quot;无条件很弱&quot;的老问题：SMB 的溢价全部集中在 on 期。</li>\n</ul>\n<p><strong>不是波动率的代理（Table IV Panel B/C）</strong>：低波动子样本和高波动子样本里，on 月份都给出经济与统计上显著的夏普，off 月份都接近零或为负。BAB 在低波动子样本的评价比 1.06、SMB 在高波动子样本 1.04，普遍<strong>超过</strong> Moreira–Muir (2017) 波动率择时的对应值（后者对 SMB 完全无改善）。</p>\n<p><strong>多因子组合（Table VI，1980–2023）</strong>：MP（忽略状态）vs SMP（利用状态）夏普</p>\n<ul>\n<li>FF3：0.50 → <strong>0.88</strong>（+76%，p=0.00）</li>\n<li>FF5+UMD：1.06 → <strong>1.31</strong>（+23.6%）</li>\n<li>九因子：1.18 → <strong>1.56</strong>（+32%），评价比 1.01</li>\n<li>2000 年后子样本：九因子 0.80 → <strong>1.10</strong>，全部设定改善显著</li>\n</ul>\n<p><strong>含成本（Table VII，1980–2020，九因子）</strong>：MP 净夏普 0.94（成本吃掉毛收益的 24%）。SMP 在 $\\eta=0$ 时净夏普 1.02（成本占毛收益 40%，换手过高）；提高保留比例可降换手，$\\eta=0.5$ 时净夏普 1.06 且 p&lt;0.01。$SMP^+$（17 个因子组合联合交易）在 $\\eta=0.1$ 时净夏普 <strong>1.10</strong>，成本降至 32%，评价比 0.57 为最优。</p>\n<p><strong>状态的驱动因素（Table V）</strong>：LASSO 选出的信号有清晰经济含义——SMB 的定价状态强烈<strong>顺周期</strong>（&quot;股票收益&quot;系数 +4.21，&quot;IPO 数量&quot;这个投机情绪代理 −2.35，$R^2=17.15\\%$，八个因子中最高）；UMD 与 ROE 则<strong>逆周期</strong>（对股票收益分别 −1.11 和 −1.21，UMD 对违约利差 −1.82）；CMA &amp; IA 顺周期（股票收益 +0.95、净股本扩张 +0.92、通胀 −0.69）。</p>\n<h2>创新点</h2>\n<p>1. <strong>把&quot;因子是否被定价&quot;本身当作可预测的状态变量</strong>，而非建模因子收益或连续时变的风险价格。这是与整个条件资产定价文献的分叉点。</p>\n<p>2. <strong>SED 这个度量设计得很巧</strong>：用截面 MSE 相对&quot;零去均值收益&quot;基准的改善作为定价能力的直接、透明代理，且去均值这一步把市场层面变动从截面信号中剥离干净。</p>\n<p>3. <strong>实时、纯样本外的识别流程</strong>：Fama–MacBeth 系数平滑 + LASSO 正则化 + 扩展窗 + AIC 选参，且明确回应了 Cakici et al. (2024) 对前作实现的批评。</p>\n<p>4. <strong>条件 SDF 的 on/off 仿射设定</strong>：把风险价格写成状态指示变量的仿射函数，用一个二元变量就显著扩张了投资机会集，形式简洁可估。</p>\n<p>5. <strong>含成本的状态管理设计</strong>：$\\eta$ 保留比例参数把&quot;择时收益 vs 换手成本&quot;的权衡显式参数化；$SMP^+$ 用管理/不管理双 sleeve 组合进一步利用跨因子交易轧差。</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>&quot;pricing-on 只有 50%&quot;这个数字本身可疑</strong>。作者自己承认这个频率&quot;低于对标准模型的预期&quot;，归因于&quot;实时预测的困难&quot;。换个说法：这个分类器的信息含量可能不高，它把样本切成两半，然后事后发现其中一半表现好——这与&quot;存在真实的间歇性定价机制&quot;在观测上难以区分。off 状态月份 FF3 的 $R^2_{OS}$ 是 $-0.06\\%$，绝对量级极小。</li>\n<li><strong>截面 $R^2_{OS}$ 的量级极其微小</strong>（on 状态 0.06%–0.10%）。作者用脚注 12 辩护说 Gu–Kelly–Xiu 的随机森林 panel $R^2$ 0.33% 对应截面 $R^2$ 仅 0.01%，所以 0.06% 是&quot;经济上有意义的&quot;。这个辩护成立，但也提醒：全部经济收益都来自一个统计上极其微弱的信号的放大。</li>\n<li><strong>28 个预测变量 + LASSO 仍有相当的规格自由度</strong>：SED 是否归一化、7 个历史 SED 期限的选取、AIC 而非交叉验证选 $\\lambda$、pricing-on 阈值恰好取 0——这些选择虽都有理由，组合起来的研究者自由度不容忽视。作者报告了&quot;SED 不归一化时结果稳健&quot;，但其余维度未见敏感性分析。</li>\n<li><strong>交易成本吃掉毛收益的 24%–40%</strong>，是相当重的。$\\eta=0$ 的纯择时版本 p 值 0.21（不显著），必须调到 $\\eta\\ge0.3$ 才在 5% 水平显著——也就是说<strong>完全清仓 off 因子反而不划算</strong>，收益主要来自适度减仓。这削弱了&quot;pricing-off 时因子完全无效&quot;的强叙事。</li>\n<li><strong>含成本分析止于 2020-12</strong>，因为要用 DeMiguel et al. (2024) 提供的个股成本参数与因子权重，这限制了最新样本的验证。</li>\n<li>成本模型只含买卖价差（Abdi–Ranaldo 的一半），<strong>不含冲击成本与容量约束</strong>。九因子 MVE 组合在个股层面的实际换手很可能远超价差成本所能覆盖的范围。</li>\n<li>结论全部基于<strong>美股截面</strong>。作者提到框架&quot;可推广到债券、外汇、期权&quot;，但未做任何跨市场验证。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>：中等偏好。公司特征来自 <strong>Chen–Zimmermann 开放数据集</strong>（公开免费），因子来自 Ken French / Hou-Xue-Zhang / AQR 网站（全部公开），宏观变量 Welch–Goyal 和情绪指标 Baker–Wurgler 均公开。唯一的硬门槛是 <strong>CRSP 月度个股文件</strong>（付费）。若换成 A 股或其他可得市场，特征需自建但方法完全可移植。含成本部分依赖 DeMiguel et al. (2024) 的个股成本参数，需自行替代。</li>\n<li><strong>方法清晰度</strong>：高。SED 定义、FM 回归与系数平滑、LASSO 设定（变量清单、AIC 选参、扩展窗）、$R^2_{OS}$/MZ 斜率/评价比的计算式、MVE 与 SMP 的优化问题、成本函数都写得完整。少数细节需自行决定（LASSO 标准化的具体实现、扩展窗最短长度、特征缺失值处理），但都不影响主流程。</li>\n<li><strong>计算成本</strong>：中等。588 个月 × 每月一次截面回归 + 每月一次扩展窗 LASSO，规模不大；瓶颈在个股面板的数据准备与特征构造，而非模型训练。单机可跑，无需 GPU。</li>\n<li><strong>综合评分</strong>：★4.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>这篇最有价值的不是它的具体结论，而是 <strong>SED 这个&quot;择时可预测性本身&quot;的框架</strong>——它可以从美股截面剥离出来，套到任何&quot;有一批信号、想知道此刻该不该信&quot;的场景。</p>\n<p><strong>最小可行版本</strong>：</p>\n<p>1. 先只复现 <strong>SED 的计算与状态分类</strong>，不做组合。挑 2–3 个自己已有的因子/信号，逐期算截面预测的 MSE 相对&quot;零预测&quot;基准的改善，画出 SED 时序，看是否呈现明显的簇状/间歇结构。这一步不需要 CRSP，用手上任何有横截面的市场都能做。</p>\n<p>2. 第二步做<strong>朴素版状态预测</strong>：先不上 28 个变量的 LASSO，只用历史 SED 的移动平均（论文 Table V 显示历史 SED 项在多数因子上都是最重要的预测变量之一，SMB 的 $R^2$ 有 17%，主要就靠这些）。如果朴素版就能复现出 on/off 的收益分化，说明效应稳健；如果必须靠 28 变量 LASSO 才出来，就要高度怀疑过拟合。</p>\n<p>3. 第三步再上完整 LASSO 与组合构建。</p>\n<p><strong>关键风险点</strong>：</p>\n<ul>\n<li><strong>前视偏差</strong>。这是全文最脆弱的地方：Baker–Wurgler 情绪指标的发布滞后、公司特征的可得时点（财报特征至少滞后一季度）、扩展窗的边界处理，任何一处漏掉都会让结果失真。复现时应该单独写一个前视检查。</li>\n<li><strong>状态阈值取 0 是硬编码的</strong>。建议自己做阈值敏感性（比如取 SED 预测值的历史分位数而非 0），如果结论对阈值极度敏感，就说明不是稳健的机制。</li>\n<li><strong>成本</strong>。论文自己的结果已经显示纯 on/off 切换（$\\eta=0$）在成本后不显著。复现时务必从一开始就带上成本，否则会得到过于乐观的结论。$\\eta$ 应该当作需要调的参数而非固定值。</li>\n<li><strong>不要指望截面 $R^2$ 好看</strong>。0.06% 就是这类信号的正常量级，评估应该看组合层的夏普与评价比，而不是拟合优度。</li>\n</ul>\n<p><strong>移植思路</strong>：这套 SED 框架不必局限于股票截面因子。对时序类信号（趋势、carry）也可以定义类似的&quot;相对无信息基准的预测误差改善&quot;，用同样的实时状态识别流程判断&quot;此刻该不该开这条信号&quot;。这可能比照搬美股因子择时更有实际价值，也更适合作为增量研究方向。</p>"}, {"key": "HALTK8NC", "title": "Do Dividend-Paying Stocks Outperform Non-dividend Stocks in the Long Run?", "year": "2025", "authors": "Atul Oraon", "tags": ["Dividend Stock", "Dividend Yield", "Financial Investment", "Non-dividend Stock"], "venue": "", "abstract": "This study examines the long-term investment performance of dividend-paying and non-dividend-paying stocks, analyzing the impact of macroeconomic conditions using regression analysis and descriptive statistics. The research explores how key economic variables-GDP growth, inflation, interest rates, and market volatility-influence stock returns across different market phases, including booms, recessions, and recoveries. Regression analysis identifies significant relationships between macroeconomic factors and stock performance, revealing that dividend stocks tend to respond more favorably to economic expansions. Descriptive statistics highlight that dividend-paying stocks generally outperform non-dividend stocks over extended periods, exhibiting higher mean and median returns, greater upside potential, and the compounding benefits of reinvested dividends. Although dividend stocks display relatively higher volatility, their resilience during downturns and strong recovery performance contribute to superior long-term risk-adjusted returns. These findings suggest that dividend stocks provide a more stable and sustainable path to wealth accumulation, making them an attractive choice for investors seeking both stability and growth in varying economic conditions.", "url": "https://papers.ssrn.com/abstract=5267502", "date_added": "2026-06-07", "summarized": true, "rating": "★1.0", "starred": false, "repro": "—", "summary_html": "<h1>Do Dividend-Paying Stocks Outperform Non-Dividend Stocks in the Long Run?</h1>\n<p>&gt; Zotero Key: <code>HALTK8NC</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 不复现</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Atul Oraon (Ranchi University)</li>\n<li><strong>年份</strong>: 2025</li>\n<li><strong>出处</strong>: IJRAR (International Journal of Research and Analytical Reviews), Vol.12 No.1</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.5267502</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=5267502</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/5KDNCECR/Oraon - 2025 - Do Dividend-Paying Stocks Outperform Non-dividend Stocks in the Long Run.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：股息支付股票是否在长期和不同经济周期中优于非股息支付股票？现有研究多集中于发达市场，缺乏对新兴市场（印度）的考察。</li>\n<li><strong>方法</strong>：手工选取约 50 只印度股息支付股和 30 只非股息支付股，用描述性统计对比 3 年/5 年收益，并按经济周期分段回归。</li>\n<li><strong>结论</strong>：声称股息股长期收益更高、衰退期更有韧性，但无任何 t 值/p 值/假设检验，方法停留在描述性统计层面，结论不可靠。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>探讨股息支付股票与非股息支付股票在长期（5 年以上）及不同宏观环境（繁荣、衰退、复苏）中的表现差异。作者声称现有研究多集中于发达市场且时间窗口较短，缺乏对新兴市场（印度）及完整经济周期下股息策略的考察。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 印度股票</li>\n<li><strong>频率</strong>: 年度收益（3 年/5 年窗口）</li>\n<li><strong>样本区间</strong>: 未明确说明，推测截至 2024 年</li>\n<li><strong>数据来源</strong>: 未说明来源，仅列出约 50 只股息支付股和约 30 只非股息支付股的表格</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>方法极简单，仅有描述性统计，画流程图反而冗余。</p>\n<h3>步骤详解</h3>\n<p>1. <strong>样本选取</strong>：从印度股市手工选取约 50 只股息率 &gt;2.5% 的股票和约 30 只股息率接近 0 的股票，未说明选取标准或是否有幸存者偏差控制。</p>\n<p>2. <strong>描述性统计</strong>：分别计算两组股票的 3 年回报和 5 年回报的均值、标准差、偏度和峰度。</p>\n<p>3. <strong>回归分析</strong>（声称但未详细展示）：对宏观变量（GDP 增长、通胀、利率、市场波动率）与股票收益做回归，按经济周期（繁荣/衰退/复苏）分段。</p>\n<p>4. <strong>对比结论</strong>：声称股息支付股在长期中平均收益更高、下行韧性更强。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>声称股息支付股 5 年回报均值更高（具体数值未标准化报告）。</li>\n<li>声称股息支付股在经济扩张期对宏观变量反应更积极，衰退期更有韧性。</li>\n<li>声称股息再投资的复利效应是长期财富积累的关键驱动力。</li>\n</ul>\n<p><strong>注意</strong>：论文未报告任何 t 值、p 值、置信区间或正式的假设检验结果。回归分析的具体设定（因变量、控制变量、标准误处理）均未披露。</p>\n<h2>创新点</h2>\n<p><strong>无实质创新</strong>。论文仅为印度市场股息/非股息股的描述性对比，方法停留在本科毕业论文水平。文献综述部分引用了相关研究（Conover et al. 2016, Fuller and Goldstein 2011 等），但自身的实证贡献几乎为零。</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>方法论严重不足</strong>：无 Fama-MacBeth 回归、无因子模型、无 portfolio sort、无 formal hypothesis testing。</li>\n<li><strong>样本选择偏差</strong>：手工选股，未控制市值、行业、价值等混淆变量，幸存者偏差严重。</li>\n<li><strong>发表渠道质量低</strong>：IJRAR 为低门槛开放获取期刊，非主流金融/经济学期刊。</li>\n<li><strong>作者单一</strong>：独立作者，来自非研究型大学，无合作者，未显示经过严谨同行评议。</li>\n<li><strong>数据不可复现</strong>：原始数据来源和选取标准未披露，无法复现。</li>\n<li><strong>宏观分析空有框架</strong>：声称做了回归但未报告任何回归表或诊断统计量。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: ★★☆☆☆ 数据来源未说明，样本选取标准不透明。</li>\n<li><strong>方法清晰度</strong>: ★☆☆☆☆ 方法描述仅有粗线条框架，核心细节全部缺失。</li>\n<li><strong>计算成本</strong>: ★★★★★ 无需计算成本。</li>\n<li><strong>综合评分</strong>: ★1.0</li>\n</ul>\n<h2>复现备注</h2>\n<p><strong>不复现</strong>。论文学术质量过低，达不到量化研究的复现门槛。方法论停留在描述性统计层面，没有任何可复现的计量框架。即使花时间复现其结论（股息股长期跑赢非股息股），该结论在成熟市场文献中也已是常识（如 Dividend Aristocrats 研究），毫无边际贡献。</p>"}, {"key": "CHK3JDIM", "title": "Dividend Capture Returns and Their Drivers: A Bayesian Analysis of Large-Cap Stocks Over 35 Years", "year": "2025", "authors": "Kaden Ma", "tags": ["Bayesian Regression", "Dividend Capture", "Large-Cap Stocks", "Retail Investors"], "venue": "", "abstract": "We examine the profitability of dividend capture from 1990–2025 using Bayesian linear regression with the No-U-Turn Sampler. In particular, we focus on retail investors, who have an advantage in dividend capture due to (1) small trade sizes that reduce exposure to bid-ask spreads, and (2) the availability of tax-advantaged retirement accounts such as Roth IRAs that improve net returns. Using our models, we find that dividend capture in large-cap stocks has been consistently profitable over the past 35 years, with an average profit of 0.230% per dividend issuance from 1990 to 2025. However, returns decayed within this time period, with average profit per dividend falling to just 0.114% from 2020–2025. Still, with an average of 241.5 unique dividend capture opportunities per year, this strategy retains strong profit potential. Sectors such as Finance, Consumer Discretionary, and Real Estate had significant positive effects on dividend-capture returns, while Basic Materials and Telecommunications underperformed. The only significant non-sector predictor was the standard deviation of historic returns, though its positive effect on returns also diminished over time, from 0.390 between 1990–2000 to 0.118 in 2020–2025.", "url": "https://papers.ssrn.com/abstract=5473306", "date_added": "2026-06-07", "summarized": true, "rating": "★3.0", "starred": false, "repro": "—", "summary_html": "<h1>Dividend Capture Returns and Their Drivers: A Bayesian Analysis of Large-Cap Stocks Over 35 Years</h1>\n<p>&gt; Zotero Key: <code>CHK3JDIM</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Kaden Ma (Haas School of Business, UC Berkeley)</li>\n<li><strong>年份</strong>: 2025</li>\n<li><strong>出处</strong>: SSRN</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.5473306</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=5473306</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/58GYFNWE/Ma - 2025 - Dividend Capture Returns and Their Drivers A Bayesian Analysis of Large-Cap Stocks Over 35 Years.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：股息捕获策略在 1970–80 年代可获利 0.89%/笔，但随着零佣金交易和 HFT 兴起，套利空间是否已被消除</li>\n<li><strong>方法</strong>：用贝叶斯线性回归（NUTS-HMC）分析 1990–2025 年 577 只美国大盘股的股息捕获收益，分四段时期建模</li>\n<li><strong>结论</strong>：全样本平均每笔获利 <strong>0.230%</strong>（99% CI 完全位于零上方），但收益持续衰减——从 1990–2000 的 <strong>0.382%</strong> 降至 2020–2025 的 <strong>0.114%</strong>；波动率是唯一持续显著的连续预测变量</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>股息捕获（dividend capture）是在除息日前买入、除息日开盘卖出的策略。早期研究（Karpoff &amp; Walkling 1990）显示该策略在 1970–80 年代可获利 0.89%/笔。但随着互联网普及、零佣金交易和 HFT 的兴起，套利空间是否已被消除？论文聚焦<strong>散户投资者</strong>视角，利用其小额交易（低买卖价差冲击）和税收优惠账户（Roth IRA）两大优势，系统评估股息捕获在近 35 年的盈利性和驱动因素。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 美国大盘股</li>\n<li><strong>频率</strong>: 每笔股息事件（按股票聚合为横截面）</li>\n<li><strong>样本区间</strong>: 1990 年 – 2025 年 4 月</li>\n<li><strong>数据来源</strong>: Yahoo Finance（股价/股息/成交量）、stockanalysis.com（大盘股列表）、Marketwatch（补充 Beta）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[788 只美国大盘股列表] --&gt; B[剔除股息率 &lt;0.5% 的股票&lt;br/&gt;剔除数据缺失/被收购/股息次数&lt;3]\n  B --&gt; C[577 只股票]\n  C --&gt; D[逐笔提取除息日前后&lt;br/&gt;开盘价/最高/最低/收盘价/成交量]\n  D --&gt; E[计算 CloseOpen 策略收益&lt;br/&gt;前日收盘买入 → 除息日开盘卖出]\n  E --&gt; F[按股票聚合&lt;br/&gt;COMean / COSD / avgVolume / numDivs / Beta]\n  F --&gt; G[贝叶斯线性回归&lt;br/&gt;NUTS-HMC 采样&lt;br/&gt;rstanarm 默认弱信息先验]\n  G --&gt; H1[全样本模型 1990-2025]\n  G --&gt; H2[分段模型&lt;br/&gt;1990-2000 / 2000-2010 / 2010-2020 / 2020-2025]\n  H1 --&gt; I[后验推断：行业 + COSD + numDivs]\n  H2 --&gt; J[收益衰减趋势分析]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>样本筛选</strong>：从 788 只美国大盘股出发，剔除年股息率 &lt;0.5%（192 只）、无数据（15 只）、被收购（2 只）、历史股息次数 &lt;3 的股票，保留 577 只。</p>\n<p>2. <strong>收益计算</strong>：对每笔股息事件，计算 CloseOpen 策略收益 =（除息日开盘价 + 每股股息 - 前日收盘价）/ 前日收盘价。同时计算同期 S&amp;P 500 收益作为基准（Stock-SPCO）。</p>\n<p>3. <strong>聚合处理</strong>：将个股的逐笔股息数据聚合为股票级横截面——COMean（平均捕获收益）、COSD（收益标准差）、avgVolume、numDivs（历史股息总次数）、DivYield、Beta（2025 年 4 月的 5 年月度 Beta）、Sector（11 个行业）。</p>\n<p>4. <strong>贝叶斯线性回归</strong>：</p>\n<p>   $$\\text{COMean}_i = \\beta_0 + \\beta_1 \\text{COSD}_i + \\beta_2 \\text{avgVolume}_i + \\beta_3 \\text{Beta}_i + \\beta_4 \\text{DivYield}_i + \\beta_5 \\text{numDivs}_i + \\sum_{s} \\gamma_s \\cdot \\text{Sector}_{i,s} + \\epsilon_i$$</p>\n<p>   使用 rstanarm 包的 NUTS-HMC 采样器，默认弱信息先验，行业变量用 sum-to-zero contrast 编码。四条 Markov 链，有效样本量 &gt;2,800，所有 $\\hat{R} &lt; 1.01$。</p>\n<p>5. <strong>分段建模</strong>：在四个子时期（互联网早期 1990–2000、算法兴起 2000–2010、HFT 时代 2010–2020、零佣金时代 2020–2025）上分别训练相同的贝叶斯模型，追踪系数和 posterior predictive mean 的时间趋势。</p>\n<p>6. <strong>输出</strong>：各预测变量的后验均值和可信区间；posterior predictive distribution 的均值（mean_PPD）和可信区间，用于判断股息捕获是否整体盈利。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>全样本（1990–2025）</strong>：平均每笔股息捕获收益 0.230%，超越同期 S&amp;P 500 基准 0.184%。mean_PPD 的 99% CI 为 (0.181, 0.281)，完全位于零上方。</li>\n<li><strong>收益衰减</strong>：mean_PPD 从 1990–2000 的 0.382% → 2000–2010 的 0.337% → 2010–2020 的 0.171% → 2020–2025 的 0.114%。</li>\n<li><strong>行业效应（全样本）</strong>：Finance（后验均值 +0.120，99% CI 不含零）、Consumer Discretionary（+0.111，99% 显著）、Real Estate（+0.114，95% 显著）正向超越均值；Basic Materials（-0.238，95% 显著）、Telecommunications（-0.252，99% 显著）负向。</li>\n<li><strong>波动率效应</strong>：COSD（历史收益标准差）是全样本和所有分段模型中唯一持续显著的连续预测变量，后验均值从 1990–2000 的 0.390 衰减到 2020–2025 的 0.118。</li>\n<li><strong>近年新因子</strong>：2020–2025 分段模型中，numDivs（历史股息次数）首次显著（后验均值 -0.012），作为股息关注度的代理变量——频繁派息的股票套利空间更小。</li>\n<li><strong>年平均机会</strong>：241.4 个交易日有股息捕获机会，最佳理论年化收益 1354%（100% 选股准确率），最差年化亏损 85%（0% 准确率）。</li>\n</ul>\n<h2>创新点</h2>\n<p>1. 用贝叶斯框架提供完整后验分布，而非点估计，对参数不确定性给出概率性陈述。</p>\n<p>2. 通过四段时期的分段模型追踪股息捕获盈利性的长期衰减趋势，比传统时间序列更稳健。</p>\n<p>3. 关注散户视角（小额 + IRA 避税），区别于以往研究聚焦机构投资者（如 Henry &amp; Koski 2017）。</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>Beta 的时序错配</strong>：使用 2025 年 4 月的 5 年月度 Beta 作为整个历史的波动率代理，忽略了 Beta 的时变性，早期数据的 Beta 严重后视偏差。</li>\n<li><strong>聚合丢失信息</strong>：将逐笔股息聚合到股票级别，虽然控制了自相关，但丢失了市场环境（牛/熊市）对逐笔收益的影响。</li>\n<li><strong>无交易成本建模</strong>：虽假设零佣金和 IRA 避税，但未考虑买卖价差（bid-ask spread）的实际冲击——这对低价股和高波动股尤其严重。</li>\n<li><strong>生存者偏差</strong>：回溯至 1990 年，样本只包含当前仍存在的大盘股，退市/破产公司被排除，收益可能高估。</li>\n<li><strong>学术严谨性一般</strong>：单一作者、本科生级别论文，未经过顶级期刊同行评议。贝叶斯方法的使用动机（&quot;股票市场具有概率性&quot;）论证较弱。</li>\n<li><strong>策略容量</strong>：每笔 0.114–0.230% 的毛利在扣除实际买卖价差和滑点后可能归零甚至为负，论文未讨论容量约束。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: ★★★★☆ Yahoo Finance 公开免费，大盘股列表公开。</li>\n<li><strong>方法清晰度</strong>: ★★★★☆ 方法描述清晰，代码包（rstanarm）明确，种子号（592198）公开。</li>\n<li><strong>计算成本</strong>: ★★★☆☆ 贝叶斯 MCMC 采样需一定算力但规模可控（577 个观测的线性模型）。</li>\n<li><strong>综合评分</strong>: ★3.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>中等优先级。策略逻辑简单，适合作为因子研究中的另类策略参考。关键风险：（1）加入实际 bid-ask spread 后收益大概率缩水至不显著；（2）A 股股息捕获涉及红利税差异（持股满 1 年免税 vs 不足 1 月 20%），实际净收益需要重新计算；（3）建议最小可行版本：选取沪深 300 成分股，计算 ex-dividend date 前后的 price drop ratio，验证是否存在系统性的 under-drop（即捕获机会）。</p>"}, {"key": "EDZR6P7M", "title": "Defense First: A Multi-Asset Tactical Model for Adaptive Downside Protection", "year": "2025", "authors": "Thomas Carlson", "tags": ["Momentum Strategies", "Portfolio Construction", "Tactical Asset Allocation", "Risk Management", "Adaptive Portfolios", "Crisis Alpha", "Defensive Investing", "Downside Protection", "Macro Hedging", "Multi-Asset Strategy"], "venue": "", "abstract": "In times of economic uncertainty, traditional \"safe haven\" portfolios-those heavily invested in bonds or gold-have often failed to protect investors. This paper introduces Defense First, a simple but powerful strategy that adjusts monthly among four defensive assets: long-term U.S. Treasury bonds (TLT), gold (GLD), broad commodities (DBC), and the U.S. dollar (UUP). It uses a clear ranking system based on past performance to allocate to the strongest performers. When one or more of these defensive assets falter, the position slots U.S. stocks (SPY) as a fallback option. Using data from 1986 to 2025, Defense First delivers better risk-adjusted returns than the stock market, with lower volatility, smaller losses in downturns and low correlation to typical stock and bond portfolios. The approach relies only on publicly available data and uses liquid, easy-to-trade ETFs. This paper connects the strategy to academic research on momentum, crisis investing, defensive rotation, and diversified portfolio design.", "url": "https://papers.ssrn.com/abstract=5334772", "date_added": "2026-05-24", "summarized": true, "rating": "★4.5", "starred": false, "repro": "待复现", "summary_html": "<h1>Defense First: A Multi-Asset Tactical Model for Adaptive Downside Protection</h1>\n<p>&gt; Zotero Key: <code>EDZR6P7M</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Thomas D. Carlson</li>\n<li><strong>年份</strong>: 2025</li>\n<li><strong>出处</strong>: SSRN</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.5334772</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=5334772</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/IHERPNTU/Carlson - 2025 - Defense First A Multi-Asset Tactical Model for Adaptive Downside Protection.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：传统 60/40 组合在股债相关性转正时失效，单一对冲工具在不同宏观体制下表现不一。</li>\n<li><strong>方法</strong>：极简月度战术配置——在 TLT/GLD/DBC/UUP 四个防御资产间按 1/3/6/12 月动量排名分配仓位（40/30/20/10），动量弱于 T-bill 时转向 SPY。</li>\n<li><strong>结论</strong>：1986—2025 年年化 10.87%、Sharpe 0.89（标普 0.57）、最大回撤 -14.81%（标普 -50.97%），COVID 期间收益 0%，Upside capture 42.81%、Downside capture 仅 12.49%。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>传统 60/40 组合在通胀冲击或政策突变导致股债相关性转正时失效。单一对冲工具（如仅持有黄金或长期国债）在不同宏观体制下表现不一。这篇论文提出&quot;防御优先&quot;框架——同时持有四个覆盖不同经济风险维度的防御资产，通过动量排名动态切换，防哪个风险就用哪个工具。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: TLT（长期国债）、GLD（黄金）、DBC（商品）、UUP（美元指数）、SPY（标普 500，fallback）、90 天 T-bill（现金基准）</li>\n<li><strong>频率</strong>: 月度再平衡</li>\n<li><strong>样本区间</strong>: 1986–2025</li>\n<li><strong>数据来源</strong>: ETF 数据 + ETF 成立前的 Vanguard mutual fund / 指数 / 期货代理</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>1. <strong>动量评分</strong>: 四个防御资产各自计算 1/3/6/12 个月收益，等权平均得综合动量分</p>\n<p>2. <strong>排名分配</strong>: Top 1 → 40%、Top 2 → 30%、Top 3 → 20%、Top 4 → 10%</p>\n<p>3. <strong>绝对动量过滤</strong>: 若某防御资产的动量弱于 90 天 T-bill，其仓位转配 SPY</p>\n<p>4. <strong>再平衡</strong>: 每月一次，基于月末收盘价</p>\n<h2>核心结论与关键结果（1986–2025）</h2>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>指标</th><th>Defense First</th><th>S&amp;P 500</th></tr>\n<tr><td>年化收益</td><td>10.87%</td><td>11.17%</td></tr>\n<tr><td>波动率</td><td>8.50%</td><td>15.28%</td></tr>\n<tr><td>Sharpe</td><td><strong>0.89</strong></td><td>0.57</td></tr>\n<tr><td>Sortino</td><td><strong>1.59</strong></td><td>0.83</td></tr>\n<tr><td>最大回撤</td><td><strong>-14.81%</strong></td><td>-50.97%</td></tr>\n<tr><td>最差年份</td><td><strong>-6.94%</strong></td><td>-37.02%</td></tr>\n<tr><td>与标普相关性</td><td>0.45</td><td>0.99</td></tr>\n</table></div>\n<p><strong>危机表现</strong>:</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>事件</th><th>Defense First</th><th>S&amp;P 500</th></tr>\n<tr><td>黑色星期一 (1987)</td><td>-6.43%</td><td>-29.78%</td></tr>\n<tr><td>互联网泡沫 (2000-02)</td><td>-9.77%</td><td>-44.82%</td></tr>\n<tr><td>GFC</td><td>-14.61%</td><td>-50.97%</td></tr>\n<tr><td>COVID (Q1 2020)</td><td><strong>0.00%</strong></td><td>-19.63%</td></tr>\n<tr><td>通胀冲击 (2022)</td><td>-6.70%</td><td>-23.95%</td></tr>\n</table></div>\n<ul>\n<li>年换手率约 230%，按 25 bps 交易成本估算，扣除后年化收益约 9.59%</li>\n<li>Upside capture 42.81%，Downside capture 仅 <strong>12.49%</strong></li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>四维度防御资产框架（久期/货币不稳定/通胀/美元流动性危机），每个对应一个宏观风险体制</li>\n<li>绝对动量过滤 + SPY fallback 机制——保证资金不闲置，防御资产全弱时仍能参与市场</li>\n<li>极其简单的规则（4 个 ETF + 月度调仓），任何人都可以实施</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>极简主义即是弱点也是优点</strong>——没有宏观体制判断、没有波动率目标、没有相关性管理</li>\n<li>ETF 前数据用代理拼接，早期（1986-2004）表现可能存在数据挖掘偏差</li>\n<li>年度换手率 230% 意味着月均近 20%，含税账户中资本利得税会显著侵蚀收益</li>\n<li>未做样本外测试——整段历史就是训练集</li>\n<li>四个防御资产中 UUP（美元指数 ETF）2007 年才成立，早期代理的代表性存疑</li>\n<li>固定 40/30/20/10 权重分配缺乏理论依据</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 极高——所有品种均有公开 ETF 数据，历史代理也可用 futures 替代</li>\n<li><strong>方法清晰度</strong>: 极高——策略规则半页纸即可完整描述</li>\n<li><strong>计算成本</strong>: 极低——月度计算，excel 级别</li>\n<li><strong>综合评分</strong>: ★★★★☆ 4.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>这是这批论文中最容易复现的策略，且实际应用价值高。建议最小可行版本：直接使用 GLD/TLT/DBC/UUP/SPY ETF 数据从 2007 年起的实盘交易数据回测。扩展方向：(1) 用期货替代 ETF 实现更好的资本效率；(2) 加入波动率目标控制；(3) 用更复杂的权重分配替代固定 40/30/20/10；(4) 加入阈值容忍带（±5%）减少不必要换手。需注意 ETF 层面的费用和滑点在中国市场可能有较大差异。</p>"}, {"key": "VUKR6WBK", "title": "Crisis Alpha in the Post-2020 Regime: Optimizing Time Series Momentum via Multi-Frequency Signal Blending", "year": "2025", "authors": "George Coburn", "tags": ["Time-Series Momentum", "Economics", "Finance", "Trading", "Trading Algorithm"], "venue": "", "abstract": "This paper investigates the efficacy of a Time Series Momentum (TSM) trading strategy as a tail-risk hedge in a post-2020 macroeconomic regime. The baseline strategy, as outlined in Time Series Momentum (Moskowitz et al., 2012) implemented a trend-following strategy that provides diversification, however suffered from significant volatility in short-term market reversals. To address this, I propose and test an optimised \"Blended Momentum\" framework that diversifies signal generation across 1month, 3-month, and 12-month lookback horizons, coupled with inverse volatility targeting (", "url": "https://papers.ssrn.com/abstract=5940134", "date_added": "2026-05-24", "summarized": true, "rating": "★2", "starred": false, "repro": "—", "summary_html": "<h1>Crisis Alpha in the Post-2020 Regime: Optimizing Time Series Momentum via Multi-Frequency Signal Blending</h1>\n<p>&gt; Zotero Key: <code>VUKR6WBK</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Coburn, George</li>\n<li><strong>年份</strong>: 2025</li>\n<li><strong>出处</strong>: 昆士兰大学本科生工作论文（B.Com/B.Econ）</li>\n<li><strong>DOI</strong>: —</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=5940134</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/DJIUU2I5/Coburn - 2025 - Crisis Alpha in the Post-2020 Regime...pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：2022 年股债同跌使传统 60/40 失效，单一 12 个月 TSM 信号在快速市场反转时存在&quot;鞭打损失&quot;，如何优化趋势跟踪的危机对冲能力？</li>\n<li><strong>方法</strong>：将 TSM 单一 12 个月信号扩展为 1/3/12 个月多频率混合信号（四档仓位），配合逆波动率仓位调整（20% 目标波动率、2.5 倍杠杆上限），在 8 只 ETF 上 2010—2025 年回测。</li>\n<li><strong>结论</strong>：Sharpe 从 0.91 提升至 0.96，CAPM alpha 年化 11.5%（$t=4.61$）、市场 beta = -0.08；2022 年通胀冲击中持续正绝对收益，与市场相关性仅 0.04。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>2022 年股债同跌使传统 60/40 失效，作者探讨 TSM 趋势跟踪能否作为尾部风险对冲。为减少单一 12 个月信号在快速市场反转时的&quot;鞭打损失&quot;（whipsaw），提出多频率混合信号来平滑反应速度。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 8 只 ETF（SPY, EFA, IEF, TLT, DBC, GLD, VNQ, BTC-USD），覆盖股票/债券/大宗商品/加密货币/房地产</li>\n<li><strong>频率</strong>: 日度（波动率计算）；月度（信号生成）</li>\n<li><strong>样本区间</strong>: 2010 年 1 月–2025 年 12 月</li>\n<li><strong>数据来源</strong>: Yahoo Finance API（yfinance）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>多频率混合信号</strong>:</p>\n<p>$$S_t = \\frac{1}{3}\\left[\\text{sgn}(r_{1m}) + \\text{sgn}(r_{3m}) + \\text{sgn}(r_{12m})\\right]$$</p>\n<p>信号值域为 $\\{-1, -1/3, +1/3, +1\\}$，代表强空/弱空/弱多/强多四档仓位。</p>\n<p><strong>仓位大小</strong>（逆波动率靶向）:</p>\n<p>$$\\text{Position}_{i,t} = S_{i,t} \\times \\frac{\\sigma_{\\text{target}}}{\\sigma_{i,t}}$$</p>\n<ul>\n<li>$\\sigma_{\\text{target}} = 20\\%$（年化）</li>\n<li>$\\sigma_{i,t}$：60 日滚动实现波动率（年化）</li>\n<li>杠杆上限：2.5 倍</li>\n</ul>\n<p><strong>基准</strong>: 12 个月单信号 TSM，同一宇宙。</p>\n<h2>核心结论与关键结果</h2>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>策略</th><th>年化收益</th><th>Sharpe</th></tr>\n<tr><td>S&amp;P500</td><td>11.1%</td><td>0.74</td></tr>\n<tr><td>基准 TSM（12m）</td><td>9.3%</td><td>0.91</td></tr>\n<tr><td>混合动量（1/3/12m）</td><td>10.6%</td><td>0.96</td></tr>\n</table></div>\n<ul>\n<li>CAPM α（年化）= 11.5%，t = 4.61，市场 β = -0.08（策略与市场几乎不相关）。</li>\n<li>2022 年通胀冲击期间：策略持续正收益，S&amp;P500 下跌约 20%，相关性 = 0.04。</li>\n<li>2024 年后特朗普行情中，策略跑输纯股票（符合趋势跟踪在股票单边牛市中的特性）。</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>将多频率信号混合应用于后 2020 宏观制度，验证了&quot;危机 Alpha&quot;的有效性。</li>\n<li>三档信号混合提供连续仓位（而非二元 ±1），减少换仓频率和鞭打损失。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>学术水平较低</strong>：本科生论文，样本期仅 15 年，统计功效不足。</li>\n<li>仅 8 只 ETF，宇宙极小，没有真正的分散化收益。</li>\n<li>多频率混合与逆波动率并非新方法（AQR/Man 等机构已广泛使用），无文献对比。</li>\n<li>未模型化交易成本，换仓频率可能较高（1 个月信号每月可能翻转）。</li>\n<li>回测窗口（2010–2025）包含 GFC 后的货币宽松环境，可能存在结构性偏误。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 数据仅需 Yahoo Finance，极易获取。</li>\n<li><strong>方法清晰度</strong>: 公式完整，Python（pandas/numpy）即可实现，2 小时内可复现。</li>\n<li><strong>计算成本</strong>: 极低。</li>\n<li><strong>综合评分</strong>: ★2.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>不建议复现：样本量太小，论文学术质量不足以支撑进一步研究。</p>"}, {"key": "2XD2MS58", "title": "Caveats of Simple Factor Timing Strategies", "year": "2025", "authors": "David Blitz", "tags": ["Value", "Momentum", "Factor decay", "Factor investing", "Factor timing", "P-hacking", "Quality"], "venue": "", "abstract": "This short article discusses the caveats of apparently simple yet highly effective factor timing strategies. Applying various such strategies to the standard U.S. Fama-French factors we find t-statistics up to 5, with combination strategies reaching even higher levels. However, some factor timing strategies have questionable after-cost profitability because of high turnover. Others suffer from substantial performance decay in recent years. Next to such general concerns we identify various strategy-specific concerns. We propose to establish minimum standards for future factor timing studies, including carefully examining explicit or implicit loadings on the phenomena described in this article, clearly establishing the distinctiveness of reported alphas, and addressing susceptibility to known limitations.", "url": "https://papers.ssrn.com/abstract=5256938", "date_added": "2026-05-24", "summarized": true, "rating": "★4.0", "starred": false, "repro": "—", "summary_html": "<h1>Caveats of Simple Factor Timing Strategies</h1>\n<p>&gt; Zotero Key: <code>2XD2MS58</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: David Blitz (Robeco)</li>\n<li><strong>年份</strong>: 2025</li>\n<li><strong>出处</strong>: SSRN</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.5256938</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=5256938</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/U5GFN49Z/Blitz - 2025 - Caveats of Simple Factor Timing Strategies.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：越来越多研究声称发现简单高效的因子择时策略（t 值动辄 5+），但多是已知现象的重新包装，缺乏系统性隐患审视</li>\n<li><strong>方法</strong>：在 Fama-French 五因子上回测 7 种因子择时策略（短期/中期因子动量、波动率缩放、季节性、情绪等），逐一检验其隐患</li>\n<li><strong>结论</strong>：等权组合超额 1.5%/年（t=6.9），但每种策略都有&quot;阿喀琉斯之踵&quot;——如短期因子动量 2011 年后超额仅 0.4%，季节性动量前半段比后半段强 4 倍；提供了 12 条最低标准检查清单</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>越来越多研究声称发现了简单而高效的因子择时策略，t 值动辄达到 5 甚至更高。但作者对其&quot;增量贡献&quot;表示失望——很多策略不过是已知现象的重新包装。本文系统梳理 7 种简单因子择时策略的核心隐患，为未来研究设定最低标准。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: Fama-French 五因子（SMB/HML/RMW/CMA/WML，美国股票市场）</li>\n<li><strong>频率</strong>: 月度</li>\n<li><strong>样本区间</strong>: 1963/07–2024/12</li>\n<li><strong>数据来源</strong>: Kenneth French Data Library</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>对以下 7 种策略分别回测，与 1/N（五因子各 20%）基准对比：</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>#</th><th>策略</th><th>超额收益</th><th>t 值</th><th>核心隐患</th></tr>\n<tr><td>1</td><td>短期因子动量（1 月）</td><td>2.8%/年</td><td>4.9</td><td>高换手→交易成本侵蚀；2011 年后超额仅 0.4%；月末再平衡偏差（-30% 调整后）</td></tr>\n<tr><td>2</td><td>中期因子动量（12 月）</td><td>1.7%/年</td><td>3.0</td><td>对 WML 因子的 beta t 值高达 25，alpha 被完全解释；2011 年后也仅 0.4%</td></tr>\n<tr><td>3</td><td>结构性超配 WML/低配 SMB</td><td>1.0%/年</td><td>2.1</td><td>事后才知道动量最好/规模最差；不是择时而是静态配置偏差</td></tr>\n<tr><td>4</td><td>波动率缩放动量</td><td>0.6%/年</td><td>4.2</td><td>用特质动量（idiosyncratic momentum）替代即可实现同等效果</td></tr>\n<tr><td>5</td><td>季节性动量</td><td>1.6%/年</td><td>2.7</td><td>高换手+严重业绩衰减：前半段比后半段强 4 倍，2011 后为负</td></tr>\n<tr><td>6</td><td>投资者情绪（Baker-Wurgler）</td><td>1.8%/年</td><td>3.4</td><td>情绪指数实时计算困难；2009 年后 80%+ 时间为负→等同不投因子；波动率显著高于基准</td></tr>\n<tr><td>7</td><td>因子业绩衰减（线性缩仓）</td><td>0.9%/年</td><td>2.8</td><td>从根本上就有缺陷——到样本期末仓位归零，等于放弃策略</td></tr>\n</table></div>\n<h3>关键交互发现</h3>\n<ul>\n<li>债券收益率水平预测因子收益 t=2.9，但收益率是非平稳序列——与线性时间衰减指标相关 61%，实质是<strong>虚假回归</strong></li>\n<li>估值价差择时类似基础价值投资，因子择时本身无额外贡献</li>\n<li>GDP/失业率等宏观指标存在事后修正问题，回测用的数据和实际可得数据不一致</li>\n</ul>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>7 种策略之间的相关性极低（多在 -0.30 到 +0.30），等权组合超额 1.5%/年、t=6.9</li>\n<li>但每种策略都有其&quot;阿喀琉斯之踵&quot;——要么换手太高、要么业绩衰减、要么隐含暴露于已知因子</li>\n<li>优化权重的组合 t 值可达 8.2（最优权重偏向波动率缩放动量 43%），但这本身就是 p-hacking</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>提供了一份可供所有因子择时研究者使用的 <strong>12 条检查清单</strong>，覆盖：因子范围、业绩衰减、交易成本、spanning alpha、结构性偏差、波动率缩放、情绪指数、风险可比性、杠杆依赖、虚假回归、数据修正、p-hacking、经济关系稳定性</li>\n<li>系统揭示复杂 ML 模型可能隐含地利用了简单已知现象</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>仅用 Fama-French 五因子，结论可能对更广泛的因子库不完全适用</li>\n<li>作者来自 Robeco，其立场天然倾向于&quot;因子择时很难&quot;——存在机构偏见的可能性</li>\n<li>对 ML 方法的批评较为笼统，未具体测试典型 ML 择时架构</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 极高——Fama-French 因子数据完全公开免费</li>\n<li><strong>方法清晰度</strong>: 高——每种策略规则均有明确描述</li>\n<li><strong>计算成本</strong>: 极低——月度数据，无需训练</li>\n<li><strong>综合评分</strong>: ★★★★☆ 4.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>不直接提供可交易的策略，而是提供<strong>研究过程中的自查框架</strong>——这正是其最大价值。在开发任何因子择时策略时，应逐条对照检查清单，尤其注意：(1) 去除交易成本后是否仍有显著 alpha；(2) spanning regression 是否清除了对已知因子的暴露；(3) 业绩是否在 2011 年后仍显著。建议将这份清单整合到因子研究的标准工作流中。</p>"}, {"key": "YCTIETIW", "title": "Breaking the Trend: How to Avoid Cherry-Picked Signals", "year": "2025", "authors": "Sebastien Valeyre", "tags": ["Quantitative Finance - Portfolio Management"], "venue": "", "abstract": "Our empirical results show an impressive fit with the pretty complex theoretical Sharpe formula of a trend-following strategy depending on the parameter of the signal, which was derived by by Grebenkov and Serror (2014). That empirical fit convinces us that a mean-reversion process with only one time scale is enough to model, in a pretty precise way, the reality of the trend-following mechanism at the average scale of CTAs and as a consequence, using only one simple EMA, appears optimal to capture the trend. As a consequence, using a complex basket of different complex indicators as signal, do not seem to be so rational or optimal and exposes to the risk of cherry-picking.", "url": "http://arxiv.org/abs/2504.10914", "date_added": "2026-06-26", "summarized": true, "rating": "★4.0", "starred": false, "repro": "—", "summary_html": "<h1>Breaking the Trend: How to Avoid Cherry-Picked Signals</h1>\n<p>&gt; Zotero Key: <code>YCTIETIW</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Sebastien Valeyre</li>\n<li><strong>年份</strong>: 2025</li>\n<li><strong>出处</strong>: arXiv (2025-04, v11 2025-12-31)</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2504.10914</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2504.10914</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/8FM3QAXR/Valeyre - 2025 - Breaking the Trend How to Avoid Cherry-Picked Signals.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：CTA 行业普遍使用 SMA/EMA/MACD 等复杂组合作为趋势信号，参数靠历史回测优化天然引入数据窥探偏差——复杂指标是否真正优于单一指标？</li>\n<li><strong>方法</strong>：在 70 只全球期货 1990—2023 年上，实证验证 Grebenkov &amp; Serror (2014) 的理论 Sharpe 公式，对比单 EMA 与多时间尺度 MACD 复杂信号在 ARP 组合上的样本外表现。</li>\n<li><strong>结论</strong>：理论 Sharpe 公式与实证良好拟合，仅用一个时间尺度的 EMA 即可最优捕捉趋势；复杂信号组合无显著增益，且显著暴露于 cherry-picking 过拟合风险。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>CTA 行业普遍使用 SMA、EMA、MACD、Bollinger Bands 等指标的复杂组合作为趋势信号，参数选取主要靠历史回测优化——这天然引入数据窥探偏差。Grebenkov &amp; Serror (2014) 基于 AR(1) 过程推导出趋势跟随策略的理论 Sharpe 公式，但一直缺乏系统性实证验证。本文提供此验证，并以结论反推：若理论成立，EMA 就是最优单指标，复杂指标的超额绩效只不过是样本内过拟合。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 70只全球期货（股指、债券、外汇、商品期货），见附录 C</li>\n<li><strong>频率</strong>: 日频</li>\n<li><strong>样本区间</strong>: 1990年5月29日—2023年12月7日（约33年）</li>\n<li><strong>数据来源</strong>: 未具名商业数据库（未公开）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n    A[70只全球期货日收益\\n1990-2023] --&gt; B[标准化 EMA 指标\\nphi_it = EMA 归一化收益]\n    A --&gt; C[多时间尺度 MACD\\nMACD eta1 eta2 eta3 omega1 omega2 omega3]\n    B &amp; C --&gt; D[ARP 组合构造\\n归一化信号 x 相关矩阵逆平方根]\n    D --&gt; E[目标波动率调仓\\nARP_t+1 = ARP_hat / sqrt ARP_hat Sigma ARP_hat]\n    E --&gt; F[样本外 Sharpe 比实测]\n    F --&gt; G[对比 Grebenkov 理论 Sharpe S eta\\n拟合 beta0 与 lambda 参数]\n    G --&gt; H{理论 vs 实证拟合度}\n    H --&gt;|良好拟合| I[结论: 单 EMA 最优\\n复杂指标无显著增益]\n    H --&gt;|拟合偏离| J[说明多时间尺度记忆效应或噪声]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>收益模型（Grebenkov &amp; Serror, 2014）</strong>: 假设资产收益由 AR(1) 过程生成：</p>\n<p>$$r_{i,t} = \\epsilon_{i,t} + \\beta\\sum_{k=1}^{t-1}(1-\\lambda)^{t-1-k}\\xi_{i,k}$$</p>\n<p>其中 $\\epsilon_{i,t}$ 为 i.i.d. 噪声，$\\xi_{i,k}$ 为趋势驱动项，$\\lambda$ 为均值回归速度，$\\beta$ 为趋势强度。</p>\n<p>2. <strong>归一化 EMA 指标</strong>: 对资产 $i$ 在时刻 $t$，递推更新：</p>\n<p>$$\\sigma_{i,t+1}^2(\\eta) = (1-\\eta)\\sigma_{i,t}^2(\\eta) + \\eta r_{i,t+1}^2$$</p>\n<p>$$\\phi_{i,t+1}(\\eta) = (1-\\eta)\\phi_{i,t}(\\eta) + \\sqrt{\\eta}\\frac{r_{i,t+1}}{\\sigma_{i,t}(\\eta)}$$</p>\n<p>其中 $\\eta$ 为 EMA 平滑参数（半衰期 $\\approx\\ln(2)/\\eta$ 天），$\\phi$ 为归一化趋势指标，方差理论上约为1。</p>\n<p>3. <strong>MACD 三时间尺度指标</strong>: 为测试多时间尺度效益，构造：</p>\n<p>$$\\text{MACD}_{i,t}(\\eta_1,\\eta_2,\\eta_3,\\omega_1,\\omega_2,\\omega_3) = \\omega_1\\phi_{i,t}(\\eta_1)+\\omega_2\\phi_{i,t}(\\eta_2)+\\omega_3\\phi_{i,t}(\\eta_3)$$</p>\n<p>约束 $\\sum_j\\omega_j\\sqrt{\\eta_j}=0$（零斜率条件，排除极短期均值回复贡献）。</p>\n<p>4. <strong>Agnostic Risk Parity（ARP）组合</strong>:</p>\n<p>$$\\hat{\\text{ARP}}_{t+1} = (1-\\rho)\\hat{\\text{ARP}}_t + \\rho\\Sigma_t^{-1}C_t^{-0.5}\\phi_t(\\eta)$$</p>\n<p>$$\\text{ARP}_{t+1} = \\frac{\\hat{\\text{ARP}}_{t+1}}{\\sqrt{\\hat{\\text{ARP}}_{t+1}^\\top C_t\\Sigma_t\\hat{\\text{ARP}}_{t+1}}}$$</p>\n<p>其中 $C_t$ 为相关矩阵（750日 EWA），$\\Sigma_t$ 为波动率向量（40日 EWA），$\\rho=1/20$ 为组合平滑参数。</p>\n<p>5. <strong>理论 Sharpe 公式（Grebenkov &amp; Serror, 2014）</strong>:</p>\n<p>$$\\mathbf{S}(\\eta) = \\frac{\\beta_0^2\\sqrt{2\\eta}-\\frac{2}{\\pi}\\theta\\sqrt{\\eta(\\lambda+\\eta)}}{\\sqrt{(\\lambda+\\eta)^2+2\\beta_0^2(\\lambda+\\eta)}}$$</p>\n<p>其中 $\\beta_0=\\beta/\\sqrt{\\lambda(2-\\lambda)}$ 为归一化趋势强度，$\\theta$ 为交易成本参数。</p>\n<p>6. <strong>实证验证</strong>: 对 ARP 策略在 70 只期货全集上回测，改变 $\\eta$ 扫描 EMA 时间尺度，将实测 Sharpe vs $\\eta$ 曲线拟合理论公式，估计 $\\beta_0$ 和 $\\lambda$（道琼斯 100 年数据拟合值 $\\lambda=0.01$，$\\beta_0=0.1$）。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>理论 Sharpe 公式拟合优秀</strong>：实测 Sharpe 比随 EMA 参数 $\\eta$ 的变化曲线与 Grebenkov 理论公式高度吻合，支持单时间尺度 AR(1) 过程假设。</li>\n<li><strong>单 EMA 已是最优</strong>：在 ARP 框架下，添加更多时间尺度（MACD 类指标）相对于最优单 EMA 无显著增益，且额外参数显著增加 cherry-picking 风险。</li>\n<li><strong>最优 EMA 时间尺度</strong>：理论最优平滑参数 $\\eta_\\text{opt}=\\lambda\\sqrt{1+2\\beta_0^2/\\lambda}$；在道琼斯参数下约对应几十天半衰期，与行业经验一致。</li>\n<li><strong>复杂指标的风险</strong>：Bollinger Bands（非线性路径依赖）、多时间尺度 MACD 等复杂指标可通过参数组合&quot;拟合&quot;出与单 EMA 相近的灵敏度曲线，意味着其历史回测优势主要来自参数选取自由度（cherry-picking），而非捕获了更多市场信息。</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次在覆盖33年、70只期货的全球 ARP 组合上系统验证 Grebenkov-Serror (2014) 理论 Sharpe 公式，提供该理论最强的实证支撑。</li>\n<li>从&quot;最优信号即 EMA&quot;的理论结论反推&quot;复杂指标=cherry-picking 风险&quot;，为 CTA 策略设计提供原则性约束。</li>\n<li>证明了 Bollinger Bands 等非线性指标在均值情形下等价于 EMA 类线性组合，揭示其实质。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>数据来源为非公开商业数据库，无法独立验证。</li>\n<li>AR(1) 单时间尺度假设可能过于简化：市场中确实存在多尺度记忆效应（如长记忆过程），理论拟合对 100 年道琼斯数据的适用性不保证对其他资产或时段成立。</li>\n<li>论文版本多（v11），初版至最终修订跨度较大，部分实证细节可能变化。</li>\n<li>对短期均值回复（如单股）场景的结论不直接适用；ARP 本身是旋转不变组合，结论不完全推广到 Markowitz 框架。</li>\n<li>作者（Valeyre）自己是 ARP/Valeyre 2024 体系的推导者之一，存在观点倾向。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 数据非公开；但结论（最优 EMA 时间尺度与 Grebenkov 理论吻合）可用主要股指期货公开数据验证方向性。</li>\n<li><strong>方法清晰度</strong>: 公式和算法描述清晰，可自行实现 ARP + EMA 扫描回测。</li>\n<li><strong>计算成本</strong>: 极低，纯时序信号 + 矩阵运算，无需 GPU。</li>\n<li><strong>综合评分</strong>: ★4.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>最小可行复现：选取公开期货数据（10—20只品种，股指+债券+商品），实现归一化 EMA（公式5、6）和 ARP 组合（公式9、10），扫描 $\\eta$ 参数得到 Sharpe vs EMA 时间尺度曲线，与 Grebenkov 理论公式（公式3）对比形状是否吻合。不依赖全量70只期货数据，主要验证理论曲线形状一致性。风险在于样本量不足时曲线噪声较大。</p>"}, {"key": "57CG9KSV", "title": "Volatility Targeting Is Trendy: How Trend Following Explains Alpha in Volatility-Managed Strategies", "year": "2024", "authors": "Benjamin Hood, Cameron Raughtigan", "tags": ["leverage effect", "risk parity", "trend", "trend following", "volatility", "volatility control", "volatility management", "volatility targeting"], "venue": "", "abstract": "Why do volatility targeting/management strategies tend to outperform simple buy-and-hold positions in the same assets? We test the hypothesis that this outperformance is mainly due to a loading on trend following that arises because of the negative correlation between return direction (trend) and magnitude (volatility), the so-called “leverage effect.” When controlling for trend exposure, alpha to volatility targeting is shown to mainly accrue to trend for both a long equity history and a set of 14 global equity index futures contracts. By contrast, this is not true for commodity, fixed income, or currency futures, where the leverage effect is not present. We further discuss the mechanical relationship between volatility targeting and trend following, creating a point of connection between these two seemingly different branches of research.", "url": "https://papers.ssrn.com/abstract=4773781", "date_added": "2026-05-24", "summarized": true, "rating": "★4", "starred": false, "repro": "—", "summary_html": "<h1>Volatility Targeting Is Trendy: How Trend Following Explains Alpha in Volatility-Managed Strategies</h1>\n<p>&gt; Zotero Key: <code>57CG9KSV</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Benjamin T. Hood, Cameron Raughtigan</li>\n<li><strong>年份</strong>: 2024</li>\n<li><strong>出处</strong>: SSRN</li>\n<li><strong>DOI</strong>: -</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=4773781</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/TBAJHM7K/Hood和Raughtigan - 2024 - Volatility Targeting Is Trendy How Trend Following Explains Alpha in Volatility-Managed Strategies.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：波动率目标化策略的超额收益（alpha）是否为独立 alpha，还是对其他已知因子的隐式暴露？</li>\n<li><strong>方法</strong>：在 Fama-French Mkt-Rf（1927—2023）和 50 个全球期货合约上，将波动率目标化收益对买入持有和趋势跟踪因子做回归分解。</li>\n<li><strong>结论</strong>：权益市场中约 59% 的 alpha 被趋势跟踪因子吸收（alpha 从 3.07%/年降至 1.25%/年，不显著），根源在于股票的杠杆效应（收益率与波动率负相关）；商品/固收/外汇中无此现象。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>Moreira &amp; Muir (2017) 发现波动率管理组合有显著alpha，且不能被SMB/HML等截面因子解释。本文假设这个alpha实际上是对趋势跟踪的时间序列因子暴露——当波动率高时(通常对应下跌)，波动率目标化策略降低仓位；当波动率低时(通常对应上涨)，增加仓位。这与趋势跟踪的信号方向恰好一致。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>:</li>\n</ul>\n<p>  - 长历史: Fama-French Mkt-Rf市场因子(1927-2023)</p>\n<p>  - 宽资产: 50个全球期货合约(含14个权益指数、商品、固收、外汇)</p>\n<ul>\n<li><strong>频率</strong>: 日度</li>\n<li><strong>样本区间</strong>: 1927-2023(长历史)，2000-2023(宽资产)</li>\n<li><strong>数据来源</strong>: Kenneth French网站(长历史)，Refinitiv期货价格(宽资产)</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>1. <strong>Volatility Targeting</strong>: 仓位与过去3个月波动率倒数成正比，目标波动率=标的资产全样本波动率</p>\n<p>2. <strong>Simple Trend</strong> (Hurst et al., 2013): 基于过去1/3/12个月收益符号平均值做多/空</p>\n<p>3. <strong>回归框架</strong>: VT收益 = α + β₁×BH收益 + β₂×Trend收益 + ε</p>\n<p>4. <strong>面板回归</strong>: 按资产类别分组，使用时序聚类稳健标准误(Rogers, 1993)</p>\n<p>5. <strong>杠杆效应度量</strong>: 21天收益与21天波动率变化的相关系数</p>\n<h2>核心结论与关键结果</h2>\n<p>1. <strong>Mkt-Rf长历史(1927-2023)</strong>:</p>\n<p>   - Vol Targeting: 年化收益10.2%, SR 0.54 — BH: 7.6%, SR 0.44; Trend: 4.9%, SR 0.37</p>\n<p>   - 仅回归BH时: alpha 3.07%/年(t=2.9)</p>\n<p>   - 加入Trend后: alpha降为1.25%/年(t=1.3,不显著)，Trend beta=0.30(t=12.0)</p>\n<p>   - alpha下降约59%，趋势暴露吸收了近3/5的&quot;alpha&quot;</p>\n<p>2. <strong>50个期货的面板回归(2000-2023)</strong>:</p>\n<p>   - 权益类: Vol Targeting alpha 1.57%/年, 加入Trend后降为0.65%(降低~59%)，Trend beta=0.35(t=32.4)</p>\n<p>   - 商品/固收/外汇: 加入Trend后alpha几乎不变，Trend beta仅0.04-0.08</p>\n<p>   - 权益的杠杆效应(-0.31)显著高于其他资产类别(-0.03至-0.16)</p>\n<p>3. <strong>杠杆效应-趋势beta关系</strong>: 所有权益资产的趋势beta高于非权益类中的最高值(WTI原油)，且杠杆效应越负，趋势beta越大</p>\n<p>4. <strong>杠杆上限分析</strong>: 2.5x上限与无上限表现几乎一致(仅5.5%时间超过2.5x)</p>\n<h2>创新点</h2>\n<p>1. 首次直接检验波动率目标化策略和趋势跟踪策略之间的交叉暴露</p>\n<p>2. 通过杠杆效应(Black, 1976)建立了两类策略的机械联系——波动率目标化实质上是隐式的趋势跟踪</p>\n<p>3. 解释了为什么波动率目标化的alpha仅存在于权益市场——只有权益市场具有显著的杠杆效应</p>\n<p>4. 提供了更真实的模拟设定(波动率倒数而非方差倒数、1天实施滞后、2bp交易成本)</p>\n<h2>局限与可质疑处</h2>\n<p>1. 宽资产样本的alpha本身就不显著(仅有3/50资产达到t&gt;2)，降低了&quot;趋势解释alpha&quot;的说服力</p>\n<p>2. Simple Trend策略(Hurst et al. 2013)只是趋势跟踪的一种实现，结论对不同的趋势定义是否稳健？(附录C做了部分稳健性检验)</p>\n<p>3. 波动率估计使用滚动3个月历史波动率——其他估计方法(RW、GARCH等)可能改变结论</p>\n<p>4. 交易成本仅假设固定2bp，没有对不同的交易成本场景进行充分的敏感性分析</p>\n<p>5. 2024年11月的最新草稿，未经同行评审</p>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: Fama-French因子数据公开可获取；期货数据可用天软获取</li>\n<li><strong>方法清晰度</strong>: 策略定义和回归方法描述清晰，直接可复现</li>\n<li><strong>计算成本</strong>: 极低 — 仅需简单统计计算，无模型训练需求</li>\n<li><strong>综合评分</strong>: ★★★★</li>\n</ul>\n<h2>复现备注</h2>\n<ul>\n<li><strong>关键风险点</strong>: 主要结论在统计显著性上有一定争议(宽资产alpha本身不显著)；策略的简单性意味着复现价值更多在于&quot;理解机制&quot;而非&quot;改进策略&quot;</li>\n<li><strong>最小可行版本</strong>: 在我们的策略池中对比：</li>\n</ul>\n<p>  1. 标的资产买入持有</p>\n<p>  2. 波动率目标化版本</p>\n<p>  3. 简单趋势版本</p>\n<p>  4. 在回归中检验VT对Trend的暴露，观察alpha的降低程度</p>\n<ul>\n<li><strong>建议 research topic</strong>: <code>vol_targeting_trend_decomposition</code></li>\n<li><strong>核心可交付</strong>: 一个诊断工具——给定任意策略的收益率序列，检验其波动率目标化版本中多大比例alpha来自趋势暴露</li>\n</ul>"}, {"key": "WJARRXL7", "title": "The Cross-Section of Dividend Discount Rates", "year": "2024", "authors": "Xinwei Li", "tags": ["cross-section of stocks", "dividend discount rates", "term structure of equity"], "venue": "", "abstract": "<p>A stock can be viewed as a collection of dividend strips, each representing a <span>claim to a single dividend. I study how individual dividends are pri", "url": "https://papers.ssrn.com/abstract=5007752", "date_added": "2026-06-07", "summarized": true, "rating": "★3.5", "starred": false, "repro": "—", "summary_html": "<h1>The Cross-Section of Dividend Discount Rates</h1>\n<p>&gt; Zotero Key: <code>WJARRXL7</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Xinwei Li (INSEAD PhD Candidate)</li>\n<li><strong>年份</strong>: 2024</li>\n<li><strong>出处</strong>: SSRN (Job Market Paper)</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.5007752</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=5007752</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/Q3QH4VGF/Li - 2024 - The Cross-Section of Dividend Discount Rates.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：现有资产定价文献大量研究贴现率的时间序列变动，但对同一期限不同股票的股息贴现率横截面差异了解甚少。</li>\n<li><strong>方法</strong>：利用个股期权通过 put-call parity 合成 1 年和 2 年期股息 strips 价格，计算 Price-Dividend Ratio 并做横截面方差分解和 portfolio sort，在美股 2004—2022 年上分析。</li>\n<li><strong>结论</strong>：约 70% 的价格差异来自贴现率而非现金流增长；多空组合月均收益 3.2%、Sharpe 3.5，无法被 CAPM/FF5/q5 解释，支持 KP2013 模型的预测。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>现有资产定价文献大量研究了贴现率的<strong>时间序列</strong>变动和<strong>期限结构</strong>（BBK 2012），但对贴现率的<strong>横截面</strong>变动了解甚少。核心问题：给定同一期限，不同股票的股息贴现率是否相同？如果相同，股票就只是不同期限现金流的不同组合（Lettau-Wachter 2007，Gormsen-Lazarus 2023）；如果不同，横截面预期收益就是期限结构差异和贴现率差异的复合效应。本文利用个股期权合成股息 strips 价格，首次系统性地估计了短期股息贴现率的横截面差异。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 美国个股期权 + 标的股票</li>\n<li><strong>频率</strong>: 月度（期权价格采样每月第三个周五），月度 rebalance</li>\n<li><strong>样本区间</strong>: 2004–2022（受限于长期个股期权 LEAPS 的可获得性）</li>\n<li><strong>数据来源</strong>: OptionMetrics（期权价格和隐含波动率）、CRSP（股价/收益/退市信息）、Compustat（财务数据）、IHS Markit（融券费用）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[个股期权价格&lt;br/&gt;OptionMetrics] --&gt; B[Put-Call Parity&lt;br/&gt;合成股息价格]\n  B --&gt; C[剔除美式期权&lt;br/&gt;提前行权溢价]\n  C --&gt; D[利用欧洲市场数据&lt;br/&gt;估计调整模型 R²&gt;95%]\n  D --&gt; E[得到 1年期/2年期&lt;br/&gt;股息 strips 价格]\n  E --&gt; F[计算 Price-Dividend Ratio&lt;br/&gt;pd = P_div / D]\n\n  F --&gt; G[横截面方差分解]\n  G --&gt; G1[panel 回归: pd → 股息增长&lt;br/&gt;CF 成分]\n  G --&gt; G2[panel 回归: pd → 持有收益&lt;br/&gt;DR 成分]\n  G1 --&gt; H[约 70%/50% 来自 DR]\n\n  F --&gt; I[Portfolio Sort&lt;br/&gt;按 pd 分五组 + ABK 修正]\n  I --&gt; J[计算 holding-to-maturity&lt;br/&gt;和月度超额收益]\n  J --&gt; K[CAPM / FF5 / q5 / SY4&lt;br/&gt;因子模型 alpha 检验]\n\n  L[资产定价模型评估] --&gt; L1[LW2007: DR 差异≈0]\n  L --&gt; L2[LZ2013: DR 差异极小]\n  L --&gt; L3[KP2013: DR 差异显著 ✓]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>合成股息 strips 价格</strong>：利用个股欧式期权的 put-call parity，$P_{t}^{\\text{div}}(T) = S_t + P_t(T) - C_t(T) - K e^{-rT}$，其中 $S_t$ 为股票现价，$P_t(T), C_t(T)$ 为到期日 $T$ 的欧式看跌/看涨期权，$K$ 为行权价，$r$ 为无风险利率。</p>\n<p>2. <strong>美式期权提前行权溢价调整</strong>：美国个股期权为美式期权，put-call parity 不精确成立。利用同时交易欧式和美式期权的欧洲股票样本，估计线性模型 $P_{div}^{\\text{true}} = f(P_{div}^{\\text{distorted}}, \\text{state vars})$（R² &gt; 95%），然后将该模型应用于美股。</p>\n<p>3. <strong>测量误差修正</strong>：期权价格噪声大，采用多种修正——用不同行权价和到期日的中位数合成值、滞后价格-股息比排序（打破测量误差的负自相关，Asparouhova-Bessembinder-Kalcheva 2010）、滞后收益加权、工具变量法（用相邻期限的价差作为 IV）。</p>\n<p>4. <strong>横截面方差分解</strong>：跑 panel 回归 $\\Delta d_{i,t+n} = \\alpha_t + \\beta \\cdot pd_{i,t}^n + \\epsilon_{i,t}$ 和 $r_{i,t\\to t+n}^{HTM} = \\alpha_t + \\gamma \\cdot pd_{i,t}^n + \\eta_{i,t}$，分别得到 CF 和 DR 成分对 pd 变动的贡献比例。</p>\n<p>5. <strong>Portfolio Sort</strong>：按 pd 分为五等分组，每月再平衡，计算持有至到期收益（equity yields）和月度超额收益（equity risk premia），测 CAPM alpha 和多因子 alpha。</p>\n<p>6. <strong>模型评估</strong>：在 Lettau-Wachter (2007)、Lin-Zhang (2013)、Kogan-Papanikolaou (2013) 三个基准模型中模拟股息 strips 的横截面分布，与实证结果对比。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>价格分布</strong>：1 年期股息 strip 中位数 pd=0.89（即价格约为股息的 89%），占股票总值的 2.5%。跨分位范围：10th=0.40 到 90th=1.61。2 年期 pd 中位数=0.78，占比 1.8%。</li>\n<li><strong>方差分解</strong>：1 年期（2 年期）股息 strip 价格横截面差异中，约 <strong>70%（50%）</strong> 由贴现率差异驱动，非现金流增长差异。</li>\n<li><strong>多空收益</strong>：1 年期 strips 的多空月均超额收益 <strong>3.2%</strong>（Sharpe 3.5），HTM 收益差 10.9%（Sharpe 0.77）。2 年期：月均 1.8%（Sharpe 0.28），HTM 收益差 6.7%（Sharpe 0.63）。</li>\n<li><strong>因子 alpha</strong>：CAPM beta 呈 U 形，多空组合 beta≈0。FF5、q5、SY4、AEM 因子模型的 alpha 几乎等于原始平均收益，无法解释。</li>\n<li><strong>与 Gormsen-Lazarus (2023) 的关系</strong>：用股票特征（BTM、profitability）排序时，股息 strips 风险溢价差异不显著——GL 的发现可复现。但股票特征不擅长捕捉短期风险溢价，而 pd 本身能捕捉。在控制 BTM 的各半子样本中，pd 的预测力依然显著。</li>\n<li><strong>模型评估</strong>：LW2007 和 LZ2013 中，股息贴现率的横截面差异几乎为零（价格差异全来自现金流增长）；<strong>只有 KP2013</strong>（资产在置 + 增长机会，IST 冲击）能产生与实际数据一致的贴现率横截面差异，且期限结构向下倾斜。</li>\n</ul>\n<h2>创新点</h2>\n<p>1. <strong>首次系统估计个股层面短期股息 strips 的横截面分布</strong>，将期限结构文献从聚合层面拓展到 firm-level。</p>\n<p>2. 提出&quot;横截面价格分散的期限结构&quot;（term structure of cross-sectional price dispersion）新概念，对资产定价模型提供额外学科约束。</p>\n<p>3. 用期权数据绕过美国无个股股息衍生品的数据限制，并创新性地用欧洲市场估计美式期权提前行权溢价调整模型。</p>\n<p>4. 挑战了&quot;股票只是不同期限聚合股息 strips 的组合&quot;这一简化假设，证明 firm-specific DR 差异不可忽视。</p>\n<p>5. 为区分主流资产定价模型提供了新的 empirical moments。</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>期权市场覆盖有限</strong>：LEAPS 期权的流动性集中于大市值股票，小市值股票样本代表性不足（虽然 portfolio sort 显示市值在各组间几乎相同）。</li>\n<li><strong>美式期权调整假设强</strong>：假设从欧洲市场学到的调整系数跨市场和跨时期稳定，实际可能不成立。</li>\n<li><strong>噪音问题</strong>：即使经过多重修正，个股期权价格的测量误差仍然可能很大——月均收益 3.2% 的 Sharpe 仅 0.24，说明月间波动极大。</li>\n<li><strong>交易可行性</strong>：策略涉及同时买卖期权和股票，实际执行中的买卖价差、期权流动性、保证金要求可能大幅削减收益。</li>\n<li><strong>2004–2022 样本较短</strong>：相比典型资产定价研究（40+ 年），样本周期有限，且包含两个大危机（2008、2020），外部有效性存疑。</li>\n<li><strong>尚无 peer-review</strong>：目前为 Job Market Paper 阶段，未经过期刊审稿。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: ★★★☆☆ OptionMetrics 需付费订阅（WRDS），CRSP/Compustat 同样需订阅。替代方案难度大。</li>\n<li><strong>方法清晰度</strong>: ★★★★☆ 步骤描述详细，附录完善，但美式期权调整的具体回归设定未完全展开。</li>\n<li><strong>计算成本</strong>: ★★★☆☆ 中等，需逐月逐股匹配期权+股票数据，IV 回归和 panel 回归。</li>\n<li><strong>综合评分</strong>: ★3.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>中等优先级。论文的学术价值高、方法严谨，但对量化策略的直接转化路径较长。复现障碍：（1）OptionMetrics 订阅成本高，且 A 股个股期权品类少、流动性差；（2）核心贡献在资产定价理论层面（区分模型），策略信号层面可考虑简化：直接用个股期权的 implied dividend yield 构建横截面因子，测试 A 股 50ETF 期权的类比指标。建议最小可行版本：提取 50ETF 期权隐含的股息率期限结构，与个股股息率做关联分析。</p>"}, {"key": "2UKAW2VB", "title": "Risk Parity With Trend Following", "year": "2024", "authors": "Vineer Bhansali, Linda Chang, Jeremie Holdom…", "tags": ["Trend-Following", "Risk Parity"], "venue": "", "abstract": "Risk-parity is a widely understood strategy which performed very well in the post-Volcker era of declining interest rates. However, a traditional risk-parity strategy using stocks and bonds is vulnerable to periods like 2022 when both asset classes entered a simultaneous drawdown as inflation caused the correlation between them to switch positive for the first time in over a decade. We propose that a better approach to risk-parity is either replacing bonds or augmenting them with a trend-following strategy. Our results strongly suggest that including trend-following in either capacity improves upon classical risk-parity, especially when carry considerations are included. For robustness, we show that this is still the case even when we include an allocation to commodities in the traditional risk-parity portfolio, an asset class which not only has historically performed well during periods of inflation, but also performed well during 2022.", "url": "https://papers.ssrn.com/abstract=4714859", "date_added": "2026-05-24", "summarized": true, "rating": "★3.0", "starred": false, "repro": "—", "summary_html": "<h1>Risk Parity With Trend Following</h1>\n<p>&gt; Zotero Key: <code>2UKAW2VB</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Vineer Bhansali, Linda Chang, Jeremie Holdom, Matthew Johnson, Colin Suvak (LongTail Alpha)</li>\n<li><strong>年份</strong>: 2024</li>\n<li><strong>出处</strong>: SSRN</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.4714859</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=4714859</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/I978DJQA/Bhansali 等 - 2024 - Risk Parity With Trend Following.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：经典风险平价（股+债）在 2022 年股债正相关冲击下遭受重创，需要更好的动态&quot;搭档&quot;策略</li>\n<li><strong>方法</strong>：在风险平价中加入趋势跟踪，并叠加 carry 同向过滤器（仅做多趋势+正 carry 品种），跨 78 个期货合约</li>\n<li><strong>结论</strong>：1999–2023 回测，股+债+carry 优化趋势三资产组合 Sharpe 0.71、CAGR 10.41%，远超纯股债风险平价 Sharpe 0.56 / 8.46%</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>经典风险平价（股票+债券）在 1990-2020 年极为成功——股债负相关 + 利率下行 + 充裕流动性。但 2022 年通胀冲击导致股债正相关，风险平价遭受重创。趋势跟踪作为一种能够适应变化中的相关性和波动率的动态策略，能否成为风险平价的更好&quot;搭档&quot;？</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: S&amp;P 500 E-mini 期货、Bloomberg US Aggregate 债券指数、Credit Suisse 15% 波动率趋势跟踪指数（vanilla trend）、自建 carry 优化趋势策略（78 个流动性期货合约跨四类资产）、S&amp;P GSCI 商品指数</li>\n<li><strong>频率</strong>: 月度</li>\n<li><strong>样本区间</strong>: 1999/01–2023/11</li>\n<li><strong>数据来源</strong>: Bloomberg, LongTail Alpha</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>1. <strong>经典风险平价</strong>: 用 52 周滚动协方差和波动率计算，所有组合目标波动率 15%，通过期货和 total return swaps 实现杠杆</p>\n<p>2. <strong>Vanilla Trend</strong>: Credit Suisse 15% vol Managed Futures 指数作为代理</p>\n<p>3. <strong>Carry-Optimized Trend</strong>: 200 日均线趋势信号 + carry 同向过滤（仅做多趋势+正 carry 的品种，做空趋势+负 carry），78 个期货合约，每方向 5 bps 交易成本</p>\n<h2>核心结论与关键结果（1999–2023）</h2>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>组合</th><th>CAGR</th><th>Sharpe</th><th>Sortino</th><th>Skew</th></tr>\n<tr><td>股票 + 债券</td><td>8.46%</td><td>0.56</td><td>0.89</td><td>-0.90</td></tr>\n<tr><td>股票 + 债券 + Vanilla Trend</td><td>9.49%</td><td>0.63</td><td>1.14</td><td><strong>-0.19</strong></td></tr>\n<tr><td>股票 + Vanilla Trend（替代债券）</td><td>7.27%</td><td>0.54</td><td>1.03</td><td>0.07</td></tr>\n<tr><td>股票 + Carry-Optimized Trend</td><td>10.58%</td><td><strong>0.79</strong></td><td><strong>1.43</strong></td><td>-0.27</td></tr>\n<tr><td><strong>股票 + 债券 + Carry-Optimized Trend</strong></td><td><strong>10.41%</strong></td><td><strong>0.71</strong></td><td><strong>1.26</strong></td><td><strong>-0.30</strong></td></tr>\n</table></div>\n<ul>\n<li>加入商品后结论不变——股票+债券+商品+optimized trend: CAGR 8.64%, Sharpe 0.59（vs 纯三资产 6.61%/0.45）</li>\n<li>Carry 过滤器使趋势策略在大宗商品上持有空头更多（样本期内商品多为 contango），降低了与商品的关联</li>\n<li>平均权重：股票 64%、债券 251%（高杠杆）、趋势 54%</li>\n</ul>\n<h3>关键发现</h3>\n<ul>\n<li>完全用趋势替代债券不可取——失去了债券 carry 的贡献（2010-2019 年尤其明显）</li>\n<li><strong>三资产组合（股+债+趋势）是最佳方案</strong></li>\n<li>趋势的超额贡献主要集中在 2010 年之前和 2022 年——在 2010-2019 年低波动、弱趋势环境中表现平淡</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次系统比较了&quot;加趋势&quot;vs&quot;替代债券&quot;两种风险平价增强路径</li>\n<li>引入 carry 过滤器作为趋势策略的增强模块，显著优于 vanilla trend</li>\n<li>提供了包含杠杆/保证金/融资成本在内的完整实施模拟</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>行业白皮书（LongTail Alpha），发表方利益相关——其 carry-optimized trend 是其旗舰策略</li>\n<li>仅 24 年样本（1999-2023），覆盖了债券大牛市但未包含 1970s 通胀期的完整测试</li>\n<li>Vanilla trend 用 CSLAB 指数代理——该指数包含费用且可能不完全代表任何实际可投资策略</li>\n<li>风险平价对协方差估计窗口（52 周）敏感，未做敏感性分析</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 中——S&amp;P 500 期货和债券指数公开可得，但 CSLAB 指数需 Bloomberg；carry-optimized trend 为自建策略</li>\n<li><strong>方法清晰度</strong>: 中——框架清晰，但 carry 过滤器的具体实现细节不完整</li>\n<li><strong>计算成本</strong>: 低——月度再平衡，简单协方差计算</li>\n<li><strong>综合评分</strong>: ★★★☆☆ 3.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>核心思想简单且值得验证——在风险平价框架中引入趋势跟踪。最小可行版本：用 S&amp;P 500 + 10Y Treasury futures 构建经典风险平价，叠加简单的 12 月时序动量策略（跨品种），比较 2000 年以来表现。扩展方向：加入 carry 信号过滤、加入商品、不同波动率目标。需注意杠杆实施层面的融资成本和保证金管理。</p>"}, {"key": "BY66XUPY", "title": "RVRAE: A Dynamic Factor Model Based on Variational Recurrent Autoencoder for Stock Returns Prediction", "year": "2024", "authors": "Yilun Wang, Shengjie Guo", "tags": ["Computer Science - Machine Learning", "Quantitative Finance - Portfolio Management", "Quantitative Finance - Pricing of Securities"], "venue": "", "abstract": "In recent years, the dynamic factor model has emerged as a dominant tool in economics and ﬁnance, particularly for investment strategies. This model offers improved handling of complex, nonlinear, and noisy market conditions compared to traditional static factor models. The advancement of machine learning, especially in dealing with nonlinear data, has further enhanced asset pricing methodologies. This paper introduces a groundbreaking dynamic factor model named RVRAE. This model is a probabilistic approach that addresses the temporal dependencies and noise in market data. RVRAE ingeniously combines the principles of dynamic factor modeling with the variational recurrent autoencoder (VRAE) from deep learning. A key feature of RVRAE is its use of a prior-posterior learning method. This method ﬁne-tunes the model’s learning process by seeking an optimal posterior factor model informed by future data. Notably, RVRAE is adept at risk modeling in volatile stock markets, estimating variances from latent space distributions while also predicting returns. Our empirical tests with real stock market data underscore RVRAE’s superior performance compared to various established baseline methods.", "url": "http://arxiv.org/abs/2403.02500", "date_added": "2026-05-26", "summarized": true, "rating": "★3.5", "starred": false, "repro": "—", "summary_html": "<h1>RVRAE: A Dynamic Factor Model Based on Variational Recurrent Autoencoder for Stock Returns Prediction</h1>\n<p>&gt; Zotero Key: <code>BY66XUPY</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Yilun Wang, Shengjie Guo</li>\n<li><strong>年份</strong>: 2024</li>\n<li><strong>出处</strong>: arXiv:2403.02500</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2403.02500</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2403.02500</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/96RVLUEB/Wang和Guo - 2024 - RVRAE A Dynamic Factor Model Based on Variational Recurrent Autoencoder for Stock Returns Predictio.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：现有深度学习因子模型主要针对截面数据，忽略股票收益的时序依赖性；RNN/LSTM 在噪声市场中信噪比低，容易学到无意义模式。</li>\n<li><strong>方法</strong>
