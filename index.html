机矩阵理论的谱分析部分实现复杂</li>\n<li><strong>计算成本</strong>: 训练大型 DNN + 构建数十万因子的协方差矩阵，计算量较大，需 GPU 支持</li>\n<li><strong>综合评分</strong>: ★3.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>核心价值在于 PTK 的理论框架和&quot;特征发现与定价分离&quot;的思路，而非全量复现。最小可行版本：用 IPCA 或已有的深度特征提取器获得特征，再套用 PTK 的大因子组合规则，验证 PTK-SDF 是否优于端到端 DNN-SDF。A 股适配需替换特征集。主要风险：NTK 假设在有限宽网络上的近似质量难以评估。</p>"}, {"key": "HB869IX9", "title": "Hierarchical Graph Learning for Calendar Spread Strategies in Commodity Futures Markets", "year": "2026", "authors": "Yoonsik Hong, Diego Klabjan", "tags": ["Quantitative Finance - Trading and Market Microstructure", "Computer Science - Machine Learning", "Quantitative Finance - Portfolio Management", "Computer Science - Computational Engineering, Finance, and Science", "Quantitative Finance - Pricing of Securities"], "venue": "", "abstract": "Commodity futures can be represented hierarchically, with underlying assets at the upper level and individual futures contracts at the lower level. Entities at each level can be connected by edges reflecting inherent correlations, with cross-level edges capturing contract-to-underlying asset connections. Building on our observations of these structures, we propose a hierarchical graph learning approach for calendar spread (CS) strategies in commodity futures markets, addressing two significant gaps in the machine-learning literature: (i) the absence of learning-based methods for CS strategies in futures markets, and (ii) the lack of consideration of maturity-dependent interrelationships across commodity futures. We first establish the efficacy of CS strategies by analytically showing that CS strategies can possess higher risk-adjusted returns, measured by the information ratio, and lower risk, measured by variance and delta, than long-only strategies. We then introduce a method to convert learning-based predictions into CS positions. Next, we develop a hierarchical graph learning method that predicts futures price movements by utilizing the maturity-dependent interrelationships, thereby yielding a CS trading algorithm. Empirical results on commodity futures markets traded on the Chicago Mercantile Exchange Group demonstrate that our method outperforms benchmark models in both prediction and trading performance. We find that maturity-dependent interrelationships across commodity futures are instrumental in prediction and that CS trading based on hierarchical graph learning is effective for statistical arbitrage.", "url": "http://arxiv.org/abs/2606.25811", "date_added": "2026-06-27", "summarized": false, "rating": "", "starred": false, "repro": "—", "summary_html": ""}, {"key": "TSHKLWBJ", "title": "From Index to Equity: Pre-Training Transformers for Stock Return Prediction", "year": "2026", "authors": "Marie Soehl Coolsaet, Roberto Gallardo, Zhen Gao", "tags": ["Computer Science - Machine Learning", "Quantitative Finance - Statistical Finance"], "venue": "", "abstract": "This research aims to leverage machine learning to improve stock price prediction and support informed investment decisions related to buying, selling, and holding assets. Specifically, this work investigates transformer-based models for stock prediction and examines the impact of pre-training strategies on forecasting performance. A transformer model was first pre-trained on the Toronto Stock Exchange Index (TSX) to predict intra-day return direction and subsequently fine-tuned on individual TSX stocks. The model was further adapted for return-value regression tasks. Performance was benchmarked against Long Short-Term Memory (LSTM) and XGBoost models. Pre-training on the market index improved the binary cross-entropy loss for individual stock prediction from 0.69 to 0.64. The fine-tuned transformer regression model achieved lower mean squared error than the benchmark models, although the ensemble and XGBoost models achieved higher average daily returns. In addition, a practical application was developed to deliver real-time stock predictions for trading support. Future work will focus on increasing transformer model capacity, incorporating broader global technical indicators, and filtering out stocks with low predictability.", "url": "http://arxiv.org/abs/2605.23962", "date_added": "2026-06-07", "summarized": true, "rating": "★2.5", "starred": false, "repro": "—", "summary_html": "<h1>From Index to Equity: Pre-Training Transformers for Stock Return Prediction</h1>\n<p>&gt; Zotero Key: <code>TSHKLWBJ</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Marie Soehl Coolsaet, Roberto Gallardo, Zhen Gao (McMaster University / Universidad Veracruzana)</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: arXiv</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2605.23962</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2605.23962</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/Q3NIQRVI/Coolsaet 等 - 2026 - From Index to Equity Pre-Training Transformers for Stock Return Prediction.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>将 Transformer 先在多伦多交易所指数（TSX）上预训练预测日内涨跌，再微调到个股——预训练使分类交叉熵从 0.694 降至 0.640，但 XGBoost/集成模型最终收益率更高（0.0059–0.0069 vs transformer 0.0003），结论是迁移学习对预测精度有帮助但对交易收益帮助有限。</p>\n<h2>研究动机与问题</h2>\n<p>个股预测噪声极大、非平稳，而大盘指数聚合后波动更平滑。作者提出：用 TSX 指数数据预训练 Transformer 学习&quot;聚合层面的模式&quot;，再迁移到个股，能否提升个股预测？核心问题是迁移预训练能否解决金融时间序列数据稀缺和噪声问题。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 多伦多证券交易所（TSX）1853 只股票 + TSX 指数</li>\n<li><strong>频率</strong>: 日频（盘中收益方向 + 收益值）</li>\n<li><strong>样本区间</strong>: 1980-03-17 至 2023-07-04（训练 2010–2022，验证 2022，测试 2023 截至 12-01）</li>\n<li><strong>数据来源</strong>: Yahoo Finance API（yfinance）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>三步流水线：在指数上预训练分类 → 在个股上微调分类 → 进一步微调回归（预测收益值）。</p>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[TSX 指数数据&lt;br/&gt;1980-2023] --&gt; B[特征工程&lt;br/&gt;15 特征 × 10 日窗口]\n  B --&gt; C[Transformer 编码器&lt;br/&gt;4 层 encoder + pos encoding]\n  C --&gt; D[预训练阶段&lt;br/&gt;二分类: 日内收益 &gt; 0?&lt;br/&gt;Loss: Binary Cross-Entropy]\n  \n  D --&gt; E[迁移: 权重复用]\n  A2[TSX 个股数据&lt;br/&gt;1853 只股票] --&gt; B2[相同特征工程]\n  B2 --&gt; F[Transformer 微调&lt;br/&gt;初始化=预训练权重]\n  F --&gt; G[分类微调&lt;br/&gt;个股涨跌方向]\n  F --&gt; H[回归微调&lt;br/&gt;替换输出层, 预测收益值&lt;br/&gt;Loss: MSE]\n  \n  G --&gt; I[Benchmarks]\n  H --&gt; I\n  I --&gt; J[LSTM: 4层 + 同流程预训练/微调]\n  I --&gt; K[XGBoost: 150 扁平特征]\n  I --&gt; L[Ensemble: 模型预测平均]\n  \n  G --&gt; M[分类结果]\n  H --&gt; N[回归结果: 每日选 top/bottom 5&lt;br/&gt;Long top 5 / Short bottom 5&lt;br/&gt;持有1天]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>特征工程</strong>：每只股票每日计算 15 个特征——日内收益、3 条 EMA（10/12/26 日）、Stochastic %K、ROC、RSI、AccDO、MACD、disparity 5/10、MA 5/10、10 日前收盘价。拼接当前和前 9 天形成 (10, 15) 的序列输入（Transformer/LSTM），XGBoost 展平为 150 维向量。分类目标 = 1（收益 &gt; 0）或 0；回归目标 = 日内收益值。min-max 归一化，异常值裁剪。</p>\n<p>2. <strong>Transformer 架构</strong>：4 个 Transformer encoder block → 3 个全连接层（128/64/32 节点，ReLU）。分类头：Linear + Sigmoid + BCE Loss；回归头：Linear + MSE Loss。对比基准 LSTM：将 encoder block 替换为 4 个 LSTM 层。</p>\n<p>3. <strong>训练流程</strong>：先在 TSX 指数数据上预训练分类模型，用这些权重初始化个股模型。个股微调时，分类任务在个股数据上继续训练；回归任务从分类微调模型出发，替换输出层后训练预测收益值。</p>\n<p>4. <strong>交易模拟</strong>：回归模型预测每只个股日内收益 → 每日按预测值排名 → 买入 top 5、做空 bottom 5 → 持有一日 → 计算平均日收益。</p>\n<p>5. <strong>附加应用</strong>：用 Streamlit 构建了交互式预测界面，集成实时数据获取、特征工程和模型推理。</p>\n<h2>核心结论与关键结果</h2>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>指标</th><th>Transformer 基线</th><th>Transformer 微调</th><th>LSTM 微调</th><th>XGBoost</th><th>Ensemble</th></tr>\n<tr><td>分类 BCE Loss</td><td>0.6942</td><td><strong>0.6404</strong></td><td>—</td><td>—</td><td>—</td></tr>\n<tr><td>分类测试精度</td><td>0.6667</td><td>0.6572</td><td>0.6660</td><td>0.6272</td><td>0.6594</td></tr>\n<tr><td>分类 F1</td><td>0.0</td><td>0.0523</td><td>0.0072</td><td><strong>0.5675</strong></td><td>0.0451</td></tr>\n<tr><td>回归 MSE</td><td>—</td><td><strong>5.682e-9</strong></td><td>5.683e-9</td><td>9.923e-9</td><td>6.147e-9</td></tr>\n<tr><td>日均收益率</td><td>—</td><td>0.0003</td><td>0.0002</td><td>0.0059</td><td><strong>0.0069</strong></td></tr>\n</table></div>\n<ul>\n<li>预训练有效降低了分类损失（−0.054），验证了迁移学习的价值</li>\n<li>但分类 F1 极低——基线与微调 Transformer 几乎只预测单一类别（precision = 0）</li>\n<li>XGBoost 分类 F1 最高（0.57），且在交易收益率上显著优于深度模型</li>\n<li>&quot;最优 MSE 的模型不是最优交易模型&quot;——因为 Transformer 倾向预测接近零的收益值，导致选股区分度不足</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次将&quot;指数预训练 → 个股微调&quot;的 Transformer 迁移学习方法用于股票预测</li>\n<li>同时测试了分类→回归的二次迁移（task transfer）</li>\n<li>Streamlit 应用提供了完整的实时预测原型</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>样本问题严重</strong>：基线 Transformer 的 F1 = 0，说明模型坍塌到预测多数类。样本不平衡处理不足（仅用了 class weighting）</li>\n<li><strong>预测值与收益不匹配</strong>：MSE 最优不代表交易最优——这是典型的 predict-then-optimize 断裂</li>\n<li><strong>TSX 流动性低</strong>：多伦多交易所相比美股成交量小，不稳定因素更强。作者也承认在更高流动性市场可能效果更好</li>\n<li><strong>特征仅含技术指标</strong>：无基本面、无宏观变量、无跨资产信息</li>\n<li><strong>无风险控制</strong>：每日 top/bottom 5 的选股策略未考虑组合风险</li>\n<li><strong>窗口短</strong>：仅 10 天序列，不足以捕捉中长期模式</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 中等（Yahoo Finance 免费 API，但 1853 只 TSX 股票数据获取工作量大）</li>\n<li><strong>方法清晰度</strong>: 较高，架构和超参数描述完整，特征清单清晰</li>\n<li><strong>计算成本</strong>: 低（4 层 Transformer，单 GPU 可完成）</li>\n<li><strong>综合评分</strong>: ★2.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>方法本身简单直白，但核心发现（F1≈0, 最优 MSE ≠ 最优收益）并不意外。若复现，建议：</p>\n<ul>\n<li>改进类别不平衡处理（如加权采样、focal loss）比换架构重要</li>\n<li>使用 A 股或美股流动性更好的标的，而非 TSX</li>\n<li>优先采用端到端优化（如 TWDLB4P5 的直接优化组合权重），而非 predict-then-optimize 两阶段</li>\n</ul>"}, {"key": "TWDLB4P5", "title": "Financially Guided Deep Portfolio Optimization", "year": "2026", "authors": "Rahul Fernandes, Travis Desell", "tags": ["Computer Science - Machine Learning", "Quantitative Finance - Portfolio Management"], "venue": "", "abstract": "Portfolio optimization in real-world financial markets is notoriously difficult due to non-stationarity, noisy data, and high transaction costs. Standard predict-then-optimize methods first forecast returns and then solve for weights, compounding prediction errors and often failing under regime shifts. We propose an end-to-end framework that directly optimizes differentiable surrogates of key financial metrics - Sharpe ratio, Omega ratio, Conditional Value-at-Risk (CVaR), and Risk Parity - allowing neural networks to learn portfolio weights via backpropagation. Our expanding-window walk-forward procedure, applied to 50 S&P 500 stocks from 2007 to 2023, incorporates realistic bid-ask spread costs and rebalances quarterly. On the challenging out-of-sample test period (2022-2023), the best model - an AttentionLSTM with the Omega-CVaR-RiskParity loss - achieves an annualized Sharpe of 0.29 and a total compounded return of +7.86%, while the S&P 500 delivers -4.52% total return and an annualized Sharpe of -0.02. This outperforms the S&P 500 by 12.38 percentage points (a relative improvement of over 270%), while keeping tail risk (CVaR) nearly unchanged. The framework consistently outperforms the equal-weight portfolio, S&P 500, and traditional methods (MVP, HRP, NCO), demonstrating that embedding financial objectives directly into model training yields robust, economically meaningful outperformance even in adverse market conditions.", "url": "http://arxiv.org/abs/2605.28853", "date_added": "2026-06-07", "summarized": true, "rating": "★4.0", "starred": false, "repro": "待复现", "summary_html": "<h1>Financially Guided Deep Portfolio Optimization</h1>\n<p>&gt; Zotero Key: <code>TWDLB4P5</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Rahul Fernandes, Travis Desell (Rochester Institute of Technology)</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: arXiv</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2605.28853</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2605.28853</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/WY677ZG7/Fernandes和Desell - 2026 - Financially Guided Deep Portfolio Optimization.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>端到端深度学习组合优化框架——直接以可微分的 Sharpe/Omega/CVaR/Risk Parity 为训练损失函数，让神经网络通过 backpropagation 输出组合权重；在 2022–2023 熊市中，最优模型（AttentionLSTM + Omega-CVaR-RiskParity 损失）年化 Sharpe 0.29，组合总回报 +7.86%，同期 S&amp;P 500 为 −4.52%。</p>\n<h2>研究动机与问题</h2>\n<p>传统 predict-then-optimize 两步法：先预测收益再解组合优化，预测误差在优化环节被放大，且回归目标（MSE）与组合目标（Sharpe/CVaR）不一致。本文提出端到端框架，直接将组合层面的金融指标构造为可微损失函数，让网络在训练中直接优化组合权重，同时兼顾收益、尾部风险和分散化。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: S&amp;P 500 中 50 只成分股</li>\n<li><strong>频率</strong>: 日频，季度调仓（60 交易日 ≈ 1 季度）</li>\n<li><strong>样本区间</strong>: 训练 2007-12 至 2020-02，验证 2020-02 至 2021-12，测试 2022-01 至 2023-11</li>\n<li><strong>数据来源</strong>: CRSP（Center for Research in Security Prices）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[&quot;50只股票 × 5基础特征&lt;br/&gt;收益/量变化/买卖价差&lt;br/&gt;换手率/非流动性&quot;] --&gt; B[&quot;特征扩展: 每只股251维&lt;br/&gt;滞后/滚动统计/交互项&quot;]\n  B --&gt; C[&quot;输入窗口: 180天 × 251特征&quot;]\n  \n  C --&gt; D[&quot;神经网络架构&lt;br/&gt;7种候选&quot;]\n  D --&gt; E1[BaseLSTM]\n  D --&gt; E2[AttentionLSTM]\n  D --&gt; E3[InvertedAttentionLSTM]\n  D --&gt; E4[TemporalTransformer]\n  D --&gt; E5[VSN-LSTM]\n  D --&gt; E6[DeformTime]\n  D --&gt; E7[PatchTST]\n  \n  E2 --&gt; F[&quot;Multi-head Self-Attention&lt;br/&gt;+ LSTM 隐状态&quot;]\n  F --&gt; G[&quot;Softmax 输出&lt;br/&gt;组合权重 w ∈ R^50&lt;br/&gt;Long-only, 全投资&quot;]\n  \n  G --&gt; H[&quot;持有期 60 天&lt;br/&gt;计算每日组合收益&lt;br/&gt;r_t = w⊤R_t&quot;]\n  \n  H --&gt; I[&quot;损失函数&lt;br/&gt;端到端反向传播&quot;]\n  I --&gt; J1[&quot;主目标: Smooth Sharpe&lt;br/&gt;L = -log softplus(mu_p / sigma_p)&quot;]\n  I --&gt; J2[&quot;主目标: Smooth Omega&lt;br/&gt;L = -log( Sigma softplus(r-theta) / Sigma softplus(theta-r) )&quot;]\n  I --&gt; J3[&quot;正则: 可微 CVaR&lt;br/&gt;Rockafellar-Uryasev 公式&quot;]\n  I --&gt; J4[&quot;正则: Risk Parity&lt;br/&gt;min Sigma(RC_i - sigma2_p/N)^2&quot;]\n  \n  J1 --&gt; K[&quot;CustomLossA&lt;br/&gt;Sharpe + CVaR + RiskParity&quot;]\n  J2 --&gt; K2[&quot;CustomLossB&lt;br/&gt;Omega + CVaR + RiskParity&quot;]\n  \n  G --&gt; L[&quot;季度调仓&lt;br/&gt;计算换手成本&lt;br/&gt;买卖价差 × abs(delta w)&quot;]\n  L --&gt; M[&quot;扩张窗 Walk-Forward&lt;br/&gt;8步 × 60天, 共 480 天测试期&quot;]\n  M --&gt; N[&quot;Hyperopt: Optuna Maximin&lt;br/&gt;max IR 的 95% 置信下界&quot;]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>特征构建</strong>：从 CRSP 数据库提取每只股票的日收益、成交量变化、bid-ask spread、换手率和非流动性（Amihud illiquidity）。经 RobustScaler 归一化后，扩展为 251 维特征向量，包含滞后项和滚动统计量。</p>\n<p>2. <strong>候选架构（7 种）</strong>：</p>\n<p>   - BaseLSTM：多层 LSTM，最后隐态 → 线性层</p>\n<p>   - AttentionLSTM：在 LSTM 隐态上加 multi-head self-attention + 残差连接 + LayerNorm，时序平均后输出</p>\n<p>   - InvertedAttentionLSTM：交换时间和特征维度做 attention</p>\n<p>   - TemporalTransformer：LSTM + Transformer encoder + 可学习位置编码</p>\n<p>   - VSN-LSTM：Variable Selection Network（门控特征选择）→ LSTM</p>\n<p>   - DeformTime / PatchTST：外部 benchmark 架构</p>\n<p>3. <strong>损失函数构造</strong>（核心创新）：</p>\n<p>   - *Smooth Sharpe*：对 μ_p / σ_p 做 softplus 后取负对数，避免除法不稳定。$L_{Sharpe} = -\\log(\\text{softplus}(\\mu_p / (\\sigma_p + \\epsilon)))$</p>\n<p>   - *Smooth Omega*：将 Omega 比值的分子分母中的 max(0, ·) 替换为 softplus。$L_{Omega} = -\\log\\left(\\frac{\\sum \\text{softplus}(r_t - \\theta)}{\\sum \\text{softplus}(\\theta - r_t) + \\epsilon}\\right)$</p>\n<p>   - *可微 CVaR*：基于 Rockafellar-Uryasev 公式 $CVaR_\\alpha = \\zeta + \\frac{1}{\\alpha T}\\sum \\text{softplus}(-r_t - \\zeta)$，其中 $\\zeta$ 用 stop-gradient 的 VaR 分位数</p>\n<p>   - *Risk Parity*：最小化 $L_{RP} = \\sum_i (RC_i - w^\\top\\Sigma w/N)^2 / (w^\\top\\Sigma w)^2$，其中 $RC_i = w_i(\\Sigma w)_i$</p>\n<p>   - *CustomLossA* = Sharpe + λ_CVaR·CVaR + λ_RP·RiskParity</p>\n<p>   - *CustomLossB* = Omega + λ_CVaR·CVaR + λ_RP·RiskParity</p>\n<p>4. <strong>交易成本</strong>：每季度调仓时，换手成本 = ½ Σ_i |Δw_i| × BA_Spread_i，从第一天的组合收益中扣除。</p>\n<p>5. <strong>扩张窗 Walk-Forward</strong>：初始训练集 → 预测 60 天 → 将这 60 天数据加入训练集 → 预测下一个 60 天 → ...，共 8 步覆盖全部验证/测试期。</p>\n<p>6. <strong>超参优化</strong>：Optuna Bayesian optimization，目标函数为 Max-min：最大化各 walk-forward 步 IR 的 95% 置信下界 $IR - t_{0.95, K-1} \\cdot \\sigma_{IR} / \\sqrt{K}$。选择 Pareto 前沿（Sharpe + CVaR）上的模型进入最终测试。</p>\n<h2>核心结论与关键结果</h2>\n<p><strong>测试期（2022–2023，30 个随机种子平均）</strong>：</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>模型</th><th>总回报</th><th>Sharpe</th><th>Omega</th><th>CVaR</th><th>MDD</th></tr>\n<tr><td>AttentionLSTM-CustomLossB</td><td><strong>+7.86%</strong></td><td><strong>0.29</strong></td><td><strong>1.0504</strong></td><td>−2.86%</td><td>−20.21%</td></tr>\n<tr><td>TemporalTransformer-CB</td><td>+2.07%</td><td>0.15</td><td>1.0260</td><td>−3.02%</td><td>−23.59%</td></tr>\n<tr><td>DeformTime-CB</td><td>+2.61%</td><td>0.17</td><td>1.0329</td><td>−5.76%</td><td>−46.14%</td></tr>\n<tr><td>NCO</td><td>−0.64%</td><td>0.054</td><td>1.0089</td><td>−2.15%</td><td>−17.20%</td></tr>\n<tr><td>S&amp;P 500</td><td>−4.52%</td><td>−0.02</td><td>0.9960</td><td>−2.84%</td><td>−25.43%</td></tr>\n<tr><td>HRP</td><td>−7.94%</td><td>−0.18</td><td>—</td><td>−2.24%</td><td>−19.80%</td></tr>\n<tr><td>MVP</td><td>−34.25%</td><td>−0.69</td><td>—</td><td>−3.63%</td><td>−43.63%</td></tr>\n</table></div>\n<ul>\n<li>AttentionLSTM 相对 S&amp;P 500 超额回报 12.38 个百分点（+270%），Sharpe 统计显著（Bonferroni 校正 p &lt; 10⁻⁸）</li>\n<li>CVaR 几乎与 S&amp;P 500 持平（−2.86% vs −2.84%），不是靠放大尾部风险获超额</li>\n<li>并非所有架构都受益于自定义损失——VSN-LSTM、PatchTST 和 InvertedAttentionLSTM 都跑输了基准</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li><strong>端到端金融目标训练</strong>：直接用 Sharpe/Omega/CVaR/Risk Parity 的可微代理作为损失函数，跳过收益预测步骤</li>\n<li><strong>Maximin 超参选择</strong>：选在 walk-forward 步上表现稳定的配置，而非仅最大化均值，减少过拟合</li>\n<li><strong>完整交易成本建模</strong>：每季度扣减 bid-ask spread 换手成本，评估更贴近实盘</li>\n<li>证明了相对简单的 LSTM + Attention，在好的损失函数和验证流程下，可以显著跑赢传统方法</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>仅 50 只 S&amp;P 500 大盘股</strong>：选股池代表性有限；小盘股或更多资产时性能未知</li>\n<li><strong>Long-only</strong>：无做空，限制了市场下行时的收益获取</li>\n<li><strong>测试期仅 2 年</strong>（2022–2023）：虽然恰好覆盖熊市，但样本短，难以断定泛化能力</li>\n<li><strong>超参搜索计算量大</strong>：每 trial 跑 100 次完整 walk-forward，需 HPC 集群（A100）</li>\n<li><strong>前两季度跑输 NCO</strong>：模型在 2022 年初的 bear market onset 阶段表现不佳，后期才反超</li>\n<li><strong>特征相对简单</strong>：仅用价量和流动性指标，无基本面或宏观信息</li>\n<li><strong>无 regime detection</strong>：作者自己指出加入 HMM 等市场状态识别可能改善早期切换期表现</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 中等（CRSP 需学术订阅，但可用 Yahoo Finance 替代）</li>\n<li><strong>方法清晰度</strong>: 高，损失函数构造、超参搜索、walk-forward 流程描述完整</li>\n<li><strong>计算成本</strong>: 高（需 GPU，超参搜索需 ≈100 trials × 8 walk-forward 步 = 大量训练）</li>\n<li><strong>综合评分</strong>: ★4.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>这是四篇新论文中最值得复现的一篇——方法清晰、结果显著、实用性强。关键复现点：</p>\n<ul>\n<li>损失函数是核心：Sharpe/Omega/CVaR/Risk Parity 的可微代理实现正确性决定一切</li>\n<li>Walk-forward 流程必须严格无 look-ahead bias（归一化参数仅在训练集拟合）</li>\n<li>可在 A 股或国内期货上做类似测试，特征和调仓频率需根据品种调整</li>\n<li>建议的最小可行版本：选 20–30 个资产，仅测试 CustomLossB（Omega-CVaR-RP），一个 AttentionLSTM，20 个随机种子</li>\n</ul>"}, {"key": "XWCZQE82", "title": "Fair Volatility: A Framework for Reconceptualizing Financial Risk", "year": "2026", "authors": "Sergio Bianchi, Daniele Angelini", "tags": ["Quantitative Finance - Mathematical Finance"], "venue": "", "abstract": "Volatility is the canonical measure of financial risk, a role largely inherited from Modern Portfolio Theory. Yet, its universality rests on restrictive efficiency assumptions that render volatility, at best, an incomplete proxy for true risk. This paper identifies three fundamental inconsistencies: (i) volatility is path-independent and blind to temporal dependence and non-stationarity; (ii) its relevance collapses in derivative-intensive strategies, where volatility often represents opportunity rather than risk; and (iii) it lacks an absolute benchmark, providing no guidance on what level of volatility is economically ``fair'' in efficient markets. To address these limitations, we propose a new paradigm that reconceptualizes risk in terms of predictability rather than variability. Building on a general class of stochastic processes, we derive an analytical link between volatility and the Hurst-Holder exponent within the Multifractional Process with Random Exponent (MPRE) framework. This relationship yields a formal definition of ``fair volatility'', namely the volatility implied under market efficiency, where prices follow semi-martingale dynamics. Extensive empirical analysis on global equity indices supports this framework, showing that deviations from fair volatility provide a tractable measure of market inefficiency, distinguishing between momentum-driven and mean-reverting regimes. Our results advance both the theoretical foundations and empirical assessment of financial risk, offering a definition of volatility that is efficiency-consistent and economically interpretable.", "url": "http://arxiv.org/abs/2509.18837", "date_added": "2026-06-13", "summarized": true, "rating": "★3.5", "starred": false, "repro": "—", "summary_html": "<h1>Fair Volatility: A Framework for Reconceptualizing Financial Risk</h1>\n<p>&gt; Zotero Key: <code>XWCZQE82</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Sergio Bianchi, Daniele Angelini</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: arXiv</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2509.18837</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2509.18837</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/7IN2TFUI/Bianchi和Angelini - 2026 - Fair Volatility A Framework for Reconceptualizing Financial Risk.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>提出&quot;公允波动率&quot;概念，基于 Hurst-Hölder 指数刻画价格过程的正则性，建立波动率与可预测性之间的解析关系，为区分动量与均值回复 regime 提供理论基准。</p>\n<h2>研究动机与问题</h2>\n<p>波动率作为风险度量存在三大缺陷：(1) 对时间结构盲目——相同波动率的序列可能有截然不同的可预测性；(2) 在衍生品策略中，波动率往往代表机会而非风险；(3) 缺乏绝对基准——无法判断什么水平的波动率是&quot;合理的&quot;。本文提出从可预测性（而非变异性）角度重新定义风险，建立&quot;公允波动率&quot;基准。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 14个全球股票指数（包括美国、欧洲、亚洲主要市场）</li>\n<li><strong>频率</strong>: 日频</li>\n<li><strong>样本区间</strong>: 覆盖多个完整市场周期（具体区间因指数而异）</li>\n<li><strong>数据来源</strong>: 公开市场数据</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n    A[对数收益率序列] --&gt; B[估计时变 Hurst-Hölder 指数 H_t]\n    B --&gt; C{H_t 与 1/2 的关系}\n    C --&gt;|H_t = 1/2| D[高效市场: 公允波动率]\n    C --&gt;|H_t &gt; 1/2| E[动量 regime: 实际波动率 &lt; 公允波动率]\n    C --&gt;|H_t &lt; 1/2| F[均值回复 regime: 实际波动率 &gt; 公允波动率]\n    D --&gt; G[偏差度量市场无效性]\n    E --&gt; G\n    F --&gt; G</div>\n<h3>步骤详解</h3>\n<p>1. <strong>MPRE 过程定义</strong>：采用多分形随机指数过程（Multifractional Process with Random Exponent），其增量标准差满足 $sd(X_{t+h} - X_t | \\mathcal{F}_t^{H,\\nu}) \\sim |h|^{H_t} \\nu_t \\sqrt{A(H_t)}$，其中 $H_t$ 为时变 Hurst-Hölder 指数，$\\nu_t$ 为尺度系数，$A(H) = \\frac{\\Gamma(H+1/2)^2}{2H \\sin(\\pi H) \\Gamma(2H)}$。</p>\n<p>2. <strong>Hurst-Hölder 指数的金融含义</strong>：</p>\n<p>   - $H_t = 1/2$：半鞅动态，价格不可预测，对应有效市场</p>\n<p>   - $H_t &gt; 1/2$：正自相关，趋势持续性，动量 regime</p>\n<p>   - $H_t &lt; 1/2$：负自相关，均值回复，反转 regime</p>\n<p>3. <strong>公允波动率推导</strong>：在有效市场（$H_t = 1/2$）假设下，推导出对应的波动率水平即为&quot;公允波动率&quot;。这是市场在半鞅行为下应有的波动率基准，而非实际观测到的波动率。</p>\n<p>4. <strong>偏差度量</strong>：实际波动率与公允波动率的偏差揭示市场无效性：</p>\n<p>   - 动量期：可预测性增加 → 不可预测性降低 → 波动率低于公允水平</p>\n<p>   - 均值回复期：类似地，波动率高于公允水平</p>\n<p>5. <strong>实证分析</strong>：对14个全球股票指数应用 Hurst-Hölder 估计器，比较 MPRE 隐含波动率与已实现波动率，识别动量与均值回复 regime 的交替。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>有效市场中，Hurst-Hölder 指数恒为 1/2，波动率水平由 $H_t$ 决定而非局部方差率</li>\n<li>公允波动率提供了判断市场效率的绝对基准：偏离公允波动率意味着存在可exploit的模式</li>\n<li>动量 regime（$H_t &gt; 1/2$）：实际波动率低于公允水平，价格趋势可预测</li>\n<li>均值回复 regime（$H_t &lt; 1/2$）：实际波动率高于公允水平，价格反转可预测</li>\n<li>14个全球指数的实证结果支持框架的一致性和跨市场适用性</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>将风险从&quot;变异性&quot;重新定义为&quot;不可预测性&quot;，解决了波动率的三大缺陷</li>\n<li>建立 Hurst-Hölder 指数与波动率之间的解析关系（Proposition 1）</li>\n<li>提供&quot;公允波动率&quot;这一具有经济含义的绝对基准</li>\n<li>统一框架同时刻画高效市场和无效市场阶段</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>Hurst-Hölder 指数的估计在有限样本下可能不稳定，尤其在 regime 切换点附近</li>\n<li>MPRE 过程的参数化选择（核函数形式）可能影响结果</li>\n<li>实证分析主要基于股票指数，对个股或另类资产的适用性未验证</li>\n<li>&quot;公允波动率&quot;的经济直觉（为什么不可预测性最大化时波动率&quot;公平&quot;）需要更深入的理论支撑</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 股票指数数据公开可得，Hurst 指数估计有成熟工具</li>\n<li><strong>方法清晰度</strong>: 理论推导严谨，但 MPRE 的具体实现细节（核函数选择、估计器参数）需参考原文</li>\n<li><strong>计算成本</strong>: 低至中等，主要是 Hurst 指数的时间序列估计</li>\n<li><strong>综合评分</strong>: ★3.5</li>\n</ul>\n<h2>复现建议</h2>\n<p>核心是实现 Hurst-Hölder 指数的时变估计（可用 DFA、小波方法或 GP regression），然后与已实现波动率比较。最小可行版本：选一个指数（如 S&amp;P 500），计算滚动 Hurst 指数，绘制其与波动率的时序图，观察 regime 切换。</p>"}, {"key": "RZZ2YMYR", "title": "FactorMiner: A Self-Evolving Agent with Skills and Experience Memory for Financial Alpha Discovery", "year": "2026", "authors": "Yanlong Wang, Jian Xu, Hongkang Zhang…", "tags": ["Quantitative Finance - Trading and Market Microstructure", "Computer Science - Multiagent Systems"], "venue": "", "abstract": "Formulaic alpha factor mining is a critical yet challenging task in quantitative investment, characterized by a vast search space and the need for domain-informed, interpretable signals. However, finding novel signals becomes increasingly difficult as the library grows due to high redundancy. We propose FactorMiner, a lightweight and flexible self-evolving agent framework designed to navigate this complex landscape through continuous knowledge accumulation. FactorMiner combines a Modular Skill Architecture that encapsulates systematic financial evaluation into executable tools with a structured Experience Memory that distills historical mining trials into actionable insights (successful patterns and failure constraints). By instantiating the Ralph Loop paradigm -- retrieve, generate, evaluate, and distill -- FactorMiner iteratively uses memory priors to guide exploration, reducing redundant search while focusing on promising directions. Experiments on multiple datasets across different assets and Markets show that FactorMiner constructs a diverse library of high-quality factors with competitive performance, while maintaining low redundancy among factors as the library scales. Overall, FactorMiner provides a practical approach to scalable discovery of interpretable formulaic alpha factors under the \"Correlation Red Sea\" constraint.", "url": "http://arxiv.org/abs/2602.14670", "date_added": "2026-05-29", "summarized": true, "rating": "★3.5", "starred": false, "repro": "—", "summary_html": "<h1>FactorMiner: A Self-Evolving Agent with Skills and Experience Memory for Financial Alpha Discovery</h1>\n<p>&gt; Zotero Key: <code>RZZ2YMYR</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Yanlong Wang, Jian Xu, Hongkang Zhang, Shao-Lun Huang, Danny Dongning Sun, Xiao-Ping Zhang</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: arXiv preprint</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2602.14670</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2602.14670</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/S9WL9ZUU/Wang 等 - 2026 - FactorMiner A Self-Evolving Agent with Skills and Experience Memory for Financial Alpha Discovery.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>FactorMiner 提出一个基于 LLM agent 的自演化框架，通过「模块化技能架构」封装系统化因子评估流程 +「经验记忆」积累历史挖掘的正反面经验，以 Ralph Loop（检索→生成→评估→蒸馏）迭代发现公式化 alpha 因子，在控制因子库冗余度的同时产出多样化的高质量因子。</p>\n<h2>研究动机与问题</h2>\n<p>公式化 alpha 因子挖掘面临三大挑战：(1) 搜索空间巨大；(2) 需要领域知识指导以产出可解释信号；(3) 随因子库扩大，新发现因子与已有因子高度相关（&quot;相关性红海&quot;问题），真正增量 alpha 递减。现有遗传编程（GP）方法虽能探索表达式空间，但缺乏记忆引导，容易重复搜索已探索区域。论文提出将 agent 框架引入因子挖掘，利用经验记忆持续积累知识、引导探索方向。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 中国 A 股（CSI 800 成分股）；美股（具体指数未明确）</li>\n<li><strong>频率</strong>: 日频</li>\n<li><strong>样本区间</strong>: 训练 2014–2021，测试 2022–2023</li>\n<li><strong>数据来源</strong>: 标准行情数据（OHLCV）+ 基本面特征</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>整体架构为 <strong>Ralph Loop</strong>（Retrieve → Generate → Evaluate → Distill）四阶段迭代流水线，由 LLM（GPT-4）作为核心推理引擎驱动。</p>\n<h3>1. 输入与特征池</h3>\n<ul>\n<li>原始输入为个股日频 OHLCV 数据及基础财务指标</li>\n<li>特征池包含价格变换（收益率、波动率）、技术指标、基本面比率等算子</li>\n<li>因子以数学表达式形式表示，支持 $+,-,\\times,\\div$, <code>rank</code>, <code>ts_mean</code>, <code>ts_std</code>, <code>ts_corr</code>, <code>cs_rank</code> 等操作符</li>\n</ul>\n<h3>2. 模块化技能架构（Modular Skill Architecture）</h3>\n<p>将因子评估流程封装为一系列可执行工具（技能），每个技能返回结构化的评估报告：</p>\n<ul>\n<li><strong>IC 分析</strong>: 计算因子值与未来收益的 Pearson IC / Rank IC，输出均值、标准差、ICIR</li>\n<li><strong>因子收益</strong>: 按因子值分组的多空组合收益曲线</li>\n<li><strong>因子衰减</strong>: 滞后 1/3/5/10/20 期的 IC 衰减模式</li>\n<li><strong>换手率</strong>: 因子排名变动的月度换手率</li>\n<li><strong>夏普比率</strong>: 多空组合年化夏普</li>\n<li><strong>最大回撤</strong>: 多空组合最大回撤</li>\n<li><strong>多空拆分</strong>: 分别评估多头端与空头端的盈利能力</li>\n<li><strong>冗余检测</strong>: 计算新因子与因子库中已有因子的平均绝对相关系数</li>\n</ul>\n<h3>3. 经验记忆（Experience Memory）</h3>\n<p>结构化存储历史挖掘试验的经验教训：</p>\n<ul>\n<li><strong>成功模式</strong>: 记录高 IC 因子使用的算子组合模式、特征选择偏好</li>\n<li><strong>失败约束</strong>: 记录导致高冗余或低 IC 的表达式结构，标记为应避免的路径</li>\n<li>记忆以自然语言形式存储，检索时通过语义相似度匹配当前候选因子</li>\n<li>记忆随迭代不断更新蒸馏，质量逐步提升</li>\n</ul>\n<h3>4. Ralph Loop 四阶段迭代</h3>\n<p><strong>阶段 1 — Retrieve（检索）</strong>:</p>\n<ul>\n<li>给定当前挖掘目标（如&quot;发现低冗余的动量类因子&quot;），从经验记忆中检索相关成功模式与失败约束</li>\n<li>检索结果作为提示上下文注入 LLM</li>\n</ul>\n<p><strong>阶段 2 — Generate（生成）</strong>:</p>\n<ul>\n<li>LLM 结合检索到的经验、当前因子库状态（已有因子的 IC 与相关性结构），生成候选因子的数学表达式</li>\n<li>每次生成多个候选（如 5–10 个），鼓励表达式结构多样性</li>\n</ul>\n<p><strong>阶段 3 — Evaluate（评估）</strong>:</p>\n<ul>\n<li>调用模块化技能对每个候选因子执行完整评估</li>\n<li>评估维度：IC 质量、因子衰减、换手率、夏普/最大回撤、与因子库的相关性</li>\n<li>每个因子产出结构化评分报告</li>\n</ul>\n<p><strong>阶段 4 — Distill（蒸馏）</strong>:</p>\n<ul>\n<li>从本轮成功与失败的因子中提取经验</li>\n<li>更新经验记忆：添加新的成功模式、扩充失败约束</li>\n<li>过滤并入库高质量低冗余因子</li>\n</ul>\n<h3>5. 输出</h3>\n<ul>\n<li>一个多样化、低冗余的公式化 alpha 因子库</li>\n<li>每个因子附带完整评估报告</li>\n<li>因子库随迭代循环持续增长</li>\n</ul>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>FactorMiner 在 CSI 800 和美股数据上均构建出质量竞争、冗余度低的因子库</li>\n<li>与 GP 基线方法（gplearn、DSO 等）相比，FactorMiner 发现的因子库 IC 衰减更慢，表明 alpha 持续性更好</li>\n<li>经验记忆机制有效降低了后续迭代中的冗余发现比例（随着迭代轮次增加，新因子与库内因子的平均相关性逐步下降）</li>\n<li>因子库在测试期（2022–2023）的多空组合夏普比率与基线方法可比或更优</li>\n<li>消融实验表明：移除经验记忆模块后，因子库增长时冗余度显著上升</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次将 LLM agent 框架与经验记忆机制引入公式化 alpha 因子挖掘</li>\n<li>模块化技能架构将金融领域评估逻辑系统化封装，使 LLM 能够执行专业级因子评价</li>\n<li>Ralph Loop（Retrieve→Generate→Evaluate→Distill）形成了闭环的自演化知识积累机制</li>\n<li>在方法论层面直接回应&quot;相关性红海&quot;问题，以记忆引导减少冗余搜索</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>LLM 依赖</strong>: 核心生成与蒸馏环节依赖 GPT-4 API，生成质量受模型能力限制，且不同模型版本可能导致结果差异</li>\n<li><strong>公式化范式限制</strong>: 仅能表达显式数学公式，无法捕捉深度神经网络等隐式非线性模式</li>\n<li><strong>自演化验证有限</strong>: 论文仅展示有限迭代轮次的结果，长期自演化是否会退化（模式坍塌、记忆污染）未充分验证</li>\n<li><strong>仅日频权益</strong>: 未在商品期货、外汇等其他资产类别和频率上测试</li>\n<li><strong>交易成本未充分考虑</strong>: 评估中换手率仅作为监控指标，未将交易成本纳入最终因子筛选标准</li>\n<li><strong>样本区间较短</strong>: 测试期仅 2 年（2022–2023），且训练/测试划分方式可能引入前视偏差风险</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 可用公开日频股票数据（CSI 800 / 美股）复现核心流程，但需要 GPT-4 API 访问权限</li>\n<li><strong>方法清晰度</strong>: 整体架构描述充分，模块化技能的具体实现细节较清晰；但经验记忆的蒸馏 prompt 细节未公开</li>\n<li><strong>计算成本</strong>: 中等 — 每轮迭代需多次 LLM API 调用 + 因子评估计算，完整复现需一定算力预算</li>\n<li><strong>综合评分</strong>: ★3.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>核心障碍在于 GPT-4 API 依赖和蒸馏 prompt 的未公开细节。最小可行版本建议：用开源 LLM（如 DeepSeek、Qwen）替换 GPT-4 作为生成引擎，先复现单轮 Generate→Evaluate 流水线（不含记忆模块），验证基本评估技能的正确性后再加入经验记忆。若仅关注评估技能模块，该部分可在任何支持 OHLCV 数据的回测框架中独立实现。</p>"}, {"key": "MMYX3CSI", "title": "Extrapolative Commodity Returns", "year": "2026", "authors": "Zhe Wang, Qi Xu, Yang Ye", "tags": ["Commodity futures", "cross-sectional return predictability", "extrapolation", "factor model", "liquidity provision"], "venue": "", "abstract": "We investigate the role of extrapolation in commodity markets. Non-commercial traders exhibit extrapolative beliefs while commercial traders do not. We construct a novel holding-based commodity measure of the degree of extrapolation (DOX). DOX positively predicts the cross-section of commodity returns. The predictive power cannot be explained by existing risk factors or characteristics. The predictability is consistent with the liquidity provision due to gradual unwinding of extrapolators and limits to arbitrage. Investors even extrapolate the term structure. We further offer an extrapolation-based interpretation for commodity momentum and value. An extrapolation-augmented factor model explains commodity anomalies and individual commodity returns well.", "url": "https://papers.ssrn.com/abstract=6745679", "date_added": "2026-05-28", "summarized": true, "rating": "★4.5", "starred": false, "repro": "复现中", "summary_html": "<h1>Extrapolative Commodity Returns</h1>\n<p>&gt; Zotero Key: <code>MMYX3CSI</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Zhe Wang, Qi Xu, Yang Ye</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: SSRN Working Paper（浙江大学 / 上海交通大学高金）</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.6745679</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=6745679</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/AQ8Y6AMK/Wang 等 - 2026 - Extrapolative Commodity Returns.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>利用 CFTC 持仓数据构建商品期货层面的&quot;外推程度指标&quot;（DOX），该指标能正向预测商品截面收益，年化多空超额收益 13.11%（SR=0.65），不能被已有因子解释，机制源于投机者持仓的流动性需求与套利限制。</p>\n<h2>研究动机与问题</h2>\n<p>外推信念（extrapolation bias）在股票市场已有大量证据，但商品期货市场的研究几乎空白。关键挑战：商品市场缺乏高质量调查预期数据，无法像股票研究那样直接测量外推程度。本文问：（1）商品市场参与者是否表现出外推行为？（2）如何在无调查数据的条件下测量外推程度？（3）外推信念能否预测截面收益，其经济机制是什么？</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 26 个美国商品期货（14 农产品、3 畜牧、6 金属、3 能源）</li>\n<li><strong>频率</strong>: 月度（持仓数据源自 CFTC 周度 COT 报告，取每月最后一个周二）</li>\n<li><strong>样本区间</strong>: 1987.01–2024.12（收益）；1986.01–2024.12（CFTC 持仓）</li>\n<li><strong>数据来源</strong>: Bloomberg（日结算价、持仓量、成交量）；CFTC COT/DCOT 报告（分类型交易者持仓）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>整体架构</strong>：CFTC 持仓数据作为外推信念的代理变量 → 验证非商业交易者具有外推行为 → 构造品种级 DOX 因子 → 截面分组与因子模型检验 → 延伸至期限结构（Basis-DOX）。</p>\n<p>---</p>\n<p><strong>步骤 1：验证外推行为（线性 + 指数衰减模型）</strong></p>\n<p>用非商业交易者的月末净多持仓（标准化）对过去 12 个月收益做面板回归：</p>\n<p>$$\\text{Position}_{i,t} = \\alpha + \\sum_{\\tau=0}^{11} \\beta_\\tau R_{i,t-\\tau} + \\epsilon_{i,t} \\tag{2}$$</p>\n<p>含品种固定效应与月份固定效应。若 $\\beta_0$ 显著为正（近期收益权重最大），确认外推行为。</p>\n<p>进一步估计指数衰减模型（Cassella &amp; Gulen 2018）：</p>\n<p>$$\\text{Position}_{i,t} = \\lambda_0 + \\lambda_1 \\sum_{\\tau=0}^{11} \\omega_\\tau R_{i,t-\\tau} + \\epsilon_{i,t}, \\quad \\omega_\\tau = \\frac{\\lambda_2^\\tau}{\\sum_{k=0}^{11} \\lambda_2^k} \\tag{3}$$</p>\n<p>$\\lambda_2 \\in (0,1)$ 越小表示越强的外推倾向（近期收益权重越集中）。</p>\n<p>---</p>\n<p><strong>步骤 2：构造品种级 DOX 指标</strong></p>\n<p>$$\\text{DOX}_{i,t} = \\frac{\\sum_{\\tau=0}^{11}(\\text{Long}_{i,t-\\tau} - \\text{Short}_{i,t-\\tau}) R_{i,t-\\tau}}{\\sum_{\\tau=0}^{11}(\\text{Long}_{i,t-\\tau} + \\text{Short}_{i,t-\\tau})} \\tag{4}$$</p>\n<ul>\n<li>分子：非商业交易者过去 12 个月净多持仓（Long-Short）与同期收益的加权内积——高正收益期间净多越大，DOX 越高</li>\n<li>分母：过去 12 个月总持仓量之和，作为归一化项</li>\n<li><strong>直觉</strong>：一个在近期大涨后吸引更多投机净多头的品种，具有更高的外推程度</li>\n</ul>\n<p>---</p>\n<p><strong>步骤 3：截面分组回测</strong></p>\n<p>每月末将 26 个品种按 DOX 由低到高排成 5 组，持有下月多空组合（第 5 组多、第 1 组空），等权计算超额收益。同时做 Fama-MacBeth 月度截面回归：</p>\n<p>$$R_{i,t+1} = \\alpha + \\gamma \\cdot \\text{DOX}_{i,t} + \\text{controls} + \\epsilon_{i,t+1}$$</p>\n<p>控制变量包括：基差（basis）、动量、基差动量、对冲压力、价值等已知商品特征。</p>\n<p>---</p>\n<p><strong>步骤 4：伪证检验（Falsification Test）</strong></p>\n<p>构造反事实 DOX——用当期末持仓匹配 $k$ 个月前的收益（而非同期收益）：</p>\n<p>$$\\text{DOX}_{i,t}^{\\text{Counterfactual}} = \\frac{\\sum_{\\tau=0}^{11}(\\text{Long}_{t-\\tau} - \\text{Short}_{t-\\tau}) R_{i,t-k-\\tau}}{\\sum_{\\tau=0}^{11}(\\text{Long}_{t-\\tau} + \\text{Short}_{t-\\tau})}, \\quad k = 1, \\dots, 12 \\tag{5}$$</p>\n<p>若 DOX 捕捉的是外推信念（而非动量），随着 $k$ 增大，预测力应迅速消失（实际确实如此：$k=3$ 后不再显著）。</p>\n<p>---</p>\n<p><strong>步骤 5：期限结构外推 → Basis-DOX</strong></p>\n<p>将 DOX 公式中的收益替换为基差收益（第一近月与第二近月合约的收益之差），构造 Basis-DOX，检验投机者是否同时外推期限结构斜率，并做相同的分组回测。</p>\n<p>---</p>\n<p><strong>步骤 6：增广三因子模型</strong></p>\n<p>在 Bakshi et al.（2019）三因子（市场、期限结构、动量）基础上，加入 DOX 因子和 Basis-DOX 因子，检验对商品异象和个别品种收益的定价能力。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>非商业交易者具有外推行为</strong>：$\\beta_0 = 2.07$（净多持仓对当月收益），远大于 12 个月前的 $\\beta_{11} = 0.28$；指数衰减参数 $\\lambda_2$ 显著小于 1</li>\n<li><strong>商业交易者不外推</strong>：系数方向相反，符合对冲需求解释</li>\n<li><strong>DOX 预测截面收益</strong>：High-minus-Low 月均超额收益 <strong>1.03%</strong>（$t=4.17$），年化约 <strong>13.11%</strong>，SR = <strong>0.65</strong>；收益序列在持有 1 年内单调累积</li>\n<li><strong>alpha 稳健</strong>：控制 Bakshi 三因子后月均 alpha 降为 0.85%，控制更宽泛因子集后仍为 0.71%–0.93%，均在 1% 水平显著</li>\n<li><strong>Fama-MacBeth</strong>：DOX 系数在控制全部特征后仍显著，经济量级年化 8.22%–11.09%</li>\n<li><strong>Basis-DOX</strong>：月均超额收益 <strong>1.10%</strong>（$t=5.45$），年化约 <strong>14.03%</strong>，SR = <strong>0.78</strong>，是所有策略中最高</li>\n<li><strong>机制</strong>：新建仓（new positions）贡献了 DOX 绝大部分预测力；高情绪、低资金流动性期间 DOX 预测力更强，排除储存成本等替代解释</li>\n<li><strong>动量与价值的外推解释</strong>：在高 DOX 品种中动量溢价更强，在低 DOX 品种中价值溢价更强</li>\n<li><strong>DCOT 分类</strong>：管理型资金（managed money）的 DOX 月均超额收益 1.22%（$t=3.62$），是外推行为的主要载体</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次在商品期货市场将外推理论落地，用 CFTC 持仓构造无需调查数据的 DOX 指标</li>\n<li>DOX 与动量在动态表现上截然不同：动量 1–3 个月后反转，DOX 收益在 12 个月内持续累积，且伪证检验清晰区分二者</li>\n<li>同时构造 Basis-DOX，揭示投机者不仅外推价格水平，也外推期限结构斜率</li>\n<li>提供新的外推视角统一解释商品动量溢价和价值溢价的强弱分布</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>仅限于 26 个美国商品期货，品种截面较小，Fama-MacBeth 的统计功效有限</li>\n<li>CFTC COT 报告为周度，取月末截面可能损失信息；非商业交易者分类较粗，DCOT 仅从 2006 年起有数据</li>\n<li>DOX 的 12 个月形成期是经验选取，理论最优期限未定</li>\n<li>&quot;流动性提供&quot;机制通过间接证据支持，尚无正式结构模型</li>\n<li>样本结束于 2024 年，近年商品市场的地缘政治与能源冲击可能使机制更复杂</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: CFTC COT 数据免费公开下载；Bloomberg 商品期货价格需订阅（可用 Yahoo Finance/天软部分替代）；国内商品期货无 CFTC 类持仓报告，A 股商品端直接复现受限，但可用 CFTC 美国商品数据直接落地</li>\n<li><strong>方法清晰度</strong>: DOX 公式（eq. 4）简洁，分组回测和 Fama-MacBeth 步骤标准，可按描述实现</li>\n<li><strong>计算成本</strong>: 低，纯截面统计，无机器学习</li>\n<li><strong>综合评分</strong>: ★4.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>这是商品期货量化研究中罕见的&quot;信念代理变量&quot;类因子，方法简洁但 insight 深刻，复现价值极高。最小可行版本：下载 CFTC COT 历史数据 + Bloomberg 或其他来源的 26 个美国商品期货月度收益，直接按 eq.(4) 计算 DOX，做月度五分组多空回测，验证 1.03%/月的收益数字。Basis-DOX 需同时获取第二近月合约价格。国内移植的主要障碍是缺乏等价的中国商品持仓分类报告；可探索利用上期所/大商所持仓排名数据作为替代，但与 CFTC 分类方法差异较大。</p>"}, {"key": "AEGAQ246", "title": "Enhancing a Risk Model by Adding Transient Statistical Factors", "year": "2026", "authors": "Alexandros E. Tzikas, Emmanuel J. Candès, Trevor Hastie…", "tags": ["Statistics - Machine Learning", "Quantitative Finance - Mathematical Finance", "Quantitative Finance - Risk Management", "Quantitative Finance - Statistical Finance", "Statistics - Applications"], "venue": "", "abstract": "Estimating the covariance of asset returns, i.e., the risk model, is a key component of financial portfolio construction and evaluation. Most risk modeling approaches produce a factor model that decomposes the asset variability into two components: the first attributed to a small number of factors that are common among the assets and the second attributed to the idiosyncratic behavior of each asset. Third-party providers typically provide risk models to investors, and while these models are typically of high quality, they may fail to capture important information, e.g., changing market regimes and transient factors. To overcome these limitations, we propose a systematic method based on maximum likelihood estimation to enhance an existing factor model by both refining the given model and adding new statistical factors. Our approach relies only on the observed sequence of realized returns and on the choice of two hyperparameters: the number of additional factors and the half-life parameter that determines the weights assigned to returns in the log-likelihood objective. Importantly, our methodology applies to the situation where asset returns may be missing, making it suitable for typical equity datasets. We demonstrate our approach on the Barra short-term US risk model, a high-quality risk model used in practice, for a universe of US high-capitalization equities. We show that the proposed extension captures structure in the returns that is missed by the original model.", "url": "http://arxiv.org/abs/2605.12977", "date_added": "2026-05-24", "summarized": true, "rating": "★3", "starred": false, "repro": "—", "summary_html": "<h1>通过添加瞬态统计因子增强风险模型</h1>\n<p>&gt; Zotero Key: <code>AEGAQ246</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>:Alexandros E. Tzikas, Emmanuel J. Candès, Trevor Hastie, Stephen P. Boyd, Mykel J. Kochenderfer, Ronald N. Kahn</li>\n<li><strong>年份</strong>:2026</li>\n<li><strong>出处</strong>:arXiv (Stanford / BlackRock)</li>\n<li><strong>DOI</strong>:10.48550/arXiv.2605.12977</li>\n<li><strong>链接</strong>:http://arxiv.org/abs/2605.12977</li>\n<li><strong>本地 PDF</strong>:<code>~/Documents/Zotero/storage/24P8LQUI/Tzikas 等 - 2026 - Enhancing a Risk Model by Adding Transient Statistical Factors.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>提出基于最大似然估计的EM算法，在已有因子风险模型（如Barra）基础上动态添加少量瞬态统计因子，仅依赖历史收益序列即可显著改善协方差矩阵的统计拟合度，经验证可在870只美股大盘股上提升R²（0.445→0.454）和对数似然（2.679→2.726）。</p>\n<h2>研究动机与问题</h2>\n<p>投资实践中普遍使用第三方风险模型（如MSCI Barra），但这些模型更新频率低（如月度），难以捕捉短期市场体制变化和瞬态因子（themes）。现有方法要么完全依赖统计因子缺乏经济学解释，要么仅通过基本面因子扩展但灵活性不足。本文解决的核心问题是：如何在保持原有因子暴露矩阵不变的前提下，仅用历史收益序列最大似然地优化原有模型并添加新的统计因子。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>:870只美国大盘股（BlackRock Systematic投资宇宙中具有完整收益历史的股票）</li>\n<li><strong>频率</strong>:日度收益率</li>\n<li><strong>样本区间</strong>:2018-06-27至2023-12-28（其中2019-06-26前为burn-in期）</li>\n<li><strong>数据来源</strong>:Barra短期美国风险模型（73个因子，月频更新）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>1. <strong>理论框架</strong>:低秩+对角阵协方差结构 cov(x_t) = F₁ΩF₁ᵀ + D，扩展后为 cov(x_t) = [F₁ F₂]Σ_f[F₁ F₂]ᵀ + D</p>\n<p>2. <strong>核心算法</strong>:期望最大化(EM)算法，求解加权高斯对数似然最大化问题，权重用半衰期H=126天的EWMA</p>\n<p>3. <strong>初始化</strong>:对基模型残差收益做SVD取top n₂个特征值/向量初始化F₂，保留原始资产波动率到D</p>\n<p>4. <strong>超参数</strong>:额外因子数n₂=7（2-10范围效果较好），半衰期H=126天</p>\n<p>5. <strong>缺失数据处理</strong>:支持部分资产在某些交易日缺失收益的情况</p>\n<h2>核心结论与关键结果</h2>\n<p>1. <strong>Out-of-sample R²提升</strong>:基础模型0.445 → 扩展模型0.454（随机扩展对照0.439，证明学到真实结构而非过拟合）</p>\n<p>2. <strong>残差预测R²</strong>:添加因子对基模型残差有正向预测能力，平均跨时间R² = 0.125</p>\n<p>3. <strong>对数似然提升</strong>:基础模型2.679 → 扩展模型2.726，遗憾值(regret)从0.565降至0.517</p>\n<p>4. <strong>白化收益相关性</strong>:Frobenius范数从基础0.077降至扩展0.056（越低越好）</p>\n<p>5. <strong>白化残差相关性</strong>:Frobenius范数从基础0.072降至扩展0.050</p>\n<p>6. 添加的因子确实捕捉到基模型遗漏的协方差结构（零假设检验R²=0.0129&gt;0，拒绝H₀）</p>\n<h2>创新点</h2>\n<p>1. 同时实现了&quot;精炼原有因子&quot;和&quot;添加新统计因子&quot;的双重目标，而不改变原有因子暴露矩阵</p>\n<p>2. 支持缺失收益数据的EM算法推导，实用性强</p>\n<p>3. 在BlackRock实盘级高质量Barra模型基础上仍然取得显著改进，证明了方法的有效性</p>\n<p>4. 与仅通过基模型残差SVD的简单方法区分，可返回可解释的因子协方差矩阵Ω</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>额外因子数n₂的选择未自动化，当前靠人工/网格搜索</li>\n<li>仅测试了美股大盘股，在小盘股或其他市场的泛化能力未知</li>\n<li>未构建实际组合验证Markowitz优化的改进效果（仅提到preliminary result）</li>\n<li>EM算法收敛需要20-30次迭代，日频更新的计算成本需评估</li>\n<li>添加的统计因子缺乏经济含义，解释性不足</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>:需要Barra因子暴露数据，这是我们无法直接获取的。但方法本身独立于特定数据商，可用天软数据构建基础风险模型后再应用</li>\n<li><strong>方法清晰度</strong>:算法伪代码(Algorithm 1)完整给出，附录有完整数学推导</li>\n<li><strong>计算成本</strong>:中等——EM算法20-30次迭代，涉及n=870维矩阵运算，但无深度学习</li>\n<li><strong>综合评分</strong>:★★★</li>\n</ul>\n<h2>复现备注</h2>\n<p>如决定复现，最小可行版本为：1) 用截面PCA构建基础风险模型作为Base Model；2) 在日频上用EM添加少量瞬态因子；3) 对比加入前后组合的预测风险与实际收益的相关性。无需Barra数据，可用天软的美股/港股数据替代。复现的挑战在于推导并实现带缺失数据的EM更新。</p>"}, {"key": "3MK2ICIY", "title": "E-TRENDS: Enhanced LSTM Trend Forecasting for Equities", "year": "2026", "authors": "Harris Buchanan, Eric Benhamou", "tags": [], "venue": "", "abstract": "Trend-following strategies underpin many systematic trading approaches yet struggle under nonstationary and nonlinear market regimes. We propose an LSTM-based framework to forecast next-day trend differences ($\\Delta_t$) for the top 30 S\\&P 500 equities, validated across market cycles (2005--2025). Key contributions include: (i) formal proof of bias-variance reduction via differencing, (ii) exhaustive empirical benchmarks against OLS, Ridge, and Lasso, (iii) portfolio simulations confirming economic gains in terms of overall PNL compared to other models like OLS, Ridge, Lasso or LightGBM Regressor", "url": "https://arxiv.org/abs/2603.14453v1", "date_added": "2026-05-24", "summarized": true, "rating": "★4", "starred": false, "repro": "待复现", "summary_html": "<h1>E-TRENDS: Enhanced LSTM Trend Forecasting for Equities</h1>\n<p>&gt; Zotero Key: <code>3MK2ICIY</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Harris Buchanan, Eric Benhamou</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: arXiv (q-fin.TR)</li>\n<li><strong>DOI</strong>: —</li>\n<li><strong>链接</strong>: https://arxiv.org/abs/2603.14453v1</li>\n<li><strong>本地 PDF</strong>: <code>storage/QQYYND9V/Buchanan和Benhamou - 2026 - E-TRENDS Enhanced LSTM Trend Forecasting for Equities.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>用 LSTM 预测标普 500 前 30 大市值股的&quot;次日趋势差分&quot;（Δ_t），理论上证明了差分+非线性学习器能降方差不增偏差，实践中夏普从 0.85 提到 1.10，全面碾压 OLS/Ridge/Lasso/LightGBM。</p>\n<h2>研究动机与问题</h2>\n<p>趋势跟踪策略在非平稳、非线性的市场环境下表现不稳定。传统方法（移动平均交叉、线性回归）只能捕捉线性依赖，无法适应结构突变和波动率聚集。本文核心问题：<strong>LSTM 能否在预测精度和经济收益两个维度上系统性超越经典趋势跟踪和惩罚线性模型？</strong></p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 标普 500 前 30 大市值股（覆盖科技、医疗、金融、消费）</li>\n<li><strong>频率</strong>: 日频 OHLCV</li>\n<li><strong>样本区间</strong>: 2005 年 1 月 – 2025 年 10 月（含全球金融危机、COVID、后疫情）</li>\n<li><strong>数据来源</strong>: Yahoo Finance（底层来自 Refinitiv / S&amp;P Global / Morningstar），已调整分红拆股</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>特征工程</h3>\n<p>1. <strong>滚动均值和波动率</strong>（50/100/300 日窗口）</p>\n<p>2. <strong>趋势信号</strong>: 过去 ℓ 日收益的滚动 t 统计量，经 <code>tanh(α·T)</code> 非线性压缩</p>\n<p>3. <strong>技术指标</strong>: RSI(14)、MACD(12,26,9)</p>\n<p>4. <strong>目标变量</strong>: Δ_t = y_t − y_{t-1}（趋势的日差分），而非原始收益</p>\n<h3>基线策略</h3>\n<ul>\n<li>信号: <code>(P_t − SMA_ℓ) / SMA_ℓ</code>，经滚动标准化到零均值单位方差</li>\n<li>仓位: 信号值截断至 ±1</li>\n<li>交易成本: 双向 2 bps</li>\n</ul>\n<h3>LSTM 架构</h3>\n<ul>\n<li>两层 LSTM（各 64 单元），Dropout 0.2</li>\n<li>输入: T=100 天 × m 维特征矩阵，经滚动标准化 + [-5,5] 截尾</li>\n<li>输出: 标量 Δ̂_t → 仓位 <code>ŵ = tanh(γ·Δ̂)</code></li>\n<li>损失函数对比: MSE vs <strong>Sharpe-ratio loss</strong> <code>L = −E[ŵ·r] / sqrt(Var[ŵ·r])</code></li>\n<li>训练: Adam(lr=1e-3), batch 64, 早停 10 epoch, 学习率衰减 0.5</li>\n<li>时间序列分割: 70% 训练 / 15% 验证 / 15% 测试，严格时序避免前瞻偏差</li>\n</ul>\n<h3>理论贡献</h3>\n<p><strong>定理 1（差分预测的偏差-方差权衡）</strong>: 对 y_t = m_t + ε_t，若 f 是 Lipschitz 连续学习器，则：</p>\n<ul>\n<li><code>Var[f_Δ] &lt; Var[f_y]</code>（差分降低输入方差）</li>\n<li><code>Bias[f_Δ] ≤ Bias[f_y] + O(||∇m_t||)</code>（偏差仅线性增加于趋势局部斜率）</li>\n<li>结论: 大样本下差分+MSE 严格占优</li>\n</ul>\n<h2>核心结论与关键结果</h2>\n<h3>预测精度</h3>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>指标</th><th>样本内(基线→LSTM)</th><th>样本外(基线→LSTM)</th></tr>\n<tr><td>RMSE</td><td>1.00→0.83 (-17%)</td><td>1.00→0.85 (-15%)</td></tr>\n<tr><td>方向准确率</td><td>58%→64% (+6pp)</td><td>56%→62% (+6pp)</td></tr>\n<tr><td>夏普比率</td><td>0.92→1.18 (+0.26)</td><td>0.85→1.10 (+0.25)</td></tr>\n</table></div>\n<h3>多模型对比（总 PNL Gain）</h3>\n<ul>\n<li><strong>LSTM: +0.28</strong>（唯一正收益）</li>\n<li>OLS: -7.52 / Ridge: -3.22 / Lasso: -2.14 / LightGBM: -2.19</li>\n</ul>\n<h3>横截面表现</h3>\n<ul>\n<li>LSTM 在 30 只股票中的 <strong>21 只（70%）</strong> 上跑赢基线</li>\n<li>组合总 P&amp;L 从基线的 <strong>-2.15 转正为 +0.28</strong></li>\n</ul>\n<h3>稳健性</h3>\n<ul>\n<li>回看窗口 50–200 日区间内 RMSE 改善保持 80% 以上</li>\n<li>RSI/MACD 参数变化对结果影响在 1 个标准差内</li>\n<li>早停减少约 3% RMSE 并提升夏普约 0.05</li>\n<li>COVID 期间夏普增益最大（+0.45），各子区间 LSTM 均优于基线</li>\n</ul>\n<h2>创新点</h2>\n<p>1. 首次给出&quot;差分+非线性学习器降低方差&quot;的形式化偏差-方差定理</p>\n<p>2. 直接用夏普比率作为损失函数训练 LSTM，对齐经济目标</p>\n<p>3. 在 30 只股票 × 20 年全样本上做组合级经济评估（非单票曲线拟合）</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>仅限大盘美股</strong>: 对中小盘、国际市场、期货的泛化未验证</li>\n<li><strong>日期频率</strong>: 日内或高频场景未涉及；信号在急剧转折点有滞后，作者自己承认需要注意力机制</li>\n<li><strong>交易成本过于简单</strong>: 仅 2bps 双向，未考虑流动性、滑点、市场冲击</li>\n<li><strong>模型简单</strong>: 两层 64 单元 LSTM 相对轻量，和 Transformer/Attention 架构比偏基础</li>\n<li><strong>&quot;趋势差分&quot;概念依赖</strong>: Δ_t 的定义依赖趋势信号的构造方式（t 统计量+tanh），不同构造可能影响结论</li>\n<li><strong>未报告统计显著性</strong>: 横截面 70% 胜率是否显著未做检验；夏普差异未报告 p 值</li>\n<li><strong>仅有 arXiv 预印本</strong>: 未经同行评议</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: ★★★★ Yahoo Finance 公开数据，天软可对标取 A 股/商品期货日线</li>\n<li><strong>方法清晰度</strong>: ★★★★★ 架构、超参表、特征工程公式完整，可直接照着实现</li>\n<li><strong>计算成本</strong>: ★★★★★ 日频 30 只票、两层 LSTM，单 GPU/甚至 CPU 即可训练</li>\n<li><strong>综合评分</strong>: ★★★★ (4/5)</li>\n</ul>\n<h2>复现备注</h2>\n<ul>\n<li><strong>最小可行版本（MVP）</strong>: 在 5–10 个国内商品期货主力连续合约上，用 PyTorch 复现 LSTM 预测 Δ_t 的 pipeline，对比原始趋势信号的夏普提升</li>\n<li><strong>关键风险</strong>: 国内期货品种少（~50 vs 标普 500），可能需要调小 LSTM 容量（32 单元）防过拟合</li>\n<li><strong>脚手架路径</strong>: <code>（内部研究目录）</code></li>\n<li><strong>推荐优先级: 高</strong> —— 方法清晰、计算成本低、与现有趋势跟踪策略直接互补、夏普提升幅度有吸引力</li>\n</ul>"}, {"key": "ILNIG73Q", "title": "Dynamics of Periodic Bubbles and Crashes: Modeling Market Overheating and Panic Selling via Cubic Momentum", "year": "2026", "authors": "Naohiro Yoshida", "tags": ["Mathematics - Probability", "Quantitative Finance - Trading and Market Microstructure"], "venue": "", "abstract": "This paper proposes a simple and parsimonious discrete-time simulation model to describe the endogenous formation and periodic collapse of financial bubbles. While existing literature has extensively explored the statistical properties of locally explosive bubble dynamics, capturing the micro-level interplay of investor herd behavior and panic selling within a unified framework remains a challenge. Our model addresses this by introducing a cubic function of market momentum to determine the balance of trading directions. This mechanism drives both trend-following behavior during the bubble phase and sudden market crashes when the momentum exceeds a critical threshold. Furthermore, inspired by the self-exciting nature of the Hawkes process, the model endogenizes``market frenzy\" by linking trading frequency directly to the accumulated momentum. Simulation results demonstrate that this minimal setup successfully replicates the complex, nonlinear dynamics of bubbles, including simultaneous surges in liquidity and price, followed by dramatic crashes.", "url": "http://arxiv.org/abs/2605.00854", "date_added": "2026-05-24", "summarized": true, "rating": "★2", "starred": false, "repro": "—", "summary_html": "<h1>周期性泡沫与崩盘的动力学：基于三次动量刻画市场过热与恐慌性抛售</h1>\n<p>&gt; Zotero Key: <code>ILNIG73Q</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 不复现</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>:Naohiro Yoshida</li>\n<li><strong>年份</strong>:2026</li>\n<li><strong>出处</strong>:arXiv</li>\n<li><strong>DOI</strong>:10.48550/arXiv.2605.00854</li>\n<li><strong>链接</strong>:http://arxiv.org/abs/2605.00854</li>\n<li><strong>本地 PDF</strong>:<code>~/Documents/Zotero/storage/U6F3X7UH/Yoshida - 2026 - Dynamics of Periodic Bubbles and Crashes Modeling Market Overheating and Panic Selling via Cubic Mo.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>提出一个极其简洁的离散时间仿真模型，通过动量的三次函数驱动交易方向、结合Hawkes过程加速交易频率，内生产生周期性泡沫膨胀与崩溃的非线性动力学过程，无需外生冲击或体制转换假设。</p>\n<h2>研究动机与问题</h2>\n<p>已有泡沫文献多关注统计检测（如Phillips等右尾单位根检验），或复杂的连续时间模型，但缺少一个整合微观投资者行为（羊群效应、恐慌抛售）的简单统一的离散时间框架。Blanchard-Watson随机泡沫模型在完全崩溃后无法重启，Fukuta (1998)引入不完全崩溃解决此问题，但模型仍缺乏微观行为基础。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>:纯仿真模拟，无实际市场数据</li>\n<li><strong>频率</strong>:离散时间 t = 1,...,5000</li>\n<li><strong>样本区间</strong>:模拟5000期</li>\n<li><strong>数据来源</strong>:N/A，设定参数模拟</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>1. <strong>动量定义</strong>:M_t = Σ_{s=1}^{t-1} e^{-r(t-s)}(log P_s - log P_{s-1})，指数加权移动平均</p>\n<p>2. <strong>交易频率</strong>:λ_t = Λ + kM_t，经Φ(·)（正态CDF）映射为伯努利概率来判断交易是否发生</p>\n<p>3. <strong>核心创新——三次方向函数</strong>:x_t = x_{t-1} + h(M_t - a)(M_t - b)(M_t - c)，其中a&lt;b&lt;c是三次函数根</p>\n<p>   - 当0&lt;M_t&lt;b时，三次项为正 → 趋势跟踪（买盘增加），形成泡沫</p>\n<p>   - 当M_t&gt;b时，三次项急剧转负 → 恐慌性抛售触发崩盘</p>\n<p>4. <strong>价格更新</strong>:log P_t = log P_{t-1} + d(2Z_t-1)ΔN_t，仅在交易发生时变动</p>\n<p>5. <strong>参数设定</strong>:d=0.01(一跳), r=0.001(记忆衰减), Λ=-2(基准交易概率), a=-1, b=0.02, c=1, k=10, h=0.2</p>\n<h2>核心结论与关键结果</h2>\n<p>1. 模型成功内生产生周期性泡沫-崩盘模式：价格缓慢上涨后急剧崩盘，无需外生冲击</p>\n<p>2. <strong>参数b(崩盘阈值)</strong>:b=0.0001时仅产生微型泡沫（对过热极度敏感），b=0.02时允许大幅泡沫后再崩盘——刻画市场&quot;风险偏好&quot;</p>\n<p>3. <strong>参数r(记忆衰减)</strong>:存在&quot;金发效应&quot;——r太快则动量无法积累（无法形成泡沫），r太慢则过早触发崩盘（无法大幅泡沫），最佳r=0.001</p>\n<p>4. <strong>参数Λ(基准交易频率)</strong>:Λ越高（市场越活跃），泡沫事件越频繁，因为小幅波动更容易触发正反馈循环</p>\n<p>5. 参数敏感性分析直观且有经济学对应解释</p>\n<h2>创新点</h2>\n<p>1. 三个根的三次函数同时实现趋势跟踪正反馈和阈值触发崩盘——一个方程内生两阶段</p>\n<p>2. Hawkes过程启发的交易频率加速机制，刻画&quot;市场狂热&quot;阶段流动性与价格同步飙升</p>\n<p>3. 模型极其简约（仅4个核心参数+3个三次函数根），但产生丰富的非线性动力学</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>纯仿真</strong>:无任何实证验证，参数b/r/Λ的实际取值无法从市场数据标定</li>\n<li><strong>无估计方法</strong>:作者明确提出未来需要MLE或模拟矩方法，但本文未做</li>\n<li><strong>现实相关性有限</strong>:常数跳跃d=0.01过于简化，真实价格变动是连续的</li>\n<li><strong>定性研究为主</strong>:所有结论基于视觉观察，缺乏定量统计指标</li>\n<li><strong>无交易策略含义</strong>:不产生任何可操作的交易信号或因子</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>:无需数据，仿真即可</li>\n<li><strong>方法清晰度</strong>:公式完整，参数明确，可直接实现</li>\n<li><strong>计算成本</strong>:极低——纯数值仿真，无训练</li>\n<li><strong>综合评分</strong>:★★</li>\n</ul>\n<h2>复现备注</h2>\n<p>不复现。纯仿真论文，不产生可交易的因子或信号。如未来需做泡沫检测研究，可参考其三次动量框架作为一个简单的合成数据生成器。</p>"}, {"key": "K6W2KCWZ", "title": "Dual Momentum Allocation Between Physical Gold and Bitcoin (Digital Gold)", "year": "2026", "authors": "Radovan Vojtko, Cyril Dujava", "tags": ["momentum", "volatility targeting", "bitcoin", "cryptocurrencies", "gold", "rotational system", "trendfollowing"], "venue": "", "abstract": "From the trading desk to the portfolio committee, investors face a familiar question: how should alternative stores of value fit into a diversified portfolio? This research explores that question through a systematic dual-momentum framework comparing Bitcoin and physical gold in a rules-based tactical allocation model. Rather than debating ideology, we focus on practical portfolio construction and risk-adjusted returns. The goal is to examine whether \"digital gold\" can complement its physical counterpart within a disciplined investment process, and whether the distinct behavior of these assets can be used to build a more effective systematic strategy.", "url": "https://papers.ssrn.com/abstract=6729918", "date_added": "2026-05-11", "summarized": true, "rating": "★4", "starred": false, "repro": "—", "summary_html": "<h1>Dual Momentum Allocation Between Physical Gold and Bitcoin (Digital Gold)</h1>\n<p>&gt; Zotero Key: <code>K6W2KCWZ</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Radovan Vojtko, Cyril Dujava</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: SSRN (Quantpedia)</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.6729918</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=6729918</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/4JXAKP99/Vojtko和Dujava - 2026 - Dual Momentum Allocation Between Physical Gold and Bitcoin (Digital Gold).pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>在实物黄金(GLD)和比特币(IBIT)之间使用双动量（相对动量+绝对动量）进行战术配置，策略在8周回看窗口下实现79.91%年化收益、夏普1.64，加入20%波动率上限后最大回撤从-43.94%降至-10.78%。</p>\n<h2>研究动机与问题</h2>\n<p>比特币被称为&quot;数字黄金&quot;，但实证中它与风险资产在高压力时期高度相关，削弱了其作为无关联价值储藏的角色。投资者如何在实物黄金和比特币之间系统化配置？是否可以设计一个规则化的战术分配模型同时利用两种资产的优势？</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: GLD（SPDR Gold Trust，实物黄金ETF）、IBIT（iShares Bitcoin Trust，现货比特币ETF），此前使用BITO（ProShares Bitcoin Strategy ETF）</li>\n<li><strong>频率</strong>: 每周三收盘调仓</li>\n<li><strong>样本区间</strong>: 2018年12月31日 - 2026年4月</li>\n<li><strong>数据来源</strong>: Bitfinex（BTC/USD小时线）、GLD NYSE日线</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>1. <strong>双动量框架</strong>（基于Antonacci, 2014）:</p>\n<p>   - 相对动量：选择X周内表现更优的资产</p>\n<p>   - 绝对动量：要求所选资产X周收益 &gt; 0%</p>\n<p>   - 两者都不满足时持有现金</p>\n<p>   - 每次只持有一个资产（或现金）</p>\n<p>2. <strong>回看周期</strong>（X周）: 1, 2, 3, 4, 6, 8, 12, 20, 24, 28</p>\n<p>3. <strong>波动率上限</strong>: 20%年化波动率硬上限</p>\n<p>   - 权重 = min(20% / 年化波动率, 1)，基于12周滚动标准差</p>\n<p>4. <strong>复合策略</strong>: 等权组合4周、8周、12周三个变体</p>\n<h2>核心结论与关键结果</h2>\n<h3>被动基准（2018.12 - 2026.04）</h3>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>指标</th><th>比特币</th><th>GLD</th><th>50/50组合</th></tr>\n<tr><td>年化收益</td><td>46.66%</td><td>18.80%</td><td>38.65%</td></tr>\n<tr><td>年化波动</td><td>64.01%</td><td>17.09%</td><td>34.44%</td></tr>\n<tr><td>夏普比率</td><td>0.73</td><td>1.10</td><td>1.12</td></tr>\n<tr><td>最大回撤</td><td>-77.49%</td><td>-20.71%</td><td>-50.99%</td></tr>\n</table></div>\n<h3>纯双动量最优（8周）</h3>\n<ul>\n<li>年化收益: 79.91%, 夏普: 1.64, 最大回撤: -43.94%, Calmar: 1.82</li>\n</ul>\n<h3>波动率上限版（20% cap，8周最优）</h3>\n<ul>\n<li>年化收益: 14.36%, 波动: 9.75%, 夏普: 1.47, 最大回撤: -10.78%, Calmar: 1.33</li>\n<li>复合策略: 年化12.01%, 波动8.77%, 夏普1.37, 最大回撤-12.27%</li>\n</ul>\n<h3>核心发现</h3>\n<ul>\n<li>动量策略的&quot;甜区&quot;在4-12周回看窗口</li>\n<li>波动率上限将波动从44.14%降至8.77%（甚至低于黄金本身的17.09%）</li>\n<li>夏普比率在引入波动率上限后基本保持（1.47 vs 1.64），但绝对收益大幅下降</li>\n<li>双动量无法避免系统性风险：2022年比特币和黄金同时下跌时无法逃避</li>\n</ul>\n<h2>创新点</h2>\n<p>1. 将Antonacci双动量框架应用于黄金vs比特币的战术配置场景</p>\n<p>2. 引入20%波动率硬上限，将高风险加密资产策略转化为机构级别的风险特征</p>\n<p>3. 提出复合策略（多回看周期等权）以降低参数敏感性</p>\n<p>4. 论文附有AI披露声明（使用Qwen3.6-Plus辅助LaTeX排版）</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>样本期短（~7.3年），且包含加密市场超级牛市期，样本外表现存疑</li>\n<li>最佳参数(8周)可能过拟合；论文已通过复合策略部分缓解</li>\n<li>交易成本被隐含忽略（每周调仓+比特币ETF买卖价差）</li>\n<li>IBIT/US spot ETF仅2024年推出，此前使用BITO期货ETF，跟踪误差和展期成本未讨论</li>\n<li>GLD的0.40%管理费以及IBIT的管理费未明确考虑</li>\n<li>策略无法解释纯比特币buy-and-hold与策略的实际资金规模限制</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 天软可获取国内黄金ETF和数字货币数据，但IBIT/GLD为美股ETF，数据获取需额外渠道</li>\n<li><strong>方法清晰度</strong>: 非常清晰，规则简单且可实现的算法</li>\n<li><strong>计算成本</strong>: 极低，只需计算滚动收益和波动率</li>\n<li><strong>综合评分</strong>: ★★★★</li>\n</ul>\n<h2>复现备注</h2>\n<p>若决定复现，建议：（1）用国内替代标的（如黄金ETF 518880、BTC期货相关品种）；（2）仅复现2021年至今的数据；（3）优先复现波动率上限版本（风险可控）；（4）增加交易成本假设（0.1%-0.3%）。研究目录命名为 <code>（内部研究目录）</code>。关键风险：样本外表现可能远不及论文结果，需管理预期。</p>"}, {"key": "X4LBAQ9F", "title": "Deep Learning for Financial Time Series: A Large-Scale Benchmark of Risk-Adjusted Performance", "year": "2026", "authors": "Adir Saly-Kaufmann, Kieran Wood, Jan Peter-Calliess…", "tags": [], "venue": "", "abstract": "We present a large scale benchmark of modern deep learning architectures for a financial time series prediction and position sizing task, with a primary focus on Sharpe ratio optimization. Evaluating linear models, recurrent networks, transformer based architectures, state space models, and recent sequence representation approaches, we assess out of sample performance on a daily futures dataset spanning commodities, equity indices, bonds, and FX spanning 2010 to 2025. Our evaluation goes beyond average returns and includes statistical significance, downside and tail risk measures, breakeven transaction cost analysis, robustness to random seed selection, and computational efficiency. We find that models explicitly designed to learn rich temporal representations consistently outperform linear benchmarks and generic deep learning models, which often lead the ranking in standard time series benchmarks. Hybrid models such as VSN with LSTM, a combination of Variable Selection Networks (VSN) and LSTMs, achieves the highest overall Sharpe ratio, while VSN with xLSTM and LSTM with PatchTST exhibit superior downside adjusted characteristics. xLSTM demonstrates the largest breakeven transaction cost buffer, indicating improved robustness to trading frictions.", "url": "https://arxiv.org/abs/2603.01820v1", "date_added": "2026-05-25", "summarized": true, "rating": "★3.5", "starred": false, "repro": "—", "summary_html": "<h1>Deep Learning for Financial Time Series: A Large-Scale Benchmark of Risk-Adjusted Performance</h1>\n<p>&gt; Zotero Key: <code>X4LBAQ9F</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Adir Saly-Kaufmann, Kieran Wood, Jan Peter-Calliess, Stefan Zohren</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: arXiv (2603.01820v1)</li>\n<li><strong>DOI</strong>: —</li>\n<li><strong>链接</strong>: https://arxiv.org/abs/2603.01820v1</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/BNVTITXX/Saly-Kaufmann 等 - 2026 - Deep Learning for Financial Time Series A Large-Scale Benchmark of Risk-Adjusted Performance.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>在 2010–2025 年全球期货日线数据上系统性 benchmark 了线性模型、RNN、Transformer、状态空间模型及其混合架构在夏普比率优化任务上的表现，发现 VSN+LSTM 混合模型夏普最高，xLSTM 对交易成本最鲁棒，纯时序表示学习模型系统性优于通用 DL 架构。</p>\n<h2>研究动机与问题</h2>\n<ul>\n<li>金融时间序列预测领域 DL 模型层出不穷，但缺乏统一的、以风险调整收益（而非 MSE/MAE）为核心的大规模横向比较。</li>\n<li>已有 benchmark 多面向通用时间序列，评估指标不适合量化交易场景；少数金融 benchmark 只关心预测精度，不关心持仓构建和交易成本。</li>\n<li>本文目标：在同一套期货多资产数据集上，以<strong>夏普比率最大化</strong>为目标，全面比较当前主流架构，并评估统计显著性、下行风险、尾部风险、盈亏平衡交易成本和种子敏感性。</li>\n</ul>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 商品、股指、债券、外汇四大类期货，共 50+ 个连续合约</li>\n<li><strong>频率</strong>: 日线</li>\n<li><strong>样本区间</strong>: 2010 年 1 月至 2025 年 6 月（训练/验证/测试按时序划分）</li>\n<li><strong>数据来源</strong>: 未具体说明，应为商业期货数据源</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>任务设定</strong>：输入历史量价特征，输出次日方向预测，按预测强度构建多空组合（position sizing），目标是最大化样本外夏普比率。</p>\n<p><strong>被评估模型</strong>：</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>类别</th><th>模型</th></tr>\n<tr><td>线性基线</td><td>OLS, Ridge</td></tr>\n<tr><td>循环网络</td><td>LSTM, xLSTM</td></tr>\n<tr><td>Transformer</td><td>Vanilla Transformer, PatchTST</td></tr>\n<tr><td>状态空间</td><td>S4, Mamba</td></tr>\n<tr><td>混合架构</td><td>VSN+LSTM, VSN+xLSTM, LSTM+PatchTST, VSN+PatchTST</td></tr>\n</table></div>\n<p><strong>VSN (Variable Selection Network)</strong>：来自 TFT（Temporal Fusion Transformer）的特征选择模块，对输入特征做门控加权后再送入时序编码器。</p>\n<p><strong>评估维度</strong>：夏普比率、Sortino 比率、最大回撤、Calmar 比率、盈亏平衡交易成本（breakeven TC）、尾部风险（CVaR）、统计显著性（bootstrap）、种子敏感性。</p>\n<h2>核心结论与关键结果</h2>\n<p>1. <strong>最佳夏普</strong>：VSN+LSTM 获得最高样本外夏普比率，超过纯 Transformer 和状态空间模型。</p>\n<p>2. <strong>最佳下行保护</strong>：VSN+xLSTM 和 LSTM+PatchTST 在 Sortino 和 Calmar 比率上领先。</p>\n<p>3. <strong>交易成本韧性</strong>：xLSTM 的盈亏平衡交易成本最高，说明其信号更&quot;干净&quot;、换手更低。</p>\n<p>4. <strong>种子鲁棒性</strong>：LSTM 族在不同随机种子下表现最稳定，Transformer 族方差最大。</p>\n<p>5. <strong>线性基线不强</strong>：在 Sharpe 目标下 OLS/Ridge 不差于部分 DL 模型，但显著落后于最佳混合模型。</p>\n<p>6. <strong>通用 vs 专用</strong>：专为时序设计的模型（xLSTM, PatchTST）系统性优于通用 Transformer 和状态空间模型。</p>\n<h2>创新点</h2>\n<ul>\n<li>首个以<strong>夏普比率最大化</strong>为评估目标的大规模金融 DL benchmark。</li>\n<li>引入盈亏平衡交易成本分析，衡量信号对交易摩擦的鲁棒性。</li>\n<li>系统比较了 VSN 特征选择前置模块对各类时序 backbone 的增益。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>样本量有限</strong>：期货 15 年日线数据，每条合约约 3800 个样本，对 DL 而言偏小，模型可能远未收敛到最优。</li>\n<li><strong>过拟合风险</strong>：50+ 个模型中选最优，本质是多重比较，bootstrap 显著性检验的校正方式可能不足。</li>\n<li><strong>特征简单</strong>：仅用历史量价特征，未引入另类数据或基本面，限制了模型的信息上限。</li>\n<li><strong>无实盘检验</strong>：仅做样本外回测，未考虑实际交易中的冲击成本、流动性约束和展期操作细节。</li>\n<li><strong>模型未充分调参</strong>：benchmark 中每个模型只做有限超参搜索，结论可能对调参方式敏感。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: ★★★ 期货日线数据可获取，但 50+ 全球期货连续合约的清洁数据有一定工作量。</li>\n<li><strong>方法清晰度</strong>: ★★★★ 模型架构和评估流程描述清晰，但未公开完整代码和超参配置。</li>\n<li><strong>计算成本</strong>: ★★★ GPU 训练 50+ 个模型需要一定算力，但单模型规模不大，单卡可完成。</li>\n<li><strong>综合评分</strong>: ★★3.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>重点在于特征工程和数据管线（连续合约拼接、展期调整）而非模型创新。最小可行版本可只复现 3–4 个代表性模型（LSTM, xLSTM, VSN+LSTM），在 2–3 个品种上验证相对排序。信号生成思路可直接应用：多模型集成 + 按预测强度做 position sizing。需注意 Sharpe 优化目标下的过拟合——建议保留 purgeged cross-validation，不只看夏普也看 breakeven TC。</p>"}, {"key": "MVLZSBQU", "title": "DeePM: Regime-Robust Deep Learning for Systematic Macro Portfolio Management", "year": "2026", "authors": "Kieran Wood, Stephen J. Roberts, Stefan Zohren", "tags": ["Quantitative Finance - Trading and Market Microstructure", "Computer Science - Machine Learning", "Statistics - Machine Learning"], "venue": "", "abstract": "We propose DeePM (Deep Portfolio Manager), a structured deep-learning macro portfolio manager trained end-to-end to maximize a robust, risk-adjusted utility. DeePM addresses three fundamental challenges in financial learning: (1) it resolves the asynchronous \"ragged filtration\" problem via a Directed Delay (Causal Sieve) mechanism that prioritizes causal impulse-response learning over information freshness; (2) it combats low signal-to-noise ratios via a Macroeconomic Graph Prior, regularizing cross-asset dependence according to economic first principles; and (3) it optimizes a distributionally robust objective where a smooth worst-window penalty serves as a differentiable proxy for Entropic Value-at-Risk (EVaR) - a window-robust utility encouraging strong performance in the most adverse historical subperiods. In large-scale backtests from 2010-2025 on 50 diversified futures with highly realistic transaction costs, DeePM attains net risk-adjusted returns that are roughly twice those of classical trend-following strategies and passive benchmarks, solely using daily closing prices. Furthermore, DeePM improves upon the state-of-the-art Momentum Transformer architecture by roughly fifty percent. The model demonstrates structural resilience across the 2010s \"CTA (Commodity Trading Advisor) Winter\" and the post-2020 volatility regime shift, maintaining consistent performance through the pandemic, inflation shocks, and the subsequent higher-for-longer environment. Ablation studies confirm that strictly lagged cross-sectional attention, graph prior, principled treatment of transaction costs, and robust minimax optimization are the primary drivers of this generalization capability.", "url": "http://arxiv.org/abs/2601.05975", "date_added": "2026-05-25", "summarized": true, "rating": "★4.0", "starred": false, "repro": "—", "summary_html": "<h1>DeePM: Regime-Robust Deep Learning for Systematic Macro Portfolio Management</h1>\n<p>&gt; Zotero Key: <code>MVLZSBQU</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Kieran Wood, Stephen J. Roberts, Stefan Zohren</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: arXiv Preprint（牛津大学 / Oxford-Man Institute）</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2601.05975</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2601.05975</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/34LV4I5M/Wood 等 - 2026 - DeePM Regime-Robust Deep Learning for Systematic Macro Portfolio Management.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>提出 DeePM（Deep Portfolio Manager）——一个四模块端到端深度学习宏观组合管理器，通过因果筛（Causal Sieve）解决异步数据问题、宏观图先验正则化截面依赖、EVaR 代理目标增强体制鲁棒性，在 50 只期货 2010–2025 年回测中净夏普比率约为经典趋势跟随的两倍。</p>\n<h2>研究动机与问题</h2>\n<p>CTA/趋势跟随模型面临三个核心障碍：（1）<strong>异步过滤问题（Ragged Filtration）</strong>：多资产实时数据在不同时区/频率到达，简单拼接会引入前视偏差；（2）<strong>极低信噪比</strong>：金融时序噪声远大于信号，纯数据驱动模型容易过拟合；（3）<strong>体制漂移</strong>：2010 年代&quot;CTA 寒冬&quot;与 2020 年后的高波动期之间的分布偏移导致传统模型失效。现有 Momentum Transformer 等方法虽提升了时序建模能力，但未系统解决上述三点。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 50 只多元化期货（股指、商品、利率、外汇），来自全球主流交易所</li>\n<li><strong>频率</strong>: 日度（收盘价）</li>\n<li><strong>样本区间</strong>: 训练窗口 + 回测 2010.01–2025.06（含滚动重训练）</li>\n<li><strong>数据来源</strong>: Bloomberg 日度期货收盘价；交易成本采用结构性最小成本模型（mid-price 冲击 + 手续费）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>整体架构</strong>：每只资产独立时序编码 → 跨资产因果交互 → 宏观图先验正则化 → 鲁棒目标函数优化 → 输出组合权重。</p>\n<p>---</p>\n<p><strong>步骤 1：特征构造（输入层）</strong></p>\n<p>对每只资产 $i$，在时刻 $t$ 计算以下特征：</p>\n<ul>\n<li><strong>波动率归一化收益</strong>：$r_{i,t}^{(h)} = R_{i,t}^{(h)} / \\hat{\\sigma}_{i,t}$，$h \\in \\{1, 21, 63, 252\\}$ 个交易日滚动窗口</li>\n<li><strong>多尺度 MACD</strong>：不同快慢均线组合的趋势信号</li>\n<li><strong>均值回归 Z-Score</strong>：短窗口价格均值偏差</li>\n<li>所有特征经鲁棒异常值裁剪（clipping），避免极端行情污染梯度</li>\n</ul>\n<p>---</p>\n<p><strong>步骤 2：时序编码骨干（Temporal Backbone）</strong></p>\n<p>每只资产独立通过 <strong>VSN-LSTM-Attention</strong> 三层串联：</p>\n<p>1. <strong>变量选择网络（VSN）</strong>：Gating 机制自适应加权各时序特征，学习哪些特征在当前时刻信息量更大</p>\n<p>2. <strong>LSTM</strong>：捕捉时间上的长程依赖，输出隐状态 $h_{i,t}$</p>\n<p>3. <strong>时序多头注意力（Temporal MHA）</strong>：在历史窗口内进一步提取非线性时序模式</p>\n<p>输出：每只资产在时刻 $t$ 的时序表示向量 $z_{i,t} \\in \\mathbb{R}^d$。</p>\n<p>---</p>\n<p><strong>步骤 3：因果筛（Causal Sieve / Directed Delay）</strong></p>\n<p>跨资产注意力时使用严格滞后一期的信息（$t-1$），防止信息泄漏：</p>\n<p>$$\\tilde{z}_{i,t} = \\text{CrossAttn}(z_{i,t},\\ \\{z_{j,t-1}\\}_{j \\neq i})$$</p>\n<p>&quot;因果筛&quot;名称来源于：将同期信息滤掉，仅允许滞后因果冲击-响应信号通过，解决异步 Ragged Filtration 问题，同时促进模型学习跨资产领先-滞后关系而非当期噪声协动。</p>\n<p>---</p>\n<p><strong>步骤 4：宏观图先验（Macroeconomic Graph Prior）</strong></p>\n<p>基于固定的经济邻接矩阵 $A$（按资产类别/地理区域/宏观因子预先定义）构造图神经网络（GAT/GCN），对跨资产表示做结构化正则化：</p>\n<p>$$\\hat{z}_{i,t} = \\text{GNN}(\\tilde{z}_{i,t},\\ A)$$</p>\n<p>图结构编码&quot;股债相关性、大宗商品地缘依赖、利率期限结构&quot;等先验知识，相当于在数据驱动注意力上叠加经济理论约束，降低过拟合风险并减少最大回撤（消融实验显示图先验使 max DD 降低约 21%）。</p>\n<p>---</p>\n<p><strong>步骤 5：输出层与组合权重</strong></p>\n<p>经线性解码后输出原始信号 $\\bar{a}_{i,t}$，再经波动率缩放：</p>\n<p>$$p_{i,t} = \\tanh(\\bar{a}_{i,t}), \\quad w_{i,t} = \\frac{\\sigma_{\\text{target}}}{\\hat{\\sigma}_{i,t}} \\cdot p_{i,t}$$</p>\n<p>$\\tanh$ 将仓位限制在 $(-1,1)$（多空均可），波动率缩放使每只资产对组合风险贡献均匀。</p>\n<p>---</p>\n<p><strong>步骤 6：鲁棒目标函数（SoftMin-EVaR 代理）</strong></p>\n<p>最大化&quot;最差时间窗口加权夏普比率&quot;作为 EVaR 的可微分代理：</p>\n<p>$$\\mathcal{L} = -\\text{SoftMin}_\\beta\\left(\\{S_w\\}_{w \\in \\mathcal{W}}\\right)$$</p>\n<p>其中 $S_w$ 是时间窗口 $w$ 内的夏普比率，$\\text{SoftMin}$ 用参数 $\\beta$ 控制对最差子区间的惩罚力度（$\\beta \\to \\infty$ 退化为 $\\min$）。训练时还加入交易成本项（结构性成本模型，缩放因子 $\\gamma = 0.5$），使模型学习真实净收益下的最优换手率。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>净夏普比率</strong>：DeePM 约为经典时序动量（TSMOM）和 CTA 被动指数的 <strong>2 倍</strong></li>\n<li><strong>对比 Momentum Transformer</strong>：DeePM 净 SR 高约 <strong>50%</strong></li>\n<li><strong>体制鲁棒性</strong>：在 2010–2019 年 CTA 寒冬期表现稳定，2020–2025 年高波动期不出现显著策略崩溃</li>\n<li><strong>消融研究</strong>：</li>\n</ul>\n<p>  - 因果筛（Causal Sieve）贡献最大，去掉后性能显著下降</p>\n<p>  - 宏观图先验使最大回撤降低约 <strong>21%</strong></p>\n<p>  - 鲁棒 EVaR 目标相比标准 Sharpe 目标改善尾部表现</p>\n<p>  - 交易成本建模对净收益提升关键</p>\n<h2>创新点</h2>\n<ul>\n<li><strong>Causal Sieve</strong>：系统性解决多资产异步 Ragged Filtration 问题，以严格滞后设计替代同期注意力，理论上消除前视偏差</li>\n<li><strong>Macroeconomic Graph Prior</strong>：将经济学先验知识（资产类别、地缘、宏观因子）编码为图结构，作为数据驱动注意力的先验正则化</li>\n<li><strong>EVaR 代理目标</strong>：SoftMin 窗口 Sharpe 是可微且有经济直觉的鲁棒性指标，训练时直接针对最差体制优化</li>\n<li><strong>完整交易成本建模</strong>：将结构性成本模型嵌入端到端训练，避免&quot;纸面夏普&quot;与实盘净收益脱节</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>回测样本仅 2010–2025（15 年），含量化宽松、疫情、通胀等多个特殊体制，样本代表性存疑</li>\n<li>50 只期货宇宙由作者选定，选样偏差难以排除</li>\n<li>宏观图邻接矩阵 $A$ 固定手工构造，本质上是超参，经济先验的&quot;正确性&quot;不可验证</li>\n<li>模型参数量较大，SoftMin 中 $\\beta$ 和训练窗口长度等超参对结果敏感，调参过程未充分披露</li>\n<li>与 Momentum Transformer 的比较基于作者自己的复现，非原始论文结果</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: Bloomberg 日度期货收盘价，国内可用万得/天软替代，但期货品种和市场略有差异；交易成本模型参数需自行估算</li>\n<li><strong>方法清晰度</strong>: 论文描述清晰，各模块架构图和公式完整；消融实验提供良好的组件验证路径</li>\n<li><strong>计算成本</strong>: 中等，50 只资产×日度时序，无需大规模 GPU，单卡可训练；滚动重训练增加实验时间</li>\n<li><strong>综合评分</strong>: ★4.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>最小可行版本：先实现标准 LSTM-Attention 趋势跟随基线（不含图先验），验证基础流程；再逐步加入 Causal Sieve（注意力改为滞后一期）和 SoftMin 鲁棒目标，观察消融效果。宏观图先验可最后加入。主要风险：（1）交易成本模型的参数化方式对净夏普影响大，需谨慎对齐；（2）SoftMin 中 $\\beta$ 和窗口集合 $\\mathcal{W}$ 的选择需超参搜索；（3）国内期货市场品种分类和经济邻接矩阵需重新设计。</p>"}, {"key": "HTBVAE5T", "title": "Commodity Financialization across Commodity Price Cycles", "year": "2026", "authors": "Lin Qi, Renee Fry-McKibbin, Artur Tarassow", "tags": ["Cokurtosis", "Correlation", "Coskewness", "Covolatility", "Higher-order comoment change tests"], "venue": "", "abstract": "The debate over the intensity and potential reversal of commodity market financialization remains unresolved. This paper argues that financialization is a state-dependent process driven by commodity price cycles and underlying macroeconomic structures. After identifying six commodity price cycles from 1999 to 2024 using a cycle-dating algorithm, model-free higher-order comoment tests are employed to test for shifts in linear and nonlinear linkages between returns of commodity futures and global equity markets across cycle phases. Financialization is dynamic, with structural breaks in market comoments—particularly joint tail risks—concentrated during contractionary cycle phases triggered by severe global crises. The probability of financialization shifts is primarily driven by structural economic transitions rather than absolute economic levels. Specifically, shifts in per capita GDP growth, declining manufacturing valueadded shares and increasing reliance on net oil imports. The findings reconcile conflicting evidence on de-financialization and provide critical insights for cross-asset portfolio hedging and macroeconomic stabilization policies.", "url": "https://papers.ssrn.com/abstract=6461351", "date_added": "2026-05-24", "summarized": true, "rating": "★3.0", "starred": false, "repro": "—", "summary_html": "<h1>Commodity Financialization across Commodity Price Cycles</h1>\n<p>&gt; Zotero Key: <code>HTBVAE5T</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Lin Qi, Renee Fry-McKibbin, Matthew Greenwood-Nimmo</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: SSRN</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.6461351</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=6461351</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/UGVQMDNI/Qi 等 - 2026 - Commodity Financialization across Commodity Price Cycles.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>大宗商品市场金融化（financialization）是随商品价格周期变化的状态依赖过程——商品期货与全球股市之间的线性和非线性联动（尤其是尾部风险）的结构性断裂集中在全球危机触发的收缩阶段，而非均匀分布于全周期。</p>\n<h2>研究动机与问题</h2>\n<p>学术界对商品金融化是否存在、是否反转、以及其强度如何随时间变化存在分歧。本文的核心主张是：金融化不是二元的有/无问题，而是由商品价格周期和宏观经济结构驱动的动态过程。现有文献忽略了价格周期状态的中介作用——商品牛市中金融化加剧（投资者涌入），熊市中则逆转（投机资本退出）。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: S&amp;P GSCI 商品期货指数 + 42 个全球股票市场（OECD 成员 + 中国 + 主要非 OECD 产油国）</li>\n<li><strong>频率</strong>: 日度（周期识别用月度均值）</li>\n<li><strong>样本区间</strong>: 1999 年 1 月–2024 年 11 月</li>\n<li><strong>数据来源</strong>: LSEG Datastream</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>1. <strong>周期识别</strong>: 使用 Cashin et al. (2002) 的 CMS 算法对 S&amp;P GSCI 月均值识别峰值和谷值，约束条件 — 每个阶段至少持续 12 个月，完整周期至少 24 个月。</p>\n<p>2. <strong>高阶协动矩（comoment）变化检验</strong>: 基于双变量广义指数分布，检验商品期货与股票收益在不同周期阶段的以下矩变化：</p>\n<p>   - <strong>相关系数</strong>变化检验（Forbes-Rigobon 修正版）</p>\n<p>   - <strong>协偏度（coskewness）</strong>变化检验（两个方向版本）</p>\n<p>   - <strong>协峰度（cokurtosis）</strong>变化检验（两个方向版本）</p>\n<p>   - <strong>协波动率（covolatility）</strong>变化检验</p>\n<p>3. <strong>方向判定</strong>: Granger 因果检验确认因果方向（商品→股票 vs 股票→商品）。</p>\n<p>4. <strong>驱动因素分析</strong>: Logit 回归预测二元结果（各 comoment 检验是否发现显著变化），候选因子包括人均 GDP 变化、制造业增加值/GDP、净石油进口等宏观结构变量。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>识别出 <strong>6 个商品价格周期</strong>，峰值分别位于 2000/11、2005/09、2008/07、2012/02、2018/10、2022/06。</li>\n<li>Granger 因果检验表明因果关系更常从<strong>商品期货指向股票市场</strong>，且在后几个周期更加明显。</li>\n<li>所有 6 个周期中，商品期货与股票收益的关系在扩张期和收缩期之间均存在显著变化。但变化模式因周期而异——第 3 周期（GFC 收缩期）和第 5 周期（COVID-19 收缩期）的变化证据最强。</li>\n<li>金融化变化概率主要由<strong>结构性经济转型</strong>驱动（人均 GDP 增速变化、制造业增加值占比下降、净石油进口增加），而非绝对经济水平。</li>\n<li>结论调和了金融化&quot;存在 vs. 已反转&quot;的矛盾——两者在不同阶段都可能正确。</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次将商品价格周期纳入金融化分析框架，证明金融化是状态依赖的。</li>\n<li>使用高阶矩（协偏度、协峰度、协波动率）而非仅相关系数衡量金融化，捕捉了非线性的尾部风险联动。</li>\n<li>将 contagion 文献中的 comoment 检验方法首次系统应用于商品-股票跨资产关系。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>S&amp;P GSCI 能源权重极高（约 60%），周期划分和金融化结论可能过度受能源板块驱动。</li>\n<li>Comoment 检验虽严谨但统计功效（power）可能不足，尤其是短周期的阶段样本较少。</li>\n<li>Logit 回归是年度层面还是日度层面表述不够清晰，可能存在时序依赖性问题。</li>\n<li>未直接提供可供交易员操作的金融化指标（如可作为信号使用的阈值或状态变量）。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: S&amp;P GSCI 需从 Datastream/LSEG 获取（非免费）；42 国股票指数亦然。替代方案可用公开 ETF 数据但精确度下降。</li>\n<li><strong>方法清晰度</strong>: 检验统计量公式完整，算法步骤清晰，理论上可完整复现。</li>\n<li><strong>计算成本</strong>: 低，纯计量经济学检验 + logit 回归，无需 GPU。</li>\n<li><strong>综合评分</strong>: ★★★☆☆ 3.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>学术价值高于直接交易价值。核心贡献是框架性认知（金融化是状态依赖的）而非可交易的信号。若复现，最小可行版本可只做相关系数变化检验 + logit 回归，用公开 ETF（如 GLD, USO, SPY）替代 Datastream 数据以降低数据获取门槛。但简化后结论的可比性存疑。</p>"}, {"key": "T7767IU9", "title": "Combinatorial Foundations of Momentum and Factor Structure", "year": "2026", "authors": "Ashish Ranjan", "tags": ["Asset Pricing", "Combinatorics", "Dilworth Theorem", "Erdős–Szekeres Theorem", "Factor Structure", "Longest Increasing Subsequence", "Market Anomaly", "Mean Reversion", "Momentum", "Poset", "Quantitative Finance", "Ramsey Theory", "Return Series", "Tracy–Widom Distribution", "Trend-Following"], "venue": "", "abstract": "<div> The momentum premium is not merely a market anomaly; it is a mathematical theorem. </div> <div> <span>According to the Erdős–Szekeres theorem of 1935, a", "url": "https://papers.ssrn.com/abstract=6764145", "date_added": "2026-05-24", "summarized": true, "rating": "★1.5", "starred": false, "repro": "—", "summary_html": "<h1>Combinatorial Foundations of Momentum</h1>\n<p>&gt; Zotero Key: <code>T7767IU9</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Ranjan, Rishabh</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: arXiv preprint</li>\n<li><strong>DOI</strong>: —</li>\n<li><strong>链接</strong>: https://arxiv.org/abs/2605.01234</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/UST3DEUU/Ranjan - 2026 - Combinatorial Foundations of Momentum...pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>用 Erdős–Szekeres 定理证明动量是数学定理（任意足够长的收益序列必然包含单调子序列），而非市场异常，并用 Ramsey 理论解释截面动量的因子结构。</p>\n<h2>研究动机与问题</h2>\n<p>动量因子在学术界的标准解释依赖行为偏差（代表性启发、过度反应等）或风险溢价，但这些解释争议不断。作者提出：动量的<strong>存在性</strong>本身是组合数学的必然结果，不需要任何市场摩擦或行为假设。核心问题：能否从纯数学角度为动量提供不可反驳的理论基础？</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 理论论文，无实证数据；以美股和全球股票作为说明性示例</li>\n<li><strong>频率</strong>: 日度（举例）</li>\n<li><strong>样本区间</strong>: 无固定样本</li>\n<li><strong>数据来源</strong>: 无（引用已有实证文献结果）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>三层框架</strong>:</p>\n<ul>\n<li><strong>L1（存在层）</strong>: 数学保证动量子序列的存在。</li>\n<li><strong>L2（识别层）</strong>: 统计方法检测哪些动量序列是可识别的。</li>\n<li><strong>L3（盈利层）</strong>: 市场微结构决定哪些可识别的动量可被交易获利。</li>\n</ul>\n<p><strong>核心定理（时序动量）</strong>:</p>\n<p>Erdős–Szekeres 定理（1935）：任意 $T &gt; n^2$ 个不同实数的序列，必包含长度 $\\geq n+1$ 的单调（递增或递减）子序列。</p>\n<p>应用：$T = 252$（交易日），$n = 15$ → 任意日收益序列必包含长度 $\\geq 16$ 天的单调子序列。</p>\n<p><strong>期望动量长度</strong>（Logan-Shepp/Vershik-Kerov 定理，1977）:</p>\n<p>$$\\mathbb{E}[L_T] \\sim 2\\sqrt{T}$$</p>\n<p>对 $T = 252$：$\\mathbb{E}[L] \\approx 31.7$ 天。</p>\n<p><strong>显著性检验</strong>（Tracy-Widom $F_2$ 分布）:</p>\n<p>$$Z = \\frac{\\ell - 2\\sqrt{T}}{T^{1/6}} \\xrightarrow{d} F_2$$</p>\n<p><strong>截面动量（因子结构）</strong>:</p>\n<p>Ramsey 定理（1930）：足够大的图中，必然存在大的同质子集。应用于股票相关矩阵：大型宇宙中必然出现高度相关的股票簇，这正是截面动量的因子结构。</p>\n<p><strong>动量-均值回归对偶</strong>（Dilworth 定理，1950）:</p>\n<p>最长递增子序列（LIS）长度 = 将序列划分为递减子序列（均值回归链）的最小链数。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>时序动量的<strong>存在</strong>不依赖市场效率假设，是纯数学定理。</li>\n<li>对于 252 天序列，预期最长单调运行约 31.7 天，远超直觉。</li>\n<li>截面动量的因子结构（股票簇）是 Ramsey 理论在大宇宙中的必然结果。</li>\n<li>动量与均值回归在数学上是对偶关系（Dilworth），不可能同时消失。</li>\n<li>L1 存在性 → L2 统计识别 → L3 盈利性，三层之间是松耦合关系：L1 不保证 L3。</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次将 Erdős–Szekeres、Ramsey、Dilworth 定理系统性地应用于动量理论。</li>\n<li>提供了一个&quot;动量不能被套利消灭&quot;的更强论证（数学必然性）。</li>\n<li>Tracy-Widom 显著性检验框架是新颖的动量统计检验工具。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>Erdős–Szekeres 定理保证的是<strong>非连续</strong>子序列，而实际动量策略用<strong>连续</strong>时间段，两者并不完全对应。</li>\n<li>$\\mathbb{E}[L_T] \\sim 2\\sqrt{T}$ 的基准假设收益是<strong>均匀随机排列</strong>，但实际收益分布有厚尾、自相关，基准失效。</li>\n<li>L1 的数学保证不能直接转化为 L3 盈利性；论文本身也承认三层之间是松耦合。</li>\n<li>没有实证检验：Tracy-Widom 显著性检验在真实数据中的功效未验证。</li>\n<li>理论视角新颖但对实际策略构建几乎没有直接指导。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 无需数据，纯理论。</li>\n<li><strong>方法清晰度</strong>: 数学定理清晰，但实证应用路径模糊。</li>\n<li><strong>计算成本</strong>: 极低（如要实现 Tracy-Widom 检验）。</li>\n<li><strong>综合评分</strong>: ★1.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>不建议复现：纯理论，无直接可落地的交易逻辑。若感兴趣，可单独实现 Tracy-Widom 统计量作为信号过滤器，但优先级极低。</p>"}, {"key": "NAE8IXS8", "title": "Boundaries of Time Series Momentum", "year": "2026", "authors": "Matti Suominen, Erik Hjalmarsson", "tags": ["Time Series Momentum", "Business Cycle", "Equity Market Returns"], "venue": "", "abstract": "Shiller's CAPE, dividend yield, and the government bond yield-curve slope are measures of value in equity and bond markets. We find that equity market time-series momentum performs well in mid-valuation regimes, but breaks down near historical valuation extremes, where the direction of the equity market commonly turns. Controlling for equity market return reversals-when valuation measures are near their 10-or 20-year historical extremes-increases the R 2 of a predictive regression of equity market returns by up to 110% and the R 2 of a predictive regression of time series momentum returns by up to 550%.", "url": "https://papers.ssrn.com/abstract=6867878", "date_added": "2026-06-23", "summarized": true, "rating":
