<li><strong>频率</strong>: 日频</li>\n<li><strong>样本区间</strong>: 约 1990–2023（不同资产类起始不同）</li>\n<li><strong>数据来源</strong>: Bloomberg, CRB, Datastream</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>核心变量定义</h3>\n<ul>\n<li><strong>Basis return</strong> = 近期合约收益率 − 远期合约收益率（相邻两个到期月的 return spread）</li>\n<li><strong>Basis reversal signal</strong> = basis return 的滞后一期负系数（Fama-MacBeth 横截面回归或 panel regression）</li>\n<li><strong>新闻敏感度差异</strong> = 近期合约对系统性新闻（如库存报告、宏观数据）的 beta 高于远期合约，导致 basis 在信息冲击日扩大，随后反转</li>\n</ul>\n<h3>回归框架</h3>\n<p>1. <strong>组合层面</strong>：按 basis return 排序做多空组合，计算持有期收益</p>\n<p>2. <strong>Fama-MacBeth</strong>：控制传统展期收益（roll yield）、流动性、波动率后, lag(basis return) 对未来 basis return 的预测系数是否仍显著负</p>\n<p>3. <strong>机制检验</strong>：</p>\n<p>   - 新闻日 vs 非新闻日：basis reversal 在新闻日后更强</p>\n<p>   - 高波动 / 高自相关品种：basis reversal 更强（套利成本更高→反转更剧烈）</p>\n<p>   - 跨期限相关性低的品种：basis reversal 更强</p>\n<h3>跨资产推广</h3>\n<p>同样的回归框架应用于股指期货（不同到期合约）、公司债（不同期限利差）、国债，验证 basis reversal 是否普遍存在。</p>\n<h2>核心结论与关键结果</h2>\n<p>1. <strong>短期基差反转稳健存在</strong>：basis return 的日频负自相关显著，t 值 &gt; 3.0，扣除交易成本后仍正收益</p>\n<p>2. <strong>独立于现有因子</strong>：控制短期反转（单合约）、展期收益、动量和流动性后，basis reversal 的 alpha 依然显著</p>\n<p>3. <strong>新闻敏感度差异是主因</strong>：信息冲击日 basis reversal 幅度约为非新闻日的 2 倍</p>\n<p>4. <strong>套利限制渠道</strong>：高波动、高自相关、跨期限低相关的品种 reversal 更强，consistent with limits-to-arbitrage</p>\n<p>5. <strong>跨资产普适</strong>：股指期货、公司债、国债也存在 basis reversal，说明这是 term structure 资产的共性而非商品特例</p>\n<p>6. <strong>经济意义</strong>：商品期货 basis reversal 策略年化夏普约 1.2–1.8（净成本前），与其他因子低相关</p>\n<h2>创新点</h2>\n<ul>\n<li>发现了一个<strong>全新异象</strong>——短期基差反转，且有清晰的微观结构解释（差异敏感度 + 套利限制）</li>\n<li>横跨商品期货 + 债券 + 股指期货，覆盖面广，非一次性的数据窥探</li>\n<li>通过新闻日 vs 非新闻日的对比 + 套利限制代理变量，建立了一个有说服力的因果叙事</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>交易成本建模不详</strong>：basis reversal 信号涉及相邻合约的双腿操作，实际展期中的 bid-ask spread 和 liquidity 变化可能侵蚀利润，文中成本假设偏乐观</li>\n<li><strong>样本期内是否存在结构性变化</strong>：金融危机后 ETF 和被动资金的涌入可能改变了不同期限的套利效率</li>\n<li><strong>因子拥挤风险</strong>：一旦被广泛复制，basis reversal 可能衰减</li>\n<li><strong>仅做多空组合</strong>：未讨论净多头/净空头变体在实际中的可执行性</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: ★★★★ 商品期货数据较易获取，股指期货和债券数据需拼接</li>\n<li><strong>方法清晰度</strong>: ★★★★★ 构造简单（相邻合约收益率差的自相关），回归框架标准，容易复现</li>\n<li><strong>计算成本</strong>: ★★★★★ 日频信号，计算量很轻</li>\n<li><strong>综合评分</strong>: ★★4.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>近期最值得复现的论文之一。最小可行版本：选取 5–10 个流动性好的商品期货（铜、油、金、豆粕等），计算 daily basis return = near_month_ret − next_month_ret，按 lag(basis_return) 做横截面排序，次日做多低 basis return 品种、做空高 basis return 品种。核心检查点：1) basis reversal 是否独立于单合约短期反转，2) 扣除实际展期成本（bid-ask）后是否仍正收益。如果商品验证成立，可进一步扩展到股指期货（IF/IC/IH）——这是最直接的实盘应用场景。</p>"}, {"key": "P98IHNAP", "title": "Revisiting the Structure of Trend Premia: When Diversification Hides Redundancy", "year": "2025", "authors": "Alban Etienne, Jean-Jacques Ohana, Eric Benhamou…", "tags": [], "venue": "", "abstract": "Recent work has emphasized the diversification benefits of combining trend signals across multiple horizons, with the medium-term window-typically six months to one year-long viewed as the \"sweet spot\" of trend-following. This paper revisits this conventional view by reallocating exposure dynamically across horizons using a Bayesian optimization framework designed to learn the optimal weights assigned to each trend horizon at the asset level. The common practice of equal weighting implicitly assumes that all assets benefit equally from all horizons; we show that this assumption is both theoretically and empirically suboptimal. We first optimize the horizon-level weights at the asset level to maximize the informativeness of trend signals before applying Bayesian graphical models-with sparsity and turnover control-to allocate dynamically across assets. The key finding is that the medium-term band contributes little incremental performance or diversification once short- and long-term components are included. Removing the 125-day layer improves Sharpe ratios and drawdown efficiency while maintaining benchmark correlation. We then rationalize this outcome through a minimum-variance formulation, showing that the medium-term horizon largely overlaps with its neighboring horizons. The resulting \"barbell\" structure-combining short- and long-term trends-captures most of the performance while reducing model complexity. This result challenges the common belief that more horizons always improve diversification and suggests that some forms of time-scale diversification may conceal unnecessary redundancy in trend premia.", "url": "https://arxiv.org/abs/2510.23150v2", "date_added": "2026-05-24", "summarized": true, "rating": "★5", "starred": false, "repro": "已复现", "summary_html": "<h1>Revisiting the Structure of Trend Premia: When Diversification Hides Redundancy</h1>\n<p>&gt; Zotero Key: <code>P98IHNAP</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Alban Etienne, Jean-Jacques Ohana, Eric Benhamou, Beatrice Guez, Ethan Setrouk, Thomas Jacquot</li>\n<li><strong>年份</strong>: 2025</li>\n<li><strong>出处</strong>: arXiv</li>\n<li><strong>DOI</strong>: -</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2510.23150</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/JT68FXTB/Etienne 等 - 2025 - Revisiting the Structure of Trend Premia When Diversification Hides Redundancy.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>传统多周期趋势跟踪策略中(20/60/125/250/500天)，125天中周期层实质上是冗余的，剔除后可提升夏普比率和回撤效率，最优配置呈现&quot;杠铃结构&quot;：仅保留短周期(20天)和长周期(500天)即可捕获绝大部分趋势收益。</p>\n<h2>研究动机与问题</h2>\n<p>过去文献一致认为中周期(6个月-1年)是趋势跟踪的&quot;甜蜜点&quot;，多周期组合提供了时间尺度上的分散化。但本文质疑：不同周期是否真正提供了独立的增量信息？等权配置是否最优？中周期是否与相邻周期高度重叠从而构成冗余？</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 全球商品、权益、固收、外汇期货(GC, CL, NG, ES, NQ, TY, RX, EUR, JPY 等)</li>\n<li><strong>频率</strong>: 日度</li>\n<li><strong>样本区间</strong>: 2015-2025（主回测），部分分析延伸至2005-2025</li>\n<li><strong>数据来源</strong>: 未明确说明，采用多资产期货连续合约</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>1. <strong>因子视角</strong>: 将每个回看周期视为一个独立趋势因子，构造各周期单独的策略收益率序列</p>\n<p>2. <strong>最小方差优化</strong>: 以周期层策略收益的协方差矩阵求解最小方差权重 w* = Σ^(-1)1 / (1^T Σ^(-1)1)</p>\n<p>3. <strong>贝叶斯图模型</strong>: 在资产层面动态分配周期权重，结合稀疏性与换手率约束</p>\n<p>4. <strong>持久性过滤</strong>: 满足标准差&lt;40%分位、自相关&gt;60%分位、最大变化&lt;40%分位的资产才启用优化权重，否则退化为等权</p>\n<p>5. <strong>消融测试</strong>: 逐一剔除各周期层，观察Sharpe、Return/MaxDD、基准相关性的变化</p>\n<p>6. <strong>理论证明(Proposition 2)</strong>: 当相邻周期相关系数 ρ 满足 ρ &gt;= sqrt((1+δ)/2) 时，最优解为杠铃权重 (1/2, 0, 1/2)</p>\n<h2>核心结论与关键结果</h2>\n<p>1. <strong>中周期(125天)是冗余的</strong>:</p>\n<p>   - 剔除125天后整体Z-score最高(+0.80)，Sharpe +0.84，Return/MaxDD +0.96，基准相关性 +0.59</p>\n<p>   - 2015-2025期间，125天层独立Sharpe仅0.21，Return/MaxDD仅0.19，远低于500天的0.47/0.49</p>\n<p>2. <strong>杠铃结构最优</strong>:</p>\n<p>   - 权重分配: 20天 20%, 60天 19.5%, 125天 17%, 250天 19%, 500天 24.5% — 极端周期权重最高</p>\n<p>   - 20天层提供凸性和危机避险(条件Sharpe 0.61-0.65)，500天层提供持久宏观趋势捕获</p>\n<p>3. <strong>CTA Dynamic Trend 优于等权基准</strong>:</p>\n<p>   - 全样本(2013-2025) Sharpe: Dynamic Trend 0.86 vs Pure Trend 0.79，累计超额约8%</p>\n<p>   - 2016-2019弱趋势期改善最显著：Return/MaxDD 0.32 vs 0.18（+78%）</p>\n<p>4. <strong>相关性结构</strong>: 125天与60天(r=0.81)、250天(r=0.84)高度相关；20天与500天仅r=0.35，呈正交性</p>\n<p>5. <strong>危机时期表现</strong>: 剔除125天后条件Sharpe几乎不变(0.63 vs 0.65)，不损害避险能力</p>\n<h2>创新点</h2>\n<p>1. 首次系统性证明中周期在趋势跟踪中的冗余性，提出&quot;杠铃结构&quot;</p>\n<p>2. 结合贝叶斯优化 + 持久性过滤的权重分配框架，有效控制过拟合</p>\n<p>3. 用最小方差框架给出中周期冗余的理论证明</p>\n<p>4. 消融测试方法学为评估因子增量贡献提供可复用的分析范式</p>\n<h2>局限与可质疑处</h2>\n<p>1. 回测窗口较短(2015-2025)，市场结构变化可能影响结论泛化性</p>\n<p>2. 持久性过滤的超参数(40%/60%分位阈值)存在一定的数据依赖</p>\n<p>3. 交易成本假设(2bp交易 + 5-15bp展期)可能低估了实际成本</p>\n<p>4. 贝叶斯图模型的滚动窗口长度(8年)为固定值，未做敏感性分析</p>\n<p>5. 结论主要针对CTA复制基准(NEIXCTAT)，对其他趋势信号框架的适用性待验证</p>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 可用天软获取全球期货日线数据，构造连续合约后计算各周期信号</li>\n<li><strong>方法清晰度</strong>: 方法描述详尽(含公式、算法伪代码、阈值规则)，可直接实现</li>\n<li><strong>计算成本</strong>: 较低 — 贝叶斯优化和图模型无需大规模算力，消融测试为滚动回测框架</li>\n<li><strong>综合评分</strong>: ★★★★★</li>\n</ul>\n<h2>复现备注</h2>\n<ul>\n<li><strong>关键风险点</strong>: 数据频率(日线vs月线)、展期规则差异可能导致信号差异；NEIXCTAT基准不可直接获取</li>\n<li><strong>最小可行版本</strong>: 仅复现消融测试部分——在现有趋势信号框架中逐一剔除周期层，观察IC、IR和夏普变化</li>\n<li><strong>建议 research topic</strong>: <code>trend_barbell_replication</code></li>\n<li><strong>核心可交付</strong>: 1) 5周期单层策略绩效对比表 2) 剔除125天后的杠铃策略回测 3) 持久性过滤的资产筛选清单</li>\n</ul>"}, {"key": "Z4YNKGKB", "title": "Return Stacking and Portable Alpha, an Investor's Guide", "year": "2025", "authors": "Brennan Basnicki, Tim Pickering", "tags": ["trend following", "asset allocation", "alternative investments", "cash efficient investing", "commodity trading advisor", "crisis alpha", "futures trading", "hedge funds", "institutional investing", "managed futures", "portable alpha", "portfolio construction", "quantitative investing", "quantitative strategies", "return stacking", "systematic investing"], "venue": "", "abstract": "This paper examines the evolution of portfolio construction through portable alpha and return stacking, approaches that enhance diversification and capital efficiency while preserving core market exposure. Portable alpha, long employed by large institutional investors, separates beta and alpha by using derivatives or managed accounts to overlay uncorrelated return streams on top of traditional market exposures. Return stacking represents a modern and more accessible extension of this approach, using commingled funds and futures-based strategies to provide dual exposure. Investors can maintain equity, fixed income, or other asset participation while adding complementary strategies such as trend-following CTAs, on top.The paper reviews the historical development of these techniques, including early institutional implementations and public market examples such as PIMCO StocksPLUS and the Catalyst/Millburn Hedge Strategy Fund. It explores the potential benefits of return stacking, including improved risk-adjusted and absolute returns, greater capital efficiency, and behavioral advantages that can help investors maintain discipline. It also highlights key considerations such as style risk, conditional correlations, and the use of leverage.Through historical examples, stress periods, and illustrative portfolio outcomes, this paper provides a framework for investors seeking to integrate uncorrelated return streams into traditional allocations in a practical and scalable way.", "url": "https://papers.ssrn.com/abstract=5382795", "date_added": "2026-05-24", "summarized": true, "rating": "★3.0", "starred": false, "repro": "—", "summary_html": "<h1>Return Stacking and Portable Alpha, an Investor&#x27;s Guide</h1>\n<p>&gt; Zotero Key: <code>Z4YNKGKB</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Brennan Basnicki, Tim Pickering (Auspice Capital)</li>\n<li><strong>年份</strong>: 2025</li>\n<li><strong>出处</strong>: SSRN / Auspice Capital 白皮书</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.5382795</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=5382795</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/ULZAMCD2/Basnicki和Pickering - 2025 - Return Stacking and Portable Alpha, an Investor&#x27;s Guide.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>Return stacking（收益叠加）是 portable alpha 的现代民主化版本——用期货/衍生品以极低的资本占用获得 100% 股票 Beta 暴露，将释放的资本投资于 CTA 趋势跟踪等非相关策略，在不牺牲核心持仓的前提下实现&quot;一份资本、两份暴露&quot;。</p>\n<h2>研究动机与问题</h2>\n<p>传统资产配置的硬约束是&quot;每一分钱只能投一个地方&quot;——增加另类配置就必须减少股票/债券敞口。便携式 Alpha 早在 1990 年代就被大型养老金采用，但需要衍生品专业能力和定制化管理账户，一般投资者无法参与。本文介绍 return stacking 如何通过公募基金结构让所有投资者都能获得类似能力。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: S&amp;P 500 指数期货 + CTA 趋势跟踪策略（BTOP50 / SG Trend 指数）; 案例产品包括 PIMCO StocksPLUS、Millburn Catalyst (MBXIX)</li>\n<li><strong>频率</strong>: 月度/季度</li>\n<li><strong>样本区间</strong>: PIMCO StocksPLUS 自 1993 年; Millburn Catalyst 自 1996 年; BTOP50 自 1987 年</li>\n<li><strong>数据来源</strong>: Bloomberg, Auspice Capital</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>核心框架</h3>\n<p>1. <strong>Portable Alpha 实施</strong>（机构版）:</p>\n<p>   - 选核心 Beta 暴露（如 S&amp;P 500）</p>\n<p>   - 用期货/互换以约 7% 保证金获得 100% Beta 敞口</p>\n<p>   - 剩余 ~93% 资金投资于 Alpha 策略（CTA、对冲基金等）</p>\n<p>2. <strong>Return Stacking</strong>（公募版）:</p>\n<p>   - 用 commingled fund 结构，一份投资同时获得两个收益流</p>\n<p>   - 例：Auspice One Fund — $1 = $1 S&amp;P 500 + $1 Auspice CTA</p>\n<p>3. <strong>关键区分</strong>:</p>\n<p>   - <strong>收敛型风险</strong>（convergent）: 多数传统和另类资产——频繁小赚 + 偶尔巨大亏损（如 carry trade、均值回归、多空股票）——危机中往往失效</p>\n<p>   - <strong>发散型风险</strong>（divergent）: 趋势跟踪 CTA、尾部对冲——频繁小亏 + 偶尔大赚——危机中通常表现优异</p>\n<p>4. <strong>杠杆分类</strong>: 风险叠加型（risk additive，如 2x ETF）、风险中性型（risk neutral，如风险平价）、风险降低型（risk reducing，如 CTA overlay）</p>\n<h2>核心结论与关键结果</h2>\n<p><strong>BTOP50 CTA 在 S&amp;P 500 最差 15 个季度的表现（1987 年以来）</strong>:</p>\n<ul>\n<li>S&amp;P 500 平均: <strong>-15.15%</strong></li>\n<li>BTOP50 CTA 平均: <strong>+5.50%</strong></li>\n<li>超额收益差: <strong>+20.65%</strong></li>\n</ul>\n<p><strong>关键产品业绩</strong>:</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>产品</th><th>年化收益</th><th>Sharpe</th><th>最大回撤</th></tr>\n<tr><td>PIMCO StocksPLUS (1993 起)</td><td>10.67%</td><td>0.79</td><td>-56.78%</td></tr>\n<tr><td>S&amp;P 500 Total Return</td><td>10.54%</td><td>0.81</td><td>-50.96%</td></tr>\n<tr><td>PIMCO StocksPLUS Long Duration (2007 起)</td><td>12.38%</td><td>0.72</td><td>-50.96%</td></tr>\n</table></div>\n<ul>\n<li>2025 年&quot;特朗普关税风暴&quot;中趋势跟踪策略遭遇极端 whipsaw，提示 return stacking 不是完美方案</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>将 portable alpha 的理论和实践系统化为可操作的投资者指南</li>\n<li>明确提出收敛型/发散型风险分类作为策略选择的框架</li>\n<li>区分三种类型的杠杆（叠加/中性/降低），澄清&quot;杠杆=风险放大&quot;的误解</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>行业白皮书性质</strong>——由 Auspice Capital 撰写，其旗舰 CTA 策略是推荐的核心组件，存在明显利益冲突</li>\n<li>历史回测数据经 survivorship 和 selection bias 修饰（展示的是成功产品如 StocksPLUS，失败案例未提）</li>\n<li>&quot;一份资本两份暴露&quot;忽略了期货保证金要求变化的风险——极端市场中保证金可能骤升</li>\n<li>未充分讨论费用结构——CTA + ETF/期货的双层费用会显著侵蚀收益</li>\n<li>2025 年的 whipsaw 表现恰好说明该方法在趋势缺失环境中的脆弱性</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: BTOP50 和 SG Trend 为商业指数，但可用简单趋势跟踪策略替代——S&amp;P 500 期货数据公开可得</li>\n<li><strong>方法清晰度</strong>: 框架清晰，但具体实现细节（保证金管理、再平衡频率、futures roll 处理）不完全</li>\n<li><strong>计算成本</strong>: 低——无需 ML 训练，纯组合构建 + 回测</li>\n<li><strong>综合评分</strong>: ★★★☆☆ 3.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>框架本身值得复现验证：用简单时序动量策略叠加 S&amp;P 500 期货 vs 纯持有 S&amp;P 500，检验长期风险调整后收益是否真实改善。最小可行版本：用公开数据构建 100% S&amp;P 500 期货 + 100% 简易多品种时序动量组合，季度再平衡，重点看在最大回撤事件中的条件相关性是否确实为负。注意与控制组的可比性——总名义敞口 200% 的组合需要和杠杆后的基准对比。</p>"}, {"key": "YEMKR644", "title": "Re-evaluating Short- and Long-Term Trend Factors in CTA Replication: A Bayesian Graphical Approach", "year": "2025", "authors": "Eric Benhamou, Jean-Jacques Ohana, Alban Etienne…", "tags": ["Quantitative Finance - Trading and Market Microstructure", "Quantitative Finance - Statistical Finance", "Quantitative Finance - Pricing of Securities", "Computer Science - Artificial Intelligence"], "venue": "", "abstract": "Commodity Trading Advisors (CTAs) have historically relied on trend-following rules that operate on vastly different horizons from long-term breakouts that capture major directional moves to short-term momentum signals that thrive in fast-moving markets. Despite a large body of work on trend following, the relative merits and interactions of short-versus long-term trend systems remain controversial. This paper adds to the debate by (i) dynamically decomposing CTA returns into short-term trend, long-term trend and market beta factors using a Bayesian graphical model, and (ii) showing how the blend of horizons shapes the strategy's risk-adjusted performance.", "url": "http://arxiv.org/abs/2507.15876", "date_added": "2026-06-27", "summarized": false, "rating": "", "starred": false, "repro": "—", "summary_html": ""}, {"key": "XX7BPG6K", "title": "Not So Smart Alphas", "year": "2025", "authors": "Francois Lhabitant", "tags": ["Alpha", "Active Management", "Hedge Funds"], "venue": "", "abstract": "This note critically examines common methodologies for estimating alpha in actively managed funds and their reliability as measures of manager skill. Standard approaches often conflate genuine skill with statistical artifacts due to oversimplified risk assumptions, imperfect benchmarks, omitted factors, and misattribution of beta timing. Using two hedge fund examples, a market-and factor-neutral fund and a trend-following fund, we show that alpha estimates are highly sensitive to model choice and specification, with regression intercepts sometimes misleadingly positive and/or accompagnied with large confidence intervals. The analysis highlights the need for rigorous, multi-model evaluation and careful interpretation, emphasizing that alpha is a conditional metric, challenging to measure and persistently uncertain.", "url": "https://papers.ssrn.com/abstract=5884722", "date_added": "2026-05-30", "summarized": true, "rating": "★2.0", "starred": false, "repro": "—", "summary_html": "<h1>Not So Smart Alphas</h1>\n<p>&gt; Zotero Key: <code>XX7BPG6K</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Francois-Serge Lhabitant</li>\n<li><strong>年份</strong>: 2025</li>\n<li><strong>出处</strong>: SSRN</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.5884722</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=5884722</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/GA527WDD/Lhabitant - 2025 - Not So Smart Alphas.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>通过两个对冲基金案例（市场中性和趋势跟踪），系统性地展示 alpha 估计对模型选择和设定的极端敏感性，强调 alpha 是一个有条件的、难以精确测量的指标。</p>\n<h2>研究动机与问题</h2>\n<p>主动管理行业长期以 alpha 作为衡量经理技能的核心指标，但标准的 alpha 估计方法（CAPM、多因子模型）存在多种统计伪影和设定偏差。本文旨在系统性地梳理这些方法论缺陷，并用实际对冲基金数据展示不同方法产生的 alpha 估计差异之大，以及对同一基金使用&quot;反向回归&quot;（市场对基金回归）也能得到正 alpha 的悖论。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 两只对冲基金 — Fund 1（市场中性多策略基金，310 亿美元）和 Fund 2（纯趋势跟踪基金）</li>\n<li><strong>频率</strong>: 月度</li>\n<li><strong>样本区间</strong>: 1991 年 3 月 – 2025 年 9 月（295 个月度观测）</li>\n<li><strong>数据来源</strong>: 基金实际月度收益率（净费后）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<p>本文为方法论综述性研究，无单一模型流水线。核心内容是展示 alpha 估计的多种偏差来源：</p>\n<div class=\"mermaid\">flowchart TD\n    A[基金月度收益] --&gt; B{选择 alpha 估计方法}\n    B --&gt; C[忽略风险: 简单收益差]\n    B --&gt; D[CAPM 回归]\n    B --&gt; E[多因子模型 F1/F2/F3]\n    B --&gt; F[择时模型 TM/HM]\n    B --&gt; G[反向回归: 市场对基金]\n    C --&gt; H[偏差来源: 未调整风险]\n    D --&gt; I[偏差来源: 基准选择&lt;br/&gt;遗漏因子&lt;br/&gt;置信区间宽]\n    E --&gt; J[R² 极低时 alpha 伪影]\n    F --&gt; K[偏差来源: 择时效应&lt;br/&gt;被误归为 alpha]\n    G --&gt; L[反向 alpha 悖论]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>忽略风险的偏差</strong>：简单用基金收益减市场收益 $\\alpha_1 = R_P - R_M$，当 $\\beta_{P,M} \\neq 1$ 时产生系统性偏差。$\\beta &gt; 1$ 时高估技能，$\\beta &lt; 1$ 时低估。</p>\n<p>2. <strong>总收益 vs 超额收益</strong>：用总收益代替超额收益（未减无风险利率）计算 alpha，会引入 $\\alpha_2 = \\alpha_{P,M} + (1 - \\beta_{P,B})R_F$ 的偏差，在正利率环境下高估技能。</p>\n<p>3. <strong>基准选择偏差</strong>：用基准替代真实的市场组合，导致 $\\alpha_3$ 相对真实 alpha 有系统性偏离，偏差大小取决于基准与真实市场的差异。</p>\n<p>4. <strong>遗漏因子偏差</strong>：若基金收益受模型未纳入的因子影响，该因子暴露会被错误归入 alpha。偏差量为 $\\beta_2 \\bar{F}_2$ 减去相关性调整项。</p>\n<p>5. <strong>择时效应偏差</strong>：Treyor-Mazuy（二次项）和 Henriksson-Merton（分段线性）模型表明，成功择时会被标准 CAPM 误归为 alpha。TM 模型下偏差为 $\\gamma_{TM} \\cdot E[(R_M - R_F)^2]$（对称偏差）；HM 模型下偏差仅在牛市期间出现（不对称偏差）。</p>\n<p>6. <strong>反向 alpha 悖论</strong>：对同一基金，用市场对基金做回归也能得到正 alpha。推导表明当 $\\beta_P \\beta_M = \\rho^2 &lt; 1$（常见情况）且市场平均收益为正时，双方 alpha 可同时为正——这是线性回归不对称性的产物，非真正的超额表现。</p>\n<p>7. <strong>实证案例</strong>：</p>\n<p>   - <strong>Fund 1（市场中性）</strong>：不同方法的月度 alpha 估计从 0.19% 到 0.98% 不等，R² 普遍极低（1.25%–20.57%），置信区间宽（如 CAPM: [0.80, 1.15]）。反向回归 alpha = 0.35%。</p>\n<p>   - <strong>Fund 2（趋势跟踪）</strong>：不同方法的 alpha 从 -0.49% 到 0.69% 不等，以 S&amp;P 500 为基准时 R² 接近零，alpha 估计高度不稳定。引入趋势跟踪因子后 R² 跃升至 50%+，alpha 变为混合值。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>Alpha 估计对模型选择极度敏感：同一基金不同方法的 alpha 可相差 5 倍以上</li>\n<li>低 R² 模型（如市场中性基金用 CAPM）产生的 alpha 可能是统计伪影</li>\n<li>反向回归悖论：市场对基金回归也能产生正 alpha，说明线性回归框架的内在不对称性</li>\n<li>趋势跟踪基金以 S&amp;P 500 为基准时 alpha 看似为正，但引入趋势跟踪因子后显著下降</li>\n<li>Alpha 应被视为有条件的、模型依赖的指标，而非经理技能的确定性度量</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>系统性地将多种 alpha 估计偏差（忽略风险、总收益、基准选择、遗漏因子、择时、反向悖论）整合在一个框架中讨论</li>\n<li>用两只实际对冲基金（非模拟）展示不同方法的估计差异</li>\n<li>通过反向 alpha 推导揭示回归分析的内在不对称性</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>仅为方法论讨论和两个案例展示，非系统性实证研究</li>\n<li>未提出新的 alpha 估计方法或改进方案</li>\n<li>两只基金的特殊性（市场中性、趋势跟踪）可能不适用于其他策略类型</li>\n<li>未讨论贝叶斯方法、Bootstrap 等更现代的统计方法对 alpha 估计的改进</li>\n<li>样本期长达 34 年，基金的策略和规模可能已发生重大变化</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>：低，两只基金的月度收益率数据为非公开数据，无法直接获取</li>\n<li><strong>方法清晰度</strong>：高，所有公式和推导清晰完整，可照着实现</li>\n<li><strong>计算成本</strong>：低，标准 OLS 回归即可</li>\n<li><strong>综合评分</strong>: ★2.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>不建议复现（数据不可得）。但本文的方法论讨论对理解 alpha 估计的陷阱非常有价值，适合作为量化研究团队内部培训材料。核心 takeaway：评估经理技能时应使用多模型方法，关注置信区间和 R²，避免单一模型的 alpha 数字。</p>"}, {"key": "Y2T444U7", "title": "Nonlinear Time Series Momentum", "year": "2025", "authors": "Tobias J. Moskowitz, Riccardo Sabbatucci, Andrea Tamoni…", "tags": ["Machine Learning", "Nonlinear Regression", "Return Forecasts", "Time Series Momentum"], "venue": "", "abstract": "We document a persistent nonlinear relationship between price trends and risk-adjusted returns across markets and asset classes that is consistent with asset pricing theory. Nonlinearities in time series momentum are consistent with past returns reflecting information about conditional expected returns, in line with investors using conditioning information to form efficient portfolios. Machine learning techniques are useful in uncovering these relationships and yield economically and statistically significant out-of-sample improvements in time series momentum strategies.", "url": "https://papers.ssrn.com/abstract=5933974", "date_added": "2026-05-24", "summarized": true, "rating": "★4", "starred": false, "repro": "复现中", "summary_html": "<h1>Nonlinear Time Series Momentum</h1>\n<p>&gt; Zotero Key: <code>Y2T444U7</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Tobias J. Moskowitz, Riccardo Sabbatucci, Andrea Tamoni, Björn Uhl</li>\n<li><strong>年份</strong>: 2025</li>\n<li><strong>出处</strong>: SSRN Working Paper（Moskowitz 挂靠 Yale &amp; AQR Capital）</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.5933974</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=5933974</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/HRBLMD2G/Moskowitz 等 - 2025 - Nonlinear Time Series Momentum.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>时序动量（TSMOM）信号与未来收益之间存在显著的非线性关系，用 Ferson-Siegel S 曲线或 ANN 替代线性/二值加权后，全资产类别夏普比率显著提升，且 ML 独立&quot;发现&quot;的最优权重函数与理论推导吻合。</p>\n<h2>研究动机与问题</h2>\n<p>标准 TSMOM 文献（Moskowitz et al. 2012）使用二值信号（sign）或线性信号对历史收益加权构造仓位。理论上，在均值-方差框架下，最优仓位权重应是信号的非线性函数（S 形曲线）：极端信号时应&quot;回滚&quot;（rollback）仓位，因为极端预期收益会带来更高方差，反而损害夏普比率。但实证文献从未系统验证这一非线性结构是否真实存在，ML 是否也会收敛到相同形状，以及非线性改进是否具有样本外稳健性。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 55 个期货合约 —— 8 股票指数期货、24 大宗商品期货、21 利率+外汇期货</li>\n<li><strong>频率</strong>: 日频为主，同时检验周频和月频</li>\n<li><strong>样本区间</strong>: 最早 1980 年 1 月，截至 2024 年 10 月；训练截止 1994 年 6 月，样本外 OOS 为 1994–2024</li>\n<li><strong>数据来源</strong>: 国际期货市场（未披露具体数据供应商）；连续合约用比率调整法（ratio roll）处理换月</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>1. 基准 TSMOM 信号（对比基线）</strong></p>\n<ul>\n<li>线性信号：$s_t^{\\text{Linear}} = r_{t-T:t} / \\hat{\\sigma}_t$（过去 T 期收益除以滚动波动率）</li>\n<li>二值信号：$s_t^{\\text{Binary}} = \\text{sign}(r_{t-T:t})$（Moskowitz 2012 经典实现）</li>\n</ul>\n<p><strong>2. 理论非线性信号（NL-FS）</strong>  </p>\n<p>Ferson &amp; Siegel (2001) 在均值-方差框架下推导出最优权重：</p>\n<p>$$f_{FS}(s_t) = \\frac{s_t}{s_t^2 + 1}$$</p>\n<p>这是一条 S 曲线：信号绝对值 &lt;1 时近似线性，&gt;1 时仓位开始&quot;回滚&quot;（concave/convex 对称）。</p>\n<p><strong>3. 经验非线性信号（NL-ANN）</strong>  </p>\n<p>用 ANN 以最大化样本外夏普比率为目标学习 $f(\\cdot)$：</p>\n<ul>\n<li>架构：1–2 层隐藏层，节点数 2/4/8/16，tanh 激活，输出层线性</li>\n<li>约束：$f(0)=0$（市场中性），$f(-s)=-f(s)$（对称），$\\text{var}(f(X)) \\approx \\text{var}(X)$（不改变无条件风险）</li>\n<li>优化器：Adam，50 epochs，batch=1024；超参数网格搜索在训练集内完成</li>\n<li>训练数据按资产类别分组（股票指数 / 利率+外汇 / 大宗商品）分别估计</li>\n</ul>\n<p><strong>4. 仓位构造</strong>：仓位按目标波动率（12%）缩放，等权聚合各品种</p>\n<p><strong>回望期</strong>：1 个月、3 个月、12 个月</p>\n<h2>核心结论与关键结果</h2>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>频率</th><th>回望期</th><th>线性 SR</th><th>NL-FS SR</th><th>NL-ANN SR</th><th>二值 SR</th></tr>\n<tr><td>日频</td><td>1M</td><td>—</td><td>0.59</td><td><strong>0.83</strong></td><td>0.53</td></tr>\n<tr><td>日频</td><td>3M</td><td>0.33*</td><td>0.47***</td><td><strong>0.55</strong>*</td><td>—</td></tr>\n<tr><td>日频</td><td>12M</td><td>0.70***</td><td>0.83***</td><td><strong>0.84</strong>*</td><td>—</td></tr>\n<tr><td>月频</td><td>12M</td><td>—</td><td><strong>0.65</strong></td><td><strong>0.65</strong></td><td>低于 F&amp;S</td></tr>\n</table></div>\n<ul>\n<li>非线性模型在几乎所有频率、回望期、资产类别中均显著优于线性模型（p&lt;0.08 for 3M; p&lt;0.03 for 12M）</li>\n<li>ANN 学到的权重函数形状与理论 S 曲线高度一致：中间段近线性，极值段回滚</li>\n<li>非线性加权还增强了 TSMOM 对股票市场的尾部对冲/凸性：在极端下行市场中表现更好</li>\n<li>在 RP 与 TSMOM 联合配置中，最优权重对非线性版本始终 &gt;50%，线性版本明显偏低</li>\n<li>2015–2024 子期间：线性与非线性均表现较弱，反映 CTA 近年困境，不是方法特有问题</li>\n</ul>\n<h2>创新点</h2>\n<p>1. <strong>理论导向的非线性改进</strong>：不是纯粹 data-mining，而是有 Ferson-Siegel 理论背书的 S 曲线</p>\n<p>2. <strong>ML 验证理论</strong>：ANN 独立收敛到同一形状，提供双重证据</p>\n<p>3. <strong>平滑仓位</strong>：S 曲线天然压制极端仓位，换手率低于二值信号，更易实施</p>\n<p>4. <strong>全面覆盖</strong>：多资产类别 × 多回望期 × 多频率的系统性检验</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>仅覆盖国际期货</strong>：未测试中国商品期货；国内市场的信号分布、极端值频率可能不同，S 曲线参数未必直接适用</li>\n<li><strong>训练窗口固定至 1994</strong>：ANN 版本未随时间滚动重估，2015–2024 性能下滑部分归因于此</li>\n<li><strong>样本拟合风险</strong>：ANN 在训练集内做超参数搜索，存在一定过拟合；虽有 OOS 验证，但数据跨度与 OOS 期均含金融危机、低利率等特殊时期</li>\n<li><strong>交易成本未计入</strong>：S 曲线虽减少换手，但未做净收益测试</li>\n<li><strong>OOS R² 提升微小</strong>：非线性模型的 OOS R² 仅略高于线性，说明预测精度提升边际，夏普改善更多来自仓位形态而非预测准确性</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 需要 55 个国际期货的日频连续合约价格（比率换月）；国内商品可用天软，但海外品种（利率、FX、海外股指）需要额外数据源，部分受限</li>\n<li><strong>方法清晰度</strong>: 描述非常完整，公式、超参数、训练方式均明确；S 曲线版本（NL-FS）公式极简，可直接编码</li>\n<li><strong>计算成本</strong>: NL-FS 版本几乎零成本；ANN 版本轻量（1–2 层，节点≤16），普通 CPU 可跑</li>\n<li><strong>综合评分</strong>: ★4</li>\n</ul>\n<h2>复现备注</h2>\n<ul>\n<li><strong>最小可行版本</strong>：NL-FS 信号 $f(s) = s/(s^2+1)$，只需替换现有信号的最后一步映射，2 行代码</li>\n<li><strong>关键风险</strong>：国内品种信号波动率归一化方式需与本文保持一致（rolling 1-year vol），否则 $s_t$ 的量级不可比，S 曲线 rollback 位置错位</li>\n<li><strong>建议 research 目录</strong>: <code>（内部研究目录）</code></li>\n<li><strong>验证顺序</strong>: ① 先复现线性 TSMOM 基线 → ② 加入 NL-FS 映射 → ③ 比较分组 IC 和多空夏普 → ④ 若有提升再考虑 ANN 版</li>\n</ul>"}, {"key": "H245UQNW", "title": "Learning to Rank: Enhancing Momentum Strategies Across Asset Classes", "year": "2025", "authors": "Tom Burdorf", "tags": ["Momentum", "Bonds", "Commodities", "Currencies", "Equities", "Learning-to-rank", "Multi-Layer Perceptron", "Portfolio construction G11"], "venue": "", "abstract": "Cross-sectional momentum trading strategies rely on accurate asset ranking for portfolio construction. Traditional methods use simple past performance or basic regression and classification models for ranking. However, these methods have proven suboptimal in other ranking-intensive fields, particularly information retrieval. I propose applying learning-to-rank algorithms to improve cross-sectional portfolio construction. These algorithms excel at ranking by learning the relative relationships between pairs or lists of assets rather than treating each asset in isolation. Testing this approach on cross-sectional momentum strategies across bond, equity, commodity, and foreign exchange markets reveals that learning-to-rank algorithms significantly enhance performance in several asset classes.", "url": "https://papers.ssrn.com/abstract=5255258", "date_added": "2026-05-24", "summarized": true, "rating": "★4.0", "starred": false, "repro": "待复现", "summary_html": "<h1>Learning to Rank: Enhancing Momentum Strategies Across Asset Classes</h1>\n<p>&gt; Zotero Key: <code>H245UQNW</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Tom Burdorf (University of St. Gallen)</li>\n<li><strong>年份</strong>: 2025</li>\n<li><strong>出处</strong>: SSRN</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.5255258</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=5255258</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/RCUU778S/Burdorf - 2025 - Learning to Rank Enhancing Momentum Strategies Across Asset Classes.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>将信息检索领域的 Learning-to-Rank（LTR）算法 LambdaMART 应用于跨资产类别的横截面动量策略，发现在商品、外汇、债券和股票四个资产类别中，LTR 的排名能力均优于传统动量、Baz et al. (2015) 的 MACD 方法和 MLP 神经网络。</p>\n<h2>研究动机与问题</h2>\n<p>横截面动量策略的核心是&quot;准确排名&quot;——哪些资产最强、哪些最弱。传统方法用过往收益排序或回归预测排序，但这些方法没有利用排名问题的核心结构：资产间的<strong>相对关系</strong>而非绝对水平。信息检索领域已有成熟的 LTR 算法专为排名设计，但在多资产类别的系统交易中尚未被充分探索。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 16 个商品期货 + 18 个全球债券指数 + 29 个货币对 + 26 个全球股票指数</li>\n<li><strong>频率</strong>: 日度和周度</li>\n<li><strong>样本区间</strong>: 2000–2023（训练用 5 年滚动窗口）</li>\n<li><strong>数据来源</strong>: Refinitiv Eikon（商品），Bloomberg（债券/股票），BIS（外汇）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>五种策略对比</h3>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>策略</th><th>描述</th></tr>\n<tr><td><strong>Rand</strong></td><td>随机基准</td></tr>\n<tr><td><strong>JT</strong></td><td>经典横截面动量，按过去 252 日收益排序，做多 top 3 / 做空 bottom 3</td></tr>\n<tr><td><strong>Baz</strong></td><td>MACD 多时间尺度信号合成（Baz et al. 2015），波动率标准化 + 响应函数</td></tr>\n<tr><td><strong>MLP</strong></td><td>多层感知器回归预测收益再排序（regress-then-rank）</td></tr>\n<tr><td><strong>LTR (LM)</strong></td><td>LambdaMART 梯度提升树，直接优化 NDCG 排名指标</td></tr>\n</table></div>\n<h3>LambdaMART 核心特点</h3>\n<ul>\n<li><strong>Pairwise + Listwise</strong>: 训练时用 pairwise 比较，但优化目标为 listwise 的 NDCG（Normalized Discounted Cumulative Gain）</li>\n<li><strong>Lambda 梯度</strong>: 不定义损失函数再求导，而是直接定义梯度（lambdas），跳过不可微的排序指标</li>\n<li>输入: 22 个基于收益的特征（1/3/5/10/21 日标准化收益、MACD 指标等）</li>\n<li>训练: 5 年滚动窗口，90/10 训练/验证划分，early stopping（25 epochs），HyperOpt 调参</li>\n</ul>\n<h3>组合构建</h3>\n<ul>\n<li>每日/每周再平衡，年化目标波动率 15%</li>\n<li>做多排名 top 3 + 做空 bottom 3，等权</li>\n</ul>\n<h2>核心结论与关键结果（日频）</h2>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>资产类别</th><th>JT Sharpe</th><th>Baz Sharpe</th><th>MLP Sharpe</th><th><strong>LTR Sharpe</strong></th></tr>\n<tr><td>商品</td><td>-0.35</td><td>-0.16</td><td>—</td><td><strong>0.44</strong></td></tr>\n<tr><td>债券</td><td>—</td><td>—</td><td>—</td><td>—</td></tr>\n<tr><td>外汇</td><td>-0.40</td><td>0.37</td><td>0.00</td><td><strong>0.47</strong></td></tr>\n<tr><td>股票</td><td>—</td><td>—</td><td>—</td><td>—</td></tr>\n</table></div>\n<ul>\n<li>LTR 在所有四个资产类别上均显著优于传统方法</li>\n<li><strong>关键发现</strong>: Poh et al. (2021) 之前报告的 LTR 外汇优异表现主要由<strong>土耳其里拉</strong>（TRY）驱动——排除 TRY 后传统 LTR 效果大减，但本文方法仍保持正向 Sharpe 0.47</li>\n<li>LambdaMART 训练速度远快于 MLP（树模型 vs 反向传播）</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次将 LTR 系统应用于四大资产类别（而非仅单市场）</li>\n<li>发现并纠正了 Poh et al. (2021) 的结果主要由 TRY 极端贬值驱动的问题</li>\n<li>证明了&quot;排名是独立问题类型&quot;这一观点在金融领域的实践价值</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>做多/做空各仅 3 个资产——在 16-29 个品种的 universe 中过于集中，实际容量有限</li>\n<li>仅用动量信号（22 个收益衍生特征），未纳入 carry、value 等互补信号</li>\n<li>5 年滚动训练窗口可能不足以捕捉不同宏观体制（如低利率→高利率转换）</li>\n<li>NDCG 指标限制最多 31 个资产排名（XGBoost 32 位整数限制），限制了 universe 扩展</li>\n<li>周频再平衡的实际交易成本未充分讨论</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 中高——BIS 外汇数据公开免费，Bloomberg/Refinitiv 数据需付费但可用替代源</li>\n<li><strong>方法清晰度</strong>: 高——特征列表、超参数范围、训练流程均有详述</li>\n<li><strong>计算成本</strong>: 中等——需训练多个 LambdaMART 模型（5 年滚动），但树模型训练快</li>\n<li><strong>综合评分</strong>: ★★★★☆ 4.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>这是这批论文中复现价值最高的之一。建议最小可行版本：选取商品期货（16 品种 universe 最可控），复现 JT/Baz/LTR 三个策略的对比。注意点：(1) LTR 的目标变量定义需要仔细处理——用什么作为 ground truth rank（下一期收益排序）；(2) 波动率缩放的双重应用（单品种 + 组合层面）需要精确复现；(3) 建议加做周频版本以降低换手率。可扩展到 carry + momentum 双信号作为 LTR 输入特征。</p>"}, {"key": "MQESWHJ7", "title": "LSEAttention is All You Need for Time Series Forecasting", "year": "2025", "authors": "Dizhen Liang", "tags": ["Computer Science - Machine Learning", "Computer Science - Artificial Intelligence"], "venue": "", "abstract": "Transformer-based architectures have achieved remarkable success in natural language processing and computer vision. However, their performance in multivariate longterm forecasting often lags behind simpler linear baselines. Previous studies have identified the traditional attention mechanism as a significant factor contributing to this limitation. To unlock the full potential of transformers for multivariate time series forecasting, I introduce LSEAttention, an approach designed to address entropy collapse and training instability commonly observed in transformer models. I validate the effectiveness of LSEAttention across various real-world multivariate time series datasets, demonstrating that it not only outperforms existing time series transformer models but also exceeds the performance of some state-of-the-art models on specific datasets.", "url": "http://arxiv.org/abs/2410.23749", "date_added": "2026-05-26", "summarized": true, "rating": "★2.5", "starred": false, "repro": "—", "summary_html": "<h1>LSEAttention is All You Need for Time Series Forecasting</h1>\n<p>&gt; Zotero Key: <code>MQESWHJ7</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Dizhen Liang（独立作者）</li>\n<li><strong>年份</strong>: 2025</li>\n<li><strong>出处</strong>: arXiv:2410.23749</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2410.23749</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2410.23749</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/ACSKHHFH/Liang - 2025 - LSEAttention is All You Need for Time Series Forecasting.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>提出 LSEAttention 模块，将 Log-Sum-Exp 数值稳定技巧和 GELU/PReLU 激活函数整合到 Transformer 注意力机制中，缓解时间序列预测中的注意力熵坍塌（entropy collapse）问题，在 8 个公开数据集上取得 21/32 场景的最优 MSE。</p>\n<h2>研究动机与问题</h2>\n<p>Transformer 在多元长期时间序列预测中常落后于简单线性基线。已有研究指出注意力机制的熵坍塌是核心瓶颈——注意力矩阵在训练中收敛到相似乃至完全相同的值，导致表征退化。作者认为 softmax 的条件数过高是熵坍塌的数值根源，现有方法（如 SAMformer）用 Sharpness-Aware Minimization 间接缓解，但未从根本上解决 softmax 的数值稳定性问题。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 电力变压器温度（ETTh1/h2/m1/m2）、电力负荷（Electricity）、交通（Traffic）、天气（Weather）、汇率（Exchange）</li>\n<li><strong>频率</strong>: 小时级（ETT）/ 日频（Exchange）等</li>\n<li><strong>样本区间</strong>: 各数据集标准划分（与 Autoformer 等一致）</li>\n<li><strong>数据来源</strong>: 公开数据集，来自 Autoformer 等论文</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>LSEAttention</strong>：核心改进在注意力计算的数值稳定性上。传统 softmax：</p>\n<p>$$\\text{Attention}(Q, K, V) = \\text{Softmax}\\left(\\frac{QK^T}{\\sqrt{d_k}}\\right)V$$</p>\n<p>引入 Log-Sum-Exp 技巧改写 softmax：</p>\n<p>$$g_j = \\exp\\left(x_j - \\log\\sum_{i=1}^n e^{x_i}\\right)$$</p>\n<p>其中 $\\log\\sum e^{x_i}$ 通过减去最大值 $a = \\max(x)$ 做数值稳定化：</p>\n<p>$$y = a + \\log\\left(\\prod_{i=1}^n e^{x_i - a}\\right)$$</p>\n<p><strong>GELU 激活</strong>：在 FFN 中用 GELU 替代 ReLU（GELU(x) = x · Φ(x)，Φ 为标准正态 CDF），提供更平滑的概率性激活，减少极端值的放大。</p>\n<p><strong>PReLU</strong>：用可学习负斜率替代 ReLU 的死区，维持梯度流动。</p>\n<p><strong>LATST 架构</strong>：单层 Transformer + RevIN 归一化 + LSEAttention 模块，基本沿用 PatchTST 的超参设置。</p>\n<h2>核心结论与关键结果</h2>\n<p>MSE 对比（预测长度 96）：</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>数据集</th><th>LATST</th><th>SAMformer</th><th>Transformer</th><th>PatchTST</th></tr>\n<tr><td>Electricity</td><td><strong>0.131</strong></td><td>0.155</td><td>0.182</td><td>—</td></tr>\n<tr><td>Traffic</td><td><strong>0.380</strong></td><td>0.407</td><td>0.420</td><td>0.462</td></tr>\n<tr><td>Weather</td><td><strong>0.156</strong></td><td>0.197</td><td>0.227</td><td>0.177</td></tr>\n<tr><td>ETTh1</td><td>0.390</td><td><strong>0.381</strong></td><td>0.509</td><td>0.414</td></tr>\n<tr><td>Exchange</td><td>0.098</td><td>0.161</td><td>0.292</td><td><strong>0.088</strong></td></tr>\n</table></div>\n<ul>\n<li>32 个场景中 21 个最优，整体比 SAMformer 提升 4.3% MSE，比原始 Transformer 提升 19.11%。</li>\n<li>Ablation：去除 GELU 后性能下降明显（如 ETTh1 96 从 0.290→0.312），LSE 技巧是主要贡献点，PReLU 的增益在部分数据集上有限。</li>\n</ul>\n<h2>创新点</h2>\n<p>1. 从条件数/数值稳定性角度重新解释注意力熵坍塌，给出清晰的理论框架</p>\n<p>2. 将 LSE 技巧与 GELU/PReLU 组合成可即插即用的 LSEAttention 模块</p>\n<p>3. 极简架构（单层 + 小修改）即取得有竞争力的结果</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>独立作者且未发表（仅 arXiv），未经同行评审</li>\n<li>核心贡献本质上是数值工程技巧的组合（LSE + GELU + PReLU），理论深度有限</li>\n<li>未涉及金融时间序列（仅 Exchange 汇率），对高频/低信噪比金融数据的适用性未知</li>\n<li>部分数据集上仍有被 PatchTST 或 iTransformer 超越的预测长度</li>\n<li>未分析对交易策略/组合层面的下游影响</li>\n<li>单层 Transformer 的结论可能不适用于更深架构</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 全部使用公开基准数据集，可直接下载</li>\n<li><strong>方法清晰度</strong>: LSE 和 GELU 是标准数值技巧，实现简单</li>\n<li><strong>计算成本</strong>: 低 — 单层 transformer，与 PatchTST 等同类</li>\n<li><strong>综合评分</strong>: ★2.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>LSEAttention 本质上是即插即用的数值稳定性改进，可在现有 Transformer 时序模型的注意力模块中快速测试。LSE 技巧是标准数值计算常识，GELU/PReLU 也是成熟组件，整体技术含量不高，不建议作为独立复现项目。如有需要可在现有因子模型中加入该模块测试边际改善。</p>"}, {"key": "JWR2SITC", "title": "Forecast-to-Fill: Benchmark-Neutral Alpha and Billion-Dollar Capacity in Gold Futures (2015-2025)", "year": "2025", "authors": "Mainak Singha, Jose Aguilera-Toste, Vinayak Lahiri", "tags": ["Quantitative Finance - Computational Finance", "Quantitative Finance - Trading and Market Microstructure", "Quantitative Finance - Risk Management", "Quantitative Finance - Statistical Finance", "Quantitative Finance - Portfolio Management"], "venue": "", "abstract": "We test whether simple, interpretable state variables-trend and momentum-can generate durable out-of-sample alpha in one of the world's most liquid assets, gold. Using a rolling 10-year training and 6-month testing walk-forward from 2015 to 2025 (2,793 trading days), we convert a smoothed trend-momentum regime signal into volatility-targeted, friction-aware positions through fractional, impact-adjusted Kelly sizing and ATR-based exits. Out of sample, the strategy delivers a Sharpe ratio of 2.88 and a maximum drawdown of 0.52 percent, net of 0.7 basis-point linear cost and a square-root impact term (gamma = 0.02). A regression on spot-gold returns yields a 43 percent annualized return (CAGR approximately 43 percent) and a 37 percent alpha (Sharpe = 2.88, IR = 2.09) at a 15 percent volatility target with beta approximately 0.03, confirming benchmark-neutral performance. Bootstrap confidence intervals ([2.49, 3.27]) and SPA tests (p = 0.000) confirm statistical significance and robustness to latency, reversal, and cost stress. We conclude that forecast-to-fill engineering-linking transparent signals to executable trades with explicit risk, cost, and impact control-can transform modest predictability into allocator-grade, billion-dollar-scalable alpha.", "url": "http://arxiv.org/abs/2511.08571", "date_added": "2026-05-25", "summarized": true, "rating": "★4.5", "starred": false, "repro": "待复现", "summary_html": "<h1>Forecast-to-Fill: Benchmark-Neutral Alpha and Billion-Dollar Capacity in Gold Futures (2015–2025)</h1>\n<p>&gt; Zotero Key: <code>JWR2SITC</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Mainak Singha, Jose Aguilera-Toste, Vinayak Lahiri</li>\n<li><strong>年份</strong>: 2025</li>\n<li><strong>出处</strong>: arXiv (2511.08571)</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2511.08571</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2511.08571</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/KVXK44AM/Singha 等 - 2025 - Forecast-to-Fill Benchmark-Neutral Alpha and Billion-Dollar Capacity in Gold Futures (2015-2025).pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>仅用趋势和动量两个可解释状态变量，在黄金期货上通过&quot;预测到成交&quot;（forecast-to-fill）的工程化管线——包含信号平滑、波动率目标、分数凯利仓位、ATR 止损和交易成本建模——在 2015–2025 年滚动窗口外样本上实现夏普 2.88、最大回撤仅 0.52%、对现货黄金 beta≈0.03 的纯 alpha，且通过 bootstrap 和 SPA 严格统计检验。</p>\n<h2>研究动机与问题</h2>\n<ul>\n<li>量化研究通常止步于信号 IC / 回测曲线，忽视了从预测到真实成交之间的工程裂缝：交易成本、市场冲击、仓位管理、止损退出等。</li>\n<li>本文提出&quot;forecast-to-fill&quot;理念：将透明、可解释的信号通过<strong>显式的风险和成本控制</strong>转化为可执行交易，并在黄金期货（全球流动性最好的资产之一）上验证其能否承载数十亿美元级资金。</li>\n</ul>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: COMEX 黄金期货（主力连续合约）</li>\n<li><strong>频率</strong>: 日线</li>\n<li><strong>样本区间</strong>: 2005–2025，其中滚动窗口外样本测试覆盖 2015–2025（共 2,793 个交易日）</li>\n<li><strong>数据来源</strong>: 未明确说明（应为标准期货数据源）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>1. 信号生成（Alpha Forecast）</h3>\n<p>核心信号是两个可解释状态变量的组合：</p>\n<ul>\n<li><strong>趋势（Trend）</strong>：多时间尺度平滑价格信号的加权综合，捕捉中长期方向</li>\n<li><strong>动量（Momentum）</strong>：短期价格变化率，捕捉近期持续性</li>\n<li>两者合成一个&quot;regime signal&quot;，经平滑处理后作为原始 alpha 预测</li>\n</ul>\n<h3>2. 交易执行管线（Forecast-to-Fill）</h3>\n<p>从信号到成交的完整链条：</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>步骤</th><th>方法</th><th>说明</th></tr>\n<tr><td>信号平滑</td><td>EMA / 多尺度滤波</td><td>降低噪声和换手</td></tr>\n<tr><td>波动率目标</td><td>15% 年化目标波动率</td><td>动态缩放仓位</td></tr>\n<tr><td>仓位 sizing</td><td>分数凯利（fractional Kelly）</td><td>考虑收益/风险比的动态仓位</td></tr>\n<tr><td>冲击调整</td><td>平方根市场冲击模型（γ=0.02）</td><td>大单减速，避免吃深度</td></tr>\n<tr><td>退出规则</td><td>ATR 多重止损</td><td>波动率自适应退出，非固定百分比</td></tr>\n<tr><td>成本建模</td><td>线性 0.7bp + sqrt 冲击项</td><td>显式扣减，非事后估算</td></tr>\n</table></div>\n<h3>3. 验证框架</h3>\n<ul>\n<li><strong>滚动窗口外测试</strong>：10 年训练 → 6 个月测试 → 滚动向前，全程无未来信息泄露</li>\n<li><strong>统计检验</strong>：</li>\n</ul>\n<p>  - Bootstrap 置信区间（夏普 [2.49, 3.27]）</p>\n<p>  - Superior Predictive Ability (SPA) test，p = 0.000</p>\n<ul>\n<li><strong>压力测试</strong>：延迟成交、信号反转、成本加倍等情景</li>\n</ul>\n<h2>核心结论与关键结果</h2>\n<p>1. <strong>样本外夏普 2.88</strong>，最大回撤仅 0.52%（净成本后），年化收益约 43%</p>\n<p>2. <strong>纯 alpha</strong>：对现货黄金 beta≈0.03，IR=2.09，几乎不与黄金本身涨跌相关</p>\n<p>3. <strong>统计显著</strong>：Bootstrap CI 下限 2.49，SPA p=0.000，排除数据窥探</p>\n<p>4. <strong>工程决定成败</strong>：同样信号如果不做冲击调整和 ATR 退出，夏普下降 40%+；forecast-to-fill 的每一步都有实质贡献</p>\n<p>5. <strong>容量巨大</strong>：黄金期货日成交数百亿美元，经冲击模型估算策略容量在十亿美元级别</p>\n<p>6. <strong>成本鲁棒</strong>：即使交易成本翻倍，夏普仍 &gt;2.0</p>\n<h2>创新点</h2>\n<ul>\n<li>提出&quot;forecast-to-fill&quot;这一完整分析框架，强调信号到成交的全链路工程</li>\n<li>用极其简单的信号（trend + momentum）证明：执行质量比信号复杂度更重要</li>\n<li>在单一资产（黄金）上做到了 benchmark-neutral 纯 alpha，而非靠 beta 堆收益</li>\n<li>显式建模市场冲击并用分数凯利动态调整仓位，而非固定仓位比例</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>单一资产</strong>：仅在黄金期货上验证，是否可推广到其他品种未知</li>\n<li><strong>样本量有限</strong>：2,793 个交易日的样本外测试，约 11 年，真正的极端事件（如 2008、2020 年 3 月）可能已在训练集中或未充分覆盖</li>\n<li><strong>过拟合风险</strong>：滚动窗口方法本身仍存在前瞻偏差（hyperparameters 在全局选定），SPA 检验虽严格但非银弹</li>\n<li><strong>冲击模型假设</strong>：平方根冲击模型在市场极端波动时可能低估真实冲击成本</li>\n<li><strong>未开源代码</strong>：核心参数（分数 Kelly 比例、ATR 倍数）为描述性，精确复现需要摸索</li>\n<li><strong>黄金特殊属性</strong>：黄金期货流动性极高，结论未必适用于流动性较差的品种</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: ★★★★★ COMEX 黄金期货日线数据极易获取，天软 / Wind / 公开数据源均可</li>\n<li><strong>方法清晰度</strong>: ★★★★ 每个模块描述清晰，关键公式和参数给出，但部分超参（平滑窗口、Kelly 分数）需调参摸索</li>\n<li><strong>计算成本</strong>: ★★★★★ 单品种日线，计算量极轻，笔记本可完成</li>\n<li><strong>综合评分</strong>: ★★4.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>这是近期最值得复现的论文之一。最小可行版本：在黄金期货日线上实现趋势+动量双信号 → EMA 平滑 → 15% vol target → ATR 止损 → 扣成本。核心难点不在信号而在执行管线的每个环节调参——特别是分数 Kelly 的比例和 ATR 退出倍数。建议先在黄金上完整复现管线并匹配文中夏普≈2.5+，再逐步推广到其他高流动性期货（铜、原油、股指）。论文的&quot;forecast-to-fill&quot;框架可作为现有信号体系的执行层升级参考，把已有 alpha 信号统一接入波动率目标+冲击调整+动态退出的管线。</p>"}, {"key": "7KYNDGGU", "title": "Following the Money...Is Replicating Block Option Trading a Path to Trading Profits?", "year": "2025", "authors": "Russell Rhoads", "tags": ["SSRN", "Russell Rhoads", "<p><span></span></p>"], "venue": "", "abstract": "<p><span>The popularity of option trading among individuals has exploded over the past decade with 2025 volume expected to exceed thirteen billion contracts. Th", "url": "https://papers.ssrn.com/abstract=5521838", "date_added": "2026-05-30", "summarized": true, "rating": "★2.0", "starred": false, "repro": "—", "summary_html": "<h1>Following the Money...Is Replicating Block Option Trading a Path to Trading Profits?</h1>\n<p>&gt; Zotero Key: <code>7KYNDGGU</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Russell Rhoads</li>\n<li><strong>年份</strong>: 2025</li>\n<li><strong>出处</strong>: SSRN / Academic Market Insights</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.5521838</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=5521838</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/TJ6QEVP5/Rhoads - 2025 - Following the Money...Is Replicating Block Option Trading a Path to Trading Profits  .pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>追踪 2022–2023 年每日最大单方向股票期权大宗交易，发现跟随策略整体盈利（498 笔交易，总利润 $97,625，胜率 51%），其中卖空策略（Short Call/Put）表现显著优于做多策略，delta 和到期时间筛选可进一步提升收益。</p>\n<h2>研究动机与问题</h2>\n<p>个人期权交易量在过去十年爆发式增长（2025 年预计超 130 亿张合约）。市场上有大量教育和服务提供商鼓励散户&quot;跟踪聪明钱&quot;——即跟随机构的大宗期权交易。核心问题：这种跟随策略真的能盈利吗？</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 美股个股期权（227 只不同标的），每日最大单方向大宗交易</li>\n<li><strong>频率</strong>: 每日一笔交易信号</li>\n<li><strong>样本区间</strong>: 2022–2023 年（共 498 笔交易）</li>\n<li><strong>数据来源</strong>: Barchart（期权成交量/持仓量数据）、Trade-Alert.com（大宗交易明细）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<p>本文方法极简，无需复杂流程图。核心逻辑：</p>\n<pre class=\"md-code\"><code>每日筛选 → 选择最大单方向交易 → 确定方向（买/卖）→ 持有至到期或提前平仓 → 统计盈亏</code></pre>\n<h3>步骤详解</h3>\n<p>1. <strong>交易筛选</strong>：</p>\n<p>   - 每日计算每只期权的成交量/持仓量比值，选比值最大的作为当日最大交易</p>\n<p>   - 排除距到期不足 9 天的期权</p>\n<p>   - 排除价差交易（spread trade），仅保留单方向交易</p>\n<p>   - 排除方向不确定的交易（通过 Trade-Alert 系统判断买/卖）</p>\n<p>2. <strong>方向判断</strong>：通过 Trade-Alert 系统的成交明细判断是客户买入还是卖出。例如成交价更靠近 bid 侧表明卖出，靠近 ask 侧表明买入。</p>\n<p>3. <strong>持仓规则</strong>：</p>\n<p>   - 若期权持仓量从交易后水平下降 50% 以上，视为提前平仓，退出价为当日最大大宗成交价</p>\n<p>   - 若持仓量保持在交易后水平的 50% 以上，视为持有至到期，以内在价值计算盈亏</p>\n<p>4. <strong>四种策略类型</strong>：Long Call、Long Put、Short Call、Short Put</p>\n<p>5. <strong>筛选维度</strong>：(a) Delta 筛选（&gt;50 或 &lt;50）；(b) 到期时间筛选（&gt;30 天或 &lt;30 天）</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>整体表现</strong>：498 笔交易，总利润 $97,625.40，平均每笔 $196.03，胜率 51.00%，72.09% 持有至到期</li>\n<li><strong>做多 vs 做空</strong>：做多交易 283 笔（56%），做空 215 笔（44%）。做空策略显著优于做多</li>\n<li><strong>年度差异</strong>：2022 年（熊市）Short Call 表现最佳（+$30,648），Long Call 最差（-$27,113）；2023 年（牛市）Short Put 表现最佳（+$18,850），Long Call 最差（+$5,830）</li>\n<li><strong>Delta 筛选</strong>：delta &gt;50（实值期权）的交易平均利润 $273.52/笔，显著高于无筛选的 $196.03</li>\n<li><strong>到期时间筛选</strong>：&lt;30 天到期的交易平均利润 $226.71/笔，优于 &gt;30 天的 $175.62</li>\n<li><strong>Short Call 在两种筛选下均表现最优</strong>：delta &gt;50 时胜率 66.67%–69.23%；&lt;30 天到期时胜率 79.31%–81.82%</li>\n<li>标的分布广泛：227 只不同股票，AAPL 出现最多（13 次）</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>实证检验了&quot;跟随大宗期权交易&quot;这一流行策略的实际可行性</li>\n<li>提供了详细的按策略类型、年度、delta、到期时间的分解分析</li>\n<li>发现做空策略显著优于做多，挑战了&quot;机构卖出、散户买入&quot;的传统叙事</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>仅两年样本（2022–2023），覆盖一个熊市和一个牛市，但不足以代表完整市场周期</li>\n<li>每日仅选一笔最大交易，信号极稀疏，实际可操作性有限</li>\n<li>退出规则基于持仓量变化，存在滞后性，实际执行价格可能与假设不同</li>\n<li>未考虑交易成本（手续费、滑点）、保证金要求和资金占用</li>\n<li>大宗交易的方向判断可能不完全准确</li>\n<li>未与简单的期权策略（如系统性卖权）进行基准对比</li>\n<li>作者声明仅用于教育目的</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>：中等，Barchart 提供部分数据但完整历史数据可能需要付费订阅，Trade-Alert 数据需付费</li>\n<li><strong>方法清晰度</strong>：高，筛选规则和退出逻辑描述清晰</li>\n<li><strong>计算成本</strong>：低，主要是数据获取和简单的 P/L 计算</li>\n<li><strong>综合评分</strong>: ★2.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>不建议作为交易策略复现。本文更适合作为了解期权大宗交易行为特征的参考。如果要复现，需要：(1) 获取 Barchart 历史期权成交量/持仓量数据；(2) 获取 Trade-Alert 大宗交易明细；(3) 注意退出规则的实际可执行性。核心结论是：卖空策略（尤其是 Short Call）在跟随大宗交易中表现较好，但这可能是卖权溢价的系统性收益而非信息优势。</p>"}, {"key": "RQU25GQF", "title": "Financial Regulatory Arbitrage and Commodity Pricing", "year": "2025", "authors": "Zunxin Zheng, Gaiyan Zhang, Yingzhao Ni", "tags": ["capital account control", "commodity pricing", "dual-track interest rates", "financial regulatory arbitrage", "financialization of commodities", "inventory-convenience yield relationship"], "venue": "", "abstract": "We develop a DSGE framework to examine how financial regulatory arbitrage affects commodity pricing. In capital-control arbitrage, imported commodities bypass capital controls to exploit domestic-foreign interest rate differentials. In dual-track interest-rate arbitrage, commodities serve as collateral to capitalize on dual-track interest rate spreads. Our model illustrates the dynamics of prices, inventories and convenience yields, revealing how financial arbitrage re-establishes equilibrium after external shocks. Capital-control arbitrage decreases current commodity prices, raises inventory holdings, and lowers the convenience yield. Conversely, dual-track arbitrage increases prices, inventory, and convenience yields, weakening the negative inventory-yield relationship. Model calibration aligns with observed empirical patterns.", "url": "https://papers.ssrn.com/abstract=5162808", "date_added": "2026-05-30", "summarized": true, "rating": "★2.5", "starred": false, "repro": "—", "summary_html": "<h1>Financial Regulatory Arbitrage and Commodity Pricing</h1>\n<p>&gt; Zotero Key: <code>RQU25GQF</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Zunxin Zheng, Gaiyan Zhang, Yingzhao Ni</li>\n<li><strong>年份</strong>: 2025</li>\n<li><strong>出处</strong>: SSRN (未同行评审预印本)</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.5162808</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=5162808</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/L9M9AKJV/Zheng 等 - 2025 - Financial Regulatory Arbitrage and Commodity Pricing.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>本文构建了一个包含货币效用（MIU）和库存效用（IU）的多商品 DSGE 模型，分析两种金融监管套利——资本管制套利和双轨利率套利——对商品价格、库存和便利收益率的影响机制。</p>\n<h2>研究动机与问题</h2>\n<p>新兴经济体中普遍存在金融监管套利：(1) 资本管制套利——进口商品绕过资本管制、利用境内外利差获利；(2) 双轨利率套利——商品作为抵押品获取银行低息贷款再投入民间高息市场。传统商品定价理论（仓储理论）仅关注生产和消费用途，忽略了商品的金融套利属性。本文旨在建立统一的理论框架，刻画金融套利如何改变商品价格动态、库存持有和便利收益率之间的关系。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 理论模型，无数值实证数据</li>\n<li><strong>频率</strong>: 理论模型（离散时间、无限期界）</li>\n<li><strong>样本区间</strong>: 无（模型校准使用参数化模拟）</li>\n<li><strong>数据来源</strong>: 模型校准参数来自文献和中国市场数据（如温州民间借贷利率中位数 16%、银行贷款加权平均利率 6%）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n    A[多商品 DSGE 模型&lt;br/&gt;MIU + IU] --&gt; B[代表性家庭&lt;br/&gt;效用函数 U = lnC + η lnQ + φ lnm]\n    B --&gt; C[三种商品用途&lt;br/&gt;消费 / 库存 / 金融套利]\n    C --&gt; D{套利类型?}\n    D --&gt;|资本管制套利| E[进口商品 → 即刻出售&lt;br/&gt;获取境内外利差]\n    D --&gt;|双轨利率套利| F[商品作抵押 → 银行低息贷款&lt;br/&gt;投入民间高息市场]\n    E --&gt; G[供给增加 → 价格↓&lt;br/&gt;库存↑ 便利收益率↓]\n    F --&gt; H[抵押需求↑ → 价格↑&lt;br/&gt;库存↑ 便利收益率↑&lt;br/&gt;库存-便利收益率负相关↓]\n    G --&gt; I[均衡：套利收益 = 套利成本&lt;br/&gt;便利收益率]\n    H --&gt; I</div>\n<h3>步骤详解</h3>\n<p><strong>模型设定：</strong></p>\n<p>1. <strong>经济环境</strong>：纯交换多商品经济，$J$ 种商品，$I$ 个代表性家庭，离散时间无限期界。</p>\n<p>2. <strong>效用函数</strong>：$U(\\mathbb{C}_{i,t}, Q_{i,t}, m_{i,t}) = \\ln \\mathbb{C}_{i,t} + \\sum_{j=1}^{M} \\eta_j \\ln Q_{i,t}^j + \\phi \\ln m_{i,t}$，包含消费、库存（便利收益）和货币持有三部分。</p>\n<p>3. <strong>CES 总消费</strong>：$\\mathbb{C}_{i,t+s} = \\left[\\sum_{j=1}^{J} \\alpha_j (c_{i,t+s}^j)^{\\frac{\\rho-1}{\\rho}}\\right]^{\\frac{\\rho}{\\rho-1}}$，商品间存在替代关系。</p>\n<p><strong>资本管制套利（Proposition 4）：</strong></p>\n<p>4. <strong>机制</strong>：当资本管制利差足够大时，套利者通过信用证以低利率 $R_t^{CL}$ 从国外进口商品，即刻在国内出售，投资于高利率 $R_t$ 的国内市场。</p>\n<p>5. <strong>效果</strong>：进口商品增加供给（等价于临时供给冲击），导致——当前商品价格下降、库存增加、便利收益率下降。</p>\n<p>6. <strong>校准示例</strong>：2% 的供给冲击使现货价格降低约 1.43%，库存增加约 1.42%。</p>\n<p><strong>双轨利率套利（Proposition 5）：</strong></p>\n<p>7. <strong>机制</strong>：当无担保利率 $R_t$ 与担保利率 $R_t^C$ 的利差超过便利收益率 $\\bar{\\delta}_j$ 时，套利者将商品抵押给银行获取低息贷款，再投入民间高息市场。</p>\n<p>8. <strong>均衡条件</strong>：$E_t^*\\left[\\frac{R_t - R_t^C}{\\frac{p_{t+1}^j}{p_t^j}\\delta_{i,j,t}}\\right] = 1$，即套利的边际收益等于边际成本（便利收益率）。</p>\n<p>9. <strong>效果</strong>：抵押需求增加导致——当前商品价格上升、库存增加、便利收益率上升。</p>\n<p>10. <strong>关键发现</strong>：双轨套利使库存和便利收益率同向变动（均在当前期上升、下一期下降），削弱了传统仓储理论中库存与便利收益率的负相关关系。</p>\n<p><strong>库存-便利收益率关系的综合分析：</strong></p>\n<p>11. <strong>加权模型</strong>：$Relate = (1-\\alpha) \\cdot Relate_{capital} + \\alpha \\cdot Relate_{dual}$，其中权重 $\\alpha = \\frac{1-e^{-(R_t-R_t^C-\\bar{\\delta}_j)}}{1+e^{-(R_t-R_t^C-\\bar{\\delta}_j)}}$ 随双轨利差增大而增大。</p>\n<p>12. <strong>阈值效应</strong>：当 $R_t &lt; 7.56\\%$（即 $R_t - R_t^C \\leq \\bar{\\delta}_j$）时，仅存在资本管制套利，库存-便利收益率相关系数稳定在 -1.0；当 $R_t &gt; 7.56\\%$ 时，双轨套利激活，相关系数逐渐上升甚至转正。</p>\n<p>13. <strong>中国市场含义</strong>：温州民间借贷利率中位数约 16%，远超 7.56% 的阈值，预示中国商品市场的库存-便利收益率关系可能已被双轨套利显著改变。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>资本管制套利</strong>：增加进口供给 → 价格下降、库存增加、便利收益率下降。效果类似传统供给冲击，不改变库存-便利收益率的负相关关系。</li>\n<li><strong>双轨利率套利</strong>：增加抵押需求 → 价格上升、库存增加、便利收益率上升。<strong>关键创新</strong>：使库存和便利收益率同向变动，削弱（甚至逆转）传统负相关关系。</li>\n<li><strong>模型可约化</strong>：通过对数近似可约化为 Schwartz (1997) 的三因子模型，但便利收益率是内生决定的（而非外生随机过程）。</li>\n<li><strong>校准结果</strong>：8% 的资本管制供给冲击使价格降低约 5.70%，便利收益率降低 0.005%/年；8% 的双轨利差使便利收益率从 1.60% 升至 3.58%。</li>\n<li><strong>库存-便利收益率相关系数</strong>：在双轨套利主导下可从 -1.0 上升至 +0.6 以上。</li>\n</ul>\n<h2>创新点</h2>\n<p>1. <strong>两种套利的区分</strong>：首次在统一框架中区分资本管制套利和双轨利率套利，二者对价格和便利收益率的影响方向相反。</p>\n<p>2. <strong>商品金融化的替代路径</strong>：提出金融监管套利是商品金融化的新机制（区别于机构投资者指数投资的传统解释），尤其适用于新兴经济体。</p>\n<p>3. <strong>便利收益率的内生化</strong>：在 DSGE 框架中将便利收益率内生化为消费和库存的函数，弥补了 Brennan (1991) 和 Schwartz (1997) 外生指定便利收益率的不足。</p>\n<p>4. <strong>库存-便利收益率关系的新解释</strong>：为实证文献中该关系在不同时期/市场表现不一致提供了理论解释——取决于金融监管套利的强度。</p>\n<h2>局限与可质疑处</h2>\n<p>1. <strong>纯理论模型，无实证检验</strong>：所有结论均基于模型推导和参数校准模拟，未使用实际数据进行计量验证。校准参数（如 $\\eta=0.002$, $\\theta_j=0.002$）的经济含义和敏感性未充分讨论。</p>\n<p>2. <strong>代表性家庭假设</strong>：假设所有家庭同质且信息对称，忽略了异质性投资者（如对冲基金、CTA）对商品市场的影响。</p>\n<p>3. <strong>单期套利</strong>：模型仅考虑一期套利活动，未刻画多期动态套利策略和套利者的跨期优化。</p>\n<p>4. <strong>完全市场假设</strong>：假设完全市场和同质预期，现实中的市场摩擦（做空限制、保证金要求）可能显著改变套利效果。</p>\n<p>5. <strong>参数校准的局限性</strong>：校准参数主要基于中国数据（如温州民间借贷利率），对其他新兴经济体和发达市场的适用性存疑。</p>\n<p>6. <strong>未考虑库存的实际持有成本</strong>：模型中的折旧率 $\\theta_j=0.002$（月度）极低，可能低估了实际库存持有成本对套利行为的约束。</p>\n<p>7. <strong>未与现有实证文献直接对接</strong>：虽然提及与 Zheng, Zhang and Ni (2024) 的实证结果一致，但未提供系统的实证检验。</p>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>：N/A（纯理论模型，无需实证数据复现）。</li>\n<li><strong>方法清晰度</strong>：中等。模型设定和均衡条件有明确的数学表达，但推导过程较长且依赖较多假设，完整复现需要较强的宏观金融建模能力。</li>\n<li><strong>计算成本</strong>：中等。需要实现 DSGE 模型的数值求解和校准模拟（Dynare 或 MATLAB）。</li>\n<li><strong>综合评分</strong>: ★2.5</li>\n</ul>\n<h2>复现备注</h2>\n<ul>\n<li>本文为纯理论模型论文，复现价值主要在于理解金融监管套利对商品定价的影响机制，而非直接用于交易策略开发。</li>\n<li>如需复现，建议使用 Dynare（MATLAB/Octave）或 Python 的 <code>sequence-jacobian</code> 包实现 DSGE 模型求解。</li>\n<li>校准参数见文中各图注（$\\alpha_j=1$, $\\theta_j=0.002$, $\\eta=0.002$, $\\nu_j^j=0.9$, $\\bar{c}_i^j/\\bar{Q}_i^j=1.5$, $\\ln p^j=10$, $\\beta=0.9975$, $\\bar{R}=0.5\\%$/月）。</li>\n<li>扩展方向：引入异质性投资者、多期套利、非完全市场摩擦，或与中国商品期货市场的实证数据进行结构估计。</li>\n</ul>"}, {"key": "DMSPG8TW", "title": "Factor Pricing Across Asset Classes", "year": "2025", "authors": "Thuy Duong Dang, Fabian Hollstein, Marcel Prokopczuk", "tags": ["asset classes", "Factor models", "market integration", "model comparison"], "venue": "", "abstract": "An integrated factor model is valuable for multi-asset class investing and proves superior for analyzing fund performance. We study factor pricing across seven major asset classes, including U.S. and international equities, corporate bonds, commodities, currencies, equity indices, and government bonds. The pricing power of models from one asset class for others is limited. We use a factor selection methodology to create an optimal integrated factor model across asset classes. This model includes several equity and corporate bond factors, but prices assets across all asset classes without requiring factors from each. The results suggest that markets are significantly but imperfectly integrated.", "url": "https://papers.ssrn.com/abstract=4481121", "date_added": "2026-05-25", "summarized": true, "rating": "★2.0", "starred": false, "repro": "—", "summary_html": "<h1>Factor Pricing Across Asset Classes</h1>\n<p>&gt; Zotero Key: <code>DMSPG8TW</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Thuy Duong Dang, Fabian Hollstein, Marcel Prokopczuk</li>\n<li><strong>年份</strong>: 2025</li>\n<li><strong>出处</strong>: SSRN (4481121)</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.4481121</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=4481121</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/3KNGJNBH/Dang 等 - 2025 - Factor Pricing Across Asset Classes.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>研究七大资产类别（美股、国际股票、公司债、商品、外汇、股指期货、国债）的因子定价共通性，发现单一资产类别的因子模型对其他类别解释力有限；通过因子筛选方法构建跨资产集成因子模型，发现主要由美股和公司债因子驱动即可对所有资产类别形成有效定价，表明市场显著但非完美整合。</p>\n<h2>研究动机与问题</h2>\n<ul>\n<li>现有因子模型几乎都是单资产类别内开发的（如 Fama-French 对股票，Asness/Koijen 对商品），跨资产通用性未经验证。</li>\n<li>多资产投资者（如桥水、AQR）需要统一的定价框架来理解不同资产之间的风险补偿来源。</li>\n<li>本文问：一个资产类别的因子能否给另一个资产类别定价？如果可以，哪些因子是&quot;跨资产通用&quot;的？</li>\n</ul>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 七大类别</li>\n</ul>\n<p>  - 美国股票（个股）</p>\n<p>  - 国际股票（发达市场，个股）</p>\n<p>  - 公司债券（投资级 + 高收益）</p>\n<p>  - 商品期货（能源、金属、农产品）</p>\n<p>  - 外汇（G10 + 新兴市场）</p>\n<p>  - 股指期货（全球主要市场）</p>\n<p>  - 国债（美国 + 发达市场）</p>\n<ul>\n<li><strong>频率</strong>: 月度</li>\n<li><strong>样本区间</strong>: 约 1990–2021</li>\n<li><strong>数据来源</strong>: CRSP, Compustat, Bloomberg, Datastream, Refinitiv</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>第一步：跨资产定价能力检验</h3>\n<p>对每个资产类别，用其他六大类别的因子模型逐一套入，评估截距项（alpha）是否为零：</p>\n<ul>\n<li>如果某类别的因子能&quot;解释&quot;另一类别的资产收益→截距不显著→跨资产定价有效</li>\n<li>对所有 7×6=42 个方向做完整的检验</li>\n</ul>\n<h3>第二步：集成因子模型构建</h3>\n<p>使用因子筛选方法（stepwise / LASSO / elastic net）从全部候选因子（覆盖七大类别共 50+ 个因子）中选出最优子集，使其最大化跨资产的定价能力（最小化各资产类别的平均 alpha 绝对值）。</p>\n<h3>第三步：市场整合度评估</h3>\n<p>通过集成模型对各资产类别截距的大小和显著性，判断市场一体化程度——截距越小=整合度越高。</p>\n<h2>核心结论与关键结果</h2>\n<p>1. <strong>单一资产类别的因子跨类通用性差</strong>：商品的展期收益因子对股票几乎没有解释力，股票的 HML/SMB 对商品和外汇的解释力也很弱</p>\n<p>2. <strong>最优集成模型主要由美股+公司债因子构成</strong>：这两类因子的跨资产定价能力最强，可以覆盖商品、外汇、国债等其他类别</p>\n<p>3. <strong>不需要每个类别各取一个因子</strong>：集成模型中的因子数远少于资产类别数，说明不同类别的风险补偿有共同驱动</p>\n<p>4. <strong>市场显著但非完美整合</strong>：集成模型无法完全消除所有资产类别的 alpha（部分类别截距仍显著），说明存在资产类别特定的风险溢价</p>\n<p>5. <strong>集成模型在基金业绩评估中优于单类别模型</strong>：用跨资产模型评估多资产基金时，alpha 更小且更稳健</p>\n<h2>创新点</h2>\n<ul>\n<li>首次对七大资产类别做系统性的跨资产因子定价能力比较</li>\n<li>采用因子筛选方法构建&quot;最小必要&quot;跨资产集成模型</li>\n<li>为多资产投资实践（业绩归因、风险分解）提供实证基础</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>样本内模型选择偏差</strong>：因子筛选在样本内进行，最优子集可能过度适应历史数据</li>\n<li><strong>因子定义版本差异</strong>：不同数据源对同一因子（如 value, momentum）的定义略有区别，可能影响跨资产比较</li>\n<li><strong>仅覆盖长周期月度数据</strong>：未讨论因子定价能力在高频/危机期的时变性</li>\n<li><strong>实用落地有限</strong>：论文主要是描述性统计和实证验证，不产生可交易的信号或策略</li>\n<li><strong>新兴市场覆盖不足</strong>：国际股票以外的新兴市场资产类别（新兴市场债券、新兴货币）未深入讨论</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: ★★ 覆盖七个资产类别的全面数据库需要大量商业数据源（CRSP, Bloomberg, Datastream），成本高</li>\n<li><strong>方法清晰度</strong>: ★★★★ 因子定义和回归框架标准，但因子筛选的具体步骤和阈值需大量摸索</li>\n<li><strong>计算成本</strong>: ★★★★ 月度回归，计算量轻</li>\n<li><strong>综合评分</strong>: ★★2.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>论文偏学术实证验证而非策略开发，对交易策略的直接指导价值有限。不复现。若未来需要建立跨资产风险模型做仓位分配或风控，可参考文中的集成因子框架——核心结论&quot;美股+公司债因子即可覆盖多数资产&quot;是一个实用的简化原则。已有因子体系可据此优先关注这两类因子的跨资产信号质量和相关性。</p>"}, {"key": "WGB5XPIT", "title": "Exploiting Myopia: The Returns to Long-Term Investing", "year": "2025", "authors": "Kalash Jain, Dian Jiao", "tags": ["Institutional Investors", "Long-term Investing", "Mispricing", "Myopia"], "venue": "", "abstract": "Institutional investors face short-term performance pressures that constrain their ability to hold positions through temporary underperformance. We show that this myopia generates systematic mispricing in the cross-section of stocks. We introduce Horizon, a ﬁrm-level measure of active institutional holding periods, and document that long-Horizon ﬁrms earn signiﬁcantly higher future returns. Consistent with a myopia-based mechanism, the Horizon premium is most pronounced among stocks that are structurally harder for short-term managers to hold and the premium attenuates when mechanically patient passive ownership is high. Exploiting a 2004 SEC regulatory change that increased interim monitoring of mutual fund managers, we ﬁnd that heightened short-term pressure reduced Horizon, increased turnover, and ampliﬁed the Horizon return premium for treated ﬁrms. Overall, our results indicate that institutional myopia in delegated asset management is an economically important determinant of expected returns.", "url": "https://papers.ssrn.com/abstract=5464715", "date_added": "2026-06-07", "summarized": true, "rating": "★4.0", "starred": false, "repro": "待复现", "summary_html": "<h1>Exploiting Myopia: The Returns to Long-Term Investing</h1>\n<p>&gt; Zotero Key: <code>WGB5XPIT</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Kalash Jain, Dian Jiao (Columbia Business School)</li>\n<li><strong>年份</strong>: 2025</li>\n<li><strong>出处</strong>: SSRN</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.5464715</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=5464715</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/TLIISGMZ/Jain和Jiao - 2025 - Exploiting Myopia The Returns to Long-Term Investing.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>提出 Horizon 指标（机构主动持股加权平均连续持有季度数），发现长 Horizon 公司未来收益显著更高（月均 13.5 bps / σ，t=4.45），并通过 2004 年 SEC 披露规则冲击的 DiD 证明机制是机构短视导致的错误定价。</p>\n<h2>研究动机与问题</h2>\n<p>机构投资者面临短期业绩评估压力（赎回风险、职业关注、基准比较），难以持有短期表现不佳的仓位。论文提出核心问题：<strong>机构短视（myopia）是否在股票横截面上产生系统性的风险溢价？</strong> 已有文献多从基金层面研究投资者持有期与业绩的关系，本文首次从公司层面证明股东基础的持有期构成本身即被定价，并提出委托代理摩擦（而非信息优势）是主要驱动机制。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 美国普通股</li>\n<li><strong>频率</strong>: 月度（Fama-MacBeth）/ 季度（DiD）</li>\n<li><strong>样本区间</strong>: 1983 年 9 月 – 2024 年 12 月</li>\n<li><strong>数据来源</strong>: SEC 13F 持仓（机构持股）、CRSP（股价/收益）、Compustat（财务数据）、I/B/E/S（盈利指引）、Bushee (2001) 分类（区分主动/被动/准指数投资者）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[13F 季度持仓数据] --&gt; B[剔除指数/准指数投资者&lt;br/&gt;Bushee 2001 分类]\n  B --&gt; C[计算每只股票每位主动投资者的&lt;br/&gt;连续持有季度数]\n  C --&gt; D[按持股比例加权平均&lt;br/&gt;得到 Horizon]\n  D --&gt; E[取自然对数 Ln Horizon]\n  E --&gt; F[Fama-MacBeth 横截面回归&lt;br/&gt;控制 BTM/Size/动量/反转/盈利/IVol/流动性]\n  F --&gt; G[预期收益 ↑ 与 Horizon 正相关]\n\n  H[2004 SEC 季度披露规定] --&gt; I[DiD: 受冲击基金持仓占比&lt;br/&gt;高于中位数的公司 = Treat 组]\n  I --&gt; J[H3a: Treat 公司 Horizon ↓]\n  I --&gt; K[H3b: Treat 公司换手率 ↑&lt;br/&gt;高 Horizon 公司缓冲]\n  I --&gt; L[H3c: Treat 公司 Horizon-收益敏感性 ↑]\n\n  E --&gt; M[横截面交互项检验]\n  M --&gt; N[H2a: × IVol ↑ 效应更强]\n  M --&gt; O[H2b: × Ret−1 ↓ 效应更强]\n  M --&gt; P[H2c: × Age Mgr ↓ 效应更强]\n\n  E --&gt; Q[时间序列: 3×2 排序&lt;br/&gt;构建 Horizon 多空因子]\n  Q --&gt; R[计算 FF5+MOM+STR+IVol+Age 因子 alpha]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>输入</strong>：SEC 13F 季度持仓数据，按 Bushee (2001) 分类剔除指数基金和准指数基金，仅保留主动机构投资者。</p>\n<p>2. <strong>Horizon 构造</strong>：对每只股票 $i$ 在每个季度 $t$，</p>\n<p>   $$Horizon_{i,t} = \\sum_{j \\in \\text{Active}} w_{i,j,t} \\times \\text{Duration}_{i,j,t}$$</p>\n<p>   其中 $w_{i,j,t}$ 是投资者 $j$ 持有股票 $i$ 的市值占该股票所有主动机构持股总市值的比例，$\\text{Duration}_{i,j,t}$ 是投资者 $j$ 连续持有该股票的季度数。最终取自然对数 $\\ln(Horizon)$，使分布接近正态（见图 1）。</p>\n<p>3. <strong>Fama-MacBeth 回归</strong>：每月横截面回归，因变量为未来 1/2/3/6/12 个月收益，核心自变量为 $\\ln(Horizon)$，控制变量：$\\ln(BTM)$、Size、短期反转 $Ret_{-1}$、动量 $Ret_{-12,-2}$、盈利能力、IVol、公司年龄、Amihud 非流动性。标准误用 Newey-West（3 阶滞后）。</p>\n<p>4. <strong>横截面检验</strong>：在回归中加入 $\\ln(Horizon)$ 与 IVol / $Ret_{-1}$ / $\\ln(Age(Mgr))$ 的交互项，检验短视约束更强的子样本中 Horizon 溢价是否更大。</p>\n<p>5. <strong>时间序列检验</strong>：3×2 双重排序（Horizon × Size / IVol / $Ret_{-1}$ / Age(Mgr)），构建多空投资组合，对 FF5 + 动量 + 短期反转 + IVol + 经理年龄进行 spanning regression 求 alpha。</p>\n<p>6. <strong>DiD 机制检验</strong>：利用 2004 年 5 月 SEC 要求共同基金从半年度改为季度披露的规定。受冲击基金（事前未自愿季度披露的基金）持股占比高于中位数的公司定义为 Treat 组。前后窗口：2001Q2–2004Q1（前）vs 2004Q3–2007Q2（后）。验证三条假设：Horizon 下降、换手率上升、收益敏感性增强。</p>\n<p>7. <strong>输出</strong>：Horizon 因子多空组合收益，以及按 IVol/$Ret_{-1}$/Age(Mgr) 子样本构建的增强版多空组合收益。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>主回归</strong>：$\\ln(Horizon)$ 月度收益系数 0.152（t=4.45），1σ 提升对应月均 13.5 bps / 年化 1.62%。预测力在 2/3/6/12 个月持续递增（年化系数 1.402，t=5.95），且冻结 Horizon 后 t 值维持 &gt;2 近五年。</li>\n<li><strong>横截面</strong>：高 IVol（交互项 β=3.862, t=4.00）、低近期收益（交互项 β=-0.013, t=-4.78）、年轻经理（交互项 β=-0.127, 全控制下不显著但方向一致）子样本中溢价更强。</li>\n<li><strong>时间序列 alpha</strong>：Horizon 多空因子月均 26.1 bps（Sharpe 0.320），FF5+MOM+STR+IVol+Age 模型 alpha 为 16.8 bps（t=2.56）。子样本版本 alpha 更高：IVol×Horizon 32.0 bps，$Ret_{-1}$×Horizon 25.5 bps，Age(Mgr)×Horizon 17.3 bps。</li>\n<li><strong>DiD</strong>：受冲击公司 Horizon 显著下降（-0.087, t=-2.62），换手率上升（三重交互 -0.543, t=-2.71），收益-Horizon 敏感性增强（三重交互 0.302，加控制后减弱至不显著）。</li>\n<li><strong>附加检验</strong>：高 Horizon 公司发布更多/更精确/更长远的盈利指引；被动持股比例高时溢价减弱；非流动性高时溢价增强；&quot;逆类型&quot;（短视经理长期持有）信号更强。</li>\n</ul>\n<h2>创新点</h2>\n<p>1. 首次提出公司层面的机构持有期度量 Horizon（基于 13F 的 revealed preferences，不含经理特征假设），比基金持有期（Cremers and Pareek 2016）和持仓久期（Lan et al. 2023）更直接反映公司股东基础的短视程度。</p>\n<p>2. 用 DiD + SEC 2004 披露冲击<strong>因果识别</strong>短视机制，区别于以往仅依赖横截面相关的文献。</p>\n<p>3. 从委托代理摩擦（而非信息优势）角度解释长期持有的超额收益，填补了 Koijen-Yogo 需求系统资产定价框架中&quot;投资者异质性如何产生定价效应&quot;的经验证据。</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>内生性残留</strong>：DiD 中基金是否自愿季度披露是内生选择，处理组/控制组划分依赖该选择，可能遗漏变量。作者承认并做了平行趋势检验、安慰剂检验（1997 年），但无法完全排除。</li>\n<li><strong>Horizon 构造依赖 Bushee 分类</strong>：主动/被动/准指数分类精度影响度量质量，且 13F 仅报告多头仓位，忽略空头和衍生品。</li>\n<li><strong>交易成本未纳入</strong>：多空组合换手率和实际可交易性未充分讨论，尤其是高 IVol、低流动性子样本中交易成本更高。</li>\n<li><strong>与已知因子的相关性</strong>：Horizon 与 BTM 相关系数高达 0.55，虽然回归中控制了 BTM，但经济含义上可能与价值因子有较大重叠（spanning regression 中 alpha 的 Sharpe 仅 0.16）。</li>\n<li><strong>2024 年样本结束</strong>：论文时间序列截至 2024 年底，但近年来被动投资占比大幅上升（Chinco and Sammon 2024），Horizon 溢价的结构性变化值得关注。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: ★★★★☆ 13F 公开可得（Wharton WRDS / 直接 SEC），CRSP/Compustat 需订阅，但可替代。</li>\n<li><strong>方法清晰度</strong>: ★★★★★ 构造方法描述详细，附录有完整变量定义，Bushee 分类代码公开。</li>\n<li><strong>计算成本</strong>: ★★★☆☆ 需处理横跨 40+ 年的 13F 季度数据（逐季匹配机构-股票对），数据清洗工作量大但不需 GPU。</li>\n<li><strong>综合评分</strong>: ★4.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>高优先级复现。Horizon 指标直观且能从 13F 构建，方法透明度高。关键风险点：（1）13F 数据清洗和 Bushee 分类匹配是主要工程瓶颈；（2）A 股市场 13F 等价物为季报机构持仓，可类比构建但机构类型分类体系不同（公募/私募/社保/外资）；（3）建议最小可行版本：先基于公募季报重仓股数据构建简化 Horizon，验证 Fama-MacBeth 预测力，再扩展到全机构。</p>"}, {"key": "HALTK8NC", "title": "Do Dividend-Paying Stocks Outperform Non-dividend Stocks in the Long Run?", "year": "2025", "authors": "Atul Oraon", "tags": ["Dividend Stock", "Dividend Yield", "Financial Investment", "Non-dividend Stock"], "venue": "", "abstract": "This study examines the long-term investment performance of dividend-paying and non-dividend-paying stocks, analyzing the impact of macroeconomic conditions using regression analysis and descriptive statistics. The research explores how key economic variables-GDP growth, inflation, interest rates, and market volatility-influence stock returns across different market phases, including booms, recessions, and recoveries. Regression analysis identifies significant relationships between macroeconomic factors and stock performance, revealing that dividend stocks tend to respond more favorably to economic expansions. Descriptive statistics highlight that dividend-paying stocks generally outperform non-dividend stocks over extended periods, exhibiting higher mean and median returns, greater upside potential, and the compounding benefits of reinvested dividends. Although dividend stocks display relatively higher volatility, their resilience during downturns and strong recovery performance contribute to superior long-term risk-adjusted returns. These findings suggest that dividend stocks provide a more stable and sustainable path to wealth accumulation, making them an attractive choice for investors seeking both stability and growth in varying economic conditions.", "url": "https://papers.ssrn.com/abstract=5267502", "date_added": "2026-06-07", "summarized": true, "rating": "★1.0", "starred": false, "repro": "—", "summary_html": "<h1>Do Dividend-Paying Stocks Outperform Non-Dividend Stocks in the Long Run?</h1>\n<p>&gt; Zotero Key: <code>HALTK8NC</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 不复现</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Atul Oraon (Ranchi University)</li>\n<li><strong>年份</strong>: 2025</li>\n<li><strong>出处</strong>: IJRAR (International Journal of Research and Analytical Reviews), Vol.12 No.1</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.5267502</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=5267502</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/5KDNCECR/Oraon - 2025 - Do Dividend-Paying Stocks Outperform Non-dividend Stocks in the Long Run.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>通过描述性统计对比约 50 只印度股息支付股和约 30 只非股息支付股的 3 年/5 年收益，声称股息股长期表现更优，但缺乏任何正式计量经济学检验或资产定价框架。</p>\n<h2>研究动机与问题</h2>\n<p>探讨股息支付股票与非股息支付股票在长期（5 年以上）及不同宏观环境（繁荣、衰退、复苏）中的表现差异。作者声称现有研究多集中于发达市场且时间窗口较短，缺乏对新兴市场（印度）及完整经济周期下股息策略的考察。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 印度股票</li>\n<li><strong>频率</strong>: 年度收益（3 年/5 年窗口）</li>\n<li><strong>样本区间</strong>: 未明确说明，推测截至 2024 年</li>\n<li><strong>数据来源</strong>: 未说明来源，仅列出约 50 只股息支付股和约 30 只非股息支付股的表格</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>方法极简单，仅有描述性统计，画流程图反而冗余。</p>\n<h3>步骤详解</h3>\n<p>1. <strong>样本选取</strong>：从印度股市手工选取约 50 只股息率 &gt;2.5% 的股票和约 30 只股息率接近 0 的股票，未说明选取标准或是否有幸存者偏差控制。</p>\n<p>2. <strong>描述性统计</strong>：分别计算两组股票的 3 年回报和 5 年回报的均值、标准差、偏度和峰度。</p>\n<p>3. <strong>回归分析</strong>（声称但未详细展示）：对宏观变量（GDP 增长、通胀、利率、市场波动率）与股票收益做回归，按经济周期（繁荣/衰退/复苏）分段。</p>\n<p>4. <strong>对比结论</strong>：声称股息支付股在长期中平均收益更高、下行韧性更强。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>声称股息支付股 5 年回报均值更高（具体数值未标准化报告）。</li>\n<li>声称股息支付股在经济扩张期对宏观变量反应更积极，衰退期更有韧性。</li>\n<li>声称股息再投资的复利效应是长期财富积累的关键驱动力。</li>\n</ul>\n<p><strong>注意</strong>：论文未报告任何 t 值、p 值、置信区间或正式的假设检验结果。回归分析的具体设定（因变量、控制变量、标准误处理）均未披露。</p>\n<h2>创新点</h2>\n<p><strong>无实质创新</strong>。论文仅为印度市场股息/非股息股的描述性对比，方法停留在本科毕业论文水平。文献综述部分引用了相关研究（Conover et al. 2016, Fuller and Goldstein 2011 等），但自身的实证贡献几乎为零。</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>方法论严重不足</strong>：无 Fama-MacBeth 回归、无因子模型、无 portfolio sort、无 formal hypothesis testing。</li>\n<li><strong>样本选择偏差</strong>：手工选股，未控制市值、行业、价值等混淆变量，幸存者偏差严重。</li>\n<li><strong>发表渠道质量低</strong>：IJRAR 为低门槛开放获取期刊，非主流金融/经济学期刊。</li>\n<li><strong>作者单一</strong>：独立作者，来自非研究型大学，无合作者，未显示经过严谨同行评议。</li>\n<li><strong>数据不可复现</strong>：原始数据来源和选取标准未披露，无法复现。</li>\n<li><strong>宏观分析空有框架</strong>：声称做了回归但未报告任何回归表或诊断统计量。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: ★★☆☆☆ 数据来源未说明，样本选取标准不透明。</li>\n<li><strong>方法清晰度</strong>: ★☆☆☆☆ 方法描述仅有粗线条框架，核心细节全部缺失。</li>\n<li><strong>计算成本</strong>: ★★★★★ 无需计算成本。</li>\n<li><strong>综合评分</strong>: ★1.0</li>\n</ul>\n<h2>复现备注</h2>\n<p><strong>不复现</strong>。论文学术质量过低，达不到量化研究的复现门槛。方法论停留在描述性统计层面，没有任何可复现的计量框架。即使花时间复现其结论（股息股长期跑赢非股息股），该结论在成熟市场文献中也已是常识（如 Dividend Aristocrats 研究），毫无边际贡献。</p>"}, {"key": "CHK3JDIM", "title": "Dividend Capture Returns and Their Drivers: A Bayesian Analysis of Large-Cap Stocks Over 35 Years", "year": "2025", "authors": "Kaden Ma", "tags": ["Bayesian Regression", "Dividend Capture", "Large-Cap Stocks", "Retail Investors"], "venue": "", "abstract": "We examine the profitability of dividend capture from 1990–2025 using Bayesian linear regression with the No-U-Turn Sampler. In particular, we focus on retail investors, who have an advantage in dividend capture due to (1) small trade sizes that reduce exposure to bid-ask spreads, and (2) the availability of tax-advantaged retirement accounts such as Roth IRAs that improve net returns. Using our models, we find that dividend capture in large-cap stocks has been consistently profitable over the past 35 years, with an average profit of 0.230% per dividend issuance from 1990 to 2025. However, returns decayed within this time period, with average profit per dividend falling to just 0.114% from 2020–2025. Still, with an average of 241.5 unique dividend capture opportunities per year, this strategy retains strong profit potential. Sectors such as Finance, Consumer Discretionary, and Real Estate had significant positive effects on dividend-capture returns, while Basic Materials and Telecommunications underperformed. The only significant non-sector predictor was the standard deviation of historic returns, though its positive effect on returns also diminished over time, from 0.390 between 1990–2000 to 0.118 in 2020–2025.", "url": "https://papers.ssrn.com/abstract=5473306", "date_added": "2026-06-07", "summarized": true, "rating": "★3.0", "starred": false, "repro": "—", "summary_html": "<h1>Dividend Capture Returns and Their Drivers: A Bayesian Analysis of Large-Cap Stocks Over 35 Years</h1>\n<p>&gt; Zotero Key: <code>CHK3JDIM</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Kaden Ma (Haas School of Business, UC Berkeley)</li>\n<li><strong>年份</strong>: 2025</li>\n<li><strong>出处</strong>: SSRN</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.5473306</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=5473306</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/58GYFNWE/Ma - 2025 - Dividend Capture Returns and Their Drivers A Bayesian Analysis of Large-Cap Stocks Over 35 Years.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>用贝叶斯线性回归（NUTS-HMC）分析 1990–2025 年 577 只美国大盘股的股息捕获策略，发现平均每笔股息可获利 0.230%，但收益随时间衰减（2020–2025 降至 0.114%），波动率是唯一持续显著的非行业预测变量。</p>\n<h2>研究动机与问题</h2>\n<p>股息捕获（dividend capture）是在除息日前买入、除息日开盘卖出的策略。早期研究（Karpoff &amp; Walkling 1990）显示该策略在 1970–80 年代可获利 0.89%/笔。但随着互联网普及、零佣金交易和 HFT 的兴起，套利空间是否已被消除？论文聚焦<strong>散户投资者</strong>视角，利用其小额交易（低买卖价差冲击）和税收优惠账户（Roth IRA）两大优势，系统评估股息捕获在近 35 年的盈利性和驱动因素。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 美国大盘股</li>\n<li><strong>频率</strong>: 每笔股息事件（按股票聚合为横截面）</li>\n<li><strong>样本区间</strong>: 1990 年 – 2025 年 4 月</li>\n<li><strong>数据来源</strong>: Yahoo Finance（股价/股息/成交量）、stockanalysis.com（大盘股列表）、Marketwatch（补充 Beta）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[788 只美国大盘股列表] --&gt; B[剔除股息率 &lt;0.5% 的股票&lt;br/&gt;剔除数据缺失/被收购/股息次数&lt;3]\n  B --&gt; C[577 只股票]\n  C --&gt; D[逐笔提取除息日前后&lt;br/&gt;开盘价/最高/最低/收盘价/成交量]\n  D --&gt; E[计算 CloseOpen 策略收益&lt;br/&gt;前日收盘买入 → 除息日开盘卖出]\n  E --&gt; F[按股票聚合&lt;br/&gt;COMean / COSD / avgVolume / numDivs / Beta]\n  F --&gt; G[贝叶斯线性回归&lt;br/&gt;NUTS-HMC 采样&lt;br/&gt;rstanarm 默认弱信息先验]\n  G --&gt; H1[全样本模型 1990-2025]\n  G --&gt; H2[分段模型&lt;br/&gt;1990-2000 / 2000-2010 / 2010-2020 / 2020-2025]\n  H1 --&gt; I[后验推断：行业 + COSD + numDivs]\n  H2 --&gt; J[收益衰减趋势分析]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>样本筛选</strong>：从 788 只美国大盘股出发，剔除年股息率 &lt;0.5%（192 只）、无数据（15 只）、被收购（2 只）、历史股息次数 &lt;3 的股票，保留 577 只。</p>\n<p>2. <strong>收益计算</strong>：对每笔股息事件，计算 CloseOpen 策略收益 =（除息日开盘价 + 每股股息 - 前日收盘价）/ 前日收盘价。同时计算同期 S&amp;P 500 收益作为基准（Stock-SPCO）。</p>\n<p>3. <strong>聚合处理</strong>：将个股的逐笔股息数据聚合为股票级横截面——COMean（平均捕获收益）、COSD（收益标准差）、avgVolume、numDivs（历史股息总次数）、DivYield、Beta（2025 年 4 月的 5 年月度 Beta）、Sector（11 个行业）。</p>\n<p>4. <strong>贝叶斯线性回归</strong>：</p>\n<p>   $$\\text{COMean}_i = \\beta_0 + \\beta_1 \\text{COSD}_i + \\beta_2 \\text{avgVolume}_i + \\beta_3 \\text{Beta}_i + \\beta_4 \\text{DivYield}_i + \\beta_5 \\text{numDivs}_i + \\sum_{s} \\gamma_s \\cdot \\text{Sector}_{i,s} + \\epsilon_i$$</p>\n<p>   使用 rstanarm 包的 NUTS-HMC 采样器，默认弱信息先验，行业变量用 sum-to-zero contrast 编码。四条 Markov 链，有效样本量 &gt;2,800，所有 $\\hat{R} &lt; 1.01$。</p>\n<p>5. <strong>分段建模</strong>：在四个子时期（互联网早期 1990–2000、算法兴起 2000–2010、HFT 时代 2010–2020、零佣金时代 2020–2025）上分别训练相同的贝叶斯模型，追踪系数和 posterior predictive mean 的时间趋势。</p>\n<p>6. <strong>输出</strong>：各预测变量的后验均值和可信区间；posterior predictive distribution 的均值（mean_PPD）和可信区间，用于判断股息捕获是否整体盈利。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>全样本（1990–2025）</strong>：平均每笔股息捕获收益 0.230%，超越同期 S&amp;P 500 基准 0.184%。mean_PPD 的 99% CI 为 (0.181, 0.281)，完全位于零上方。</li>\n<li><strong>收益衰减</strong>：mean_PPD 从 1990–2000 的 0.382% → 2000–2010 的 0.337% → 2010–2020 的 0.171% → 2020–2025 的 0.114%。</li>\n<li><strong>行业效应（全样本）</strong>：Finance（后验均值 +0.120，99% CI 不含零）、Consumer Discretionary（+0.111，99% 显著）、Real Estate（+0.114，95% 显著）正向超越均值；Basic Materials（-0.238，95% 显著）、Telecommunications（-0.252，99% 显著）负向。</li>\n<li><strong>波动率效应</strong>：COSD（历史收益标准差）是全样本和所有分段模型中唯一持续显著的连续预测变量，后验均值从 1990–2000 的 0.390 衰减到 2020–2025 的 0.118。</li>\n<li><strong>近年新因子</strong>：2020–2025 分段模型中，numDivs（历史股息次数）首次显著（后验均值 -0.012），作为股息关注度的代理变量——频繁派息的股票套利空间更小。</li>\n<li><strong>年平均机会</strong>：241.4 个交易日有股息捕获机会，最佳理论年化收益 1354%（100% 选股准确率），最差年化亏损 85%（0% 准确率）。</li>\n</ul>\n<h2>创新点</h2>\n<p>1. 用贝叶斯框架提供完整后验分布，而非点估计，对参数不确定性给出概率性陈述。</p>\n<p>2. 通过四段时期的分段模型追踪股息捕获盈利性的长期衰减趋势，比传统时间序列更稳健。</p>\n<p>3. 关注散户视角（小额 + IRA 避税），区别于以往研究聚焦机构投资者（如 Henry &amp; Koski 2017）。</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>Beta 的时序错配</strong>：使用 2025 年 4 月的 5 年月度 Beta 作为整个历史的波动率代理，忽略了 Beta 的时变性，早期数据的 Beta 严重后视偏差。</li>\n<li><strong>聚合丢失信息</strong>：将逐笔股息聚合到股票级别，虽然控制了自相关，但丢失了市场环境（牛/熊市）对逐笔收益的影响。</li>\n<li><strong>无交易成本建模</strong>：虽假设零佣金和 IRA 避税，但未考虑买卖价差（bid-ask spread）的实际冲击——这对低价股和高波动股尤其严重。</li>\n<li><strong>生存者偏差</strong>：回溯至 1990 年，样本只包含当前仍存在的大盘股，退市/破产公司被排除，收益可能高估。</li>\n<li><strong>学术严谨性一般</strong>：单一作者、本科生级别论文，未经过顶级期刊同行评议。贝叶斯方法的使用动机（&quot;股票市场具有概率性&quot;）论证较弱。</li>\n<li><strong>策略容量</strong>：每笔 0.114–0.230% 的毛利在扣除实际买卖价差和滑点后可能归零甚至为负，论文未讨论容量约束。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: ★★★★☆ Yahoo Finance 公开免费，大盘股列表公开。</li>\n<li><strong>方法清晰度</strong>: ★★★★☆ 方法描述清晰，代码包（rstanarm）明确，种子号（592198）公开。</li>\n<li><strong>计算成本</strong>: ★★★☆☆ 贝叶斯 MCMC 采样需一定算力但规模可控（577 个观测的线性模型）。</li>\n<li><strong>综合评分</strong>: ★3.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>中等优先级。策略逻辑简单，适合作为因子研究中的另类策略参考。关键风险：（1）加入实际 bid-ask spread 后收益大概率缩水至不显著；（2）A 股股息捕获涉及红利税差异（持股满 1 年免税 vs 不足 1 月 20%），实际净收益需要重新计算；（3）建议最小可行版本：选取沪深 300 成分股，计算 ex-dividend date 前后的 price drop ratio，验证是否存在系统性的 under-drop（即捕获机会）。</p>"}, {"key": "EDZR6P7M", "title": "Defense First: A Multi-Asset Tactical Model for Adaptive Downside Protection", "year": "2025", "authors": "Thomas Carlson", "tags": ["Momentum Strategies", "Portfolio Construction", "Tactical Asset Allocation", "Risk Management", "Adaptive Portfolios", "Crisis Alpha", "Defensive Investing", "Downside Protection", "Macro Hedging", "Multi-Asset Strategy"], "venue": "", "abstract": "In times of economic uncertainty, traditional \"safe haven\" portfolios-those heavily invested in bonds or gold-have often failed to protect investors. This paper introduces Defense First, a simple but powerful strategy that adjusts monthly among four defensive assets: long-term U.S. Treasury bonds (TLT), gold (GLD), broad commodities (DBC), and the U.S. dollar (UUP). It uses a clear ranking system based on past performance to allocate to the strongest performers. When one or more of these defensive assets falter, the position slots U.S. stocks (SPY) as a fallback option. Using data from 1986 to 2025, Defense First delivers better risk-adjusted returns than the stock market, with lower volatility, smaller losses in downturns and low correlation to typical stock and bond portfolios. The approach relies only on publicly available data and uses liquid, easy-to-trade ETFs. This paper connects the strategy to academic research on momentum, crisis investing, defensive rotation, and diversified portfolio design.", "url": "https://papers.ssrn.com/abstract=5334772", "date_added": "2026-05-24", "summarized": true, "rating": "★4.5", "starred": false, "repro": "待复现", "summary_html": "<h1>Defense First: A Multi-Asset Tactical Model for Adaptive Downside Protection</h1>\n<p>&gt; Zotero Key: <code>EDZR6P7M</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Thomas D. Carlson</li>\n<li><strong>年份</strong>: 2025</li>\n<li><strong>出处</strong>: SSRN</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.5334772</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=5334772</li>\n<li><strong>本地 PDF</strong>: <code>~/Documents/Zotero/storage/IHERPNTU/Carlson - 2025 - Defense First A Multi-Asset Tactical Model for Adaptive Downside Protection.pdf</code></li>\n</ul>\n<h2>一句话总结</h2>\n<p>一个极简但有效的月度战术配置策略——在四个防御性资产（TLT/GLD/DBC/UUP）之间按多时间尺度动量排名分配仓位，防御资产动量不足时转向 SPY，1986-2025 年实现年化 10.87%、Sharpe 0.89、最大回撤仅 -14.81%（同期标普 -50.97%）。</p>\n<h2>研究动机与问题</h2>\n<p>传统 60/40 组合在通胀冲击或政策突变导致股债相关性转正时失效。单一对冲工具（如仅持有黄金或长期国债）在不同宏观体制下表现不一。这篇论文提出&quot;防御优先&quot;框架——同时持有四个覆盖不同经济风险维度的防御资产，通过动量排名动态切换，防哪个风险就用哪个工具。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: TLT（长期国债）、GLD（黄金）、DBC（商品）、UUP（美元指数）、SPY（标普 500，fallback）、90 天 T-bill（现金基准）</li>\n<li><strong>频率</strong>: 月度再平衡</li>\n<li><strong>样本区间</strong>: 1986–2025</li>\n<li><strong>数据来源</strong>: ETF 数据 + ETF 成立前的 Vanguard mutual fund / 指数 / 期货代理</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>1. <strong>动量评分</strong>: 四个防御资产各自计算 1/3/6/12 个月收益，等权平均得综合动量分</p>\n<p>2. <strong>排名分配</strong>: Top 1 → 40%、Top 2 → 30%、Top 3 → 20%、Top 4 → 10%</p>\n<p>3. <strong>绝对动量过滤</strong>: 若某防御资产的动量弱于 90 天 T-bill，其仓位转配 SPY</p>\n<p>4. <strong>再平衡</strong>: 每月一次，基于月末收盘价</p>\n<h2>核心结论与关键结果（1986–2025）</h2>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>指标</th><th>Defense First</t
