ors' trend-chasing trading behavior, which strengthens when volatility/uncertainty is low and when the expected profitability of momentum strategy is high. We also show that short-term momentum signals (R nonQ) can be aggregated to enhance the traditional intermediate-term momentum strategy and substantially improve its performance. By combining our empirical findings with a parsimonious model, we synthesize the microstructure-based liquidity-provision and behavioral trend-following mechanisms. Overall, our study demonstrates that momentum and reversal coexist on the same short-term horizon in commodity markets, overturns the previous canonical \"reversal-at-short-horizon, momentum-at-intermediatehorizon\" segmented perception, and therefore deepens our understanding about the overall return predictability in financial markets.", "url": "https://papers.ssrn.com/abstract=6425598", "date_added": "2026-05-30", "summarized": true, "rating": "★4.5", "starred": false, "repro": "待复现", "summary_html": "<h1>Momentum and Reversal on the Short-Term Horizon: Evidence from Commodity Markets</h1>\n<p>&gt; Zotero Key: <code>EM7W6LZS</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Shen Zhao, Yiyi Ding, Jianfeng Yu, Wenjin Kang</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: SSRN</li>\n<li><strong>DOI</strong>: 10.2139/ssrn.6425598</li>\n<li><strong>链接</strong>: https://papers.ssrn.com/abstract=6425598</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/M26L3U54/Zhao 等 - 2026 - Momentum and Reversal on the Short-Term Horizon Evidence from Commodity Markets.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：传统资产定价把短期反转与中期动量视为不同时间尺度的独立现象——动量与反转能否在同一短周期内共存、如何分离各自驱动机制？</li>\n<li><strong>方法</strong>：用 CFTC 持仓的投机者净交易流 $Q$ 对商品期货周度收益做截面回归，分解出交易流成分 Q 与正交残差成分 R_nonQ，分别预测下周收益并做 Fama-MacBeth 与机制分析（26 个商品，1993–2025）。</li>\n<li><strong>结论</strong>：同一周度内 R_nonQ 正向预测下周收益（动量，1 标准差 +11.6bp、年化 6.2%）、Q 负向预测（反转），颠覆&quot;短期反转、中期动量&quot;认知；动量主因是投机者趋势追逐（R_nonQ 正向预测下周 Q）；用 R_nonQ 替代原始收益排序，6 月动量年化从 5.2% 提升至 9.9%。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>传统资产定价文献将短期（周/月）反转和中期（3–12 月）动量视为不同时间尺度上的独立现象。近期股票市场研究开始发现短期动量的存在（如高换手率股票），但证据有限且局限于特定子样本。核心问题：动量和反转能否在同一短期周期内共存？如果能，如何分离各自的驱动机制？</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 26 种北美期货交易所的商品期货</li>\n<li><strong>频率</strong>: 周度（周二到周二）</li>\n<li><strong>样本区间</strong>: 1993 年 1 月 – 2025 年 9 月</li>\n<li><strong>数据来源</strong>: Commodity System Inc.（价格数据）、CFTC Commitment of Traders 报告（持仓数据）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n    A[商品期货周度收益 R_i,t] --&gt; B[截面回归&lt;br/&gt;R_i,t = b0 + b1 × Q_i,t + ε]\n    B --&gt; C[分离两个正交成分]\n    C --&gt; D[Q_i,t: 投机者净交易流&lt;br/&gt;流动性需求驱动]\n    C --&gt; E[R_nonQ_i,t: 正交残差&lt;br/&gt;基本面/信息驱动]\n    D --&gt; F[预测下一周收益&lt;br/&gt;Q 负向预测 → 反转]\n    E --&gt; G[预测下一周收益&lt;br/&gt;R_nonQ 正向预测 → 动量]\n    F --&gt; H[双策略组合排序&lt;br/&gt;2×2 独立分组]\n    G --&gt; H\n    H --&gt; I[量化动量与反转的独立贡献]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>数据构建</strong>：使用 26 种商品期货的近月合约价格计算周度收益 $R_{i,t}$，从 CFTC COT 报告获取非商业交易者（投机者）的净多头持仓变化，计算净交易流指标：</p>\n<p>$$Q_{i,t} = \\frac{\\text{NetLong}_{i,t} - \\text{NetLong}_{i,t-1}}{OI_{i,t-1}}$$</p>\n<p>2. <strong>收益分解</strong>：对每周进行截面回归 $R_{i,t} = b_{0,t} + b_{1,t} \\cdot Q_{i,t} + \\varepsilon_{i,t}$，将收益分解为 Q 成分（投机者交易流驱动）和 R_nonQ 成分（正交残差，与宏观基本面变量相关）。Fama-MacBeth 回归的 $b_1$ 时间序列均值为 0.41（t = 46.83），说明投机者净买入压力与同期价格正相关。</p>\n<p>3. <strong>短周期动量检验</strong>：估计 $R_{i,t+1} = c_0 + c_1 R\\_nonQ_{i,t} + c_2 Q_{i,t} + \\text{Controls} + u_{i,t+1}$。发现 Q 显著负向预测下周收益（反转），R_nonQ 显著正向预测下周收益（动量）。一个标准差 R_nonQ 增加对应下周收益上升 11.6 个基点（年化 6.2%）。</p>\n<p>4. <strong>机制分析</strong>：追踪 R_nonQ 对下周两个成分的影响。发现 R_nonQ 主要正向预测下周的 Q_{t+1}（即投机者在下周追涨），这是动量的核心驱动力——投机者的趋势追逐行为。同时 Q 对 R_nonQ_{t+1} 有显著负向影响（流动性提供者的报价平滑），这是反转的驱动力。</p>\n<p>5. <strong>条件分析</strong>：动量效应在波动率低时更强（投机者更敢于追涨），在拥挤度高时更弱（预期获利空间缩小）。</p>\n<p>6. <strong>与中期动量的连接</strong>：R_nonQ 信号可有效聚合用于传统中期动量策略。用 R_nonQ 替代原始收益排序，6 个月形成期动量收益从年化 5.2% 提升至 9.9%（改善 4.7%）。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>短期动量和反转在同一周度 horizon 共存，颠覆传统&quot;短期反转、中期动量&quot;的分段认知</li>\n<li>R_nonQ 驱动的动量效应：一个标准差增加 → 下周收益 +11.6bp（年化 6.2%），全截面普遍适用</li>\n<li>Q 驱动的反转效应：投机者大量买入的品种下周表现较差</li>\n<li>动量的主要驱动力是投机者的趋势追逐行为（R_nonQ 正向预测下周 Q_{t+1}）</li>\n<li>用 R_nonQ 替代原始收益构建中期动量组合，年化收益从 5.2% 提升至 9.9%</li>\n<li>短期反转本质上应被刻画为&quot;基于交易的反转&quot;而非&quot;基于收益的反转&quot;</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次在商品市场利用 CFTC 持仓数据分离交易流驱动的反转和信息驱动的动量</li>\n<li>证明动量和反转可在同一短周期内共存且独立运作</li>\n<li>将短期动量与中期动量通过 R_nonQ 信号连接起来</li>\n<li>提供投机者趋势追逐行为的直接高频（周度）证据</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>仅覆盖 26 种商品，样本量有限</li>\n<li>CFTC 持仓数据为周度频率，可能遗漏日内的微观结构效应</li>\n<li>非商业交易者的定义包含多种类型的投资者，不一定是纯粹的趋势追逐者</li>\n<li>R_nonQ 的经济含义不够直观，作为交易信号的可操作性需进一步验证</li>\n<li>回测中的交易成本和滑点未详细讨论</li>\n<li>周度频率的策略在实际执行中面临再平衡频率和执行时机的挑战</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>：高，CFTC COT 报告为公开数据，商品期货价格数据广泛可得</li>\n<li><strong>方法清晰度</strong>：高，回归方程和构造方法描述详细，可照着实现</li>\n<li><strong>计算成本</strong>：低，主要是截面回归和 Fama-MacBeth 回归，无重型计算</li>\n<li><strong>综合评分</strong>: ★4.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>强烈建议复现。关键步骤：(1) 获取 CFTC COT 周报数据（可通过 CFTC 网站或 Quandl/Refinitiv 获取）；(2) 构建 Q 和 R_nonQ 分解；(3) 运行 Fama-MacBeth 回归验证动量和反转效应；(4) 用 R_nonQ 重新排序构建中期动量组合。注意 COT 数据的报告规则和非商业交易者的分类定义。</p>"}, {"key": "8R785B43", "title": "Measuring Strategy-Decay Risk: Minimum Regime Performance and the Durability of Systematic Investing", "year": "2026", "authors": "Nolan Alexander, Frank Fabozzi", "tags": [], "venue": "", "abstract": "Systematic investment strategies are exposed to a subtle but pervasive vulnerability: the progressive erosion of their effectiveness as market regimes change. Traditional risk measures, designed to capture volatility or drawdowns, overlook this form of structural fragility. This article introduces a quantitative framework for assessing the durability of systematic strategies through minimum regime performance (MRP), defined as the lowest realized risk-adjusted return across distinct historical regimes. MRP serves as a lower bound on a strategy's robustness, capturing how performance deteriorates when underlying relationships weaken or competitive pressures compress alpha. Applied to a broad universe of established factor strategies, the measure reveals a consistent trade-off between efficiency and resilience -- strategies with higher long-term Sharpe ratios do not always exhibit higher MRPs. By translating the persistence of investment efficacy into a measurable quantity, the framework provides investors with a practical diagnostic for identifying and managing strategy-decay risk, a novel dimension of portfolio fragility that complements traditional measures of market and liquidity risk.", "url": "https://arxiv.org/abs/2604.08356v1", "date_added": "2026-06-04", "summarized": true, "rating": "★3.5", "starred": false, "repro": "—", "summary_html": "<h1>Measuring Strategy-Decay Risk: Minimum Regime Performance and the Durability of Systematic Investing</h1>\n<p>&gt; Zotero Key: <code>8R785B43</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Alexander, Nolan; Fabozzi, Frank J.</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: The Journal of Portfolio Management（DOI: 10.3905/jpm.2025.1.807）</li>\n<li><strong>DOI</strong>: 10.3905/jpm.2025.1.807</li>\n<li><strong>链接</strong>: https://arxiv.org/abs/2604.08356v1</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/R8EVSMNX/Alexander和Fabozzi - 2026 - Measuring Strategy-Decay Risk Minimum Regime Performance and the Durability of Systematic Investing.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：缺乏可量化&quot;策略在最坏结构环境下能撑多久&quot;的单一指标</li>\n<li><strong>方法</strong>：提出最小政权绩效（MRP）指标，枚举所有历史政权分割下最差区间的 Sharpe 比率</li>\n<li><strong>结论</strong>：13 个美股因子 MRP 均为负值（仅 Quality +0.06），结构性脆弱普遍存在；高 Sharpe 不等于高 MRP（Debt Issuance SR 1.14 但 MRP 仅 −0.05）</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>量化策略的核心脆弱性不是波动率或回撤，而是<strong>alpha 生成机制本身的失效</strong>——当市场环境切换后，支撑策略的统计规律被套利、拥挤或结构性变化侵蚀。McLean &amp; Pontiff（2016）记录了学术因子发表后大幅衰减的现象，但现有风险指标（波动率、VaR、回撤）均描述<strong>结果分布</strong>，而非<strong>过程有效性的退化</strong>。论文的缺口：缺乏一个可计算、可监控、能量化&quot;策略在最坏结构环境下能撑多久&quot;的单一指标。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: Jensen、Kelly &amp; Pedersen（2023）编制的 13 个美股横截面因子：Accruals、Debt Issuance、Investment、Low Leverage、Low Risk、Momentum、Profit Growth、Profitability、Quality、Seasonality、Short Term Reversal、Size、Value</li>\n<li><strong>频率</strong>: 月度超额收益</li>\n<li><strong>样本区间</strong>: 1980–2023（40 年回溯）</li>\n<li><strong>数据来源</strong>: Jensen-Kelly-Pedersen（2023）因子库（公开）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[因子月度收益序列 x\\n长度 T] --&gt; B[枚举所有可能的分割点\\n每段最短 d 年]\n  B --&gt; C{s 次分割\\n产生 s+1 个政权}\n  C --&gt; D[在每个政权内\\n计算年化 Sharpe 比率]\n  D --&gt; E[取各政权 Sharpe 最小值\\nm_s = min SR_1...SR_s+1]\n  E --&gt; F[在所有合法分割方案中\\n再取最小值]\n  F --&gt; G[MRP_s = min over T of m_s\\n策略衰减风险下界]\n  G --&gt; H[MRP vs 全样本 Sharpe\\n绘制衰减风险前沿]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>输入</strong>：单个策略的月度收益序列 $x$，长度 $T$；设定参数：分割次数 $s$（通常取 1，即两政权）、最小政权窗口 $d$（论文用 2 年）、回溯长度（论文用 40 年）。</p>\n<p>2. <strong>单次分割（$s=1$）的 MRP</strong>：给定分割点 $t_1$，将序列分为 $r_1 = x_{0:t_1-1}$ 和 $r_2 = x_{t_1:T}$，计算两段各自的年化 Sharpe 比率，取最小值：</p>\n<p>   $$m_1(x,\\{t_1\\}) = \\min\\bigl(S(r_1),\\, S(r_2)\\bigr)$$</p>\n<p>   在所有合法分割点（满足 $t_1 \\in [d, T-d]$）上对 $m_1$ 最小化：</p>\n<p>   $$\\text{MRP}_1(x) = \\min_{t_1 \\in [d,\\, T-d]} m_1(x,\\{t_1\\})$$</p>\n<p>3. <strong>广义 $s$ 次分割的 MRP</strong>：分割集合 $\\mathcal{T} = \\{t_1,\\ldots,t_s\\}$ 产生 $s+1$ 段 $\\{r_1,\\ldots,r_{s+1}\\}$：</p>\n<p>   $$m_s(x,\\mathcal{T}) = \\min\\bigl(S(r_1),\\ldots,S(r_{s+1})\\bigr), \\quad \\text{MRP}_s(x) = \\min_{\\mathcal{T}} m_s(x,\\mathcal{T})$$</p>\n<p>   直觉类比：MRP 之于策略有效性，如同<strong>期望尾部损失（ES）</strong>之于收益分布——捕捉最差结构性表现，而非平均。</p>\n<p>4. <strong>偏差特性</strong>：MRP 是全样本 Sharpe 的下偏估计（intentional downward bias），$\\text{MRP}_s \\leq S(x)$ 恒成立，反映了鲁棒性偏好——类似压力测试或最坏情形优化。</p>\n<p>5. <strong>投资组合扩展</strong>：组合收益 $w&#x27;X_t$，组合 MRP 对策略级脆弱性及政权协方差均敏感，可识别衰减风险集中度。</p>\n<p>6. <strong>衰减风险前沿</strong>：在&quot;全样本 Sharpe（横轴）vs MRP（纵轴）&quot;的散点图上，每个因子为一点，形成类似均方差前沿的&quot;效率–韧性权衡面&quot;。前沿右上角为优势策略（高效率 + 高韧性）。</p>\n<h2>核心结论与关键结果</h2>\n<p><strong>13 个因子的全样本 Sharpe 与 MRP 对比（1980–2023，40 年回溯，$d=2$ 年）</strong>：</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>因子</th><th>全样本 SR</th><th>MRP</th><th>最优分割日期</th></tr>\n<tr><td>Debt Issuance</td><td>1.14</td><td>-0.05</td><td>2016-12</td></tr>\n<tr><td>Quality</td><td>0.65</td><td><strong>+0.06</strong>（唯一正值）</td><td>2020-11</td></tr>\n<tr><td>Accruals</td><td>0.74</td><td>-0.09</td><td>2021-09</td></tr>\n<tr><td>Seasonality</td><td>0.70</td><td>-0.22</td><td>2016-06</td></tr>\n<tr><td>Profitability</td><td>0.49</td><td>-0.25</td><td>1984-03</td></tr>\n<tr><td>Value</td><td>0.37</td><td>-0.41</td><td>2022-12</td></tr>\n<tr><td>Low Risk</td><td>0.13</td><td>-0.61</td><td>2022-12</td></tr>\n<tr><td>Investment</td><td>0.45</td><td>-1.01</td><td>2022-12</td></tr>\n<tr><td>Low Leverage</td><td>0.01</td><td>-0.89</td><td>1985-06</td></tr>\n<tr><td>Size</td><td>0.16</td><td>-0.93</td><td>2021-03</td></tr>\n</table></div>\n<p><strong>关键发现</strong>：</p>\n<ul>\n<li>全部 13 个因子的 MRP 均为负值（除 Quality 外），说明结构性脆弱普遍存在</li>\n<li>高 Sharpe ≠ 高 MRP：Debt Issuance SR 最高（1.14）但 MRP 仅 -0.05；Investment SR 居中但 MRP 低至 -1.01</li>\n<li>MRP 与波动率、回撤等指标弱相关，捕捉的是正交的脆弱性维度</li>\n<li>敏感性分析：回溯窗口 10–40 年、最小窗口 $d$ 1–5 年，因子间排名高度稳定，结论不是方法设定的产物</li>\n</ul>\n<h2>创新点</h2>\n<p>1. <strong>策略衰减风险的首个可计算指标</strong>：将&quot;alpha 的结构性消亡&quot;从定性描述转化为单一可监控数字</p>\n<p>2. <strong>衰减风险前沿</strong>：类比均方差前沿，提供效率（Sharpe）vs 韧性（MRP）的二维决策框架</p>\n<p>3. <strong>实时监控工具</strong>：MRP 随新数据连续更新，MRP 轨迹下降是模型疲劳的早期预警信号</p>\n<p>4. <strong>与现有风险指标正交</strong>：弥补波动率和回撤无法捕捉&quot;过程有效性退化&quot;的盲区</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>政权分割的内生性</strong>：MRP 选择&quot;最差分割&quot;而非&quot;最合理分割&quot;，算法最小化的结果可能在经济上并不对应真实的结构断点；附录 B 的敏感性测试一定程度上缓解了此问题</li>\n<li><strong>仅覆盖美股因子</strong>：跨资产类别（商品、FX、期货）的普适性未验证</li>\n<li><strong>样本内无前向预测力</strong>：论文明确指出 MRP 是诊断而非预测工具，无法回答&quot;MRP 低的策略未来会更快衰减吗&quot;</li>\n<li><strong>月度频率</strong>：MRP 基于月度 Sharpe，高频策略或跨期不一致的策略可能需要调整</li>\n<li><strong>仅单因子层面测试</strong>：组合层面 MRP 的实证结果未展示，组合效果仍是理论推演</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: Jensen-Kelly-Pedersen（2023）因子库有公开版本（AQR 数据库 / 论文附录），可直接使用</li>\n<li><strong>方法清晰度</strong>: 公式完整清晰，一次分割的实现极简（枚举所有分割点取最小 Sharpe），多次分割需动态规划</li>\n<li><strong>计算成本</strong>: 极低——纯 Python/NumPy 即可，月度数据枚举不超过几百个分割点</li>\n<li><strong>综合评分</strong>: ★3.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>实现分两步：① 复现单因子 MRP（一次分割），验证 Exhibit 3 的 13 个因子数值；② 绘制衰减风险前沿（Exhibit 4）。最小可行版本约 50 行代码。可扩展方向：将 MRP 应用到期货趋势跟踪策略的不同市场政权（高/低波动、通胀/紧缩周期），验证 MRP 是否在模型调参前提供额外风险诊断维度。</p>"}, {"key": "RZ9SUV7F", "title": "Macro-aware time series forecasting via hierarchical mixed-frequency attention models", "year": "2026", "authors": "Daniel Cunha Oliveira, Kieran Wood, Stefan Zohren…", "tags": [], "venue": "", "abstract": "Deep learning models show promise in financial forecasting, yet their generalization is often undermined by small datasets, noisy signals, and non-stationarity. While meta-learning and related techniques mitigate some of these issues, they typically do not account for a core limitation in macro-financial prediction: the scarcity of distinct macroeconomic regimes that drive asset returns. We introduce HANET (Hierarchical Attention Network), a hybrid LSTM-based architecture that integrates macroeconomic domain knowledge through attention over long-run macro contexts while preserving high-frequency market dynamics. HANET organizes information in a hierarchical mixed-frequency structure, with daily asset-return signals nested within monthly macroeconomic windows, and introduces a Hierarchical Cross-Attention mechanism that reconciles low-frequency macro signals with high-frequency returns without discarding granular daily information. By framing regime selection as attention over macroeconomic contexts, the model adapts to scarce and shifting regimes. Empirically, across 55 liquid futures spanning multiple asset classes, HANET consistently outperforms neural forecasters that ignore macroeconomic information, particularly during turbulent periods, improving risk-adjusted returns and mitigating losses. Ablation studies show that these gains rely on structured macro conditioning rather than naive feature augmentation: an LSTM with the same macro representation performs poorly, and shuffling macro contexts substantially degrades performance. Finally, HANET provides interpretability through attention weights, highlighting which historical regimes are most influential for each forecast and linking macro conditions to portfolio outcomes. These results establish HANET as a systematic approach to integrating macroeconomic information into attention-based deep learning for financial forecasting.", "url": "https://arxiv.org/abs/2606.00624v1", "date_added": "2026-06-05", "summarized": true, "rating": "★4.0", "starred": false, "repro": "待复现", "summary_html": "<h1>Macro-aware time series forecasting via hierarchical mixed-frequency attention models</h1>\n<p>&gt; Zotero Key: <code>RZ9SUV7F</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Oliveira, Daniel Cunha; Wood, Kieran; Zohren, Stefan; Cucuringu, Mihai; Fujita, André</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: arXiv 预印本（arXiv:2606.00624v1）</li>\n<li><strong>DOI</strong>: —</li>\n<li><strong>链接</strong>: https://arxiv.org/abs/2606.00624v1</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/2B3JQLNG/Oliveira 等 - 2026 - Macro-aware time series forecasting via hierarchical mixed-frequency attention models.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：深度学习金融预测受限于宏观政权稀缺，现有方法几乎只用价格序列；直接拼接宏观数据反而严重损害性能（Sharpe 从 1.19 跌至 0.06），如何将低频月度宏观与高频日度数据结构上融合？</li>\n<li><strong>方法</strong>：HANET——分层跨频率注意力机制，PCA 降维 FRED-MD 127 个宏观变量，LSTM 编码器分别处理宏观查询/键和日度价格值，月度粒度计算注意力权重映射到日度网格。</li>\n<li><strong>结论</strong>：在 55 品种期货 2005—2024 年样本外，动量任务夏普达 1.99（LSTM 基准 1.19），首次将深度学习应用于时序 carry 预测任务。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>深度学习在金融预测中受限于小样本、非平稳性与宏观政权稀缺三大问题：过去 20 年仅经历了少数几次明显的宏观政权切换（衰退、通胀周期、金融危机），即便资产宇宙再大，独立的宏观&quot;片段&quot;依然稀少。现有方法（DMN、Momentum Transformer、X-Trend）几乎只用价格/收益序列，宏观信息要么被忽略，要么以&quot;直接拼接&quot;的方式引入，而论文的消融实验证明后者反而严重损害性能（Sharpe 从 1.19 跌至 0.06）。核心缺口：如何将低频月度宏观数据与高频日度交易数据在结构上融合，避免频率错位与信息丢失？</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 55 只流动性期货（商品、债券、货币、股票指数），来自 Pinnacle 数据库；carry 任务中排除债券期货（无法构造完整 carry）</li>\n<li><strong>频率</strong>: 日度收益 + 月度宏观（FRED-MD，127 个变量），使用 point-in-time vintage 规避前视偏差</li>\n<li><strong>样本区间</strong>: 训练集在 2005 年前，样本外测试 2005–2024（约 20 年）</li>\n<li><strong>数据来源</strong>: Pinnacle（期货价格/carry 曲线）+ FRED-MD（美国宏观数据库，St. Louis Fed）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[日度期货价格 + 信号特征\\n55 品种] --&gt; B[动量/Carry 特征构造\\nMACD / TSMom / Carry]\n  M[月度宏观数据 FRED-MD\\n127 变量] --&gt; PCA[PCA 降维\\n训练集拟合，固定载荷]\n  PCA --&gt; QE[查询编码器 LSTM-q\\n当月宏观状态 → 查询向量 q]\n  PCA --&gt; KE[键编码器 LSTM-k\\n历史宏观序列 → 键矩阵 K]\n  B --&gt; VE[值编码器 LSTM-v + 自注意力\\n日度价格窗口 → 值序列 V]\n  QE --&gt; CA[分层跨频率注意力\\n月度粒度计算权重\\n映射到日度网格]\n  KE --&gt; CA\n  VE --&gt; CA\n  CA --&gt; S[宏观加权汇总向量 s_t,i]\n  B --&gt; Fus[融合模块 f_fus\\n拼接 s_t,i + 日度特征]\n  S --&gt; Fus\n  Fus --&gt; Dec[LSTM 解码器]\n  Dec --&gt; W[交易权重 w_t,i = tanh\\n组合收益 w_t * r_t+1]\n  W --&gt; Loss[Sharpe 目标函数\\n端到端训练]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>特征构造</strong>：对每个资产 $i$ 在日度 $t$ 构造两类交易信号作为神经网络输入特征：</p>\n<p>   - MACD：$\\text{MACD}_{t,i}^{(s,\\ell)} = \\text{EMA}^{(s)}(P_{t,i}) - \\text{EMA}^{(\\ell)}(P_{t,i})$（窗口对 (8,96)）</p>\n<p>   - 时序动量（TSMom）：$R_{t,i}^{(k)} = P_{t,i}/P_{t-k,i} - 1$（回看 264 日）</p>\n<p>   - Carry（FX/股指/商品各有不同计算方式，基于期限结构斜率）</p>\n<p>2. <strong>宏观数据预处理</strong>：FRED-MD 127 维月度数据在训练集上拟合 PCA，取前 5 个主成分作为低频宏观向量 $\\kappa_k \\in \\mathbb{R}^{d_\\kappa}$；验证/测试集投影到训练载荷，确保无前视偏差。</p>\n<p>3. <strong>三路编码器（HANET 核心）</strong>：</p>\n<p>   - <strong>查询（Query）编码器</strong>：将当月宏观向量 $\\kappa_{\\mu(t)}$ 通过 LSTM-q + FFN 编码为查询 $q_{\\mu(t)} \\in \\mathbb{R}^{d_\\text{att}}$，代表当前宏观状态</p>\n<p>   - <strong>键（Key）编码器</strong>：将历史宏观序列 $\\{\\kappa_{1:\\mu(t)-1}\\}$ 通过 LSTM-k + FFN 编码为键矩阵 $K \\in \\mathbb{R}^{(\\mu(t)-1) \\times d_\\text{att}}$，代表历史各月宏观环境</p>\n<p>   - <strong>值（Value）编码器</strong>：将日度价格窗口 $\\{z_{t-L:t-1,i}\\}$ 通过 LSTM-v 编码后经自注意力模块精炼，得到高频值序列 $V_{t-L:t-1,i}$</p>\n<p>4. <strong>分层跨频率注意力</strong>：注意力权重在月度层面计算，带可学习温度参数 $\\tau_\\text{att} = \\exp(\\theta_\\text{att})$：</p>\n<p>   $$\\alpha_{\\mu(t),\\tau} = \\frac{\\exp\\!\\left(\\tau_\\text{att} \\cdot \\frac{1}{\\sqrt{d_\\text{att}}} \\langle W_q q_{\\mu(t)}, W_k k_\\tau \\rangle\\right)}{\\sum_{\\ell=1}^{\\mu(t)-1} \\exp\\!\\left(\\tau_\\text{att} \\cdot \\frac{1}{\\sqrt{d_\\text{att}}} \\langle W_q q_{\\mu(t)}, W_k k_\\ell \\rangle\\right)}$$</p>\n<p>   再将月度权重展开到日度网格：$\\tilde{\\alpha}_{t,u} = \\alpha_{\\mu(t),\\mu(u)}$，宏观加权汇总为 $s_{t,i} = f_\\text{att}\\!\\left(\\sum_{u=t-L}^{t-1} \\tilde{\\alpha}_{t,u} W_v v_{u,i}\\right)$。核心思想：低频宏观相似度决定哪些历史&quot;日度信息&quot;被重点提取，保留粒度不丢高频细节。</p>\n<p>5. <strong>解码与输出</strong>：将宏观汇总 $s_{t,i}$ 与当日特征融合后送入 LSTM 解码器，线性头输出分数后经 $\\tanh$ 得到仓位权重 $w_{t,i} \\in (-1,1)$；投资组合收益 $r_{t+1}^\\text{port} = w_t^\\prime r_{t+1}$。</p>\n<p>6. <strong>训练目标</strong>：端到端最大化样本内 Sharpe 比率；波动率目标设为年化 10%（每资产指数加权标准差 60 日窗口缩放）；全品种等权合并。</p>\n<h2>核心结论与关键结果</h2>\n<p><strong>时序动量任务（样本外 2005–2024，年化 10% 波动目标，总收益）</strong>：</p>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>策略</th><th>均值收益</th><th>Sharpe</th><th>Sortino</th><th>最大回撤</th></tr>\n<tr><td>MACD(8,96) 基准</td><td>13.73%</td><td>1.19</td><td>1.61</td><td>-14.16%</td></tr>\n<tr><td>LSTM 基准</td><td>同 MACD</td><td>1.19</td><td>—</td><td>—</td></tr>\n<tr><td>LSTM + 宏观 PCA 拼接</td><td>0.64%</td><td>0.06</td><td>0.07</td><td>-25.82%</td></tr>\n<tr><td><strong>HANET</strong></td><td><strong>22.45%</strong></td><td><strong>1.99</strong></td><td><strong>2.50</strong></td><td><strong>-15.87%</strong></td></tr>\n<tr><td>HANET 打乱宏观时序</td><td>9.41%</td><td>0.81</td><td>0.98</td><td>-16.90%</td></tr>\n</table></div>\n<p><strong>时序 Carry 任务</strong>：HANET Sharpe 0.91 vs LSTM 0.76 vs 经典 Carry 信号 0.62；最大回撤 -17.71% 为全组最优。</p>\n<p><strong>交易成本敏感性（动量任务）</strong>：1 bps 时净 Sharpe 1.60，5 bps 时仅 0.17，10 bps 时转负——策略对高交易成本较脆弱（共 4,622 次双边交易）。</p>\n<p><strong>关键消融结论</strong>：宏观信息的价值高度依赖架构设计——简单拼接反而有害，打乱时序显著损失性能，分层跨频率注意力是核心。</p>\n<h2>创新点</h2>\n<p>1. <strong>混频注意力原语</strong>：首次提出在月度粒度计算注意力权重、再映射至日度网格的分层跨频率注意力机制，解决低/高频数据融合的频率错位问题。</p>\n<p>2. <strong>宏观政权检索框架</strong>：将宏观政权选择形式化为对历史月度宏观序列的注意力检索，无需显式政权标签即可自适应稀少的宏观状态切换。</p>\n<p>3. <strong>首个 TS-Carry 深度学习框架</strong>：据作者所知，首次将时序 carry 任务形式化为深度学习预测问题，并验证 HANET 在 carry 上的普适性。</p>\n<p>4. <strong>可解释性层</strong>：注意力权重 $\\{\\alpha_{\\mu(t),\\tau}\\}$ 直接揭示哪些历史宏观月份对当前预测最具影响，提供模型行为的宏观解释。</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>期货数据专有</strong>：Pinnacle 数据库非公开，复现时需要等效数据源，且 point-in-time FRED-MD vintage 需要专门接口（或合理代替）。</li>\n<li><strong>交易成本脆弱</strong>：超过 5 bps 时策略近乎失效，实盘期货在流动性差时可能超过此阈值。</li>\n<li><strong>仅测试美国宏观</strong>：FRED-MD 为美国数据，对非美资产（日本商品、欧洲货币等）的宏观代理能力未验证。</li>\n<li><strong>PCA 降维信息损失</strong>：仅取前 5 个主成分，可能丢失特定政权信号（如特定行业或区域危机）。</li>\n<li><strong>样本期宏观政权少</strong>：2005–2024 含约 2 次大危机，样本量本就是动机问题，但用于评估仍相对有限。</li>\n<li><strong>无代码发布</strong>：arXiv 预印本，暂无代码，架构细节（LSTM 隐藏层大小、FFN 层数等）需自行设定。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: FRED-MD 公开可下载；Pinnacle 期货数据专有，需寻找等效连续期货序列（如 Quandl/Barchart）</li>\n<li><strong>方法清晰度</strong>: 论文方程完整，公式覆盖所有模块接口，能照着实现；超参数多数有明确说明</li>\n<li><strong>计算成本</strong>: 中等——55 资产 × 20 年日度数据，LSTM + 注意力，单 GPU 可训练，但调优成本不低</li>\n<li><strong>综合评分</strong>: ★4.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>最小可行路径：先用 FRED-MD（可免费下载 vintage 版本）+ 公开连续期货数据（如 Yahoo Finance 部分品种）验证分层注意力核心机制；关键要验证&quot;拼接宏观 vs 分层注意力&quot;消融实验——这是论文最强的核心声明。建议先在 10–20 品种上快速验证 Sharpe 对比后再扩展至 55 品种。需要特别注意 point-in-time 宏观 vintage 的正确对齐，否则存在前视偏差。</p>"}, {"key": "2DQQ63VF", "title": "Machine Learning, Real-time Macroeconomic Risk, and Asset Pricing", "year": "2026", "authors": "Adelphe Ekponon, Aaron Tormeti", "tags": ["Asset Pricing", "Real-time Macroeconomic Risk", "Textual Analysis", "Web-scrapping"], "venue": "", "abstract": "This paper develops a state-dependent asset pricing framework that measures and prices macroeconomic risk in real time by integrating a structural long-run risk model with high-frequency textual information. Our primary methodological contribution is to recover a daily, three-state measure of aggregate consumption risk from quarterly consumption growth by combining macroeconomic fundamentals with Fine-Grained Aspect-Based Sentiment Analysis (FiGAS) of daily news. The resulting framework classifies the economy into bad, neutral, and good states in real time, providing a forward-looking characterization of macroeconomic conditions that captures several episodes of economic distress not identified by quarterly raw consumption data. We derive closed-form expressions for state-dependent long-run, short-run, and total risk premia and evaluate the model using a broad cross-section of U.S. firms. The empirical evidence shows that both long-run and short-run risks are significantly priced in the cross-section of stock returns. More importantly, the market price of long-run risk is positive during periods of economic distress but negative during neutral and good states, rejecting the constant price-of-risk assumption embedded in standard long-run risk models and providing evidence for a state-dependent pricing mechanism in which investors' required compensation for persistent macroeconomic risk evolves over the business cycle. Our results also demonstrate that state-dependent risk factors capture an independent source of priced macroeconomic risk beyond conventional equity risk factors. Although the model performs best during episodes of economic distress, the results more broadly demonstrate that incorporating real-time macroeconomic states substantially improves the measurement and pricing of persistent macroeconomic risk, offering a richer characterization of expected stock returns than conventional recession-based asset-pricing frameworks.", "url": "https://papers.ssrn.com/abstract=6891838", "date_added": "2026-07-10", "summarized": true, "rating": "★2.0", "starred": false, "repro": "—", "summary_html": "<h1>Machine Learning, Real-time Macroeconomic Risk, and Asset Pricing</h1>\n<p>&gt; Zotero Key: <code>2DQQ63VF</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>:Adelphe Ekponon, Aaron Tormeti</li>\n<li><strong>年份</strong>:2026</li>\n<li><strong>出处</strong>:SSRN</li>\n<li><strong>DOI</strong>:—</li>\n<li><strong>链接</strong>:https://papers.ssrn.com/abstract=6891838</li>\n<li><strong>本地 PDF</strong>:<code>~/Developer/Zotero/storage/RRA7VAS9/Ekponon和Tormeti - 2026 - Machine Learning, Real-time Macroeconomic Risk, and Asset Pricing.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>:传统消费基础资产定价模型（如长期风险模型 Bansal-Yaron）依赖季度消费增长数据来推断宏观经济状态（好/中性/坏），但季度数据滞后且平滑，无法实时捕捉衰退拐点和短期压力事件（如 2012–2013 欧债危机、财政悬崖），导致风险溢价的度量和定价存在系统性滞后。</li>\n<li><strong>方法</strong>:用细粒度基于层面的情感分析（FiGAS）对每日财经新闻打分，构造日频文本情感因子，将其与季度消费增长数据融合生成&quot;日频调整消费增长&quot;序列，再用连续时间三状态（好/中性/坏）马尔可夫机制切换模型识别宏观状态，并嵌入 Epstein-Zin 偏好的长期风险资产定价框架，推导出状态依赖的短期/长期/总风险溢价的解析表达式，用 GMM 和 Fama-MacBeth 两阶段回归在 36 只美股上做实证检验。</li>\n<li><strong>结论</strong>:模型能识别出 NBER 未正式认定为衰退的 2012–2013 放缓期；长期风险和短期风险均在横截面上显著被定价，且长期风险的市场价格随宏观状态变号——衰退期为正（$\\lambda^{LR}=0.093$），中性/繁荣期为负（分别 $-0.102$、$-0.064$），拒绝了传统模型&quot;风险价格恒定&quot;的假设；但模型的样本外预测精度弱于简单随机游走基准（Theil&#x27;s U 全部大于 1，繁荣期高达 10.88），预测能力主要体现在衰退期（Theil&#x27;s U=1.29）。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>CAPM 和 CCAPM 等传统资产定价模型难以解释风险溢价的水平和波动，长期风险模型（Bansal and Yaron 2004）虽然理论上将风险分解为短期波动和长期增长路径的持续性变化，但实证中长期风险/宏观状态通常依赖季度消费或产出数据推断为潜变量，只能事后识别衰退起止点（如 NBER 认定滞后数月）。这使得长期风险模型难以做到实时、前瞻性的风险定价。同时，文本挖掘/机器学习方法虽已被用于预测收益或宏观指标（如 Baker et al. 经济政策不确定性指数），但多是简化形式（reduced-form），未被嵌入到结构化资产定价框架中直接决定风险溢价。本文试图把&quot;实时文本情感&quot;和&quot;结构化长期风险定价&quot;两条文献线打通：用高频新闻情感构造日频宏观状态测度，再让该测度直接决定 Epstein-Zin 效用下的定价核（stochastic discount factor），从而推导状态依赖的风险溢价。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>:36 只美股大盘股（如 AAPL、MSFT、XOM、JNJ、GS 等，取自市值前100剔除数据缺失后的样本），S&amp;P 500 作为市场代理</li>\n<li><strong>频率</strong>:日频（股价、净利润代理股息、文本情感）；消费增长为季度数据插值到日频</li>\n<li><strong>样本区间</strong>:2000-01-03 至 2018-12-31（新闻文本样本同区间，含144,457篇文章）</li>\n<li><strong>数据来源</strong>:WRDS（个股净利润、股价）、BEA（季度消费增长）、FRED（3个月国库券无风险利率）、Factiva（通过渥太华大学图书馆代理抓取的财经新闻：Forbes、NYT、WSJ、Washington Post 等7家美国媒体）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[Factiva新闻爬取&lt;br/&gt;Selenium自动化, 7家美国媒体] --&gt; B[文本清洗/结构化&lt;br/&gt;正则提取日期/来源/标题/正文]\n  B --&gt; C[地理过滤&lt;br/&gt;GeoText保留美国相关文章]\n  C --&gt; D[FiGAS细粒度&lt;br/&gt;基于层面情感分析]\n  D --&gt; E[日频情感得分&lt;br/&gt;中位数聚合+线性插值]\n  F[BEA季度消费增长] --&gt; G[日频调整消费增长&lt;br/&gt;c_d = c_q-1 * 1+w_d]\n  E --&gt; G\n  G --&gt; H[Hamilton三状态&lt;br/&gt;马尔可夫机制切换模型]\n  H --&gt; I[识别 Bad/Neutral/Good&lt;br/&gt;状态概率与转移矩阵]\n  I --&gt; J[连续时间Epstein-Zin&lt;br/&gt;定价核 SDF]\n  J --&gt; K[推导状态依赖&lt;br/&gt;短期/长期风险价格]\n  K --&gt; L[逐股票拟合&lt;br/&gt;最小化理论vs经验风险溢价]\n  L --&gt; M[Fama-MacBeth两阶段回归&lt;br/&gt;+GMM结构估计]\n  M --&gt; N[输出: 状态依赖&lt;br/&gt;风险价格 λ^LR, λ^SR]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>新闻数据采集</strong>：用 Python + Selenium 通过大学图书馆 Factiva 门户自动化抓取 Forbes、NYT、WSJ、Washington Post 等7家美国财经媒体的经济类新闻（2000–2018），按地区过滤仅保留美国相关文章，最终得到 144,457 篇、67,384 词的语料库。</p>\n<p>2. <strong>情感打分（FiGAS）</strong>：用 Consoli et al. (2022) 开源的 Fine-Grained Aspect-Based Sentiment Analysis 工具，先用预定义的宏观经济关键词表（如&quot;gdp&quot;、&quot;unemployment rate&quot;、&quot;federal reserve&quot;等约60个词条）作为语义锚点做分词/词性标注/依存分析，再用金融领域专用词典对每个关键词相关句子打 $[-1,1]$ 情感分，逐日取中位数聚合、缺失值线性插值，得到日频情感序列 $\\phi_d\\in[0,1]$（237,769 个值）。</p>\n<p>3. <strong>构造日频调整消费增长</strong>：$c_d = c_{q-1}\\cdot(1+w_d)$，其中 $c_{q-1}$ 为上季度消费增长（当季内保持不变），调整项 $w_d=\\delta\\cdot[1-e^{\\delta(\\phi_d-\\phi_{q-1})k}]$ 将日频情感偏离上季度均值的程度转化为对消费增长的日度扰动（$\\delta=\\pm1$ 视情感高低而定，$k$ 为标定参数）。</p>\n<p>4. <strong>三状态马尔可夫机制切换（Hamilton 方法）</strong>：以调整后日频消费增长 $c_d$ 为输入，估计经济处于 Bad/Neutral/Good 三个状态的转移概率矩阵 $T$、各状态期望增长率（$\\theta_B=-1.30, \\theta_N=1.47, \\theta_G=4.00$）和波动率（$\\sigma_B=3.10,\\sigma_N=0.30,\\sigma_G=2.28$），并算出退出各状态的强度 $\\lambda_\\xi$（坏状态退出最快 $\\lambda_B=3.06$、好状态最持久 $\\lambda_G=0.72$）及各状态的长期概率（$f_B=0.22,f_N=0.37,f_G=0.41$）。</p>\n<p>5. <strong>结构化资产定价</strong>：假设连续时间 Epstein-Zin-Weil 偏好的代表性投资者，定价核演化为 $\\frac{d\\pi_t}{\\pi_t}=-r_{\\xi_t}dt-\\Theta^{SR}_{\\xi_t}dB_t-\\Theta^{LR}_{\\xi_t}dN_{\\xi_t,t}$，其中布朗运动项 $dB_t$ 对应短期风险（连续文本情感冲击），泊松跳跃项 $dN$ 对应状态切换（长期风险）。据此推导个股权益价值的解析表达式，并把风险溢价分解为短期分量 $RP^{SR}=\\Theta^{SR}\\sigma^{SR}$ 和长期分量 $RP^{LR}=\\lambda_\\xi\\Theta^{LR}\\sigma^{LR}$，通过最小化理论溢价与经验溢价的平方误差和（式12）逐股票估计长期风险价格 $\\Theta^{LR}_{\\xi_t}$。</p>\n<p>6. <strong>样本外滚动估计</strong>：用30天固定扩展窗口，训练期 2000-01 至 2010-08，样本外预测期 2010-09 至 2018-12；用 MAE/RMSE/sMAPE、Theil&#x27;s U（对比随机游走基准）评估拟合精度，用预测性回归（式16）和 Ljung-Box 检验残差白噪声性，用 Engle-Granger 协整检验观测与模型隐含溢价的长期关系。</p>\n<p>7. <strong>横截面定价检验</strong>：两阶段 Fama-MacBeth 回归——第一阶段对每只股票做时间序列回归 $RP_{i,t}-r_{f,t}=\\alpha_i+\\beta^{LR}_{i,t}\\Theta^{LR}_t+\\beta^{SR}_{i,t}\\Theta^{SR}_t+e_{i,t}$ 估计因子暴露；第二阶段每期做横截面回归估计风险价格 $\\lambda^{LR},\\lambda^{SR}$，并检验其是否随宏观状态变化。补充用 GMM（欧拉方程矩条件）结构化估计模型参数 $\\{\\gamma,\\psi,\\Delta_B,\\Delta_N,\\Delta_G\\}$，并用 GRS 检验、Hansen-Jagannathan 距离评估整体定价效果。</p>\n<p>8. <strong>输出</strong>：状态依赖的风险溢价估计值、状态依赖的风险价格 $\\lambda^{LR}(\\xi_t)$、$\\lambda^{SR}(\\xi_t)$，以及模型隐含 vs 观测风险溢价的时间序列拟合优度，属于纯学术定价因子研究，未转化为可交易信号。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>日频调整消费增长序列既保留了季度消费增长的长期趋势，又能捕捉 2008–2009 金融危机等衰退期的剧烈短期波动；机制切换模型能识别出 NBER 未正式认定的 2012–2013 放缓（对应欧债危机与美国&quot;财政悬崖&quot;）。</li>\n<li>状态特征：Bad 状态期望消费增长 -1.30%、波动率 3.10（是 Neutral 的10倍以上）；Good 状态期望增长 4.00%、波动率 2.28，均显著高于 Neutral（增长 1.47%、波动率 0.30）——衰退虽短但剧烈，繁荣持久但不完全平静。</li>\n<li>样本外预测精度：Bad 状态 MAE=0.071/RMSE=0.116，Good 状态 RMSE 恶化至 1.046；与随机游走基准比较，Theil&#x27;s U 全部大于1（Bad 1.29、Neutral 5.17、Good 10.88），说明模型在预测精度上并未超越简单基准，仅在衰退期相对最接近。</li>\n<li>横截面定价：长期风险价格 $\\lambda^{LR}$ 在坏状态为 +0.093（显著），中性/好状态分别为 -0.102/-0.064（显著），符号在衰退与非衰退期间反转，拒绝风险价格恒定假设；短期风险价格量级远小于长期风险（-0.0015~+0.0005），且在坏/中性期为负、好状态转正。</li>\n<li>加入 Fama-French 三因子（MKT-RF、SMB、HML）控制后，长期和短期风险价格依然显著，说明该状态依赖定价机制是独立于传统股票风险因子的信息来源。</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次将文本情感数据直接嵌入结构化长期风险资产定价模型的定价核，而非仅作为预测收益的 reduced-form 信号。</li>\n<li>提出三状态（好/中性/坏）而非传统的二状态（扩张/衰退）机制切换，更细粒度地刻画&quot;温和放缓但未达衰退&quot;的经济状态。</li>\n<li>推导了状态依赖的短期/长期风险溢价解析表达式，并实证发现长期风险价格随宏观状态符号反转，直接挑战了长期风险文献中&quot;风险价格恒定&quot;的标准假设。</li>\n<li>用日频文本信息克服了消费数据季度低频的先天限制，实现风险状态的实时更新。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>样本外预测精度弱于naive随机游走基准（Theil&#x27;s U 全部 &gt;1，繁荣期甚至达10.88），作者虽然强调&quot;衰退期相对更准&quot;，但整体预测能力不具说服力，模型的经济价值更多体现在横截面定价解释力而非预测能力。</li>\n<li>新闻数据获取依赖 Factiva（通过大学图书馆代理），属于付费/受限的机构数据源，且论文自建的 Selenium 爬虫和 FiGAS 情感分析流程较为工程复杂，个人/一般机构难以低成本复现完整数据管道。</li>\n<li>样本区间截止 2018 年（受 Factiva 抓取限制），未覆盖近年的通胀冲击、加息周期等重要宏观事件，样本外验证的时效性有限。</li>\n<li>用于估计定价核和风险价格的方法涉及多层嵌套优化（先机制切换估计状态，再逐股票拟合长期风险价格，再做两阶段 Fama-MacBeth），流程复杂、参数多（如式14中的 $\\delta,k$ 标定参数、FiGAS 情感权重），过拟合与参数敏感性风险较高。</li>\n<li>仅用36只大盘股做横截面检验，样本量偏小，行业/风格覆盖有限，结论的横截面代表性存疑。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>:新闻数据依赖 Factiva 付费数据库（需机构订阅），个人/一般量化团队难以获取；WRDS、BEA、FRED 数据部分可得但同样需要机构权限；国内环境（天软等）无法直接对接。</li>\n<li><strong>方法清晰度</strong>:理论模型（Epstein-Zin 定价核、状态依赖风险溢价推导）公式完整，但完整流程涉及自定义文本爬虫、FiGAS 第三方工具链、机制切换估计、GMM/Fama-MacBeth 多阶段回归，工程复杂度高。</li>\n<li><strong>计算成本</strong>:文本采集和情感分析（14万+篇文章的NLP处理）计算量不小；机制切换和结构化GMM估计属于中等计算量，非重型深度学习，但整体管道流程长、环节多。</li>\n<li><strong>综合评分</strong>:★2.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>不建议复现。核心瓶颈在于 Factiva 新闻数据的可得性（受限于机构订阅和大学图书馆代理），且论文本身是学术性资产定价研究（探讨风险价格的状态依赖性），样本外预测效果弱于简单基准，不构成可直接交易的策略或因子信号。若对&quot;文本情感构造宏观状态&quot;这一思路感兴趣，可考虑用国内可得的公开新闻源或研报文本替代 Factiva，仅借鉴其&quot;日频情感 + 季度消费增长融合&quot;的构造思路（式13、14）和三状态机制切换识别宏观 regime 的框架，但不必照搬完整的结构化资产定价推导。</p>"}, {"key": "26ZQKKEQ", "title": "Latent Matters: Learning Deep State-Space Models", "year": "2026", "authors": "Alexej Klushyn, Richard Kurle, Maximilian Soelch…", "tags": [], "venue": "", "abstract": "Deep state-space models (DSSMs) enable temporal predictions by learning the underlying dynamics of observed sequence data. They are often trained by maximising the evidence lower bound. However, as we show, this does not ensure the model actually learns the underlying dynamics. We therefore propose a constrained optimisation framework as a general approach for training DSSMs. Building upon this, we introduce the extended Kalman VAE (EKVAE), which combines amortised variational inference with classic Bayesian filtering/smoothing to model dynamics more accurately than RNN-based DSSMs. Our results show that the constrained optimisation framework significantly improves system identification and prediction accuracy on the example of established state-of-the-art DSSMs. The EKVAE outperforms previous models w.r.t. prediction accuracy, achieves remarkable results in identifying dynamical systems, and can furthermore successfully learn state-space representations where static and dynamic features are disentangled.", "url": "https://arxiv.org/abs/2602.23050v1", "date_added": "2026-05-26", "summarized": true, "rating": "★3.0", "starred": false, "repro": "—", "summary_html": "<h1>Latent Matters: Learning Deep State-Space Models</h1>\n<p>&gt; Zotero Key: <code>26ZQKKEQ</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Alexej Klushyn (TUM), Richard Kurle (TUM/AWS), Maximilian Soelch, Botond Cseke, Patrick van der Smagt (Volkswagen Group / ELTE)</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: NeurIPS 2021 / arXiv:2602.23050</li>\n<li><strong>DOI</strong>: —</li>\n<li><strong>链接</strong>: https://arxiv.org/abs/2602.23050v1</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/3UFSAI6S/Klushyn 等 - 2026 - Latent Matters Learning Deep State-Space Models.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：深度状态空间模型（DSSM）通过最大化序列 ELBO 训练时，高 ELBO 并不保证学到正确的系统动力学</li>\n<li><strong>方法</strong>：约束优化（CO）框架确保先学好重构再学动力学 + 扩展卡尔曼 VAE（EKVAE）用神经线性化替代 RNN 实现贝叶斯滤波/平滑</li>\n<li><strong>结论</strong>：在 pendulum 和 reacher 控制任务上，EKVAE 角度 $R^2=0.992$、角速度 $R^2=0.998$，显著超越已有 DSSM（DKS 角速度 $R^2$ 仅 0.040）</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>DSSM 通常通过最大化序列 ELBO 训练，但高 ELBO 并不保证学到了正确的系统动力学。作者识别出三个原因：（1）ELBO 中 distortion 和 rate 的不同组合可得相同值，优化方向不确定；（2）标准高斯先验导致近似后验过度正则化，甚至产生&quot;破损生成模型&quot;（transition model 未学会处理先验样本）；（3）大多数 DSSM 用 RNN 近似贝叶斯滤波/平滑，限制了动力学建模精度，且 RNN 基转移模型可能导致非马尔可夫状态空间。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: pendulum 摆锤（16×16 像素图像，500 条序列，每条 15 步）、reacher 机械臂（角度数据 + 64×64 RGB 图像，2000 条序列，每条 30 步）</li>\n<li><strong>频率</strong>: 仿真控制步长</li>\n<li><strong>样本区间</strong>: 仿真生成数据（非真实时间序列）</li>\n<li><strong>数据来源</strong>: DeepMind Control Suite</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p><strong>约束优化框架（CO）</strong>：将序列 ELBO 重新表述为约束优化问题的拉格朗日函数：</p>\n<p>$$L(\\theta, \\psi, \\phi; \\lambda) = R(\\psi, \\phi) + \\lambda(D(\\theta, \\phi) - D_0)$$</p>\n<p>其中 $D(\\theta, \\phi)$ 为 distortion（重构损失），$R(\\psi, \\phi)$ 为 rate（压缩项），$D_0$ 为期望重构质量基线。训练分两阶段：初始阶段只优化重构（$\\theta, \\phi$），满足约束 $D \\leq D_0$ 后才开始学习动力学参数（$\\psi$）。$\\lambda$ 通过 REWO 算法自适应更新。</p>\n<p><strong>变分层次先验（VHP）</strong>：用可学习的层次先验 $p_{\\psi_0}(z_1) = \\int p_{\\psi_0}(z_1|\\zeta)p(\\zeta)d\\zeta$ 替代标准高斯，避免过度正则化。</p>\n<p><strong>EKVAE</strong>：用神经线性化替代 RNN，在局部线性转移模型基础上：</p>\n<p>$$p_{\\psi}(z_{t+1}|z_t, u_t) = \\mathcal{N}(z_{t+1} | F_{\\psi}(z_t, u_t)z_t + B_{\\psi}(z_t, u_t)u_t, Q_{\\psi}(z_t, u_t))$$</p>\n<p>其中 $F_{\\psi}$ 等由基础矩阵的加权组合表示，权重由神经网络 $g_{\\psi}(z_t, u_t)$ 输出。辅以线性辅助变量模型 $p_{\\psi}(a_t|z_t) = \\mathcal{N}(a_t|Hz_t, R)$，使后验可通过扩展卡尔曼平滑解析计算。</p>\n<p><strong>解耦表示</strong>：设 $H$ 为矩形单位矩阵，迫使前 $D_a$ 维表示静态特征（位置），剩余维度表示动态特征（速度），可用于无外部奖励的基于模型的强化学习。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>Pendulum（图像）</strong>：VHP-EKVAE (CO) 预测 MSE = $1.99 \\times 10^{-4}$，角度 $R^2=0.992$，角速度 $R^2=0.998$。相比之下 annealing 训练的 DKS 角速度 $R^2$ 仅 0.040。</li>\n<li><strong>Reacher（角度）</strong>：VHP-EKVAE (CO) 四个状态变量 $R^2$ 均 &gt; 0.98，预测 MSE = $2.13 \\times 10^{-5}$。</li>\n<li><strong>Reacher（RGB）</strong>：EKVAE 在 64×64 像素原始图像上仍能识别动力学系统，四个状态 $R^2$ &gt; 0.98。</li>\n<li><strong>CO vs Annealing</strong>：CO 框架对 DKS/DVBS/EKVAE 均带来显著提升；VHP 进一步避免破损生成模型。</li>\n<li><strong>RNN 局限</strong>：KVAE 和 RSSM 的角速度未编码在 $z_t$ 而在 RNN 隐藏状态中（$R^2=0.043$），导致平滑预测失效。</li>\n<li><strong>RL 验证</strong>：EKVAE 的解耦表示可直接编码目标位置/速度并学习 swing-up 和旋转策略，无需外部奖励信号。</li>\n</ul>\n<h2>创新点</h2>\n<p>1. 首次将 VAE 的约束优化视角推广到 DSSM，给出通用的序列 ELBO 拉格朗日形式</p>\n<p>2. 神经线性化替代扩展卡尔曼滤波中的泰勒展开，降低计算成本</p>\n<p>3. 线性时不变辅助变量模型自然实现位置-速度解耦</p>\n<p>4. 系统性地证明了 RNN 基转移模型导致非马尔可夫状态空间</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>仅在简单控制任务（pendulum、reacher）上测试，未涉及真实世界数据尤其是金融时间序列</li>\n<li>约束超参数 $D_0$ 需启发式确定（$D_0 = 0.9 D_{\\max}$），对不同领域的敏感性未知</li>\n<li>线性辅助变量模型在高度非线性的金融观测中可能不够</li>\n<li>局部线性转移假设在金融数据的非平稳、厚尾分布下可能受限</li>\n<li>未提供代码仓库链接，复现难度较高</li>\n<li>无交易成本/实际部署约束考虑</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 仿真数据（DeepMind Control Suite）完全公开可复现</li>\n<li><strong>方法清晰度</strong>: 数学推导详尽（含 30+ 页附录），算法伪代码完整</li>\n<li><strong>计算成本</strong>: 低 — 简单控制任务，单 GPU 即可训练</li>\n<li><strong>综合评分</strong>: ★3.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>CO 框架本身是通用的，理论上可应用于金融 DSSM，但论文未提供金融领域的实验验证。EKVAE 的神经线性化和局部线性转移假设在金融场景需要大幅改造。不建议优先复现——若要用 DSSM 做金融建模，CO 训练框架可参考但 EKVAE 架构对金融数据的适用性存疑。</p>"}, {"key": "DDXN62CM", "title": "Large and Deep Factor Models", "year": "2026", "authors": "Bryan Kelly, Boris Kuznetsov, Semyon Malamud…", "tags": ["Computer Science - Machine Learning", "Quantitative Finance - Statistical Finance", "Computer Science - Computational Engineering, Finance, and Science"], "venue": "", "abstract": "We show that a deep neural network (DNN) trained to construct a stochastic discount factor (SDF) admits a sharp additive decomposition that separates nonlinear characteristic discovery from the pricing rule that aggregates them. The economically relevant component of this decomposition is governed by a new object, the Portfolio Tangent Kernel (PTK), which captures the features learned by the network and induces an explicit linear factor pricing representation for the SDF. In population, the PTK-implied SDF converges to a ridge-regularized version of the true SDF, with the effective strength of regularization determined by the spectral complexity of the PTK. Using U.S. equity data, we show that the PTK representation delivers large and statistically significant performance gains, while its spectral complexity has risen sharply-by roughly a factor of six since the early 2000s-imposing increasingly tight limits on finite-sample pricing performance.", "url": "http://arxiv.org/abs/2402.06635", "date_added": "2026-05-26", "summarized": true, "rating": "★3.5", "starred": false, "repro": "—", "summary_html": "<h1>Large and Deep Factor Models</h1>\n<p>&gt; Zotero Key: <code>DDXN62CM</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 中</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Bryan Kelly, Boris Kuznetsov, Semyon Malamud, Teng Andrea Xu, Yuan Zhang</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: arXiv:2402.06635</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2402.06635</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2402.06635</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/LIEZJBZU/Kelly 等 - 2026 - Large and Deep Factor Models.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：DNN 在资产定价中将特征发现与定价规则联合训练，两者耦合导致经济解释困难且统计低效</li>\n<li><strong>方法</strong>：提出组合切线核（PTK）将 DNN-SDF 做加法分解，将特征发现与定价规则分离，构建封闭形式的大因子模型</li>\n<li><strong>结论</strong>：PTK-SDF 系统性优于原始 DNN-SDF，PTK 谱复杂度在过去二十年提升约 <strong>6 倍</strong>，学习特征因子的谱复杂度比随机特征高一个数量级</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>深度神经网络（DNN）在资产定价中的成功引出了一个基本问题：网络究竟学到了什么？现有框架将特征发现（学什么定价）与定价规则（怎样组合）联合训练，导致两者耦合、经济解释困难、且统计上低效。本文希望将二者分离，揭示 DNN 的可解释结构，并在此基础上建立更高效的 SDF 估计方法。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 美国股票市场个股</li>\n<li><strong>频率</strong>: 月度</li>\n<li><strong>样本区间</strong>: 约 1970s–2020s（覆盖早期 2000 年代以来的时变分析）</li>\n<li><strong>数据来源</strong>: CRSP/Compustat，企业特征（对标 Gu et al. 2020 的 94 个特征）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>核心框架：将 DNN-SDF 做加法分解</p>\n<p>$$M_{t+1} = 1 - \\pi_t&#x27; R_{t+1}$$</p>\n<p>其中 $\\pi_t = \\pi(X_t)$，用梯度下降最小化</p>\n<p>$$L(\\theta) = \\frac{1}{T}\\sum_{t=1}^T \\left(1 - f(X_t;\\theta)&#x27; R_{t+1}\\right)^2 + z\\|\\theta\\|^2$$</p>\n<p><strong>Portfolio Tangent Kernel（PTK）</strong>：对梯度下降训练的网络，SDF 可分解为特征项（由 PTK 决定）加残差模型项。PTK 给出一个封闭形式的大因子模型（LFM）表示：</p>\n<p>$$\\text{PTK-SDF} = \\text{Markowitz portfolio of char-managed factors}$$</p>\n<p>即 DNN 隐层学出的非线性特征，映射为海量特征管理因子的均值-方差最优组合，称为 Large Factor Model（LFM）。</p>\n<p><strong>谱复杂度</strong>：PTK 的谱复杂度（特征值分布的平坦程度）决定有效正则化强度；谱复杂度越高，有限样本估计误差越大，可达夏普比率越受限制。</p>\n<p>三步估计流程：</p>\n<p>1. 用 DNN 学习非线性特征 $\\phi(X_t)$</p>\n<p>2. 用 PTK 构建封闭形式的大因子集合</p>\n<p>3. 用岭回归在大因子集合上求最优组合权重</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>PTK-SDF 系统性优于原始 DNN-SDF，在不同市值分组上均有显著更高的夏普比率和经济显著的 alpha</li>\n<li>PTK 谱复杂度在过去二十年提升约 <strong>6 倍</strong>，这与因子模型样本外表现下降的时期吻合</li>\n<li>尽管涉及数十万个因子，PTK-SDF 的最优定价规则实质上无需额外缩减（&quot;ridgeless&quot;），因为学习特征本身的高谱复杂度已产生强隐式正则化</li>\n<li>PTK-based SDF 与长期消费风险的对齐度显著强于纯 DNN-SDF 和随机特征基准</li>\n<li>学习特征因子的谱复杂度约比随机特征高一个数量级</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次对 DNN-SDF 给出严格的加法分解，将特征发现与定价规则分离</li>\n<li>引入 PTK 概念，将深度网络与高维统计（随机矩阵理论）连接</li>\n<li>用&quot;对齐度&quot;（alignment）和&quot;谱复杂度&quot;（spectral complexity）两个可量化指标解释因子模型的有限样本极限</li>\n<li>打通了大因子模型（LFM）文献与深度学习资产定价文献</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>仅在美国股票市场验证，能否推广到其他资产类别（债券、商品、外汇）未知</li>\n<li>PTK 的封闭形式推导依赖神经切线核（NTK）假设，即网络在极宽/无限宽极限下训练，实际有限宽网络偏离程度不明</li>\n<li>谱复杂度的时变性质意味着不同时期的最优模型深度/宽度可能不同，实际使用中难以事前确定</li>\n<li>计算成本较高：需要训练大型 DNN 再提取 PTK，并对海量因子做矩阵运算</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 美国股票数据（CRSP/Compustat）需付费订阅，国内难以直接复现；若以国内 A 股特征数据替代，原理可复现</li>\n<li><strong>方法清晰度</strong>: 论文公式推导详尽，PTK 构造步骤清晰，但涉及随机矩阵理论的谱分析部分实现复杂</li>\n<li><strong>计算成本</strong>: 训练大型 DNN + 构建数十万因子的协方差矩阵，计算量较大，需 GPU 支持</li>\n<li><strong>综合评分</strong>: ★3.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>核心价值在于 PTK 的理论框架和&quot;特征发现与定价分离&quot;的思路，而非全量复现。最小可行版本：用 IPCA 或已有的深度特征提取器获得特征，再套用 PTK 的大因子组合规则，验证 PTK-SDF 是否优于端到端 DNN-SDF。A 股适配需替换特征集。主要风险：NTK 假设在有限宽网络上的近似质量难以评估。</p>"}, {"key": "J7SVURHQ", "title": "LLM Agents as Static Level-k Players in Behavioural Games", "year": "2026", "authors": "Po Han Teo", "tags": ["Economics - General Economics", "Economics - Theoretical Economics"], "venue": "", "abstract": "Large Language Models (LLMs) are increasingly used as stand-ins in behavioural games. These stand-ins rely on the assumption that the LLM's distribution of choices meaningfully matches how humans play the same game. This study tests that assumption through two games. The first is a p-beauty contest, and the second one is a public goods game. The study first investigates five local-model settings within the same model family. These settings are varied together in a 360-cell factorial, which balances temperature, scale (0.5-32B), quantisation, instruct vs base, and framing. Each cell's distribution is then compared against whole choice distributions in published human data. Each deployment setting, except for quantisation, governs a different aspect of fidelity. Mechanically, while the dispersion of human players can be somewhat recovered through deployment settings, the strategic process behind it cannot. Through the lens of the level-k cognitive theory, we find that LLMs act as static, category-retrieved level-k players, where k is set by the model scale. The models also do not run within-game belief-updating or backward induction throughout multiple-round horizon settings. While human contributions decayed in the public goods game, LLMs stayed flat or rose at every scale. When the horizon test was administered, LLMs were more cooperative under an indefinite horizon compared to a finite one. However, LLMs ignore their relative round position, so no last-round defection was displayed. This implies that LLMs retrieved levels relative to the horizon category rather than working out iteratively from the specific game setting.", "url": "http://arxiv.org/abs/2606.27845", "date_added": "2026-06-29", "summarized": true, "rating": "★2.0", "starred": false, "repro": "—", "summary_html": "<h1>LLM Agents as Static Level-k Players in Behavioural Games</h1>\n<p>&gt; Zotero Key: <code>J7SVURHQ</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 不复现</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Po Han Teo</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: arXiv (Working draft, June 2026)</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2606.27845</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2606.27845</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/WV4S279Z/Teo - 2026 - LLM Agents as Static Level-k Players in Behavioural Games.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：LLM 越来越多地被用作行为博弈实验中的&quot;人类替身&quot;，但其选择分布是否真正匹配人类行为尚不清楚。</li>\n<li><strong>方法</strong>：在 p-Beauty Contest 和公共品博弈两个经典行为博弈中，对 Qwen 2.5 家族（0.5B–32B）进行 360 格因子实验（温度 × 量化 × 对齐 × 框架），用 KS 距离和 Wasserstein 距离衡量分布保真度。</li>\n<li><strong>结论</strong>：LLM 是<strong>静态的、类别检索型 Level-k 玩家</strong>——推理深度由模型规模决定，不随回合信念更新，也不执行反向归纳。没有任何单一部署参数组合能复现人类分布（KS 距离 0.40–0.52），但混合异质配置可将相对离散度从 0.135 提升至人类水平 0.200。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>研究者越来越多地用 LLM 作为行为实验的&quot;合成被试&quot;（Argyle, 2023; Horton, 2023），因为 LLM 更便宜、更快、操作约束更少。但这依赖一个关键假设：LLM 的选择分布能忠实反映人类在同一博弈中的行为。人类行为是 Nash 理性推理和有限理性的混合产物，分布宽度反映了不同推理深度的异质性。然而，已有文献发现 LLM 能力越强越倾向于 Nash 均衡，偏离人类行为（Li &amp; Shirado, 2025; Guzman Piedrahita et al., 2025）。因此，需要理解 LLM 在行为博弈中的决策机制——它是在&quot;计算&quot;推理还是在&quot;检索&quot;类别？</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>：无（行为博弈实验数据）</li>\n<li><strong>频率</strong>：单次博弈 / 10 回合重复博弈</li>\n<li><strong>样本区间</strong>：N/A（模拟实验）</li>\n<li><strong>数据来源</strong>：</li>\n</ul>\n<p>  - 人类基准数据：St. Gallen 公共品博弈数据（Herrmann et al., 2008, n=96/轮）；Nagel (1995) p-Beauty Contest 猜测分布</p>\n<p>  - LLM 数据：Qwen 2.5 家族本地部署（0.5B, 1.5B, 3B, 7B, 14B, 32B），360 格因子实验</p>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[博弈设定输入&lt;br/&gt;p-Beauty Contest / 公共品博弈] --&gt; B[部署参数选择&lt;br/&gt;规模/温度/量化/对齐/框架]\n  B --&gt; C[合成被试初始化&lt;br/&gt;每格 N=30 独立 agent]\n  C --&gt; D[博弈执行&lt;br/&gt;agent 生成选择]\n  D --&gt; E[分布提取&lt;br/&gt;每格 agent 选择形成分布]\n  E --&gt; F[保真度衡量&lt;br/&gt;KS 距离 + Wasserstein 距离]\n  F --&gt; G[与人类基准分布比较]\n  G --&gt; H{策略机制检验}\n  H --&gt;|H1: 推理深度| I[模型规模 vs Level-k 锚点]\n  H --&gt;|H2: 静态博弈| J[回合间贡献轨迹分析]\n  H --&gt;|H3: 检索 vs 计算| K[有限 vs 无限视野操纵]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>博弈设计</strong>：</p>\n<p>   - <strong>p-Beauty Contest</strong>（单次）：玩家从 0–100 中选一个数，最接近全体平均值 2/3 的人获胜。Nash 均衡为 0，人类首猜集中在 33–37（Level-1 到 Level-2 附近）。</p>\n<p>   - <strong>公共品博弈</strong>（10 轮重复）：4 人一组，每人每轮 20 代币，公共池回报系数 0.4。Nash 主导策略为不贡献，但人类首轮贡献约一半禀赋后缓慢衰减。</p>\n<p>2. <strong>因子实验（360 格）</strong>：对 Qwen 2.5 单一模型家族，同时变化 5 个部署参数：</p>\n<p>   - <strong>模型规模</strong>：6 档（0.5B, 1.5B, 3B, 7B, 14B, 32B）</p>\n<p>   - <strong>采样温度</strong>：5 档（0.2, 0.5, 0.7, 1.0, 1.3）</p>\n<p>   - <strong>量化</strong>：2 档（4-bit, 8-bit）</p>\n<p>   - <strong>对齐</strong>：2 档（base, instruction-tuned）</p>\n<p>   - <strong>框架</strong>：3 档（neutral, cooperative, competitive）</p>\n<p>   - 每格运行与人类被试同等规模的合成 agent（公共品博弈 24 组 × 4 人 = 96, Beauty Contest 30 人）。</p>\n<p>3. <strong>保真度衡量</strong>：用两样本 KS 统计量和 Wasserstein 距离衡量每格分布与人类基准的距离。关键指标：Round-1 离散度、开局水平、稳态水平、比例衰减率。</p>\n<p>4. <strong>机制探针</strong>：</p>\n<p>   - <strong>H1（推理深度）</strong>：OLS 回归检验模型规模对各行为坐标的偏效应</p>\n<p>   - <strong>H2（静态博弈）</strong>：检验回合间贡献轨迹是否衰减（人类衰减 -0.91 token/轮）</p>\n<p>   - <strong>H3（检索 vs 计算）</strong>：操纵博弈视野（有限 vs 无限），检验 agent 是否追踪全局类别还是局部回合位置</p>\n<p>   - <strong>反向归纳检验</strong>：显式标明最后一轮，看 agent 是否在末轮背叛</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>H1 确认（推理深度由规模决定）</strong>：在 Beauty Contest 中，0.5B 模型猜在 50 附近（Level-0），1.5B 在 33 附近（Level-1），3B 在 22–33 之间，7B+ 趋向 Nash 均衡 0。在公共品博弈中，32B 模型的条件合作斜率为 0.47–0.70，落在人类 band 0.5–0.7 内。</li>\n<li><strong>H2 确认（静态博弈）</strong>：没有任何部署组合能复现人类的回合间衰减（-0.91 token/轮）。最陡的 LLM 衰减仅 -0.63（3B + competitive framing），多数设置下贡献保持平坦甚至上升。</li>\n<li><strong>H3 确认（类别检索）</strong>：LLM 对全局视野（有限 vs 无限）敏感——32B instruction-tuned 在无限视野下贡献 3.3 token，高于有限视野的 1.8 token——但对局部回合位置不敏感。即使显式标明最后一轮，LLM 也不背叛（无反向归纳）。</li>\n<li><strong>保真度差距</strong>：所有 360 格的 KS 距离在 0.40–0.52 之间，没有任何单一配置接近零（完美匹配）。混合异质配置可将相对离散度从 0.135（单一配置）提升至 0.200（人类水平）。</li>\n<li><strong>对齐效应</strong>（H4）：instruction-tuned 模型开局贡献更高（β = -0.120, p&lt;0.001），但衰减也更大（β = -0.211, p&lt;0.001），更接近 Nash 方向。</li>\n<li><strong>温度效应</strong>（H5）：温度扩大离散度（β = +0.032, p&lt;0.001），但仅在单一模态周围扩散，不能产生多模态分布。</li>\n<li><strong>量化效应</strong>（H6）：固定规模后，量化无系统性效应（|β| ≤ 0.005, p &gt; 0.3）。</li>\n</ul>\n<h2>创新点</h2>\n<p>1. <strong>深度优先设计</strong>：聚焦单一模型家族（Qwen 2.5），控制厂商/训练/对齐的混淆因素，纯粹分离规模效应。</p>\n<p>2. <strong>视野操纵</strong>：首次在 LLM 行为博弈中比较有限 vs 无限视野，区分&quot;类别检索&quot;与&quot;局部计算&quot;。</p>\n<p>3. <strong>策略方法</strong>（Strategy Method）：让 agent 显式陈述对其他玩家的信念并选择最佳响应，使条件合作显式化。</p>\n<p>4. <strong>分布级比较</strong>：不只比较均值/矩，而是比较完整选择分布（KS + Wasserstein），更接近社会科学方法论。</p>\n<p>5. <strong>360 格全因子</strong>：系统分离 5 个部署参数对不同行为坐标的独立效应。</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>单一模型家族</strong>：只用 Qwen 2.5，结论是否推广到闭源前沿模型（GPT-4, Claude）存疑。论文承认更大规模模型（&gt;32B）可能展现反向归纳能力。</li>\n<li><strong>合成 agent 同质性</strong>：每格内 agent 是同一配置的独立采样，缺乏被试间异质性。人类分布的宽度来自不同推理类型的混合，而温度只能在一个模态周围扩散噪声。</li>\n<li><strong>博弈类型有限</strong>：仅测试两个经典博弈，对更复杂的策略互动（如协调博弈、拍卖）未做检验。</li>\n<li><strong>保真度衡量</strong>：KS 距离是全局分布差异的粗粒度指标，可能忽略局部结构匹配。</li>\n<li><strong>Working draft 状态</strong>：尚未经同行评审，统计分析和实验设计可能存在未发现的问题。</li>\n<li><strong>无实际策略/市场应用</strong>：研究聚焦行为经济学博弈理论，与量化投资策略无直接关联。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>：Qwen 2.5 为开源模型，人类基准数据来自已发表论文。完全可复现，但需要本地 GPU 资源运行 360 格模拟。</li>\n<li><strong>方法清晰度</strong>：实验设计详细，因子水平和统计方法明确。策略方法和视野操纵的 prompt 设计在论文中描述清楚。</li>\n<li><strong>计算成本</strong>：360 格 × 每格 30 agent × 多轮博弈，需中等规模本地计算资源（多卡 GPU）。</li>\n<li><strong>综合评分</strong>:★2.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>不建议复现。该论文是行为经济学/博弈论方向的理论研究，核心贡献是理解 LLM 在行为博弈中的决策机制（静态 Level-k 检索），而非提出可交易的策略或因子。对量化投资研究的直接价值有限——它不产生交易信号、不涉及资产定价、不做回测。唯一潜在关联是理解 LLM agent 在市场微观结构博弈中的行为模式，但论文本身未做此类扩展。评分 2.0 反映其学术质量中等（working draft、单一模型家族）但与量化研究的复现价值较低。</p>"}, {"key": "SYZCDEWT", "title": "Is Trend Still Your Friend?: A Microstructural Account of the Demise of Short-Term Trend-Following", "year": "2026", "authors": "Jutta G. Kurth, Zoltan Eisler, Adam Rej…", "tags": ["Quantitative Finance - Trading and Market Microstructure", "Quantitative Finance - Portfolio Management"], "venue": "", "abstract": "Systematic trend following has, on average, been profitable for at least two centuries; yet since approximately 2009, short-term trends have ceased to deliver reliable returns. Using a cross-section of roughly 100 liquid futures contracts spanning 1995-2025, together with an industry-representative CTA proxy, we document the break and characterise its dependence on signal speed and asset class. We evaluate four candidate explanations - capacity constraints, market electronification, a regime change in CTA-versus-order-flow interactions, and a microstructural mechanism - and find that the first three fail on grounds of timing, magnitude, or cross-sectional heterogeneity. Our central empirical finding is that the cross-sectional variable distinguishing degraded from surviving trends is the volatility-normalised tick size: post-2008 trend PnL has collapsed on small-tick contracts across all signal horizons, while remaining essentially intact on large-tick ones. Neither asset class nor liquidity replicates this dichotomy. We interpret this result through a self-fulfilling feedback loop that, in our view, lies at the heart of the trend anomaly itself: trend signals trigger directional trades, whose market impact reinforces the very price moves that generated the signal. Both the profitability and the persistence of trend are sustained by this impact channel, which requires that trend followers can execute aggressively at reasonable cost. We argue that the post-crisis transition to HFT-dominated market making, whose liquidity-withdrawal behaviour in front of predictable directional flow has sharply contrasting consequences for sparse (small-tick) and dense (large-tick) limit order books, has broken this loop on small-tick contracts. On large-tick contracts, residual depth remains sufficient, and the loop continues to operate.", "url": "http://arxiv.org/abs/2607.01550", "date_added": "2026-07-06", "summarized": true, "rating": "★4.0", "starred": false, "repro": "待复现", "summary_html": "<h1>Is Trend Still Your Friend?: A Microstructural Account of the Demise of Short-Term Trend-Following</h1>\n<p>&gt; Zotero Key: <code>SYZCDEWT</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Jutta G. Kurth、Zoltan Eisler、Adam Rej、Jean-Philippe Bouchaud</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: arXiv</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2607.01550</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2607.01550</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/6WVWRWTN/Kurth 等 - 2026 - Is Trend Still Your Friend A Microstructural Account of the Demise of Short-Term Trend-Following.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：为何横截面期货短周期趋势跟随自 2008/09 年后突然失效，且失效程度随资产类别、信号速度而显著不同？</li>\n<li><strong>方法</strong>：以约 100 个流动性期货的日频数据构建多期限波动率目标趋势组合与 CTA 行业代理，逐一检验容量、电子化、订单流和微观结构假说。</li>\n<li><strong>结论</strong>：信号最快的 EWM-5-20 夏普从 1995--2009 年的 0.84 降至 2009--2025 年的 0.12；决定性横截面变量是波动率标准化 tick size，小 tick 合约的趋势 PnL 崩塌而大 tick 合约大致存续。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>趋势跟随长期存在于多类资产，但行业 CTA 指数和快速趋势策略在金融危机后表现显著转弱。仅以拥挤或资产类别解释，无法同时匹配断裂的时间点、快速信号受损更大、以及债券/商品相对存续的事实。本文将趋势视为一个可能自我强化的反馈：趋势信号驱动方向交易，交易冲击强化价格运动，再生成后续趋势信号；问题是这一回路为何在部分期货市场被破坏。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>：约 100 个最流动期货合约，覆盖商品、股票指数、汇率和政府债券/利率四类；另用 SG CTA Index 与 BarclayHedge CTA AUM 校准行业代理。</li>\n<li><strong>频率</strong>：日度结算价、成交量和订单簿/订单流相关数据；部分订单流检验使用日内成交量分段。</li>\n<li><strong>样本区间</strong>：核心横截面为 1995--2025；部分累计 PnL 图延伸至 1950 年。</li>\n<li><strong>数据来源</strong>：论文未完整公开原始期货数据来源；CTA AUM 来自 BarclayHedge，行业指数来自 Société Générale。</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[期货日度价格、成交量&lt;br/&gt;tick size 与订单流] --&gt; B[快慢 EWMA 差分趋势信号]\n  B --&gt; C[慢速波动率标准化与截尾]\n  C --&gt; D[等风险 / 流动性加权组合]\n  D --&gt; E[CTA 行业规模校准]\n  E --&gt; F[按信号速度、资产类别&lt;br/&gt;tick size 分组的 PnL]\n  F --&gt; G[检验容量、电子化、订单流&lt;br/&gt;与微观结构假说]\n  G --&gt; H[趋势失效的横截面解释]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>趋势特征</strong>：对合约 $i$ 在日 $t$ 的收盘价，计算快 EWMA 与慢 EWMA（慢周期为快周期四倍）的差，再以慢速指数加权标准差归一化：</p>\n<p>   $$s_i^{\\tau}(t)=\\frac{\\langle p_i(t-1)\\rangle_{\\tau}-\\langle p_i(t-1)\\rangle_{4\\tau}}{\\langle\\langle \\langle p_i(t-1)\\rangle_{\\tau}-\\langle p_i(t-1)\\rangle_{4\\tau}\\rangle\\rangle_{16\\tau}}.$$</p>\n<p>   取 $\\tau\\in\\{5,10,20,50\\}$ 个交易日，并将信号截断在 $[-2,2]$。</p>\n<p>2. <strong>头寸与组合</strong>：等风险版本用 $\\pi_i^\\tau(t)=s_i^\\tau(t)/\\sigma_i(t)$；行业容量版本再乘以合约流动性占组合流动性的权重 $l_i(t)/L(t)$。其中 $\\sigma_i$ 为过去 $16\\tau$ 日绝对收益的 EWMA，流动性以 250 日 EWMA 的无隐含成交量乘波动率估计。</p>\n<p>3. <strong>CTA 代理校准</strong>：将流动性加权头寸按 CTA 行业 AUM 与约 12% 年化风险缩放，计算每日调仓量占合约成交量的参与率。横截面中位参与率约 0.9%，用以判断容量冲击的数量级。</p>\n<p>4. <strong>失效特征刻画</strong>：比较断裂前后各期限夏普、累计 PnL 以及四类资产的结果；再测试去除一天执行滞后、行业 AUM、流动性改善和订单流相关性是否能解释失效。</p>\n<p>5. <strong>微观结构检验</strong>：将合约按波动率标准化 tick size $\\Psi_i/\\sigma_i$ 分为大小两组，比较各组趋势表现，并以价格冲击及订单簿深度的差异解释 HFT 做市在可预测方向流前撤单后，如何切断小 tick 合约的自我强化回路。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>快速趋势最受冲击：$\\tau=5$ 的夏普由 0.84±0.27 降至 0.12±0.24；$\\tau=50$ 则由 0.70±0.27 降至 0.40±0.26，表明慢趋势相对保留。</li>\n<li>容量解释数量级不足：按约 1% 参与率和约 9% 日换手率的平方根冲击估算，年化夏普拖累约 0.1，远低于从约 0.7 到接近 0 的下降。</li>\n<li>资产类别和流动性分组均不如 $\\Psi_i/\\sigma_i$ 有解释力。2008 年后小 tick 组在各期限的趋势 PnL 普遍坍塌，大 tick 组基本仍能获利；合约内部结果也支持这是连续的微观结构关系而非简单二分。</li>\n<li>失效集中于大幅收益日和高波动日；小幅收益日的趋势 PnL 在 1995--2025 年间几乎不变，意味着问题并非信号整体消失，而是捕捉大行情的能力受损。</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>将“趋势衰减”从资产类别或拥挤叙事推进到可量化的波动率标准化 tick size 横截面变量。</li>\n<li>同时给出容量、电子化、CTA--订单流关系的反证，并把趋势利润和趋势延续统一解释为市场冲击反馈回路。</li>\n<li>用大/小收益日、波动状态和日内成交量分段等分解，进一步约束可能机制。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>微观结构机制主要由一致的横截面证据和经济解释支持，并非直接观察到 CTA 的真实逐笔交易或做市商撤单决策，因果归因仍有空间。</li>\n<li>原始期货、订单簿与无隐含成交量数据的来源和清洗细节未完全公开，完全复刻存在数据门槛。</li>\n<li>以固定 2008/09 断点、按样本中位数分 tick size 的结果，应进一步接受滚动回归、不同断点与不同分组阈值的稳健性检验。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>：中等。日频连续期货可获得；订单簿、逐笔成交及精确 CTA 代理所需数据较难完全公开取得。</li>\n<li><strong>方法清晰度</strong>：高。信号、风险缩放、流动性权重、分组变量和关键窗口均有明确公式或定义。</li>\n<li><strong>计算成本</strong>：中等。日频主检验成本低；日内订单流与冲击分析需较大数据处理资源。</li>\n<li><strong>综合评分</strong>：★4.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>建议先做最小版本：用可得的连续期货日频数据复现 EWM-$\\tau$--$4\\tau$ 信号，比较 2009 年前后夏普，并按最小变动价/实现波动率分组。第二阶段再加入交易成本与流动性代理，检验 tick-size 分组是否优于资产类别和成交额分组；缺少真实订单簿时，不应把机制检验表述为严格因果结论。</p>"}, {"key": "JQR6FB6W", "title": "Industry Rotation Using Market-State Similarity", "year": "2026", "authors": "Valeriy Zakamulin", "tags": ["Industry Rotation", "Active Investing", "Downside Risk", "Industry Returns", "Market-State Similarity", "Quantile Predictability", "Sector Rotation"], "venue": "", "abstract": "This paper studies whether lagged market returns contain useful information about subsequent industry returns and whether this information can be used for active industry rotation. Using monthly Kenneth French industry portfolios, we first show that conventional mean predictability is weak. Quantile predictive regressions, however, reveal that market-to-industry predictability is concentrated mainly in the tails of the conditional return distribution, especially in downside states. Motivated by this evidence, we propose a non-parametric strategy based on market-state similarity. At each portfolio-formation date, the strategy identifies historical months in which the standardized market excess return was closest to its current value, measures subsequent industry performance after those similar states, and goes long industries with positive historical subsequent returns and short industries with negative historical subsequent returns. Out-of-sample simulations show that the active strategy delivers a higher Sharpe ratio, lower volatility, and substantially smaller drawdowns than the passive equal-weighted industry benchmark. The results are robust to industry classification and model-parameter choices.", "url": "https://papers.ssrn.com/abstract=6792618", "date_added": "2026-07-24", "summarized": true, "rating": "★4.5", "starred": false, "repro": "待复现", "summary_html": "<h1>Industry Rotation Using Market-State Similarity</h1>\n<p>&gt; Zotero Key: <code>JQR6FB6W</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>:Valeriy Zakamulin</li>\n<li><strong>年份</strong>:2026</li>\n<li><strong>出处</strong>:SSRN</li>\n<li><strong>DOI</strong>:—</li>\n<li><strong>链接</strong>:https://papers.ssrn.com/abstract=6792618</li>\n<li><strong>本地 PDF</strong>:<code>~/Developer/Zotero/storage/JCY5AIWA/Zakamulin - 2026 - Industry Rotation Using Market-State Similarity.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>:滞后的市场收益是否包含关于后续行业收益的有用信息，传统均值预测回归对此几乎测不出信号，但这不代表信息不存在——问题在于该信息是否集中在收益分布的某些特定部分（尤其是下尾），以及能否把这种信息转化为可执行的行业轮动策略。</li>\n<li><strong>方法</strong>:先用分位数预测回归揭示&quot;滞后市场收益→行业收益&quot;的可预测性主要集中在条件分布的下尾；据此提出一种非参数的&quot;市场状态相似度&quot;策略——在每个调仓日用标准化市场超额收益作为单一状态变量，在历史滚动窗口中找出与当前状态最相似的月份，用这些历史相似月份之后各行业的平均表现来决定当期多空仓位。</li>\n<li><strong>结论</strong>:用 Kenneth French 30 个行业组合做样本外回测（1970–2025），主动策略在所有评估区间的 Sharpe 比率均高于被动等权行业基准（如 1990–2025 从 0.56 升至 0.71，2010–2025 从 0.72 升至 0.83），最大回撤大幅降低（1990–2025 期间从 54.02% 降至 25.62%），改善主要来自风险降低而非更高的平均收益；结果对行业分类粒度（10/12/17/30/38/48 个行业）和模型参数选择均稳健。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>传统 sector-rotation 文献假设不同行业在商业周期的不同阶段应有系统性差异表现，但实证证据混杂，且需要预先设定商业周期分类。行业动量、领先滞后效应文献（如 Moskowitz and Grinblatt 1999、Hou 2007、Hong et al. 2007）证明了行业间存在信息扩散的时间维度，但少有研究反过来问：滞后的市场整体收益是否能预测各行业下一期的收益分布，尤其是下尾风险？普通 OLS 预测回归只能刻画条件均值的响应，如果预测关系主要体现在分布的尾部而非中心，均值回归会低估甚至完全遗漏这种信息。本文先用分位数回归系统检验这一假设，再据此设计一个不依赖商业周期分类、不预设哪些行业该在哪个阶段表现好的主动轮动策略。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>:Kenneth French 行业组合（基线 30 个行业，稳健性检验另用 10/12/17/38/48 个行业分类），以及市场组合超额收益、无风险利率（1个月国库券利率）</li>\n<li><strong>频率</strong>:月度</li>\n<li><strong>样本区间</strong>:1926年7月–2025年12月（全样本）；分位数回归估计区间为1960年1月–2025年12月；策略样本外评估区间为1970/1980/1990/2000/2010年起至2025年12月（滚动窗口需要40年历史数据）</li>\n<li><strong>数据来源</strong>:Kenneth French 在线数据库（Tuck School of Business）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[月度行业组合收益&lt;br/&gt;Kenneth French Library] --&gt; B[分位数预测回归&lt;br/&gt;Q_tau r_i,t 对 r_m,t-1]\n  B --&gt; C[发现:预测力集中在下尾&lt;br/&gt;中位数附近几乎无信息]\n  C --&gt; D[标准化市场超额收益&lt;br/&gt;z_t = 120月滚动z-score]\n  D --&gt; E[相似历史状态搜索&lt;br/&gt;480月滚动窗口,剔除最近36月]\n  E --&gt; F[取距离最小的20%历史月份 S_t]\n  F --&gt; G[计算各行业在S_t后的&lt;br/&gt;历史平均次月收益 mu_hat]\n  G --&gt; H{mu_hat 符号}\n  H --&gt;|大于0| I[做多该行业]\n  H --&gt;|小于等于0| J[做空该行业]\n  I --&gt; K[等权多空组合&lt;br/&gt;月度再平衡]\n  J --&gt; K\n  K --&gt; L[样本外回测&lt;br/&gt;vs 被动等权行业基准]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>输入</strong>：Kenneth French 30 个（及 10/12/17/38/48 个作稳健性检验）价值加权行业组合月度收益，以及市场组合超额收益 $r_{m,t-1}$。</p>\n<p>2. <strong>分位数可预测性诊断</strong>：先估计传统 OLS 预测回归 $r_{i,t}=\\alpha_i+\\beta_i r_{m,t-1}+\\varepsilon_{i,t}$，发现约三分之二行业斜率不显著，另三分之一虽显著但经济幅度很小（0.10–0.15）。再估计条件分位数回归</p>\n<p>   $$Q_\\tau(r_{i,t}\\mid r_{m,t-1})=\\alpha_{\\tau,i}+\\beta_{\\tau,i}r_{m,t-1},\\quad \\tau\\in\\{0.05,0.10,0.25,0.50,0.75,0.90,0.95\\}$$</p>\n<p>   结果显示：对绝大多数行业，斜率在低分位数（下尾）显著为正且较大，在中位数附近趋于零且不显著，部分行业在高分位数（上尾）转为显著负值——即预测力是&quot;尾部现象&quot;而非&quot;中心现象&quot;，且往往伴随条件分布离散度的变化（弱市场后分布更分散、强市场后分布更收窄）。</p>\n<p>3. <strong>状态变量标准化</strong>：定义标准化市场超额收益</p>\n<p>   $$z_t=\\frac{r_{m,t}-\\bar r_{m,t}^{(120)}}{\\hat\\sigma_{m,t}^{(120)}}$$</p>\n<p>   用滚动120个月的均值和标准差把市场收益转换为可跨时期比较的单位（消除波动率regime的影响）。</p>\n<p>4. <strong>相似历史状态搜索</strong>：在长度 $L=480$ 个月（40年）的滚动样本内候选历史日期集合 $\\mathcal{I}_t=\\{t-L+1,\\dots,t-R-1\\}$（剔除最近 $R=36$ 个月，避免退化为短期动量）中，用单变量欧氏距离（绝对差）$d_{t,s}=|z_t-z_s|$ 度量当前状态与历史状态 $s$ 的相似度，选出距离最小的比例 $f=0.20$ 的历史日期集合 $\\mathcal{S}_t$。</p>\n<p>5. <strong>历史类比预测与信号</strong>：对每个行业 $i$ 计算相似历史状态之后的平均次月收益 $\\hat\\mu_{i,t+1}^S=\\frac{1}{K_t}\\sum_{s\\in\\mathcal{S}_t}r_{i,s+1}$，信号取符号：$x_{i,t}=+1$ 若 $\\hat\\mu_{i,t+1}^S&gt;0$，否则 $-1$。</p>\n<p>6. <strong>组合构造</strong>：等权多空组合 $w_{i,t}=x_{i,t}/N$，次月组合收益 $r_{t+1}^A=\\sum_i w_{i,t}r_{i,t+1}$；对照基准为被动等权行业组合 $r_{t+1}^P=\\frac{1}{N}\\sum_i r_{i,t+1}$。</p>\n<p>7. <strong>输出</strong>：策略严格样本外模拟——每个调仓日仅使用截至当日的信息，评估年化收益、年化波动率、Sharpe 比率、最大回撤四项指标。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li>样本外回测（30 个行业，1970–2025）：主动策略 Sharpe 0.53 vs 被动 0.47；1990–2025：0.71 vs 0.56，最大回撤 25.62% vs 54.02%；2010–2025：0.83 vs 0.72，最大回撤 18.60% vs 26.98%。</li>\n<li>改善来源主要是风险降低而非收益提升：多数评估区间被动策略的平均收益甚至略高于主动策略，但主动策略年化波动率稳定在 12–14%（被动 16–17%），最大回撤显著更小。</li>\n<li>行业分类稳健性（1990–2025）：10个行业 Sharpe 从 0.62→0.63，48个行业从 0.57→0.72；行业粒度越细，改善幅度越大。</li>\n<li>参数稳健性：相似比例 $f\\in\\{0.10,0.15,0.20,0.25\\}$、样本窗口 $L\\in\\{30,40,50\\}$ 年、标准化窗口 $\\in\\{36,60,120\\}$ 月、剔除窗口 $R\\in\\{24,36,48\\}$ 月下，主动策略 Sharpe 始终高于被动基准（0.66–0.73 区间），最大回撤始终远低于被动策略的 54%左右水平。</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>把分位数回归揭示的&quot;尾部可预测性&quot;直接转化为非参数化的历史类比交易规则，避免对每个行业每个分位数单独拟合参数化模型（担心过拟合与非线性风险）。</li>\n<li>单一状态变量（标准化市场超额收益）+ 历史相似月份匹配的设计极其简约，不需要预设商业周期分类，也不假设线性关系。</li>\n<li>用滚动窗口使策略能随时间自适应结构性变化，同时天然具有可解释性——&quot;当前状态像过去的哪些时期，这些行业当时表现如何&quot;。</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li>策略本身只利用相似历史状态平均收益的符号（多空各占等权重），并未充分利用分位数回归揭示的幅度信息，可能损失部分可获利空间。</li>\n<li>状态变量仅用市场超额收益一个维度，可能遗漏波动率、估值、宏观变量等其他相关状态信息。</li>\n<li>论文未报告交易成本、换手率分析，行业组合虽流动性较好但月度再平衡的实际可执行性未量化。</li>\n<li>大量稳健性检验（6种参数维度 × 多个取值）存在一定的隐性数据窥探风险，尽管结果方向一致，但未做统计显著性检验（如 Sharpe 比率差异的正式假设检验）。</li>\n<li>样本外评估起点最早为1970年，仍依赖1926年以来的长历史数据构建相似度池，早期数据的行业结构与当代可能差异较大。</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>:数据完全来自 Kenneth French 公开数据库，可直接下载，国内无法直接访问该网站时可考虑用其他公开渠道镜像或用天软等数据源里的美股行业指数近似替代。</li>\n<li><strong>方法清晰度</strong>:论文给出完整的分位数回归设定、状态标准化公式、相似度搜索算法和信号构造公式（式1–9），参数选择（$L=480, R=36, f=0.20$，120月标准化窗口）均明确列出，复现路径非常清晰。</li>\n<li><strong>计算成本</strong>:分位数回归和相似度搜索均为轻量级计算（30个行业×多个分位数的线性回归+滚动窗口距离计算），单机可在数分钟内完成，不需要重型算力。</li>\n<li><strong>综合评分</strong>:★4.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>方法极简单、数据公开且免费、逻辑清晰，是本批论文中最适合优先复现的一篇。建议最小可行版本：先用 Kenneth French 30 行业月度数据复现分位数回归部分（验证尾部可预测性这一核心发现是否在数据中确实存在），再实现相似度搜索与信号构造（式2–9），对照论文 Table 3 的样本外 Sharpe/回撤数字做校验。核心风险点：相似度搜索的滚动窗口起点管理（$L=480$ 月历史+当前月）容易出现前视偏差，需要严格保证每个调仓日只使用该日之前的信息；若想扩展到美股或其他市场，需要自建可比的行业组合数据（策略框架本身与资产类别无关）。</p>"}, {"key": "HB869IX9", "title": "Hierarchical Graph Learning for Calendar Spread Strategies in Commodity Futures Markets", "year": "2026", "authors": "Yoonsik Hong, Diego Klabjan", "tags": ["Quantitative Finance - Trading and Market Microstructure", "Computer Science - Machine Learning", "Quantitative Finance - Portfolio Management", "Computer Science - Computational Engineering, Finance, and Science", "Quantitative Finance - Pricing of Securities"], "venue": "", "abstract": "Commodity futures can be represented hierarchically, with underlying assets at the upper level and individual futures contracts at the lower level. Entities at each level can be connected by edges reflecting inherent correlations, with cross-level edges capturing contract-to-underlying asset connections. Building on our observations of these structures, we propose a hierarchical graph learning approach for calendar spread (CS) strategies in commodity futures markets, addressing two significant gaps in the machine-learning literature: (i) the absence of learning-based methods for CS strategies in futures markets, and (ii) the lack of consideration of maturity-dependent interrelationships across commodity futures. We first establish the efficacy of CS strategies by analytically showing that CS strategies can possess higher risk-adjusted returns, measured by the information ratio, and lower risk, measured by variance and delta, than long-only strategies. We then introduce a method to convert learning-based predictions into CS positions. Next, we develop a hierarchical graph learning method that predicts futures price movements by utilizing the maturity-dependent interrelationships, thereby yielding a CS trading algorithm. Empirical results on commodity futures markets traded on the Chicago Mercantile Exchange Group demonstrate that our method outperforms benchmark models in both prediction and trading performance. We find that maturity-dependent interrelationships across commodity futures are instrumental in prediction and that CS trading based on hierarchical graph learning is effective for statistical arbitrage.", "url": "http://arxiv.org/abs/2606.25811", "date_added": "2026-06-27", "summarized": true, "rating": "★4.0", "starred": false, "repro": "待复现", "summary_html": "<h1>Hierarchical Graph Learning for Calendar Spread Strategies in Commodity Futures Markets</h1>\n<p>&gt; Zotero Key: <code>HB869IX9</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 高</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Yoonsik Hong, Diego Klabjan</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: arXiv:2606.25811</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2606.25811</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2606.25811</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/FVX9IKD6/Hong和Klabjan - 2026 - Hierarchical Graph Learning for Calendar Spread Strategies in Commodity Futures Markets.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：现有 ML 期货研究聚焦单合约方向性交易，缺乏基于学习的日历价差（CS）策略；不同到期月合约间的 TTM 依赖关系被现有图学习方法忽视。</li>\n<li><strong>方法</strong>：层次化图学习（HGL）——双层图结构（上层跨品种相关性、下层品种内相邻到期），通过图提升对齐 TTM、双层卷积捕获高阶关系，预测价格走势并转化为 CS 权重。</li>\n<li><strong>结论</strong>：在 CME 27 个商品期货 2016—2025 年上，预测和交易表现显著优于基准，CS 策略实现统计套利且不承担标的资产方向性风险。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>1. <strong>CS 策略缺乏学习方法</strong>：现有文献中没有基于学习的日历价差（CS）策略——大多数 ML 期货研究聚焦单合约方向性交易，面临标的资产价格风险敞口过大的问题。</p>\n<p>2. <strong>TTM 依赖关系被忽视</strong>：不同到期月的期货合约之间存在经济关联（库存、供需链、替代效应），但现有图学习方法将所有合约关系一视同仁，未区分 TTM 维度。</p>\n<p>3. <strong>理论基础缺失</strong>：CS 策略虽被广泛使用，但缺乏学习方法视角下的理论保证。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: CME Group 商品期货（能源、金属、农产品等），共 27 个底层资产</li>\n<li><strong>频率</strong>: 日频</li>\n<li><strong>样本区间</strong>: 2016-01-04 至 2025-12-31（训练 2016–2015，测试 2016–2025 滚动窗口）</li>\n<li><strong>数据来源</strong>: LSEG Datastream（Wharton Research Data Services），包含每日收盘价、交易量</li>\n</ul>\n<h2>方法 / 模型</h2>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[商品期货日频价格数据] --&gt; B[交易宇宙筛选&lt;br/&gt;流动性+可交易性过滤]\n  B --&gt; C[双层层次图构建]\n  C --&gt; D[上层: 底层资产节点&lt;br/&gt;跨品种相关性边]\n  C --&gt; E[下层: 各合约节点&lt;br/&gt;品种内相邻到期边]\n  D --&gt; F[跨层边: 合约-资产连接]\n  E --&gt; F\n  F --&gt; G[图提升: TTM对齐虚拟合约&lt;br/&gt;不同品种统一到期网格]\n  G --&gt; H[双层卷积函数 f_B]\n  H --&gt; H1[g_kl_UC: 虚拟合约信息聚合]\n  H1 --&gt; H2[g_kl_CC: 跨品种TTM对齐传播]\n  H2 --&gt; H3[g_kl_CU: 下传回合约节点]\n  H3 --&gt; H4[g_kl_UU: 品种内相邻到期传播]\n  H4 --&gt; H5[多层堆叠捕获高阶关系]\n  H5 --&gt; I[预测头 f_H: 输出价格变动预测]\n  I --&gt; J[投影方法: 预测→CS权重向量]\n  J --&gt; K[日历价差交易执行]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>日历价差策略定义</strong>：对每个商品 $c$，CS 权重向量 $\\mathbf{w}_{tc} \\in \\mathbb{R}^{\\hat{n}_{tc}}$ 满足 $\\mathbf{1}^\\top \\mathbf{w}_{tc} = 0$（多空对冲）且 $\\|\\mathbf{w}_{tc}\\|_1 = 1$（单位杠杆）。</p>\n<p>2. <strong>理论保证</strong>（Proposition 1-3）：</p>\n<p>   - CS 策略方差低于多头策略（当合约间相关性超过阈值时）</p>\n<p>   - CS 策略的 delta 敞口低于多头策略</p>\n<p>   - 若多头策略优于非结构化等权策略，则其去中心化 CS 版本信息比率更高</p>\n<p>3. <strong>预测目标</strong>：预测 $Y_{t+2,cd} = \\Phi^{-1}(\\text{cdf}(R_{tcd}^o; \\{R_{t&#x27;cd}^o\\}_{t&#x27; \\in \\mathcal{H}_t}))$，其中 $R_{tcd}^o = R_{tcd} - R_{tc}^*$ 是去品种均值的收益，经概率积分变换映射到标准正态。使用去中心化收益而非原始收益的原因：CS 策略收益 $\\Pi(\\mathbf{w}) = \\sum_{(c,d)} w_{tcd}(R_{tcd} - R_{tc}^*)$，预测 $R_{tcd}^o$ 可直接转化为 CS 策略收益。</p>\n<p>4. <strong>双层层次图构建</strong>：</p>\n<p>   - <strong>上层</strong>：底层资产节点 $C_{t+2}$，边 $E^{CC+}$（正相关）和 $E^{CC-}$（负相关），基于去中心化收益的 Pearson 相关系数</p>\n<p>   - <strong>下层</strong>：合约节点 $\\hat{U}_{t+2}$，边 $E^{UU}$ 连接相邻到期合约（一个更短一个更长的 TTM）</p>\n<p>   - <strong>跨层</strong>：边 $E^{CU}$ 和 $E^{UC}$ 连接合约与底层资产</p>\n<p>5. <strong>图提升（Graph Lifting）</strong>：不同品种的合约到期日不同，通过线性插值构建虚拟合约网格，将各品种对齐到共享的 TTM 网格 $\\{T_j\\}_{j \\in [0:n_{bas}]}$。每个品种生成 $n_{bas}+1$ 个虚拟合约节点。</p>\n<p>6. <strong>双层卷积函数 $f_{kl}^B$</strong>（4 步交替传播）：</p>\n<p>   - <strong>$g_{kl}^{UC}$（提升）</strong>：将合约节点信息通过线性插值提升到虚拟合约节点</p>\n<p>   - <strong>$g_{kl}^{CC}$（跨品种传播）</strong>：在相同 TTM 的虚拟合约间传播跨品种信息（图卷积）</p>\n<p>   - <strong>$g_{kl}^{CU}$（下传）</strong>：将聚合后的虚拟合约信息通过插值传回各合约节点</p>\n<p>   - <strong>$g_{kl}^{UU}$（品种内传播）</strong>：在相邻到期合约间传播信息，使用归一化差值消息（LayerNorm）</p>\n<p>   - 堆叠 $l_{con}$ 层捕获高阶关系</p>\n<p>7. <strong>预测头与训练</strong>：输出 $\\hat{Y}_{t+2,cd} = \\mathbf{W}_H \\mathbf{z}_{tl,cd} + \\mathbf{b}_H$，最小化 MSE。</p>\n<p>8. <strong>预测→CS 权重投影</strong>：给定预测 $\\hat{\\mathbf{Y}}_t$，计算去品种均值 $\\hat{\\mathbf{Y}}_{tc}^o = \\hat{\\mathbf{Y}}_{tcd} - \\hat{\\mathbf{Y}}_{tc}^*$，然后 $\\mathbf{w}_t = \\hat{\\mathbf{Y}}_t^o / \\|\\hat{\\mathbf{Y}}_t^o\\|_1$，自动满足 CS 约束。</p>\n<p>9. <strong>交易执行</strong>：日频预测，$t$ 日收盘训练/预测，$t+1$ 日开盘建仓，$t+2$ 日收盘平仓。无前瞻偏差。</p>\n<h2>核心结论与关键结果</h2>\n<ul>\n<li><strong>HGL 预测最优</strong>：MSE = 1.125511，统计显著优于所有基准（paired t-test $p &lt; 0.05$）</li>\n<li><strong>HGL 交易最优</strong>：</li>\n</ul>\n<p>  - CS 策略 IR = 0.08459，SR = 0.12409</p>\n<p>  - 相比 LO 基准（B1-B4）：IR 高 2 倍以上，波动率低 6 倍以上，MDD 低 15 倍以上</p>\n<p>  - 相比 S&amp;P 500：IR 高 75%，SR 高 113%，相关性近零（-0.01850）</p>\n<p>  - 日均换手率 188%（CS 特性，高频换仓）</p>\n<ul>\n<li><strong>TTM 依赖关系关键</strong>：去除 TTM 依赖的 GNN 基准显著差于 HGL</li>\n<li><strong>消融实验</strong>：去除跨品种关系（A1）或品种内关系（A2）均降低表现，两者均重要</li>\n<li><strong>条件验证</strong>：Proposition 1 和 3 的条件在约 81% 和 99.98% 的交易日满足</li>\n</ul>\n<h2>创新点</h2>\n<p>1. 首次将层次化图学习应用于商品期货日历价差策略</p>\n<p>2. 显式建模 TTM 依赖的跨品种和品种内期货关系</p>\n<p>3. 通过图提升（Graph Lifting）解决不同品种到期日不一致的问题</p>\n<p>4. 提供 CS 策略优于多头策略的理论保证（信息比率、方差、delta）</p>\n<p>5. 提供将学习预测自然转化为 CS 权重的投影方法</p>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>无交易成本</strong>：假设零交易成本和固定保证金比例（100%），实际 CS 策略保证金率 3–12%，高换手率（188%/日）下交易成本影响巨大</li>\n<li><strong>样本内超参选择</strong>：每个测试期单独做超参网格搜索，存在一定程度的数据窥探</li>\n<li><strong>黑箱问题</strong>：深度学习模型捕获的具体经济关系不透明</li>\n<li><strong>合约存续期偏差</strong>：合约有到期日，交易宇宙随时间变化，新生/消亡合约的处理可能引入偏差</li>\n<li><strong>单一市场</strong>：仅 CME 商品期货，未验证其他交易所或资产类别</li>\n<li><strong>IR/SR 数值偏小</strong>：IR 0.08、SR 0.12 在实际交易中可能不够经济（扣除成本后）</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>：需 LSEG Datastream 数据（Wharton 商业数据库），非公开免费数据</li>\n<li><strong>方法清晰度</strong>：架构和算法描述详尽，伪代码和公式完整，消融实验设计合理</li>\n<li><strong>计算成本</strong>：中等——图神经网络训练，10 个滚动窗口 × 多超参配置，约 8,790 个模型训练</li>\n<li><strong>综合评分</strong>: ★4.0</li>\n</ul>\n<h2>复现备注</h2>\n<p>高度值得复现。关键步骤：(1) 获取 CME 商品期货日频数据（可用天软或其他数据源替代 LSEG）；(2) 实现双层层次图构建和 TTM 对齐虚拟合约网格；(3) 实现 4 步交替双层卷积；(4) 实现预测→CS 权重投影。建议先在能源板块（原油、天然气、汽油）子集上验证，再扩展到全品种。需关注实际交易成本对 IR/SR 的侵蚀。</p>"}, {"key": "TSHKLWBJ", "title": "From Index to Equity: Pre-Training Transformers for Stock Return Prediction", "year": "2026", "authors": "Marie Soehl Coolsaet, Roberto Gallardo, Zhen Gao", "tags": ["Computer Science - Machine Learning", "Quantitative Finance - Statistical Finance"], "venue": "", "abstract": "This research aims to leverage machine learning to improve stock price prediction and support informed investment decisions related to buying, selling, and holding assets. Specifically, this work investigates transformer-based models for stock prediction and examines the impact of pre-training strategies on forecasting performance. A transformer model was first pre-trained on the Toronto Stock Exchange Index (TSX) to predict intra-day return direction and subsequently fine-tuned on individual TSX stocks. The model was further adapted for return-value regression tasks. Performance was benchmarked against Long Short-Term Memory (LSTM) and XGBoost models. Pre-training on the market index improved the binary cross-entropy loss for individual stock prediction from 0.69 to 0.64. The fine-tuned transformer regression model achieved lower mean squared error than the benchmark models, although the ensemble and XGBoost models achieved higher average daily returns. In addition, a practical application was developed to deliver real-time stock predictions for trading support. Future work will focus on increasing transformer model capacity, incorporating broader global technical indicators, and filtering out stocks with low predictability.", "url": "http://arxiv.org/abs/2605.23962", "date_added": "2026-06-07", "summarized": true, "rating": "★2.5", "starred": false, "repro": "—", "summary_html": "<h1>From Index to Equity: Pre-Training Transformers for Stock Return Prediction</h1>\n<p>&gt; Zotero Key: <code>TSHKLWBJ</code> ｜ 摘要状态: ✅ ｜ 复现优先级: 低</p>\n<h2>元数据</h2>\n<ul>\n<li><strong>作者</strong>: Marie Soehl Coolsaet, Roberto Gallardo, Zhen Gao (McMaster University / Universidad Veracruzana)</li>\n<li><strong>年份</strong>: 2026</li>\n<li><strong>出处</strong>: arXiv</li>\n<li><strong>DOI</strong>: 10.48550/arXiv.2605.23962</li>\n<li><strong>链接</strong>: http://arxiv.org/abs/2605.23962</li>\n<li><strong>本地 PDF</strong>: <code>~/Developer/Zotero/storage/Q3NIQRVI/Coolsaet 等 - 2026 - From Index to Equity Pre-Training Transformers for Stock Return Prediction.pdf</code></li>\n</ul>\n<h2 class=\"tldr-h\">速览</h2>\n<ul class=\"tldr\">\n<li><strong>问题</strong>：个股预测噪声极大、非平稳，迁移预训练能否用大盘指数的平滑模式解决金融时间序列数据稀缺和噪声问题？</li>\n<li><strong>方法</strong>：将 Transformer 先在 TSX 指数上预训练预测日内涨跌方向，再微调到 1853 只个股，进一步微调回归预测收益值，对比 LSTM/XGBoost/集成模型。</li>\n<li><strong>结论</strong>：预训练使分类交叉熵从 0.694 降至 0.640（预测精度提升），但 XGBoost/集成模型最终收益率更高（0.0059—0.0069 vs Transformer 0.0003），迁移学习对预测精度有帮助但对交易收益帮助有限。</li>\n</ul>\n<h2>研究动机与问题</h2>\n<p>个股预测噪声极大、非平稳，而大盘指数聚合后波动更平滑。作者提出：用 TSX 指数数据预训练 Transformer 学习&quot;聚合层面的模式&quot;，再迁移到个股，能否提升个股预测？核心问题是迁移预训练能否解决金融时间序列数据稀缺和噪声问题。</p>\n<h2>数据与样本</h2>\n<ul>\n<li><strong>品种/资产</strong>: 多伦多证券交易所（TSX）1853 只股票 + TSX 指数</li>\n<li><strong>频率</strong>: 日频（盘中收益方向 + 收益值）</li>\n<li><strong>样本区间</strong>: 1980-03-17 至 2023-07-04（训练 2010–2022，验证 2022，测试 2023 截至 12-01）</li>\n<li><strong>数据来源</strong>: Yahoo Finance API（yfinance）</li>\n</ul>\n<h2>方法 / 模型</h2>\n<p>三步流水线：在指数上预训练分类 → 在个股上微调分类 → 进一步微调回归（预测收益值）。</p>\n<h3>流程图</h3>\n<div class=\"mermaid\">flowchart TD\n  A[TSX 指数数据&lt;br/&gt;1980-2023] --&gt; B[特征工程&lt;br/&gt;15 特征 × 10 日窗口]\n  B --&gt; C[Transformer 编码器&lt;br/&gt;4 层 encoder + pos encoding]\n  C --&gt; D[预训练阶段&lt;br/&gt;二分类: 日内收益 &gt; 0?&lt;br/&gt;Loss: Binary Cross-Entropy]\n  \n  D --&gt; E[迁移: 权重复用]\n  A2[TSX 个股数据&lt;br/&gt;1853 只股票] --&gt; B2[相同特征工程]\n  B2 --&gt; F[Transformer 微调&lt;br/&gt;初始化=预训练权重]\n  F --&gt; G[分类微调&lt;br/&gt;个股涨跌方向]\n  F --&gt; H[回归微调&lt;br/&gt;替换输出层, 预测收益值&lt;br/&gt;Loss: MSE]\n  \n  G --&gt; I[Benchmarks]\n  H --&gt; I\n  I --&gt; J[LSTM: 4层 + 同流程预训练/微调]\n  I --&gt; K[XGBoost: 150 扁平特征]\n  I --&gt; L[Ensemble: 模型预测平均]\n  \n  G --&gt; M[分类结果]\n  H --&gt; N[回归结果: 每日选 top/bottom 5&lt;br/&gt;Long top 5 / Short bottom 5&lt;br/&gt;持有1天]</div>\n<h3>步骤详解</h3>\n<p>1. <strong>特征工程</strong>：每只股票每日计算 15 个特征——日内收益、3 条 EMA（10/12/26 日）、Stochastic %K、ROC、RSI、AccDO、MACD、disparity 5/10、MA 5/10、10 日前收盘价。拼接当前和前 9 天形成 (10, 15) 的序列输入（Transformer/LSTM），XGBoost 展平为 150 维向量。分类目标 = 1（收益 &gt; 0）或 0；回归目标 = 日内收益值。min-max 归一化，异常值裁剪。</p>\n<p>2. <strong>Transformer 架构</strong>：4 个 Transformer encoder block → 3 个全连接层（128/64/32 节点，ReLU）。分类头：Linear + Sigmoid + BCE Loss；回归头：Linear + MSE Loss。对比基准 LSTM：将 encoder block 替换为 4 个 LSTM 层。</p>\n<p>3. <strong>训练流程</strong>：先在 TSX 指数数据上预训练分类模型，用这些权重初始化个股模型。个股微调时，分类任务在个股数据上继续训练；回归任务从分类微调模型出发，替换输出层后训练预测收益值。</p>\n<p>4. <strong>交易模拟</strong>：回归模型预测每只个股日内收益 → 每日按预测值排名 → 买入 top 5、做空 bottom 5 → 持有一日 → 计算平均日收益。</p>\n<p>5. <strong>附加应用</strong>：用 Streamlit 构建了交互式预测界面，集成实时数据获取、特征工程和模型推理。</p>\n<h2>核心结论与关键结果</h2>\n<div class=\"md-table-wrap\"><table class=\"md-table\">\n<tr><th>指标</th><th>Transformer 基线</th><th>Transformer 微调</th><th>LSTM 微调</th><th>XGBoost</th><th>Ensemble</th></tr>\n<tr><td>分类 BCE Loss</td><td>0.6942</td><td><strong>0.6404</strong></td><td>—</td><td>—</td><td>—</td></tr>\n<tr><td>分类测试精度</td><td>0.6667</td><td>0.6572</td><td>0.6660</td><td>0.6272</td><td>0.6594</td></tr>\n<tr><td>分类 F1</td><td>0.0</td><td>0.0523</td><td>0.0072</td><td><strong>0.5675</strong></td><td>0.0451</td></tr>\n<tr><td>回归 MSE</td><td>—</td><td><strong>5.682e-9</strong></td><td>5.683e-9</td><td>9.923e-9</td><td>6.147e-9</td></tr>\n<tr><td>日均收益率</td><td>—</td><td>0.0003</td><td>0.0002</td><td>0.0059</td><td><strong>0.0069</strong></td></tr>\n</table></div>\n<ul>\n<li>预训练有效降低了分类损失（−0.054），验证了迁移学习的价值</li>\n<li>但分类 F1 极低——基线与微调 Transformer 几乎只预测单一类别（precision = 0）</li>\n<li>XGBoost 分类 F1 最高（0.57），且在交易收益率上显著优于深度模型</li>\n<li>&quot;最优 MSE 的模型不是最优交易模型&quot;——因为 Transformer 倾向预测接近零的收益值，导致选股区分度不足</li>\n</ul>\n<h2>创新点</h2>\n<ul>\n<li>首次将&quot;指数预训练 → 个股微调&quot;的 Transformer 迁移学习方法用于股票预测</li>\n<li>同时测试了分类→回归的二次迁移（task transfer）</li>\n<li>Streamlit 应用提供了完整的实时预测原型</li>\n</ul>\n<h2>局限与可质疑处</h2>\n<ul>\n<li><strong>样本问题严重</strong>：基线 Transformer 的 F1 = 0，说明模型坍塌到预测多数类。样本不平衡处理不足（仅用了 class weighting）</li>\n<li><strong>预测值与收益不匹配</strong>：MSE 最优不代表交易最优——这是典型的 predict-then-optimize 断裂</li>\n<li><strong>TSX 流动性低</strong>：多伦多交易所相比美股成交量小，不稳定因素更强。作者也承认在更高流动性市场可能效果更好</li>\n<li><strong>特征仅含技术指标</strong>：无基本面、无宏观变量、无跨资产信息</li>\n<li><strong>无风险控制</strong>：每日 top/bottom 5 的选股策略未考虑组合风险</li>\n<li><strong>窗口短</strong>：仅 10 天序列，不足以捕捉中长期模式</li>\n</ul>\n<h2>可复现性评估</h2>\n<ul>\n<li><strong>数据可得性</strong>: 中等（Yahoo Finance 免费 API，但 1853 只 TSX 股票数据获取工作量大）</li>\n<li><strong>方法清晰度</strong>: 较高，架构和超参数描述完整，特征清单清晰</li>\n<li><strong>计算成本</strong>: 低（4 层 Transformer，单 GPU 可完成）</li>\n<li><strong>综合评分</strong>: ★2.5</li>\n</ul>\n<h2>复现备注</h2>\n<p>方法本身简单直白，但核心发现（F1≈0, 最优 MSE ≠ 最优收益）并不意外。若复现，建议：</p>\n<ul>\n<li>改进类别不平衡处理（如加权采样、focal loss）比换架构重要</li>\n<li>使用 A 股或美股流动性更好的标的，而非 TSX</li>\n<li>优先采用端到端优化（如 TWDLB4P5 的直接优化组合权重），而非 predict-then-optimize 两阶段</li>\n</ul>"}, {"key": "TWDLB4P5", "title": "Financially Guided Deep Portfolio Optimization", "year": "2026", "authors": "Rahul Fernandes, Travis Desell", "tags": ["Computer Science - Machine Learning", "Quantitative Finance - Portfolio Management"], "venue": "", "abstract": "Portfolio optimization in real-world financial
